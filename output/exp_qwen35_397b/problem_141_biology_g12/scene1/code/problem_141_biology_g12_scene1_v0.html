<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基因整合类型对比 - 场景 1</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        /* 细胞外框样式 */
        .scene1-cell-outline {
            fill: none;
            stroke: #333333;
            stroke-width: 2;
            transition: stroke 0.3s, stroke-width 0.3s;
        }
        .scene1-cell-d {
            stroke: #2e7d32;
            stroke-width: 3;
        }
        .scene1-cell-d-highlight {
            stroke: #2e7d32;
            stroke-width: 4;
        }
        .scene1-cell-faded {
            opacity: 0.6;
        }
        /* 染色体样式 */
        .scene1-chromosome {
            stroke-width: 3;
            stroke-linecap: round;
        }
        .scene1-chr-with-s {
            stroke: #000000;
        }
        .scene1-chr-without-s {
            stroke: #888888;
        }
        /* 线粒体样式 */
        .scene1-mitochondria {
            fill: #f9f9f9;
            stroke: #333333;
            stroke-width: 1;
        }
        /* S 基因标记 */
        .scene1-s-arrow {
            fill: #1565c0;
            opacity: 0;
            transition: opacity 0.4s;
        }
        .scene1-s-arrow.visible {
            opacity: 1;
        }
        .scene1-s-dot {
            fill: #c62828;
            opacity: 0;
            transition: opacity 0.4s;
        }
        .scene1-s-dot.visible {
            opacity: 1;
        }
        /* 标签样式 */
        .scene1-label {
            font-size: 16px;
            font-weight: bold;
            fill: #000000;
        }
        .scene1-trait-label {
            font-size: 12px;
            fill: #333333;
            opacity: 0;
            transition: opacity 0.4s;
        }
        .scene1-trait-label.visible {
            opacity: 1;
        }
        .scene1-trait-d {
            fill: #2e7d32;
            font-weight: bold;
        }
        /* 顶部标注 */
        .scene1-top-annotation {
            font-size: 14px;
            fill: #1565c0;
            opacity: 0;
            transition: opacity 0.4s;
        }
        .scene1-top-annotation.visible {
            opacity: 1;
        }
        .scene1-top-annotation-mito {
            fill: #c62828;
        }
        /* 结论文字 */
        .scene1-conclusion {
            font-size: 18px;
            font-weight: bold;
            fill: #2e7d32;
            opacity: 0;
            transition: opacity 0.4s;
        }
        .scene1-conclusion.visible {
            opacity: 1;
        }
        /* 说明文字 */
        .scene1-explanation {
            font-size: 13px;
            fill: #2e7d32;
            opacity: 0;
            transition: opacity 0.4s;
        }
        .scene1-explanation.visible {
            opacity: 1;
        }
        /* 控件按钮 */
        .scene1-btn {
            padding: 8px 16px;
            font-size: 14px;
            border: 2px solid #1565c0;
            background: #ffffff;
            color: #1565c0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .scene1-btn:hover {
            background: #1565c0;
            color: #ffffff;
        }
        .scene1-btn:disabled {
            border-color: #cccccc;
            color: #cccccc;
            cursor: not-allowed;
            background: #f5f5f5;
        }
        .scene1-step-indicator {
            font-size: 14px;
            fill: #333333;
        }
        /* 图例区 */
        .scene1-legend {
            font-size: 11px;
            fill: #555555;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 顶部标注区 -->
            <text id="scene1-annotation-chr" x="400" y="50" text-anchor="middle" class="scene1-top-annotation">↑ 染色体 S 基因整合</text>
            <text id="scene1-annotation-mito" x="400" y="70" text-anchor="middle" class="scene1-top-annotation scene1-top-annotation-mito">● 线粒体 S 基因整合</text>
            <text id="scene1-conclusion" x="400" y="30" text-anchor="middle" class="scene1-conclusion">答案：d</text>

            <!-- 第一行细胞：a, b, c -->
            <!-- 细胞 a -->
            <g id="scene1-group-a">
                <circle id="scene1-cell-a" cx="200" cy="150" r="55" class="scene1-cell-outline"/>
                <text id="scene1-label-a" x="200" y="100" text-anchor="middle" class="scene1-label">a</text>
                <!-- 染色体：两条都有 S 基因 -->
                <line id="scene1-chr-a-l" x1="185" y1="125" x2="185" y2="175" class="scene1-chromosome scene1-chr-with-s"/>
                <line id="scene1-chr-a-r" x1="215" y1="125" x2="215" y2="175" class="scene1-chromosome scene1-chr-with-s"/>
                <!-- S 基因箭头 -->
                <polygon id="scene1-s-chr-a-l" points="185,115 180,125 190,125" class="scene1-s-arrow"/>
                <polygon id="scene1-s-chr-a-r" points="215,115 210,125 220,125" class="scene1-s-arrow"/>
                <!-- 线粒体：有 S 基因 -->
                <circle id="scene1-mito-a" cx="200" cy="200" r="8" class="scene1-mitochondria"/>
                <circle id="scene1-s-mito-a" cx="200" cy="200" r="5" class="scene1-s-dot"/>
                <!-- 特性标签 -->
                <text id="scene1-trait-a" x="200" y="225" text-anchor="middle" class="scene1-trait-label">杂合 + 母系</text>
            </g>

            <!-- 细胞 b -->
            <g id="scene1-group-b">
                <circle id="scene1-cell-b" cx="400" cy="150" r="55" class="scene1-cell-outline"/>
                <text id="scene1-label-b" x="400" y="100" text-anchor="middle" class="scene1-label">b</text>
                <!-- 染色体：左侧有 S 基因 -->
                <line id="scene1-chr-b-l" x1="385" y1="125" x2="385" y2="175" class="scene1-chromosome scene1-chr-with-s"/>
                <line id="scene1-chr-b-r" x1="415" y1="125" x2="415" y2="175" class="scene1-chromosome scene1-chr-without-s"/>
                <!-- S 基因箭头 -->
                <polygon id="scene1-s-chr-b-l" points="385,115 380,125 390,125" class="scene1-s-arrow"/>
                <polygon id="scene1-s-chr-b-r" points="415,115 410,125 420,125" class="scene1-s-arrow scene1-chr-without-s"/>
                <!-- 线粒体：有 S 基因 -->
                <circle id="scene1-mito-b" cx="400" cy="200" r="8" class="scene1-mitochondria"/>
                <circle id="scene1-s-mito-b" cx="400" cy="200" r="5" class="scene1-s-dot"/>
                <!-- 特性标签 -->
                <text id="scene1-trait-b" x="400" y="225" text-anchor="middle" class="scene1-trait-label">杂合 + 母系</text>
            </g>

            <!-- 细胞 c -->
            <g id="scene1-group-c">
                <circle id="scene1-cell-c" cx="600" cy="150" r="55" class="scene1-cell-outline"/>
                <text id="scene1-label-c" x="600" y="100" text-anchor="middle" class="scene1-label">c</text>
                <!-- 染色体：无 S 基因 -->
                <line id="scene1-chr-c-l" x1="585" y1="125" x2="585" y2="175" class="scene1-chromosome scene1-chr-without-s"/>
                <line id="scene1-chr-c-r" x1="615" y1="125" x2="615" y2="175" class="scene1-chromosome scene1-chr-without-s"/>
                <!-- 线粒体：有 S 基因 -->
                <circle id="scene1-mito-c" cx="600" cy="200" r="8" class="scene1-mitochondria"/>
                <circle id="scene1-s-mito-c" cx="600" cy="200" r="5" class="scene1-s-dot"/>
                <!-- 特性标签 -->
                <text id="scene1-trait-c" x="600" y="225" text-anchor="middle" class="scene1-trait-label">仅母系</text>
            </g>

            <!-- 第二行细胞：d, e, f -->
            <!-- 细胞 d（正确答案） -->
            <g id="scene1-group-d">
                <circle id="scene1-cell-d" cx="200" cy="350" r="55" class="scene1-cell-outline scene1-cell-d"/>
                <text id="scene1-label-d" x="200" y="300" text-anchor="middle" class="scene1-label">d</text>
                <!-- 染色体：两条都有 S 基因 -->
                <line id="scene1-chr-d-l" x1="185" y1="325" x2="185" y2="375" class="scene1-chromosome scene1-chr-with-s"/>
                <line id="scene1-chr-d-r" x1="215" y1="325" x2="215" y2="375" class="scene1-chromosome scene1-chr-with-s"/>
                <!-- S 基因箭头 -->
                <polygon id="scene1-s-chr-d-l" points="185,315 180,325 190,325" class="scene1-s-arrow"/>
                <polygon id="scene1-s-chr-d-r" points="215,315 210,325 220,325" class="scene1-s-arrow"/>
                <!-- 线粒体：无 S 基因 -->
                <circle id="scene1-mito-d" cx="200" cy="400" r="8" class="scene1-mitochondria"/>
                <!-- 特性标签 -->
                <text id="scene1-trait-d" x="200" y="425" text-anchor="middle" class="scene1-trait-label scene1-trait-d">纯合 ✓</text>
                <!-- 说明文字 -->
                <text id="scene1-explanation-d" x="270" y="355" class="scene1-explanation">符合长期种植要求</text>
            </g>

            <!-- 细胞 e -->
            <g id="scene1-group-e">
                <circle id="scene1-cell-e" cx="400" cy="350" r="55" class="scene1-cell-outline"/>
                <text id="scene1-label-e" x="400" y="300" text-anchor="middle" class="scene1-label">e</text>
                <!-- 染色体：左侧有 S 基因 -->
                <line id="scene1-chr-e-l" x1="385" y1="325" x2="385" y2="375" class="scene1-chromosome scene1-chr-with-s"/>
                <line id="scene1-chr-e-r" x1="415" y1="325" x2="415" y2="375" class="scene1-chromosome scene1-chr-without-s"/>
                <!-- S 基因箭头 -->
                <polygon id="scene1-s-chr-e-l" points="385,315 380,325 390,325" class="scene1-s-arrow"/>
                <polygon id="scene1-s-chr-e-r" points="415,315 410,325 420,325" class="scene1-s-arrow scene1-chr-without-s"/>
                <!-- 线粒体：无 S 基因 -->
                <circle id="scene1-mito-e" cx="400" cy="400" r="8" class="scene1-mitochondria"/>
                <!-- 特性标签 -->
                <text id="scene1-trait-e" x="400" y="425" text-anchor="middle" class="scene1-trait-label">杂合</text>
            </g>

            <!-- 细胞 f -->
            <g id="scene1-group-f">
                <circle id="scene1-cell-f" cx="600" cy="350" r="55" class="scene1-cell-outline"/>
                <text id="scene1-label-f" x="600" y="300" text-anchor="middle" class="scene1-label">f</text>
                <!-- 染色体：无 S 基因 -->
                <line id="scene1-chr-f-l" x1="585" y1="325" x2="585" y2="375" class="scene1-chromosome scene1-chr-without-s"/>
                <line id="scene1-chr-f-r" x1="615" y1="325" x2="615" y2="375" class="scene1-chromosome scene1-chr-without-s"/>
                <!-- 线粒体：无 S 基因 -->
                <circle id="scene1-mito-f" cx="600" cy="400" r="8" class="scene1-mitochondria"/>
                <!-- 特性标签 -->
                <text id="scene1-trait-f" x="600" y="425" text-anchor="middle" class="scene1-trait-label">无抗性</text>
            </g>

            <!-- 图例区 -->
            <g id="scene1-legend" transform="translate(50, 455)">
                <rect x="0" y="0" width="700" height="35" fill="#f5f5f5" stroke="#dddddd" rx="4"/>
                <text x="10" y="22" class="scene1-legend">注：↑ 表示已整合基因 S 的 2 号染色体 DNA；○ 表示未整合基因 S 的线粒体环状 DNA</text>
            </g>

            <!-- 控件栏 -->
            <g id="scene1-controls" transform="translate(0, 470)">
                <rect x="280" y="0" width="240" height="25" fill="none"/>
                <text id="scene1-step-indicator" x="400" y="18" text-anchor="middle" class="scene1-step-indicator">步骤 1/5</text>
            </g>
        </svg>

        <!-- HTML 按钮控件（叠在 SVG 底部） -->
        <div id="scene1-html-controls" style="position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10;">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现：6 种幼苗类型的基因整合情况对比

        // 状态变量
        let currentStep = 0;
        const totalSteps = 5;

        // DOM 元素引用
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        // 需要逐步显示的元素
        const chrArrows = [
            'scene1-s-chr-a-l', 'scene1-s-chr-a-r',
            'scene1-s-chr-b-l',
            'scene1-s-chr-d-l', 'scene1-s-chr-d-r',
            'scene1-s-chr-e-l'
        ];

        const mitoDots = [
            'scene1-s-mito-a',
            'scene1-s-mito-b',
            'scene1-s-mito-c'
        ];

        const traitLabels = [
            'scene1-trait-a', 'scene1-trait-b', 'scene1-trait-c',
            'scene1-trait-d', 'scene1-trait-e', 'scene1-trait-f'
        ];

        const annotationChr = document.getElementById('scene1-annotation-chr');
        const annotationMito = document.getElementById('scene1-annotation-mito');
        const conclusion = document.getElementById('scene1-conclusion');
        const explanationD = document.getElementById('scene1-explanation-d');
        const cellD = document.getElementById('scene1-cell-d');
        const cellsOther = [
            'scene1-cell-a', 'scene1-cell-b', 'scene1-cell-c',
            'scene1-cell-e', 'scene1-cell-f'
        ];

        // 辅助函数：显示元素
        function show(el) {
            if (el) {
                el.style.display = '';
                el.style.opacity = '1';
                if (el.classList) el.classList.add('visible');
            }
        }

        // 辅助函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
                if (el.classList) el.classList.remove('visible');
            }
        }

        // 辅助函数：获取元素
        function getEl(id) {
            return document.getElementById(id);
        }

        // 更新步骤显示
        function updateStep() {
            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);
            btnNext.textContent = (currentStep === totalSteps - 1) ? '完成' : '下一步 ▶';

            // 重置所有元素状态
            chrArrows.forEach(id => hide(getEl(id)));
            mitoDots.forEach(id => hide(getEl(id)));
            traitLabels.forEach(id => hide(getEl(id)));
            hide(annotationChr);
            hide(annotationMito);
            hide(conclusion);
            hide(explanationD);

            // 重置细胞 d 的高亮和其他细胞的淡化
            cellD.classList.remove('scene1-cell-d-highlight');
            cellsOther.forEach(id => {
                const el = getEl(id);
                if (el) el.classList.remove('scene1-cell-faded');
            });

            // 根据当前步骤显示相应元素
            if (currentStep >= 1) {
                // 步骤 1：显示染色体 S 基因箭头
                show(annotationChr);
                chrArrows.forEach(id => show(getEl(id)));
            }

            if (currentStep >= 2) {
                // 步骤 2：显示线粒体 S 基因红点
                show(annotationMito);
                mitoDots.forEach(id => show(getEl(id)));
            }

            if (currentStep >= 3) {
                // 步骤 3：显示特性标签
                traitLabels.forEach(id => show(getEl(id)));
            }

            if (currentStep >= 4) {
                // 步骤 4：高亮类型 d，显示结论
                cellD.classList.add('scene1-cell-d-highlight');
                cellsOther.forEach(id => {
                    const el = getEl(id);
                    if (el) el.classList.add('scene1-cell-faded');
                });
                show(explanationD);
                show(conclusion);
            }
        }

        // 事件绑定
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStep();
            }
        });

        // 初始化
        updateStep();

    })();
    </script>
</body>
</html>
