<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测交实验：突变体类型判定</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene3-btn { padding: 8px 16px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; background: #1976d2; color: white; }
        .scene3-btn:disabled { background: #bdbdbd; cursor: not-allowed; }
        .scene3-fade-in { animation: scene3FadeIn 0.3s ease-in; }
        @keyframes scene3FadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

            <rect id="scene3-cell-3-1-bg" class="scene3-hidden" x="160" y="300" width="140" height="25" rx="4" fill="#ffffff" stroke="#bdbdbd"/>

            <!-- 表型标题 -->

            <!-- 柱状图背景 -->

            <!-- 柱 1（黑色） -->

            <!-- 柱 2（棕色） -->

            <text id="scene3-bar-brown-label" class="scene3-hidden" x="380" y="430" text-anchor="middle" font-size="12" fill="#333">棕色</text>
            <text id="scene3-bar-brown-ratio" class="scene3-hidden" x="380" y="370" text-anchor="middle" font-size="12" fill="#333">3/8</text>
            
            <!-- 柱 3（黑青色） -->
            <rect id="scene3-bar-cyan" class="scene3-hidden" x="460" y="380" width="60" height="35" fill="#90caf9"/>
            <text id="scene3-bar-cyan-label" class="scene3-hidden" x="490" y="430" text-anchor="middle" font-size="12" fill="#333">黑青色</text>
            <text id="scene3-bar-cyan-ratio" class="scene3-hidden" x="490" y="370" text-anchor="middle" font-size="12" fill="#333">2/8</text>
            
            <!-- 结论框 -->
            <rect id="scene3-conclusion-bg" class="scene3-hidden" x="100" y="350" width="600" height="70" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
            <text id="scene3-conclusion-text" class="scene3-hidden" x="400" y="380" text-anchor="middle" font-size="13" fill="#e65100">
                <tspan x="400" dy="0">表型比例为 黑色:棕色:黑青色 = 3:3:2</tspan>
                <tspan x="400" dy="18">→ 该突变体为突变体甲（Ccc 三体）</tspan>
            </text>
            
            <!-- 步骤指示器 -->
            <text id="scene3-step-indicator" x="400" y="465" text-anchor="middle" font-size="14" fill="#666">步骤 1/5</text>
        </svg>
        
        <div id="scene3-controls">
            <button id="scene3-btn-prev" class="scene3-btn" disabled>◀ 上一步</button>
            <button id="scene3-btn-next" class="scene3-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 3 实现：测交实验的配子组合与后代表型预测
        
        // 状态管理
        let currentState = 0;
        const totalSteps = 5;
        
        // 元素显隐控制函数
        function show(el) {
            if (el) {
                el.style.display = '';
                el.style.opacity = '1';
                el.classList.add('scene3-fade-in');
            }
        }
        
        function hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
                el.classList.remove('scene3-fade-in');
            }
        }
        
        // 获取 SVG 元素
        function getEl(id) {
            return document.getElementById('scene3-' + id);
        }
        
        // 更新步骤显示
        function updateState() {
            const btnPrev = document.getElementById('scene3-btn-prev');
            const btnNext = document.getElementById('scene3-btn-next');
            const stepIndicator = getEl('step-indicator');
            
            // 更新按钮状态
            btnPrev.disabled = (currentState === 0);
            if (currentState === totalSteps - 1) {
                btnNext.textContent = '重新开始';
            } else {
                btnNext.textContent = '下一步 ▶';
            }
            
            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + (currentState + 1) + '/' + totalSteps;
            
            // 根据当前状态显示/隐藏元素
            switch (currentState) {
                case 0:
                    // 初始状态：只显示标题和亲本
                    hide(getEl('arrow-left'));
                    hide(getEl('arrow-right'));
                    hide(getEl('gamete-title-left'));
                    hide(getEl('gamete-title-right'));
                    hide(getEl('gamete-left-1-bg'));
                    hide(getEl('gamete-left-1'));
                    hide(getEl('gamete-left-2-bg'));
                    hide(getEl('gamete-left-2'));
                    hide(getEl('gamete-left-3-bg'));
                    hide(getEl('gamete-left-3'));
                    hide(getEl('gamete-right-1-bg'));
                    hide(getEl('gamete-right-1'));
                    hide(getEl('offspring-title'));
                    hide(getEl('offspring-table-bg'));
                    hide(getEl('cell-1-1-bg'));
                    hide(getEl('cell-1-1'));
                    hide(getEl('cell-1-2-bg'));
                    hide(getEl('cell-1-2'));
                    hide(getEl('cell-1-3-bg'));
                    hide(getEl('cell-1-3'));
                    hide(getEl('cell-2-1-bg'));
                    hide(getEl('cell-2-1'));
                    hide(getEl('cell-2-2-bg'));
                    hide(getEl('cell-2-2'));
                    hide(getEl('cell-2-3-bg'));
                    hide(getEl('cell-2-3'));
                    hide(getEl('cell-3-1-bg'));
                    hide(getEl('cell-3-1'));
                    hide(getEl('cell-3-2-bg'));
                    hide(getEl('cell-3-2'));
                    hide(getEl('cell-3-3-bg'));
                    hide(getEl('cell-3-3'));
                    hide(getEl('phenotype-title'));
                    hide(getEl('phenotype-bg'));
                    hide(getEl('bar-black'));
                    hide(getEl('bar-black-label'));
                    hide(getEl('bar-black-ratio'));
                    hide(getEl('bar-brown'));
                    hide(getEl('bar-brown-label'));
                    hide(getEl('bar-brown-ratio'));
                    hide(getEl('bar-cyan'));
                    hide(getEl('bar-cyan-label'));
                    hide(getEl('bar-cyan-ratio'));
                    hide(getEl('conclusion-bg'));
                    hide(getEl('conclusion-text'));
                    break;
                    
                case 1:
                    // 步骤 1：显示箭头和配子
                    show(getEl('arrow-left'));
                    show(getEl('arrow-right'));
                    show(getEl('gamete-title-left'));
                    show(getEl('gamete-title-right'));
                    show(getEl('gamete-left-1-bg'));
                    show(getEl('gamete-left-1'));
                    show(getEl('gamete-left-2-bg'));
                    show(getEl('gamete-left-2'));
                    show(getEl('gamete-left-3-bg'));
                    show(getEl('gamete-left-3'));
                    show(getEl('gamete-right-1-bg'));
                    show(getEl('gamete-right-1'));
                    // 隐藏后代和表型
                    hide(getEl('offspring-title'));
                    hide(getEl('offspring-table-bg'));
                    hide(getEl('cell-1-1-bg'));
                    hide(getEl('cell-1-1'));
                    hide(getEl('cell-1-2-bg'));
                    hide(getEl('cell-1-2'));
                    hide(getEl('cell-1-3-bg'));
                    hide(getEl('cell-1-3'));
                    hide(getEl('cell-2-1-bg'));
                    hide(getEl('cell-2-1'));
                    hide(getEl('cell-2-2-bg'));
                    hide(getEl('cell-2-2'));
                    hide(getEl('cell-2-3-bg'));
                    hide(getEl('cell-2-3'));
                    hide(getEl('cell-3-1-bg'));
                    hide(getEl('cell-3-1'));
                    hide(getEl('cell-3-2-bg'));
                    hide(getEl('cell-3-2'));
                    hide(getEl('cell-3-3-bg'));
                    hide(getEl('cell-3-3'));
                    hide(getEl('phenotype-title'));
                    hide(getEl('phenotype-bg'));
                    hide(getEl('bar-black'));
                    hide(getEl('bar-black-label'));
                    hide(getEl('bar-black-ratio'));
                    hide(getEl('bar-brown'));
                    hide(getEl('bar-brown-label'));
                    hide(getEl('bar-brown-ratio'));
                    hide(getEl('bar-cyan'));
                    hide(getEl('bar-cyan-label'));
                    hide(getEl('bar-cyan-ratio'));
                    hide(getEl('conclusion-bg'));
                    hide(getEl('conclusion-text'));
                    break;
                    
                case 2:
                    // 步骤 2：显示后代基因型表格
                    show(getEl('arrow-left'));
                    show(getEl('arrow-right'));
                    show(getEl('gamete-title-left'));
                    show(getEl('gamete-title-right'));
                    show(getEl('gamete-left-1-bg'));
                    show(getEl('gamete-left-1'));
                    show(getEl('gamete-left-2-bg'));
                    show(getEl('gamete-left-2'));
                    show(getEl('gamete-left-3-bg'));
                    show(getEl('gamete-left-3'));
                    show(getEl('gamete-right-1-bg'));
                    show(getEl('gamete-right-1'));
                    show(getEl('offspring-title'));
                    show(getEl('offspring-table-bg'));
                    show(getEl('cell-1-1-bg'));
                    show(getEl('cell-1-1'));
                    show(getEl('cell-1-2-bg'));
                    show(getEl('cell-1-2'));
                    show(getEl('cell-1-3-bg'));
                    show(getEl('cell-1-3'));
                    show(getEl('cell-2-1-bg'));
                    show(getEl('cell-2-1'));
                    show(getEl('cell-2-2-bg'));
                    show(getEl('cell-2-2'));
                    show(getEl('cell-2-3-bg'));
                    show(getEl('cell-2-3'));
                    show(getEl('cell-3-1-bg'));
                    show(getEl('cell-3-1'));
                    show(getEl('cell-3-2-bg'));
                    show(getEl('cell-3-2'));
                    show(getEl('cell-3-3-bg'));
                    show(getEl('cell-3-3'));
                    // 隐藏表型
                    hide(getEl('phenotype-title'));
                    hide(getEl('phenotype-bg'));
                    hide(getEl('bar-black'));
                    hide(getEl('bar-black-label'));
                    hide(getEl('bar-black-ratio'));
                    hide(getEl('bar-brown'));
                    hide(getEl('bar-brown-label'));
                    hide(getEl('bar-brown-ratio'));
                    hide(getEl('bar-cyan'));
                    hide(getEl('bar-cyan-label'));
                    hide(getEl('bar-cyan-ratio'));
                    hide(getEl('conclusion-bg'));
                    hide(getEl('conclusion-text'));
                    break;
                    
                case 3:
                    // 步骤 3：显示表型比例
                    show(getEl('arrow-left'));
                    show(getEl('arrow-right'));
                    show(getEl('gamete-title-left'));
                    show(getEl('gamete-title-right'));
                    show(getEl('gamete-left-1-bg'));
                    show(getEl('gamete-left-1'));
                    show(getEl('gamete-left-2-bg'));
                    show(getEl('gamete-left-2'));
                    show(getEl('gamete-left-3-bg'));
                    show(getEl('gamete-left-3'));
                    show(getEl('gamete-right-1-bg'));
                    show(getEl('gamete-right-1'));
                    show(getEl('offspring-title'));
                    show(getEl('offspring-table-bg'));
                    show(getEl('cell-1-1-bg'));
                    show(getEl('cell-1-1'));
                    show(getEl('cell-1-2-bg'));
                    show(getEl('cell-1-2'));
                    show(getEl('cell-1-3-bg'));
                    show(getEl('cell-1-3'));
                    show(getEl('cell-2-1-bg'));
                    show(getEl('cell-2-1'));
                    show(getEl('cell-2-2-bg'));
                    show(getEl('cell-2-2'));
                    show(getEl('cell-2-3-bg'));
                    show(getEl('cell-2-3'));
                    show(getEl('cell-3-1-bg'));
                    show(getEl('cell-3-1'));
                    show(getEl('cell-3-2-bg'));
                    show(getEl('cell-3-2'));
                    show(getEl('cell-3-3-bg'));
                    show(getEl('cell-3-3'));
                    show(getEl('phenotype-title'));
                    show(getEl('phenotype-bg'));
                    show(getEl('bar-black'));
                    show(getEl('bar-black-label'));
                    show(getEl('bar-black-ratio'));
                    show(getEl('bar-brown'));
                    show(getEl('bar-brown-label'));
                    show(getEl('bar-brown-ratio'));
                    show(getEl('bar-cyan'));
                    show(getEl('bar-cyan-label'));
                    show(getEl('bar-cyan-ratio'));
                    // 隐藏结论
                    hide(getEl('conclusion-bg'));
                    hide(getEl('conclusion-text'));
                    break;
                    
                case 4:
                    // 步骤 4：显示结论
                    show(getEl('arrow-left'));
                    show(getEl('arrow-right'));
                    show(getEl('gamete-title-left'));
                    show(getEl('gamete-title-right'));
                    show(getEl('gamete-left-1-bg'));
                    show(getEl('gamete-left-1'));
                    show(getEl('gamete-left-2-bg'));
                    show(getEl('gamete-left-2'));
                    show(getEl('gamete-left-3-bg'));
                    show(getEl('gamete-left-3'));
                    show(getEl('gamete-right-1-bg'));
                    show(getEl('gamete-right-1'));
                    show(getEl('offspring-title'));
                    show(getEl('offspring-table-bg'));
                    show(getEl('cell-1-1-bg'));
                    show(getEl('cell-1-1'));
                    show(getEl('cell-1-2-bg'));
                    show(getEl('cell-1-2'));
                    show(getEl('cell-1-3-bg'));
                    show(getEl('cell-1-3'));
                    show(getEl('cell-2-1-bg'));
                    show(getEl('cell-2-1'));
                    show(getEl('cell-2-2-bg'));
                    show(getEl('cell-2-2'));
                    show(getEl('cell-2-3-bg'));
                    show(getEl('cell-2-3'));
                    show(getEl('cell-3-1-bg'));
                    show(getEl('cell-3-1'));
                    show(getEl('cell-3-2-bg'));
                    show(getEl('cell-3-2'));
                    show(getEl('cell-3-3-bg'));
                    show(getEl('cell-3-3'));
                    show(getEl('phenotype-title'));
                    show(getEl('phenotype-bg'));
                    show(getEl('bar-black'));
                    show(getEl('bar-black-label'));
                    show(getEl('bar-black-ratio'));
                    show(getEl('bar-brown'));
                    show(getEl('bar-brown-label'));
                    show(getEl('bar-brown-ratio'));
                    show(getEl('bar-cyan'));
                    show(getEl('bar-cyan-label'));
                    show(getEl('bar-cyan-ratio'));
                    show(getEl('conclusion-bg'));
                    show(getEl('conclusion-text'));
                    break;
            }
        }
        
        // 按钮事件绑定
        document.getElementById('scene3-btn-prev').addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                updateState();
            }
        });
        
        document.getElementById('scene3-btn-next').addEventListener('click', function() {
            if (currentState < totalSteps - 1) {
                currentState++;
                updateState();
            } else {
                // 重新开始
                currentState = 0;
                updateState();
            }
        });
        
        // 初始化
        updateState();
        
    })();
    </script>
</body>
</html>
