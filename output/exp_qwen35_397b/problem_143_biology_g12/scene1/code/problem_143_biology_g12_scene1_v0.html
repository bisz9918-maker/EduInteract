<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食物网结构与营养级关系</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-btn-prev, #scene1-btn-next { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f0f0f0; }
        #scene1-btn-prev:hover, #scene1-btn-next:hover { background: #e0e0e0; }
        #scene1-btn-prev:disabled, #scene1-btn-next:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #333; min-width: 80px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 箭头标记：蓝色普通箭头 -->
                <marker id="scene1-arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0" />
                </marker>
                <!-- 箭头标记：红色高亮箭头 -->
                <marker id="scene1-arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828" />
                </marker>
            </defs>

            <!-- 营养级标签（步骤 1 显示） -->
            <text id="scene1-trophic-1" x="80" y="60" text-anchor="middle" font-size="12" fill="#2e7d32" style="opacity: 0;">第一营养级</text>
            <text id="scene1-trophic-2" x="260" y="60" text-anchor="middle" font-size="12" fill="#2e7d32" style="opacity: 0;">第二营养级</text>
            <text id="scene1-trophic-3" x="480" y="60" text-anchor="middle" font-size="12" fill="#2e7d32" style="opacity: 0;">第三营养级</text>
            <text id="scene1-trophic-4" x="650" y="60" text-anchor="middle" font-size="12" fill="#2e7d32" style="opacity: 0;">第四营养级</text>
            <text id="scene1-trophic-5" x="730" y="60" text-anchor="middle" font-size="12" fill="#2e7d32" style="opacity: 0;">第五营养级</text>

            <!-- 能量流动箭头（11 条） -->
            <!-- 箭头 1: 草→羚羊 -->
            <path id="scene1-arrow-1" d="M120,235 L220,120" stroke="#1565c0" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead-blue)" />
            <!-- 箭头 2: 草→斑马 -->
            <path id="scene1-arrow-2" d="M120,235 L220,235" stroke="#1565c0" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead-blue)" />
            <!-- 箭头 3: 草→鼠 -->
            <path id="scene1-arrow-3" d="M120,235 L220,350" stroke="#1565c0" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead-blue)" />
            <!-- 箭头 4: 羚羊→野狗 -->
            <path id="scene1-arrow-4" d="M300,120 L440,150" stroke="#1565c0" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead-blue)" />
            <!-- 箭头 5: 羚羊→狮子 -->
            <path id="scene1-arrow-5" d="M300,120 L700,180" stroke="#1565c0" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead-blue)" />
            <!-- 箭头 6: 斑马→野狗 -->
            <path id="scene1-arrow-6" d="M300,235 L440,150" stroke="#1565c0" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead-blue)" />
            <!-- 箭头 7: 斑马→狮子 -->
            <path id="scene1-arrow-7" d="M300,235 L700,180" stroke="#1565c0" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead-blue)" />
            <!-- 箭头 8: 鼠→蛇 -->
            <path id="scene1-arrow-8" d="M300,350 L440,320" stroke="#1565c0" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead-blue)" />
            <!-- 箭头 9: 蛇→食蛇动物 -->
            <path id="scene1-arrow-9" d="M520,320 L610,240" stroke="#1565c0" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead-blue)" />
            <!-- 箭头 10: 食蛇动物→狮子 -->
            <path id="scene1-arrow-10" d="M695,240 L700,180" stroke="#1565c0" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead-blue)" />
            <!-- 箭头 11: 野狗→狮子 -->
            <path id="scene1-arrow-11" d="M520,150 L700,180" stroke="#1565c0" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead-blue)" />

            <!-- 生物节点（8 个） -->
            <!-- 草节点 -->
            <ellipse id="scene1-node-grass" cx="80" cy="235" rx="40" ry="15" fill="#e3f2fd" fill-opacity="0.2" stroke="#000000" stroke-width="2" />
            <text id="scene1-label-grass" x="80" y="240" text-anchor="middle" font-size="14" fill="#ffffff">草</text>
            
            <!-- 羚羊节点 -->
            <ellipse id="scene1-node-antilope" cx="260" cy="120" rx="35" ry="14" fill="#e3f2fd" fill-opacity="0.2" stroke="#000000" stroke-width="2" />
            <text id="scene1-label-antilope" x="260" y="125" text-anchor="middle" font-size="14" fill="#ffffff">羚羊</text>
            
            <!-- 斑马节点 -->
            <ellipse id="scene1-node-zebra" cx="260" cy="235" rx="35" ry="14" fill="#e3f2fd" fill-opacity="0.2" stroke="#000000" stroke-width="2" />
            <text id="scene1-label-zebra" x="260" y="240" text-anchor="middle" font-size="14" fill="#ffffff">斑马</text>
            
            <!-- 鼠节点 -->
            <ellipse id="scene1-node-mouse" cx="260" cy="350" rx="25" ry="14" fill="#e3f2fd" fill-opacity="0.2" stroke="#000000" stroke-width="2" />
            <text id="scene1-label-mouse" x="260" y="355" text-anchor="middle" font-size="14" fill="#ffffff">鼠</text>
            
            <!-- 野狗节点 -->
            <ellipse id="scene1-node-wilddog" cx="480" cy="150" rx="35" ry="14" fill="#e3f2fd" fill-opacity="0.2" stroke="#000000" stroke-width="2" />
            <text id="scene1-label-wilddog" x="480" y="155" text-anchor="middle" font-size="14" fill="#ffffff">野狗</text>
            
            <!-- 蛇节点 -->
            <ellipse id="scene1-node-snake" cx="480" cy="320" rx="25" ry="14" fill="#e3f2fd" fill-opacity="0.2" stroke="#000000" stroke-width="2" />
            <text id="scene1-label-snake" x="480" y="325" text-anchor="middle" font-size="14" fill="#ffffff">蛇</text>
            
            <!-- 食蛇动物节点 -->
            <ellipse id="scene1-node-snakeeater" cx="650" cy="240" rx="45" ry="14" fill="#e3f2fd" fill-opacity="0.2" stroke="#000000" stroke-width="2" />
            <text id="scene1-label-snakeeater" x="650" y="245" text-anchor="middle" font-size="14" fill="#ffffff">食蛇动物</text>
            
            <!-- 狮子节点 -->
            <ellipse id="scene1-node-lion" cx="730" cy="180" rx="30" ry="14" fill="#e3f2fd" fill-opacity="0.2" stroke="#000000" stroke-width="2" />
            <text id="scene1-label-lion" x="730" y="185" text-anchor="middle" font-size="14" fill="#ffffff">狮子</text>

            <!-- 高亮路径层（用于步骤 2-6 的高亮显示） -->
            <!-- 这些路径初始隐藏，在对应步骤显示 -->
            <g id="scene1-highlight-layer" style="opacity: 0;">
                <!-- 高亮路径会在 JS 中动态控制 -->
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/8</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现：食物网结构与营养级关系
        
        // 状态定义（0-7 共 8 个步骤）
        const TOTAL_STEPS = 8;
        let currentState = 0;

        // 高亮路径配置（步骤 2-6 使用）
        // 每个步骤对应需要高亮的箭头 ID 列表
        const highlightConfig = {
            2: ['scene1-arrow-1', 'scene1-arrow-4', 'scene1-arrow-11'], // 草→羚羊→野狗→狮子
            3: ['scene1-arrow-1', 'scene1-arrow-5'], // 草→羚羊→狮子
            4: ['scene1-arrow-2', 'scene1-arrow-6', 'scene1-arrow-11'], // 草→斑马→野狗→狮子
            5: ['scene1-arrow-2', 'scene1-arrow-7'], // 草→斑马→狮子
            6: ['scene1-arrow-3', 'scene1-arrow-8', 'scene1-arrow-9', 'scene1-arrow-10'] // 草→鼠→蛇→食蛇动物→狮子
        };

        // 获取 DOM 元素
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        const trophicLabels = [
            document.getElementById('scene1-trophic-1'),
            document.getElementById('scene1-trophic-2'),
            document.getElementById('scene1-trophic-3'),
            document.getElementById('scene1-trophic-4'),
            document.getElementById('scene1-trophic-5')
        ];
        const arrows = [];
        for (let i = 1; i <= 11; i++) {
            arrows.push(document.getElementById(`scene1-arrow-${i}`));
        }

        // 更新按钮状态
        function updateButtons() {
            btnPrev.disabled = (currentState === 0);
            btnNext.disabled = (currentState === TOTAL_STEPS - 1);
            stepIndicator.textContent = `步骤 ${currentState + 1}/${TOTAL_STEPS}`;
        }

        // 渲染当前状态
        function renderState() {
            // 步骤 1：显示营养级标签
            if (currentState >= 1) {
                trophicLabels.forEach(el => {
                    el.style.opacity = '1';
                });
            } else {
                trophicLabels.forEach(el => {
                    el.style.opacity = '0';
                });
            }

            // 步骤 2-6：高亮特定路径
            // 步骤 7：恢复所有箭头为默认状态
            if (currentState >= 2 && currentState <= 6) {
                const highlightArrows = highlightConfig[currentState] || [];
                
                // 重置所有箭头为默认样式
                arrows.forEach(arrow => {
                    arrow.setAttribute('stroke', '#1565c0');
                    arrow.setAttribute('stroke-width', '2');
                    arrow.setAttribute('marker-end', 'url(#scene1-arrowhead-blue)');
                });

                // 高亮指定箭头
                highlightArrows.forEach(arrowId => {
                    const arrow = document.getElementById(arrowId);
                    if (arrow) {
                        arrow.setAttribute('stroke', '#c62828');
                        arrow.setAttribute('stroke-width', '4');
                        arrow.setAttribute('marker-end', 'url(#scene1-arrowhead-red)');
                    }
                });
            } else {
                // 步骤 0、1、7：所有箭头默认样式
                arrows.forEach(arrow => {
                    arrow.setAttribute('stroke', '#1565c0');
                    arrow.setAttribute('stroke-width', '2');
                    arrow.setAttribute('marker-end', 'url(#scene1-arrowhead-blue)');
                });
            }

            updateButtons();
        }

        // 按钮事件处理
        btnPrev.addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                renderState();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentState < TOTAL_STEPS - 1) {
                currentState++;
                renderState();
            }
        });

        // 初始化
        renderState();
    })();
    </script>
</body>
</html>
