<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遗传系谱图分析</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f0f0f0; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-step-indicator { font-size: 14px; padding: 8px 16px; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <!-- 定义填充图案 -->
            <defs>
                <pattern id="scene1-hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
                    <line x1="0" y1="0" x2="0" y2="8" stroke="#1565c0" stroke-width="2"/>
                </pattern>
                <pattern id="scene1-grid" patternUnits="userSpaceOnUse" width="8" height="8">
                    <line x1="0" y1="0" x2="8" y2="0" stroke="#c62828" stroke-width="1.5"/>
                    <line x1="0" y1="0" x2="0" y2="8" stroke="#c62828" stroke-width="1.5"/>
                </pattern>
            </defs>

            <!-- 代际标签 -->
            <text id="scene1-gen-I-label" x="10" y="70" font-size="18" font-weight="bold">Ⅰ</text>
            <text id="scene1-gen-II-label" x="10" y="190" font-size="18" font-weight="bold">Ⅱ</text>
            <text id="scene1-gen-III-label" x="10" y="310" font-size="18" font-weight="bold">Ⅲ</text>

            <!-- Ⅰ代符号 -->
            <!-- Ⅰ-1: 患甲病男性 (斜线方形) -->
            <rect id="scene1-symbol-I1" x="45" y="50" width="30" height="30" fill="url(#scene1-hatch)" stroke="#000" stroke-width="2"/>
            <text id="scene1-label-I1" x="60" y="42" font-size="12" text-anchor="middle">1</text>

            <!-- Ⅰ-2: 正常女性 (空白圆形) -->
            <circle id="scene1-symbol-I2" cx="145" cy="65" r="15" fill="#fff" stroke="#000" stroke-width="2"/>
            <text id="scene1-label-I2" x="160" y="42" font-size="12" text-anchor="middle">2</text>

            <!-- Ⅰ代夫妻连线 -->
            <line id="scene1-line-I1-I2" x1="75" y1="65" x2="130" y2="65" stroke="#000" stroke-width="2"/>

            <!-- Ⅰ-Ⅱ代垂直连线 -->
            <line id="scene1-line-I-II" x1="102" y1="65" x2="102" y2="140" stroke="#000" stroke-width="2"/>

            <!-- Ⅱ代 sibling 横线 -->
            <line id="scene1-line-II-sib" x1="50" y1="140" x2="230" y2="140" stroke="#000" stroke-width="2"/>

            <!-- Ⅱ代符号 -->
            <!-- Ⅱ-3: 患甲病男性 -->
            <line id="scene1-line-II3" x1="102" y1="140" x2="60" y2="170" stroke="#000" stroke-width="2"/>
            <rect id="scene1-symbol-II3" x="45" y="170" width="30" height="30" fill="url(#scene1-hatch)" stroke="#000" stroke-width="2"/>
            <text id="scene1-label-II3" x="60" y="162" font-size="12" text-anchor="middle">3</text>

            <!-- Ⅱ-4: 正常女性 -->
            <line id="scene1-line-II4" x1="102" y1="140" x2="100" y2="170" stroke="#000" stroke-width="2"/>
            <circle id="scene1-symbol-II4" cx="100" cy="185" r="15" fill="#fff" stroke="#000" stroke-width="2"/>
            <text id="scene1-label-II4" x="100" y="162" font-size="12" text-anchor="middle">4</text>

            <!-- Ⅱ-5: 患乙病女性 (网格圆形) -->
            <line id="scene1-line-II5" x1="102" y1="140" x2="140" y2="170" stroke="#000" stroke-width="2"/>
            <circle id="scene1-symbol-II5" cx="140" cy="185" r="15" fill="url(#scene1-grid)" stroke="#000" stroke-width="2"/>
            <text id="scene1-label-II5" x="140" y="162" font-size="12" text-anchor="middle">5</text>

            <!-- Ⅱ-6: 正常女性 -->
            <line id="scene1-line-II6" x1="102" y1="140" x2="180" y2="170" stroke="#000" stroke-width="2"/>
            <circle id="scene1-symbol-II6" cx="180" cy="185" r="15" fill="#fff" stroke="#000" stroke-width="2"/>
            <text id="scene1-label-II6" x="180" y="162" font-size="12" text-anchor="middle">6</text>

            <!-- Ⅱ-7: 正常男性 -->
            <rect id="scene1-symbol-II7" x="215" y="170" width="30" height="30" fill="#fff" stroke="#000" stroke-width="2"/>
            <text id="scene1-label-II7" x="230" y="162" font-size="12" text-anchor="middle">7</text>

            <!-- Ⅱ-3 和Ⅱ-4 夫妻连线 -->
            <line id="scene1-line-II3-II4" x1="75" y1="185" x2="85" y2="185" stroke="#000" stroke-width="2"/>
            <line id="scene1-line-II3-II4-down" x1="80" y1="185" x2="80" y2="260" stroke="#000" stroke-width="2"/>

            <!-- Ⅱ-6 和Ⅱ-7 夫妻连线 -->
            <line id="scene1-line-II6-II7" x1="195" y1="185" x2="215" y2="185" stroke="#000" stroke-width="2"/>
            <line id="scene1-line-II6-II7-down" x1="205" y1="185" x2="205" y2="260" stroke="#000" stroke-width="2"/>

            <!-- Ⅲ代符号 -->
            <!-- Ⅲ-8: 未知 (问号) -->
            <text id="scene1-symbol-III8" x="80" y="295" font-size="24" font-weight="bold">?</text>
            <text id="scene1-label-III8" x="80" y="280" font-size="12" text-anchor="middle">8</text>

            <!-- Ⅲ-9: 正常男性 -->
            <rect id="scene1-symbol-III9" x="190" y="280" width="30" height="30" fill="#fff" stroke="#000" stroke-width="2"/>
            <text id="scene1-label-III9" x="205" y="272" font-size="12" text-anchor="middle">9</text>

            <!-- 高亮框（步骤1和2显示） -->
            <g id="scene1-highlight-jia" style="display: none;">
                <rect x="35" y="40" width="150" height="50" fill="none" stroke="#1565c0" stroke-width="3" stroke-dasharray="5,5"/>
                <text x="40" y="105" font-size="12" fill="#1565c0">甲病：父子相传 → 排除伴X显性</text>
            </g>

            <g id="scene1-highlight-yi" style="display: none;">
                <circle cx="140" cy="185" r="22" fill="none" stroke="#c62828" stroke-width="3" stroke-dasharray="5,5"/>
                <text x="160" y="210" font-size="12" fill="#c62828">乙病：女性患病但父亲正常 → 隐性</text>
            </g>

            <!-- 甲病基因型标签（步骤3显示） -->
            <g id="scene1-genotype-jia" style="display: none;">
                <text id="scene1-geno-jia-I1" x="60" y="95" font-size="11" text-anchor="middle">Aa</text>
                <text id="scene1-geno-jia-I2" x="160" y="95" font-size="11" text-anchor="middle">aa</text>
                <text id="scene1-geno-jia-II3" x="60" y="215" font-size="11" text-anchor="middle">Aa</text>
                <text id="scene1-geno-jia-II4" x="100" y="215" font-size="11" text-anchor="middle">aa</text>
                <text id="scene1-geno-jia-II5" x="140" y="215" font-size="11" text-anchor="middle">aa</text>
                <text id="scene1-geno-jia-II6" x="180" y="215" font-size="11" text-anchor="middle">aa</text>
                <text id="scene1-geno-jia-II7" x="230" y="215" font-size="11" text-anchor="middle">aa</text>
                <text id="scene1-geno-jia-III8" x="80" y="330" font-size="11" text-anchor="middle">?</text>
                <text id="scene1-geno-jia-III9" x="205" y="325" font-size="11" text-anchor="middle">aa</text>
            </g>

            <!-- 乙病基因型标签（步骤4显示） -->
            <g id="scene1-genotype-yi" style="display: none;">
                <text id="scene1-geno-yi-I1" x="60" y="110" font-size="11" text-anchor="middle">X<tspan dy="-3" font-size="9">B</tspan>Y</text>
                <text id="scene1-geno-yi-I2" x="160" y="110" font-size="11" text-anchor="middle">X<tspan dy="-3" font-size="9">B</tspan>X<tspan dy="-3" font-size="9">b</tspan></text>
                <text id="scene1-geno-yi-II3" x="60" y="230" font-size="11" text-anchor="middle">X<tspan dy="-3" font-size="9">B</tspan>Y</text>
                <text id="scene1-geno-yi-II4" x="100" y="230" font-size="11" text-anchor="middle">X<tspan dy="-3" font-size="9">B</tspan>X<tspan dy="-3" font-size="9">b</tspan></text>
                <text id="scene1-geno-yi-II5" x="140" y="230" font-size="11" text-anchor="middle">X<tspan dy="-3" font-size="9">b</tspan>O</text>
                <text id="scene1-geno-yi-II6" x="180" y="230" font-size="11" text-anchor="middle">X<tspan dy="-3" font-size="9">B</tspan>X<tspan dy="-3" font-size="9">b</tspan></text>
                <text id="scene1-geno-yi-II7" x="230" y="230" font-size="11" text-anchor="middle">X<tspan dy="-3" font-size="9">B</tspan>Y</text>
                <text id="scene1-geno-yi-III8" x="80" y="345" font-size="11" text-anchor="middle">?</text>
                <text id="scene1-geno-yi-III9" x="205" y="340" font-size="11" text-anchor="middle">X<tspan dy="-3" font-size="9">B</tspan>Y</text>
            </g>

            <!-- 图例框 -->
            <g id="scene1-legend">
                <rect x="580" y="40" width="180" height="110" fill="#fff" stroke="#000" stroke-width="1"/>
                <text x="590" y="62" font-size="14" font-weight="bold">图例</text>
                <!-- 甲病图例 -->
                <rect x="590" y="75" width="20" height="20" fill="url(#scene1-hatch)" stroke="#000" stroke-width="1"/>
                <text x="620" y="90" font-size="12">患甲病男性</text>
                <!-- 乙病图例 -->
                <circle cx="600" cy="112" r="10" fill="url(#scene1-grid)" stroke="#000" stroke-width="1"/>
                <text x="620" y="117" font-size="12">患乙病女性</text>
                <!-- 正常图例 -->
                <rect x="590" y="130" width="20" height="20" fill="#fff" stroke="#000" stroke-width="1"/>
                <circle cx="620" cy="140" r="10" fill="#fff" stroke="#000" stroke-width="1"/>
                <text x="620" y="145" font-size="12">正常男/女</text>
            </g>

            <!-- 结论框（步骤5显示） -->
            <g id="scene1-conclusion" style="display: none;">
                <rect x="580" y="350" width="180" height="90" fill="#2e7d32" stroke="#000" stroke-width="1"/>
                <text x="590" y="375" font-size="14" font-weight="bold" fill="#fff">遗传方式判断</text>
                <text x="590" y="400" font-size="12" fill="#fff">甲病：常染色体显性</text>
                <text x="590" y="420" font-size="12" fill="#fff">乙病：伴X隐性</text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator" class="scene1-step-indicator">步骤 0/5</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 遗传系谱图分析
        let currentStep = 0;
        const totalSteps = 5;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        const highlightJia = document.getElementById('scene1-highlight-jia');
        const highlightYi = document.getElementById('scene1-highlight-yi');
        const genotypeJia = document.getElementById('scene1-genotype-jia');
        const genotypeYi = document.getElementById('scene1-genotype-yi');
        const conclusion = document.getElementById('scene1-conclusion');

        function updateDisplay() {
            // 根据当前步骤显示/隐藏元素
            highlightJia.style.display = currentStep >= 1 ? 'block' : 'none';
            highlightYi.style.display = currentStep >= 2 ? 'block' : 'none';
            genotypeJia.style.display = currentStep >= 3 ? 'block' : 'none';
            genotypeYi.style.display = currentStep >= 4 ? 'block' : 'none';
            conclusion.style.display = currentStep >= 5 ? 'block' : 'none';

            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep}/${totalSteps}`;

            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            if (currentStep === totalSteps) {
                btnNext.textContent = '完成';
                btnNext.disabled = true;
            } else {
                btnNext.textContent = '下一步 ▶';
                btnNext.disabled = false;
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateDisplay();
            }
        });

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
