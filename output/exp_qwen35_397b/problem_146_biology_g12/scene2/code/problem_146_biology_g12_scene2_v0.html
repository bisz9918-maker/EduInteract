<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>果蝇减数分裂过程中染色体数目变化</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        .scene2-cell {
            fill: none;
            stroke: #000000;
            stroke-width: 1.5;
        }
        .scene2-cell-highlight {
            stroke-width: 2.5;
        }
        .scene2-chromosome {
            stroke: #000000;
            stroke-width: 2;
            fill: none;
        }
        .scene2-chromosome-faint {
            opacity: 0.3;
        }
        .scene2-centromere {
            fill: #1565c0;
        }
        .scene2-spindle {
            stroke: #888888;
            stroke-width: 1;
            stroke-dasharray: 4,4;
        }
        .scene2-label {
            font-size: 14px;
            fill: #000000;
            text-anchor: middle;
        }
        .scene2-value {
            font-size: 16px;
            fill: #c62828;
            font-weight: bold;
        }
        .scene2-info-panel {
            fill: #f5f5f5;
            stroke: #cccccc;
            stroke-width: 1;
            rx: 8;
        }
        .scene2-btn {
            fill: #1976d2;
            stroke: none;
            rx: 6;
            cursor: pointer;
        }
        .scene2-btn-disabled {
            fill: #bdbdbd;
            cursor: not-allowed;
        }
        .scene2-btn-text {
            fill: #ffffff;
            font-size: 14px;
            text-anchor: middle;
            dominant-baseline: middle;
        }
        .scene2-step-indicator {
            font-size: 14px;
            fill: #666666;
            text-anchor: middle;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 细胞轮廓 -->
            <circle id="scene2-cell-1" class="scene2-cell" cx="80" cy="120" r="55"/>
            <circle id="scene2-cell-2" class="scene2-cell" cx="220" cy="120" r="55"/>
            <circle id="scene2-cell-3" class="scene2-cell" cx="360" cy="120" r="55"/>
            <circle id="scene2-cell-4" class="scene2-cell" cx="500" cy="120" r="55"/>
            <circle id="scene2-cell-5" class="scene2-cell" cx="640" cy="120" r="55"/>

            <!-- 时期标签 -->
            <text id="scene2-label-1" class="scene2-label" x="80" y="200">间期</text>
            <text id="scene2-label-2" class="scene2-label" x="220" y="200">减Ⅰ中期</text>
            <text id="scene2-label-3" class="scene2-label" x="360" y="200">减Ⅰ后期</text>
            <text id="scene2-label-4" class="scene2-label" x="500" y="200">减Ⅱ中期</text>
            <text id="scene2-label-5" class="scene2-label" x="640" y="200">减Ⅱ后期</text>

            <!-- 间期细胞 - 染色质丝 -->
            <g id="scene2-chromatin-1">
                <path class="scene2-chromosome" d="M65,105 Q70,110 68,115"/>
                <path class="scene2-chromosome" d="M75,100 Q80,108 78,115"/>
                <path class="scene2-chromosome" d="M85,100 Q90,108 88,115"/>
                <path class="scene2-chromosome" d="M95,105 Q100,110 98,115"/>
                <path class="scene2-chromosome" d="M70,125 Q75,130 73,135"/>
                <path class="scene2-chromosome" d="M80,128 Q85,133 83,138"/>
                <path class="scene2-chromosome" d="M90,125 Q95,130 93,135"/>
                <path class="scene2-chromosome" d="M100,128 Q105,133 103,138"/>
            </g>

            <!-- 减Ⅰ中期细胞 - 同源染色体配对排列在赤道板 -->
            <g id="scene2-chromo-2" class="scene2-chromosome-faint">
                <!-- 4对同源染色体，每条含2个染色单体 -->
                <!-- 染色体1 -->
                <path class="scene2-chromosome" d="M205,105 L205,120 L200,135"/>
                <path class="scene2-chromosome" d="M210,105 L210,120 L215,135"/>
                <circle class="scene2-centromere" cx="207" cy="120" r="3"/>
                <!-- 染色体2 -->
                <path class="scene2-chromosome" d="M220,105 L220,120 L215,135"/>
                <path class="scene2-chromosome" d="M225,105 L225,120 L230,135"/>
                <circle class="scene2-centromere" cx="222" cy="120" r="3"/>
                <!-- 染色体3 -->
                <path class="scene2-chromosome" d="M235,105 L235,120 L230,135"/>
                <path class="scene2-chromosome" d="M240,105 L240,120 L245,135"/>
                <circle class="scene2-centromere" cx="237" cy="120" r="3"/>
                <!-- 染色体4 -->
                <path class="scene2-chromosome" d="M250,105 L250,120 L245,135"/>
                <path class="scene2-chromosome" d="M255,105 L255,120 L260,135"/>
                <circle class="scene2-centromere" cx="252" cy="120" r="3"/>
                <!-- 纺锤丝 -->
                <line class="scene2-spindle" x1="220" y1="65" x2="207" y2="120"/>
                <line class="scene2-spindle" x1="220" y1="65" x2="222" y2="120"/>
                <line class="scene2-spindle" x1="220" y1="65" x2="237" y2="120"/>
                <line class="scene2-spindle" x1="220" y1="65" x2="252" y2="120"/>
                <line class="scene2-spindle" x1="220" y1="175" x2="207" y2="120"/>
                <line class="scene2-spindle" x1="220" y1="175" x2="222" y2="120"/>
                <line class="scene2-spindle" x1="220" y1="175" x2="237" y2="120"/>
                <line class="scene2-spindle" x1="220" y1="175" x2="252" y2="120"/>
            </g>

            <!-- 减Ⅰ后期细胞 - 同源染色体分离 -->
            <g id="scene2-chromo-3" class="scene2-chromosome-faint">
                <!-- 上极4条染色体 -->
                <path class="scene2-chromosome" d="M345,95 L345,105 L342,115"/>
                <path class="scene2-chromosome" d="M355,95 L355,105 L358,115"/>
                <path class="scene2-chromosome" d="M365,95 L365,105 L362,115"/>
                <path class="scene2-chromosome" d="M375,95 L375,105 L378,115"/>
                <!-- 下极4条染色体 -->
                <path class="scene2-chromosome" d="M345,125 L345,135 L342,145"/>
                <path class="scene2-chromosome" d="M355,125 L355,135 L358,145"/>
                <path class="scene2-chromosome" d="M365,125 L365,135 L362,145"/>
                <path class="scene2-chromosome" d="M375,125 L375,135 L378,145"/>
                <!-- 纺锤丝 -->
                <line class="scene2-spindle" x1="360" y1="65" x2="345" y2="95"/>
                <line class="scene2-spindle" x1="360" y1="65" x2="355" y2="95"/>
                <line class="scene2-spindle" x1="360" y1="65" x2="365" y2="95"/>
                <line class="scene2-spindle" x1="360" y1="65" x2="375" y2="95"/>
                <line class="scene2-spindle" x1="360" y1="175" x2="345" y2="125"/>
                <line class="scene2-spindle" x1="360" y1="175" x2="355" y2="125"/>
                <line class="scene2-spindle" x1="360" y1="175" x2="365" y2="125"/>
                <line class="scene2-spindle" x1="360" y1="175" x2="375" y2="125"/>
            </g>

            <!-- 减Ⅱ中期细胞 - 单倍体染色体排列 -->
            <g id="scene2-chromo-4" class="scene2-chromosome-faint">
                <!-- 4条染色体排列在赤道板 -->
                <path class="scene2-chromosome" d="M485,105 L485,120 L480,135"/>
                <path class="scene2-chromosome" d="M490,105 L490,120 L495,135"/>
                <circle class="scene2-centromere" cx="487" cy="120" r="3"/>
                <path class="scene2-chromosome" d="M500,105 L500,120 L495,135"/>
                <path class="scene2-chromosome" d="M505,105 L505,120 L510,135"/>
                <circle class="scene2-centromere" cx="502" cy="120" r="3"/>
                <path class="scene2-chromosome" d="M515,105 L515,120 L510,135"/>
                <path class="scene2-chromosome" d="M520,105 L520,120 L525,135"/>
                <circle class="scene2-centromere" cx="517" cy="120" r="3"/>
                <path class="scene2-chromosome" d="M530,105 L530,120 L525,135"/>
                <path class="scene2-chromosome" d="M535,105 L535,120 L540,135"/>
                <circle class="scene2-centromere" cx="532" cy="120" r="3"/>
                <!-- 纺锤丝 -->
                <line class="scene2-spindle" x1="500" y1="65" x2="487" y2="120"/>
                <line class="scene2-spindle" x1="500" y1="65" x2="502" y2="120"/>
                <line class="scene2-spindle" x1="500" y1="65" x2="517" y2="120"/>
                <line class="scene2-spindle" x1="500" y1="65" x2="532" y2="120"/>
                <line class="scene2-spindle" x1="500" y1="175" x2="487" y2="120"/>
                <line class="scene2-spindle" x1="500" y1="175" x2="502" y2="120"/>
                <line class="scene2-spindle" x1="500" y1="175" x2="517" y2="120"/>
                <line class="scene2-spindle" x1="500" y1="175" x2="532" y2="120"/>
            </g>

            <!-- 减Ⅱ后期细胞 - 姐妹染色单体分离 -->
            <g id="scene2-chromo-5" class="scene2-chromosome-faint">
                <!-- 上极4条染色单体 -->
                <line class="scene2-chromosome" x1="625" y1="95" x2="625" y2="110"/>
                <line class="scene2-chromosome" x1="635" y1="95" x2="635" y2="110"/>
                <line class="scene2-chromosome" x1="645" y1="95" x2="645" y2="110"/>
                <line class="scene2-chromosome" x1="655" y1="95" x2="655" y2="110"/>
                <!-- 下极4条染色单体 -->
                <line class="scene2-chromosome" x1="625" y1="130" x2="625" y2="145"/>
                <line class="scene2-chromosome" x1="635" y1="130" x2="635" y2="145"/>
                <line class="scene2-chromosome" x1="645" y1="130" x2="645" y2="145"/>
                <line class="scene2-chromosome" x1="655" y1="130" x2="655" y2="145"/>
                <!-- 纺锤丝 -->
                <line class="scene2-spindle" x1="640" y1="65" x2="625" y2="95"/>
                <line class="scene2-spindle" x1="640" y1="65" x2="635" y2="95"/>
                <line class="scene2-spindle" x1="640" y1="65" x2="645" y2="95"/>
                <line class="scene2-spindle" x1="640" y1="65" x2="655" y2="95"/>
                <line class="scene2-spindle" x1="640" y1="175" x2="625" y2="130"/>
                <line class="scene2-spindle" x1="640" y1="175" x2="635" y2="130"/>
                <line class="scene2-spindle" x1="640" y1="175" x2="645" y2="130"/>
                <line class="scene2-spindle" x1="640" y1="175" x2="655" y2="130"/>
            </g>

            <!-- 信息面板 -->
            <rect id="scene2-info-panel" class="scene2-info-panel" x="100" y="280" width="600" height="120"/>
            <text id="scene2-info-title" class="scene2-label" x="130" y="310" text-anchor="start" style="font-size: 16px; font-weight: bold;">当前时期：</text>
            <text id="scene2-info-content" class="scene2-value" x="130" y="345" text-anchor="start">染色体组数：2 | 染色体数：8</text>

            <!-- 步骤指示器 -->
            <text id="scene2-step-indicator" class="scene2-step-indicator" x="400" y="420">步骤 1/5</text>

            <!-- 导航按钮 -->
            <g id="scene2-btn-prev-group">
                <rect id="scene2-btn-prev" class="scene2-btn scene2-btn-disabled" x="280" y="445" width="80" height="35"/>
                <text id="scene2-btn-prev-text" class="scene2-btn-text" x="320" y="462">◀ 上一步</text>
            </g>
            <g id="scene2-btn-next-group">
                <rect id="scene2-btn-next" class="scene2-btn" x="440" y="445" width="80" height="35"/>
                <text id="scene2-btn-next-text" class="scene2-btn-text" x="480" y="462">下一步 ▶</text>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 2: 果蝇减数分裂过程中染色体数目变化
        const currentStep = { value: 0 };
        const totalSteps = 5;

        // 时期信息
        const stepInfo = [
            { title: "间期", content: "染色体组数：2 | 染色体数：8" },
            { title: "减数第一次分裂中期", content: "染色体组数：2 | 染色体数：8" },
            { title: "减数第一次分裂后期", content: "染色体组数：2→1 | 染色体数：8→4（每极）" },
            { title: "减数第二次分裂中期", content: "染色体组数：1 | 染色体数：4" },
            { title: "减数第二次分裂后期", content: "染色体组数：1 | 染色体数：4→8（分离后）" }
        ];

        // 获取元素
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnPrevText = document.getElementById('scene2-btn-prev-text');
        const btnNext = document.getElementById('scene2-btn-next');
        const btnNextText = document.getElementById('scene2-btn-next-text');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        const infoTitle = document.getElementById('scene2-info-title');
        const infoContent = document.getElementById('scene2-info-content');

        // 细胞和染色体组
        const cells = [
            document.getElementById('scene2-cell-1'),
            document.getElementById('scene2-cell-2'),
            document.getElementById('scene2-cell-3'),
            document.getElementById('scene2-cell-4'),
            document.getElementById('scene2-cell-5')
        ];
        const chromoGroups = [
            document.getElementById('scene2-chromatin-1'),
            document.getElementById('scene2-chromo-2'),
            document.getElementById('scene2-chromo-3'),
            document.getElementById('scene2-chromo-4'),
            document.getElementById('scene2-chromo-5')
        ];

        // 更新显示状态
        function updateDisplay() {
            // 更新细胞高亮和染色体可见性
            for (let i = 0; i < totalSteps; i++) {
                if (i === currentStep.value) {
                    cells[i].classList.add('scene2-cell-highlight');
                    chromoGroups[i].classList.remove('scene2-chromosome-faint');
                } else {
                    cells[i].classList.remove('scene2-cell-highlight');
                    chromoGroups[i].classList.add('scene2-chromosome-faint');
                }
            }

            // 更新信息面板
            infoTitle.textContent = "当前时期：" + stepInfo[currentStep.value].title;
            infoContent.textContent = stepInfo[currentStep.value].content;

            // 更新步骤指示器
            stepIndicator.textContent = "步骤 " + (currentStep.value + 1) + "/" + totalSteps;

            // 更新按钮状态
            if (currentStep.value === 0) {
                btnPrev.classList.add('scene2-btn-disabled');
                btnPrevText.style.fill = "#e0e0e0";
            } else {
                btnPrev.classList.remove('scene2-btn-disabled');
                btnPrevText.style.fill = "#ffffff";
            }

            if (currentStep.value === totalSteps - 1) {
                btnNext.classList.add('scene2-btn-disabled');
                btnNextText.style.fill = "#e0e0e0";
            } else {
                btnNext.classList.remove('scene2-btn-disabled');
                btnNextText.style.fill = "#ffffff";
            }
        }

        // 上一步
        function prevStep() {
            if (currentStep.value > 0) {
                currentStep.value--;
                updateDisplay();
            }
        }

        // 下一步
        function nextStep() {
            if (currentStep.value < totalSteps - 1) {
                currentStep.value++;
                updateDisplay();
            }
        }

        // 绑定事件
        btnPrev.addEventListener('click', prevStep);
        btnNext.addEventListener('click', nextStep);

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
