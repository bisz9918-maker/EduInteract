<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M 果蝇出现原因的实验设计</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene4-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene4-svg { width: 800px; height: 500px; }
        #scene4-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene4-btn { padding: 8px 20px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; transition: opacity 0.2s; }
        .scene4-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene4-btn-prev { background: #1565c0; color: white; }
        .scene4-btn-next { background: #1565c0; color: white; }
        .scene4-step-indicator { font-size: 14px; color: #666; padding: 8px 16px; }
        .highlight { stroke: #000000 !important; stroke-width: 3px !important; }
    </style>
</head>
<body>
    <div id="scene4-container">
        <svg id="scene4-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene4-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#000000" />
                </marker>
            </defs>

            <!-- 标题框：上边缘留足 20px -->
            <rect id="scene4-title-box" x="250" y="20" width="300" height="30" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="4"/>
            <text id="scene4-title-text" x="400" y="40" text-anchor="middle" font-size="13px" font-weight="bold" fill="#000000">M 果蝇出现原因的实验设计</text>

            <!-- M 果蝇图标 -->
            <circle id="scene4-m-icon" cx="400" cy="75" r="18" fill="#fff9c4" stroke="#f57f17" stroke-width="2"/>
            <text id="scene4-m-label" x="400" y="80" text-anchor="middle" font-size="14px" font-weight="bold" fill="#000000">M</text>

            <!-- 原因 1 框：环境改变 -->
            <rect id="scene4-cause1-box" x="150" y="105" width="130" height="30" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="4"/>
            <text id="scene4-cause1-text" x="215" y="125" text-anchor="middle" font-size="12px" fill="#2e7d32">环境改变</text>

            <!-- 原因 2 框：基因突变 -->
            <rect id="scene4-cause2-box" x="335" y="105" width="130" height="30" fill="#fff3e0" stroke="#ef6c00" stroke-width="2" rx="4"/>
            <text id="scene4-cause2-text" x="400" y="125" text-anchor="middle" font-size="12px" fill="#ef6c00">基因突变</text>

            <!-- 原因 3 框：X 染色体不分离 -->
            <rect id="scene4-cause3-box" x="520" y="105" width="130" height="30" fill="#ffebee" stroke="#c62828" stroke-width="2" rx="4"/>
            <text id="scene4-cause3-text" x="585" y="125" text-anchor="middle" font-size="12px" fill="#c62828">X 染色体不分离</text>

            <!-- 箭头 1：M 指向实验步骤 -->
            <line id="scene4-arrow1" x1="400" y1="93" x2="400" y2="145" stroke="#000000" stroke-width="2" marker-end="url(#scene4-arrowhead)" opacity="0"/>

            <!-- 实验步骤框 -->
            <rect id="scene4-step-box" x="200" y="150" width="400" height="40" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="4" opacity="0"/>
            <text id="scene4-step-text" x="400" y="175" text-anchor="middle" font-size="13px" fill="#1565c0" opacity="0">M × 正常白眼雌果蝇 (X<tspan baseline-shift="super" font-size="10px">r</tspan>X<tspan baseline-shift="super" font-size="10px">r</tspan>)</text>

            <!-- 箭头 2：实验步骤指向分支点 -->
            <line id="scene4-arrow2" x1="400" y1="190" x2="400" y2="220" stroke="#000000" stroke-width="2" marker-end="url(#scene4-arrowhead)" opacity="0"/>

            <!-- 分支点 -->
            <circle id="scene4-branch-point" cx="400" cy="230" r="6" fill="#424242" opacity="0"/>

            <!-- 分支线 1：左下 -->
            <line id="scene4-branch-line1" x1="400" y1="230" x2="190" y2="275" stroke="#000000" stroke-width="2" opacity="0"/>

            <!-- 分支线 2：正下 -->
            <line id="scene4-branch-line2" x1="400" y1="230" x2="400" y2="275" stroke="#000000" stroke-width="2" opacity="0"/>

            <!-- 分支线 3：右下 -->
            <line id="scene4-branch-line3" x1="400" y1="230" x2="610" y2="275" stroke="#000000" stroke-width="2" opacity="0"/>

            <!-- 结果 1 框：环境改变（增加高度至 110px，调整文字间距） -->
            <g id="scene4-result1-group" opacity="0">
                <rect id="scene4-result1-box" x="80" y="280" width="220" height="110" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="4"/>
                <text id="scene4-result1-title" x="190" y="308" text-anchor="middle" font-size="12px" font-weight="bold" fill="#2e7d32">环境改变</text>
                <text id="scene4-result1-content1" x="190" y="340" text-anchor="middle" font-size="11px" fill="#333333">M 基因型 X<tspan baseline-shift="super" font-size="9px">R</tspan>Y</text>
                <text id="scene4-result1-content2" x="190" y="370" text-anchor="middle" font-size="11px" fill="#333333">→ 子代全为红眼</text>
            </g>

            <!-- 结果 2 框：基因突变（增加高度至 110px，调整文字间距） -->
            <g id="scene4-result2-group" opacity="0">
                <rect id="scene4-result2-box" x="290" y="280" width="220" height="110" fill="#fff3e0" stroke="#ef6c00" stroke-width="2" rx="4"/>
                <text id="scene4-result2-title" x="400" y="308" text-anchor="middle" font-size="12px" font-weight="bold" fill="#ef6c00">基因突变</text>
                <text id="scene4-result2-content1" x="400" y="340" text-anchor="middle" font-size="11px" fill="#333333">M 基因型 X<tspan baseline-shift="super" font-size="9px">r</tspan>Y</text>
                <text id="scene4-result2-content2" x="400" y="370" text-anchor="middle" font-size="11px" fill="#333333">→ 雌红眼:雄白眼=1:1</text>
            </g>

            <!-- 结果 3 框：X 不分离（增加高度至 110px，调整文字间距） -->
            <g id="scene4-result3-group" opacity="0">
                <rect id="scene4-result3-box" x="500" y="280" width="220" height="110" fill="#ffebee" stroke="#c62828" stroke-width="2" rx="4"/>
                <text id="scene4-result3-title" x="610" y="308" text-anchor="middle" font-size="12px" font-weight="bold" fill="#c62828">X 染色体不分离</text>
                <text id="scene4-result3-content1" x="610" y="340" text-anchor="middle" font-size="11px" fill="#333333">M 基因型 X<tspan baseline-shift="super" font-size="9px">r</tspan>O（不育）</text>
                <text id="scene4-result3-content2" x="610" y="370" text-anchor="middle" font-size="11px" fill="#333333">→ 无子代</text>
            </g>

            <!-- 对比表：上移 -->
            <g id="scene4-comparison-group" opacity="0">
                <rect id="scene4-comparison-box" x="150" y="395" width="500" height="35" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1" rx="4"/>
                <text id="scene4-comparison-text" x="400" y="417" text-anchor="middle" font-size="12px" fill="#333333">环境改变 → 全红眼  |  基因突变 → 1:1  |  X 不分离 → 无子代</text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene4-controls">
            <button id="scene4-btn-prev" class="scene4-btn scene4-btn-prev">◀ 上一步</button>
            <span id="scene4-step-indicator" class="scene4-step-indicator">步骤 0/6</span>
            <button id="scene4-btn-next" class="scene4-btn scene4-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 4: M 果蝇出现原因的实验设计流程

        let currentStep = 0;
        const totalSteps = 6;

        // 获取 DOM 元素
        const btnPrev = document.getElementById('scene4-btn-prev');
        const btnNext = document.getElementById('scene4-btn-next');
        const stepIndicator = document.getElementById('scene4-step-indicator');

        // 元素分组
        const step0Elements = ['scene4-title-box', 'scene4-title-text', 'scene4-m-icon', 'scene4-m-label', 
                               'scene4-cause1-box', 'scene4-cause1-text', 'scene4-cause2-box', 'scene4-cause2-text',
                               'scene4-cause3-box', 'scene4-cause3-text'];
        
        const step1Elements = ['scene4-arrow1', 'scene4-step-box', 'scene4-step-text'];
        
        const step2Elements = ['scene4-arrow2', 'scene4-branch-point', 'scene4-branch-line1', 
                               'scene4-branch-line2', 'scene4-branch-line3',
                               'scene4-result1-group', 'scene4-result2-group', 'scene4-result3-group'];

        // 更新显示状态
        function updateDisplay() {
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep}/${totalSteps}`;

            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;

            // 步骤 0：只显示基础元素
            if (currentStep === 0) {
                setOpacity(step0Elements, 1);
                setOpacity(step1Elements, 0);
                setOpacity(step2Elements, 0);
                setOpacity(['scene4-comparison-group'], 0);
                resetHighlights();
            }
            // 步骤 1：显示箭头 1 和实验步骤框
            else if (currentStep === 1) {
                setOpacity(step0Elements, 1);
                setOpacity(step1Elements, 1);
                setOpacity(step2Elements, 0);
                setOpacity(['scene4-comparison-group'], 0);
                resetHighlights();
            }
            // 步骤 2：显示分支结构和灰色结果框
            else if (currentStep === 2) {
                setOpacity(step0Elements, 1);
                setOpacity(step1Elements, 1);
                setOpacity(['scene4-arrow2', 'scene4-branch-point', 'scene4-branch-line1', 
                           'scene4-branch-line2', 'scene4-branch-line3'], 1);
                // 结果框以半透明显示
                setResultOpacity('scene4-result1-group', 0.5);
                setResultOpacity('scene4-result2-group', 0.5);
                setResultOpacity('scene4-result3-group', 0.5);
                setOpacity(['scene4-comparison-group'], 0);
                resetHighlights();
            }
            // 步骤 3：高亮结果 1（环境改变）
            else if (currentStep === 3) {
                setOpacity(step0Elements, 1);
                setOpacity(step1Elements, 1);
                setOpacity(['scene4-arrow2', 'scene4-branch-point', 'scene4-branch-line1', 
                           'scene4-branch-line2', 'scene4-branch-line3'], 1);
                setResultOpacity('scene4-result1-group', 1);
                setResultOpacity('scene4-result2-group', 0.5);
                setResultOpacity('scene4-result3-group', 0.5);
                setOpacity(['scene4-comparison-group'], 0);
                resetHighlights();
                highlightResult('scene4-result1-box', 'scene4-cause1-box');
            }
            // 步骤 4：高亮结果 2（基因突变）
            else if (currentStep === 4) {
                setOpacity(step0Elements, 1);
                setOpacity(step1Elements, 1);
                setOpacity(['scene4-arrow2', 'scene4-branch-point', 'scene4-branch-line1', 
                           'scene4-branch-line2', 'scene4-branch-line3'], 1);
                setResultOpacity('scene4-result1-group', 1);
                setResultOpacity('scene4-result2-group', 1);
                setResultOpacity('scene4-result3-group', 0.5);
                setOpacity(['scene4-comparison-group'], 0);
                resetHighlights();
                highlightResult('scene4-result2-box', 'scene4-cause2-box');
            }
            // 步骤 5：高亮结果 3（X 不分离）
            else if (currentStep === 5) {
                setOpacity(step0Elements, 1);
                setOpacity(step1Elements, 1);
                setOpacity(['scene4-arrow2', 'scene4-branch-point', 'scene4-branch-line1', 
                           'scene4-branch-line2', 'scene4-branch-line3'], 1);
                setResultOpacity('scene4-result1-group', 1);
                setResultOpacity('scene4-result2-group', 1);
                setResultOpacity('scene4-result3-group', 1);
                setOpacity(['scene4-comparison-group'], 0);
                resetHighlights();
                highlightResult('scene4-result3-box', 'scene4-cause3-box');
            }
            // 步骤 6：显示对比表
            else if (currentStep === 6) {
                setOpacity(step0Elements, 1);
                setOpacity(step1Elements, 1);
                setOpacity(['scene4-arrow2', 'scene4-branch-point', 'scene4-branch-line1', 
                           'scene4-branch-line2', 'scene4-branch-line3'], 1);
                setResultOpacity('scene4-result1-group', 1);
                setResultOpacity('scene4-result2-group', 1);
                setResultOpacity('scene4-result3-group', 1);
                setOpacity(['scene4-comparison-group'], 1);
                resetHighlights();
            }
        }

        // 设置元素组透明度
        function setOpacity(elementIds, opacity) {
            elementIds.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.style.opacity = opacity;
                    if (opacity === 0) {
                        el.style.display = 'none';
                    } else {
                        el.style.display = '';
                    }
                }
            });
        }

        // 设置结果组透明度（处理 g 元素内的子元素）
        function setResultOpacity(groupId, opacity) {
            const group = document.getElementById(groupId);
            if (group) {
                group.style.opacity = opacity;
                if (opacity === 0) {
                    group.style.display = 'none';
                } else {
                    group.style.display = '';
                }
            }
        }

        // 重置所有高亮
        function resetHighlights() {
            ['scene4-result1-box', 'scene4-result2-box', 'scene4-result3-box',
             'scene4-cause1-box', 'scene4-cause2-box', 'scene4-cause3-box'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.classList.remove('highlight');
                    // 恢复原始边框颜色
                    if (id === 'scene4-result1-box' || id === 'scene4-cause1-box') {
                        el.style.stroke = '#2e7d32';
                    } else if (id === 'scene4-result2-box' || id === 'scene4-cause2-box') {
                        el.style.stroke = '#ef6c00';
                    } else if (id === 'scene4-result3-box' || id === 'scene4-cause3-box') {
                        el.style.stroke = '#c62828';
                    }
                }
            });
        }

        // 高亮指定结果框和原因框
        function highlightResult(resultBoxId, causeBoxId) {
            const resultBox = document.getElementById(resultBoxId);
            const causeBox = document.getElementById(causeBoxId);
            if (resultBox) {
                resultBox.classList.add('highlight');
            }
            if (causeBox) {
                causeBox.classList.add('highlight');
            }
        }

        // 事件监听
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateDisplay();
            }
        });

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
