<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>引物结合位置与方向 - PCR 技术</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        /* 元素显隐控制 */
        .hidden {
            display: none;
            opacity: 0;
        }
        .visible {
            display: block;
            opacity: 1;
        }
        /* 按钮样式 */
        .btn {
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-prev {
            background: #757575;
            color: white;
        }
        .btn-next {
            background: #1565c0;
            color: white;
        }
        /* 步骤指示器 */
        #scene2-step-indicator {
            font-size: 14px;
            color: #333;
            text-anchor: middle;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 标题 -->
            <text id="scene2-title" x="400" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">引物结合位置与方向</text>

            <!-- a 链（上方模板链） -->
            <line id="scene2-chain-a-line" x1="140" y1="85" x2="660" y2="85" stroke="#000" stroke-width="3"/>
            <text id="scene2-chain-a-label" x="50" y="90" font-size="14" fill="#333">a 链</text>
            <text id="scene2-chain-a-5prime" x="115" y="80" font-size="12" fill="#333">5'</text>
            <text id="scene2-chain-a-3prime" x="675" y="80" font-size="12" fill="#333">3'</text>
            <text id="scene2-chain-a-seq" x="145" y="80" font-size="13" fill="#333" font-family="monospace">G-G······T-C</text>

            <!-- b 链（下方模板链） -->
            <line id="scene2-chain-b-line" x1="140" y1="125" x2="660" y2="125" stroke="#000" stroke-width="3"/>
            <text id="scene2-chain-b-label" x="50" y="130" font-size="14" fill="#333">b 链</text>
            <text id="scene2-chain-b-3prime" x="115" y="140" font-size="12" fill="#333">3'</text>
            <text id="scene2-chain-b-5prime" x="675" y="140" font-size="12" fill="#333">5'</text>
            <text id="scene2-chain-b-seq" x="145" y="120" font-size="13" fill="#333" font-family="monospace">C-C······A-G</text>

            <!-- 引物Ⅰ序列框 -->
            <rect id="scene2-primer1-box" x="160" y="205" width="480" height="30" fill="none" stroke="#1565c0" stroke-width="2" rx="4"/>
            <text id="scene2-primer1-label" x="60" y="220" font-size="14" fill="#333">引物Ⅰ</text>
            <text id="scene2-primer1-seq" x="170" y="225" font-size="13" fill="#1565c0" font-family="monospace" class="hidden"></text>
            <line id="scene2-primer1-guide" x1="400" y1="235" x2="400" y2="340" stroke="#888" stroke-width="1" stroke-dasharray="4,4" class="hidden"/>

            <!-- 引物Ⅱ序列框 -->
            <rect id="scene2-primer2-box" x="160" y="255" width="480" height="30" fill="none" stroke="#c62828" stroke-width="2" rx="4"/>
            <text id="scene2-primer2-label" x="60" y="270" font-size="14" fill="#333">引物Ⅱ</text>
            <text id="scene2-primer2-seq" x="170" y="275" font-size="13" fill="#c62828" font-family="monospace" class="hidden"></text>
            <line id="scene2-primer2-guide" x1="400" y1="285" x2="400" y2="385" stroke="#888" stroke-width="1" stroke-dasharray="4,4" class="hidden"/>

            <!-- 结合区标题 -->
            <text id="scene2-binding-title" x="400" y="315" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">引物结合位置</text>

            <!-- 结合区 a 链 -->
            <line id="scene2-binding-chain-a" x1="140" y1="345" x2="660" y2="345" stroke="#000" stroke-width="3"/>

            <!-- 结合区 b 链 -->
            <line id="scene2-binding-chain-b" x1="140" y1="385" x2="660" y2="385" stroke="#000" stroke-width="3"/>

            <!-- 引物Ⅰ结合区（蓝色半透明） -->
            <rect id="scene2-binding-area-1" x="140" y="340" width="100" height="10" fill="#1565c0" opacity="0.3" class="hidden"/>

            <!-- 引物Ⅱ结合区（红色半透明） -->
            <rect id="scene2-binding-area-2" x="560" y="380" width="100" height="10" fill="#c62828" opacity="0.3" class="hidden"/>

            <!-- 碱基配对虚线（引物Ⅰ与 a 链） -->
            <line id="scene2-pairing-1a" x1="150" y1="340" x2="150" y2="350" stroke="#888" stroke-width="1" stroke-dasharray="3,3" class="hidden"/>
            <line id="scene2-pairing-1b" x1="170" y1="340" x2="170" y2="350" stroke="#888" stroke-width="1" stroke-dasharray="3,3" class="hidden"/>
            <line id="scene2-pairing-1c" x1="190" y1="340" x2="190" y2="350" stroke="#888" stroke-width="1" stroke-dasharray="3,3" class="hidden"/>
            <line id="scene2-pairing-1d" x1="210" y1="340" x2="210" y2="350" stroke="#888" stroke-width="1" stroke-dasharray="3,3" class="hidden"/>
            <line id="scene2-pairing-1e" x1="230" y1="340" x2="230" y2="350" stroke="#888" stroke-width="1" stroke-dasharray="3,3" class="hidden"/>

            <!-- 碱基配对虚线（引物Ⅱ与 b 链） -->
            <line id="scene2-pairing-2a" x1="570" y1="380" x2="570" y2="390" stroke="#888" stroke-width="1" stroke-dasharray="3,3" class="hidden"/>
            <line id="scene2-pairing-2b" x1="590" y1="380" x2="590" y2="390" stroke="#888" stroke-width="1" stroke-dasharray="3,3" class="hidden"/>
            <line id="scene2-pairing-2c" x1="610" y1="380" x2="610" y2="390" stroke="#888" stroke-width="1" stroke-dasharray="3,3" class="hidden"/>
            <line id="scene2-pairing-2d" x1="630" y1="380" x2="630" y2="390" stroke="#888" stroke-width="1" stroke-dasharray="3,3" class="hidden"/>
            <line id="scene2-pairing-2e" x1="650" y1="380" x2="650" y2="390" stroke="#888" stroke-width="1" stroke-dasharray="3,3" class="hidden"/>

            <!-- 引物Ⅰ方向箭头（绿色，向右） -->
            <g id="scene2-arrow-1" class="hidden">
                <line x1="245" y1="340" x2="285" y2="340" stroke="#2e7d32" stroke-width="3"/>
                <polygon points="285,340 275,335 275,345" fill="#2e7d32"/>
            </g>
            <text id="scene2-direction-label-1" x="290" y="340" font-size="12" fill="#2e7d32" class="hidden">5'→3'</text>

            <!-- 引物Ⅱ方向箭头（绿色，向右） -->
            <g id="scene2-arrow-2" class="hidden">
                <line x1="515" y1="385" x2="555" y2="385" stroke="#2e7d32" stroke-width="3"/>
                <polygon points="555,385 545,380 545,390" fill="#2e7d32"/>
            </g>
            <text id="scene2-direction-label-2" x="560" y="385" font-size="12" fill="#2e7d32" class="hidden">5'→3'</text>

            <!-- 步骤指示器 -->
            <text id="scene2-step-indicator" x="400" y="445">步骤 1/5</text>

            <!-- 上一步按钮 -->
            <rect id="scene2-btn-prev-bg" x="220" y="455" width="160" height="30" fill="#757575" rx="4"/>
            <text id="scene2-btn-prev-text" x="300" y="475" text-anchor="middle" font-size="14" font-weight="bold" fill="white">◀ 上一步</text>

            <!-- 下一步按钮 -->
            <rect id="scene2-btn-next-bg" x="420" y="455" width="160" height="30" fill="#1565c0" rx="4"/>
            <text id="scene2-btn-next-text" x="500" y="475" text-anchor="middle" font-size="14" font-weight="bold" fill="white">下一步 ▶</text>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 2: 引物结合位置与方向

        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 备注 |
        // |------|------|-----------|------|------|
        // | 标题 | text | (400,35) | ~250×24 | 居中 |
        // | a 链线段 | line | (140,85)-(660,85) | 520×3 | 上方模板链 |
        // | b 链线段 | line | (140,125)-(660,125) | 520×3 | 下方模板链 |
        // | a 链 5'标签 | text | (115,80) | ~25×14 | 左上方 |
        // | a 链 3'标签 | text | (675,80) | ~25×14 | 右上方 |
        // | b 链 3'标签 | text | (115,140) | ~25×14 | 左下方 |
        // | b 链 5'标签 | text | (675,140) | ~25×14 | 右下方 |
        // | 引物Ⅰ外框 | rect | (160,205)-(640,235) | 480×30 | 蓝色边框 |
        // | 引物Ⅱ外框 | rect | (160,255)-(640,285) | 480×30 | 红色边框 |
        // | 结合区 a 链 | line | (140,345)-(660,345) | 520×3 | 黑色实线 |
        // | 结合区 b 链 | line | (140,385)-(660,385) | 520×3 | 黑色实线 |
        // | 引物Ⅰ结合区 | rect | (140,340)-(240,350) | 100×10 | 蓝色半透明 |
        // | 引物Ⅱ结合区 | rect | (560,380)-(660,390) | 100×10 | 红色半透明 |
        // | 引物Ⅰ方向箭头 | path | (245,340)-(285,340) | 40×8 | 绿色箭头 |
        // | 引物Ⅱ方向箭头 | path | (515,385)-(555,385) | 40×8 | 绿色箭头 |
        // | 上一步按钮 | rect | (220,455)-(380,485) | 160×30 | 灰色背景 |
        // | 下一步按钮 | rect | (420,455)-(580,485) | 160×30 | 蓝色背景 |

        let currentState = 0;
        const totalSteps = 5;

        // 获取元素
        const primer1Seq = document.getElementById('scene2-primer1-seq');
        const primer2Seq = document.getElementById('scene2-primer2-seq');
        const primer1Guide = document.getElementById('scene2-primer1-guide');
        const primer2Guide = document.getElementById('scene2-primer2-guide');
        const bindingArea1 = document.getElementById('scene2-binding-area-1');
        const bindingArea2 = document.getElementById('scene2-binding-area-2');
        const pairingLines1 = ['scene2-pairing-1a', 'scene2-pairing-1b', 'scene2-pairing-1c', 'scene2-pairing-1d', 'scene2-pairing-1e'];
        const pairingLines2 = ['scene2-pairing-2a', 'scene2-pairing-2b', 'scene2-pairing-2c', 'scene2-pairing-2d', 'scene2-pairing-2e'];
        const arrow1 = document.getElementById('scene2-arrow-1');
        const arrow2 = document.getElementById('scene2-arrow-2');
        const directionLabel1 = document.getElementById('scene2-direction-label-1');
        const directionLabel2 = document.getElementById('scene2-direction-label-2');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        const btnPrevBg = document.getElementById('scene2-btn-prev-bg');
        const btnPrevText = document.getElementById('scene2-btn-prev-text');
        const btnNextBg = document.getElementById('scene2-btn-next-bg');
        const btnNextText = document.getElementById('scene2-btn-next-text');

        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.classList.remove('hidden');
                el.classList.add('visible');
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }

        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.classList.remove('visible');
                el.classList.add('hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 更新步骤显示
        function updateStep() {
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentState + 1}/${totalSteps}`;

            // 更新按钮状态
            if (currentState === 0) {
                btnPrevBg.setAttribute('fill', '#bdbdbd');
                btnPrevText.setAttribute('fill', '#757575');
            } else {
                btnPrevBg.setAttribute('fill', '#757575');
                btnPrevText.setAttribute('fill', 'white');
            }

            if (currentState === totalSteps - 1) {
                btnNextBg.setAttribute('fill', '#bdbdbd');
                btnNextText.setAttribute('fill', '#757575');
            } else {
                btnNextBg.setAttribute('fill', '#1565c0');
                btnNextText.setAttribute('fill', 'white');
            }

            // 根据当前步骤显示/隐藏元素
            // 步骤 0：初始状态 - 只显示模板链
            // 步骤 1：显示引物Ⅰ序列
            // 步骤 2：显示引物Ⅱ序列
            // 步骤 3：显示结合位置高亮和配对线
            // 步骤 4：显示方向箭头

            if (currentState >= 1) {
                // 步骤 1+：显示引物Ⅰ序列
                primer1Seq.textContent = "5'-G-G-OH";
                show(primer1Seq);
                show(primer1Guide);
            } else {
                hide(primer1Seq);
                hide(primer1Guide);
            }

            if (currentState >= 2) {
                // 步骤 2+：显示引物Ⅱ序列
                primer2Seq.textContent = "5'-C-C······A-G-3'";
                show(primer2Seq);
                show(primer2Guide);
            } else {
                hide(primer2Seq);
                hide(primer2Guide);
            }

            if (currentState >= 3) {
                // 步骤 3+：显示结合位置高亮和配对线
                show(bindingArea1);
                show(bindingArea2);
                pairingLines1.forEach(id => show(document.getElementById(id)));
                pairingLines2.forEach(id => show(document.getElementById(id)));
            } else {
                hide(bindingArea1);
                hide(bindingArea2);
                pairingLines1.forEach(id => hide(document.getElementById(id)));
                pairingLines2.forEach(id => hide(document.getElementById(id)));
            }

            if (currentState >= 4) {
                // 步骤 4：显示方向箭头
                show(arrow1);
                show(arrow2);
                show(directionLabel1);
                show(directionLabel2);
            } else {
                hide(arrow1);
                hide(arrow2);
                hide(directionLabel1);
                hide(directionLabel2);
            }
        }

        // 按钮点击事件
        btnPrevBg.addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                updateStep();
            }
        });

        btnNextBg.addEventListener('click', function() {
            if (currentState < totalSteps - 1) {
                currentState++;
                updateStep();
            }
        });

        // 添加按钮悬停效果
        btnPrevBg.addEventListener('mouseenter', function() {
            if (currentState > 0) {
                this.setAttribute('fill', '#616161');
            }
        });
        btnPrevBg.addEventListener('mouseleave', function() {
            if (currentState > 0) {
                this.setAttribute('fill', '#757575');
            }
        });

        btnNextBg.addEventListener('mouseenter', function() {
            if (currentState < totalSteps - 1) {
                this.setAttribute('fill', '#0d47a1');
            }
        });
        btnNextBg.addEventListener('mouseleave', function() {
            if (currentState < totalSteps - 1) {
                this.setAttribute('fill', '#1565c0');
            }
        });

        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
