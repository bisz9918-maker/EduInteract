<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCR DNA 复制产物与放射性标记分析</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene3-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene3-svg {
            width: 800px;
            height: 500px;
        }
        .scene3-dna-strand {
            stroke-width: 4;
            fill: none;
        }
        .scene3-original {
            stroke: #888888;
        }
        .scene3-new {
            stroke: #2e7d32;
        }
        .scene3-connector {
            stroke: #cccccc;
            stroke-width: 1;
            fill: none;
        }
        .scene3-label {
            font-size: 14px;
            fill: #333333;
            text-anchor: middle;
        }
        .scene3-stat-label {
            font-size: 16px;
            fill: #333333;
        }
        .scene3-stat-value {
            font-size: 16px;
            fill: #1565c0;
            font-weight: bold;
        }
        .scene3-ratio-result {
            font-size: 18px;
            fill: #0d47a1;
            font-weight: bold;
        }
        .scene3-slider-track {
            stroke: #1565c0;
            stroke-width: 10;
            stroke-linecap: round;
            fill: none;
        }
        .scene3-slider-handle {
            fill: #1565c0;
            cursor: pointer;
        }
        .scene3-slider-handle:hover {
            fill: #0d47a1;
        }
        .scene3-stat-panel {
            fill: #f5f5f5;
            stroke: #dddddd;
            stroke-width: 1;
        }
        .scene3-ratio-panel {
            fill: #e3f2fd;
            stroke: #90caf9;
            stroke-width: 1;
        }
        .scene3-legend-text {
            font-size: 12px;
            fill: #333333;
        }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- DNA 树状图容器 (50,80)-(380,420) -->
            <g id="scene3-dna-tree">
                <!-- 第 0 代：原始 DNA 双链 -->
                <text id="scene3-gen0-label" x="200" y="90" class="scene3-label">第 0 代</text>
                <line id="scene3-dna-0-top" x1="180" y1="108" x2="220" y2="108" class="scene3-dna-strand scene3-original"/>
                <line id="scene3-dna-0-bottom" x1="180" y1="116" x2="220" y2="116" class="scene3-dna-strand scene3-original"/>
                <text id="scene3-original-label" x="240" y="110" class="scene3-legend-text">原始模板 (无³²P)</text>
                <text id="scene3-new-label" x="240" y="128" class="scene3-legend-text">新合成链 (³²P)</text>

                <!-- 连接线到第 1 代 -->
                <line id="scene3-conn-0-1l" x1="200" y1="116" x2="140" y2="180" class="scene3-connector"/>
                <line id="scene3-conn-0-1r" x1="200" y1="116" x2="260" y2="180" class="scene3-connector"/>

                <!-- 第 1 代：2 个 DNA 分子 -->
                <text id="scene3-gen1-label" x="200" y="170" class="scene3-label">第 1 代</text>
                <!-- 左分子 -->
                <line id="scene3-dna-1l-top" x1="120" y1="188" x2="160" y2="188" class="scene3-dna-strand scene3-original"/>
                <line id="scene3-dna-1l-bottom" x1="120" y1="196" x2="160" y2="196" class="scene3-dna-strand scene3-new"/>
                <!-- 右分子 -->
                <line id="scene3-dna-1r-top" x1="240" y1="188" x2="280" y2="188" class="scene3-dna-strand scene3-original"/>
                <line id="scene3-dna-1r-bottom" x1="240" y1="196" x2="280" y2="196" class="scene3-dna-strand scene3-new"/>

                <!-- 连接线到第 2 代 -->
                <line id="scene3-conn-1l-2a" x1="140" y1="196" x2="100" y2="280" class="scene3-connector"/>
                <line id="scene3-conn-1l-2b" x1="140" y1="196" x2="180" y2="280" class="scene3-connector"/>
                <line id="scene3-conn-1r-2c" x1="260" y1="196" x2="220" y2="280" class="scene3-connector"/>
                <line id="scene3-conn-1r-2d" x1="260" y1="196" x2="300" y2="280" class="scene3-connector"/>

                <!-- 第 2 代：4 个 DNA 分子 -->
                <text id="scene3-gen2-label" x="200" y="270" class="scene3-label">第 2 代</text>
                <!-- 分子 1 -->
                <line id="scene3-dna-2a-top" x1="80" y1="288" x2="120" y2="288" class="scene3-dna-strand scene3-original"/>
                <line id="scene3-dna-2a-bottom" x1="80" y1="296" x2="120" y2="296" class="scene3-dna-strand scene3-new"/>
                <!-- 分子 2 -->
                <line id="scene3-dna-2b-top" x1="160" y1="288" x2="200" y2="288" class="scene3-dna-strand scene3-new"/>
                <line id="scene3-dna-2b-bottom" x1="160" y1="296" x2="200" y2="296" class="scene3-dna-strand scene3-original"/>
                <!-- 分子 3 -->
                <line id="scene3-dna-2c-top" x1="200" y1="288" x2="240" y2="288" class="scene3-dna-strand scene3-original"/>
                <line id="scene3-dna-2c-bottom" x1="200" y1="296" x2="240" y2="296" class="scene3-dna-strand scene3-new"/>
                <!-- 分子 4 -->
                <line id="scene3-dna-2d-top" x1="280" y1="288" x2="320" y2="288" class="scene3-dna-strand scene3-new"/>
                <line id="scene3-dna-2d-bottom" x1="280" y1="296" x2="320" y2="296" class="scene3-dna-strand scene3-original"/>

                <!-- 第 3 代及以后（简化示意，n>2 时显示） -->
                <g id="scene3-gen3-group" style="opacity: 0;">
                    <text x="200" y="370" class="scene3-label">第 3 代及以后...</text>
                    <text x="200" y="390" class="scene3-label" style="font-size: 12px; fill: #666;">DNA 分子数 = 2ⁿ</text>
                </g>
            </g>

            <!-- 统计面板 (420,80)-(780,280) -->
            <rect id="scene3-stat-bg" x="420" y="80" width="360" height="200" class="scene3-stat-panel" rx="8"/>
            <text id="scene3-stat-title" x="600" y="108" class="scene3-stat-label" text-anchor="middle" font-weight="bold">循环次数 n = <tspan id="scene3-stat-n" fill="#1565c0">1</tspan></text>
            <text id="scene3-stat-total-label" x="440" y="140" class="scene3-stat-label">DNA 分子总数：2ⁿ = </text>
            <text id="scene3-stat-total-value" x="580" y="140" class="scene3-stat-value">2</text>
            <text id="scene3-stat-chain-label" x="440" y="170" class="scene3-stat-label">DNA 单链总数：2ⁿ⁺¹ = </text>
            <text id="scene3-stat-chain-value" x="600" y="170" class="scene3-stat-value">4</text>
            <text id="scene3-stat-radio-label" x="440" y="200" class="scene3-stat-label">含³²P 单链数： </text>
            <text id="scene3-stat-radio-value" x="560" y="200" class="scene3-stat-value">2</text>
            <text id="scene3-stat-noradio-label" x="440" y="230" class="scene3-stat-label">不含³²P 单链数： </text>
            <text id="scene3-stat-noradio-value" x="580" y="230" class="scene3-stat-value">2</text>
            <text id="scene3-stat-ratio-label" x="440" y="260" class="scene3-stat-label">不含放射性比例 = 2/2ⁿ⁺¹ = </text>
            <text id="scene3-stat-ratio-value" x="640" y="260" class="scene3-stat-value">1/2</text>

            <!-- 滑块控制区 (420,320)-(780,380) -->
            <text id="scene3-slider-label" x="430" y="350" class="scene3-stat-label" text-anchor="end">n =</text>
            <line id="scene3-slider-track" x1="450" y1="355" x2="750" y2="355" class="scene3-slider-track"/>
            <!-- 滑块刻度 -->
            <g id="scene3-slider-ticks">
                <line x1="450" y1="350" x2="450" y2="360" stroke="#1565c0" stroke-width="2"/>
                <line x1="483" y1="352" x2="483" y2="358" stroke="#1565c0" stroke-width="1"/>
                <line x1="517" y1="352" x2="517" y2="358" stroke="#1565c0" stroke-width="1"/>
                <line x1="550" y1="352" x2="550" y2="358" stroke="#1565c0" stroke-width="1"/>
                <line x1="583" y1="352" x2="583" y2="358" stroke="#1565c0" stroke-width="1"/>
                <line x1="617" y1="352" x2="617" y2="358" stroke="#1565c0" stroke-width="1"/>
                <line x1="650" y1="352" x2="650" y2="358" stroke="#1565c0" stroke-width="1"/>
                <line x1="683" y1="352" x2="683" y2="358" stroke="#1565c0" stroke-width="1"/>
                <line x1="717" y1="352" x2="717" y2="358" stroke="#1565c0" stroke-width="1"/>
                <line x1="750" y1="350" x2="750" y2="360" stroke="#1565c0" stroke-width="2"/>
            </g>
            <circle id="scene3-slider-handle" cx="450" cy="355" r="10" class="scene3-slider-handle"/>
            <text id="scene3-slider-value" x="770" y="360" class="scene3-stat-label">1</text>

            <!-- 比例结果面板 (420,400)-(780,440) -->
            <rect id="scene3-ratio-bg" x="420" y="400" width="360" height="40" class="scene3-ratio-panel" rx="8"/>
            <text id="scene3-ratio-result" x="600" y="425" class="scene3-ratio-result" text-anchor="middle">不含放射性单链比例 = 2/2ⁿ⁺¹ = 1/2ⁿ</text>

            <!-- 图例区 (50,450)-(380,490) -->
            <g id="scene3-legend">
                <line x1="70" y1="470" x2="110" y2="470" class="scene3-dna-strand scene3-original"/>
                <text x="120" y="474" class="scene3-legend-text">原始模板链</text>
                <line x1="220" y1="470" x2="260" y2="470" class="scene3-dna-strand scene3-new"/>
                <text x="270" y="474" class="scene3-legend-text">新合成链 (³²P)</text>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 3: PCR DNA 复制产物与放射性标记分析
        // 布局坐标表参考：
        // DNA 树状图容器：(50,80)-(380,420), 330×340
        // 原始 DNA 双链：(200,100)-(200,140), 40×8
        // 第 1 代 DNA 分子：(120,180) 和 (280,180)
        // 第 2 代 DNA 分子：(60,280)-(340,320), 4 个分子
        // 统计面板：(420,80)-(780,280), 360×200
        // 滑块控制区：(420,320)-(780,380)
        // 比例结果面板：(420,400)-(780,440)
        // 图例区：(50,450)-(380,490)

        const state = {
            currentN: 1,
            isDragging: false
        };

        // 获取 DOM 元素
        const sliderHandle = document.getElementById('scene3-slider-handle');
        const sliderTrack = document.getElementById('scene3-slider-track');
        const sliderValueText = document.getElementById('scene3-slider-value');
        const statN = document.getElementById('scene3-stat-n');
        const statTotal = document.getElementById('scene3-stat-total-value');
        const statChain = document.getElementById('scene3-stat-chain-value');
        const statRadio = document.getElementById('scene3-stat-radio-value');
        const statNoRadio = document.getElementById('scene3-stat-noradio-value');
        const statRatio = document.getElementById('scene3-stat-ratio-value');
        const gen3Group = document.getElementById('scene3-gen3-group');

        // 滑块轨道参数
        const trackStartX = 450;
        const trackEndX = 750;
        const trackLength = trackEndX - trackStartX;
        const maxN = 10;
        const minN = 1;

        // 更新场景显示
        function updateScene(n) {
            state.currentN = n;

            // 更新滑块位置
            const ratio = (n - minN) / (maxN - minN);
            const handleX = trackStartX + ratio * trackLength;
            sliderHandle.setAttribute('cx', handleX);

            // 更新统计面板数值
            const totalDNA = Math.pow(2, n);
            const totalChains = Math.pow(2, n + 1);
            const radioChains = totalChains - 2;
            const noRadioChains = 2;
            const ratioText = `1/${totalDNA}`;

            statN.textContent = n;
            statTotal.textContent = totalDNA;
            statChain.textContent = totalChains;
            statRadio.textContent = radioChains;
            statNoRadio.textContent = noRadioChains;
            statRatio.textContent = ratioText;
            sliderValueText.textContent = n;

            // 更新树状图显示
            updateTreeDiagram(n);
        }

        // 更新树状图
        function updateTreeDiagram(n) {
            // 第 0 代始终显示
            document.getElementById('scene3-dna-0-top').style.opacity = 1;
            document.getElementById('scene3-dna-0-bottom').style.opacity = 1;
            document.getElementById('scene3-gen0-label').style.opacity = 1;

            // 第 1 代：n >= 1 时显示
            const gen1Elements = [
                'scene3-dna-1l-top', 'scene3-dna-1l-bottom',
                'scene3-dna-1r-top', 'scene3-dna-1r-bottom',
                'scene3-gen1-label',
                'scene3-conn-0-1l', 'scene3-conn-0-1r'
            ];
            gen1Elements.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.opacity = n >= 1 ? 1 : 0;
            });

            // 第 2 代：n >= 2 时显示
            const gen2Elements = [
                'scene3-dna-2a-top', 'scene3-dna-2a-bottom',
                'scene3-dna-2b-top', 'scene3-dna-2b-bottom',
                'scene3-dna-2c-top', 'scene3-dna-2c-bottom',
                'scene3-dna-2d-top', 'scene3-dna-2d-bottom',
                'scene3-gen2-label',
                'scene3-conn-1l-2a', 'scene3-conn-1l-2b',
                'scene3-conn-1r-2c', 'scene3-conn-1r-2d'
            ];
            gen2Elements.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.opacity = n >= 2 ? 1 : 0;
            });

            // 第 3 代及以后示意：n >= 3 时显示
            gen3Group.style.opacity = n >= 3 ? 1 : 0;
        }

        // 滑块拖拽事件处理
        function handleMouseDown(e) {
            state.isDragging = true;
            e.preventDefault();
        }

        function handleMouseMove(e) {
            if (!state.isDragging) return;

            const rect = sliderTrack.getBoundingClientRect();
            const svgRect = document.getElementById('scene3-svg').getBoundingClientRect();
            let clientX = e.clientX || (e.touches && e.touches[0].clientX);
            
            // 计算相对于 SVG 的 x 坐标
            const relativeX = clientX - svgRect.left;
            const clampedX = Math.max(trackStartX, Math.min(trackEndX, relativeX));
            
            // 计算 n 值
            const ratio = (clampedX - trackStartX) / trackLength;
            const n = Math.round(minN + ratio * (maxN - minN));
            
            updateScene(n);
        }

        function handleMouseUp() {
            state.isDragging = false;
        }

        // 绑定事件
        sliderHandle.addEventListener('mousedown', handleMouseDown);
        sliderHandle.addEventListener('touchstart', handleMouseDown);

        document.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('touchmove', handleMouseMove);

        document.addEventListener('mouseup', handleMouseUp);
        document.addEventListener('touchend', handleMouseUp);

        // 初始化场景
        updateScene(1);
    })();
    </script>
</body>
</html>
