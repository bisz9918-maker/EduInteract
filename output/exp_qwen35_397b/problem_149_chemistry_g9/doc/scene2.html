<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化学反应微观模拟图 - 场景 2</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        /* 分子原子颜色 */
        .scene2-atom-a { fill: #1565c0; }
        .scene2-atom-b { fill: #2e7d32; }
        .scene2-atom-c { fill: #c62828; }
        /* 框体样式 */
        .scene2-box {
            fill: #f9f9f9;
            stroke: #333;
            stroke-width: 2;
        }
        /* 箭头样式 */
        .scene2-arrow {
            fill: #333;
        }
        /* 标签文字 */
        .scene2-label {
            font-size: 14px;
            fill: #333;
        }
        .scene2-label-small {
            font-size: 12px;
            fill: #333;
        }
        /* 按钮样式 */
        .scene2-btn {
            cursor: pointer;
            rx: 5;
        }
        .scene2-btn-prev {
            fill: #9e9e9e;
        }
        .scene2-btn-next {
            fill: #1976d2;
        }
        .scene2-btn-text {
            font-size: 14px;
            fill: #fff;
            text-anchor: middle;
            dominant-baseline: middle;
        }
        .scene2-btn-disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        /* 答案框样式 */
        .scene2-answer-box {
            fill: #2e7d32;
        }
        .scene2-answer-text {
            font-size: 14px;
            fill: #fff;
            text-anchor: middle;
        }
        /* 方程式框样式 */
        .scene2-equation-box {
            fill: #fff;
            stroke: #333;
            stroke-width: 1;
        }
        .scene2-equation-text {
            font-size: 13px;
            fill: #333;
            text-anchor: middle;
        }
        /* 淡入动画 */
        .scene2-fade-in {
            animation: scene2FadeIn 300ms ease-in-out;
        }
        @keyframes scene2FadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        /* 隐藏类 */
        .scene2-hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 反应物框甲 -->
            <rect id="scene2-box-reactant" class="scene2-box" x="50" y="50" width="300" height="150"/>
            
            <!-- 生成物框乙 -->
            <rect id="scene2-box-product" class="scene2-box scene2-hidden" x="450" y="50" width="300" height="150"/>
            
            <!-- 反应箭头 -->
            <g id="scene2-arrow-group" class="scene2-hidden">
                <path class="scene2-arrow" d="M 360 115 L 420 115 L 420 105 L 440 125 L 420 145 L 420 135 L 360 135 Z"/>
            </g>
            
            <!-- 甲框内分子：4个a₂分子 -->
            <g id="scene2-mol-a2-group">
                <!-- a₂分子1 -->
                <g class="scene2-mol-a2">
                    <circle class="scene2-atom-a" cx="80" cy="90" r="6"/>
                    <circle class="scene2-atom-a" cx="92" cy="90" r="6"/>
                </g>
                <!-- a₂分子2 -->
                <g class="scene2-mol-a2">
                    <circle class="scene2-atom-a" cx="120" cy="90" r="6"/>
                    <circle class="scene2-atom-a" cx="132" cy="90" r="6"/>
                </g>
                <!-- a₂分子3 -->
                <g class="scene2-mol-a2">
                    <circle class="scene2-atom-a" cx="80" cy="130" r="6"/>
                    <circle class="scene2-atom-a" cx="92" cy="130" r="6"/>
                </g>
                <!-- a₂分子4 -->
                <g class="scene2-mol-a2">
                    <circle class="scene2-atom-a" cx="120" cy="130" r="6"/>
                    <circle class="scene2-atom-a" cx="132" cy="130" r="6"/>
                </g>
            </g>
            
            <!-- 甲框内分子：2个cb₂c分子 -->
            <g id="scene2-mol-cb2c-group">
                <!-- cb₂c分子1 -->
                <g class="scene2-mol-cb2c">
                    <circle class="scene2-atom-c" cx="220" cy="90" r="14"/>
                    <circle class="scene2-atom-b" cx="245" cy="90" r="10"/>
                    <circle class="scene2-atom-b" cx="265" cy="90" r="10"/>
                    <circle class="scene2-atom-c" cx="290" cy="90" r="14"/>
                </g>
                <!-- cb₂c分子2 -->
                <g class="scene2-mol-cb2c">
                    <circle class="scene2-atom-c" cx="220" cy="150" r="14"/>
                    <circle class="scene2-atom-b" cx="245" cy="150" r="10"/>
                    <circle class="scene2-atom-b" cx="265" cy="150" r="10"/>
                    <circle class="scene2-atom-c" cx="290" cy="150" r="14"/>
                </g>
            </g>
            
            <!-- 乙框内分子：2个c原子 -->
            <g id="scene2-mol-c-group" class="scene2-hidden">
                <circle class="scene2-atom-c" cx="480" cy="90" r="14"/>
                <circle class="scene2-atom-c" cx="520" cy="150" r="14"/>
            </g>
            
            <!-- 乙框内分子：2个b₂分子 -->
            <g id="scene2-mol-b2-group" class="scene2-hidden">
                <g class="scene2-mol-b2">
                    <circle class="scene2-atom-b" cx="580" cy="80" r="10"/>
                    <circle class="scene2-atom-b" cx="596" cy="80" r="10"/>
                </g>
                <g class="scene2-mol-b2">
                    <circle class="scene2-atom-b" cx="580" cy="120" r="10"/>
                    <circle class="scene2-atom-b" cx="596" cy="120" r="10"/>
                </g>
            </g>
            
            <!-- 乙框内分子：4个a₂b分子 -->
            <g id="scene2-mol-a2b-group" class="scene2-hidden">
                <g class="scene2-mol-a2b">
                    <circle class="scene2-atom-a" cx="640" cy="70" r="6"/>
                    <circle class="scene2-atom-a" cx="652" cy="70" r="6"/>
                    <circle class="scene2-atom-b" cx="664" cy="70" r="10"/>
                </g>
                <g class="scene2-mol-a2b">
                    <circle class="scene2-atom-a" cx="680" cy="90" r="6"/>
                    <circle class="scene2-atom-a" cx="692" cy="90" r="6"/>
                    <circle class="scene2-atom-b" cx="704" cy="90" r="10"/>
                </g>
                <g class="scene2-mol-a2b">
                    <circle class="scene2-atom-a" cx="640" cy="140" r="6"/>
                    <circle class="scene2-atom-a" cx="652" cy="140" r="6"/>
                    <circle class="scene2-atom-b" cx="664" cy="140" r="10"/>
                </g>
                <g class="scene2-mol-a2b">
                    <circle class="scene2-atom-a" cx="680" cy="160" r="6"/>
                    <circle class="scene2-atom-a" cx="692" cy="160" r="6"/>
                    <circle class="scene2-atom-b" cx="704" cy="160" r="10"/>
                </g>
            </g>
            
            <!-- 标签：甲 -->
            <text id="scene2-label-jia" class="scene2-label" x="200" y="220" text-anchor="middle">甲</text>
            
            <!-- 标签：乙 -->
            <text id="scene2-label-yi" class="scene2-label scene2-hidden" x="600" y="220" text-anchor="middle">乙</text>
            
            <!-- 分子数量标签 -->
            <text id="scene2-label-4a2" class="scene2-label-small" x="100" y="170" text-anchor="middle">4a₂</text>
            <text id="scene2-label-2cb2c" class="scene2-label-small" x="240" y="190" text-anchor="middle">2cb₂c</text>
            <text id="scene2-label-2c" class="scene2-label-small scene2-hidden" x="500" y="190" text-anchor="middle">2c</text>
            <text id="scene2-label-2b2" class="scene2-label-small scene2-hidden" x="580" y="190" text-anchor="middle">2b₂</text>
            <text id="scene2-label-4a2b" class="scene2-label-small scene2-hidden" x="660" y="190" text-anchor="middle">4a₂b</text>
            
            <!-- 反应类型标题 -->
            <text id="scene2-label-type-title" class="scene2-label scene2-hidden" x="150" y="260">反应类型：</text>
            
            <!-- 反应类型答案框 -->
            <g id="scene2-type-answer-group" class="scene2-hidden">
                <rect class="scene2-answer-box" x="260" y="245" width="120" height="30"/>
                <text class="scene2-answer-text" x="320" y="260">分解反应</text>
            </g>
            
            <!-- 化学方程式标题 -->
            <text id="scene2-label-eq-title" class="scene2-label scene2-hidden" x="150" y="310">化学方程式：</text>
            
            <!-- 化学方程式框 -->
            <g id="scene2-equation-group" class="scene2-hidden">
                <rect class="scene2-equation-box" x="260" y="295" width="400" height="40"/>
                <text class="scene2-equation-text" x="460" y="315">4a₂ + 2cb₂c → 2c + 2b₂ + 4a₂b</text>
                <text class="scene2-equation-text" x="460" y="330" style="font-size: 11px; fill: #666;">简化：2a₂ + cb₂c → c + b₂ + 2a₂b</text>
            </g>
            
            <!-- 步骤指示器 -->
            <text id="scene2-step-indicator" class="scene2-label" x="400" y="440" text-anchor="middle">步骤 0/5</text>
            
            <!-- 上一步按钮 -->
            <g id="scene2-btn-prev-group">
                <rect id="scene2-btn-prev" class="scene2-btn scene2-btn-prev scene2-btn-disabled" x="260" y="455" width="100" height="30"/>
                <text id="scene2-btn-prev-text" class="scene2-btn-text" x="310" y="470">◀ 上一步</text>
            </g>
            
            <!-- 下一步按钮 -->
            <g id="scene2-btn-next-group">
                <rect id="scene2-btn-next" class="scene2-btn scene2-btn-next" x="440" y="455" width="100" height="30"/>
                <text id="scene2-btn-next-text" class="scene2-btn-text" x="490" y="470">下一步 ▶</text>
            </g>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现 - 化学反应微观模拟图
        
        // 状态变量
        let currentStep = 0;
        const totalSteps = 5;
        
        // 元素引用
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnPrevText = document.getElementById('scene2-btn-prev-text');
        const btnNext = document.getElementById('scene2-btn-next');
        const btnNextText = document.getElementById('scene2-btn-next-text');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        
        // 需要逐步显示的元素
        const elementsByStep = {
            1: [
                document.getElementById('scene2-box-product'),
                document.getElementById('scene2-mol-c-group'),
                document.getElementById('scene2-mol-b2-group'),
                document.getElementById('scene2-mol-a2b-group'),
                document.getElementById('scene2-label-yi'),
                document.getElementById('scene2-label-2c'),
                document.getElementById('scene2-label-2b2'),
                document.getElementById('scene2-label-4a2b')
            ],
            2: [
                document.getElementById('scene2-arrow-group')
            ],
            3: [
                document.getElementById('scene2-label-type-title')
            ],
            4: [
                document.getElementById('scene2-type-answer-group')
            ],
            5: [
                document.getElementById('scene2-label-eq-title'),
                document.getElementById('scene2-equation-group')
            ]
        };
        
        // 工具函数：显示元素
        function showElement(el) {
            if (el) {
                el.classList.remove('scene2-hidden');
                el.classList.add('scene2-fade-in');
            }
        }
        
        // 工具函数：隐藏元素
        function hideElement(el) {
            if (el) {
                el.classList.add('scene2-hidden');
                el.classList.remove('scene2-fade-in');
            }
        }
        
        // 更新按钮状态
        function updateButtons() {
            // 上一步按钮
            if (currentStep === 0) {
                btnPrev.classList.add('scene2-btn-disabled');
                btnPrevText.style.fill = '#ccc';
            } else {
                btnPrev.classList.remove('scene2-btn-disabled');
                btnPrevText.style.fill = '#fff';
            }
            
            // 下一步按钮
            if (currentStep === totalSteps) {
                btnNext.classList.add('scene2-btn-disabled');
                btnNextText.style.fill = '#ccc';
            } else {
                btnNext.classList.remove('scene2-btn-disabled');
                btnNextText.style.fill = '#fff';
            }
            
            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + currentStep + '/' + totalSteps;
        }
        
        // 切换到指定步骤
        function goToStep(step) {
            // 确定需要显示/隐藏的元素
            for (let s = 1; s <= totalSteps; s++) {
                const elements = elementsByStep[s];
                if (elements) {
                    elements.forEach(el => {
                        if (s <= step) {
                            showElement(el);
                        } else {
                            hideElement(el);
                        }
                    });
                }
            }
            
            currentStep = step;
            updateButtons();
        }
        
        // 上一步
        function prevStep() {
            if (currentStep > 0) {
                goToStep(currentStep - 1);
            }
        }
        
        // 下一步
        function nextStep() {
            if (currentStep < totalSteps) {
                goToStep(currentStep + 1);
            }
        }
        
        // 事件绑定
        btnPrev.addEventListener('click', prevStep);
        btnNext.addEventListener('click', nextStep);
        
        // 初始化
        updateButtons();
        
    })();
    </script>
</body>
</html>
