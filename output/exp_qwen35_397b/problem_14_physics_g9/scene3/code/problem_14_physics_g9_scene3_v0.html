<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>滑轮组机械效率问题 - 选项分析</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', sans-serif;
        }
        #scene3-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        .option-btn {
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .option-btn:hover {
            filter: brightness(1.1);
        }
        .analysis-text {
            font-size: 15px;
            line-height: 32px;
            fill: #000000;
        }
        .judgment-mark {
            font-size: 32px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义渐变和滤镜 -->
            <defs>
                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.2"/>
                </filter>
            </defs>

            <!-- 选项按钮 A -->
            <g id="scene3-btn-a-group" class="option-btn">
                <rect id="scene3-btn-a-bg" x="80" y="60" width="140" height="40" rx="6" fill="#1565c0" filter="url(#shadow)"/>
                <text id="scene3-btn-a-text" x="150" y="85" text-anchor="middle" fill="#ffffff" font-size="14px" font-weight="bold">A．合力为5N</text>
            </g>

            <!-- 选项按钮 B -->
            <g id="scene3-btn-b-group" class="option-btn">
                <rect id="scene3-btn-b-bg" x="240" y="60" width="140" height="40" rx="6" fill="#1565c0" filter="url(#shadow)"/>
                <text id="scene3-btn-b-text" x="310" y="85" text-anchor="middle" fill="#ffffff" font-size="14px" font-weight="bold">B．摩擦力12N</text>
            </g>

            <!-- 选项按钮 C -->
            <g id="scene3-btn-c-group" class="option-btn">
                <rect id="scene3-btn-c-bg" x="400" y="60" width="140" height="40" rx="6" fill="#1565c0" filter="url(#shadow)"/>
                <text id="scene3-btn-c-text" x="470" y="85" text-anchor="middle" fill="#ffffff" font-size="14px" font-weight="bold">C．功率为5W</text>
            </g>

            <!-- 选项按钮 D -->
            <g id="scene3-btn-d-group" class="option-btn">
                <rect id="scene3-btn-d-bg" x="560" y="60" width="140" height="40" rx="6" fill="#1565c0" filter="url(#shadow)"/>
                <text id="scene3-btn-d-text" x="630" y="85" text-anchor="middle" fill="#ffffff" font-size="14px" font-weight="bold">D．有用功500J</text>
            </g>

            <!-- 分析区背景 -->
            <rect id="scene3-analysis-bg" x="50" y="130" width="700" height="280" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="8" filter="url(#shadow)"/>

            <!-- 分析标题 -->
            <text id="scene3-analysis-title" x="70" y="165" fill="#333333" font-size="18px" font-weight="bold">请选择一个选项进行分析</text>

            <!-- 判断标记（初始隐藏）- 移到左侧避免与滑轮组重叠 -->
            <text id="scene3-judgment-mark" x="650" y="165" fill="#2e7d32" font-size="32px" class="judgment-mark" style="opacity: 0;">✓</text>

            <!-- 计算过程区 -->
            <g id="scene3-analysis-content" style="opacity: 0;">
                <text x="70" y="205" class="analysis-text" fill="#666666">点击上方选项按钮查看详细分析</text>
            </g>

            <!-- 判断结论（初始隐藏） -->
            <text id="scene3-judgment-text" x="70" y="370" fill="#333333" font-size="16px" font-weight="bold" style="opacity: 0;"></text>

            <!-- 汇总区背景 -->
            <rect id="scene3-summary-bg" x="50" y="430" width="700" height="50" fill="#f5f5f5" rx="6"/>

            <!-- 汇总文字 -->
            <text id="scene3-summary-text" x="70" y="460" fill="#2e7d32" font-size="16px" font-weight="bold">正确答案：B</text>

            <!-- 滑轮组缩略图 - 移到右下角避免与判断标记重叠 -->
            <g id="scene3-pulley-diagram" transform="translate(580, 220)">
                <!-- 墙壁 -->
                <line x1="0" y1="0" x2="0" y2="60" stroke="#333" stroke-width="3"/>
                <line x1="0" y1="0" x2="-8" y2="0" stroke="#333" stroke-width="2"/>
                <line x1="0" y1="15" x2="-6" y2="15" stroke="#333" stroke-width="2"/>
                <line x1="0" y1="30" x2="-8" y2="30" stroke="#333" stroke-width="2"/>
                <line x1="0" y1="45" x2="-6" y2="45" stroke="#333" stroke-width="2"/>
                <line x1="0" y1="60" x2="-8" y2="60" stroke="#333" stroke-width="2"/>
                
                <!-- 地面 -->
                <line x1="0" y1="60" x2="100" y2="60" stroke="#333" stroke-width="2"/>
                <line x1="8" y1="60" x2="4" y2="64" stroke="#333" stroke-width="1.5"/>
                <line x1="16" y1="60" x2="12" y2="64" stroke="#333" stroke-width="1.5"/>
                <line x1="24" y1="60" x2="20" y2="64" stroke="#333" stroke-width="1.5"/>
                <line x1="32" y1="60" x2="28" y2="64" stroke="#333" stroke-width="1.5"/>
                <line x1="40" y1="60" x2="36" y2="64" stroke="#333" stroke-width="1.5"/>
                <line x1="48" y1="60" x2="44" y2="64" stroke="#333" stroke-width="1.5"/>
                <line x1="56" y1="60" x2="52" y2="64" stroke="#333" stroke-width="1.5"/>
                <line x1="64" y1="60" x2="60" y2="64" stroke="#333" stroke-width="1.5"/>
                <line x1="72" y1="60" x2="68" y2="64" stroke="#333" stroke-width="1.5"/>
                <line x1="80" y1="60" x2="76" y2="64" stroke="#333" stroke-width="1.5"/>
                <line x1="88" y1="60" x2="84" y2="64" stroke="#333" stroke-width="1.5"/>
                <line x1="96" y1="60" x2="92" y2="64" stroke="#333" stroke-width="1.5"/>
                
                <!-- 定滑轮（左侧） -->
                <circle cx="16" cy="30" r="10" fill="none" stroke="#555" stroke-width="2"/>
                <circle cx="16" cy="30" r="2.5" fill="#555"/>
                
                <!-- 动滑轮（右侧） -->
                <circle cx="58" cy="30" r="10" fill="none" stroke="#555" stroke-width="2"/>
                <circle cx="58" cy="30" r="2.5" fill="#555"/>
                
                <!-- 物体 A -->
                <rect x="75" y="15" width="25" height="30" fill="#e0e0e0" stroke="#555" stroke-width="2"/>
                <text x="87.5" y="35" text-anchor="middle" fill="#333" font-size="12px" font-weight="bold">A</text>
                
                <!-- 绳子路径 -->
                <path d="M 16 20 L 16 20 L 58 20" stroke="#1565c0" stroke-width="1.5" fill="none"/>
                <path d="M 16 40 L 42 32 L 58 40" stroke="#1565c0" stroke-width="1.5" fill="none"/>
                <path d="M 58 40 L 75 40" stroke="#1565c0" stroke-width="1.5" fill="none"/>
                
                <!-- 拉力 F -->
                <path d="M 48 18 L 40 18" stroke="#c62828" stroke-width="1.5"/>
                <polygon points="40,18 43,16 43,20" fill="#c62828"/>
                <text x="44" y="15" text-anchor="middle" fill="#c62828" font-size="9px" font-weight="bold">F=5N</text>
                
                <!-- 连接杆 -->
                <line x1="26" y1="30" x2="48" y2="30" stroke="#555" stroke-width="2"/>
                <line x1="68" y1="30" x2="75" y2="30" stroke="#555" stroke-width="2"/>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 3 实现 - 多状态切换分析四个选项

        // 状态定义：0=初始汇总态，1=A 选项，2=B 选项，3=C 选项，4=D 选项
        let currentState = 0;

        // 各选项的分析数据
        const optionData = {
            1: {
                title: "选项 A：物体所受合力为 5N",
                steps: [
                    "· 物体做匀速直线运动",
                    "· 根据牛顿第一定律，匀速运动时合力为 0",
                    "· 选项声称合力为 5N，与事实不符"
                ],
                isCorrect: false,
                conclusion: "该选项错误"
            },
            2: {
                title: "选项 B：物体受到的摩擦力为 12N",
                steps: [
                    "· 已知：F = 5N，η = 80%，n = 3",
                    "· 机械效率：η = f / (n·F)",
                    "· 摩擦力：f = η × n × F = 0.8 × 3 × 5 = 12N",
                    "· 计算结果与选项一致"
                ],
                isCorrect: true,
                conclusion: "该选项正确"
            },
            3: {
                title: "选项 C：拉力 F 做功的功率为 5W",
                steps: [
                    "· 已知：F = 5N，v_物 = 1m/s，n = 3",
                    "· 绳端速度：v_绳 = n × v_物 = 3 × 1 = 3m/s",
                    "· 拉力功率：P = F × v_绳 = 5 × 3 = 15W",
                    "· 选项声称 5W，与计算结果 15W 不符"
                ],
                isCorrect: false,
                conclusion: "该选项错误"
            },
            4: {
                title: "选项 D：10s 内机械所做的有用功为 500J",
                steps: [
                    "· 已知：f = 12N，v_物 = 1m/s，t = 10s",
                    "· 物体移动距离：s = v × t = 1 × 10 = 10m",
                    "· 有用功：W_有用 = f × s = 12 × 10 = 120J",
                    "· 选项声称 500J，与计算结果 120J 不符"
                ],
                isCorrect: false,
                conclusion: "该选项错误"
            }
        };

        // 获取 DOM 元素
        const btnGroups = {
            1: document.getElementById('scene3-btn-a-group'),
            2: document.getElementById('scene3-btn-b-group'),
            3: document.getElementById('scene3-btn-c-group'),
            4: document.getElementById('scene3-btn-d-group')
        };

        const btnBgs = {
            1: document.getElementById('scene3-btn-a-bg'),
            2: document.getElementById('scene3-btn-b-bg'),
            3: document.getElementById('scene3-btn-c-bg'),
            4: document.getElementById('scene3-btn-d-bg')
        };

        const analysisTitle = document.getElementById('scene3-analysis-title');
        const analysisContent = document.getElementById('scene3-analysis-content');
        const judgmentMark = document.getElementById('scene3-judgment-mark');
        const judgmentText = document.getElementById('scene3-judgment-text');

        // 更新按钮样式
        function updateButtonStyles(selectedOption) {
            for (let i = 1; i <= 4; i++) {
                const bg = btnBgs[i];
                if (i === selectedOption) {
                    // 选中状态
                    const data = optionData[i];
                    if (data.isCorrect) {
                        bg.setAttribute('fill', '#e8f5e9'); // 正确高亮背景
                    } else {
                        bg.setAttribute('fill', '#ffebee'); // 错误高亮背景
                    }
                } else {
                    // 正常状态
                    bg.setAttribute('fill', '#1565c0');
                }
            }
        }

        // 渲染分析内容
        function renderAnalysis(option) {
            if (option === 0) {
                // 初始状态
                analysisTitle.textContent = "请选择一个选项进行分析";
                analysisContent.innerHTML = '<text x="70" y="205" class="analysis-text" fill="#666666">点击上方选项按钮查看详细分析</text>';
                judgmentMark.style.opacity = '0';
                judgmentText.style.opacity = '0';
                return;
            }

            const data = optionData[option];
            
            // 更新标题
            analysisTitle.textContent = data.title;

            // 更新计算过程
            let contentHTML = '';
            data.steps.forEach((step, index) => {
                contentHTML += `<text x="70" y="${205 + index * 32}" class="analysis-text">${step}</text>`;
            });
            analysisContent.innerHTML = contentHTML;
            analysisContent.style.opacity = '1';

            // 更新判断标记
            if (data.isCorrect) {
                judgmentMark.textContent = '✓';
                judgmentMark.setAttribute('fill', '#2e7d32');
                judgmentText.setAttribute('fill', '#2e7d32');
            } else {
                judgmentMark.textContent = '✗';
                judgmentMark.setAttribute('fill', '#c62828');
                judgmentText.setAttribute('fill', '#c62828');
            }
            judgmentMark.style.opacity = '1';

            // 更新判断结论
            judgmentText.textContent = data.conclusion;
            judgmentText.style.opacity = '1';
        }

        // 点击事件处理
        function handleOptionClick(option) {
            currentState = option;
            updateButtonStyles(option);
            renderAnalysis(option);
        }

        // 绑定点击事件
        btnGroups[1].addEventListener('click', () => handleOptionClick(1));
        btnGroups[2].addEventListener('click', () => handleOptionClick(2));
        btnGroups[3].addEventListener('click', () => handleOptionClick(3));
        btnGroups[4].addEventListener('click', () => handleOptionClick(4));

        // 添加悬停效果
        for (let i = 1; i <= 4; i++) {
            btnGroups[i].addEventListener('mouseenter', () => {
                if (currentState !== i) {
                    btnBgs[i].setAttribute('fill', '#1976d2');
                }
            });
            btnGroups[i].addEventListener('mouseleave', () => {
                if (currentState !== i) {
                    btnBgs[i].setAttribute('fill', '#1565c0');
                }
            });
        }

        // 初始化
        renderAnalysis(0);
    })();
    </script>
</body>
</html>
