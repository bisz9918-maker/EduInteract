<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图甲：一氧化碳/氢气还原氧化铁</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; }
        
        /* 元素显隐控制 */
        .hidden { display: none; opacity: 0; }
        .visible { display: block; opacity: 1; }
        
        /* 动画效果 */
        .fade-in { animation: scene1-fadeIn 0.4s ease-in; }
        @keyframes scene1-fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .highlight { filter: drop-shadow(0 0 8px #ffeb3b); }
        
        .blink { animation: scene1-blink 0.5s ease-in-out infinite alternate; }
        @keyframes scene1-blink {
            from { opacity: 0.6; }
            to { opacity: 1; }
        }
        
        /* 按钮样式 */
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; box-sizing: border-box; }
        #scene1-step-indicator { font-size: 14px; color: #666; }
        .scene1-btn { padding: 8px 20px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
        #scene1-btn-prev { background: #e0e0e0; color: #666; }
        #scene1-btn-prev:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-btn-prev:not(:disabled):hover { background: #bdbdbd; }
        #scene1-btn-next { background: #1976d2; color: white; }
        #scene1-btn-next:hover { background: #1565c0; }
        
        /* 方程式框样式 */
        .equation-box { fill: rgba(240,240,240,0.9); stroke: #ccc; stroke-width: 1; }
        .equation-text { font-family: sans-serif; font-size: 14px; fill: #333; }
        
        /* 标签样式 */
        .label-text { font-family: sans-serif; font-size: 13px; fill: #333; }
        .title-text { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #333; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 标题 -->
            <text id="scene1-title" x="20" y="30" class="title-text">图甲：一氧化碳/氢气还原氧化铁</text>
            
            <!-- ========== 装置主体（始终可见） ========== -->
            <g id="scene1-device-group">
                <!-- 铁架台底座 -->
                <rect id="scene1-base" x="40" y="380" width="100" height="20" fill="#333333"/>
                <!-- 铁架台立柱 -->
                <line id="scene1-stand" x1="90" y1="200" x2="90" y2="380" stroke="#333333" stroke-width="4"/>
                <!-- 铁夹 -->
                <path id="scene1-clamp" d="M90,260 L130,260 L130,270" stroke="#333333" stroke-width="4" fill="none"/>
                <!-- 硬质玻璃管 -->
                <rect id="scene1-tube" x="120" y="240" width="300" height="40" rx="5" fill="rgba(200,220,255,0.3)" stroke="#000000" stroke-width="2"/>
                <!-- 左管口 -->
                <ellipse id="scene1-left-port" cx="120" cy="260" rx="5" ry="5" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 右管口 -->
                <ellipse id="scene1-right-port" cx="420" cy="260" rx="5" ry="5" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 氧化铁粉末 -->
                <path id="scene1-oxide-powder" d="M220,260 L320,260 L320,280 L220,280 Z" fill="#c62828" fill-opacity="0.8"/>
                <!-- 酒精喷灯主体 -->
                <rect id="scene1-lamp-body" x="240" y="320" width="60" height="40" fill="#666666" rx="3"/>
                <rect id="scene1-lamp-top" x="250" y="310" width="40" height="15" fill="#777777" rx="2"/>
                <!-- 酒精喷灯火焰 -->
                <path id="scene1-flame" d="M250,300 L270,260 L290,300 Z" fill="#ff9800" opacity="0.9"/>
            </g>
            
            <!-- ========== 步骤 1 元素：氧化铁标签 + 入口箭头 ========== -->
            <g id="scene1-step1-group" class="hidden">
                <!-- 氧化铁标签 -->
                <text id="scene1-oxide-label" x="270" y="235" class="label-text" text-anchor="middle">氧化铁</text>
                <!-- CO 入口箭头 -->
                <line id="scene1-co-arrow-line" x1="60" y1="250" x2="105" y2="250" stroke="#1565c0" stroke-width="4" marker-end="url(#scene1-arrowhead-blue)"/>
                <text id="scene1-co-label" x="65" y="235" class="label-text">CO</text>
                <!-- H₂入口箭头 -->
                <line id="scene1-h2-arrow-line" x1="60" y1="270" x2="105" y2="270" stroke="#2e7d32" stroke-width="4" marker-end="url(#scene1-arrowhead-green)"/>
                <text id="scene1-h2-label" x="65" y="285" class="label-text">H₂</text>
            </g>
            
            <!-- ========== 步骤 2 元素：CO 还原反应 ========== -->
            <g id="scene1-step2-group" class="hidden">
                <!-- 方程式框 1 -->
                <rect id="scene1-eq-box1" x="500" y="180" width="280" height="60" class="equation-box"/>
                <!-- CO 还原方程式 -->
                <text id="scene1-equation-co" x="640" y="205" class="equation-text" text-anchor="middle">3CO + Fe₂O₃ → 2Fe + 3CO₂</text>
                <!-- CO₂分子示意图 -->
                <g id="scene1-co2-molecule">
                    <circle cx="530" cy="225" r="8" fill="#1565c0"/>
                    <circle cx="520" cy="235" r="6" fill="#ef5350"/>
                    <circle cx="540" cy="235" r="6" fill="#ef5350"/>
                </g>
                <!-- CO₂出口箭头 -->
                <line id="scene1-co2-arrow-line" x1="430" y1="240" x2="475" y2="220" stroke="#1565c0" stroke-width="4" marker-end="url(#scene1-arrowhead-blue)"/>
                <text id="scene1-co2-label" x="485" y="210" class="label-text">CO₂</text>
            </g>
            
            <!-- ========== 步骤 3 元素：H₂还原反应 ========== -->
            <g id="scene1-step3-group" class="hidden">
                <!-- 方程式框 2 -->
                <rect id="scene1-eq-box2" x="500" y="280" width="280" height="60" class="equation-box"/>
                <!-- H₂还原方程式 -->
                <text id="scene1-equation-h2" x="640" y="305" class="equation-text" text-anchor="middle">3H₂ + Fe₂O₃ → 2Fe + 3H₂O</text>
                <!-- H₂O 分子示意图 -->
                <g id="scene1-h2o-molecule">
                    <circle cx="530" cy="325" r="8" fill="#2e7d32"/>
                    <circle cx="520" cy="315" r="5" fill="#1565c0"/>
                    <circle cx="540" cy="315" r="5" fill="#1565c0"/>
                </g>
                <!-- H₂O 出口箭头 -->
                <line id="scene1-h2o-arrow-line" x1="430" y1="260" x2="475" y2="280" stroke="#2e7d32" stroke-width="4" marker-end="url(#scene1-arrowhead-green)"/>
                <text id="scene1-h2o-label" x="485" y="295" class="label-text">H₂O</text>
            </g>
            
            <!-- ========== 步骤 4 元素：高亮效果 ========== -->
            <g id="scene1-step4-group" class="hidden">
                <!-- 高亮氧化铁 -->
                <path id="scene1-oxide-highlight" d="M220,260 L320,260 L320,280 L220,280 Z" fill="none" stroke="#ffeb3b" stroke-width="3" class="blink"/>
            </g>
            
            <!-- ========== 箭头标记定义 ========== -->
            <defs>
                <marker id="scene1-arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#1565c0"/>
                </marker>
                <marker id="scene1-arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#2e7d32"/>
                </marker>
            </defs>
            
            <!-- ========== 控件栏（在 SVG 内部底部） ========== -->
            <g id="scene1-controls">
                <text id="scene1-step-indicator" x="20" y="475" class="label-text">步骤 1/5</text>
                <g>
                    <rect id="scene1-btn-prev-bg" x="650" y="455" width="80" height="30" fill="#e0e0e0" rx="4"/>
                    <text id="scene1-btn-prev-text" x="690" y="475" text-anchor="middle" font-size="13" fill="#666">◀ 上一步</text>
                    <rect id="scene1-btn-next-bg" x="740" y="455" width="80" height="30" fill="#1976d2" rx="4"/>
                    <text id="scene1-btn-next-text" x="780" y="475" text-anchor="middle" font-size="13" fill="#ffffff">下一步 ▶</text>
                </g>
            </g>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现：分步导航
        
        // 状态管理
        let currentState = 0;
        const totalSteps = 5;
        
        // 元素引用
        const step1Group = document.getElementById('scene1-step1-group');
        const step2Group = document.getElementById('scene1-step2-group');
        const step3Group = document.getElementById('scene1-step3-group');
        const step4Group = document.getElementById('scene1-step4-group');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        const btnPrevBg = document.getElementById('scene1-btn-prev-bg');
        const btnPrevText = document.getElementById('scene1-btn-prev-text');
        const btnNextBg = document.getElementById('scene1-btn-next-bg');
        const btnNextText = document.getElementById('scene1-btn-next-text');
        const oxidePowder = document.getElementById('scene1-oxide-powder');
        const eqBox1 = document.getElementById('scene1-eq-box1');
        const eqBox2 = document.getElementById('scene1-eq-box2');
        
        // 显示/隐藏工具函数
        function show(el) {
            el.classList.remove('hidden');
            el.classList.add('visible');
            el.style.display = 'block';
            el.style.opacity = '1';
        }
        
        function hide(el) {
            el.classList.remove('visible');
            el.classList.add('hidden');
            el.style.display = 'none';
            el.style.opacity = '0';
        }
        
        // 更新视图
        function updateView() {
            // 隐藏所有步骤元素
            hide(step1Group);
            hide(step2Group);
            hide(step3Group);
            hide(step4Group);
            
            // 重置高亮
            oxidePowder.classList.remove('highlight');
            eqBox1.classList.remove('highlight');
            eqBox2.classList.remove('highlight');
            
            // 根据当前状态显示对应元素
            if (currentState >= 1) {
                show(step1Group);
                oxidePowder.classList.add('highlight');
            }
            if (currentState >= 2) {
                show(step2Group);
                eqBox1.classList.add('highlight');
            }
            if (currentState >= 3) {
                show(step3Group);
                eqBox2.classList.add('highlight');
            }
            if (currentState >= 4) {
                show(step4Group);
            }
            
            // 更新步骤指示器
            if (currentState === 0) {
                stepIndicator.textContent = '初始状态';
            } else if (currentState === 4) {
                stepIndicator.textContent = '完成';
            } else {
                stepIndicator.textContent = '步骤 ' + currentState + '/' + (totalSteps - 1);
            }
            
            // 更新按钮状态
            if (currentState === 0) {
                btnPrevBg.setAttribute('fill', '#e0e0e0');
                btnPrevText.setAttribute('fill', '#999');
                btnPrevText.textContent = '◀ 上一步';
            } else {
                btnPrevBg.setAttribute('fill', '#e0e0e0');
                btnPrevText.setAttribute('fill', '#666');
                btnPrevText.textContent = '◀ 上一步';
            }
            
            if (currentState >= 4) {
                btnNextBg.setAttribute('fill', '#4caf50');
                btnNextText.textContent = '完成';
            } else {
                btnNextBg.setAttribute('fill', '#1976d2');
                btnNextText.textContent = '下一步 ▶';
            }
        }
        
        // 按钮点击处理
        function handlePrevClick() {
            if (currentState > 0) {
                currentState--;
                updateView();
            }
        }
        
        function handleNextClick() {
            if (currentState < 4) {
                currentState++;
                updateView();
            }
        }
        
        // 绑定按钮事件（使用 SVG 内的点击区域）
        btnPrevBg.addEventListener('click', handlePrevClick);
        btnPrevText.addEventListener('click', handlePrevClick);
        btnNextBg.addEventListener('click', handleNextClick);
        btnNextText.addEventListener('click', handleNextClick);
        
        // 添加按钮悬停效果
        btnPrevBg.addEventListener('mouseenter', function() {
            if (currentState > 0) {
                this.setAttribute('fill', '#bdbdbd');
            }
        });
        btnPrevBg.addEventListener('mouseleave', function() {
            this.setAttribute('fill', '#e0e0e0');
        });
        btnNextBg.addEventListener('mouseenter', function() {
            if (currentState < 4) {
                this.setAttribute('fill', '#1565c0');
            }
        });
        btnNextBg.addEventListener('mouseleave', function() {
            if (currentState >= 4) {
                this.setAttribute('fill', '#4caf50');
            } else {
                this.setAttribute('fill', '#1976d2');
            }
        });
        
        // 初始化视图
        updateView();
    })();
    </script>
</body>
</html>
