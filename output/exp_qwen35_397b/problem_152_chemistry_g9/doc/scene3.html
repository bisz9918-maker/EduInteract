<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测定空气中氧气含量实验——气压变化原理示意图</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene3-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 2px solid #1565c0; background: #ffffff; border-radius: 4px; transition: all 0.3s ease; }
        .scene3-btn:hover { background: #e3f2fd; }
        .scene3-btn.active { background: #1565c0; color: #ffffff; }
        .scene3-label { font-size: 13px; fill: #333333; }
        .scene3-title { font-size: 18px; font-weight: bold; fill: #1565c0; }
        .scene3-desc { font-size: 14px; fill: #555555; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" viewBox="0 0 800 500">
            <!-- 标题 -->
            <text id="scene3-title" x="480" y="100" class="scene3-title">实验原理</text>
            
            <!-- 集气瓶轮廓 (80,150)-(280,380) -->
            <rect id="scene3-bottle" x="80" y="150" width="200" height="230" rx="10" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 瓶塞 (120,145)-(240,155) -->
            <rect id="scene3-stopper" x="120" y="145" width="120" height="10" fill="#555555"/>
            
            <!-- 燃烧匙 (160,220)-(200,260) -->
            <path id="scene3-spoon" d="M160,220 L160,240 Q160,260 180,260 Q200,260 200,240 L200,220" fill="none" stroke="#888888" stroke-width="2"/>
            <line id="scene3-spoon-handle" x1="180" y1="155" x2="180" y2="220" stroke="#888888" stroke-width="2"/>
            
            <!-- 红磷 (165,230)-(195,255) -->
            <ellipse id="scene3-phosphorus" cx="180" cy="242" rx="15" ry="12" fill="#c62828"/>
            
            <!-- 导管 (200,150)-(350,150)-(350,320) -->
            <path id="scene3-tube" d="M200,150 L200,130 Q200,120 210,120 L340,120 Q350,120 350,130 L350,320" fill="none" stroke="#000000" stroke-width="4"/>
            
            <!-- 止水夹 (335,145)-(365,155) -->
            <ellipse id="scene3-clamp" cx="350" cy="140" rx="15" ry="8" fill="#333333"/>
            
            <!-- 烧杯 (320,250)-(420,360) -->
            <rect id="scene3-beaker" x="320" y="250" width="100" height="110" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 烧杯内水 (325,280)-(415,355) -->
            <rect id="scene3-beaker-water" x="325" y="280" width="90" height="75" fill="#1565c0" opacity="0.3"/>
            
            <!-- 瓶内气压箭头 (状态 0: 长 60, 状态 1: 长 30, 状态 2: 0) -->
            <g id="scene3-pressure-arrow-inner">
                <line id="scene3-pressure-arrow-inner-line" x1="130" y1="200" x2="190" y2="200" stroke="#2e7d32" stroke-width="3"/>
                <polygon id="scene3-pressure-arrow-inner-head" points="190,200 180,195 180,205" fill="#2e7d32"/>
            </g>
            
            <!-- 瓶外气压箭头 (始终显示，长 60) -->
            <g id="scene3-pressure-arrow-outer">
                <line x1="300" y1="200" x2="240" y2="200" stroke="#2e7d32" stroke-width="3"/>
                <polygon points="240,200 250,195 250,205" fill="#2e7d32"/>
            </g>
            
            <!-- 氧气分子 (O₂) - 状态 0: 20 个，状态 1: 5 个 -->
            <g id="scene3-o2-molecules">
                <circle class="scene3-o2" cx="110" cy="180" r="4" fill="#c62828"/>
                <circle class="scene3-o2" cx="140" cy="175" r="4" fill="#c62828"/>
                <circle class="scene3-o2" cx="170" cy="185" r="4" fill="#c62828"/>
                <circle class="scene3-o2" cx="200" cy="178" r="4" fill="#c62828"/>
                <circle class="scene3-o2" cx="230" cy="182" r="4" fill="#c62828"/>
                <circle class="scene3-o2" cx="120" cy="210" r="4" fill="#c62828"/>
                <circle class="scene3-o2" cx="150" cy="215" r="4" fill="#c62828"/>
                <circle class="scene3-o2" cx="180" cy="208" r="4" fill="#c62828"/>
                <circle class="scene3-o2" cx="210" cy="212" r="4" fill="#c62828"/>
                <circle class="scene3-o2" cx="240" cy="205" r="4" fill="#c62828"/>
                <circle class="scene3-o2" cx="115" cy="240" r="4" fill="#c62828"/>
                <circle class="scene3-o2" cx="145" cy="245" r="4" fill="#c62828"/>
                <circle class="scene3-o2" cx="175" cy="238" r="4" fill="#c62828"/>
                <circle class="scene3-o2" cx="205" cy="242" r="4" fill="#c62828"/>
                <circle class="scene3-o2" cx="235" cy="235" r="4" fill="#c62828"/>
                <circle class="scene3-o2" cx="125" cy="270" r="4" fill="#c62828"/>
                <circle class="scene3-o2" cx="155" cy="275" r="4" fill="#c62828"/>
                <circle class="scene3-o2" cx="185" cy="268" r="4" fill="#c62828"/>
                <circle class="scene3-o2" cx="215" cy="272" r="4" fill="#c62828"/>
                <circle class="scene3-o2" cx="245" cy="265" r="4" fill="#c62828"/>
            </g>
            
            <!-- 其他气体分子 (N₂等) - 始终 30 个 -->
            <g id="scene3-other-molecules">
                <circle class="scene3-other" cx="105" cy="190" r="4" fill="#888888"/>
                <circle class="scene3-other" cx="135" cy="195" r="4" fill="#888888"/>
                <circle class="scene3-other" cx="165" cy="188" r="4" fill="#888888"/>
                <circle class="scene3-other" cx="195" cy="192" r="4" fill="#888888"/>
                <circle class="scene3-other" cx="225" cy="185" r="4" fill="#888888"/>
                <circle class="scene3-other" cx="255" cy="190" r="4" fill="#888888"/>
                <circle class="scene3-other" cx="110" cy="220" r="4" fill="#888888"/>
                <circle class="scene3-other" cx="140" cy="225" r="4" fill="#888888"/>
                <circle class="scene3-other" cx="170" cy="218" r="4" fill="#888888"/>
                <circle class="scene3-other" cx="200" cy="222" r="4" fill="#888888"/>
                <circle class="scene3-other" cx="230" cy="215" r="4" fill="#888888"/>
                <circle class="scene3-other" cx="260" cy="220" r="4" fill="#888888"/>
                <circle class="scene3-other" cx="108" cy="250" r="4" fill="#888888"/>
                <circle class="scene3-other" cx="138" cy="255" r="4" fill="#888888"/>
                <circle class="scene3-other" cx="168" cy="248" r="4" fill="#888888"/>
                <circle class="scene3-other" cx="198" cy="252" r="4" fill="#888888"/>
                <circle class="scene3-other" cx="228" cy="245" r="4" fill="#888888"/>
                <circle class="scene3-other" cx="258" cy="250" r="4" fill="#888888"/>
                <circle class="scene3-other" cx="112" cy="280" r="4" fill="#888888"/>
                <circle class="scene3-other" cx="142" cy="285" r="4" fill="#888888"/>
                <circle class="scene3-other" cx="172" cy="278" r="4" fill="#888888"/>
                <circle class="scene3-other" cx="202" cy="282" r="4" fill="#888888"/>
                <circle class="scene3-other" cx="232" cy="275" r="4" fill="#888888"/>
                <circle class="scene3-other" cx="262" cy="280" r="4" fill="#888888"/>
                <circle class="scene3-other" cx="118" cy="310" r="4" fill="#888888"/>
                <circle class="scene3-other" cx="148" cy="315" r="4" fill="#888888"/>
                <circle class="scene3-other" cx="178" cy="308" r="4" fill="#888888"/>
                <circle class="scene3-other" cx="208" cy="312" r="4" fill="#888888"/>
                <circle class="scene3-other" cx="238" cy="305" r="4" fill="#888888"/>
                <circle class="scene3-other" cx="268" cy="310" r="4" fill="#888888"/>
            </g>
            
            <!-- 水流动箭头 (状态 2 显示) -->
            <g id="scene3-water-flow" style="opacity: 0;">
                <line x1="340" y1="280" x2="210" y2="280" stroke="#1565c0" stroke-width="3"/>
                <polygon points="210,280 220,275 220,285" fill="#1565c0"/>
            </g>
            
            <!-- 进入瓶内的水 (状态 2/3 显示，占 1/5) -->
            <rect id="scene3-water-in-bottle" x="85" y="335" width="190" height="40" fill="#1565c0" opacity="0.5" style="opacity: 0;"/>
            
            <!-- 标签 -->
            <text id="scene3-label-pressure-inner" x="140" y="185" class="scene3-label">瓶内气压</text>
            <text id="scene3-label-pressure-outer" x="310" y="185" class="scene3-label">大气压</text>
            <text id="scene3-label-pressure-diff" x="240" y="185" class="scene3-label" style="opacity: 0;">气压差</text>
            <text id="scene3-label-water-flow" x="275" y="265" class="scene3-label" style="opacity: 0;">水流动</text>
            <text id="scene3-label-fraction" x="170" y="350" class="scene3-label" style="opacity: 0;">1/5</text>
            
            <!-- 说明文字区 -->
            <text id="scene3-desc-text" x="480" y="130" class="scene3-desc">燃烧前：瓶内外气压相等（P 内 = P 外）</text>
            
            <!-- 结论框 (状态 3 显示) -->
            <g id="scene3-conclusion-box" style="opacity: 0;">
                <rect x="470" y="350" width="300" height="80" fill="none" stroke="#1565c0" stroke-width="2"/>
                <text x="620" y="385" text-anchor="middle" class="scene3-desc" font-weight="bold">氧气约占空气体积的 1/5</text>
                <text x="620" y="410" text-anchor="middle" class="scene3-desc">（约 21%）</text>
            </g>
            
            <!-- 刻度标记 (参考原图) -->
            <g id="scene3-scale-marks">
                <line x1="75" y1="335" x2="80" y2="335" stroke="#000000" stroke-width="1"/>
                <text x="65" y="340" text-anchor="end" class="scene3-label" font-size="12">1</text>
                <line x1="75" y1="290" x2="80" y2="290" stroke="#000000" stroke-width="1"/>
                <text x="65" y="295" text-anchor="end" class="scene3-label" font-size="12">2</text>
                <line x1="75" y1="245" x2="80" y2="245" stroke="#000000" stroke-width="1"/>
                <text x="65" y="250" text-anchor="end" class="scene3-label" font-size="12">3</text>
                <line x1="75" y1="200" x2="80" y2="200" stroke="#000000" stroke-width="1"/>
                <text x="65" y="205" text-anchor="end" class="scene3-label" font-size="12">4</text>
            </g>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene3-controls">
            <button id="scene3-btn-state0" class="scene3-btn active">燃烧前</button>
            <button id="scene3-btn-state1" class="scene3-btn">燃烧后</button>
            <button id="scene3-btn-state2" class="scene3-btn">打开止水夹</button>
            <button id="scene3-btn-state3" class="scene3-btn">结论</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 3 实现 - 测定空气中氧气含量实验
        
        const currentState = { value: 0 };
        
        // 获取所有需要控制的元素
        const elements = {
            pressureArrowInner: document.getElementById('scene3-pressure-arrow-inner'),
            pressureArrowInnerLine: document.getElementById('scene3-pressure-arrow-inner-line'),
            pressureArrowInnerHead: document.getElementById('scene3-pressure-arrow-inner-head'),
            phosphorus: document.getElementById('scene3-phosphorus'),
            o2Molecules: document.getElementById('scene3-o2-molecules'),
            waterFlow: document.getElementById('scene3-water-flow'),
            waterInBottle: document.getElementById('scene3-water-in-bottle'),
            labelPressureDiff: document.getElementById('scene3-label-pressure-diff'),
            labelWaterFlow: document.getElementById('scene3-label-water-flow'),
            labelFraction: document.getElementById('scene3-label-fraction'),
            descText: document.getElementById('scene3-desc-text'),
            conclusionBox: document.getElementById('scene3-conclusion-box'),
            clamp: document.getElementById('scene3-clamp'),
            btnState0: document.getElementById('scene3-btn-state0'),
            btnState1: document.getElementById('scene3-btn-state1'),
            btnState2: document.getElementById('scene3-btn-state2'),
            btnState3: document.getElementById('scene3-btn-state3')
        };
        
        const o2Circles = document.querySelectorAll('.scene3-o2');
        
        // 更新按钮状态
        function updateButtons(activeIndex) {
            const buttons = [elements.btnState0, elements.btnState1, elements.btnState2, elements.btnState3];
            buttons.forEach((btn, idx) => {
                if (idx === activeIndex) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }
        
        // 切换状态
        function switchState(state) {
            currentState.value = state;
            updateButtons(state);
            
            // 重置所有状态相关元素
            elements.pressureArrowInner.style.opacity = '1';
            elements.pressureArrowInnerLine.setAttribute('x2', '190');
            elements.pressureArrowInnerHead.setAttribute('points', '190,200 180,195 180,205');
            elements.phosphorus.setAttribute('fill', '#c62828');
            elements.clamp.setAttribute('fill', '#333333');
            elements.waterFlow.style.opacity = '0';
            elements.waterInBottle.style.opacity = '0';
            elements.labelPressureDiff.style.opacity = '0';
            elements.labelWaterFlow.style.opacity = '0';
            elements.labelFraction.style.opacity = '0';
            elements.conclusionBox.style.opacity = '0';
            
            // 显示所有氧气分子
            o2Circles.forEach((circle, idx) => {
                circle.style.opacity = '1';
            });
            
            // 根据状态设置不同视觉效果
            switch (state) {
                case 0: // 燃烧前
                    elements.descText.textContent = '燃烧前：瓶内外气压相等（P 内 = P 外）';
                    elements.pressureArrowInnerLine.setAttribute('x2', '190');
                    elements.pressureArrowInnerHead.setAttribute('points', '190,200 180,195 180,205');
                    break;
                    
                case 1: // 燃烧后
                    elements.descText.textContent = '燃烧后冷却：氧气被消耗，瓶内气压降低（P 内 < P 外）';
                    elements.phosphorus.setAttribute('fill', '#8b0000');
                    elements.pressureArrowInnerLine.setAttribute('x2', '160');
                    elements.pressureArrowInnerHead.setAttribute('points', '160,200 150,195 150,205');
                    elements.labelPressureDiff.style.opacity = '1';
                    // 隐藏部分氧气分子（只保留 5 个）
                    o2Circles.forEach((circle, idx) => {
                        circle.style.opacity = idx < 5 ? '1' : '0';
                    });
                    break;
                    
                case 2: // 打开止水夹
                    elements.descText.textContent = '打开止水夹：大气压将水压入瓶内，填补氧气消耗的空间';
                    elements.clamp.setAttribute('fill', '#666666');
                    elements.pressureArrowInner.style.opacity = '0';
                    elements.waterFlow.style.opacity = '1';
                    elements.waterInBottle.style.opacity = '0.5';
                    elements.labelWaterFlow.style.opacity = '1';
                    elements.labelFraction.style.opacity = '1';
                    o2Circles.forEach((circle, idx) => {
                        circle.style.opacity = idx < 5 ? '1' : '0';
                    });
                    break;
                    
                case 3: // 结论
                    elements.descText.textContent = '实验结论：空气中氧气的体积分数约为 1/5（21%）';
                    elements.clamp.setAttribute('fill', '#666666');
                    elements.pressureArrowInner.style.opacity = '0';
                    elements.waterFlow.style.opacity = '1';
                    elements.waterInBottle.style.opacity = '0.5';
                    elements.labelWaterFlow.style.opacity = '1';
                    elements.labelFraction.style.opacity = '1';
                    elements.conclusionBox.style.opacity = '1';
                    o2Circles.forEach((circle, idx) => {
                        circle.style.opacity = idx < 5 ? '1' : '0';
                    });
                    break;
            }
        }
        
        // 绑定按钮事件
        elements.btnState0.addEventListener('click', () => switchState(0));
        elements.btnState1.addEventListener('click', () => switchState(1));
        elements.btnState2.addEventListener('click', () => switchState(2));
        elements.btnState3.addEventListener('click', () => switchState(3));
        
        // 初始化
        switchState(0);
    })();
    </script>
</body>
</html>
