<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测定空气中氧气含量实验</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        #scene2-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        #scene2-controls button {
            padding: 8px 20px;
            font-size: 14px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #scene2-controls button:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
        }
        #scene2-controls button:hover:not(:disabled) {
            background: #1565c0;
        }
        #scene2-step-indicator {
            font-size: 14px;
            font-weight: bold;
            min-width: 80px;
            text-align: center;
        }
        /* 白烟动画 */
        .smoke-circle {
            animation: smokeFloat 2s ease-in-out infinite;
        }
        @keyframes smokeFloat {
            0%, 100% { transform: translateY(0); opacity: 0.5; }
            50% { transform: translateY(-5px); opacity: 0.3; }
        }
        /* 红磷发光效果 */
        .glowing {
            filter: drop-shadow(0 0 8px #ff5722);
        }
        /* 水流动画 */
        .water-flow {
            animation: flowMove 1s linear infinite;
        }
        @keyframes flowMove {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 步骤说明文字 -->
            <text id="scene2-step-text" x="400" y="50" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">
                步骤 0：实验装置准备完毕，止水夹关闭
            </text>

            <!-- 集气瓶 (120,150)-(280,400) -->
            <rect id="scene2-bottle" x="120" y="150" width="160" height="250" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 集气瓶刻度线 -->
            <line x1="110" y1="370" x2="120" y2="370" stroke="#000000" stroke-width="2"/>
            <text x="95" y="375" font-size="14" fill="#000000">1</text>
            
            <line x1="110" y1="320" x2="120" y2="320" stroke="#000000" stroke-width="2"/>
            <text x="95" y="325" font-size="14" fill="#000000">2</text>
            
            <line x1="110" y1="270" x2="120" y2="270" stroke="#000000" stroke-width="2"/>
            <text x="95" y="275" font-size="14" fill="#000000">3</text>
            
            <line x1="110" y1="220" x2="120" y2="220" stroke="#000000" stroke-width="2"/>
            <text x="95" y="225" font-size="14" fill="#000000">4</text>

            <!-- 橡胶塞 (140,145)-(240,155) -->
            <rect id="scene2-rubber-stopper" x="140" y="145" width="100" height="10" fill="#333333"/>

            <!-- 燃烧匙柄 (200,150)-(200,280) -->
            <line id="scene2-spoon-handle" x1="200" y1="150" x2="200" y2="280" stroke="#000000" stroke-width="2"/>

            <!-- 燃烧匙斗 (圆心 200,290, r=25) -->
            <ellipse id="scene2-spoon-bowl" cx="200" cy="290" rx="25" ry="15" fill="none" stroke="#000000" stroke-width="2"/>

            <!-- 红磷 (185,280)-(215,300) -->
            <ellipse id="scene2-red-phosphorus" cx="200" cy="290" rx="15" ry="10" fill="#c62828"/>
            <!-- 红磷标签向右移至集气瓶外 (320,295)，避免与集气瓶重叠 -->
            <text id="scene2-red-phosphorus-label" x="320" y="295" font-size="14" fill="#000000">红磷</text>

            <!-- 集气瓶内初始水 (125,395)-(275,400) -->
            <rect id="scene2-bottle-water" x="125" y="395" width="150" height="5" fill="#1565c0" opacity="0.3"/>

            <!-- 导管水平段 (240,150)-(500,150) -->
            <line id="scene2-tube-horizontal" x1="240" y1="150" x2="500" y2="150" stroke="#000000" stroke-width="2"/>

            <!-- 导管垂直段 (500,150)-(500,350) -->
            <line id="scene2-tube-vertical" x1="500" y1="150" x2="500" y2="350" stroke="#000000" stroke-width="2"/>

            <!-- 止水夹 (470,145)-(530,155) -->
            <rect id="scene2-stopcock" x="470" y="145" width="60" height="10" fill="#000000"/>
            <text id="scene2-stopcock-label" x="500" y="135" text-anchor="middle" font-size="14" fill="#000000">止水夹</text>

            <!-- 烧杯 (550,250)-(750,400) -->
            <rect id="scene2-beaker" x="550" y="250" width="200" height="150" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 烧杯内水 (555,280)-(745,395) -->
            <rect id="scene2-beaker-water" x="555" y="280" width="190" height="115" fill="#1565c0" opacity="0.3"/>
            <text id="scene2-water-label" x="760" y="340" font-size="14" fill="#000000">水</text>

            <!-- 白烟效果 (步骤 2 显示) -->
            <g id="scene2-smoke" style="display: none;">
                <circle class="smoke-circle" cx="180" cy="220" r="20" fill="#888888" opacity="0.5"/>
                <circle class="smoke-circle" cx="210" cy="240" r="25" fill="#888888" opacity="0.5" style="animation-delay: 0.3s;"/>
                <circle class="smoke-circle" cx="195" cy="260" r="18" fill="#888888" opacity="0.5" style="animation-delay: 0.6s;"/>
                <circle class="smoke-circle" cx="220" cy="280" r="22" fill="#888888" opacity="0.5" style="animation-delay: 0.9s;"/>
            </g>

            <!-- 水流效果 (步骤 5 显示) -->
            <g id="scene2-water-flow" style="display: none;">
                <circle cx="300" cy="150" r="3" fill="#1565c0" class="water-flow"/>
                <circle cx="380" cy="150" r="3" fill="#1565c0" class="water-flow" style="animation-delay: 0.3s;"/>
                <circle cx="460" cy="150" r="3" fill="#1565c0" class="water-flow" style="animation-delay: 0.6s;"/>
                <circle cx="500" cy="200" r="3" fill="#1565c0" class="water-flow" style="animation-delay: 0.2s;"/>
                <circle cx="500" cy="280" r="3" fill="#1565c0" class="water-flow" style="animation-delay: 0.5s;"/>
            </g>

            <!-- 控件栏 -->
            <g id="scene2-controls-g">
                <rect x="250" y="450" width="300" height="40" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1" rx="5"/>
            </g>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-prev-btn">◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 0/5</span>
            <button id="scene2-next-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现：测定空气中氧气含量实验

        // 状态变量
        let currentStep = 0;
        const totalSteps = 5;

        // DOM 元素引用
        const stepText = document.getElementById('scene2-step-text');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        const prevBtn = document.getElementById('scene2-prev-btn');
        const nextBtn = document.getElementById('scene2-next-btn');
        const redPhosphorus = document.getElementById('scene2-red-phosphorus');
        const smoke = document.getElementById('scene2-smoke');
        const stopcock = document.getElementById('scene2-stopcock');
        const bottleWater = document.getElementById('scene2-bottle-water');
        const beakerWater = document.getElementById('scene2-beaker-water');
        const waterFlow = document.getElementById('scene2-water-flow');

        // 步骤说明文字
        const stepDescriptions = [
            '步骤 0：实验装置准备完毕，止水夹关闭',
            '步骤 1：点燃红磷，迅速伸入集气瓶并塞紧橡胶塞',
            '步骤 2：红磷燃烧，产生大量白烟（五氧化二磷）',
            '步骤 3：燃烧结束，待集气瓶冷却至室温',
            '步骤 4：打开止水夹',
            '步骤 5：水进入集气瓶至刻度 1 处，氧气约占空气体积的 1/5'
        ];

        // 更新界面状态
        function updateStep() {
            // 更新步骤文字
            stepText.textContent = stepDescriptions[currentStep];
            stepIndicator.textContent = `步骤 ${currentStep}/${totalSteps}`;

            // 更新按钮状态
            prevBtn.disabled = currentStep === 0;
            nextBtn.disabled = currentStep === totalSteps;

            // 更新红磷状态
            if (currentStep === 0) {
                // 初始状态：未点燃
                redPhosphorus.setAttribute('fill', '#c62828');
                redPhosphorus.classList.remove('glowing');
            } else if (currentStep === 1) {
                // 点燃状态：发光
                redPhosphorus.setAttribute('fill', '#c62828');
                redPhosphorus.classList.add('glowing');
            } else if (currentStep === 2) {
                // 燃烧中：发光 + 白烟
                redPhosphorus.setAttribute('fill', '#c62828');
                redPhosphorus.classList.add('glowing');
                smoke.style.display = 'block';
                waterFlow.style.display = 'none';
            } else if (currentStep === 3) {
                // 冷却：变暗，白烟消失
                redPhosphorus.setAttribute('fill', '#8b0000');
                redPhosphorus.classList.remove('glowing');
                smoke.style.display = 'none';
                waterFlow.style.display = 'none';
            } else if (currentStep === 4) {
                // 打开止水夹
                redPhosphorus.setAttribute('fill', '#8b0000');
                stopcock.setAttribute('fill', '#2e7d32');
                waterFlow.style.display = 'none';
            } else if (currentStep === 5) {
                // 水进入集气瓶
                redPhosphorus.setAttribute('fill', '#8b0000');
                stopcock.setAttribute('fill', '#2e7d32');
                // 集气瓶水位上升至刻度 1 (y=350)
                bottleWater.setAttribute('y', '350');
                bottleWater.setAttribute('height', '50');
                // 烧杯水位略微下降
                beakerWater.setAttribute('y', '285');
                beakerWater.setAttribute('height', '110');
                waterFlow.style.display = 'block';
            }

            // 步骤 4 时止水夹打开，但水还未进入
            if (currentStep === 4) {
                stopcock.setAttribute('fill', '#2e7d32');
            } else if (currentStep < 4) {
                stopcock.setAttribute('fill', '#000000');
            }

            // 步骤 0-1 时白烟隐藏
            if (currentStep < 2) {
                smoke.style.display = 'none';
            }

            // 步骤 5 之前水位恢复初始
            if (currentStep < 5) {
                bottleWater.setAttribute('y', '395');
                bottleWater.setAttribute('height', '5');
                beakerWater.setAttribute('y', '280');
                beakerWater.setAttribute('height', '115');
            }
        }

        // 事件绑定
        prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        nextBtn.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateStep();
            }
        });

        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
