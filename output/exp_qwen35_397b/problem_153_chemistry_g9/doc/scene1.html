<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>混合气体除杂流程 - 场景1</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        .scene1-gas-tag {
            font-size: 14px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            display: inline-block;
            margin: 2px;
        }
        .scene1-remove-box {
            fill: none;
            stroke: #c62828;
            stroke-width: 2;
            stroke-dasharray: 5,3;
        }
        .scene1-remove-text {
            font-size: 13px;
            fill: #c62828;
            font-weight: bold;
        }
        .scene1-device-label {
            font-size: 16px;
            font-weight: bold;
            fill: #000000;
        }
        .scene1-reagent-label {
            font-size: 13px;
            fill: #333333;
        }
        .scene1-btn {
            cursor: pointer;
            font-size: 14px;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            background: #1976d2;
            color: white;
            transition: background 0.2s;
        }
        .scene1-btn:hover {
            background: #1565c0;
        }
        .scene1-btn:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
        }
        .scene1-step-indicator {
            font-size: 14px;
            fill: #666666;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000000" />
                </marker>
            </defs>

            <!-- ===== 装置 A：碳酸氢钠洗气瓶 ===== -->
            <!-- 瓶身 -->
            <rect id="scene1-device-a-body" x="60" y="180" width="80" height="140" fill="#ffffff" stroke="#333333" stroke-width="2" rx="3"/>
            <!-- 液体（浅蓝色） -->
            <rect id="scene1-device-a-liquid" x="65" y="240" width="70" height="75" fill="#e3f2fd" opacity="0.8"/>
            <!-- 进气管（长管插入液体） -->
            <line x1="80" y1="180" x2="80" y2="260" stroke="#333333" stroke-width="3"/>
            <!-- 出气管（短管在液面上） -->
            <line x1="120" y1="180" x2="120" y2="220" stroke="#333333" stroke-width="3"/>
            <!-- 瓶塞 -->
            <rect x="58" y="175" width="84" height="8" fill="#666666"/>

            <!-- ===== 装置 B：加热氧化铜管 ===== -->
            <!-- 玻璃管 -->
            <rect id="scene1-device-b-tube" x="220" y="200" width="160" height="60" fill="#ffffff" stroke="#333333" stroke-width="2" rx="5"/>
            <!-- 氧化铜粉末（黑色） -->
            <rect id="scene1-device-b-cuo" x="250" y="215" width="100" height="30" fill="#424242" opacity="0.7" rx="3"/>
            <!-- 铁架台 -->
            <line x1="260" y1="200" x2="260" y2="320" stroke="#666666" stroke-width="4"/>
            <line x1="240" y1="320" x2="280" y2="320" stroke="#666666" stroke-width="4"/>
            <!-- 酒精灯 -->
            <rect x="270" y="280" width="40" height="35" fill="#ff9800" opacity="0.8" rx="3"/>
            <rect x="275" y="275" width="30" height="8" fill="#666666"/>
            <!-- 火焰 -->
            <path d="M285,275 Q290,255 295,275 Q290,265 285,275" fill="#ff5722"/>
            <path d="M290,275 Q295,260 300,275 Q295,265 290,275" fill="#ff9800"/>

            <!-- ===== 装置 C：澄清石灰水洗气瓶 ===== -->
            <!-- 瓶身 -->
            <rect id="scene1-device-c-body" x="460" y="180" width="80" height="140" fill="#ffffff" stroke="#333333" stroke-width="2" rx="3"/>
            <!-- 液体（浅蓝色） -->
            <rect id="scene1-device-c-liquid" x="465" y="240" width="70" height="75" fill="#e3f2fd" opacity="0.8"/>
            <!-- 进气管 -->
            <line x1="480" y1="180" x2="480" y2="260" stroke="#333333" stroke-width="3"/>
            <!-- 出气管 -->
            <line x1="520" y1="180" x2="520" y2="220" stroke="#333333" stroke-width="3"/>
            <!-- 瓶塞 -->
            <rect x="458" y="175" width="84" height="8" fill="#666666"/>

            <!-- ===== 装置 D：浓硫酸洗气瓶 ===== -->
            <!-- 瓶身 -->
            <rect id="scene1-device-d-body" x="640" y="180" width="80" height="140" fill="#ffffff" stroke="#333333" stroke-width="2" rx="3"/>
            <!-- 液体（浅黄色） -->
            <rect id="scene1-device-d-liquid" x="645" y="240" width="70" height="75" fill="#fff9c4" opacity="0.8"/>
            <!-- 进气管 -->
            <line x1="660" y1="180" x2="660" y2="260" stroke="#333333" stroke-width="3"/>
            <!-- 出气管 -->
            <line x1="700" y1="180" x2="700" y2="220" stroke="#333333" stroke-width="3"/>
            <!-- 瓶塞 -->
            <rect x="638" y="175" width="84" height="8" fill="#666666"/>

            <!-- ===== 连接管道 ===== -->
            <!-- 进气箭头 -->
            <line x1="20" y1="220" x2="55" y2="220" stroke="#000000" stroke-width="4" marker-end="url(#scene1-arrow)"/>
            <!-- 连接管 A→B -->
            <line x1="140" y1="220" x2="220" y2="220" stroke="#000000" stroke-width="4"/>
            <!-- 连接管 B→C -->
            <line x1="380" y1="220" x2="460" y2="220" stroke="#000000" stroke-width="4"/>
            <!-- 连接管 C→D -->
            <line x1="540" y1="220" x2="640" y2="220" stroke="#000000" stroke-width="4"/>
            <!-- 出气箭头 -->
            <line x1="720" y1="220" x2="760" y2="220" stroke="#000000" stroke-width="4" marker-end="url(#scene1-arrow)"/>

            <!-- ===== 除去气体标注框（初始隐藏） ===== -->
            <!-- 装置 A 上方 -->
            <g id="scene1-remove-a" style="opacity: 0;">
                <rect class="scene1-remove-box" x="70" y="120" width="60" height="30"/>
                <text class="scene1-remove-text" x="100" y="140" text-anchor="middle">除去 HCl</text>
            </g>
            <!-- 装置 B 上方 -->
            <g id="scene1-remove-b" style="opacity: 0;">
                <rect class="scene1-remove-box" x="250" y="120" width="100" height="30"/>
                <text class="scene1-remove-text" x="300" y="140" text-anchor="middle">除去 H₂、CO</text>
            </g>
            <!-- 装置 C 上方 -->
            <g id="scene1-remove-c" style="opacity: 0;">
                <rect class="scene1-remove-box" x="460" y="120" width="80" height="30"/>
                <text class="scene1-remove-text" x="500" y="140" text-anchor="middle">除去 CO₂</text>
            </g>
            <!-- 装置 D 上方 -->
            <g id="scene1-remove-d" style="opacity: 0;">
                <rect class="scene1-remove-box" x="640" y="120" width="80" height="30"/>
                <text class="scene1-remove-text" x="680" y="140" text-anchor="middle">除去 H₂O</text>
            </g>

            <!-- ===== 装置名称标签 ===== -->
            <text class="scene1-device-label" x="100" y="340" text-anchor="middle">A</text>
            <text class="scene1-device-label" x="300" y="340" text-anchor="middle">B</text>
            <text class="scene1-device-label" x="500" y="340" text-anchor="middle">C</text>
            <text class="scene1-device-label" x="680" y="340" text-anchor="middle">D</text>

            <!-- ===== 试剂名称标签 ===== -->
            <text class="scene1-reagent-label" x="100" y="360" text-anchor="middle">碳酸氢钠溶液</text>
            <text class="scene1-reagent-label" x="300" y="170" text-anchor="middle">氧化铜</text>
            <text class="scene1-reagent-label" x="500" y="360" text-anchor="middle">澄清石灰水</text>
            <text class="scene1-reagent-label" x="680" y="360" text-anchor="middle">浓硫酸</text>

            <!-- ===== 气体成分显示区 ===== -->
            <rect x="60" y="385" width="680" height="45" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1" rx="5"/>
            <text x="75" y="412" font-size="13" fill="#666666">当前气体成分：</text>
            <g id="scene1-gas-container" transform="translate(180, 400)">
                <!-- 初始气体标签 -->
                <text id="scene1-gas-h2" class="scene1-gas-tag" style="fill: #2e7d32;">H₂</text>
                <text id="scene1-gas-n2" class="scene1-gas-tag" style="fill: #888888;" x="35">N₂</text>
                <text id="scene1-gas-hcl" class="scene1-gas-tag" style="fill: #c62828;" x="65">HCl</text>
                <text id="scene1-gas-h2o" class="scene1-gas-tag" style="fill: #00bcd4;" x="110">H₂O</text>
                <text id="scene1-gas-co" class="scene1-gas-tag" style="fill: #1565c0;" x="155">CO</text>
                <text id="scene1-gas-co2" class="scene1-gas-tag" style="fill: #ff9800;" x="195">CO₂</text>
            </g>

            <!-- ===== 控件栏 ===== -->
            <g id="scene1-controls" transform="translate(0, 450)">
                <rect x="520" y="0" width="240" height="40" fill="#ffffff" stroke="none"/>
                <!-- 上一步按钮 -->
                <rect id="scene1-btn-prev-bg" x="530" y="5" width="90" height="30" fill="#1976d2" rx="4"/>
                <text id="scene1-btn-prev-text" x="575" y="25" text-anchor="middle" fill="#ffffff" font-size="13">◀ 上一步</text>
                <!-- 步骤指示器 -->
                <text id="scene1-step-indicator" x="650" y="25" text-anchor="middle" class="scene1-step-indicator">步骤 1/5</text>
                <!-- 下一步按钮 -->
                <rect id="scene1-btn-next-bg" x="690" y="5" width="90" height="30" fill="#1976d2" rx="4"/>
                <text id="scene1-btn-next-text" x="735" y="25" text-anchor="middle" fill="#ffffff" font-size="13">下一步 ▶</text>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 1 实现：混合气体除杂流程

        // 状态管理
        let currentStep = 0;
        const totalSteps = 5;

        // 气体配置
        const gasConfig = {
            h2: { id: 'scene1-gas-h2', label: 'H₂', color: '#2e7d32', removedAt: 2 },
            n2: { id: 'scene1-gas-n2', label: 'N₂', color: '#888888', removedAt: -1 }, // 不被除去
            hcl: { id: 'scene1-gas-hcl', label: 'HCl', color: '#c62828', removedAt: 1 },
            h2o: { id: 'scene1-gas-h2o', label: 'H₂O', color: '#00bcd4', removedAt: 4 },
            co: { id: 'scene1-gas-co', label: 'CO', color: '#1565c0', removedAt: 2 },
            co2: { id: 'scene1-gas-co2', label: 'CO₂', color: '#ff9800', removedAt: 3 }
        };

        // DOM 元素缓存
        const elements = {};

        // 初始化 DOM 元素引用
        function initElements() {
            elements.removeA = document.getElementById('scene1-remove-a');
            elements.removeB = document.getElementById('scene1-remove-b');
            elements.removeC = document.getElementById('scene1-remove-c');
            elements.removeD = document.getElementById('scene1-remove-d');
            elements.stepIndicator = document.getElementById('scene1-step-indicator');
            elements.btnPrevBg = document.getElementById('scene1-btn-prev-bg');
            elements.btnPrevText = document.getElementById('scene1-btn-prev-text');
            elements.btnNextBg = document.getElementById('scene1-btn-next-bg');
            elements.btnNextText = document.getElementById('scene1-btn-next-text');

            // 气体标签
            elements.gasH2 = document.getElementById('scene1-gas-h2');
            elements.gasN2 = document.getElementById('scene1-gas-n2');
            elements.gasHcl = document.getElementById('scene1-gas-hcl');
            elements.gasH2o = document.getElementById('scene1-gas-h2o');
            elements.gasCo = document.getElementById('scene1-gas-co');
            elements.gasCo2 = document.getElementById('scene1-gas-co2');
        }

        // 更新气体标签可见性
        function updateGasVisibility(step) {
            const gases = [
                { el: elements.gasH2, config: gasConfig.h2 },
                { el: elements.gasN2, config: gasConfig.n2 },
                { el: elements.gasHcl, config: gasConfig.hcl },
                { el: elements.gasH2o, config: gasConfig.h2o },
                { el: elements.gasCo, config: gasConfig.co },
                { el: elements.gasCo2, config: gasConfig.co2 }
            ];

            gases.forEach(g => {
                if (g.config.removedAt === -1 || step < g.config.removedAt) {
                    g.el.style.opacity = '1';
                } else {
                    g.el.style.opacity = '0.3';
                }
            });
        }

        // 更新除去气体框可见性
        function updateRemoveBoxes(step) {
            const boxes = [
                { el: elements.removeA, minStep: 1 },
                { el: elements.removeB, minStep: 2 },
                { el: elements.removeC, minStep: 3 },
                { el: elements.removeD, minStep: 4 }
            ];

            boxes.forEach(b => {
                if (step >= b.minStep) {
                    b.el.style.opacity = '1';
                } else {
                    b.el.style.opacity = '0';
                }
            });
        }

        // 更新步骤指示器和按钮状态
        function updateUI() {
            elements.stepIndicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;

            // 上一步按钮状态
            if (currentStep === 0) {
                elements.btnPrevBg.setAttribute('fill', '#bdbdbd');
                elements.btnPrevText.setAttribute('fill', '#757575');
            } else {
                elements.btnPrevBg.setAttribute('fill', '#1976d2');
                elements.btnPrevText.setAttribute('fill', '#ffffff');
            }

            // 下一步按钮状态
            if (currentStep >= totalSteps - 1) {
                elements.btnNextBg.setAttribute('fill', '#bdbdbd');
                elements.btnNextText.setAttribute('fill', '#757575');
            } else {
                elements.btnNextBg.setAttribute('fill', '#1976d2');
                elements.btnNextText.setAttribute('fill', '#ffffff');
            }
        }

        // 渲染当前状态
        function render() {
            updateGasVisibility(currentStep);
            updateRemoveBoxes(currentStep);
            updateUI();
        }

        // 上一步
        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                render();
            }
        }

        // 下一步
        function nextStep() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                render();
            }
        }

        // 事件绑定
        function bindEvents() {
            const svg = document.getElementById('scene1-svg');

            // 上一步按钮点击
            svg.addEventListener('click', function(e) {
                const rect = elements.btnPrevBg.getBoundingClientRect();
                const svgRect = svg.getBoundingClientRect();
                const btnX = 530 * (svgRect.width / 800);
                const btnY = 5 * (svgRect.height / 500);
                const btnW = 90 * (svgRect.width / 800);
                const btnH = 30 * (svgRect.height / 500);

                const clickX = e.clientX - svgRect.left;
                const clickY = e.clientY - svgRect.top;

                if (clickX >= btnX && clickX <= btnX + btnW && clickY >= btnY && clickY <= btnY + btnH) {
                    if (currentStep > 0) {
                        prevStep();
                    }
                }

                // 下一步按钮点击
                const nextBtnX = 690 * (svgRect.width / 800);
                if (clickX >= nextBtnX && clickX <= nextBtnX + btnW && clickY >= btnY && clickY <= btnY + btnH) {
                    if (currentStep < totalSteps - 1) {
                        nextStep();
                    }
                }
            });

            // 鼠标悬停效果
            svg.addEventListener('mousemove', function(e) {
                const svgRect = svg.getBoundingClientRect();
                const clickX = e.clientX - svgRect.left;
                const clickY = e.clientY - svgRect.top;

                const btnY = 5 * (svgRect.height / 500);
                const btnH = 30 * (svgRect.height / 500);

                // 上一步按钮悬停
                const prevBtnX = 530 * (svgRect.width / 800);
                const prevBtnW = 90 * (svgRect.width / 800);
                if (clickX >= prevBtnX && clickX <= prevBtnX + prevBtnW && clickY >= btnY && clickY <= btnY + btnH && currentStep > 0) {
                    svg.style.cursor = 'pointer';
                } else {
                    // 下一步按钮悬停
                    const nextBtnX = 690 * (svgRect.width / 800);
                    if (clickX >= nextBtnX && clickX <= nextBtnX + prevBtnW && clickY >= btnY && clickY <= btnY + btnH && currentStep < totalSteps - 1) {
                        svg.style.cursor = 'pointer';
                    } else {
                        svg.style.cursor = 'default';
                    }
                }
            });
        }

        // 初始化
        function init() {
            initElements();
            render();
            bindEvents();
        }

        // 启动
        init();
    })();
    </script>
</body>
</html>
