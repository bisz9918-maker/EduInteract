<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可逆反应的温度依赖性</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Segoe UI', sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        
        /* 按钮样式 */
        .scene2-btn {
            padding: 8px 16px;
            font-size: 14px;
            border: 2px solid #1565c0;
            border-radius: 6px;
            background: #ffffff;
            color: #1565c0;
            cursor: pointer;
            transition: all 0.2s;
        }
        .scene2-btn:hover { background: #e3f2fd; }
        .scene2-btn.active { background: #1565c0; color: #ffffff; }
        
        /* 选项框样式 */
        .scene2-option-box {
            fill: #ffffff;
            stroke: #cccccc;
            stroke-width: 1;
        }
        .scene2-option-box.correct {
            fill: rgba(46, 125, 50, 0.3);
            stroke: #2e7d32;
            stroke-width: 2;
        }
        .scene2-option-box.wrong {
            fill: rgba(136, 136, 136, 0.1);
            stroke: #888888;
            stroke-width: 1;
        }
        
        /* 箭头样式 */
        .scene2-arrow-forward {
            stroke: #cccccc;
            stroke-width: 3;
            fill: none;
        }
        .scene2-arrow-forward.highlight {
            stroke: #c62828;
            stroke-width: 4;
        }
        .scene2-arrow-reverse {
            stroke: #cccccc;
            stroke-width: 3;
            fill: none;
        }
        .scene2-arrow-reverse.highlight {
            stroke: #2e7d32;
            stroke-width: 4;
        }
        
        /* 容器样式 */
        .scene2-container-rect {
            fill: #e3f2fd;
            stroke: #1565c0;
            stroke-width: 2;
        }
        .scene2-pipe {
            fill: #bbdefb;
            stroke: #1565c0;
            stroke-width: 1;
        }
        
        /* 温度标签 */
        .scene2-temp-label {
            font-size: 14px;
            font-weight: bold;
            fill: #1565c0;
        }
        .scene2-temp-label.dim {
            fill: #888888;
        }
        
        /* 流动箭头动画 */
        .scene2-flow-arrow {
            stroke: #1565c0;
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 5,5;
            opacity: 0;
        }
        .scene2-flow-arrow.animate {
            opacity: 1;
            animation: scene2-flow 1.5s linear infinite;
        }
        @keyframes scene2-flow {
            from { stroke-dashoffset: 10; }
            to { stroke-dashoffset: 0; }
        }
        
        /* 元素显隐 */
        .scene2-hidden { display: none; opacity: 0; }
        .scene2-visible { display: block; opacity: 1; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 标题 -->
            <text id="scene2-title" x="400" y="35" text-anchor="middle" font-size="16px" font-weight="bold" fill="#1565c0">可逆反应的温度依赖性</text>
            
            <!-- 900℃标签（方程式上方）- 调整位置增加间距 -->
            <text id="scene2-temp-900-top" x="400" y="70" text-anchor="middle" class="scene2-temp-label">900℃</text>
            
            <!-- 反应方程式 - 调整位置 -->
            <text id="scene2-equation" x="400" y="100" text-anchor="middle" font-size="14px" fill="#000000">
                Co(s) + 2HCl(g) ⇌ CoCl₂(g) + H₂(g)
            </text>
            
            <!-- 600℃标签（方程式下方）- 调整位置增加间距 -->
            <text id="scene2-temp-600-bottom" x="400" y="130" text-anchor="middle" class="scene2-temp-label">600℃</text>
            
            <!-- 正向反应箭头（方程式左侧） -->
            <path id="scene2-arrow-forward" d="M 280 100 L 330 100 M 320 95 L 330 100 L 320 105" class="scene2-arrow-forward"/>
            
            <!-- 逆向反应箭头（方程式右侧） -->
            <path id="scene2-arrow-reverse" d="M 520 100 L 470 100 M 480 95 L 470 100 L 480 105" class="scene2-arrow-reverse"/>
            
            <!-- 装置图 -->
            <!-- 进气管 -->
            <rect id="scene2-inlet-pipe" x="60" y="255" width="60" height="20" class="scene2-pipe"/>
            <text id="scene2-label-inlet" x="50" y="230" text-anchor="middle" font-size="13px" fill="#000000">HCl 气体</text>
            <path id="scene2-inlet-arrow" d="M 40 265 L 55 265 M 50 260 L 55 265 L 50 270" stroke="#000000" stroke-width="2" fill="none"/>
            
            <!-- 容器 1 -->
            <rect id="scene2-container1" x="120" y="240" width="180" height="50" class="scene2-container-rect"/>
            <text id="scene2-label-container1" x="210" y="230" text-anchor="middle" font-size="13px" fill="#000000">容器 1</text>
            <text id="scene2-temp-container1" x="210" y="268" text-anchor="middle" font-size="13px" fill="#1565c0" font-weight="bold">900℃</text>
            <!-- 固体颗粒示意 -->
            <g id="scene2-solid1">
                <circle cx="150" cy="265" r="2" fill="#555555"/>
                <circle cx="160" cy="260" r="2" fill="#555555"/>
                <circle cx="170" cy="268" r="2" fill="#555555"/>
                <circle cx="180" cy="262" r="2" fill="#555555"/>
                <circle cx="190" cy="270" r="2" fill="#555555"/>
                <circle cx="200" cy="264" r="2" fill="#555555"/>
                <circle cx="210" cy="268" r="2" fill="#555555"/>
                <circle cx="220" cy="262" r="2" fill="#555555"/>
                <circle cx="230" cy="270" r="2" fill="#555555"/>
                <circle cx="240" cy="265" r="2" fill="#555555"/>
                <circle cx="250" cy="268" r="2" fill="#555555"/>
                <circle cx="260" cy="263" r="2" fill="#555555"/>
                <circle cx="270" cy="270" r="2" fill="#555555"/>
            </g>
            <text id="scene2-label-solid1" x="210" y="310" text-anchor="middle" font-size="13px" fill="#000000">固体 Co</text>
            
            <!-- 连接管 -->
            <rect id="scene2-pipe-connect" x="300" y="255" width="200" height="20" class="scene2-pipe"/>
            
            <!-- 容器 2 -->
            <rect id="scene2-container2" x="500" y="240" width="180" height="50" class="scene2-container-rect"/>
            <text id="scene2-label-container2" x="590" y="230" text-anchor="middle" font-size="13px" fill="#000000">容器 2</text>
            <text id="scene2-temp-container2" x="590" y="268" text-anchor="middle" font-size="13px" fill="#1565c0" font-weight="bold">600℃</text>
            <!-- 固体颗粒示意 -->
            <g id="scene2-solid2">
                <circle cx="530" cy="265" r="2" fill="#555555"/>
                <circle cx="540" cy="260" r="2" fill="#555555"/>
                <circle cx="550" cy="268" r="2" fill="#555555"/>
                <circle cx="560" cy="262" r="2" fill="#555555"/>
                <circle cx="570" cy="270" r="2" fill="#555555"/>
                <circle cx="580" cy="264" r="2" fill="#555555"/>
                <circle cx="590" cy="268" r="2" fill="#555555"/>
                <circle cx="600" cy="262" r="2" fill="#555555"/>
                <circle cx="610" cy="270" r="2" fill="#555555"/>
                <circle cx="620" cy="265" r="2" fill="#555555"/>
                <circle cx="630" cy="268" r="2" fill="#555555"/>
                <circle cx="640" cy="263" r="2" fill="#555555"/>
                <circle cx="650" cy="270" r="2" fill="#555555"/>
            </g>
            <text id="scene2-label-solid2" x="590" y="310" text-anchor="middle" font-size="13px" fill="#000000">固体 Co</text>
            
            <!-- 出气管 -->
            <rect id="scene2-outlet-pipe" x="680" y="255" width="60" height="20" class="scene2-pipe"/>
            <text id="scene2-label-outlet" x="710" y="230" text-anchor="middle" font-size="13px" fill="#000000">产物气体</text>
            <path id="scene2-outlet-arrow" d="M 745 265 L 760 265 M 755 260 L 760 265 L 755 270" stroke="#000000" stroke-width="2" fill="none"/>
            
            <!-- 流动箭头（状态 0 显示） -->
            <path id="scene2-flow-0" class="scene2-flow-arrow" d="M 70 265 L 280 265"/>
            
            <!-- 选项框（状态 2 显示）- 调整位置 -->
            <!-- 选项 A -->
            <rect id="scene2-option-a-box" x="120" y="335" width="260" height="65" class="scene2-option-box wrong"/>
            <text id="scene2-option-a-text" x="135" y="355" font-size="12px" fill="#000000">
                <tspan x="135" dy="0">固体 Co 从容器 1 到容器 2</tspan>
                <tspan x="135" dy="16">的过程为物理变化</tspan>
            </text>
            <text id="scene2-mark-a" x="365" y="350" font-size="18px" fill="#c62828">✗</text>
            
            <!-- 选项 B -->
            <rect id="scene2-option-b-box" x="420" y="335" width="260" height="65" class="scene2-option-box wrong"/>
            <text id="scene2-option-b-text" x="435" y="355" font-size="12px" fill="#000000">
                <tspan x="435" dy="0">容器 2 中的固体是</tspan>
                <tspan x="435" dy="16">纯净的 Co</tspan>
            </text>
            <text id="scene2-mark-b" x="665" y="350" font-size="18px" fill="#c62828">✗</text>
            
            <!-- 选项 C -->
            <rect id="scene2-option-c-box" x="120" y="410" width="260" height="65" class="scene2-option-box wrong"/>
            <text id="scene2-option-c-text" x="135" y="430" font-size="12px" fill="#000000">
                <tspan x="135" dy="0">该装置最终导出的气体</tspan>
                <tspan x="135" dy="16">是 CoCl₂和 H₂</tspan>
            </text>
            <text id="scene2-mark-c" x="365" y="425" font-size="18px" fill="#c62828">✗</text>
            
            <!-- 选项 D -->
            <rect id="scene2-option-d-box" x="420" y="410" width="260" height="65" class="scene2-option-box correct"/>
            <text id="scene2-option-d-text" x="435" y="430" font-size="12px" fill="#000000">
                <tspan x="435" dy="0">容器 1 中的温度为 900℃，</tspan>
                <tspan x="435" dy="16">容器 2 中的温度为 600℃</tspan>
            </text>
            <text id="scene2-mark-d" x="665" y="425" font-size="18px" fill="#2e7d32">✓</text>
            
            <!-- 控件栏 - 调整位置，按钮文字垂直居中 -->
            <g id="scene2-controls">
                <rect x="190" y="455" width="90" height="30" rx="6" fill="#1565c0" class="scene2-btn-bg"/>
                <text id="scene2-btn-state0" x="235" y="475" text-anchor="middle" font-size="13px" fill="#ffffff" style="cursor:pointer" class="scene2-btn-text">900℃正向</text>
                
                <rect x="350" y="455" width="90" height="30" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="2" class="scene2-btn-bg"/>
                <text id="scene2-btn-state1" x="395" y="475" text-anchor="middle" font-size="13px" fill="#1565c0" style="cursor:pointer" class="scene2-btn-text">600℃逆向</text>
                
                <rect x="510" y="455" width="90" height="30" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="2" class="scene2-btn-bg"/>
                <text id="scene2-btn-state2" x="555" y="475" text-anchor="middle" font-size="13px" fill="#1565c0" style="cursor:pointer" class="scene2-btn-text">选项分析</text>
            </g>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现：可逆反应的温度依赖性
        
        let currentState = 0;
        
        // 获取所有需要控制的元素
        const elements = {
            // 温度标签
            temp900Top: document.getElementById('scene2-temp-900-top'),
            temp600Bottom: document.getElementById('scene2-temp-600-bottom'),
            tempContainer1: document.getElementById('scene2-temp-container1'),
            tempContainer2: document.getElementById('scene2-temp-container2'),
            
            // 反应箭头
            arrowForward: document.getElementById('scene2-arrow-forward'),
            arrowReverse: document.getElementById('scene2-arrow-reverse'),
            
            // 流动箭头
            flow0: document.getElementById('scene2-flow-0'),
            
            // 选项框组
            optionBoxes: [
                document.getElementById('scene2-option-a-box'),
                document.getElementById('scene2-option-b-box'),
                document.getElementById('scene2-option-c-box'),
                document.getElementById('scene2-option-d-box')
            ],
            optionTexts: [
                document.getElementById('scene2-option-a-text'),
                document.getElementById('scene2-option-b-text'),
                document.getElementById('scene2-option-c-text'),
                document.getElementById('scene2-option-d-text')
            ],
            optionMarks: [
                document.getElementById('scene2-mark-a'),
                document.getElementById('scene2-mark-b'),
                document.getElementById('scene2-mark-c'),
                document.getElementById('scene2-mark-d')
            ],
            
            // 按钮背景
            btnBg0: document.querySelector('#scene2-controls rect:nth-child(1)'),
            btnBg1: document.querySelector('#scene2-controls rect:nth-child(3)'),
            btnBg2: document.querySelector('#scene2-controls rect:nth-child(5)'),
            
            // 按钮文字
            btnText0: document.getElementById('scene2-btn-state0'),
            btnText1: document.getElementById('scene2-btn-state1'),
            btnText2: document.getElementById('scene2-btn-state2')
        };
        
        // 更新状态函数
        function updateState(state) {
            currentState = state;
            
            // 重置所有元素状态
            resetAllElements();
            
            switch(state) {
                case 0: // 900℃正向反应
                    showState0();
                    break;
                case 1: // 600℃逆向反应
                    showState1();
                    break;
                case 2: // 选项分析
                    showState2();
                    break;
            }
            
            updateButtons();
        }
        
        // 重置所有元素
        function resetAllElements() {
            // 温度标签恢复默认
            elements.temp900Top.classList.remove('dim');
            elements.temp600Bottom.classList.remove('dim');
            elements.tempContainer1.setAttribute('fill', '#1565c0');
            elements.tempContainer1.setAttribute('font-weight', 'bold');
            elements.tempContainer2.setAttribute('fill', '#1565c0');
            elements.tempContainer2.setAttribute('font-weight', 'bold');
            
            // 箭头恢复默认
            elements.arrowForward.classList.remove('highlight');
            elements.arrowReverse.classList.remove('highlight');
            
            // 隐藏流动箭头
            elements.flow0.classList.remove('animate');
            
            // 隐藏选项框
            elements.optionBoxes.forEach(box => {
                box.style.display = 'none';
                box.style.opacity = '0';
            });
            elements.optionTexts.forEach(text => {
                text.style.display = 'none';
                text.style.opacity = '0';
            });
            elements.optionMarks.forEach(mark => {
                mark.style.display = 'none';
                mark.style.opacity = '0';
            });
        }
        
        // 状态 0：900℃正向反应
        function showState0() {
            // 900℃高亮，600℃灰色
            elements.temp900Top.classList.remove('dim');
            elements.temp600Bottom.classList.add('dim');
            elements.tempContainer1.setAttribute('fill', '#1565c0');
            elements.tempContainer1.setAttribute('font-weight', 'bold');
            elements.tempContainer2.setAttribute('fill', '#888888');
            elements.tempContainer2.setAttribute('font-weight', 'normal');
            
            // 正向箭头高亮
            elements.arrowForward.classList.add('highlight');
            elements.arrowReverse.classList.remove('highlight');
            
            // 显示流动箭头动画
            elements.flow0.classList.add('animate');
        }
        
        // 状态 1：600℃逆向反应
        function showState1() {
            // 600℃高亮，900℃灰色
            elements.temp900Top.classList.add('dim');
            elements.temp600Bottom.classList.remove('dim');
            elements.tempContainer1.setAttribute('fill', '#888888');
            elements.tempContainer1.setAttribute('font-weight', 'normal');
            elements.tempContainer2.setAttribute('fill', '#1565c0');
            elements.tempContainer2.setAttribute('font-weight', 'bold');
            
            // 逆向箭头高亮
            elements.arrowForward.classList.remove('highlight');
            elements.arrowReverse.classList.add('highlight');
            
            // 隐藏流动箭头
            elements.flow0.classList.remove('animate');
        }
        
        // 状态 2：选项分析
        function showState2() {
            // 温度标签正常显示
            elements.temp900Top.classList.remove('dim');
            elements.temp600Bottom.classList.remove('dim');
            elements.tempContainer1.setAttribute('fill', '#1565c0');
            elements.tempContainer1.setAttribute('font-weight', 'bold');
            elements.tempContainer2.setAttribute('fill', '#1565c0');
            elements.tempContainer2.setAttribute('font-weight', 'bold');
            
            // 箭头正常显示
            elements.arrowForward.classList.remove('highlight');
            elements.arrowReverse.classList.remove('highlight');
            
            // 显示选项框
            elements.optionBoxes.forEach(box => {
                box.style.display = 'block';
                box.style.opacity = '1';
            });
            elements.optionTexts.forEach(text => {
                text.style.display = 'block';
                text.style.opacity = '1';
            });
            elements.optionMarks.forEach(mark => {
                mark.style.display = 'block';
                mark.style.opacity = '1';
            });
        }
        
        // 更新按钮状态
        function updateButtons() {
            // 重置所有按钮
            [elements.btnBg0, elements.btnBg1, elements.btnBg2].forEach((bg, i) => {
                bg.setAttribute('fill', '#ffffff');
                bg.setAttribute('stroke', '#1565c0');
            });
            [elements.btnText0, elements.btnText1, elements.btnText2].forEach((text, i) => {
                text.setAttribute('fill', '#1565c0');
            });
            
            // 高亮当前按钮
            const currentBg = [elements.btnBg0, elements.btnBg1, elements.btnBg2][currentState];
            const currentText = [elements.btnText0, elements.btnText1, elements.btnText2][currentState];
            currentBg.setAttribute('fill', '#1565c0');
            currentBg.setAttribute('stroke', '#1565c0');
            currentText.setAttribute('fill', '#ffffff');
        }
        
        // 绑定按钮点击事件
        elements.btnText0.addEventListener('click', () => updateState(0));
        elements.btnText1.addEventListener('click', () => updateState(1));
        elements.btnText2.addEventListener('click', () => updateState(2));
        
        // 按钮背景也绑定点击
        elements.btnBg0.addEventListener('click', () => updateState(0));
        elements.btnBg1.addEventListener('click', () => updateState(1));
        elements.btnBg2.addEventListener('click', () => updateState(2));
        
        // 初始化
        updateState(0);
    })();
    </script>
</body>
</html>
