<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化学反应微观示意图</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        /* 原子样式 */
        .scene2-atom-white {
            fill: #ffffff;
            stroke: #000000;
            stroke-width: 2;
        }
        .scene2-atom-black {
            fill: #000000;
            stroke: none;
        }
        /* 化学键样式 */
        .scene2-bond-normal {
            stroke: #000000;
            stroke-width: 3;
            fill: none;
        }
        .scene2-bond-breaking {
            stroke: #c62828;
            stroke-width: 3;
            fill: none;
            stroke-dasharray: 5,3;
        }
        .scene2-bond-forming {
            stroke: #2e7d32;
            stroke-width: 3;
            fill: none;
            stroke-dasharray: 5,3;
        }
        /* 轨迹线样式 */
        .scene2-trajectory {
            stroke: #888888;
            stroke-width: 1;
            fill: none;
            stroke-dasharray: 2,2;
            opacity: 0.5;
        }
        /* 文字样式 */
        .scene2-title {
            font-size: 16px;
            fill: #333333;
            text-anchor: middle;
        }
        .scene2-process-label {
            font-size: 14px;
            fill: #666666;
            text-anchor: middle;
        }
        .scene2-conclusion {
            font-size: 16px;
            fill: #2e7d32;
            font-weight: bold;
            text-anchor: middle;
        }
        /* 按钮样式 */
        .scene2-btn {
            fill: #4a90d9;
            stroke: none;
            cursor: pointer;
        }
        .scene2-btn-disabled {
            fill: #cccccc;
            cursor: not-allowed;
        }
        .scene2-btn-text {
            font-size: 14px;
            fill: #ffffff;
            text-anchor: middle;
            dominant-baseline: middle;
        }
        .scene2-step-text {
            font-size: 14px;
            fill: #666666;
            text-anchor: middle;
        }
        /* 显隐控制 */
        .scene2-hidden {
            display: none;
            opacity: 0;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <!-- 定义原子模板 -->
            <defs>
                <symbol id="scene2-atom-w" viewBox="0 0 20 20">
                    <circle cx="10" cy="10" r="10" class="scene2-atom-white"/>
                </symbol>
                <symbol id="scene2-atom-b" viewBox="0 0 20 20">
                    <circle cx="10" cy="10" r="10" class="scene2-atom-black"/>
                </symbol>
            </defs>

            <!-- 阶段标题 -->
            <text id="scene2-title-reactants" x="400" y="35" class="scene2-title">反应物</text>
            <text id="scene2-title-atoms" x="400" y="185" class="scene2-title">游离原子</text>
            <text id="scene2-title-products" x="400" y="335" class="scene2-title">生成物</text>

            <!-- 过程标签 -->
            <text id="scene2-process-break" x="400" y="150" class="scene2-process-label scene2-hidden">化学键断裂</text>
            <text id="scene2-process-rearrange" x="400" y="280" class="scene2-process-label scene2-hidden">原子重组</text>
            <text id="scene2-process-form" x="400" y="320" class="scene2-process-label scene2-hidden">化学键形成</text>

            <!-- 结论标签 -->
            <text id="scene2-conclusion" x="400" y="420" class="scene2-conclusion scene2-hidden">化合反应：多变一</text>

            <!-- 反应物区分子 (y=70) -->
            <!-- 分子 A1: ○○ at (200,70) -->
            <g id="scene2-mol-a1">
                <use href="#scene2-atom-w" x="170" y="60"/>
                <use href="#scene2-atom-w" x="210" y="60"/>
                <line id="scene2-bond-a1" x1="180" y1="60" x2="200" y2="60" class="scene2-bond-normal"/>
            </g>

            <!-- 分子 A2: ○○ at (320,70) -->
            <g id="scene2-mol-a2">
                <use href="#scene2-atom-w" x="290" y="60"/>
                <use href="#scene2-atom-w" x="330" y="60"/>
                <line id="scene2-bond-a2" x1="300" y1="60" x2="320" y2="60" class="scene2-bond-normal"/>
            </g>

            <!-- 分子 B: ●● at (440,70) -->
            <g id="scene2-mol-b">
                <use href="#scene2-atom-b" x="410" y="60"/>
                <use href="#scene2-atom-b" x="450" y="60"/>
                <line id="scene2-bond-b" x1="420" y1="60" x2="440" y2="60" class="scene2-bond-normal"/>
            </g>

            <!-- 分子 A3(剩余): ○○ at (560,70) -->
            <g id="scene2-mol-a3">
                <use href="#scene2-atom-w" x="530" y="60"/>
                <use href="#scene2-atom-w" x="570" y="60"/>
                <line id="scene2-bond-a3" x1="540" y1="60" x2="560" y2="60" class="scene2-bond-normal"/>
            </g>

            <!-- 游离原子区 (y=210) -->
            <!-- 白色原子 O1-O4 -->
            <g id="scene2-atoms-free" class="scene2-hidden">
                <use href="#scene2-atom-w" x="170" y="200" id="scene2-atom-w1"/>
                <use href="#scene2-atom-w" x="250" y="200" id="scene2-atom-w2"/>
                <use href="#scene2-atom-w" x="330" y="200" id="scene2-atom-w3"/>
                <use href="#scene2-atom-w" x="410" y="200" id="scene2-atom-w4"/>
                <use href="#scene2-atom-b" x="370" y="200" id="scene2-atom-b1"/>
                <use href="#scene2-atom-b" x="450" y="200" id="scene2-atom-b2"/>
            </g>

            <!-- 生成物区 (y=370) -->
            <!-- 分子 C1: ○●○ at (320,370) -->
            <g id="scene2-mol-c1" class="scene2-hidden">
                <use href="#scene2-atom-w" x="290" y="360"/>
                <use href="#scene2-atom-b" x="320" y="360"/>
                <use href="#scene2-atom-w" x="350" y="360"/>
                <line id="scene2-bond-c1-left" x1="300" y1="360" x2="310" y2="360" class="scene2-bond-forming"/>
                <line id="scene2-bond-c1-right" x1="330" y1="360" x2="340" y2="360" class="scene2-bond-forming"/>
            </g>

            <!-- 分子 C2: ○●○ at (480,370) -->
            <g id="scene2-mol-c2" class="scene2-hidden">
                <use href="#scene2-atom-w" x="450" y="360"/>
                <use href="#scene2-atom-b" x="480" y="360"/>
                <use href="#scene2-atom-w" x="510" y="360"/>
                <line id="scene2-bond-c2-left" x1="460" y1="360" x2="470" y2="360" class="scene2-bond-forming"/>
                <line id="scene2-bond-c2-right" x1="490" y1="360" x2="500" y2="360" class="scene2-bond-forming"/>
            </g>

            <!-- 分子 A4(剩余): ○○ at (600,370) -->
            <g id="scene2-mol-a4" class="scene2-hidden">
                <use href="#scene2-atom-w" x="570" y="360"/>
                <use href="#scene2-atom-w" x="610" y="360"/>
                <line id="scene2-bond-a4" x1="580" y1="360" x2="600" y2="360" class="scene2-bond-normal"/>
            </g>

            <!-- 轨迹线 (动画用) -->
            <g id="scene2-trajectories" class="scene2-hidden">
                <line x1="190" y1="70" x2="180" y2="200" class="scene2-trajectory"/>
                <line x1="310" y1="70" x2="260" y2="200" class="scene2-trajectory"/>
                <line x1="430" y1="70" x2="340" y2="200" class="scene2-trajectory"/>
                <line x1="430" y1="70" x2="410" y2="200" class="scene2-trajectory"/>
                <line x1="430" y1="70" x2="370" y2="200" class="scene2-trajectory"/>
                <line x1="430" y1="70" x2="450" y2="200" class="scene2-trajectory"/>
            </g>

            <!-- 按钮区 -->
            <g id="scene2-btn-prev" transform="translate(280, 460)">
                <rect x="0" y="0" width="80" height="30" rx="4" class="scene2-btn scene2-btn-disabled"/>
                <text x="40" y="15" class="scene2-btn-text">◀ 上一步</text>
            </g>

            <g id="scene2-btn-next" transform="translate(440, 460)">
                <rect x="0" y="0" width="80" height="30" rx="4" class="scene2-btn"/>
                <text x="40" y="15" class="scene2-btn-text">下一步 ▶</text>
            </g>

            <text id="scene2-step-indicator" x="400" y="490" class="scene2-step-text">步骤 1/5</text>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 2: 化学反应微观示意图
        // 布局坐标表参考:
        // 阶段标题-反应物: (400,35), 阶段标题-原子: (400,185), 阶段标题-生成物: (400,335)
        // 过程标签-断裂: (400,150), 过程标签-重组: (400,280), 过程标签-形成: (400,320)
        // 结论标签: (400,420)
        // 反应物分子: A1(200,70), A2(320,70), B(440,70), A3(560,70)
        // 游离原子: O1(180,210), O2(260,210), O3(340,210), O4(420,210), B1(380,210), B2(460,210)
        // 生成物分子: C1(320,370), C2(480,370), A4(600,370)
        // 按钮: 上一步(280,460), 下一步(440,460), 步骤指示器(400,490)

        let currentState = 0;
        const totalSteps = 5;

        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.classList.remove('scene2-hidden');
                el.style.display = '';
                el.style.opacity = '';
            }
        }

        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.classList.add('scene2-hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 更新按钮状态
        function updateButtons() {
            const prevBtn = document.getElementById('scene2-btn-prev');
            const nextBtn = document.getElementById('scene2-btn-next');
            const prevRect = prevBtn.querySelector('rect');
            const nextRect = nextBtn.querySelector('rect');

            if (currentState === 0) {
                prevRect.classList.add('scene2-btn-disabled');
            } else {
                prevRect.classList.remove('scene2-btn-disabled');
            }

            if (currentState === totalSteps - 1) {
                nextRect.classList.add('scene2-btn-disabled');
            } else {
                nextRect.classList.remove('scene2-btn-disabled');
            }

            // 更新步骤指示器
            const indicator = document.getElementById('scene2-step-indicator');
            indicator.textContent = '步骤 ' + (currentState + 1) + '/' + totalSteps;
        }

        // 渲染当前状态
        function render() {
            // 获取所有需要控制的元素
            const molA1 = document.getElementById('scene2-mol-a1');
            const molA2 = document.getElementById('scene2-mol-a2');
            const molB = document.getElementById('scene2-mol-mol-b');
            const molA3 = document.getElementById('scene2-mol-a3');
            const atomsFree = document.getElementById('scene2-atoms-free');
            const molC1 = document.getElementById('scene2-mol-c1');
            const molC2 = document.getElementById('scene2-mol-c2');
            const molA4 = document.getElementById('scene2-mol-a4');
            const trajectories = document.getElementById('scene2-trajectories');
            const processBreak = document.getElementById('scene2-process-break');
            const processRearrange = document.getElementById('scene2-process-rearrange');
            const processForm = document.getElementById('scene2-process-form');
            const conclusion = document.getElementById('scene2-conclusion');

            // 化学键元素
            const bonds = [
                document.getElementById('scene2-bond-a1'),
                document.getElementById('scene2-bond-a2'),
                document.getElementById('scene2-bond-b'),
                document.getElementById('scene2-bond-a3'),
                document.getElementById('scene2-bond-c1-left'),
                document.getElementById('scene2-bond-c1-right'),
                document.getElementById('scene2-bond-c2-left'),
                document.getElementById('scene2-bond-c2-right'),
                document.getElementById('scene2-bond-a4')
            ];

            // 步骤 0: 初始状态 - 只显示反应物
            if (currentState === 0) {
                show(molA1); show(molA2); show(molB); show(molA3);
                hide(atomsFree); hide(molC1); hide(molC2); hide(molA4);
                hide(trajectories);
                hide(processBreak); hide(processRearrange); hide(processForm);
                hide(conclusion);
                // 所有化学键为正常状态
                bonds.forEach(b => {
                    if (b) {
                        b.classList.remove('scene2-bond-breaking', 'scene2-bond-forming');
                        b.classList.add('scene2-bond-normal');
                    }
                });
            }
            // 步骤 1: 化学键断裂
            else if (currentState === 1) {
                show(molA1); show(molA2); show(molB); show(molA3);
                show(atomsFree);
                hide(molC1); hide(molC2); hide(molA4);
                show(trajectories);
                show(processBreak); hide(processRearrange); hide(processForm);
                hide(conclusion);
                // 反应物化学键变为断裂状态
                ['scene2-bond-a1', 'scene2-bond-a2', 'scene2-bond-b', 'scene2-bond-a3'].forEach(id => {
                    const bond = document.getElementById(id);
                    if (bond) {
                        bond.classList.remove('scene2-bond-normal', 'scene2-bond-forming');
                        bond.classList.add('scene2-bond-breaking');
                    }
                });
            }
            // 步骤 2: 原子重组
            else if (currentState === 2) {
                hide(molA1); hide(molA2); hide(molB); hide(molA3);
                show(atomsFree);
                hide(molC1); hide(molC2); hide(molA4);
                hide(trajectories);
                hide(processBreak); show(processRearrange); hide(processForm);
                hide(conclusion);
            }
            // 步骤 3: 化学键形成
            else if (currentState === 3) {
                hide(molA1); hide(molA2); hide(molB); hide(molA3);
                hide(atomsFree);
                show(molC1); show(molC2); show(molA4);
                hide(trajectories);
                hide(processBreak); hide(processRearrange); show(processForm);
                hide(conclusion);
                // 生成物化学键为形成状态
                ['scene2-bond-c1-left', 'scene2-bond-c1-right', 'scene2-bond-c2-left', 'scene2-bond-c2-right'].forEach(id => {
                    const bond = document.getElementById(id);
                    if (bond) {
                        bond.classList.remove('scene2-bond-normal', 'scene2-bond-breaking');
                        bond.classList.add('scene2-bond-forming');
                    }
                });
                // 剩余分子化学键为正常状态
                const bondA4 = document.getElementById('scene2-bond-a4');
                if (bondA4) {
                    bondA4.classList.remove('scene2-bond-breaking', 'scene2-bond-forming');
                    bondA4.classList.add('scene2-bond-normal');
                }
            }
            // 步骤 4: 结论展示
            else if (currentState === 4) {
                hide(molA1); hide(molA2); hide(molB); hide(molA3);
                hide(atomsFree);
                show(molC1); show(molC2); show(molA4);
                hide(trajectories);
                hide(processBreak); hide(processRearrange); hide(processForm);
                show(conclusion);
                // 所有化学键为正常状态
                bonds.forEach(b => {
                    if (b) {
                        b.classList.remove('scene2-bond-breaking', 'scene2-bond-forming');
                        b.classList.add('scene2-bond-normal');
                    }
                });
            }

            updateButtons();
        }

        // 按钮事件绑定
        document.getElementById('scene2-btn-prev').addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                render();
            }
        });

        document.getElementById('scene2-btn-next').addEventListener('click', function() {
            if (currentState < totalSteps - 1) {
                currentState++;
                render();
            }
        });

        // 初始渲染
        render();
    })();
    </script>
</body>
</html>
