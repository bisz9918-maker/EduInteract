<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化学物质转化循环图分析</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 20px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f0f0f0; }
        .scene1-btn:hover { background: #e0e0e0; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-hidden { opacity: 0; }
        .scene1-visible { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#000000" />
                </marker>
                <marker id="scene1-arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#2e7d32" />
                </marker>
                <marker id="scene1-arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#c62828" />
                </marker>
            </defs>

            <!-- ========== 图①：CaCO₃循环 ========== -->
            <!-- 三角形路径（仅用于参考，实际用箭头连接） -->
            <!-- 顶点：CaCO₃(200,70), CaO(120,200), Ca(OH)₂(280,200) -->
            
            <!-- 箭头1: CaCO₃ → CaO -->
            <path id="scene1-arrow-1-1" d="M190,90 L130,180" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead)"/>
            <!-- 箭头2: CaO → Ca(OH)₂ -->
            <path id="scene1-arrow-1-2" d="M145,200 L255,200" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead)"/>
            <!-- 箭头3: Ca(OH)₂ → CaCO₃ -->
            <path id="scene1-arrow-1-3" d="M265,180 L210,90" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead)"/>
            
            <!-- 化学物质标签 -->
            <text id="scene1-label-caco3" x="200" y="65" text-anchor="middle" font-size="14" fill="#000000">CaCO₃</text>
            <text id="scene1-label-cao" x="105" y="220" text-anchor="middle" font-size="14" fill="#000000">CaO</text>
            <text id="scene1-label-caoh2" x="295" y="220" text-anchor="middle" font-size="14" fill="#000000">Ca(OH)₂</text>
            <text id="scene1-num-1" x="200" y="245" text-anchor="middle" font-size="16" fill="#000000">①</text>
            
            <!-- 可行性标记（初始隐藏） -->
            <text id="scene1-check-1-1" x="155" y="145" text-anchor="middle" font-size="16" fill="#2e7d32" class="scene1-hidden" style="opacity:0;">✓</text>
            <text id="scene1-check-1-2" x="200" y="190" text-anchor="middle" font-size="16" fill="#2e7d32" class="scene1-hidden" style="opacity:0;">✓</text>
            <text id="scene1-check-1-3" x="245" y="145" text-anchor="middle" font-size="16" fill="#2e7d32" class="scene1-hidden" style="opacity:0;">✓</text>

            <!-- ========== 图②：Fe循环 ========== -->
            <!-- 顶点：Fe(440,70), Fe₂O₃(360,200), FeSO₄(520,200) -->
            
            <!-- 箭头1: Fe → Fe₂O₃ -->
            <path id="scene1-arrow-2-1" d="M430,90 L370,180" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead)"/>
            <!-- 箭头2: Fe₂O₃ → FeSO₄ -->
            <path id="scene1-arrow-2-2" d="M385,200 L495,200" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead)"/>
            <!-- 箭头3: FeSO₄ → Fe -->
            <path id="scene1-arrow-2-3" d="M505,180 L450,90" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead)"/>
            
            <!-- 化学物质标签 -->
            <text id="scene1-label-fe" x="440" y="65" text-anchor="middle" font-size="14" fill="#000000">Fe</text>
            <text id="scene1-label-fe2o3" x="345" y="220" text-anchor="middle" font-size="14" fill="#000000">Fe₂O₃</text>
            <text id="scene1-label-feso4" x="535" y="220" text-anchor="middle" font-size="14" fill="#000000">FeSO₄</text>
            <text id="scene1-num-2" x="440" y="245" text-anchor="middle" font-size="16" fill="#000000">②</text>
            
            <!-- 可行性标记（初始隐藏） -->
            <text id="scene1-check-2-1" x="395" y="145" text-anchor="middle" font-size="16" fill="#c62828" class="scene1-hidden" style="opacity:0;">✗</text>
            <text id="scene1-check-2-2" x="440" y="190" text-anchor="middle" font-size="16" fill="#c62828" class="scene1-hidden" style="opacity:0;">✗</text>
            <text id="scene1-check-2-3" x="485" y="145" text-anchor="middle" font-size="16" fill="#2e7d32" class="scene1-hidden" style="opacity:0;">✓</text>

            <!-- ========== 图③：H₂O循环 ========== -->
            <!-- 顶点：H₂O(680,70), O₂(600,200), MgO(760,200) -->
            
            <!-- 箭头1: H₂O → O₂ -->
            <path id="scene1-arrow-3-1" d="M670,90 L610,180" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead)"/>
            <!-- 箭头2: O₂ → MgO -->
            <path id="scene1-arrow-3-2" d="M625,200 L735,200" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead)"/>
            <!-- 箭头3: MgO → H₂O -->
            <path id="scene1-arrow-3-3" d="M745,180 L690,90" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead)"/>
            
            <!-- 化学物质标签 -->
            <text id="scene1-label-h2o" x="680" y="65" text-anchor="middle" font-size="14" fill="#000000">H₂O</text>
            <text id="scene1-label-o2" x="585" y="220" text-anchor="middle" font-size="14" fill="#000000">O₂</text>
            <text id="scene1-label-mgo" x="775" y="220" text-anchor="middle" font-size="14" fill="#000000">MgO</text>
            <text id="scene1-num-3" x="680" y="245" text-anchor="middle" font-size="16" fill="#000000">③</text>
            
            <!-- 可行性标记（初始隐藏） -->
            <text id="scene1-check-3-1" x="635" y="145" text-anchor="middle" font-size="16" fill="#2e7d32" class="scene1-hidden" style="opacity:0;">✓</text>
            <text id="scene1-check-3-2" x="680" y="190" text-anchor="middle" font-size="16" fill="#2e7d32" class="scene1-hidden" style="opacity:0;">✓</text>
            <text id="scene1-check-3-3" x="725" y="145" text-anchor="middle" font-size="16" fill="#2e7d32" class="scene1-hidden" style="opacity:0;">✓</text>

            <!-- ========== 方程式显示区 ========== -->
            <rect id="scene1-equation-bg" x="20" y="270" width="760" height="140" fill="#f5f5f5" rx="8" ry="8"/>
            <text id="scene1-equation-text" x="40" y="295" font-size="13" fill="#333333">
                点击「下一步」开始分析图①
            </text>

            <!-- ========== 选项区 ========== -->
            <rect id="scene1-option-bg" x="20" y="415" width="760" height="25" fill="#fafafa"/>
            <text id="scene1-option-a" x="120" y="433" font-size="13" fill="#000000">A．①②</text>
            <text id="scene1-option-b" x="240" y="433" font-size="13" fill="#000000">B．①③</text>
            <text id="scene1-option-c" x="360" y="433" font-size="13" fill="#000000">C．②③</text>
            <text id="scene1-option-d" x="480" y="433" font-size="13" fill="#000000">D．①②③</text>
            
            <!-- 选项B高亮框（初始隐藏） -->
            <rect id="scene1-option-b-highlight" x="215" y="420" width="60" height="20" fill="none" stroke="#2e7d32" stroke-width="2" class="scene1-hidden" style="opacity:0;"/>

            <!-- ========== 控件栏 ========== -->
            <g id="scene1-controls-group">
                <rect x="250" y="455" width="300" height="35" fill="none"/>
            </g>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现 - 化学物质转化循环图分析
        
        let currentStep = 0;
        const totalSteps = 5; // 0-4
        
        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.style.opacity = '1';
                el.style.display = '';
                el.classList.remove('scene1-hidden');
                el.classList.add('scene1-visible');
            }
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.opacity = '0';
                el.classList.add('scene1-hidden');
                el.classList.remove('scene1-visible');
            }
        }
        
        // 获取元素
        function getEl(id) {
            return document.getElementById(id);
        }
        
        // 更新箭头样式
        function setArrowStyle(arrowId, color, width) {
            const arrow = getEl(arrowId);
            if (arrow) {
                arrow.setAttribute('stroke', color);
                arrow.setAttribute('stroke-width', width.toString());
                if (color === '#2e7d32') {
                    arrow.setAttribute('marker-end', 'url(#scene1-arrowhead-green)');
                } else if (color === '#c62828') {
                    arrow.setAttribute('marker-end', 'url(#scene1-arrowhead-red)');
                } else {
                    arrow.setAttribute('marker-end', 'url(#scene1-arrowhead)');
                }
            }
        }
        
        // 更新方程式文本
        function setEquationText(text) {
            const eqText = getEl('scene1-equation-text');
            if (eqText) {
                // 清除所有子元素
                while (eqText.firstChild) {
                    eqText.removeChild(eqText.firstChild);
                }
                // 添加新文本（支持换行）
                const lines = text.split('\n');
                lines.forEach((line, i) => {
                    const tspan = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
                    tspan.setAttribute('x', '40');
                    tspan.setAttribute('dy', i === 0 ? '0' : '20');
                    tspan.textContent = line;
                    eqText.appendChild(tspan);
                });
            }
        }
        
        // 更新步骤显示
        function updateStep() {
            const btnPrev = getEl('scene1-btn-prev');
            const btnNext = getEl('scene1-btn-next');
            
            // 更新按钮状态
            if (btnPrev) {
                btnPrev.disabled = (currentStep === 0);
            }
            if (btnNext) {
                if (currentStep >= totalSteps - 1) {
                    btnNext.textContent = '完成';
                    btnNext.disabled = true;
                } else {
                    btnNext.textContent = '下一步 ▶';
                    btnNext.disabled = false;
                }
            }
            
            // 根据当前步骤更新显示
            switch (currentStep) {
                case 0:
                    // 初始状态
                    resetAllArrows();
                    hideAllChecks();
                    setEquationText('点击「下一步」开始分析图①');
                    hide(getEl('scene1-option-b-highlight'));
                    break;
                    
                case 1:
                    // 分析图①
                    setArrowStyle('scene1-arrow-1-1', '#2e7d32', 3);
                    setArrowStyle('scene1-arrow-1-2', '#2e7d32', 3);
                    setArrowStyle('scene1-arrow-1-3', '#2e7d32', 3);
                    show(getEl('scene1-check-1-1'));
                    show(getEl('scene1-check-1-2'));
                    show(getEl('scene1-check-1-3'));
                    setEquationText('图①分析：\n1. CaCO₃ → CaO：CaCO₃ →(高温) CaO + CO₂↑  ✓ 可一步实现\n2. CaO → Ca(OH)₂：CaO + H₂O → Ca(OH)₂  ✓ 可一步实现\n3. Ca(OH)₂ → CaCO₃：Ca(OH)₂ + CO₂ → CaCO₃↓ + H₂O  ✓ 可一步实现');
                    break;
                    
                case 2:
                    // 分析图②
                    setArrowStyle('scene1-arrow-2-1', '#c62828', 3);
                    setArrowStyle('scene1-arrow-2-2', '#c62828', 3);
                    setArrowStyle('scene1-arrow-2-3', '#2e7d32', 3);
                    show(getEl('scene1-check-2-1'));
                    show(getEl('scene1-check-2-2'));
                    show(getEl('scene1-check-2-3'));
                    setEquationText('图②分析：\n1. Fe → Fe₂O₃：铁燃烧生成 Fe₃O₄，不能一步得 Fe₂O₃  ✗\n2. Fe₂O₃ → FeSO₄：Fe₂O₃ + H₂SO₄ → Fe₂(SO₄)₃（硫酸铁），不是 FeSO₄  ✗\n3. FeSO₄ → Fe：FeSO₄ + Zn → ZnSO₄ + Fe（置换）✓');
                    break;
                    
                case 3:
                    // 分析图③
                    setArrowStyle('scene1-arrow-3-1', '#2e7d32', 3);
                    setArrowStyle('scene1-arrow-3-2', '#2e7d32', 3);
                    setArrowStyle('scene1-arrow-3-3', '#2e7d32', 3);
                    show(getEl('scene1-check-3-1'));
                    show(getEl('scene1-check-3-2'));
                    show(getEl('scene1-check-3-3'));
                    setEquationText('图③分析：\n1. H₂O → O₂：2H₂O →(电解) 2H₂↑ + O₂↑  ✓\n2. O₂ → MgO：2Mg + O₂ →(点燃) 2MgO  ✓\n3. MgO → H₂O：MgO + H₂SO₄ → MgSO₄ + H₂O  ✓');
                    break;
                    
                case 4:
                    // 汇总结论
                    show(getEl('scene1-option-b-highlight'));
                    setEquationText('结论：图①和图③的所有转化均可一步实现，图②中有转化不能一步实现。\n正确答案：B．①③');
                    break;
            }
        }
        
        // 重置所有箭头为黑色
        function resetAllArrows() {
            const arrows = [
                'scene1-arrow-1-1', 'scene1-arrow-1-2', 'scene1-arrow-1-3',
                'scene1-arrow-2-1', 'scene1-arrow-2-2', 'scene1-arrow-2-3',
                'scene1-arrow-3-1', 'scene1-arrow-3-2', 'scene1-arrow-3-3'
            ];
            arrows.forEach(id => setArrowStyle(id, '#000000', 2));
        }
        
        // 隐藏所有检查标记
        function hideAllChecks() {
            for (let i = 1; i <= 3; i++) {
                for (let j = 1; j <= 3; j++) {
                    hide(getEl(`scene1-check-${i}-${j}`));
                }
            }
        }
        
        // 按钮事件处理
        function handlePrev() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        }
        
        function handleNext() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStep();
            }
        }
        
        // 绑定事件
        const btnPrev = getEl('scene1-btn-prev');
        const btnNext = getEl('scene1-btn-next');
        
        if (btnPrev) {
            btnPrev.addEventListener('click', handlePrev);
        }
        
        if (btnNext) {
            btnNext.addEventListener('click', handleNext);
        }
        
        // 初始化
        updateStep();
        
    })();
    </script>
</body>
</html>
