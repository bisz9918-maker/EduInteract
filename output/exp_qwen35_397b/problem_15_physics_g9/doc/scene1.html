<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图甲受力分析</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: Arial, sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        .scene1-fade-in {
            animation: scene1FadeIn 0.3s ease-in forwards;
        }
        @keyframes scene1FadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .scene1-btn {
            padding: 8px 16px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .scene1-btn-prev {
            background-color: #e0e0e0;
            color: #333;
        }
        .scene1-btn-prev:hover {
            background-color: #c0c0c0;
        }
        .scene1-btn-prev:disabled {
            background-color: #f0f0f0;
            color: #aaa;
            cursor: not-allowed;
        }
        .scene1-btn-next {
            background-color: #1565c0;
            color: white;
        }
        .scene1-btn-next:hover {
            background-color: #0d47a1;
        }
        .scene1-btn-next:disabled {
            background-color: #90caf9;
            cursor: not-allowed;
        }
        .scene1-step-indicator {
            font-size: 14px;
            color: #666;
            min-width: 80px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#000000" />
                </marker>
                <marker id="scene1-arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#1565c0" />
                </marker>
                <marker id="scene1-arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#c62828" />
                </marker>
                <marker id="scene1-arrowhead-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#888888" />
                </marker>
            </defs>

            <!-- 桌面（带阴影线） -->
            <g id="scene1-desktop">
                <line x1="50" y1="420" x2="750" y2="420" stroke="#000000" stroke-width="4" />
                <!-- 阴影线 -->
                <g stroke="#666666" stroke-width="1">
                    <line x1="50" y1="420" x2="40" y2="430" />
                    <line x1="70" y1="420" x2="60" y2="430" />
                    <line x1="90" y1="420" x2="80" y2="430" />
                    <line x1="110" y1="420" x2="100" y2="430" />
                    <line x1="130" y1="420" x2="120" y2="430" />
                    <line x1="150" y1="420" x2="140" y2="430" />
                    <line x1="170" y1="420" x2="160" y2="430" />
                    <line x1="190" y1="420" x2="180" y2="430" />
                    <line x1="210" y1="420" x2="200" y2="430" />
                    <line x1="230" y1="420" x2="220" y2="430" />
                    <line x1="250" y1="420" x2="240" y2="430" />
                    <line x1="270" y1="420" x2="260" y2="430" />
                    <line x1="290" y1="420" x2="280" y2="430" />
                    <line x1="310" y1="420" x2="300" y2="430" />
                    <line x1="330" y1="420" x2="320" y2="430" />
                    <line x1="350" y1="420" x2="340" y2="430" />
                    <line x1="370" y1="420" x2="360" y2="430" />
                    <line x1="390" y1="420" x2="380" y2="430" />
                    <line x1="410" y1="420" x2="400" y2="430" />
                    <line x1="430" y1="420" x2="420" y2="430" />
                    <line x1="450" y1="420" x2="440" y2="430" />
                    <line x1="470" y1="420" x2="460" y2="430" />
                    <line x1="490" y1="420" x2="480" y2="430" />
                    <line x1="510" y1="420" x2="500" y2="430" />
                    <line x1="530" y1="420" x2="520" y2="430" />
                    <line x1="550" y1="420" x2="540" y2="430" />
                    <line x1="570" y1="420" x2="560" y2="430" />
                    <line x1="590" y1="420" x2="580" y2="430" />
                    <line x1="610" y1="420" x2="600" y2="430" />
                    <line x1="630" y1="420" x2="620" y2="430" />
                    <line x1="650" y1="420" x2="640" y2="430" />
                    <line x1="670" y1="420" x2="660" y2="430" />
                    <line x1="690" y1="420" x2="680" y2="430" />
                    <line x1="710" y1="420" x2="700" y2="430" />
                    <line x1="730" y1="420" x2="720" y2="430" />
                    <line x1="750" y1="420" x2="740" y2="430" />
                </g>
            </g>

            <!-- 木块A -->
            <rect id="scene1-block-a" x="220" y="340" width="120" height="80" 
                  fill="#e3f2fd" fill-opacity="0.2" stroke="#000000" stroke-width="2" />
            
            <!-- 木块B -->
            <rect id="scene1-block-b" x="220" y="260" width="120" height="80" 
                  fill="#e3f2fd" fill-opacity="0.2" stroke="#000000" stroke-width="2" />

            <!-- 标签A -->
            <text id="scene1-label-a" x="350" y="385" font-size="18" fill="#000000" font-family="Arial">A</text>
            
            <!-- 标签B -->
            <text id="scene1-label-b" x="350" y="305" font-size="18" fill="#000000" font-family="Arial">B</text>

            <!-- 速度v₁箭头 -->
            <g id="scene1-velocity-group">
                <line x1="240" y1="220" x2="340" y2="220" stroke="#000000" stroke-width="3" 
                      marker-end="url(#scene1-arrowhead)" />
                <text id="scene1-velocity-label" x="290" y="205" font-size="16" fill="#000000" 
                      font-family="Arial" text-anchor="middle">v₁=1m/s</text>
            </g>

            <!-- 步骤1：重力G和支持力N -->
            <g id="scene1-step1-group" style="display: none;">
                <!-- 重力G箭头（虚线） -->
                <line x1="280" y1="260" x2="280" y2="450" stroke="#888888" stroke-width="3" 
                      stroke-dasharray="5,5" marker-end="url(#scene1-arrowhead-gray)" />
                <text id="scene1-gravity-label" x="295" y="465" font-size="14" fill="#888888" 
                      font-family="Arial">G=2mg</text>
                
                <!-- 支持力N箭头（虚线） -->
                <line x1="280" y1="420" x2="280" y2="350" stroke="#888888" stroke-width="3" 
                      stroke-dasharray="5,5" marker-end="url(#scene1-arrowhead-gray)" />
                <text id="scene1-normal-label" x="295" y="375" font-size="14" fill="#888888" 
                      font-family="Arial">N=2mg</text>
            </g>

            <!-- 步骤2：摩擦力f₁ -->
            <g id="scene1-step2-group" style="display: none;">
                <line x1="220" y1="425" x2="140" y2="425" stroke="#c62828" stroke-width="3" 
                      marker-end="url(#scene1-arrowhead-red)" />
                <text id="scene1-friction-label" x="180" y="445" font-size="16" fill="#c62828" 
                      font-family="Arial" text-anchor="middle">f₁</text>
            </g>

            <!-- 步骤3：推力F₁和平衡关系 -->
            <g id="scene1-step3-group" style="display: none;">
                <line x1="100" y1="380" x2="220" y2="380" stroke="#1565c0" stroke-width="3" 
                      marker-end="url(#scene1-arrowhead-blue)" />
                <text id="scene1-force-label" x="160" y="365" font-size="16" fill="#1565c0" 
                      font-family="Arial" text-anchor="middle">F₁=100N</text>
                
                <!-- 平衡关系提示 -->
                <text id="scene1-balance-label" x="180" y="405" font-size="12" fill="#666666" 
                      font-family="Arial" text-anchor="middle" font-style="italic">F₁=f₁</text>
            </g>

            <!-- 图注 -->
            <text id="scene1-figure-label" x="280" y="485" font-size="16" fill="#000000" 
                  font-family="Arial" text-anchor="middle">图甲</text>

            <!-- 控件栏（放在SVG内部底部） -->
            <g id="scene1-controls">
                <rect x="50" y="445" width="200" height="45" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="4" />
                <text id="scene1-step-indicator" x="150" y="472" font-size="14" fill="#666" 
                      font-family="Arial" text-anchor="middle">步骤1/4</text>
                <rect id="scene1-btn-prev-bg" x="60" y="455" width="70" height="30" fill="#e0e0e0" rx="4" />
                <text id="scene1-btn-prev-text" x="95" y="475" font-size="13" fill="#333" 
                      font-family="Arial" text-anchor="middle">◀ 上一步</text>
                <rect id="scene1-btn-next-bg" x="180" y="455" width="70" height="30" fill="#1565c0" rx="4" />
                <text id="scene1-btn-next-text" x="215" y="475" font-size="13" fill="#ffffff" 
                      font-family="Arial" text-anchor="middle">下一步 ▶</text>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 1 实现 - 图甲受力分析
        
        let currentStep = 0;
        const totalSteps = 4;
        
        // 获取DOM元素
        const step1Group = document.getElementById('scene1-step1-group');
        const step2Group = document.getElementById('scene1-step2-group');
        const step3Group = document.getElementById('scene1-step3-group');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        const btnPrevBg = document.getElementById('scene1-btn-prev-bg');
        const btnPrevText = document.getElementById('scene1-btn-prev-text');
        const btnNextBg = document.getElementById('scene1-btn-next-bg');
        const btnNextText = document.getElementById('scene1-btn-next-text');
        
        // 更新按钮状态
        function updateButtons() {
            if (currentStep === 0) {
                btnPrevBg.setAttribute('fill', '#f0f0f0');
                btnPrevText.setAttribute('fill', '#aaa');
            } else {
                btnPrevBg.setAttribute('fill', '#e0e0e0');
                btnPrevText.setAttribute('fill', '#333');
            }
            
            if (currentStep === totalSteps - 1) {
                btnNextBg.setAttribute('fill', '#90caf9');
                btnNextText.setAttribute('fill', '#ccc');
            } else {
                btnNextBg.setAttribute('fill', '#1565c0');
                btnNextText.setAttribute('fill', '#ffffff');
            }
            
            stepIndicator.textContent = `步骤${currentStep + 1}/${totalSteps}`;
        }
        
        // 更新显示状态
        function updateDisplay() {
            // 隐藏所有步骤组
            step1Group.style.display = 'none';
            step2Group.style.display = 'none';
            step3Group.style.display = 'none';
            
            // 根据当前步骤显示相应元素
            if (currentStep >= 1) {
                step1Group.style.display = 'block';
                step1Group.classList.add('scene1-fade-in');
            }
            if (currentStep >= 2) {
                step2Group.style.display = 'block';
                step2Group.classList.add('scene1-fade-in');
            }
            if (currentStep >= 3) {
                step3Group.style.display = 'block';
                step3Group.classList.add('scene1-fade-in');
            }
            
            updateButtons();
        }
        
        // 下一步
        function stepForward() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateDisplay();
            }
        }
        
        // 上一步
        function stepBack() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        }
        
        // 绑定点击事件到按钮区域
        btnPrevBg.addEventListener('click', function() {
            if (currentStep > 0) {
                stepBack();
            }
        });
        
        btnNextBg.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                stepForward();
            }
        });
        
        // 添加点击反馈效果
        btnPrevBg.style.cursor = 'pointer';
        btnNextBg.style.cursor = 'pointer';
        
        // 初始化
        updateDisplay();
        
    })();
    </script>
</body>
</html>
