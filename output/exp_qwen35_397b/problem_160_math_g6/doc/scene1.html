<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>凹多边形楼房平面图</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        .scene1-label {
            font-size: 14px;
            fill: #000000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .scene1-label.visible {
            opacity: 1;
        }
        .scene1-edge {
            stroke: #000000;
            stroke-width: 2;
            fill: none;
        }
        .scene1-edge.highlight {
            stroke: #1565c0;
            stroke-width: 3;
        }
        .scene1-legend {
            font-size: 14px;
            fill: #1565c0;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .scene1-legend.visible {
            opacity: 1;
        }
        .scene1-legend-bg {
            fill: #ffffff;
            stroke: #1565c0;
            stroke-width: 1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .scene1-legend-bg.visible {
            opacity: 1;
        }
        .scene1-question {
            font-size: 14px;
            fill: #000000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .scene1-question.visible {
            opacity: 1;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        #scene1-btn-prev, #scene1-btn-next {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: #f5f5f5;
            border-radius: 4px;
        }
        #scene1-btn-prev:hover, #scene1-btn-next:hover {
            background: #e0e0e0;
        }
        #scene1-btn-prev:disabled, #scene1-btn-next:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- 凹多边形轮廓 - 8 条边 -->
            <!-- 顶点坐标（按顺时针）：P1(250,380) → P2(250,180) → P3(400,180) → P4(400,230) → P5(580,230) → P6(580,180) → P7(650,180) → P8(650,380) → 闭合 -->
            <!-- 边 a: (250,380)-(250,180) 左侧竖直 -->
            <line id="scene1-edge-a" class="scene1-edge" x1="250" y1="380" x2="250" y2="180" />
            <!-- 边 h: (250,180)-(400,180) 顶部左侧水平 -->
            <line id="scene1-edge-h" class="scene1-edge" x1="250" y1="180" x2="400" y2="180" />
            <!-- 边 g: (400,180)-(400,230) 凹口左侧竖直 -->
            <line id="scene1-edge-g" class="scene1-edge" x1="400" y1="180" x2="400" y2="230" />
            <!-- 边 f: (400,230)-(580,230) 凹口底部水平 -->
            <line id="scene1-edge-f" class="scene1-edge" x1="400" y1="230" x2="580" y2="230" />
            <!-- 边 e: (580,230)-(580,180) 凹口右侧竖直 -->
            <line id="scene1-edge-e" class="scene1-edge" x1="580" y1="230" x2="580" y2="180" />
            <!-- 边 d: (580,180)-(650,180) 顶部右侧水平 -->
            <line id="scene1-edge-d" class="scene1-edge" x1="580" y1="180" x2="650" y2="180" />
            <!-- 边 c: (650,180)-(650,380) 右侧竖直 -->
            <line id="scene1-edge-c" class="scene1-edge" x1="650" y1="180" x2="650" y2="380" />
            <!-- 边 b: (650,380)-(250,380) 底部水平 -->
            <line id="scene1-edge-b" class="scene1-edge" x1="650" y1="380" x2="250" y2="380" />

            <!-- 字母标注 -->
            <!-- 标签 a: 边 a 中点左侧 15px → (235, 280) -->
            <text id="scene1-label-a" class="scene1-label" x="235" y="280">a</text>
            <!-- 标签 b: 边 b 中点下方 25px → (450, 405) -->
            <text id="scene1-label-b" class="scene1-label" x="450" y="405">b</text>
            <!-- 标签 c: 边 c 中点右侧 15px → (665, 280) -->
            <text id="scene1-label-c" class="scene1-label" x="665" y="280">c</text>
            <!-- 标签 d: 边 d 中点上方 15px → (615, 165) -->
            <text id="scene1-label-d" class="scene1-label" x="615" y="165">d</text>
            <!-- 标签 e: 边 e 中点右侧 15px → (595, 205) -->
            <text id="scene1-label-e" class="scene1-label" x="595" y="205">e</text>
            <!-- 标签 f: 边 f 中点下方 25px → (490, 255) -->
            <text id="scene1-label-f" class="scene1-label" x="490" y="255">f</text>
            <!-- 标签 g: 边 g 中点左侧 15px → (385, 205) -->
            <text id="scene1-label-g" class="scene1-label" x="385" y="205">g</text>
            <!-- 标签 h: 边 h 中点上方 15px → (325, 165) -->
            <text id="scene1-label-h" class="scene1-label" x="325" y="165">h</text>

            <!-- 图例区背景框 -->
            <rect id="scene1-legend-bg1" class="scene1-legend-bg" x="240" y="435" width="60" height="24" rx="3" />
            <rect id="scene1-legend-bg2" class="scene1-legend-bg" x="340" y="435" width="60" height="24" rx="3" />
            <rect id="scene1-legend-bg3" class="scene1-legend-bg" x="440" y="435" width="60" height="24" rx="3" />

            <!-- 图例区数值 -->
            <text id="scene1-legend-b" class="scene1-legend" x="270" y="452">b=50</text>
            <text id="scene1-legend-c" class="scene1-legend" x="370" y="452">c=30</text>
            <text id="scene1-legend-g" class="scene1-legend" x="470" y="452">g=10</text>

            <!-- 问题文本 -->
            <text id="scene1-question" class="scene1-question" x="400" y="480" text-anchor="middle">这座楼房平面图的周长是多少？</text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/4</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现 - 凹多边形楼房平面图

        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 边 a | 线段 | (250,380)-(250,180) | 2×200 | 左侧 | 左侧竖直边 |
        // | 边 b | 线段 | (650,380)-(250,380) | 400×2 | 下方 | 底部水平边 |
        // | 边 c | 线段 | (650,180)-(650,380) | 2×200 | 右侧 | 右侧竖直边 |
        // | 边 d | 线段 | (580,180)-(650,180) | 70×2 | 上方 | 顶部右侧水平边 |
        // | 边 e | 线段 | (580,230)-(580,180) | 2×50 | 右侧 | 凹口右侧竖直边 |
        // | 边 f | 线段 | (400,230)-(580,230) | 180×2 | 下方 | 凹口底部水平边 |
        // | 边 g | 线段 | (400,180)-(400,230) | 2×50 | 左侧 | 凹口左侧竖直边 |
        // | 边 h | 线段 | (250,180)-(400,180) | 150×2 | 上方 | 顶部左侧水平边 |
        // | 标签 a | text | (235,280) | ~12×16 | 左侧 | 边 a 中点左侧 15px |
        // | 标签 b | text | (450,405) | ~12×16 | 下方 | 边 b 中点下方 25px |
        // | 标签 c | text | (665,280) | ~12×16 | 右侧 | 边 c 中点右侧 15px |
        // | 标签 d | text | (615,165) | ~12×16 | 上方 | 边 d 中点上方 15px |
        // | 标签 e | text | (595,205) | ~12×16 | 右侧 | 边 e 中点右侧 15px |
        // | 标签 f | text | (490,255) | ~12×16 | 下方 | 边 f 中点下方 25px |
        // | 标签 g | text | (385,205) | ~12×16 | 左侧 | 边 g 中点左侧 15px |
        // | 标签 h | text | (325,165) | ~12×16 | 上方 | 边 h 中点上方 15px |
        // | 数值 b=50 | text+rect | (270,452) | ~60×20 | - | 图例区左侧 |
        // | 数值 c=30 | text+rect | (370,452) | ~60×20 | - | 图例区中间 |
        // | 数值 g=10 | text+rect | (470,452) | ~60×20 | - | 图例区右侧 |

        let currentStep = 0;
        const totalSteps = 4;

        // 获取 DOM 元素
        const labels = [
            document.getElementById('scene1-label-a'),
            document.getElementById('scene1-label-b'),
            document.getElementById('scene1-label-c'),
            document.getElementById('scene1-label-d'),
            document.getElementById('scene1-label-e'),
            document.getElementById('scene1-label-f'),
            document.getElementById('scene1-label-g'),
            document.getElementById('scene1-label-h')
        ];

        const legendElements = [
            document.getElementById('scene1-legend-bg1'),
            document.getElementById('scene1-legend-bg2'),
            document.getElementById('scene1-legend-bg3'),
            document.getElementById('scene1-legend-b'),
            document.getElementById('scene1-legend-c'),
            document.getElementById('scene1-legend-g')
        ];

        const questionElement = document.getElementById('scene1-question');

        const edgeB = document.getElementById('scene1-edge-b');
        const edgeC = document.getElementById('scene1-edge-c');
        const edgeG = document.getElementById('scene1-edge-g');

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        // 工具函数：显示/隐藏元素
        function show(el) {
            if (el) {
                el.style.display = '';
                el.style.opacity = '1';
                if (el.classList.contains('scene1-label') || el.classList.contains('scene1-legend') || el.classList.contains('scene1-legend-bg') || el.classList.contains('scene1-question')) {
                    el.classList.add('visible');
                }
            }
        }

        function hide(el) {
            if (el) {
                el.style.display = '';
                el.style.opacity = '0';
                if (el.classList.contains('scene1-label') || el.classList.contains('scene1-legend') || el.classList.contains('scene1-legend-bg') || el.classList.contains('scene1-question')) {
                    el.classList.remove('visible');
                }
            }
        }

        // 更新步骤状态
        function updateStep() {
            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);

            // 步骤 0：只显示轮廓，隐藏所有标注
            if (currentStep === 0) {
                labels.forEach(hide);
                legendElements.forEach(hide);
                hide(questionElement);
                edgeB.classList.remove('highlight');
                edgeC.classList.remove('highlight');
                edgeG.classList.remove('highlight');
            }
            // 步骤 1：显示所有字母标注
            else if (currentStep === 1) {
                labels.forEach(show);
                legendElements.forEach(hide);
                hide(questionElement);
                edgeB.classList.remove('highlight');
                edgeC.classList.remove('highlight');
                edgeG.classList.remove('highlight');
            }
            // 步骤 2：高亮边 b,c,g 并显示数值
            else if (currentStep === 2) {
                labels.forEach(show);
                legendElements.forEach(show);
                hide(questionElement);
                edgeB.classList.add('highlight');
                edgeC.classList.add('highlight');
                edgeG.classList.add('highlight');
            }
            // 步骤 3：显示问题
            else if (currentStep === 3) {
                labels.forEach(show);
                legendElements.forEach(show);
                show(questionElement);
                edgeB.classList.add('highlight');
                edgeC.classList.add('highlight');
                edgeG.classList.add('highlight');
            }
        }

        // 按钮事件绑定
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStep();
            }
        });

        // 初始化
        updateStep();

    })();
    </script>
</body>
</html>
