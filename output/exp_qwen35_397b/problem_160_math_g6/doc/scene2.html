<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平移法求周长 - 场景2</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 16px; font-size: 14px; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .scene2-btn:disabled { background: #bdbdbd; cursor: not-allowed; }
        .scene2-btn:hover:not(:disabled) { background: #1565c0; }
        #scene2-step-indicator { font-size: 14px; color: #333; min-width: 80px; text-align: center; }
        .hidden { display: none !important; opacity: 0; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500">
            <!-- 定义箭头 marker -->
            <defs>
                <marker id="scene2-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#888888" />
                </marker>
            </defs>

            <!-- 凹多边形轮廓 - 按顶点 P0→P1→P2→P3→P4→P5→P6→P7→P0 -->
            <!-- P0(60,380) → P1(60,205) → P2(165,205) → P3(165,275) → P4(305,275) → P5(305,170) → P6(410,170) → P7(410,380) → P0 -->
            <path id="scene2-polygon" d="M 60,380 L 60,205 L 165,205 L 165,275 L 305,275 L 305,170 L 410,170 L 410,380 L 60,380 Z" 
                  fill="none" stroke="#000000" stroke-width="2"/>

            <!-- 边 a: P0(60,380) → P1(60,205) -->
            <line id="scene2-edge-a" x1="60" y1="380" x2="60" y2="205" stroke="#000000" stroke-width="2"/>
            <text id="scene2-label-a" x="45" y="290" font-size="14" fill="#000000" text-anchor="end">a</text>

            <!-- 边 h: P1(60,205) → P2(165,205) -->
            <line id="scene2-edge-h" x1="60" y1="205" x2="165" y2="205" stroke="#000000" stroke-width="2"/>
            <text id="scene2-label-h" x="113" y="190" font-size="14" fill="#000000" text-anchor="middle">h</text>

            <!-- 边 g: P2(165,205) → P3(165,275) -->
            <line id="scene2-edge-g" x1="165" y1="205" x2="165" y2="275" stroke="#000000" stroke-width="2"/>
            <text id="scene2-label-g" x="150" y="240" font-size="14" fill="#000000" text-anchor="end">g=10</text>

            <!-- 边 f: P3(165,275) → P4(305,275) -->
            <line id="scene2-edge-f" x1="165" y1="275" x2="305" y2="275" stroke="#000000" stroke-width="2"/>
            <text id="scene2-label-f" x="235" y="290" font-size="14" fill="#000000" text-anchor="middle">f</text>

            <!-- 边 e: P4(305,275) → P5(305,170) -->
            <line id="scene2-edge-e" x1="305" y1="275" x2="305" y2="170" stroke="#000000" stroke-width="2"/>
            <text id="scene2-label-e" x="320" y="220" font-size="14" fill="#000000" text-anchor="start">e</text>

            <!-- 边 d: P5(305,170) → P6(410,170) -->
            <line id="scene2-edge-d" x1="305" y1="170" x2="410" y2="170" stroke="#000000" stroke-width="2"/>
            <text id="scene2-label-d" x="358" y="155" font-size="14" fill="#000000" text-anchor="middle">d</text>

            <!-- 边 c: P6(410,170) → P7(410,380) -->
            <line id="scene2-edge-c" x1="410" y1="170" x2="410" y2="380" stroke="#000000" stroke-width="2"/>
            <text id="scene2-label-c" x="425" y="275" font-size="14" fill="#000000" text-anchor="start">c=30</text>

            <!-- 边 b: P7(410,380) → P0(60,380) -->
            <line id="scene2-edge-b" x1="410" y1="380" x2="60" y2="380" stroke="#000000" stroke-width="2"/>
            <text id="scene2-label-b" x="235" y="405" font-size="14" fill="#000000" text-anchor="middle" font-weight="bold">b=50</text>

            <!-- 步骤1：平移箭头（虚线） -->
            <line id="scene2-arrow-1" x1="165" y1="205" x2="165" y2="380" stroke="#888888" stroke-width="1.5" 
                  stroke-dasharray="5,5" marker-end="url(#scene2-arrowhead)" class="hidden"/>
            <line id="scene2-arrow-2" x1="305" y1="170" x2="305" y2="380" stroke="#888888" stroke-width="1.5" 
                  stroke-dasharray="5,5" marker-end="url(#scene2-arrowhead)" class="hidden"/>

            <!-- 步骤1：重合边 h', f', d'（半透明蓝色，与底边 b 重合，向下偏移 5px） -->
            <line id="scene2-coincide-h" x1="60" y1="385" x2="165" y2="385" stroke="#1565c0" stroke-width="3" opacity="0.3" class="hidden"/>
            <line id="scene2-coincide-f" x1="165" y1="385" x2="305" y2="385" stroke="#1565c0" stroke-width="3" opacity="0.3" class="hidden"/>
            <line id="scene2-coincide-d" x1="305" y1="385" x2="410" y2="385" stroke="#1565c0" stroke-width="3" opacity="0.3" class="hidden"/>

            <!-- 步骤2：重合边 a', e'（半透明蓝色，与右边 c 重合，向右偏移 5px） -->
            <line id="scene2-coincide-a" x1="415" y1="205" x2="415" y2="380" stroke="#1565c0" stroke-width="3" opacity="0.3" class="hidden"/>
            <line id="scene2-coincide-e" x1="415" y1="170" x2="415" y2="275" stroke="#1565c0" stroke-width="3" opacity="0.3" class="hidden"/>

            <!-- 步骤3：g 边高亮标注 -->
            <text id="scene2-g-note" x="180" y="240" font-size="13" fill="#c62828" class="hidden">g 被计算两次</text>

            <!-- 公式框 -->
            <rect id="scene2-formula-box" x="460" y="80" width="310" height="120" fill="none" stroke="#2e7d32" stroke-width="2"/>
            <text id="scene2-formula-title" x="470" y="105" font-size="15" fill="#2e7d32" font-weight="bold">平移法推导</text>
            <text id="scene2-formula-1" x="470" y="130" font-size="14" fill="#333" class="hidden">步骤 1：水平边平移</text>
            <text id="scene2-formula-1b" x="470" y="150" font-size="14" fill="#333" class="hidden">h + f + d = b = 50 米</text>
            <text id="scene2-formula-2" x="470" y="170" font-size="14" fill="#333" class="hidden">步骤 2：竖直边平移</text>
            <text id="scene2-formula-2b" x="470" y="190" font-size="14" fill="#333" class="hidden">a + e = c + g = 30 + 10 = 40 米</text>
            <text id="scene2-formula-3" x="470" y="210" font-size="14" fill="#333" class="hidden">步骤 3：凹口边 g</text>
            <text id="scene2-formula-3b" x="470" y="230" font-size="14" fill="#333" class="hidden">g 在周长中出现 2 次</text>

            <!-- 结论框 -->
            <rect id="scene2-conclusion-box" x="460" y="250" width="310" height="60" fill="none" stroke="#2e7d32" stroke-width="2" class="hidden"/>
            <text id="scene2-conclusion" x="470" y="275" font-size="15" fill="#2e7d32" font-weight="bold" class="hidden">周长 = 2b + 2c + 2g = 180 米</text>
            <text id="scene2-conclusion-detail" x="470" y="295" font-size="13" fill="#2e7d32" class="hidden">2×50 + 2×30 + 2×10 = 180 米</text>

            <!-- 控件栏 -->
            <g id="scene2-controls">
                <button id="scene2-btn-prev" class="scene2-btn">◀ 上一步</button>
                <span id="scene2-step-indicator">步骤 1/5</span>
                <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 2 实现 - 平移法求周长

        // 状态变量
        let currentStep = 0;
        const totalSteps = 5;

        // 每步需要显示的元素 ID 列表
        const stepElements = {
            0: [], // 初始状态：只显示基础图形
            1: ['scene2-arrow-1', 'scene2-arrow-2', 'scene2-coincide-h', 'scene2-coincide-f', 'scene2-coincide-d', 
                'scene2-formula-1', 'scene2-formula-1b'],
            2: ['scene2-coincide-a', 'scene2-coincide-e', 'scene2-formula-2', 'scene2-formula-2b'],
            3: ['scene2-g-note', 'scene2-formula-3', 'scene2-formula-3b'],
            4: ['scene2-conclusion-box', 'scene2-conclusion', 'scene2-conclusion-detail']
        };

        // 显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('hidden');
                el.style.display = '';
                el.style.opacity = '1';
            }
        }

        // 隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.add('hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 更新显示状态
        function updateDisplay() {
            // 根据当前步骤显示/隐藏元素
            for (let step = 0; step < totalSteps; step++) {
                const elements = stepElements[step];
                if (step <= currentStep) {
                    elements.forEach(id => showElement(id));
                } else {
                    elements.forEach(id => hideElement(id));
                }
            }

            // 更新按钮状态
            const prevBtn = document.getElementById('scene2-btn-prev');
            const nextBtn = document.getElementById('scene2-btn-next');
            const indicator = document.getElementById('scene2-step-indicator');

            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === totalSteps - 1);
            indicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;

            // 步骤 3 时高亮 g 边
            const edgeG = document.getElementById('scene2-edge-g');
            if (currentStep >= 3) {
                edgeG.setAttribute('stroke', '#c62828');
                edgeG.setAttribute('stroke-width', '3');
            } else {
                edgeG.setAttribute('stroke', '#000000');
                edgeG.setAttribute('stroke-width', '2');
            }
        }

        // 上一步
        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        }

        // 下一步
        function nextStep() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateDisplay();
            }
        }

        // 绑定事件
        document.getElementById('scene2-btn-prev').addEventListener('click', prevStep);
        document.getElementById('scene2-btn-next').addEventListener('click', nextStep);

        // 初始化
        updateDisplay();
    })();
    </script>
</body>
</html>
