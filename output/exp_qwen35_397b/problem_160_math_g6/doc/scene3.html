<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周长构成对比 - 矩形周长 vs 凹口额外贡献</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene3-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene3-svg {
            width: 800px;
            height: 500px;
        }
        /* 按钮样式 */
        .scene3-btn {
            position: absolute;
            bottom: 15px;
            padding: 10px 20px;
            font-size: 14px;
            border: 2px solid #1976d2;
            border-radius: 6px;
            background: #e3f2fd;
            cursor: pointer;
            transition: all 0.2s;
        }
        .scene3-btn:hover {
            background: #bbdefb;
        }
        .scene3-btn.active {
            background: #1976d2;
            color: #ffffff;
        }
        #scene3-btn-1 { left: 220px; }
        #scene3-btn-2 { left: 350px; }
        #scene3-btn-3 { left: 480px; }
        
        /* 数值框样式 */
        #scene3-value-box {
            fill: #ffffff;
            stroke: #2e7d32;
            stroke-width: 2;
        }
        #scene3-value-text {
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 18px;
            fill: #333333;
        }
        #scene3-value-text.final {
            font-size: 24px;
            font-weight: bold;
            fill: #2e7d32;
        }
        
        /* 元素显隐控制 */
        .scene3-hidden {
            display: none;
            opacity: 0;
        }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 外接矩形（灰色虚线，状态 1/3 显示） -->
            <rect id="scene3-outer-rect" 
                  x="180" y="80" width="400" height="180" 
                  fill="none" 
                  stroke="#888888" 
                  stroke-width="2" 
                  stroke-dasharray="8,4"
                  class="scene3-hidden"/>
            
            <!-- 凹口高亮区（红色半透明，状态 2/3 显示） -->
            <rect id="scene3-notch-highlight" 
                  x="340" y="140" width="80" height="120" 
                  fill="#c62828" 
                  fill-opacity="0.2"
                  class="scene3-hidden"/>
            
            <!-- 凹多边形路径（黑色实线，始终显示） -->
            <!-- 根据图片重新规划顶点坐标 -->
            <!-- 从左下角开始顺时针：a(左竖)→h(上横)→g(凹槽竖)→f(凹槽横)→e(右竖)→d(顶横)→c(右竖)→b(底横) -->
            <path id="scene3-concave-path" 
                  d="M 180 260 L 180 160 L 260 160 L 260 200 L 340 200 L 340 140 L 420 140 L 420 200 L 500 200 L 500 80 L 580 80 L 580 260 Z" 
                  fill="none" 
                  stroke="#000000" 
                  stroke-width="2.5"/>
            
            <!-- 边标签 b (底边) -->
            <text id="scene3-label-b" 
                  x="380" y="285" 
                  font-size="16px" 
                  fill="#333333" 
                  text-anchor="middle">b=50</text>
            
            <!-- 边标签 c (右边) -->
            <text id="scene3-label-c" 
                  x="595" y="175" 
                  font-size="16px" 
                  fill="#333333" 
                  text-anchor="middle">c=30</text>
            
            <!-- 边标签 g (凹槽竖边) -->
            <text id="scene3-label-g" 
                  x="325" y="180" 
                  font-size="16px" 
                  fill="#333333" 
                  text-anchor="end">g=10</text>
            
            <!-- 数值框背景 -->
            <rect id="scene3-value-box" 
                  x="200" y="320" width="400" height="50" 
                  rx="6"
                  class="scene3-hidden"/>
            
            <!-- 数值文本 -->
            <text id="scene3-value-text" 
                  x="400" y="352" 
                  font-size="18px" 
                  fill="#333333" 
                  text-anchor="middle"
                  class="scene3-hidden"></text>
            
            <!-- 控件按钮 -->
            <g id="scene3-controls">
                <rect id="scene3-btn-1-bg" x="220" y="445" width="100" height="35" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
                <text id="scene3-btn-1-text" x="270" y="468" font-size="14px" fill="#1976d2" text-anchor="middle">外接矩形</text>
                
                <rect id="scene3-btn-2-bg" x="350" y="445" width="100" height="35" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
                <text id="scene3-btn-2-text" x="400" y="468" font-size="14px" fill="#1976d2" text-anchor="middle">凹口贡献</text>
                
                <rect id="scene3-btn-3-bg" x="480" y="445" width="100" height="35" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
                <text id="scene3-btn-3-text" x="530" y="468" font-size="14px" fill="#1976d2" text-anchor="middle">总周长</text>
            </g>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 3 实现：周长构成对比
        
        // 状态管理
        let currentState = 0; // 0=初始, 1=外接矩形, 2=凹口贡献, 3=总周长
        
        // 获取 DOM 元素
        const outerRect = document.getElementById('scene3-outer-rect');
        const notchHighlight = document.getElementById('scene3-notch-highlight');
        const valueBox = document.getElementById('scene3-value-box');
        const valueText = document.getElementById('scene3-value-text');
        
        // 按钮背景
        const btn1Bg = document.getElementById('scene3-btn-1-bg');
        const btn1Text = document.getElementById('scene3-btn-1-text');
        const btn2Bg = document.getElementById('scene3-btn-2-bg');
        const btn2Text = document.getElementById('scene3-btn-2-text');
        const btn3Bg = document.getElementById('scene3-btn-3-bg');
        const btn3Text = document.getElementById('scene3-btn-3-text');
        
        // 显示/隐藏工具函数
        function show(el) {
            el.classList.remove('scene3-hidden');
            el.style.display = '';
            el.style.opacity = '1';
        }
        
        function hide(el) {
            el.classList.add('scene3-hidden');
            el.style.display = 'none';
            el.style.opacity = '0';
        }
        
        // 更新按钮高亮状态
        function updateButtonHighlight(activeBtn) {
            // 重置所有按钮
            btn1Bg.setAttribute('fill', '#e3f2fd');
            btn1Text.setAttribute('fill', '#1976d2');
            btn2Bg.setAttribute('fill', '#e3f2fd');
            btn2Text.setAttribute('fill', '#1976d2');
            btn3Bg.setAttribute('fill', '#e3f2fd');
            btn3Text.setAttribute('fill', '#1976d2');
            
            // 高亮当前按钮
            if (activeBtn === 1) {
                btn1Bg.setAttribute('fill', '#1976d2');
                btn1Text.setAttribute('fill', '#ffffff');
            } else if (activeBtn === 2) {
                btn2Bg.setAttribute('fill', '#1976d2');
                btn2Text.setAttribute('fill', '#ffffff');
            } else if (activeBtn === 3) {
                btn3Bg.setAttribute('fill', '#1976d2');
                btn3Text.setAttribute('fill', '#ffffff');
            }
        }
        
        // 状态 0：初始状态
        function showState0() {
            hide(outerRect);
            hide(notchHighlight);
            hide(valueBox);
            hide(valueText);
            updateButtonHighlight(0);
        }
        
        // 状态 1：外接矩形
        function showState1() {
            show(outerRect);
            hide(notchHighlight);
            show(valueBox);
            show(valueText);
            valueText.textContent = '外接矩形周长 = 2(b+c) = 2(50+30) = 160 米';
            valueText.classList.remove('final');
            updateButtonHighlight(1);
        }
        
        // 状态 2：凹口贡献
        function showState2() {
            hide(outerRect);
            show(notchHighlight);
            show(valueBox);
            show(valueText);
            valueText.textContent = '凹口额外贡献 = 2g = 2×10 = 20 米';
            valueText.classList.remove('final');
            updateButtonHighlight(2);
        }
        
        // 状态 3：总周长
        function showState3() {
            show(outerRect);
            show(notchHighlight);
            show(valueBox);
            show(valueText);
            valueText.textContent = '总周长 = 2(b+c) + 2g = 160 + 20 = 180 米';
            valueText.classList.add('final');
            updateButtonHighlight(3);
        }
        
        // 状态切换函数
        function setState(state) {
            currentState = state;
            if (state === 0) showState0();
            else if (state === 1) showState1();
            else if (state === 2) showState2();
            else if (state === 3) showState3();
        }
        
        // 按钮点击事件
        document.getElementById('scene3-btn-1-bg').addEventListener('click', function() {
            setState(1);
        });
        document.getElementById('scene3-btn-1-text').addEventListener('click', function() {
            setState(1);
        });
        
        document.getElementById('scene3-btn-2-bg').addEventListener('click', function() {
            setState(2);
        });
        document.getElementById('scene3-btn-2-text').addEventListener('click', function() {
            setState(2);
        });
        
        document.getElementById('scene3-btn-3-bg').addEventListener('click', function() {
            setState(3);
        });
        document.getElementById('scene3-btn-3-text').addEventListener('click', function() {
            setState(3);
        });
        
        // 初始化：状态 0
        setState(0);
        
    })();
    </script>
</body>
</html>
