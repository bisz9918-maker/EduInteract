<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNA 与 RNA 组成成分对比及选项分析</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 5px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; z-index: 10; }
        .scene2-btn { padding: 6px 12px; font-size: 13px; border: 1px solid #333; background: #f5f5f5; cursor: pointer; border-radius: 4px; }
        .scene2-btn:hover { background: #e0e0e0; }
        .scene2-btn.active { background: #1565c0; color: #fff; border-color: #1565c0; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义样式 -->
            <defs>
                <style>
                    .scene2-table-bg { fill: #f9f9f9; stroke: #333; stroke-width: 1; }
                    .scene2-box { fill: #fff; stroke: #333; stroke-width: 1.5; }
                    .scene2-box-highlight { stroke: #1565c0; stroke-width: 3; }
                    .scene2-base-circle { stroke: #333; stroke-width: 1.5; }
                    .scene2-text-label { font-size: 14px; fill: #333; text-anchor: middle; }
                    .scene2-text-small { font-size: 12px; fill: #555; text-anchor: middle; }
                    .scene2-text-option { font-size: 13px; fill: #333; text-anchor: start; }
                    .scene2-mark-correct { fill: #2e7d32; font-size: 14px; }
                    .scene2-mark-wrong { fill: #c62828; font-size: 14px; }
                    .scene2-arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
                    .scene2-hidden { opacity: 0; }
                </style>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
                </marker>
            </defs>

            <!-- ===== 对比表区域 (20,30)-(280,280) ===== -->
            <rect id="scene2-table-bg" x="20" y="30" width="260" height="250" class="scene2-table-bg" rx="4"/>
            <text id="scene2-table-title" x="150" y="55" class="scene2-text-label" font-weight="bold">DNA vs RNA</text>

            <!-- 列标题 -->
            <text id="scene2-table-dna-title" x="90" y="80" class="scene2-text-label" font-weight="bold">DNA</text>
            <text id="scene2-table-rna-title" x="230" y="80" class="scene2-text-label" font-weight="bold">RNA</text>

            <!-- 五碳糖行 -->
            <text id="scene2-table-sugar-label" x="45" y="115" class="scene2-text-small">五碳糖</text>
            <text id="scene2-table-dna-sugar" x="90" y="115" class="scene2-text-small">脱氧核糖</text>
            <text id="scene2-table-rna-sugar" x="230" y="115" class="scene2-text-small">核糖</text>

            <!-- 碱基行 -->
            <text id="scene2-table-base-label" x="45" y="150" class="scene2-text-small">碱基</text>
            <text id="scene2-table-dna-base" x="90" y="150" class="scene2-text-small">A,T,C,G</text>
            <text id="scene2-table-rna-base" x="230" y="150" class="scene2-text-small">A,U,C,G</text>

            <!-- 核苷酸行 -->
            <text id="scene2-table-nucleotide-label" x="45" y="185" class="scene2-text-small">核苷酸</text>
            <text id="scene2-table-dna-nucleotide" x="90" y="185" class="scene2-text-small">4 种</text>
            <text id="scene2-table-rna-nucleotide" x="230" y="185" class="scene2-text-small">4 种</text>

            <!-- 高亮框（初始隐藏） -->
            <rect id="scene2-highlight-dna-base" x="70" y="135" width="60" height="25" fill="none" stroke="#1565c0" stroke-width="2" class="scene2-hidden"/>
            <rect id="scene2-highlight-dna-nucleotide" x="75" y="170" width="40" height="25" fill="none" stroke="#1565c0" stroke-width="2" class="scene2-hidden"/>
            <rect id="scene2-highlight-sugar-dna" x="70" y="100" width="60" height="25" fill="none" stroke="#1565c0" stroke-width="2" class="scene2-hidden"/>
            <rect id="scene2-highlight-sugar-rna" x="210" y="100" width="50" height="25" fill="none" stroke="#1565c0" stroke-width="2" class="scene2-hidden"/>

            <!-- ===== 概念图区域 (320,50)-(700,130) ===== -->
            <!-- 方框 A -->
            <rect id="scene2-box-a" x="320" y="50" width="35" height="40" class="scene2-box"/>
            <text id="scene2-label-a" x="337" y="75" class="scene2-text-label">A</text>

            <!-- 加号 -->
            <text x="362" y="75" class="scene2-text-label" font-weight="bold">+</text>

            <!-- 方框 B (糖) -->
            <rect id="scene2-box-b" x="375" y="45" width="45" height="55" class="scene2-box"/>
            <text id="scene2-label-b" x="397" y="70" class="scene2-text-label">B</text>
            <text id="scene2-label-b-sugar" x="397" y="92" class="scene2-text-small">糖</text>
            <text id="scene2-box-b-content" x="397" y="85" class="scene2-text-small scene2-hidden" fill="#1565c0" font-weight="bold">脱氧核糖</text>

            <!-- 加号 -->
            <text x="427" y="75" class="scene2-text-label" font-weight="bold">+</text>

            <!-- 方框 C (磷酸) -->
            <rect id="scene2-box-c" x="440" y="45" width="55" height="55" class="scene2-box"/>
            <text id="scene2-label-c" x="467" y="70" class="scene2-text-label">C</text>
            <text id="scene2-label-c-phosphate" x="467" y="92" class="scene2-text-small">磷酸</text>

            <!-- 箭头 1 -->
            <line id="scene2-arrow-1" x1="495" y1="72" x2="525" y2="72" class="scene2-arrow"/>

            <!-- 方框 D -->
            <rect id="scene2-box-d" x="530" y="45" width="80" height="55" class="scene2-box"/>
            <text id="scene2-label-d" x="570" y="68" class="scene2-text-label">D</text>
            <text id="scene2-label-d-bracket" x="570" y="88" class="scene2-text-small">( )</text>
            <text id="scene2-box-d-content" x="570" y="85" class="scene2-text-small scene2-hidden" fill="#1565c0" font-weight="bold">脱氧核苷酸</text>

            <!-- 箭头 2 -->
            <line id="scene2-arrow-2" x1="610" y1="72" x2="640" y2="72" class="scene2-arrow"/>

            <!-- 方框 E (DNA) -->
            <rect id="scene2-box-e" x="645" y="45" width="60" height="55" class="scene2-box"/>
            <text id="scene2-label-e" x="675" y="68" class="scene2-text-label">E</text>
            <text id="scene2-label-e-dna" x="675" y="90" class="scene2-text-small">DNA</text>

            <!-- ===== 碱基展示区 (320,130)-(720,280) ===== -->
            <rect id="scene2-base-area-bg" x="320" y="130" width="400" height="150" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="4"/>
            <text id="scene2-base-title" x="520" y="155" class="scene2-text-label" font-weight="bold">4 种碱基</text>

            <!-- 碱基圆形图标 -->
            <circle id="scene2-base-a" cx="365" cy="195" r="22" fill="#1565c0" fill-opacity="0.15" class="scene2-base-circle"/>
            <text id="scene2-base-a-label" x="365" y="200" class="scene2-text-label" fill="#1565c0" font-weight="bold">A</text>

            <circle id="scene2-base-t" cx="425" cy="195" r="22" fill="#c62828" fill-opacity="0.15" class="scene2-base-circle"/>
            <text id="scene2-base-t-label" x="425" y="200" class="scene2-text-label" fill="#c62828" font-weight="bold">T</text>

            <circle id="scene2-base-c" cx="485" cy="195" r="22" fill="#2e7d32" fill-opacity="0.15" class="scene2-base-circle"/>
            <text id="scene2-base-c-label" x="485" y="200" class="scene2-text-label" fill="#2e7d32" font-weight="bold">C</text>

            <circle id="scene2-base-g" cx="545" cy="195" r="22" fill="#f57c00" fill-opacity="0.15" class="scene2-base-circle"/>
            <text id="scene2-base-g-label" x="545" y="200" class="scene2-text-label" fill="#f57c00" font-weight="bold">G</text>

            <circle id="scene2-base-u" cx="605" cy="195" r="22" fill="#7b1fa2" fill-opacity="0.15" class="scene2-base-circle"/>
            <text id="scene2-base-u-label" x="605" y="200" class="scene2-text-label" fill="#7b1fa2" font-weight="bold">U</text>

            <text id="scene2-nucleotide-title" x="660" y="220" class="scene2-text-small">4 种脱氧核苷酸</text>

            <!-- 错误标记（初始隐藏） -->
            <text id="scene2-wrong-mark-5" x="520" y="250" class="scene2-mark-wrong scene2-hidden" font-size="16px">✗ 不是 5 种</text>

            <!-- ===== 选项区 (20,290)-(780,430) ===== -->
            <rect id="scene2-option-area-bg" x="20" y="290" width="760" height="140" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4"/>

            <!-- 选项文本 -->
            <text id="scene2-opt-a-text" x="40" y="320" class="scene2-text-option">A. A 表示的碱基有 5 种</text>
            <text id="scene2-opt-b-text" x="40" y="350" class="scene2-text-option">B. D 表示脱氧核苷酸</text>
            <text id="scene2-opt-c-text" x="40" y="380" class="scene2-text-option">C. D 表示的结构有 8 种</text>
            <text id="scene2-opt-d-text" x="40" y="410" class="scene2-text-option">D. B 表示的是核糖</text>

            <!-- 判断标记（初始隐藏） -->
            <text id="scene2-mark-a" x="250" y="320" class="scene2-mark-wrong scene2-hidden">✗ 错误</text>
            <text id="scene2-mark-b" x="250" y="350" class="scene2-mark-correct scene2-hidden">✓ 正确</text>
            <text id="scene2-mark-c" x="250" y="380" class="scene2-mark-wrong scene2-hidden">✗ 错误</text>
            <text id="scene2-mark-d" x="250" y="410" class="scene2-mark-wrong scene2-hidden">✗ 错误</text>

            <!-- 分析说明区 -->
            <text id="scene2-analysis-title" x="320" y="315" class="scene2-text-label" font-weight="bold" fill="#1565c0">分析说明：</text>
            <text id="scene2-analysis-text" x="320" y="340" class="scene2-text-small" text-anchor="start">请点击下方按钮分析各选项</text>
            <text id="scene2-analysis-line1" x="320" y="365" class="scene2-text-small" text-anchor="start" class="scene2-hidden"></text>
            <text id="scene2-analysis-line2" x="320" y="385" class="scene2-text-small" text-anchor="start" class="scene2-hidden"></text>
            <text id="scene2-analysis-line3" x="320" y="405" class="scene2-text-small" text-anchor="start" class="scene2-hidden"></text>

            <!-- ===== 控件栏 (SVG 内部底部) ===== -->
            <foreignObject x="0" y="445" width="800" height="50">
                <div id="scene2-controls" xmlns="http://www.w3.org/1999/xhtml">
                    <button id="scene2-btn-init" class="scene2-btn active">初始</button>
                    <button id="scene2-btn-a" class="scene2-btn">选项 A</button>
                    <button id="scene2-btn-b" class="scene2-btn">选项 B</button>
                    <button id="scene2-btn-c" class="scene2-btn">选项 C</button>
                    <button id="scene2-btn-d" class="scene2-btn">选项 D</button>
                </div>
            </foreignObject>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 2: DNA 与 RNA 组成成分对比及选项分析

        const currentState = { value: 0 };

        // 分析说明文本内容
        const analysisTexts = {
            0: "请点击下方按钮分析各选项",
            1: "错误。A 代表含氮碱基，DNA 中只有 4 种碱基 (A,T,C,G)。5 种是 DNA+RNA 的总碱基数 (A,T,C,G,U)。",
            2: "正确。D 是由一分子含氮碱基 (A)、一分子脱氧核糖 (B) 和一分子磷酸 (C) 组成的脱氧核苷酸，是 DNA 的基本组成单位。",
            3: "错误。D 表示脱氧核苷酸，根据碱基种类 (A,T,C,G) 不同，脱氧核苷酸只有 4 种。8 种是 DNA(4 种)+RNA(4 种) 的核苷酸总数。",
            4: "错误。B 表示五碳糖，在 DNA 中 B 是脱氧核糖，不是核糖。核糖存在于 RNA 中。"
        };

        // 辅助函数：显示/隐藏元素
        function show(el) {
            if (el) {
                el.style.opacity = '1';
                el.style.display = '';
            }
        }

        function hide(el) {
            if (el) {
                el.style.opacity = '0';
                el.style.display = 'none';
            }
        }

        // 重置所有高亮和标记
        function resetAll() {
            // 隐藏所有高亮框
            hide(document.getElementById('scene2-highlight-dna-base'));
            hide(document.getElementById('scene2-highlight-dna-nucleotide'));
            hide(document.getElementById('scene2-highlight-sugar-dna'));
            hide(document.getElementById('scene2-highlight-sugar-rna'));

            // 隐藏概念图内容
            hide(document.getElementById('scene2-box-b-content'));
            hide(document.getElementById('scene2-box-d-content'));

            // 隐藏错误标记
            hide(document.getElementById('scene2-wrong-mark-5'));

            // 隐藏所有选项判断标记
            hide(document.getElementById('scene2-mark-a'));
            hide(document.getElementById('scene2-mark-b'));
            hide(document.getElementById('scene2-mark-c'));
            hide(document.getElementById('scene2-mark-d'));

            // 恢复概念图框默认样式
            document.getElementById('scene2-box-b').classList.remove('scene2-box-highlight');
            document.getElementById('scene2-box-d').classList.remove('scene2-box-highlight');
        }

        // 更新按钮状态
        function updateButtons(newState) {
            const buttons = ['scene2-btn-init', 'scene2-btn-a', 'scene2-btn-b', 'scene2-btn-c', 'scene2-btn-d'];
            buttons.forEach((btnId, idx) => {
                const btn = document.getElementById(btnId);
                if (idx === newState) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // 更新分析文本
        function updateAnalysis(state) {
            const textEl = document.getElementById('scene2-analysis-text');
            textEl.textContent = analysisTexts[state];
        }

        // 状态切换函数
        function updateState(newState) {
            currentState.value = newState;
            resetAll();
            updateButtons(newState);
            updateAnalysis(newState);

            switch (newState) {
                case 0: // 初始状态
                    // 无需额外操作，已重置
                    break;

                case 1: // 选项 A
                    // 高亮 DNA 碱基单元格
                    show(document.getElementById('scene2-highlight-dna-base'));
                    // 显示错误标记
                    show(document.getElementById('scene2-wrong-mark-5'));
                    show(document.getElementById('scene2-mark-a'));
                    break;

                case 2: // 选项 B
                    // 高亮 D 方框
                    document.getElementById('scene2-box-d').classList.add('scene2-box-highlight');
                    // 显示 D 框内容
                    show(document.getElementById('scene2-box-d-content'));
                    // 显示正确标记
                    show(document.getElementById('scene2-mark-b'));
                    break;

                case 3: // 选项 C
                    // 高亮 DNA 核苷酸单元格
                    show(document.getElementById('scene2-highlight-dna-nucleotide'));
                    // 显示错误标记
                    show(document.getElementById('scene2-mark-c'));
                    break;

                case 4: // 选项 D
                    // 高亮 B 方框
                    document.getElementById('scene2-box-b').classList.add('scene2-box-highlight');
                    // 显示 B 框内容
                    show(document.getElementById('scene2-box-b-content'));
                    // 高亮糖对比
                    show(document.getElementById('scene2-highlight-sugar-dna'));
                    show(document.getElementById('scene2-highlight-sugar-rna'));
                    // 显示错误标记
                    show(document.getElementById('scene2-mark-d'));
                    break;
            }
        }

        // 绑定按钮事件
        document.getElementById('scene2-btn-init').addEventListener('click', () => updateState(0));
        document.getElementById('scene2-btn-a').addEventListener('click', () => updateState(1));
        document.getElementById('scene2-btn-b').addEventListener('click', () => updateState(2));
        document.getElementById('scene2-btn-c').addEventListener('click', () => updateState(3));
        document.getElementById('scene2-btn-d').addEventListener('click', () => updateState(4));

        // 初始化
        updateState(0);
    })();
    </script>
</body>
</html>
