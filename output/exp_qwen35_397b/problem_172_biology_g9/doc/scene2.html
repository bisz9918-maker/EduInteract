<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三种跨膜运输方式对比</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        /* 列背景高亮类 */
        .highlight-green {
            fill-opacity: 0.35 !important;
        }
        .highlight-blue {
            fill-opacity: 0.35 !important;
        }
        .highlight-red {
            fill-opacity: 0.35 !important;
        }
        /* 元素淡入动画 */
        .fade-in {
            opacity: 0;
            transition: opacity 0.3s ease-in;
        }
        .fade-in.visible {
            opacity: 1;
        }
        /* 按钮样式 */
        .scene2-btn {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #333;
            border-radius: 4px;
            background: #f0f0f0;
        }
        .scene2-btn:hover {
            background: #e0e0e0;
        }
        .scene2-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        /* 控件栏 */
        #scene2-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }
        #scene2-step-indicator {
            font-size: 14px;
            color: #333;
            min-width: 80px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <!-- 标题 -->
            <text id="scene2-title" x="400" y="45" text-anchor="middle" font-size="18px" font-weight="bold" fill="#000">
                三种跨膜运输方式对比
            </text>

            <!-- 列标题（放在白色背景区域） -->
            <text id="scene2-col-passive-title" x="160" y="95" text-anchor="middle" font-size="16px" fill="#000">自由扩散</text>
            <text id="scene2-col-facilitated-title" x="380" y="95" text-anchor="middle" font-size="16px" fill="#000">协助扩散②</text>
            <text id="scene2-col-active-title" x="600" y="95" text-anchor="middle" font-size="16px" fill="#000">主动运输①</text>

            <!-- 维度行标题（左移到 x=25，满足 EDGE_MARGIN=20 要求） -->
            <text id="scene2-dim-gradient" x="25" y="140" font-size="14px" fill="#000">浓度梯度</text>
            <text id="scene2-dim-carrier" x="25" y="200" font-size="14px" fill="#000">载体蛋白</text>
            <text id="scene2-dim-energy" x="25" y="260" font-size="14px" fill="#000">能量消耗</text>
            <text id="scene2-dim-example" x="25" y="320" font-size="14px" fill="#000">实例</text>

            <!-- 垂直分隔线 -->
            <line id="scene2-divider-v1" x1="270" y1="110" x2="270" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            <line id="scene2-divider-v2" x1="490" y1="110" x2="490" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>

            <!-- 水平分隔线 -->
            <line id="scene2-divider-h1" x1="50" y1="160" x2="710" y2="160" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            <line id="scene2-divider-h2" x1="50" y1="220" x2="710" y2="220" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            <line id="scene2-divider-h3" x1="50" y1="280" x2="710" y2="280" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            <line id="scene2-divider-h4" x1="50" y1="370" x2="710" y2="370" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>

            <!-- 三列背景矩形（放在分隔线下方，只在内容区域，避开文字行） -->
            <!-- 自由扩散列背景 - 分成 4 个单元格背景 -->
            <g id="scene2-col-passive-bg">
                <rect x="90" y="125" width="155" height="30" fill="#2e7d32" fill-opacity="0.2" stroke="none"/>
                <rect x="90" y="185" width="155" height="30" fill="#2e7d32" fill-opacity="0.2" stroke="none"/>
                <rect x="90" y="245" width="155" height="30" fill="#2e7d32" fill-opacity="0.2" stroke="none"/>
                <rect x="90" y="305" width="155" height="60" fill="#2e7d32" fill-opacity="0.2" stroke="none"/>
            </g>
            <!-- 协助扩散列背景 -->
            <g id="scene2-col-facilitated-bg">
                <rect x="310" y="125" width="155" height="30" fill="#1565c0" fill-opacity="0.2" stroke="none"/>
                <rect x="310" y="185" width="155" height="30" fill="#1565c0" fill-opacity="0.2" stroke="none"/>
                <rect x="310" y="245" width="155" height="30" fill="#1565c0" fill-opacity="0.2" stroke="none"/>
                <rect x="310" y="305" width="155" height="60" fill="#1565c0" fill-opacity="0.2" stroke="none"/>
            </g>
            <!-- 主动运输列背景 -->
            <g id="scene2-col-active-bg">
                <rect x="530" y="125" width="155" height="30" fill="#c62828" fill-opacity="0.2" stroke="none"/>
                <rect x="530" y="185" width="155" height="30" fill="#c62828" fill-opacity="0.2" stroke="none"/>
                <rect x="530" y="245" width="155" height="30" fill="#c62828" fill-opacity="0.2" stroke="none"/>
                <rect x="530" y="305" width="155" height="60" fill="#c62828" fill-opacity="0.2" stroke="none"/>
            </g>

            <!-- 浓度梯度行内容 (步骤 1 显示) -->
            <g id="scene2-row-gradient" class="fade-in">
                <text x="160" y="145" text-anchor="middle" font-size="14px" fill="#000">顺浓度</text>
                <text x="380" y="145" text-anchor="middle" font-size="14px" fill="#000">顺浓度</text>
                <text id="scene2-active-gradient" x="600" y="145" text-anchor="middle" font-size="14px" fill="#c62828" font-weight="bold">逆浓度</text>
            </g>

            <!-- 载体蛋白行内容 (步骤 2 显示) -->
            <g id="scene2-row-carrier" class="fade-in">
                <text x="160" y="205" text-anchor="middle" font-size="14px" fill="#000">不需要</text>
                <text id="scene2-facilitated-carrier" x="380" y="205" text-anchor="middle" font-size="14px" fill="#1565c0" font-weight="bold">需要</text>
                <text x="600" y="205" text-anchor="middle" font-size="14px" fill="#000">需要</text>
            </g>

            <!-- 能量消耗行内容 (步骤 3 显示) -->
            <g id="scene2-row-energy" class="fade-in">
                <text x="160" y="265" text-anchor="middle" font-size="14px" fill="#000">不消耗</text>
                <text x="380" y="265" text-anchor="middle" font-size="14px" fill="#000">不消耗</text>
                <text id="scene2-active-energy" x="600" y="265" text-anchor="middle" font-size="14px" fill="#c62828" font-weight="bold">消耗 ATP</text>
            </g>

            <!-- 实例行内容 (步骤 4 显示) - 增加行间距到 30px，避免 CROWDED -->
            <g id="scene2-row-example" class="fade-in">
                <text x="160" y="330" text-anchor="middle" font-size="13px" fill="#000">O₂、CO₂</text>
                <text x="160" y="360" text-anchor="middle" font-size="13px" fill="#000">甘油、乙醇</text>
                <text x="380" y="330" text-anchor="middle" font-size="13px" fill="#000">葡萄糖进入</text>
                <text x="380" y="360" text-anchor="middle" font-size="13px" fill="#000">红细胞③</text>
                <text x="600" y="330" text-anchor="middle" font-size="13px" fill="#000">离子 Na⁺、K⁺</text>
                <text x="600" y="360" text-anchor="middle" font-size="13px" fill="#000">葡萄糖④</text>
            </g>

            <!-- 完整高亮边框 (步骤 5 显示) -->
            <rect id="scene2-highlight-passive" x="75" y="110" width="185" height="310" fill="none" stroke="#2e7d32" stroke-width="3" opacity="0"/>
            <rect id="scene2-highlight-facilitated" x="295" y="110" width="185" height="310" fill="none" stroke="#1565c0" stroke-width="3" opacity="0"/>
            <rect id="scene2-highlight-active" x="515" y="110" width="185" height="310" fill="none" stroke="#c62828" stroke-width="3" opacity="0"/>
        </svg>

        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn">◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 0/5</span>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现：三种跨膜运输方式对比

        // 状态管理
        let currentState = 0;
        const totalSteps = 5;

        // DOM 元素引用
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepIndicator = document.getElementById('scene2-step-indicator');

        // 各步骤需要显示的元素
        const steps = {
            0: [], // 初始状态：只显示框架
            1: ['scene2-row-gradient'], // 浓度梯度
            2: ['scene2-row-gradient', 'scene2-row-carrier'], // 载体蛋白
            3: ['scene2-row-gradient', 'scene2-row-carrier', 'scene2-row-energy'], // 能量消耗
            4: ['scene2-row-gradient', 'scene2-row-carrier', 'scene2-row-energy', 'scene2-row-example'], // 实例
            5: ['scene2-row-gradient', 'scene2-row-carrier', 'scene2-row-energy', 'scene2-row-example', 
                'scene2-highlight-passive', 'scene2-highlight-facilitated', 'scene2-highlight-active'] // 完成
        };

        // 更新显示状态
        function updateState() {
            // 更新步骤指示
            stepIndicator.textContent = `步骤 ${currentState}/${totalSteps}`;

            // 更新按钮状态
            btnPrev.disabled = currentState === 0;
            btnNext.disabled = currentState === totalSteps;
            btnNext.textContent = currentState === totalSteps ? '完成' : '下一步 ▶';

            // 显示/隐藏对应元素
            for (let step = 1; step <= totalSteps; step++) {
                const elements = steps[step];
                const shouldShow = step <= currentState;

                elements.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        if (shouldShow) {
                            el.classList.add('visible');
                            if (id.startsWith('scene2-highlight-')) {
                                el.style.opacity = '1';
                            }
                        } else {
                            el.classList.remove('visible');
                            if (id.startsWith('scene2-highlight-')) {
                                el.style.opacity = '0';
                            }
                        }
                    }
                });
            }

            // 列背景高亮
            const passiveBg = document.getElementById('scene2-col-passive-bg');
            const facilitatedBg = document.getElementById('scene2-col-facilitated-bg');
            const activeBg = document.getElementById('scene2-col-active-bg');

            if (currentState === 1) {
                // 步骤 1：主动运输列高亮
                activeBg.classList.add('highlight-red');
                passiveBg.classList.remove('highlight-green');
                facilitatedBg.classList.remove('highlight-blue');
            } else if (currentState === 2) {
                // 步骤 2：协助扩散列高亮
                facilitatedBg.classList.add('highlight-blue');
                passiveBg.classList.remove('highlight-green');
                activeBg.classList.remove('highlight-red');
            } else if (currentState === 3) {
                // 步骤 3：主动运输列高亮
                activeBg.classList.add('highlight-red');
                passiveBg.classList.remove('highlight-green');
                facilitatedBg.classList.remove('highlight-blue');
            } else if (currentState === 5) {
                // 步骤 5：三列同时高亮
                passiveBg.classList.add('highlight-green');
                facilitatedBg.classList.add('highlight-blue');
                activeBg.classList.add('highlight-red');
            } else {
                passiveBg.classList.remove('highlight-green');
                facilitatedBg.classList.remove('highlight-blue');
                activeBg.classList.remove('highlight-red');
            }
        }

        // 按钮事件绑定
        btnPrev.addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                updateState();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentState < totalSteps) {
                currentState++;
                updateState();
            }
        });

        // 初始化
        updateState();
    })();
    </script>
</body>
</html>
