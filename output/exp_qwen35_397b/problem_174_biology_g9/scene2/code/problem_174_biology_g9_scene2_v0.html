<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>突触兴奋传导与电流计偏转</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        /* 神经元样式 */
        .neuron-body {
            fill: #e3f2fd;
            stroke: #1565c0;
            stroke-width: 2;
        }
        .axon {
            fill: #fff9c4;
            stroke: #f9a825;
            stroke-width: 2;
        }
        /* 突触小泡 */
        .synaptic-vesicle {
            fill: #c62828;
        }
        /* 兴奋传导路径 */
        .conduction-path {
            fill: none;
            stroke: #c62828;
            stroke-width: 3;
            stroke-linecap: round;
        }
        /* 电流计 */
        .galvanometer {
            fill: #ffffff;
            stroke: #000000;
            stroke-width: 2;
        }
        .pointer {
            stroke: #000000;
            stroke-width: 2;
            transform-origin: center;
            transition: transform 0.3s ease;
        }
        /* 刺激点脉冲动画 */
        @keyframes pulse {
            0% { r: 5; opacity: 1; }
            50% { r: 12; opacity: 0.5; }
            100% { r: 5; opacity: 1; }
        }
        .stimulus-point {
            fill: #d32f2f;
            animation: pulse 0.8s infinite;
        }
        /* 高亮点 */
        .highlight-a {
            fill: #1565c0;
            opacity: 0.3;
        }
        .highlight-d {
            fill: #2e7d32;
            opacity: 0.3;
        }
        /* 阻断标记 */
        .block-mark {
            stroke: #d32f2f;
            stroke-width: 3;
            stroke-linecap: round;
        }
        /* 按钮样式 */
        .scene2-btn {
            position: absolute;
            bottom: 10px;
            height: 30px;
            padding: 0 15px;
            font-size: 14px;
            cursor: pointer;
            border: 2px solid #1565c0;
            border-radius: 5px;
            background: #ffffff;
            color: #1565c0;
            transition: all 0.2s;
        }
        .scene2-btn:hover {
            background: #1565c0;
            color: #ffffff;
        }
        .scene2-btn.active {
            background: #1565c0;
            color: #ffffff;
        }
        #scene2-btn-original { left: 70px; }
        #scene2-btn-b { left: 250px; }
        #scene2-btn-c { left: 430px; }
        /* 元素显隐控制 */
        .hidden {
            display: none;
            opacity: 0;
        }
        /* 波浪箭头动画 */
        @keyframes dash-flow {
            to { stroke-dashoffset: -20; }
        }
        .wave-arrow {
            animation: dash-flow 0.5s linear infinite;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 状态 1 标题 -->
            <text id="scene2-title1" x="400" y="35" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">刺激 b 点</text>
            
            <!-- 状态 1：刺激 b 点 -->
            <g id="scene2-state1">
                <!-- 神经元 B（状态 1） -->
                <ellipse id="scene2-neuron-b-state1" cx="290" cy="155" rx="90" ry="50" class="neuron-body"/>
                <!-- 轴突 B（状态 1） -->
                <rect id="scene2-axon-b-state1" x="50" y="135" width="150" height="40" class="axon"/>
                <!-- 神经元 C（状态 1） -->
                <ellipse id="scene2-neuron-c-state1" cx="510" cy="155" rx="90" ry="50" class="neuron-body"/>
                <!-- 轴突 C（状态 1） -->
                <rect id="scene2-axon-c-state1" x="600" y="135" width="150" height="40" class="axon"/>
                
                <!-- 突触间隙（状态 1） -->
                <rect x="380" y="105" width="40" height="100" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
                <!-- 突触小泡 -->
                <circle cx="370" cy="135" r="3" class="synaptic-vesicle"/>
                <circle cx="375" cy="145" r="3" class="synaptic-vesicle"/>
                <circle cx="368" cy="155" r="3" class="synaptic-vesicle"/>
                <circle cx="372" cy="165" r="3" class="synaptic-vesicle"/>
                <circle cx="365" cy="175" r="3" class="synaptic-vesicle"/>
                
                <!-- a 点、d 点、b 点 -->
                <circle id="scene2-point-a-state1" cx="100" cy="155" r="4" fill="#000"/>
                <text x="100" y="95" text-anchor="middle" font-size="14" fill="#333">a</text>
                <circle id="scene2-point-d-state1" cx="700" cy="155" r="4" fill="#000"/>
                <text x="700" y="95" text-anchor="middle" font-size="14" fill="#333">d</text>
                <circle id="scene2-point-b-state1" cx="280" cy="155" r="4" fill="#000"/>
                <text x="280" y="95" text-anchor="middle" font-size="14" fill="#333">b</text>
                
                <!-- 电流计（状态 1） -->
                <circle id="scene2-galvanometer1" cx="400" cy="65" r="25" class="galvanometer"/>
                <line x1="100" y1="155" x2="100" y2="65" stroke="#000" stroke-width="2"/>
                <line x1="100" y1="65" x2="375" y2="65" stroke="#000" stroke-width="2"/>
                <line x1="425" y1="65" x2="700" y2="65" stroke="#000" stroke-width="2"/>
                <line x1="700" y1="65" x2="700" y2="155" stroke="#000" stroke-width="2"/>
                <!-- 指针（状态 1） -->
                <line id="scene2-pointer1" x1="400" y1="65" x2="400" y2="45" class="pointer"/>
                
                <!-- 传导箭头（状态 1）- 初始隐藏 -->
                <path id="scene2-wave1" class="conduction-path wave-arrow hidden" d="M280,155 Q240,145 200,155 T120,155" stroke-dasharray="5,5"/>
                <path id="scene2-wave2" class="conduction-path wave-arrow hidden" d="M280,155 Q320,145 360,155" stroke-dasharray="5,5"/>
                <path id="scene2-wave3" class="conduction-path wave-arrow hidden" d="M420,155 Q480,145 540,155 T660,155" stroke-dasharray="5,5"/>
                
                <!-- 高亮点（状态 1）- 初始隐藏 -->
                <circle id="scene2-highlight-a1" cx="100" cy="155" r="10" class="highlight-a hidden"/>
                <circle id="scene2-highlight-d1" cx="700" cy="155" r="10" class="highlight-d hidden"/>
                
                <!-- 刺激点 b（状态 1）- 初始隐藏 -->
                <circle id="scene2-stimulus-b" cx="280" cy="155" r="5" class="stimulus-point hidden"/>
                
                <!-- 偏转次数标签（状态 1）- 初始隐藏 -->
                <text id="scene2-count1" x="400" y="125" text-anchor="middle" font-size="14" fill="#d32f2f" font-weight="bold" class="hidden">偏转 2 次</text>
                
                <!-- 神经元标签 B、C（放在椭圆下方） -->
                <text x="290" y="225" text-anchor="middle" font-size="14" fill="#333">B</text>
                <text x="510" y="225" text-anchor="middle" font-size="14" fill="#333">C</text>
            </g>
            
            <!-- 状态 2 标题 -->
            <text id="scene2-title2" x="400" y="275" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">刺激 c 点</text>
            
            <!-- 状态 2：刺激 c 点 -->
            <g id="scene2-state2">
                <!-- 神经元 B（状态 2） -->
                <ellipse id="scene2-neuron-b-state2" cx="290" cy="390" rx="90" ry="50" class="neuron-body"/>
                <!-- 轴突 B（状态 2） -->
                <rect id="scene2-axon-b-state2" x="50" y="370" width="150" height="40" class="axon"/>
                <!-- 神经元 C（状态 2） -->
                <ellipse id="scene2-neuron-c-state2" cx="510" cy="390" rx="90" ry="50" class="neuron-body"/>
                <!-- 轴突 C（状态 2） -->
                <rect id="scene2-axon-c-state2" x="600" y="370" width="150" height="40" class="axon"/>
                
                <!-- 突触间隙（状态 2） -->
                <rect x="380" y="340" width="40" height="100" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
                <!-- 突触小泡 -->
                <circle cx="370" cy="370" r="3" class="synaptic-vesicle"/>
                <circle cx="375" cy="380" r="3" class="synaptic-vesicle"/>
                <circle cx="368" cy="390" r="3" class="synaptic-vesicle"/>
                <circle cx="372" cy="400" r="3" class="synaptic-vesicle"/>
                <circle cx="365" cy="410" r="3" class="synaptic-vesicle"/>
                
                <!-- a 点、d 点、c 点 -->
                <circle id="scene2-point-a-state2" cx="100" cy="390" r="4" fill="#000"/>
                <text x="100" y="330" text-anchor="middle" font-size="14" fill="#333">a</text>
                <circle id="scene2-point-d-state2" cx="700" cy="390" r="4" fill="#000"/>
                <text x="700" y="330" text-anchor="middle" font-size="14" fill="#333">d</text>
                <circle id="scene2-point-c-state2" cx="520" cy="390" r="4" fill="#000"/>
                <text x="520" y="330" text-anchor="middle" font-size="14" fill="#333">c</text>
                
                <!-- 电流计（状态 2） -->
                <circle id="scene2-galvanometer2" cx="400" cy="305" r="25" class="galvanometer"/>
                <line x1="100" y1="390" x2="100" y2="305" stroke="#000" stroke-width="2"/>
                <line x1="100" y1="305" x2="375" y2="305" stroke="#000" stroke-width="2"/>
                <line x1="425" y1="305" x2="700" y2="305" stroke="#000" stroke-width="2"/>
                <line x1="700" y1="305" x2="700" y2="390" stroke="#000" stroke-width="2"/>
                <!-- 指针（状态 2） -->
                <line id="scene2-pointer2" x1="400" y1="305" x2="400" y2="285" class="pointer"/>
                
                <!-- 传导箭头（状态 2）- 初始隐藏 -->
                <path id="scene2-wave4" class="conduction-path wave-arrow hidden" d="M520,390 Q580,380 640,390 T700,390" stroke-dasharray="5,5"/>
                
                <!-- 阻断标记（状态 2）- 初始隐藏 -->
                <g id="scene2-block-mark" class="hidden">
                    <line x1="385" y1="375" x2="415" y2="405" class="block-mark"/>
                    <line x1="415" y1="375" x2="385" y2="405" class="block-mark"/>
                </g>
                
                <!-- 高亮点（状态 2）- 初始隐藏 -->
                <circle id="scene2-highlight-d2" cx="700" cy="390" r="10" class="highlight-d hidden"/>
                
                <!-- 刺激点 c（状态 2）- 初始隐藏 -->
                <circle id="scene2-stimulus-c" cx="520" cy="390" r="5" class="stimulus-point hidden"/>
                
                <!-- 偏转次数标签（状态 2）- 初始隐藏 -->
                <text id="scene2-count2" x="400" y="345" text-anchor="middle" font-size="14" fill="#d32f2f" font-weight="bold" class="hidden">偏转 1 次</text>
            </g>
            
            <!-- 神经元 A（原始状态）- 放在左侧空白区域 -->
            <g id="scene2-neuron-a">
                <ellipse cx="80" cy="430" rx="50" ry="35" class="neuron-body"/>
                <rect x="20" y="415" width="80" height="25" class="axon"/>
                <!-- 突触小泡 -->
                <circle cx="120" cy="420" r="3" class="synaptic-vesicle"/>
                <circle cx="125" cy="430" r="3" class="synaptic-vesicle"/>
                <circle cx="118" cy="440" r="3" class="synaptic-vesicle"/>
                <!-- 神经元标签 A（放在椭圆右侧） -->
                <text x="145" y="440" text-anchor="middle" font-size="14" fill="#333">A</text>
            </g>
        </svg>
        
        <!-- 控制按钮 -->
        <button id="scene2-btn-original" class="scene2-btn active">原始状态</button>
        <button id="scene2-btn-b" class="scene2-btn">刺激 b 点</button>
        <button id="scene2-btn-c" class="scene2-btn">刺激 c 点</button>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现：突触兴奋传导与电流计偏转
        
        let currentState = 0; // 0=原始状态，1=刺激 b 点，2=刺激 c 点
        
        const btnOriginal = document.getElementById('scene2-btn-original');
        const btnB = document.getElementById('scene2-btn-b');
        const btnC = document.getElementById('scene2-btn-c');
        
        // 隐藏元素工具函数
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.add('hidden');
                el.style.opacity = '0';
                el.style.display = 'none';
            }
        }
        
        // 显示元素工具函数
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('hidden');
                el.style.opacity = '1';
                el.style.display = '';
            }
        }
        
        // 设置指针偏转
        function setPointer(pointerId, rotation) {
            const pointer = document.getElementById(pointerId);
            if (pointer) {
                pointer.style.transform = `rotate(${rotation}deg)`;
            }
        }
        
        // 重置所有状态
        function resetAll() {
            // 隐藏状态 1 的动态元素
            hideElement('scene2-wave1');
            hideElement('scene2-wave2');
            hideElement('scene2-wave3');
            hideElement('scene2-highlight-a1');
            hideElement('scene2-highlight-d1');
            hideElement('scene2-stimulus-b');
            hideElement('scene2-count1');
            
            // 隐藏状态 2 的动态元素
            hideElement('scene2-wave4');
            hideElement('scene2-highlight-d2');
            hideElement('scene2-stimulus-c');
            hideElement('scene2-block-mark');
            hideElement('scene2-count2');
            
            // 重置指针
            setPointer('scene2-pointer1', 0);
            setPointer('scene2-pointer2', 0);
        }
        
        // 设置状态 1：刺激 b 点
        function setState1() {
            resetAll();
            
            // 显示刺激点
            showElement('scene2-stimulus-b');
            
            // 显示传导箭头
            showElement('scene2-wave1');
            showElement('scene2-wave2');
            showElement('scene2-wave3');
            
            // 延迟显示高亮点和偏转
            setTimeout(() => {
                showElement('scene2-highlight-a1');
                setPointer('scene2-pointer1', -30); // 向左偏转
            }, 300);
            
            setTimeout(() => {
                showElement('scene2-highlight-d1');
                setPointer('scene2-pointer1', 30); // 向右偏转
            }, 600);
            
            setTimeout(() => {
                showElement('scene2-count1');
            }, 900);
        }
        
        // 设置状态 2：刺激 c 点
        function setState2() {
            resetAll();
            
            // 显示刺激点
            showElement('scene2-stimulus-c');
            
            // 显示阻断标记
            showElement('scene2-block-mark');
            
            // 显示传导箭头（只能向右传导）
            showElement('scene2-wave4');
            
            // 延迟显示高亮点和偏转
            setTimeout(() => {
                showElement('scene2-highlight-d2');
                setPointer('scene2-pointer2', 30); // 向右偏转
            }, 300);
            
            setTimeout(() => {
                showElement('scene2-count2');
            }, 600);
        }
        
        // 按钮事件绑定
        btnOriginal.addEventListener('click', function() {
            currentState = 0;
            resetAll();
            btnOriginal.classList.add('active');
            btnB.classList.remove('active');
            btnC.classList.remove('active');
        });
        
        btnB.addEventListener('click', function() {
            currentState = 1;
            setState1();
            btnOriginal.classList.remove('active');
            btnB.classList.add('active');
            btnC.classList.remove('active');
        });
        
        btnC.addEventListener('click', function() {
            currentState = 2;
            setState2();
            btnOriginal.classList.remove('active');
            btnB.classList.remove('active');
            btnC.classList.add('active');
        });
        
    })();
    </script>
</body>
</html>
