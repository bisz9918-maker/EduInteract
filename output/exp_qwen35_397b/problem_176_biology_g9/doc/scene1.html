<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上臂动脉静脉血流方向示意图</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        .scene1-btn {
            padding: 8px 16px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .scene1-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene1-btn-prev {
            background: #e0e0e0;
            color: #333;
        }
        #scene1-btn-next {
            background: #1565c0;
            color: #fff;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #666;
            min-width: 80px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 上臂轮廓 -->
            <rect id="scene1-arm-outline" x="300" y="80" width="200" height="340" rx="20" ry="20" 
                  fill="#f0f0f0" stroke="#000000" stroke-width="2"/>
            
            <!-- 心脏方向指示 -->
            <text id="scene1-heart-label" x="400" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#000">心脏</text>
            <line id="scene1-heart-arrow-line" x1="400" y1="55" x2="400" y2="70" stroke="#000" stroke-width="2"/>
            <polygon id="scene1-heart-arrow-head" points="400,70 395,60 405,60" fill="#000"/>
            
            <!-- 手指方向指示 -->
            <text id="scene1-finger-label" x="400" y="455" text-anchor="middle" font-size="18" font-weight="bold" fill="#000">手指</text>
            <line id="scene1-finger-arrow-line" x1="400" y1="425" x2="400" y2="440" stroke="#000" stroke-width="2"/>
            <polygon id="scene1-finger-arrow-head" points="400,425 395,435 405,435" fill="#000"/>
            
            <!-- 动脉组（红色，右侧） -->
            <g id="scene1-artery-group" style="display: none; opacity: 0;">
                <!-- 动脉血管 -->
                <rect x="540" y="100" width="40" height="300" fill="#c62828" fill-opacity="0.2" stroke="#c62828" stroke-width="2"/>
                <!-- 动脉标签 -->
                <text x="560" y="70" text-anchor="middle" font-size="16" fill="#c62828" font-weight="bold">动脉</text>
                <!-- 动脉血流箭头（向下） -->
                <line x1="560" y1="150" x2="560" y2="330" stroke="#c62828" stroke-width="3"/>
                <polygon points="560,330 555,320 565,320" fill="#c62828"/>
            </g>
            
            <!-- 静脉组（蓝色，左侧） -->
            <g id="scene1-vein-group" style="display: none; opacity: 0;">
                <!-- 静脉血管 -->
                <rect x="220" y="100" width="40" height="300" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="2"/>
                <!-- 静脉标签 -->
                <text x="240" y="70" text-anchor="middle" font-size="16" fill="#1565c0" font-weight="bold">静脉</text>
                <!-- 静脉血流箭头（向上） -->
                <line x1="240" y1="350" x2="240" y2="170" stroke="#1565c0" stroke-width="3"/>
                <polygon points="240,170 235,180 245,180" fill="#1565c0"/>
            </g>
            
            <!-- 丝带组 -->
            <g id="scene1-band-group" style="display: none; opacity: 0;">
                <!-- 丝带（水平虚线） -->
                <line x1="180" y1="250" x2="620" y2="250" stroke="#888888" stroke-width="2" stroke-dasharray="8,4"/>
                <!-- 丝带标签 -->
                <text x="640" y="255" font-size="16" fill="#888888">丝带</text>
                
                <!-- 区域标注①（左下） -->
                <text x="200" y="340" text-anchor="middle" font-size="16" fill="#000" font-weight="bold">①</text>
                
                <!-- 区域标注②（右下） -->
                <text x="600" y="340" text-anchor="middle" font-size="16" fill="#000" font-weight="bold">②</text>
                
                <!-- 区域标注③（右上） -->
                <text x="600" y="160" text-anchor="middle" font-size="16" fill="#000" font-weight="bold">③</text>
                
                <!-- 区域标注④（左上） -->
                <text x="200" y="160" text-anchor="middle" font-size="16" fill="#000" font-weight="bold">④</text>
            </g>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
            <span id="scene1-step-indicator">步骤 0/3</span>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1: 上臂动脉静脉血流方向示意图
        
        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 上臂轮廓 | 圆角矩形 | (300,80)-(500,420) | 200×340 | - | 浅灰色填充#f0f0f0，描边#000000 |
        // | 静脉血管 | 矩形管道 | (220,100)-(260,400) | 40×300 | - | 蓝色 #1565c0，透明度 20% 填充 |
        // | 动脉血管 | 矩形管道 | (540,100)-(580,400) | 40×300 | - | 红色 #c62828，透明度 20% 填充 |
        // | 静脉箭头 | 箭头路径 | (240,350) 指向 (240,150) | 箭头长 100 | - | 蓝色，向上 |
        // | 动脉箭头 | 箭头路径 | (560,150) 指向 (560,350) | 箭头长 100 | - | 红色，向下 |
        // | 丝带 | 虚线 | (180,250)-(620,250) | 440×2 | - | 灰色 #888888 虚线 |
        // | 丝带标签 | text | (640,250) | ~32×16 | 右侧 | "丝带"文字 |
        // | 区域① | 文字 | (200,340) | - | - | 左下象限，静脉下方 |
        // | 区域② | 文字 | (600,340) | - | - | 右下象限，动脉下方 |
        // | 区域③ | 文字 | (600,160) | - | - | 右上象限，动脉上方 |
        // | 区域④ | 文字 | (200,160) | - | - | 左上象限，静脉上方 |
        // | "静脉"标签 | text | (240,70) | ~32×16 | 上方 | 静脉血管正上方 |
        // | "动脉"标签 | text | (560,70) | ~32×16 | 上方 | 动脉血管正上方 |
        // | "心脏"标签 | text | (400,45) | ~48×18 | 顶部中央 | 加粗 |
        // | "手指"标签 | text | (400,455) | ~48×18 | 底部中央 | 加粗 |
        
        let currentStep = 0;
        const totalSteps = 3;
        
        const arteryGroup = document.getElementById('scene1-artery-group');
        const veinGroup = document.getElementById('scene1-vein-group');
        const bandGroup = document.getElementById('scene1-band-group');
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        
        // 工具函数：显示元素
        function showElement(el) {
            el.style.display = 'block';
            el.style.opacity = '1';
        }
        
        // 工具函数：隐藏元素
        function hideElement(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }
        
        // 更新步骤显示
        function updateStep() {
            // 根据当前步骤显示/隐藏对应元素
            if (currentStep >= 1) {
                showElement(arteryGroup);
            } else {
                hideElement(arteryGroup);
            }
            
            if (currentStep >= 2) {
                showElement(veinGroup);
            } else {
                hideElement(veinGroup);
            }
            
            if (currentStep >= 3) {
                showElement(bandGroup);
            } else {
                hideElement(bandGroup);
            }
            
            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + currentStep + '/' + totalSteps;
            
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps);
        }
        
        // 上一步按钮事件
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });
        
        // 下一步按钮事件
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateStep();
            }
        });
        
        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
