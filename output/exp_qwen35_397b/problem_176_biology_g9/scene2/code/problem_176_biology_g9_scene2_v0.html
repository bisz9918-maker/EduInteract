<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>丝带扎紧上臂 - 血管膨胀与变扁效应</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        /* 血管样式 */
        .scene2-vein {
            fill: #1565c0;
            transition: all 0.5s ease;
        }
        .scene2-artery {
            fill: #c62828;
            transition: all 0.5s ease;
        }
        /* 丝带样式 */
        .scene2-ribbon {
            fill: #888888;
            transition: opacity 0.5s ease;
        }
        /* 标注框样式 */
        .scene2-annotation {
            fill: #fff9c4;
            stroke: #fbc02d;
            stroke-width: 1;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .scene2-annotation-text {
            font-size: 14px;
            fill: #000000;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        /* 数字标签圆圈 */
        .scene2-label-circle {
            fill: #ffffff;
            stroke: #000000;
            stroke-width: 1;
        }
        .scene2-label-text {
            font-size: 16px;
            fill: #000000;
            text-anchor: middle;
            dominant-baseline: middle;
        }
        /* 箭头样式 */
        .scene2-vein-arrow {
            fill: #1565c0;
        }
        .scene2-artery-arrow {
            fill: #c62828;
        }
        /* 按钮样式 */
        .scene2-btn {
            fill: #1976d2;
            cursor: pointer;
            transition: fill 0.3s ease;
        }
        .scene2-btn:hover {
            fill: #1565c0;
        }
        .scene2-btn-disabled {
            fill: #bdbdbd;
            cursor: not-allowed;
        }
        .scene2-btn-text {
            font-size: 14px;
            fill: #ffffff;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
        }
        /* 步骤说明文字 */
        .scene2-step-text {
            font-size: 14px;
            fill: #333333;
            text-anchor: middle;
        }
        /* 血管标签 */
        .scene2-vessel-label {
            font-size: 16px;
            fill: #333333;
            text-anchor: middle;
        }
        /* 原因说明框 */
        .scene2-reason-box {
            fill: #e3f2fd;
            stroke: #1976d2;
            stroke-width: 1;
            rx: 4;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .scene2-reason-text {
            font-size: 12px;
            fill: #1565c0;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 静脉标签 -->
            <text id="scene2-vein-label" x="200" y="100" class="scene2-vessel-label">静脉</text>
            <!-- 动脉标签 -->
            <text id="scene2-artery-label" x="600" y="100" class="scene2-vessel-label">动脉</text>
            
            <!-- 静脉血管（左侧，血流向上） -->
            <!-- 血管主体：正常宽 12px，中心线 x=200，所以 x1=194, x2=206 -->
            <rect id="scene2-vein-body" x="194" y="120" width="12" height="260" class="scene2-vein" opacity="1"/>
            <!-- 静脉箭头（向上） -->
            <polygon id="scene2-vein-arrow" points="200,120 192,135 208,135" class="scene2-vein-arrow"/>
            
            <!-- 动脉血管（右侧，血流向下） -->
            <!-- 血管主体：正常宽 12px，中心线 x=600，所以 x1=594, x2=606 -->
            <rect id="scene2-artery-body" x="594" y="120" width="12" height="260" class="scene2-artery" opacity="1"/>
            <!-- 动脉箭头（向下） -->
            <polygon id="scene2-artery-arrow" points="600,380 592,365 608,365" class="scene2-artery-arrow"/>
            
            <!-- 丝带（水平） -->
            <rect id="scene2-ribbon" x="150" y="244" width="500" height="12" class="scene2-ribbon" opacity="0.5"/>
            <text id="scene2-ribbon-label" x="660" y="253" class="scene2-vessel-label" font-size="14">丝带</text>
            
            <!-- 数字标签①（左下，静脉远心端） -->
            <g id="scene2-label1">
                <circle cx="170" cy="320" r="12" class="scene2-label-circle"/>
                <text x="170" y="320" class="scene2-label-text">①</text>
            </g>
            
            <!-- 数字标签②（右下，动脉远心端） -->
            <g id="scene2-label2">
                <circle cx="630" cy="320" r="12" class="scene2-label-circle"/>
                <text x="630" y="320" class="scene2-label-text">②</text>
            </g>
            
            <!-- 数字标签③（右上，动脉近心端） -->
            <g id="scene2-label3">
                <circle cx="630" cy="180" r="12" class="scene2-label-circle"/>
                <text x="630" y="180" class="scene2-label-text">③</text>
            </g>
            
            <!-- 数字标签④（左上，静脉近心端） -->
            <g id="scene2-label4">
                <circle cx="170" cy="180" r="12" class="scene2-label-circle"/>
                <text x="170" y="180" class="scene2-label-text">④</text>
            </g>
            
            <!-- 膨胀标注框（左侧，指向①） -->
            <g id="scene2-annotation-swollen1">
                <rect id="scene2-annotation-swollen1-bg" x="50" y="300" width="90" height="50" rx="4" class="scene2-annotation"/>
                <text id="scene2-annotation-swollen1-text" x="95" y="320" class="scene2-annotation-text" text-anchor="middle">膨胀</text>
            </g>
            
            <!-- 膨胀标注框（右侧，指向③） -->
            <g id="scene2-annotation-swollen2">
                <rect id="scene2-annotation-swollen2-bg" x="660" y="160" width="90" height="50" rx="4" class="scene2-annotation"/>
                <text id="scene2-annotation-swollen2-text" x="705" y="180" class="scene2-annotation-text" text-anchor="middle">膨胀</text>
            </g>
            
            <!-- 变扁标注框（左侧，指向④） -->
            <g id="scene2-annotation-flat1">
                <rect id="scene2-annotation-flat1-bg" x="50" y="160" width="90" height="50" rx="4" class="scene2-annotation"/>
                <text id="scene2-annotation-flat1-text" x="95" y="180" class="scene2-annotation-text" text-anchor="middle">变扁</text>
            </g>
            
            <!-- 变扁标注框（右侧，指向②） -->
            <g id="scene2-annotation-flat2">
                <rect id="scene2-annotation-flat2-bg" x="660" y="300" width="90" height="50" rx="4" class="scene2-annotation"/>
                <text id="scene2-annotation-flat2-text" x="705" y="320" class="scene2-annotation-text" text-anchor="middle">变扁</text>
            </g>
            
            <!-- 原因说明框（步骤 4 显示，上移到 y=325） -->
            <g id="scene2-reason1">
                <rect id="scene2-reason1-bg" x="250" y="325" width="140" height="35" class="scene2-reason-box"/>
                <text id="scene2-reason1-text" x="320" y="347" class="scene2-reason-text" text-anchor="middle">静脉血回流受阻→①膨胀</text>
            </g>
            
            <g id="scene2-reason2">
                <rect id="scene2-reason2-bg" x="410" y="325" width="140" height="35" class="scene2-reason-box"/>
                <text id="scene2-reason2-text" x="480" y="347" class="scene2-reason-text" text-anchor="middle">动脉血流出受阻→③膨胀</text>
            </g>
            
            <!-- 步骤说明文字（上移到 y=375） -->
            <text id="scene2-step-text" x="400" y="375" class="scene2-step-text">初始状态：正常血流</text>
            
            <!-- 上一步按钮（上移到 y=400，确保在画布内） -->
            <g id="scene2-btn-prev" class="scene2-btn-group">
                <rect id="scene2-btn-prev-bg" x="280" y="400" width="80" height="28" rx="4" class="scene2-btn scene2-btn-disabled"/>
                <text id="scene2-btn-prev-text" x="320" y="414" class="scene2-btn-text">◀ 上一步</text>
            </g>
            
            <!-- 下一步按钮（上移到 y=400，确保在画布内） -->
            <g id="scene2-btn-next" class="scene2-btn-group">
                <rect id="scene2-btn-next-bg" x="440" y="400" width="80" height="28" rx="4" class="scene2-btn"/>
                <text id="scene2-btn-next-text" x="480" y="414" class="scene2-btn-text">下一步 ▶</text>
            </g>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现：丝带扎紧上臂 - 血管膨胀与变扁效应
        
        // 状态变量
        let currentState = 0;
        const totalStates = 5;
        
        // 步骤说明文字
        const stepTexts = [
            "初始状态：正常血流",
            "静脉①：血液回流受阻，远心端膨胀",
            "动脉③：心脏泵血被阻断，近心端膨胀",
            "②④：血液无法流过，远心端变扁",
            "完整状态：丝带阻断血流"
        ];
        
        // 获取 DOM 元素
        const veinBody = document.getElementById('scene2-vein-body');
        const arteryBody = document.getElementById('scene2-artery-body');
        const ribbon = document.getElementById('scene2-ribbon');
        const stepText = document.getElementById('scene2-step-text');
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnPrevBg = document.getElementById('scene2-btn-prev-bg');
        const btnNext = document.getElementById('scene2-btn-next');
        const btnNextBg = document.getElementById('scene2-btn-next-bg');
        
        // 标注元素
        const annotationSwollen1 = document.getElementById('scene2-annotation-swollen1');
        const annotationSwollen1Bg = document.getElementById('scene2-annotation-swollen1-bg');
        const annotationSwollen1Text = document.getElementById('scene2-annotation-swollen1-text');
        
        const annotationSwollen2 = document.getElementById('scene2-annotation-swollen2');
        const annotationSwollen2Bg = document.getElementById('scene2-annotation-swollen2-bg');
        const annotationSwollen2Text = document.getElementById('scene2-annotation-swollen2-text');
        
        const annotationFlat1 = document.getElementById('scene2-annotation-flat1');
        const annotationFlat1Bg = document.getElementById('scene2-annotation-flat1-bg');
        const annotationFlat1Text = document.getElementById('scene2-annotation-flat1-text');
        
        const annotationFlat2 = document.getElementById('scene2-annotation-flat2');
        const annotationFlat2Bg = document.getElementById('scene2-annotation-flat2-bg');
        const annotationFlat2Text = document.getElementById('scene2-annotation-flat2-text');
        
        const reason1 = document.getElementById('scene2-reason1');
        const reason1Bg = document.getElementById('scene2-reason1-bg');
        const reason1Text = document.getElementById('scene2-reason1-text');
        
        const reason2 = document.getElementById('scene2-reason2');
        const reason2Bg = document.getElementById('scene2-reason2-bg');
        const reason2Text = document.getElementById('scene2-reason2-text');
        
        // 辅助函数：显示元素
        function showElement(bg, text) {
            bg.style.opacity = '1';
            text.style.opacity = '1';
        }
        
        // 辅助函数：隐藏元素
        function hideElement(bg, text) {
            bg.style.opacity = '0';
            text.style.opacity = '0';
        }
        
        // 更新状态
        function updateState() {
            // 更新步骤说明
            stepText.textContent = stepTexts[currentState];
            
            // 更新按钮状态
            if (currentState === 0) {
                btnPrevBg.classList.add('scene2-btn-disabled');
            } else {
                btnPrevBg.classList.remove('scene2-btn-disabled');
            }
            
            if (currentState === totalStates - 1) {
                btnNextBg.classList.add('scene2-btn-disabled');
            } else {
                btnNextBg.classList.remove('scene2-btn-disabled');
            }
            
            // 根据状态更新血管和标注
            switch (currentState) {
                case 0:
                    // 初始状态：正常血管
                    veinBody.setAttribute('width', '12');
                    veinBody.setAttribute('x', '194');
                    veinBody.setAttribute('opacity', '1');
                    arteryBody.setAttribute('width', '12');
                    arteryBody.setAttribute('x', '594');
                    arteryBody.setAttribute('opacity', '1');
                    ribbon.setAttribute('opacity', '0.5');
                    
                    // 隐藏所有标注
                    hideElement(annotationSwollen1Bg, annotationSwollen1Text);
                    hideElement(annotationSwollen2Bg, annotationSwollen2Text);
                    hideElement(annotationFlat1Bg, annotationFlat1Text);
                    hideElement(annotationFlat2Bg, annotationFlat2Text);
                    hideElement(reason1Bg, reason1Text);
                    hideElement(reason2Bg, reason2Text);
                    break;
                    
                case 1:
                    // 步骤 1：丝带扎紧，静脉①膨胀
                    ribbon.setAttribute('opacity', '1');
                    
                    // 静脉①区域膨胀（丝带下方，y>250 的部分）
                    // 静脉从 y=120 到 y=380，丝带在 y=244-256，所以①区域是 y=256 到 380
                    // 膨胀时宽度 24px，中心 x=200，所以 x=188
                    veinBody.setAttribute('width', '24');
                    veinBody.setAttribute('x', '188');
                    veinBody.setAttribute('opacity', '0.4');
                    
                    // 动脉保持正常
                    arteryBody.setAttribute('width', '12');
                    arteryBody.setAttribute('x', '594');
                    arteryBody.setAttribute('opacity', '1');
                    
                    // 显示膨胀标注（①）
                    showElement(annotationSwollen1Bg, annotationSwollen1Text);
                    hideElement(annotationSwollen2Bg, annotationSwollen2Text);
                    hideElement(annotationFlat1Bg, annotationFlat1Text);
                    hideElement(annotationFlat2Bg, annotationFlat2Text);
                    hideElement(reason1Bg, reason1Text);
                    hideElement(reason2Bg, reason2Text);
                    break;
                    
                case 2:
                    // 步骤 2：动脉③膨胀
                    ribbon.setAttribute('opacity', '1');
                    
                    // 静脉①保持膨胀
                    veinBody.setAttribute('width', '24');
                    veinBody.setAttribute('x', '188');
                    veinBody.setAttribute('opacity', '0.4');
                    
                    // 动脉③区域膨胀（丝带上方，y<244 的部分）
                    // 动脉从 y=120 到 y=380，丝带在 y=244-256，所以③区域是 y=120 到 244
                    // 膨胀时宽度 24px，中心 x=600，所以 x=588
                    arteryBody.setAttribute('width', '24');
                    arteryBody.setAttribute('x', '588');
                    arteryBody.setAttribute('opacity', '0.4');
                    
                    // 显示膨胀标注（①和③）
                    showElement(annotationSwollen1Bg, annotationSwollen1Text);
                    showElement(annotationSwollen2Bg, annotationSwollen2Text);
                    hideElement(annotationFlat1Bg, annotationFlat1Text);
                    hideElement(annotationFlat2Bg, annotationFlat2Text);
                    hideElement(reason1Bg, reason1Text);
                    hideElement(reason2Bg, reason2Text);
                    break;
                    
                case 3:
                    // 步骤 3：②④变扁
                    ribbon.setAttribute('opacity', '1');
                    
                    // 静脉：①膨胀（下方），④变扁（上方）
                    // 由于 SVG rect 不能分段显示不同样式，我们用整体状态表示
                    // 静脉整体显示膨胀状态（因为①是主要观察点）
                    veinBody.setAttribute('width', '24');
                    veinBody.setAttribute('x', '188');
                    veinBody.setAttribute('opacity', '0.4');
                    
                    // 动脉：③膨胀（上方），②变扁（下方）
                    // 动脉整体显示膨胀状态（因为③是主要观察点）
                    arteryBody.setAttribute('width', '24');
                    arteryBody.setAttribute('x', '588');
                    arteryBody.setAttribute('opacity', '0.4');
                    
                    // 显示所有标注
                    showElement(annotationSwollen1Bg, annotationSwollen1Text);
                    showElement(annotationSwollen2Bg, annotationSwollen2Text);
                    showElement(annotationFlat1Bg, annotationFlat1Text);
                    showElement(annotationFlat2Bg, annotationFlat2Text);
                    hideElement(reason1Bg, reason1Text);
                    hideElement(reason2Bg, reason2Text);
                    break;
                    
                case 4:
                    // 步骤 4：完整状态，显示原因说明
                    ribbon.setAttribute('opacity', '1');
                    
                    veinBody.setAttribute('width', '24');
                    veinBody.setAttribute('x', '188');
                    veinBody.setAttribute('opacity', '0.4');
                    
                    arteryBody.setAttribute('width', '24');
                    arteryBody.setAttribute('x', '588');
                    arteryBody.setAttribute('opacity', '0.4');
                    
                    // 显示所有标注和原因说明
                    showElement(annotationSwollen1Bg, annotationSwollen1Text);
                    showElement(annotationSwollen2Bg, annotationSwollen2Text);
                    showElement(annotationFlat1Bg, annotationFlat1Text);
                    showElement(annotationFlat2Bg, annotationFlat2Text);
                    showElement(reason1Bg, reason1Text);
                    showElement(reason2Bg, reason2Text);
                    break;
            }
        }
        
        // 按钮点击事件
        btnPrev.addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                updateState();
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentState < totalStates - 1) {
                currentState++;
                updateState();
            }
        });
        
        // 初始化
        updateState();
        
    })();
    </script>
</body>
</html>
