<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>染色体-DNA-基因关系示意图</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        .scene1-label {
            font-size: 14px;
            font-weight: bold;
            fill: #333;
        }
        .scene1-title {
            font-size: 16px;
            font-weight: bold;
            fill: #333;
        }
        .scene1-btn {
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .scene1-btn:hover {
            background: #0d47a1;
        }
        .scene1-btn:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #333;
            min-width: 80px;
            text-align: center;
        }
        /* 淡入淡出动画 */
        .scene1-fade {
            transition: opacity 0.3s ease, stroke-width 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#999999" />
                </marker>
                <marker id="scene1-arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#c62828" />
                </marker>
            </defs>

            <!-- ========== 图甲区域（左侧 x=20-460） ========== -->
            
            <!-- 染色体 [1] - X 形结构 -->
            <g id="scene1-chromosome" class="scene1-fade" style="opacity: 0.6;">
                <!-- X 形染色体路径 -->
                <path d="M 150 60 Q 180 80 150 100 Q 120 120 150 140 Q 180 160 210 140 Q 240 120 210 100 Q 180 80 150 60" 
                      fill="#000000" stroke="#000000" stroke-width="3"/>
                <path d="M 180 60 Q 210 80 180 100 Q 150 120 180 140 Q 210 160 240 140 Q 270 120 240 100 Q 210 80 180 60" 
                      fill="#000000" stroke="#000000" stroke-width="3"/>
                <!-- 着丝点 -->
                <ellipse cx="180" cy="100" rx="15" ry="8" fill="#333333"/>
            </g>
            <text id="scene1-label-1" x="250" y="85" class="scene1-label">[1]</text>

            <!-- DNA 双螺旋 [2] -->
            <g id="scene1-dna" class="scene1-fade" style="opacity: 0.6;">
                <!-- 双螺旋骨架 -->
                <path d="M 120 270 Q 135 260 150 270 Q 165 280 180 270 Q 195 260 210 270 Q 225 280 240 270 Q 255 260 270 270 Q 285 280 300 270" 
                      fill="none" stroke="#1565c0" stroke-width="2"/>
                <path d="M 120 280 Q 135 290 150 280 Q 165 270 180 280 Q 195 290 210 280 Q 225 270 240 280 Q 255 290 270 280 Q 285 270 300 280" 
                      fill="none" stroke="#1565c0" stroke-width="2"/>
                <!-- 碱基对连线 -->
                <line x1="135" y1="265" x2="135" y2="285" stroke="#1565c0" stroke-width="1"/>
                <line x1="165" y1="275" x2="165" y2="285" stroke="#1565c0" stroke-width="1"/>
                <line x1="195" y1="265" x2="195" y2="285" stroke="#1565c0" stroke-width="1"/>
                <line x1="225" y1="275" x2="225" y2="285" stroke="#1565c0" stroke-width="1"/>
                <line x1="255" y1="265" x2="255" y2="285" stroke="#1565c0" stroke-width="1"/>
                <line x1="285" y1="275" x2="285" y2="285" stroke="#1565c0" stroke-width="1"/>
            </g>
            <text id="scene1-label-2" x="200" y="320" class="scene1-label">[2]</text>

            <!-- 蛋白质 [3] - 球状链 -->
            <g id="scene1-protein" class="scene1-fade" style="opacity: 0.6;">
                <circle cx="360" cy="290" r="8" fill="#888888"/>
                <circle cx="375" cy="285" r="8" fill="#888888"/>
                <circle cx="390" cy="290" r="8" fill="#888888"/>
                <circle cx="375" cy="300" r="8" fill="#888888"/>
                <circle cx="365" cy="305" r="6" fill="#888888"/>
                <circle cx="385" cy="305" r="6" fill="#888888"/>
            </g>
            <text id="scene1-label-3" x="375" y="325" class="scene1-label" text-anchor="middle">[3]</text>

            <!-- 基因 [4] - DNA 高亮片段 - 移到右上角，远离其他元素 -->
            <g id="scene1-gene" class="scene1-fade" style="opacity: 0.6;">
                <path d="M 450 120 Q 465 110 480 120 Q 495 130 510 120" 
                      fill="none" stroke="#c62828" stroke-width="4"/>
                <path d="M 450 130 Q 465 140 480 130 Q 495 120 510 130" 
                      fill="none" stroke="#c62828" stroke-width="4"/>
            </g>
            <!-- 标签 [4] 放在基因正上方，远离线条 -->
            <text id="scene1-label-4" x="480" y="90" class="scene1-label" text-anchor="middle">[4]</text>

            <!-- 从染色体到 DNA 的展开箭头 -->
            <g id="scene1-expand-arrow" class="scene1-fade" style="opacity: 0;">
                <line x1="210" y1="150" x2="150" y2="250" stroke="#999999" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#scene1-arrowhead)"/>
            </g>

            <!-- 连接箭头 甲→乙 -->
            <g id="scene1-connect-arrow" class="scene1-fade" style="opacity: 0;">
                <line x1="460" y1="150" x2="520" y2="150" stroke="#999999" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#scene1-arrowhead)"/>
            </g>

            <!-- 图甲标题 -->
            <text id="scene1-title-a" x="200" y="420" class="scene1-title" text-anchor="middle">图甲</text>

            <!-- ========== 图乙区域（右侧 x=500-780） ========== -->
            
            <!-- 嵌套圆 ①（最外层）- 缩小半径，给标签留空间 -->
            <g id="scene1-circle1" class="scene1-fade" style="opacity: 0.6;">
                <circle cx="650" cy="280" r="75" fill="#1565c0" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
            </g>
            <!-- 标签 ① 放在圆外右上方，不超出边界 -->
            <text id="scene1-label-c1" x="755" y="185" class="scene1-label">①</text>

            <!-- 嵌套圆 ②（中间层） -->
            <g id="scene1-circle2" class="scene1-fade" style="opacity: 0.6;">
                <circle cx="645" cy="280" r="45" fill="#2e7d32" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
            </g>
            <!-- 标签 ② 放在圆外右侧，远离圆边界 -->
            <text id="scene1-label-c2" x="715" y="285" class="scene1-label">②</text>

            <!-- 嵌套圆 ③（最内层） -->
            <g id="scene1-circle3" class="scene1-fade" style="opacity: 0.6;">
                <circle cx="645" cy="280" r="25" fill="#c62828" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
            </g>
            <!-- 标签 ③ 放在圆外正上方，远离圆边界 -->
            <text id="scene1-label-c3" x="645" y="225" class="scene1-label" text-anchor="middle">③</text>

            <!-- 图乙标题 -->
            <text id="scene1-title-b" x="670" y="420" class="scene1-title" text-anchor="middle">图乙</text>

            <!-- ========== 步骤 4 标注框 - 调整位置，文字放在框内 ========== -->
            <g id="scene1-annotation-box" class="scene1-fade" style="opacity: 0;">
                <rect x="140" y="345" width="150" height="50" fill="#fff9c4" stroke="#f9a825" stroke-width="1" rx="4"/>
                <text x="215" y="375" class="scene1-title" text-anchor="middle" font-size="13px">遗传信息载体</text>
            </g>

            <!-- ========== 步骤 4 虚线连接 ========== -->
            <g id="scene1-connections" class="scene1-fade" style="opacity: 0;">
                <!-- [1]→① -->
                <line x1="210" y1="100" x2="575" y2="280" stroke="#999999" stroke-width="1" stroke-dasharray="4,2"/>
                <!-- [2]→② -->
                <line x1="300" y1="275" x2="595" y2="280" stroke="#999999" stroke-width="1" stroke-dasharray="4,2"/>
                <!-- [4]→③ -->
                <line x1="510" y1="125" x2="620" y2="280" stroke="#999999" stroke-width="1" stroke-dasharray="4,2"/>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/4</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现：染色体-DNA-基因关系示意图
        
        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 |
        // | 染色体 [1] | X 形路径 | 中心 (180,100) | 70×90 | 右上方 (250,85) |
        // | DNA 双螺旋 [2] | 螺旋路径 | (120,270)-(300,270) | 180×20 | 下方 (200,320) |
        // | 蛋白质 [3] | 球状链 | (360,290) | 60×50 | 下方 (375,325) |
        // | 基因 [4] | 高亮片段 | (450,120)-(510,120) | 70×20 | 上方 (480,90) |
        // | 圆① (外) | 圆形 | 中心 (650,280) | r=75 | 右上方 (755,185) |
        // | 圆② (中) | 圆形 | 中心 (645,280) | r=45 | 右侧 (715,285) |
        // | 圆③ (内) | 圆形 | 中心 (645,280) | r=25 | 上方 (645,225) |
        // | 标题"图甲" | text | (200,420) | - | - |
        // | 标题"图乙" | text | (670,420) | - | - |
        // | 控件栏 | 按钮组 | y=455 | - | 底部居中 |

        let currentStep = 0;
        const totalSteps = 4;

        // 获取 DOM 元素
        const chromosome = document.getElementById('scene1-chromosome');
        const dna = document.getElementById('scene1-dna');
        const protein = document.getElementById('scene1-protein');
        const gene = document.getElementById('scene1-gene');
        const circle1 = document.getElementById('scene1-circle1');
        const circle2 = document.getElementById('scene1-circle2');
        const circle3 = document.getElementById('scene1-circle3');
        const expandArrow = document.getElementById('scene1-expand-arrow');
        const connectArrow = document.getElementById('scene1-connect-arrow');
        const annotationBox = document.getElementById('scene1-annotation-box');
        const connections = document.getElementById('scene1-connections');
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        // 辅助函数：设置元素高亮
        function highlightElement(el, isHighlighted) {
            if (!el) return;
            if (isHighlighted) {
                el.style.opacity = '1';
                // 如果是 path 或 circle，加粗描边
                const paths = el.querySelectorAll('path, circle, line, rect');
                paths.forEach(p => {
                    const currentStroke = p.getAttribute('stroke-width');
                    if (currentStroke && currentStroke !== '0') {
                        p.setAttribute('data-original-stroke', currentStroke);
                        p.setAttribute('stroke-width', String(parseFloat(currentStroke) + 1));
                    }
                });
            } else {
                el.style.opacity = '0.6';
                const paths = el.querySelectorAll('path, circle, line, rect');
                paths.forEach(p => {
                    const originalStroke = p.getAttribute('data-original-stroke');
                    if (originalStroke) {
                        p.setAttribute('stroke-width', originalStroke);
                    }
                });
            }
        }

        // 辅助函数：显示/隐藏元素
        function showElement(el) {
            if (el) el.style.opacity = '1';
        }

        function hideElement(el) {
            if (el) el.style.opacity = '0';
        }

        // 渲染当前步骤
        function renderStep() {
            // 重置所有元素到默认状态
            highlightElement(chromosome, false);
            highlightElement(dna, false);
            highlightElement(protein, false);
            highlightElement(gene, false);
            highlightElement(circle1, false);
            highlightElement(circle2, false);
            highlightElement(circle3, false);
            hideElement(expandArrow);
            hideElement(connectArrow);
            hideElement(annotationBox);
            hideElement(connections);

            // 根据步骤设置状态
            switch (currentStep) {
                case 0:
                    // 初始状态：所有元素默认透明度 60%
                    break;

                case 1:
                    // 高亮染色体 [1] + 圆①，显示连接箭头
                    highlightElement(chromosome, true);
                    highlightElement(circle1, true);
                    showElement(connectArrow);
                    break;

                case 2:
                    // 染色体淡出，展开显示 DNA 和蛋白质细节
                    hideElement(chromosome);
                    highlightElement(dna, true);
                    highlightElement(protein, true);
                    showElement(expandArrow);
                    break;

                case 3:
                    // 高亮基因 [4] + 圆③
                    highlightElement(gene, true);
                    highlightElement(circle3, true);
                    showElement(expandArrow);
                    break;

                case 4:
                    // 最终状态：显示标注框和所有连接虚线
                    highlightElement(dna, true);
                    highlightElement(circle2, true);
                    highlightElement(circle3, true);
                    showElement(expandArrow);
                    showElement(annotationBox);
                    showElement(connections);
                    break;
            }

            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;
            stepIndicator.textContent = `步骤 ${currentStep}/${totalSteps}`;
        }

        // 事件绑定
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                renderStep();
            }
        });

        // 初始化
        renderStep();
    })();
    </script>
</body>
</html>
