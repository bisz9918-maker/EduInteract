<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南瓜花色遗传系谱图</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        .scene1-genotype {
            font-size: 14px;
            font-weight: bold;
        }
        .scene1-phenotype {
            font-size: 16px;
            font-weight: 500;
        }
        .scene1-label {
            font-size: 16px;
            font-weight: bold;
        }
        .scene1-process-num {
            font-size: 12px;
            font-weight: bold;
            fill: #ffffff;
        }
        .scene1-btn {
            cursor: pointer;
            rx: 5;
            ry: 5;
        }
        .scene1-btn:hover {
            opacity: 0.8;
        }
        .scene1-btn-disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .scene1-fade-in {
            animation: scene1FadeIn 0.3s ease-in;
        }
        @keyframes scene1FadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#c62828" />
                </marker>
            </defs>

            <!-- 步骤 0：基础系谱图元素 -->
            <g id="scene1-step0">
                <!-- 代际标签 -->
                <text x="50" y="65" class="scene1-label" fill="#000000">P</text>
                <text x="50" y="195" class="scene1-label" fill="#000000">F₁</text>
                <text x="50" y="365" class="scene1-label" fill="#000000">F₂</text>

                <!-- P 代表现型 -->
                <text x="320" y="65" class="scene1-phenotype" fill="#f9a825">黄花</text>
                <text x="385" y="65" class="scene1-phenotype" fill="#000000">×</text>
                <text x="420" y="65" class="scene1-phenotype" fill="#1565c0">白花</text>

                <!-- 过程①圆圈 -->
                <circle cx="375" cy="105" r="12" fill="#888888"/>
                <text x="375" y="110" text-anchor="middle" class="scene1-process-num">①</text>

                <!-- P→F1 连接线 -->
                <line x1="375" y1="117" x2="280" y2="180" stroke="#000000" stroke-width="2"/>
                <line x1="375" y1="117" x2="470" y2="180" stroke="#000000" stroke-width="2"/>

                <!-- F1 代表现型 -->
                <text x="250" y="195" class="scene1-phenotype" fill="#f9a825">黄花</text>
                <text x="490" y="195" class="scene1-phenotype" fill="#1565c0">白花</text>

                <!-- 过程②圆圈 -->
                <circle cx="250" cy="265" r="12" fill="#888888"/>
                <text x="250" y="270" text-anchor="middle" class="scene1-process-num">②</text>

                <!-- 过程③圆圈 -->
                <circle cx="490" cy="265" r="12" fill="#888888"/>
                <text x="490" y="270" text-anchor="middle" class="scene1-process-num">③</text>

                <!-- F1→F2 连接线 -->
                <line x1="250" y1="215" x2="250" y2="250" stroke="#000000" stroke-width="2"/>
                <line x1="490" y1="215" x2="440" y2="350" stroke="#000000" stroke-width="2"/>
                <line x1="490" y1="215" x2="540" y2="350" stroke="#000000" stroke-width="2"/>

                <!-- F2 代表现型 -->
                <text x="220" y="365" class="scene1-phenotype" fill="#f9a825">黄花</text>
                <text x="410" y="365" class="scene1-phenotype" fill="#f9a825">黄花</text>
                <text x="560" y="365" class="scene1-phenotype" fill="#1565c0">白花</text>
            </g>

            <!-- 步骤 1：P 代基因型 -->
            <g id="scene1-step1" style="display:none">
                <text x="320" y="88" class="scene1-genotype" fill="#c62828" style="opacity:0" id="scene1-p-yellow-gt">aa</text>
                <text x="420" y="88" class="scene1-genotype" fill="#2e7d32" style="opacity:0" id="scene1-p-white-gt">Aa</text>
            </g>

            <!-- 步骤 2：F1 代基因型 -->
            <g id="scene1-step2" style="display:none">
                <text x="250" y="220" class="scene1-genotype" fill="#c62828" style="opacity:0" id="scene1-f1-yellow-gt">aa</text>
                <text x="490" y="220" class="scene1-genotype" fill="#2e7d32" style="opacity:0" id="scene1-f1-white-gt">Aa</text>
            </g>

            <!-- 步骤 3：高亮过程③和结论框 -->
            <g id="scene1-step3" style="display:none">
                <!-- 高亮箭头指向过程③ -->
                <path d="M 460 240 Q 475 250 478 258" stroke="#c62828" stroke-width="3" fill="none" marker-end="url(#scene1-arrowhead)" style="opacity:0" id="scene1-highlight-arrow"/>
                <!-- 过程③圆圈高亮 -->
                <circle cx="490" cy="265" r="12" fill="#c62828" style="opacity:0" id="scene1-process3-highlight"/>
                <!-- 结论框 -->
                <rect x="520" y="290" width="230" height="50" fill="#ffffff" stroke="#1565c0" stroke-width="2" style="opacity:0" id="scene1-conclusion-box"/>
                <text x="635" y="315" text-anchor="middle" font-size="14" fill="#1565c0" style="opacity:0" id="scene1-conclusion-text">性状分离 → 白花为显性</text>
            </g>

            <!-- 步骤 4：F2 代基因型 -->
            <g id="scene1-step4" style="display:none">
                <text x="220" y="390" class="scene1-genotype" fill="#c62828" style="opacity:0" id="scene1-f2-yellow1-gt">aa</text>
                <text x="410" y="390" class="scene1-genotype" fill="#c62828" style="opacity:0" id="scene1-f2-yellow2-gt">aa</text>
                <text x="560" y="390" class="scene1-genotype" fill="#2e7d32" style="opacity:0" id="scene1-f2-white-gt">Aa</text>
            </g>

            <!-- 控件栏 -->
            <g id="scene1-controls">
                <!-- 上一步按钮背景 -->
                <rect id="scene1-btn-prev-bg" x="280" y="455" width="90" height="30" fill="#1565c0" class="scene1-btn"/>
                <text id="scene1-btn-prev-text" x="325" y="475" text-anchor="middle" fill="#ffffff" font-size="13">◀ 上一步</text>
                
                <!-- 步骤指示器 -->
                <text x="400" y="476" text-anchor="middle" fill="#666666" font-size="13" id="scene1-step-indicator">步骤 1/5</text>
                
                <!-- 下一步按钮背景 -->
                <rect id="scene1-btn-next-bg" x="440" y="455" width="90" height="30" fill="#1565c0" class="scene1-btn"/>
                <text id="scene1-btn-next-text" x="485" y="475" text-anchor="middle" fill="#ffffff" font-size="13">下一步 ▶</text>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 1 实现 - 南瓜花色遗传系谱图
        
        let currentStep = 0;
        const totalSteps = 5;
        
        // 按钮元素
        const btnPrevBg = document.getElementById('scene1-btn-prev-bg');
        const btnPrevText = document.getElementById('scene1-btn-prev-text');
        const btnNextBg = document.getElementById('scene1-btn-next-bg');
        const btnNextText = document.getElementById('scene1-btn-next-text');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        
        // 各步骤需要显示的元素组
        const stepElements = {
            0: ['scene1-step0'],
            1: ['scene1-step0', 'scene1-step1'],
            2: ['scene1-step0', 'scene1-step1', 'scene1-step2'],
            3: ['scene1-step0', 'scene1-step1', 'scene1-step2', 'scene1-step3'],
            4: ['scene1-step0', 'scene1-step1', 'scene1-step2', 'scene1-step3', 'scene1-step4']
        };
        
        // 需要淡入效果的元素
        const fadeElements = {
            1: ['scene1-p-yellow-gt', 'scene1-p-white-gt'],
            2: ['scene1-f1-yellow-gt', 'scene1-f1-white-gt'],
            3: ['scene1-highlight-arrow', 'scene1-process3-highlight', 'scene1-conclusion-box', 'scene1-conclusion-text'],
            4: ['scene1-f2-yellow1-gt', 'scene1-f2-yellow2-gt', 'scene1-f2-white-gt']
        };
        
        // 更新显示状态
        function updateDisplay() {
            // 隐藏所有步骤组
            for (let i = 1; i <= 4; i++) {
                const group = document.getElementById(`scene1-step${i}`);
                if (group) {
                    group.style.display = 'none';
                }
            }
            
            // 显示当前步骤及之前的所有组
            const visibleGroups = stepElements[currentStep];
            visibleGroups.forEach(groupId => {
                const group = document.getElementById(groupId);
                if (group && groupId !== 'scene1-step0') {
                    group.style.display = 'block';
                }
            });
            
            // 触发淡入动画
            if (currentStep > 0 && fadeElements[currentStep]) {
                fadeElements[currentStep].forEach(elId => {
                    const el = document.getElementById(elId);
                    if (el) {
                        el.style.opacity = '0';
                        setTimeout(() => {
                            el.classList.add('scene1-fade-in');
                            el.style.opacity = '1';
                        }, 50);
                    }
                });
            }
            
            // 更新按钮状态
            if (currentStep === 0) {
                btnPrevBg.classList.add('scene1-btn-disabled');
                btnPrevText.style.fill = '#cccccc';
            } else {
                btnPrevBg.classList.remove('scene1-btn-disabled');
                btnPrevText.style.fill = '#ffffff';
            }
            
            if (currentStep === 4) {
                btnNextBg.classList.add('scene1-btn-disabled');
                btnNextText.style.fill = '#cccccc';
            } else {
                btnNextBg.classList.remove('scene1-btn-disabled');
                btnNextText.style.fill = '#ffffff';
            }
            
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;
        }
        
        // 上一步
        btnPrevBg.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });
        btnPrevText.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });
        
        // 下一步
        btnNextBg.addEventListener('click', () => {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateDisplay();
            }
        });
        btnNextText.addEventListener('click', () => {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateDisplay();
            }
        });
        
        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
