<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三圈环流剖面图</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f0f0f0; }
        .scene1-btn:hover { background: #e0e0e0; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-step-indicator { padding: 8px 16px; font-size: 14px; background: #fff; border: 1px solid #ccc; border-radius: 4px; }
        .hidden { display: none !important; opacity: 0; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <defs>
                <!-- 箭头标记 -->
                <marker id="scene1-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0" />
                </marker>
            </defs>

            <!-- 步骤 0: 基础框架 -->
            <g id="scene1-base">
                <!-- 剖面弧线：从赤道 (左下) 到北极 (右上) -->
                <path id="scene1-arc-profile" d="M 100,380 Q 300,330 500,100" fill="none" stroke="#000000" stroke-width="2" />

                <!-- 纬度标注线 (右侧) -->
                <line id="scene1-lat-0" x1="520" y1="380" x2="560" y2="380" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" />
                <line id="scene1-lat-30" x1="520" y1="300" x2="560" y2="300" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" />
                <line id="scene1-lat-60" x1="520" y1="200" x2="560" y2="200" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" />
                <line id="scene1-lat-90" x1="520" y1="100" x2="560" y2="100" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" />

                <!-- 纬度数值 -->
                <text id="scene1-lat-0-val" x="570" y="385" font-size="14" fill="#000000">0°</text>
                <text id="scene1-lat-30-val" x="570" y="305" font-size="14" fill="#000000">30°</text>
                <text id="scene1-lat-60-val" x="570" y="205" font-size="14" fill="#000000">60°</text>
                <text id="scene1-lat-90-val" x="570" y="105" font-size="14" fill="#000000">90°</text>

                <!-- N 点标记 -->
                <circle id="scene1-point-N" cx="500" cy="100" r="4" fill="#000000" />
                <text id="scene1-label-N" x="510" y="95" font-size="14" fill="#000000">N</text>
            </g>

            <!-- 步骤 1: 环流圈 (放在弧线上方，远离标签) -->
            <g id="scene1-circulation" class="hidden">
                <!-- 低纬环流圈 (赤道到 30°) -->
                <ellipse id="scene1-circ-low" cx="180" cy="320" rx="25" ry="18" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)" />

                <!-- 中纬环流圈 (30°到 60°) -->
                <ellipse id="scene1-circ-mid" cx="300" cy="230" rx="25" ry="18" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)" />

                <!-- 高纬环流圈 (60°到 90°) -->
                <ellipse id="scene1-circ-high" cx="420" cy="130" rx="25" ry="18" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)" />
            </g>

            <!-- 步骤 2: 气压带 (标签放在弧线下方，远离环流圈) -->
            <g id="scene1-pressure" class="hidden">
                <!-- A 点 (赤道低压带 0°) -->
                <circle id="scene1-point-A" cx="140" cy="380" r="4" fill="#000000" />
                <text id="scene1-label-A" x="125" y="420" font-size="14" fill="#000000">A</text>

                <!-- C 点 (副热带高压带 30°) -->
                <circle id="scene1-point-C" cx="260" cy="300" r="4" fill="#000000" />
                <text id="scene1-label-C" x="275" y="340" font-size="14" fill="#000000">C</text>

                <!-- E 点 (副极地低压带 60°) -->
                <circle id="scene1-point-E" cx="380" cy="200" r="4" fill="#000000" />
                <text id="scene1-label-E" x="395" y="240" font-size="14" fill="#000000">E</text>
            </g>

            <!-- 步骤 3: 风带 (标签放在弧线下方，气压带标签上方) -->
            <g id="scene1-wind" class="hidden">
                <!-- B 风带 (东北信风带 0°-30°) -->
                <text id="scene1-label-B" x="200" y="375" font-size="14" fill="#000000">B</text>

                <!-- D 风带 (盛行西风带 30°-60°) -->
                <text id="scene1-label-D" x="320" y="285" font-size="14" fill="#000000">D</text>

                <!-- F 风带 (极地东风带 60°-90°) -->
                <text id="scene1-label-F" x="440" y="185" font-size="14" fill="#000000">F</text>
            </g>

            <!-- 步骤 4: 完整标注 (放在顶部区域，增加 y 坐标避免裁切) -->
            <g id="scene1-full-labels" class="hidden">
                <!-- 气压带名称 (放在顶部，y=35 避免裁切) -->
                <text id="scene1-label-eq-low" x="60" y="35" font-size="10" fill="#c62828">赤道低压带</text>
                <text id="scene1-label-sub-high" x="200" y="35" font-size="10" fill="#c62828">副热带高压带</text>
                <text id="scene1-label-sub-low" x="340" y="35" font-size="10" fill="#c62828">副极地低压带</text>
                <text id="scene1-label-polar-high" x="480" y="35" font-size="10" fill="#c62828">极地高压带</text>

                <!-- 风带名称 (放在顶部第二行) -->
                <text id="scene1-label-trade" x="100" y="55" font-size="10" fill="#2e7d32">东北信风带</text>
                <text id="scene1-label-westerlies" x="240" y="55" font-size="10" fill="#2e7d32">盛行西风带</text>
                <text id="scene1-label-polar-east" x="380" y="55" font-size="10" fill="#2e7d32">极地东风带</text>
            </g>

            <!-- 图例框 - 放在右侧中间，使用垂直布局，大幅增加文字与图形间距 -->
            <g id="scene1-legend">
                <rect id="scene1-legend-box" x="600" y="250" width="180" height="130" fill="#ffffff" stroke="#000000" stroke-width="1" />
                <text id="scene1-legend-title" x="610" y="280" font-size="13" fill="#000000" font-weight="bold">图例</text>

                <!-- 气压带图例 (图形在左，文字在右，大幅增加垂直间距) -->
                <rect id="scene1-legend-pressure" x="610" y="295" width="20" height="14" fill="#c62828" opacity="0.4" stroke="#c62828" stroke-width="1" />
                <text id="scene1-legend-pressure-text" x="645" y="308" font-size="11" fill="#000000">气压带</text>

                <!-- 风带图例 -->
                <rect id="scene1-legend-wind" x="610" y="330" width="20" height="14" fill="#2e7d32" opacity="0.4" stroke="#2e7d32" stroke-width="1" />
                <text id="scene1-legend-wind-text" x="645" y="343" font-size="11" fill="#000000">风带</text>

                <!-- 环流箭头图例 -->
                <line id="scene1-legend-circ" x1="610" y1="368" x2="630" y2="368" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)" />
                <text id="scene1-legend-circ-text" x="645" y="375" font-size="11" fill="#000000">环流</text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <span id="scene1-step-indicator" class="scene1-step-indicator">步骤 0/4</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现 - 三圈环流剖面图

        let currentState = 0;
        const totalSteps = 4;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        // 元素分组
        const groups = {
            base: document.getElementById('scene1-base'),
            circulation: document.getElementById('scene1-circulation'),
            pressure: document.getElementById('scene1-pressure'),
            wind: document.getElementById('scene1-wind'),
            fullLabels: document.getElementById('scene1-full-labels')
        };

        function updateDisplay() {
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentState}/${totalSteps}`;

            // 更新按钮状态
            btnPrev.disabled = currentState === 0;
            btnNext.disabled = currentState === totalSteps;

            // 根据当前状态显示/隐藏元素组
            if (currentState >= 0) {
                groups.base.classList.remove('hidden');
            }
            if (currentState >= 1) {
                groups.circulation.classList.remove('hidden');
            } else {
                groups.circulation.classList.add('hidden');
            }
            if (currentState >= 2) {
                groups.pressure.classList.remove('hidden');
            } else {
                groups.pressure.classList.add('hidden');
            }
            if (currentState >= 3) {
                groups.wind.classList.remove('hidden');
            } else {
                groups.wind.classList.add('hidden');
            }
            if (currentState >= 4) {
                groups.fullLabels.classList.remove('hidden');
            } else {
                groups.fullLabels.classList.add('hidden');
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                updateDisplay();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentState < totalSteps) {
                currentState++;
                updateDisplay();
            }
        });

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
