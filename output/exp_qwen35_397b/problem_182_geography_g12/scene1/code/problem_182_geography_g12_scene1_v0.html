<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>经纬网坐标系统 - 地理图示</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        /* 经纬线样式 */
        .scene1-meridian {
            stroke: #000000;
            stroke-width: 1;
            fill: none;
        }
        .scene1-parallel {
            stroke: #000000;
            stroke-width: 1;
            fill: none;
        }
        .scene1-special-parallel {
            stroke: #888888;
            stroke-width: 1;
            fill: none;
            stroke-dasharray: 4, 4;
        }
        /* 点样式 */
        .scene1-point {
            fill: #1565c0;
            transition: all 0.3s ease;
        }
        .scene1-point-highlight {
            fill: #0d47a1;
            r: 10;
        }
        /* 坐标标签样式 */
        .scene1-coord-label {
            font-size: 14px;
            font-weight: bold;
            fill: #1565c0;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .scene1-coord-label.visible {
            opacity: 1;
        }
        /* 方向箭头样式 */
        .scene1-arrow {
            stroke: #c62828;
            stroke-width: 2;
            fill: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .scene1-arrow.visible {
            opacity: 1;
        }
        .scene1-arrow-text {
            font-size: 16px;
            font-weight: bold;
            fill: #c62828;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .scene1-arrow-text.visible {
            opacity: 1;
        }
        /* 坐标轴文字样式 */
        .scene1-axis-label {
            font-size: 14px;
            fill: #000000;
        }
        .scene1-axis-label-lat {
            text-anchor: end;
        }
        .scene1-axis-label-lon {
            text-anchor: middle;
        }
        /* 控件栏样式 */
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }
        .scene1-btn {
            width: 90px;
            height: 32px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .scene1-btn-prev {
            background: #e0e0e0;
            color: #424242;
        }
        .scene1-btn-prev:hover:not(:disabled) {
            background: #bdbdbd;
        }
        .scene1-btn-next {
            background: #1565c0;
            color: #ffffff;
        }
        .scene1-btn-next:hover:not(:disabled) {
            background: #0d47a1;
        }
        .scene1-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #424242;
            min-width: 80px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 经纬网格组 -->
            <g id="scene1-grid-group">
                <!-- 经线 (7 条) -->
                <line class="scene1-meridian" x1="80" y1="40" x2="80" y2="400" />
                <line class="scene1-meridian" x1="193" y1="40" x2="193" y2="400" />
                <line class="scene1-meridian" x1="307" y1="40" x2="307" y2="400" />
                <line class="scene1-meridian" x1="420" y1="40" x2="420" y2="400" />
                <line class="scene1-meridian" x1="533" y1="40" x2="533" y2="400" />
                <line class="scene1-meridian" x1="647" y1="40" x2="647" y2="400" />
                <line class="scene1-meridian" x1="760" y1="40" x2="760" y2="400" />
                
                <!-- 纬线 (7 条) -->
                <line class="scene1-parallel" x1="80" y1="40" x2="760" y2="40" />
                <line class="scene1-parallel" x1="80" y1="100" x2="760" y2="100" />
                <line class="scene1-parallel" x1="80" y1="160" x2="760" y2="160" />
                <line class="scene1-parallel" x1="80" y1="220" x2="760" y2="220" />
                <line class="scene1-parallel" x1="80" y1="280" x2="760" y2="280" />
                <line class="scene1-parallel" x1="80" y1="340" x2="760" y2="340" />
                <line class="scene1-parallel" x1="80" y1="400" x2="760" y2="400" />
                
                <!-- 特殊纬线 (4 条虚线) -->
                <!-- 北极圈 66.5°N: y = 87 -->
                <line class="scene1-special-parallel" x1="80" y1="87" x2="760" y2="87" />
                <!-- 北回归线 23.5°N: y = 173 -->
                <line class="scene1-special-parallel" x1="80" y1="173" x2="760" y2="173" />
                <!-- 南回归线 23.5°S: y = 267 -->
                <line class="scene1-special-parallel" x1="80" y1="267" x2="760" y2="267" />
                <!-- 南极圈 66.5°S: y = 313 -->
                <line class="scene1-special-parallel" x1="80" y1="313" x2="760" y2="313" />
            </g>
            
            <!-- 纬度标注 (左侧) -->
            <text class="scene1-axis-label scene1-axis-label-lat" x="60" y="45">90°N</text>
            <text class="scene1-axis-label scene1-axis-label-lat" x="60" y="105">60°N</text>
            <text class="scene1-axis-label scene1-axis-label-lat" x="60" y="165">30°N</text>
            <text class="scene1-axis-label scene1-axis-label-lat" x="60" y="225">0°</text>
            <text class="scene1-axis-label scene1-axis-label-lat" x="60" y="285">30°S</text>
            <text class="scene1-axis-label scene1-axis-label-lat" x="60" y="345">60°S</text>
            <text class="scene1-axis-label scene1-axis-label-lat" x="60" y="410">90°S</text>
            
            <!-- 经度标注 (底部) -->
            <text class="scene1-axis-label scene1-axis-label-lon" x="80" y="440">180°W</text>
            <text class="scene1-axis-label scene1-axis-label-lon" x="193" y="425">120°W</text>
            <text class="scene1-axis-label scene1-axis-label-lon" x="307" y="425">60°W</text>
            <text class="scene1-axis-label scene1-axis-label-lon" x="420" y="425">0°</text>
            <text class="scene1-axis-label scene1-axis-label-lon" x="533" y="425">60°E</text>
            <text class="scene1-axis-label scene1-axis-label-lon" x="647" y="425">120°E</text>
            <text class="scene1-axis-label scene1-axis-label-lon" x="760" y="425">180°E</text>
            
            <!-- 五个点 -->
            <!-- A: 30°N(160), 60°W(307) -->
            <circle id="scene1-point-a" class="scene1-point" cx="307" cy="160" r="6" />
            <!-- B: 60°S(340), 0°(420) -->
            <circle id="scene1-point-b" class="scene1-point" cx="420" cy="340" r="6" />
            <!-- C: 0°(220), 0°(420) -->
            <circle id="scene1-point-c" class="scene1-point" cx="420" cy="220" r="6" />
            <!-- D: 60°N(100), 60°E(533) -->
            <circle id="scene1-point-d" class="scene1-point" cx="533" cy="100" r="6" />
            <!-- E: 60°N(100), 120°E(647) -->
            <circle id="scene1-point-e" class="scene1-point" cx="647" cy="100" r="6" />
            
            <!-- 坐标标签 -->
            <text id="scene1-label-a" class="scene1-coord-label" x="320" y="145">A (30°N, 60°W)</text>
            <text id="scene1-label-b" class="scene1-coord-label" x="435" y="325">B (60°S, 0°)</text>
            <text id="scene1-label-c" class="scene1-coord-label" x="435" y="205">C (0°, 0°)</text>
            <text id="scene1-label-d" class="scene1-coord-label" x="548" y="85">D (60°N, 60°E)</text>
            <text id="scene1-label-e" class="scene1-coord-label" x="662" y="85">E (60°N, 120°E)</text>
            
            <!-- 方向箭头 (B→A) -->
            <!-- B(420,340) → A(307,160), 文字放在箭头右侧完全避开箭头线段 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#c62828" />
                </marker>
            </defs>
            <!-- 箭头线 -->
            <line id="scene1-arrow-ba" class="scene1-arrow" x1="420" y1="340" x2="307" y2="160" marker-end="url(#scene1-arrowhead)" />
            <!-- 西北文字放在箭头右侧完全避开线段，移到更右侧 -->
            <text id="scene1-arrow-text" class="scene1-arrow-text" x="415" y="210">西北</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/4</span>
            <button id="scene1-btn-next" class="scene1-btn scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1: 经纬网坐标系统与点位方向判断
        
        // 状态管理
        let currentState = 0;
        const totalSteps = 4;
        
        // DOM 元素引用
        const pointA = document.getElementById('scene1-point-a');
        const pointB = document.getElementById('scene1-point-b');
        const pointC = document.getElementById('scene1-point-c');
        const pointD = document.getElementById('scene1-point-d');
        const pointE = document.getElementById('scene1-point-e');
        
        const labelA = document.getElementById('scene1-label-a');
        const labelB = document.getElementById('scene1-label-b');
        const labelC = document.getElementById('scene1-label-c');
        const labelD = document.getElementById('scene1-label-d');
        const labelE = document.getElementById('scene1-label-e');
        
        const arrowBA = document.getElementById('scene1-arrow-ba');
        const arrowText = document.getElementById('scene1-arrow-text');
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        
        // 重置所有元素状态
        function resetAll() {
            // 重置所有点
            [pointA, pointB, pointC, pointD, pointE].forEach(p => {
                p.classList.remove('scene1-point-highlight');
            });
            // 重置所有标签
            [labelA, labelB, labelC, labelD, labelE].forEach(l => {
                l.classList.remove('visible');
            });
            // 重置箭头
            arrowBA.classList.remove('visible');
            arrowText.classList.remove('visible');
        }
        
        // 更新显示状态
        function updateDisplay() {
            resetAll();
            
            switch (currentState) {
                case 0:
                    // 初始状态：只显示基础网格和点，无高亮
                    break;
                case 1:
                    // 步骤 1：高亮 A 点
                    pointA.classList.add('scene1-point-highlight');
                    labelA.classList.add('visible');
                    break;
                case 2:
                    // 步骤 2：高亮 B 点
                    pointB.classList.add('scene1-point-highlight');
                    labelB.classList.add('visible');
                    break;
                case 3:
                    // 步骤 3：高亮 C/D/E 点
                    pointC.classList.add('scene1-point-highlight');
                    pointD.classList.add('scene1-point-highlight');
                    pointE.classList.add('scene1-point-highlight');
                    labelC.classList.add('visible');
                    labelD.classList.add('visible');
                    labelE.classList.add('visible');
                    break;
                case 4:
                    // 步骤 4：显示方向箭头
                    arrowBA.classList.add('visible');
                    arrowText.classList.add('visible');
                    break;
            }
            
            // 更新按钮状态
            btnPrev.disabled = (currentState === 0);
            btnNext.disabled = (currentState === totalSteps);
            
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentState}/${totalSteps}`;
        }
        
        // 按钮事件处理
        btnPrev.addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                updateDisplay();
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentState < totalSteps) {
                currentState++;
                updateDisplay();
            }
        });
        
        // 初始化显示
        updateDisplay();
        
    })();
    </script>
</body>
</html>
