<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地球公转示意图</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        .scene1-earth {
            transition: stroke-width 0.3s ease, stroke 0.3s ease;
        }
        .scene1-highlight {
            stroke: #1565c0 !important;
            stroke-width: 4 !important;
        }
        .scene1-solstice-text, .scene1-equinox-text {
            font-weight: bold;
            fill: #2e7d32;
            font-size: 16px;
        }
        .scene1-tilt-text {
            fill: #ff6f00;
            font-size: 14px;
        }
        .scene1-ray {
            stroke: #ff6f00;
            stroke-width: 2;
            fill: none;
            marker-end: url(#scene1-arrowhead);
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        #scene1-btn-prev, #scene1-btn-next {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #333;
            border-radius: 4px;
            background: #f5f5f5;
        }
        #scene1-btn-prev:hover, #scene1-btn-next:hover {
            background: #e0e0e0;
        }
        #scene1-btn-prev:disabled, #scene1-btn-next:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #333;
            min-width: 80px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- 箭头定义 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#ff6f00" />
                </marker>
            </defs>

            <!-- 标题：y=40 确保距边缘≥20px（18px 字号，基线在 y=40，顶部约在 y=22） -->
            <text id="scene1-title" x="400" y="40" text-anchor="middle" font-size="18px" font-weight="bold" fill="#000000">地球公转示意图</text>

            <!-- 公转轨道椭圆 -->
            <ellipse id="scene1-orbit" cx="400" cy="285" rx="260" ry="110" fill="none" stroke="#000000" stroke-width="2"/>

            <!-- 太阳 -->
            <g id="scene1-sun">
                <circle cx="400" cy="285" r="25" fill="#fdd835" stroke="#f9a825" stroke-width="2"/>
                <!-- 太阳光芒 8 条 -->
                <line x1="400" y1="255" x2="400" y2="240" stroke="#f9a825" stroke-width="2"/>
                <line x1="400" y1="315" x2="400" y2="330" stroke="#f9a825" stroke-width="2"/>
                <line x1="375" y1="285" x2="360" y2="285" stroke="#f9a825" stroke-width="2"/>
                <line x1="425" y1="285" x2="440" y2="285" stroke="#f9a825" stroke-width="2"/>
                <line x1="382.3" y1="267.3" x2="371.7" y2="256.7" stroke="#f9a825" stroke-width="2"/>
                <line x1="417.7" y1="302.7" x2="428.3" y2="313.3" stroke="#f9a825" stroke-width="2"/>
                <line x1="382.3" y1="302.7" x2="371.7" y2="313.3" stroke="#f9a825" stroke-width="2"/>
                <line x1="417.7" y1="267.3" x2="428.3" y2="256.7" stroke="#f9a825" stroke-width="2"/>
            </g>

            <!-- 太阳到地球的虚线连线 -->
            <line id="scene1-conn-a" x1="400" y1="285" x2="165" y2="285" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
            <line id="scene1-conn-b" x1="400" y1="285" x2="400" y2="395" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
            <line id="scene1-conn-c" x1="400" y1="285" x2="635" y2="285" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
            <line id="scene1-conn-d" x1="400" y1="285" x2="400" y2="160" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>

            <!-- 地球 A（左侧） -->
            <g id="scene1-earth-a-group">
                <circle id="scene1-earth-a" class="scene1-earth" cx="165" cy="285" r="35" fill="#4fc3f7" fill-opacity="0.3" stroke="#0288d1" stroke-width="2"/>
                <!-- 地轴 A：倾斜 23.5°，左上-右下 -->
                <line id="scene1-axis-a" x1="147.5" y1="250" x2="182.5" y2="320" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
                <!-- 赤道 A：垂直于地轴 -->
                <line id="scene1-equator-a" x1="140" y1="302.5" x2="190" y2="267.5" stroke="#0288d1" stroke-width="2"/>
                <!-- 位置标签 A：移到地球左侧外部 -->
                <text id="scene1-label-a" x="115" y="290" text-anchor="end" font-size="14px" fill="#000000">A</text>
                <!-- 倾斜标注 A：移到地球左侧更远处，向上移 -->
                <text id="scene1-tilt-text-a" class="scene1-tilt-text" x="105" y="245" text-anchor="end" opacity="0">北极倾向太阳</text>
                <!-- 节气 A 文本：向下移远离轨道 -->
                <text id="scene1-solstice-a" class="scene1-solstice-text" x="165" y="435" text-anchor="middle" opacity="0">夏至</text>
                <!-- 太阳光线 A -->
                <line id="scene1-ray-a" class="scene1-ray" x1="375" y1="285" x2="310" y2="285" opacity="0"/>
            </g>

            <!-- 地球 B（下方） -->
            <g id="scene1-earth-b-group">
                <circle id="scene1-earth-b" class="scene1-earth" cx="400" cy="395" r="35" fill="#4fc3f7" fill-opacity="0.3" stroke="#0288d1" stroke-width="2"/>
                <!-- 地轴 B：倾斜 23.5°，左上-右下 -->
                <line id="scene1-axis-b" x1="382.5" y1="360" x2="417.5" y2="430" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
                <!-- 赤道 B：垂直于地轴 -->
                <line id="scene1-equator-b" x1="375" y1="412.5" x2="425" y2="377.5" stroke="#0288d1" stroke-width="2"/>
                <!-- 位置标签 B：移到地球右侧外部，远离轨道 -->
                <text id="scene1-label-b" x="470" y="390" text-anchor="start" font-size="14px" fill="#000000">B</text>
                <!-- 节气 B 文本：向下移，远离控件栏 -->
                <text id="scene1-equinox-b" class="scene1-equinox-text" x="400" y="440" text-anchor="middle" opacity="0">秋分</text>
            </g>

            <!-- 地球 C（右侧） -->
            <g id="scene1-earth-c-group">
                <circle id="scene1-earth-c" class="scene1-earth" cx="635" cy="285" r="35" fill="#4fc3f7" fill-opacity="0.3" stroke="#0288d1" stroke-width="2"/>
                <!-- 地轴 C：倾斜 23.5°，左上-右下 -->
                <line id="scene1-axis-c" x1="617.5" y1="250" x2="652.5" y2="320" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
                <!-- 赤道 C：垂直于地轴 -->
                <line id="scene1-equator-c" x1="610" y1="302.5" x2="660" y2="267.5" stroke="#0288d1" stroke-width="2"/>
                <!-- 位置标签 C：移到地球右侧外部 -->
                <text id="scene1-label-c" x="685" y="290" text-anchor="start" font-size="14px" fill="#000000">C</text>
                <!-- 倾斜标注 C：移到地球右侧更远处，向上移 -->
                <text id="scene1-tilt-text-c" class="scene1-tilt-text" x="695" y="245" text-anchor="start" opacity="0">北极远离太阳</text>
                <!-- 节气 C 文本：向下移远离轨道 -->
                <text id="scene1-solstice-c" class="scene1-solstice-text" x="635" y="435" text-anchor="middle" opacity="0">冬至</text>
                <!-- 太阳光线 C -->
                <line id="scene1-ray-c" class="scene1-ray" x1="425" y1="285" x2="490" y2="285" opacity="0"/>
            </g>

            <!-- 地球 D（上方） -->
            <g id="scene1-earth-d-group">
                <circle id="scene1-earth-d" class="scene1-earth" cx="400" cy="160" r="35" fill="#4fc3f7" fill-opacity="0.3" stroke="#0288d1" stroke-width="2"/>
                <!-- 地轴 D：倾斜 23.5°，左上-右下 -->
                <line id="scene1-axis-d" x1="382.5" y1="125" x2="417.5" y2="195" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
                <!-- 赤道 D：垂直于地轴 -->
                <line id="scene1-equator-d" x1="375" y1="177.5" x2="425" y2="142.5" stroke="#0288d1" stroke-width="2"/>
                <!-- 位置标签 D：移到地球上方，远离地球和轨道 -->
                <text id="scene1-label-d" x="400" y="115" text-anchor="middle" font-size="14px" fill="#000000">D</text>
                <!-- 节气 D 文本：放在标签 D 上方，远离标题 -->
                <text id="scene1-equinox-d" class="scene1-equinox-text" x="400" y="95" text-anchor="middle" opacity="0">春分</text>
            </g>

            <!-- 控件栏背景 -->
            <g id="scene1-controls-group">
                <rect x="310" y="465" width="180" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="4"/>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/7</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现

        // 状态变量
        let currentStep = 0;
        const totalSteps = 7;

        // DOM 元素引用
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        // 地球元素
        const earthA = document.getElementById('scene1-earth-a');
        const earthB = document.getElementById('scene1-earth-b');
        const earthC = document.getElementById('scene1-earth-c');
        const earthD = document.getElementById('scene1-earth-d');

        // 可显隐元素
        const rayA = document.getElementById('scene1-ray-a');
        const rayC = document.getElementById('scene1-ray-c');
        const tiltTextA = document.getElementById('scene1-tilt-text-a');
        const tiltTextC = document.getElementById('scene1-tilt-text-c');
        const solsticeA = document.getElementById('scene1-solstice-a');
        const solsticeC = document.getElementById('scene1-solstice-c');
        const equinoxD = document.getElementById('scene1-equinox-d');
        const equinoxB = document.getElementById('scene1-equinox-b');

        // 辅助函数：显示元素
        function show(el) {
            if (el) {
                el.style.opacity = '1';
                el.style.display = 'block';
            }
        }

        // 辅助函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.opacity = '0';
                el.style.display = 'none';
            }
        }

        // 清除所有高亮
        function clearHighlights() {
            earthA.classList.remove('scene1-highlight');
            earthB.classList.remove('scene1-highlight');
            earthC.classList.remove('scene1-highlight');
            earthD.classList.remove('scene1-highlight');
        }

        // 隐藏所有动态元素
        function hideAllDynamic() {
            hide(rayA);
            hide(rayC);
            hide(tiltTextA);
            hide(tiltTextC);
            hide(solsticeA);
            hide(solsticeC);
            hide(equinoxD);
            hide(equinoxB);
            clearHighlights();
        }

        // 更新步骤显示
        function updateStep() {
            hideAllDynamic();

            switch (currentStep) {
                case 0:
                    // 初始状态：只显示基础元素
                    break;
                case 1:
                    // 高亮地球 A，显示太阳光线 A，显示倾斜标注 A
                    earthA.classList.add('scene1-highlight');
                    show(rayA);
                    show(tiltTextA);
                    break;
                case 2:
                    // 在步骤 1 基础上显示节气 A
                    earthA.classList.add('scene1-highlight');
                    show(rayA);
                    show(tiltTextA);
                    show(solsticeA);
                    break;
                case 3:
                    // 高亮地球 C，显示太阳光线 C，显示倾斜标注 C
                    earthC.classList.add('scene1-highlight');
                    show(rayC);
                    show(tiltTextC);
                    break;
                case 4:
                    // 在步骤 3 基础上显示节气 C
                    earthC.classList.add('scene1-highlight');
                    show(rayC);
                    show(tiltTextC);
                    show(solsticeC);
                    break;
                case 5:
                    // 高亮地球 D，显示节气 D
                    earthD.classList.add('scene1-highlight');
                    show(equinoxD);
                    break;
                case 6:
                    // 高亮地球 B，显示节气 B
                    earthB.classList.add('scene1-highlight');
                    show(equinoxB);
                    break;
                case 7:
                    // 最终状态：显示所有节气名称，无高亮
                    show(solsticeA);
                    show(solsticeC);
                    show(equinoxD);
                    show(equinoxB);
                    break;
            }

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps);

            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + currentStep + '/' + totalSteps;
        }

        // 下一步
        function stepForward() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateStep();
            }
        }

        // 上一步
        function stepBackward() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        }

        // 事件绑定
        btnNext.addEventListener('click', stepForward);
        btnPrev.addEventListener('click', stepBackward);

        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
