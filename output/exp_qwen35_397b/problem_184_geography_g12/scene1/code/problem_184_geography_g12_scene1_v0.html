<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地球公转轨道与两分两至示意图</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; font-size: 13px; border: none; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-btn-prev { background: #757575; color: white; }
        .scene1-btn-next { background: #1976d2; color: white; }
        .scene1-btn-step { background: #bdbdbd; color: #333; }
        .scene1-btn-step.active { background: #2e7d32; color: white; }
        .scene1-step-indicator { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #424242; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 椭圆轨道 -->
            <ellipse id="scene1-orbit" cx="380" cy="250" rx="280" ry="120" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 太阳（带径向渐变光晕） -->
            <defs>
                <radialGradient id="scene1-sun-gradient" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:#fff9c4;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#fdd835;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#f9a825;stop-opacity:1" />
                </radialGradient>
            </defs>
            <circle id="scene1-sun" cx="620" cy="250" r="28" fill="url(#scene1-sun-gradient)"/>
            <!-- 太阳标签移到更右侧上方，避免与 D 和光线重叠 -->
            <text id="scene1-sun-label" x="710" y="240" font-size="13px" fill="#f57f17">太阳</text>
            
            <!-- 太阳光线（8 条虚线） -->
            <g id="scene1-sun-rays" stroke="#fdd835" stroke-width="2" stroke-dasharray="5,5" opacity="0.5">
                <line x1="620" y1="250" x2="680" y2="250"/>
                <line x1="620" y1="250" x2="662" y2="208"/>
                <line x1="620" y1="250" x2="620" y2="190"/>
                <line x1="620" y1="250" x2="578" y2="208"/>
                <line x1="620" y1="250" x2="560" y2="250"/>
                <line x1="620" y1="250" x2="578" y2="292"/>
                <line x1="620" y1="250" x2="620" y2="310"/>
                <line x1="620" y1="250" x2="662" y2="292"/>
            </g>
            
            <!-- 地球 A（春分，上方） -->
            <g id="scene1-earth-a-group">
                <circle id="scene1-highlight-a" cx="380" cy="130" r="22" fill="#2e7d32" fill-opacity="0" stroke="none"/>
                <circle id="scene1-earth-a" cx="380" cy="130" r="22" fill="#9e9e9e" fill-opacity="0.5" stroke="#1565c0" stroke-width="1"/>
                <!-- 赤道线 -->
                <path id="scene1-equator-a" d="M 360 130 Q 380 135 400 130" fill="none" stroke="#1565c0" stroke-width="1"/>
                <!-- 地轴（倾斜 23.5°） -->
                <line id="scene1-axis-a" x1="365" y1="115" x2="395" y2="145" stroke="#888888" stroke-width="2" stroke-dasharray="3,3"/>
                <!-- 直射点（赤道位置） -->
                <circle id="scene1-direct-a" cx="380" cy="130" r="5" fill="#c62828" opacity="0"/>
                <!-- 自转箭头 -->
                <path id="scene1-rotate-a" d="M 390 118 A 12 12 0 0 1 395 125" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#scene1-arrow)"/>
                <!-- 位置标签 A -->
                <text id="scene1-label-a" x="380" y="95" font-size="14px" fill="#000000" text-anchor="middle">A</text>
                <!-- 节气标签春分 - 移到更上方，增加间距 -->
                <text id="scene1-season-a" x="380" y="60" font-size="13px" fill="#2e7d32" text-anchor="middle" opacity="0">春分</text>
            </g>
            
            <!-- 地球 B（夏至，左侧） -->
            <g id="scene1-earth-b-group">
                <circle id="scene1-highlight-b" cx="100" cy="250" r="22" fill="#2e7d32" fill-opacity="0" stroke="none"/>
                <circle id="scene1-earth-b" cx="100" cy="250" r="22" fill="#9e9e9e" fill-opacity="0.5" stroke="#1565c0" stroke-width="1"/>
                <!-- 赤道线 -->
                <path id="scene1-equator-b" d="M 80 250 Q 100 255 120 250" fill="none" stroke="#1565c0" stroke-width="1"/>
                <!-- 地轴（倾斜 23.5°） -->
                <line id="scene1-axis-b" x1="85" y1="235" x2="115" y2="265" stroke="#888888" stroke-width="2" stroke-dasharray="3,3"/>
                <!-- 直射点（北回归线位置） -->
                <circle id="scene1-direct-b" cx="100" cy="242" r="5" fill="#c62828" opacity="0"/>
                <!-- 自转箭头 -->
                <path id="scene1-rotate-b" d="M 110 238 A 12 12 0 0 1 115 245" fill="none" stroke="#333" stroke-width="1.5"/>
                <!-- 位置标签 B - 移到左下方 -->
                <text id="scene1-label-b" x="70" y="280" font-size="14px" fill="#000000" text-anchor="middle">B</text>
                <!-- 节气标签夏至 - 移到左上方，增加间距 -->
                <text id="scene1-season-b" x="70" y="210" font-size="13px" fill="#2e7d32" text-anchor="middle" opacity="0">夏至</text>
            </g>
            
            <!-- 地球 C（秋分，下方） -->
            <g id="scene1-earth-c-group">
                <circle id="scene1-highlight-c" cx="380" cy="370" r="22" fill="#2e7d32" fill-opacity="0" stroke="none"/>
                <circle id="scene1-earth-c" cx="380" cy="370" r="22" fill="#9e9e9e" fill-opacity="0.5" stroke="#1565c0" stroke-width="1"/>
                <!-- 赤道线 -->
                <path id="scene1-equator-c" d="M 360 370 Q 380 375 400 370" fill="none" stroke="#1565c0" stroke-width="1"/>
                <!-- 地轴（倾斜 23.5°） -->
                <line id="scene1-axis-c" x1="365" y1="355" x2="395" y2="385" stroke="#888888" stroke-width="2" stroke-dasharray="3,3"/>
                <!-- 直射点（赤道位置） -->
                <circle id="scene1-direct-c" cx="380" cy="370" r="5" fill="#c62828" opacity="0"/>
                <!-- 自转箭头 -->
                <path id="scene1-rotate-c" d="M 390 358 A 12 12 0 0 1 395 365" fill="none" stroke="#333" stroke-width="1.5"/>
                <!-- 位置标签 C - 移到左侧，避免与步骤指示重叠 -->
                <text id="scene1-label-c" x="340" y="400" font-size="14px" fill="#000000" text-anchor="middle">C</text>
                <!-- 节气标签秋分 - 移到右侧，避免与步骤指示和按钮重叠 -->
                <text id="scene1-season-c" x="460" y="400" font-size="13px" fill="#2e7d32" text-anchor="middle" opacity="0">秋分</text>
            </g>
            
            <!-- 地球 D（冬至，右侧） -->
            <g id="scene1-earth-d-group">
                <circle id="scene1-highlight-d" cx="660" cy="250" r="22" fill="#2e7d32" fill-opacity="0" stroke="none"/>
                <circle id="scene1-earth-d" cx="660" cy="250" r="22" fill="#9e9e9e" fill-opacity="0.5" stroke="#1565c0" stroke-width="1"/>
                <!-- 赤道线 -->
                <path id="scene1-equator-d" d="M 640 250 Q 660 255 680 250" fill="none" stroke="#1565c0" stroke-width="1"/>
                <!-- 地轴（倾斜 23.5°） -->
                <line id="scene1-axis-d" x1="645" y1="235" x2="675" y2="265" stroke="#888888" stroke-width="2" stroke-dasharray="3,3"/>
                <!-- 直射点（南回归线位置） -->
                <circle id="scene1-direct-d" cx="660" cy="258" r="5" fill="#c62828" opacity="0"/>
                <!-- 自转箭头 -->
                <path id="scene1-rotate-d" d="M 670 238 A 12 12 0 0 1 675 245" fill="none" stroke="#333" stroke-width="1.5"/>
                <!-- 位置标签 D - 移到右下方，远离太阳标签 -->
                <text id="scene1-label-d" x="720" y="275" font-size="14px" fill="#000000" text-anchor="middle">D</text>
                <!-- 节气标签冬至 - 移到右下方，增加间距 -->
                <text id="scene1-season-d" x="720" y="310" font-size="13px" fill="#2e7d32" text-anchor="middle" opacity="0">冬至</text>
            </g>
            
            <!-- 箭头标记定义 -->
            <defs>
                <marker id="scene1-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
                </marker>
            </defs>
            
            <!-- 步骤指示 - 上移避免与秋分标签和按钮重叠 -->
            <text id="scene1-step-indicator" x="400" y="445" font-size="12px" fill="#424242" text-anchor="middle">步骤 0/5</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn scene1-btn-next">下一步 ▶</button>
            <button id="scene1-btn-step1" class="scene1-btn scene1-btn-step" data-step="1">春分</button>
            <button id="scene1-btn-step2" class="scene1-btn scene1-btn-step" data-step="2">夏至</button>
            <button id="scene1-btn-step3" class="scene1-btn scene1-btn-step" data-step="3">秋分</button>
            <button id="scene1-btn-step4" class="scene1-btn scene1-btn-step" data-step="4">冬至</button>
            <button id="scene1-btn-step5" class="scene1-btn scene1-btn-step" data-step="5">总结</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现：地球公转轨道与两分两至
        
        // 状态变量
        let currentStep = 0;
        const totalSteps = 5;
        
        // 每步配置：显示的元素和高亮的地球
        const stepConfig = {
            0: { show: ['orbit', 'sun', 'earth-a', 'earth-b', 'earth-c', 'earth-d'], highlight: null },
            1: { show: ['orbit', 'sun', 'earth-a', 'axis-a', 'direct-a', 'label-a', 'season-a', 'equator-a', 'rotate-a'], highlight: 'a' },
            2: { show: ['orbit', 'sun', 'earth-b', 'axis-b', 'direct-b', 'label-b', 'season-b', 'equator-b', 'rotate-b'], highlight: 'b' },
            3: { show: ['orbit', 'sun', 'earth-c', 'axis-c', 'direct-c', 'label-c', 'season-c', 'equator-c', 'rotate-c'], highlight: 'c' },
            4: { show: ['orbit', 'sun', 'earth-d', 'axis-d', 'direct-d', 'label-d', 'season-d', 'equator-d', 'rotate-d'], highlight: 'd' },
            5: { show: 'all', highlight: null }
        };
        
        // 元素 ID 映射
        const elementIds = {
            'orbit': ['scene1-orbit'],
            'sun': ['scene1-sun', 'scene1-sun-label', 'scene1-sun-rays'],
            'earth-a': ['scene1-earth-a'],
            'earth-b': ['scene1-earth-b'],
            'earth-c': ['scene1-earth-c'],
            'earth-d': ['scene1-earth-d'],
            'axis-a': ['scene1-axis-a'],
            'axis-b': ['scene1-axis-b'],
            'axis-c': ['scene1-axis-c'],
            'axis-d': ['scene1-axis-d'],
            'direct-a': ['scene1-direct-a'],
            'direct-b': ['scene1-direct-b'],
            'direct-c': ['scene1-direct-c'],
            'direct-d': ['scene1-direct-d'],
            'label-a': ['scene1-label-a'],
            'label-b': ['scene1-label-b'],
            'label-c': ['scene1-label-c'],
            'label-d': ['scene1-label-d'],
            'season-a': ['scene1-season-a'],
            'season-b': ['scene1-season-b'],
            'season-c': ['scene1-season-c'],
            'season-d': ['scene1-season-d'],
            'equator-a': ['scene1-equator-a'],
            'equator-b': ['scene1-equator-b'],
            'equator-c': ['scene1-equator-c'],
            'equator-d': ['scene1-equator-d'],
            'rotate-a': ['scene1-rotate-a'],
            'rotate-b': ['scene1-rotate-b'],
            'rotate-c': ['scene1-rotate-c'],
            'rotate-d': ['scene1-rotate-d']
        };
        
        // 显示/隐藏元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.opacity = '1';
                if (el.tagName === 'circle' && id.includes('earth-')) {
                    el.setAttribute('fill', '#1565c0');
                    el.setAttribute('fill-opacity', '1');
                }
            }
        }
        
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                if (id.includes('earth-') && !id.includes('highlight')) {
                    el.setAttribute('fill', '#9e9e9e');
                    el.setAttribute('fill-opacity', '0.5');
                } else {
                    el.style.opacity = '0';
                }
            }
        }
        
        // 更新步骤显示
        function updateStep(step) {
            currentStep = step;
            const config = stepConfig[step];
            
            // 重置所有元素状态
            const allElements = Object.values(elementIds).flat();
            allElements.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    if (id.includes('earth-') && !id.includes('highlight')) {
                        el.setAttribute('fill', '#9e9e9e');
                        el.setAttribute('fill-opacity', '0.5');
                    } else if (id.includes('highlight')) {
                        el.setAttribute('fill-opacity', '0');
                    } else if (id.includes('direct')) {
                        el.setAttribute('opacity', '0');
                    } else if (id.includes('season')) {
                        el.setAttribute('opacity', '0');
                    } else if (id.includes('axis') || id.includes('equator') || id.includes('rotate')) {
                        el.style.opacity = '0';
                    }
                }
            });
            
            // 根据配置显示元素
            if (config.show === 'all') {
                // 步骤 5：显示所有
                ['scene1-earth-a', 'scene1-earth-b', 'scene1-earth-c', 'scene1-earth-d'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        el.setAttribute('fill', '#1565c0');
                        el.setAttribute('fill-opacity', '1');
                    }
                });
                ['scene1-axis-a', 'scene1-axis-b', 'scene1-axis-c', 'scene1-axis-d'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.style.opacity = '1';
                });
                ['scene1-direct-a', 'scene1-direct-b', 'scene1-direct-c', 'scene1-direct-d'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.setAttribute('opacity', '1');
                });
                ['scene1-label-a', 'scene1-label-b', 'scene1-label-c', 'scene1-label-d'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.style.opacity = '1';
                });
                ['scene1-season-a', 'scene1-season-b', 'scene1-season-c', 'scene1-season-d'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.setAttribute('opacity', '1');
                });
                ['scene1-equator-a', 'scene1-equator-b', 'scene1-equator-c', 'scene1-equator-d'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.style.opacity = '1';
                });
                ['scene1-rotate-a', 'scene1-rotate-b', 'scene1-rotate-c', 'scene1-rotate-d'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.style.opacity = '1';
                });
            } else {
                // 其他步骤：只显示配置的元素
                config.show.forEach(key => {
                    if (elementIds[key]) {
                        elementIds[key].forEach(id => showElement(id));
                    }
                });
                
                // 高亮当前地球
                if (config.highlight) {
                    const highlightEl = document.getElementById(`scene1-highlight-${config.highlight}`);
                    if (highlightEl) {
                        highlightEl.setAttribute('fill-opacity', '0.2');
                    }
                    // 显示直射点和节气标签
                    const directEl = document.getElementById(`scene1-direct-${config.highlight}`);
                    if (directEl) directEl.setAttribute('opacity', '1');
                    const seasonEl = document.getElementById(`scene1-season-${config.highlight}`);
                    if (seasonEl) seasonEl.setAttribute('opacity', '1');
                }
            }
            
            // 更新步骤指示
            const indicator = document.getElementById('scene1-step-indicator');
            if (indicator) {
                indicator.textContent = `步骤 ${step}/${totalSteps}`;
            }
            
            // 更新按钮状态
            const prevBtn = document.getElementById('scene1-btn-prev');
            const nextBtn = document.getElementById('scene1-btn-next');
            if (prevBtn) prevBtn.disabled = (step === 0);
            if (nextBtn) nextBtn.disabled = (step === totalSteps);
            
            // 更新步骤按钮高亮
            for (let i = 1; i <= totalSteps; i++) {
                const btn = document.getElementById(`scene1-btn-step${i}`);
                if (btn) {
                    if (i === step) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                }
            }
        }
        
        // 事件绑定
        document.getElementById('scene1-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                updateStep(currentStep - 1);
            }
        });
        
        document.getElementById('scene1-btn-next').addEventListener('click', function() {
            if (currentStep < totalSteps) {
                updateStep(currentStep + 1);
            }
        });
        
        // 步骤快捷按钮
        for (let i = 1; i <= totalSteps; i++) {
            const btn = document.getElementById(`scene1-btn-step${i}`);
            if (btn) {
                btn.addEventListener('click', function() {
                    updateStep(i);
                });
            }
        }
        
        // 初始化
        updateStep(0);
        
    })();
    </script>
</body>
</html>
