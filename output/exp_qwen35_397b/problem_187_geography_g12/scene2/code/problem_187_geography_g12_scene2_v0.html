<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四地纬度计算与昼夜长短</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-svg { width: 800px; height: 500px; }
        .scene2-step { opacity: 0; transition: opacity 0.3s ease; }
        .scene2-visible { opacity: 1; }
        .scene2-btn { cursor: pointer; fill: #1565c0; stroke: #0d47a1; stroke-width: 1; }
        .scene2-btn:hover { fill: #1976d2; }
        .scene2-btn-text { fill: #ffffff; font-size: 13px; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
        .scene2-btn-disabled { fill: #bdbdbd; stroke: #9e9e9e; cursor: not-allowed; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <!-- 标题 -->
            <text id="scene2-title" x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">四地纬度计算与昼夜长短</text>
            
            <!-- 表格背景（浅色填充，用于视觉区分） -->
            <rect id="scene2-table-bg" x="50" y="40" width="700" height="105" fill="#e3f2fd" stroke="#000000" stroke-width="1"/>
            
            <!-- 表格列分隔线 -->
            <line x1="225" y1="40" x2="225" y2="145" stroke="#000000" stroke-width="1"/>
            <line x1="400" y1="40" x2="400" y2="145" stroke="#000000" stroke-width="1"/>
            <line x1="575" y1="40" x2="575" y2="145" stroke="#000000" stroke-width="1"/>
            <line x1="50" y1="73" x2="750" y2="73" stroke="#000000" stroke-width="1"/>
            <line x1="50" y1="107" x2="750" y2="107" stroke="#000000" stroke-width="1"/>
            
            <!-- 表格标签 A B C D -->
            <text id="scene2-label-A" x="137" y="63" text-anchor="middle" font-size="15" fill="#000000">A</text>
            <text id="scene2-label-B" x="312" y="63" text-anchor="middle" font-size="15" fill="#000000">B</text>
            <text id="scene2-label-C" x="487" y="63" text-anchor="middle" font-size="15" fill="#000000">C</text>
            <text id="scene2-label-D" x="662" y="63" text-anchor="middle" font-size="15" fill="#000000">D</text>
            
            <!-- 倾角α值 -->
            <text id="scene2-alpha-A" x="137" y="93" text-anchor="middle" font-size="13" fill="#000000">α=6°34'</text>
            <text id="scene2-alpha-B" x="312" y="93" text-anchor="middle" font-size="13" fill="#000000">α=26°34'</text>
            <text id="scene2-alpha-C" x="487" y="93" text-anchor="middle" font-size="13" fill="#000000">α=28°34'</text>
            <text id="scene2-alpha-D" x="662" y="93" text-anchor="middle" font-size="13" fill="#000000">α=13°34'</text>
            
            <!-- 正午太阳高度 H 值（步骤 1 显示） -->
            <g id="scene2-step1-H">
                <text id="scene2-H-A" x="137" y="133" text-anchor="middle" font-size="13" fill="#c62828">H=83°26'</text>
                <text id="scene2-H-B" x="312" y="133" text-anchor="middle" font-size="13" fill="#c62828">H=63°26'</text>
                <text id="scene2-H-C" x="487" y="133" text-anchor="middle" font-size="13" fill="#c62828">H=61°26'</text>
                <text id="scene2-H-D" x="662" y="133" text-anchor="middle" font-size="13" fill="#c62828">H=76°26'</text>
                <text id="scene2-formula" x="400" y="165" text-anchor="middle" font-size="13" fill="#c62828" font-style="italic">公式：H = 90° - α</text>
            </g>
            
            <!-- 纬度示意图框架 -->
            <g id="scene2-latitude-frame">
                <!-- 赤道线 -->
                <line id="scene2-equator" x1="100" y1="205" x2="700" y2="205" stroke="#000000" stroke-width="2"/>
                <text id="scene2-equator-label" x="715" y="210" font-size="13" fill="#000000">0°</text>
                
                <!-- 北回归线（虚线） -->
                <line id="scene2-tropic" x1="100" y1="240" x2="700" y2="240" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
                <text id="scene2-tropic-label" x="715" y="245" font-size="12" fill="#888888">23°26'N</text>
                
                <!-- 30°N 线 -->
                <line id="scene2-30N" x1="100" y1="270" x2="700" y2="270" stroke="#000000" stroke-width="1"/>
                <text id="scene2-30N-label" x="715" y="275" font-size="13" fill="#000000">30°</text>
                
                <!-- 40°N 线 -->
                <line id="scene2-40N" x1="100" y1="305" x2="700" y2="305" stroke="#000000" stroke-width="1"/>
                <text id="scene2-40N-label" x="715" y="310" font-size="13" fill="#000000">40°</text>
            </g>
            
            <!-- 四地纬度位置点（步骤 2 显示） -->
            <g id="scene2-step2-points">
                <!-- A 点：13°N, y = 205 + (13/45)*100 ≈ 234 -->
                <circle id="scene2-point-A" cx="200" cy="234" r="5" fill="#2e7d32" stroke="#1b5e20" stroke-width="1"/>
                <text id="scene2-phi-A" x="212" y="239" font-size="12" fill="#2e7d32">13°N</text>
                
                <!-- B 点：37°N, y = 205 + (37/45)*100 ≈ 287 -->
                <circle id="scene2-point-B" cx="350" cy="287" r="5" fill="#2e7d32" stroke="#1b5e20" stroke-width="1"/>
                <text id="scene2-phi-B" x="362" y="292" font-size="12" fill="#2e7d32">37°N</text>
                
                <!-- C 点：39°N, y = 205 + (39/45)*100 ≈ 292 -->
                <circle id="scene2-point-C" cx="450" cy="292" r="5" fill="#2e7d32" stroke="#1b5e20" stroke-width="1"/>
                <text id="scene2-phi-C" x="462" y="297" font-size="12" fill="#2e7d32">39°N</text>
                
                <!-- D 点：37°N, y = 205 + (37/45)*100 ≈ 287 -->
                <circle id="scene2-point-D" cx="550" cy="287" r="5" fill="#2e7d32" stroke="#1b5e20" stroke-width="1"/>
                <text id="scene2-phi-D" x="562" y="292" font-size="12" fill="#2e7d32">37°N</text>
            </g>
            
            <!-- 昼弧示意图（步骤 3 显示） -->
            <g id="scene2-step3-dayarc">
                <text id="scene2-dayarc-title" x="150" y="340" font-size="13" fill="#000000">昼弧示意：</text>
                
                <!-- A 地昼弧 (最短) -->
                <rect id="scene2-dayarc-A" x="220" y="325" width="45" height="18" fill="#1565c0" opacity="0.6"/>
                <text id="scene2-dayarc-label-A" x="242" y="360" text-anchor="middle" font-size="11" fill="#000000">A</text>
                
                <!-- B 地昼弧 -->
                <rect id="scene2-dayarc-B" x="285" y="325" width="62" height="18" fill="#1565c0" opacity="0.6"/>
                <text id="scene2-dayarc-label-B" x="316" y="360" text-anchor="middle" font-size="11" fill="#000000">B</text>
                
                <!-- C 地昼弧 (最长) -->
                <rect id="scene2-dayarc-C" x="367" y="325" width="72" height="18" fill="#1565c0" opacity="0.6"/>
                <text id="scene2-dayarc-label-C" x="403" y="360" text-anchor="middle" font-size="11" fill="#000000">C</text>
                
                <!-- D 地昼弧 (与 B 相同) -->
                <rect id="scene2-dayarc-D" x="459" y="325" width="62" height="18" fill="#1565c0" opacity="0.6"/>
                <text id="scene2-dayarc-label-D" x="490" y="360" text-anchor="middle" font-size="11" fill="#000000">D</text>
                
                <!-- 规律文字 -->
                <text id="scene2-rule" x="400" y="385" text-anchor="middle" font-size="12" fill="#000000" font-style="italic">夏至日：北半球纬度越高，昼越长</text>
            </g>
            
            <!-- 结论框（步骤 4 显示） -->
            <g id="scene2-step4-conclusion">
                <rect id="scene2-conclusion-box" x="100" y="400" width="600" height="25" fill="#fff9c4" stroke="#000000" stroke-width="1"/>
                <text id="scene2-conclusion-text" x="400" y="417" text-anchor="middle" font-size="12" fill="#000000" font-weight="bold">昼长排序：C(39°N) &gt; B(37°N) = D(37°N) &gt; A(13°N)</text>
            </g>
            
            <!-- 控件按钮 -->
            <g id="scene2-controls">
                <!-- 上一步按钮 -->
                <rect id="scene2-btn-prev" x="280" y="458" width="85" height="26" rx="4" class="scene2-btn scene2-btn-disabled"/>
                <text id="scene2-btn-prev-text" x="322" y="475" class="scene2-btn-text">◀ 上一步</text>
                
                <!-- 下一步按钮 -->
                <rect id="scene2-btn-next" x="435" y="458" width="85" height="26" rx="4" class="scene2-btn"/>
                <text id="scene2-btn-next-text" x="477" y="475" class="scene2-btn-text">下一步 ▶</text>
            </g>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现
        let currentState = 0;
        const totalSteps = 5; // 0-4
        
        // 每步可见元素
        const stepVisibility = {
            0: ['scene2-title', 'scene2-table-bg', 'scene2-label-A', 'scene2-label-B', 'scene2-label-C', 'scene2-label-D',
                'scene2-alpha-A', 'scene2-alpha-B', 'scene2-alpha-C', 'scene2-alpha-D', 'scene2-latitude-frame'],
            1: ['scene2-title', 'scene2-table-bg', 'scene2-label-A', 'scene2-label-B', 'scene2-label-C', 'scene2-label-D',
                'scene2-alpha-A', 'scene2-alpha-B', 'scene2-alpha-C', 'scene2-alpha-D', 'scene2-latitude-frame',
                'scene2-step1-H'],
            2: ['scene2-title', 'scene2-table-bg', 'scene2-label-A', 'scene2-label-B', 'scene2-label-C', 'scene2-label-D',
                'scene2-alpha-A', 'scene2-alpha-B', 'scene2-alpha-C', 'scene2-alpha-D', 'scene2-latitude-frame',
                'scene2-step1-H', 'scene2-step2-points'],
            3: ['scene2-title', 'scene2-table-bg', 'scene2-label-A', 'scene2-label-B', 'scene2-label-C', 'scene2-label-D',
                'scene2-alpha-A', 'scene2-alpha-B', 'scene2-alpha-C', 'scene2-alpha-D', 'scene2-latitude-frame',
                'scene2-step1-H', 'scene2-step2-points', 'scene2-step3-dayarc'],
            4: ['scene2-title', 'scene2-table-bg', 'scene2-label-A', 'scene2-label-B', 'scene2-label-C', 'scene2-label-D',
                'scene2-alpha-A', 'scene2-alpha-B', 'scene2-alpha-C', 'scene2-alpha-D', 'scene2-latitude-frame',
                'scene2-step1-H', 'scene2-step2-points', 'scene2-step3-dayarc', 'scene2-step4-conclusion']
        };
        
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.add('scene2-visible');
                el.style.display = '';
                el.style.opacity = '1';
            }
        }
        
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene2-visible');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        function updateVisibility() {
            // 隐藏所有步骤元素
            const allElements = ['scene2-step1-H', 'scene2-step2-points', 'scene2-step3-dayarc', 'scene2-step4-conclusion'];
            allElements.forEach(id => hideElement(id));
            
            // 显示当前步骤及之前步骤的元素
            for (let i = 0; i <= currentState; i++) {
                stepVisibility[i].forEach(id => showElement(id));
            }
            
            // 更新按钮状态
            const prevBtn = document.getElementById('scene2-btn-prev');
            const nextBtn = document.getElementById('scene2-btn-next');
            
            if (currentState === 0) {
                prevBtn.classList.add('scene2-btn-disabled');
            } else {
                prevBtn.classList.remove('scene2-btn-disabled');
            }
            
            if (currentState === totalSteps - 1) {
                nextBtn.classList.add('scene2-btn-disabled');
            } else {
                nextBtn.classList.remove('scene2-btn-disabled');
            }
        }
        
        function goToStep(step) {
            if (step < 0 || step >= totalSteps) return;
            currentState = step;
            updateVisibility();
        }
        
        // 初始化
        updateVisibility();
        
        // 按钮事件
        document.getElementById('scene2-btn-prev').addEventListener('click', function() {
            if (currentState > 0) {
                goToStep(currentState - 1);
            }
        });
        
        document.getElementById('scene2-btn-next').addEventListener('click', function() {
            if (currentState < totalSteps - 1) {
                goToStep(currentState + 1);
            }
        });
    })();
    </script>
</body>
</html>
