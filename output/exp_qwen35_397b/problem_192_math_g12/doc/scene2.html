<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牛顿调和三角形 - 第n行第2、3个数规律探究</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        .fade-in { transition: opacity 0.3s ease-in-out; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义渐变和样式 -->
            <defs>
                <style>
                    .table-header { fill: #1565c0; }
                    .table-row-white { fill: #ffffff; }
                    .table-row-gray { fill: #f5f5f5; }
                    .table-border { stroke: #000000; stroke-width: 1; }
                    .formula-box { fill: none; stroke: #c62828; stroke-width: 2; }
                    .highlight-box { fill: #2e7d32; opacity: 0.3; }
                    .arrow-line { stroke: #888888; stroke-width: 2; stroke-dasharray: 5,5; }
                    .btn-rect { fill: #1565c0; rx: 5; ry: 5; }
                    .btn-text { fill: #ffffff; font-size: 14px; font-weight: bold; }
                    .header-text { fill: #ffffff; font-size: 13px; }
                    .cell-text { fill: #000000; font-size: 13px; }
                    .title-text { fill: #000000; font-size: 16px; font-weight: bold; }
                    .formula-text { fill: #000000; font-size: 14px; }
                    .step-text { fill: #000000; font-size: 14px; }
                </style>
            </defs>

            <!-- 左表标题 -->
            <text id="scene2-left-title" x="200" y="40" text-anchor="middle" class="title-text">第 2 个数规律</text>

            <!-- 右表标题 -->
            <text id="scene2-right-title" x="600" y="40" text-anchor="middle" class="title-text">第 3 个数规律</text>

            <!-- 左表表头 -->
            <rect id="scene2-left-header-bg" x="80" y="60" width="240" height="30" class="table-header"/>
            <text id="scene2-left-header-n" x="140" y="80" text-anchor="middle" class="header-text">行号 n</text>
            <text id="scene2-left-header-val" x="200" y="80" text-anchor="middle" class="header-text">数值</text>
            <text id="scene2-left-header-den" x="260" y="80" text-anchor="middle" class="header-text">分母</text>
            <text id="scene2-left-header-pattern" x="310" y="80" text-anchor="middle" class="header-text">规律</text>

            <!-- 左表数据行背景 -->
            <rect id="scene2-left-row1-bg" x="80" y="90" width="240" height="30" class="table-row-white"/>
            <rect id="scene2-left-row2-bg" x="80" y="120" width="240" height="30" class="table-row-gray"/>
            <rect id="scene2-left-row3-bg" x="80" y="150" width="240" height="30" class="table-row-white"/>
            <rect id="scene2-left-row4-bg" x="80" y="180" width="240" height="30" class="table-row-gray"/>
            <rect id="scene2-left-row5-bg" x="80" y="210" width="240" height="30" class="table-row-white"/>

            <!-- 左表边框 -->
            <line x1="80" y1="60" x2="320" y2="60" class="table-border"/>
            <line x1="80" y1="240" x2="320" y2="240" class="table-border"/>
            <line x1="80" y1="60" x2="80" y2="240" class="table-border"/>
            <line x1="320" y1="60" x2="320" y2="240" class="table-border"/>

            <!-- 左表数据行分隔线 -->
            <line x1="80" y1="90" x2="320" y2="90" class="table-border"/>
            <line x1="80" y1="120" x2="320" y2="120" class="table-border"/>
            <line x1="80" y1="150" x2="320" y2="150" class="table-border"/>
            <line x1="80" y1="180" x2="320" y2="180" class="table-border"/>
            <line x1="80" y1="210" x2="320" y2="210" class="table-border"/>

            <!-- 左表数据内容（初始隐藏） -->
            <g id="scene2-left-data" class="fade-in" style="opacity: 0;">
                <!-- 行1: n=2 -->
                <text x="140" y="110" text-anchor="middle" class="cell-text">2</text>
                <text x="200" y="110" text-anchor="middle" class="cell-text">1/2</text>
                <text x="260" y="110" text-anchor="middle" class="cell-text">2=2×1</text>
                <text x="310" y="110" text-anchor="middle" class="cell-text">—</text>

                <!-- 行2: n=3 -->
                <text x="140" y="140" text-anchor="middle" class="cell-text">3</text>
                <text x="200" y="140" text-anchor="middle" class="cell-text">1/6</text>
                <text x="260" y="140" text-anchor="middle" class="cell-text">6=3×2</text>
                <text x="310" y="140" text-anchor="middle" class="cell-text">—</text>

                <!-- 行3: n=4 -->
                <text x="140" y="170" text-anchor="middle" class="cell-text">4</text>
                <text x="200" y="170" text-anchor="middle" class="cell-text">1/12</text>
                <text x="260" y="170" text-anchor="middle" class="cell-text">12=4×3</text>
                <text x="310" y="170" text-anchor="middle" class="cell-text">—</text>

                <!-- 行4: n=5 -->
                <text x="140" y="200" text-anchor="middle" class="cell-text">5</text>
                <text x="200" y="200" text-anchor="middle" class="cell-text">1/20</text>
                <text x="260" y="200" text-anchor="middle" class="cell-text">20=5×4</text>
                <text x="310" y="200" text-anchor="middle" class="cell-text">—</text>

                <!-- 行5: n=6 -->
                <text x="140" y="230" text-anchor="middle" class="cell-text">6</text>
                <text x="200" y="230" text-anchor="middle" class="cell-text">1/30</text>
                <text x="260" y="230" text-anchor="middle" class="cell-text">30=6×5</text>
                <text x="310" y="230" text-anchor="middle" class="cell-text">—</text>
            </g>

            <!-- 右表表头 -->
            <rect id="scene2-right-header-bg" x="480" y="60" width="240" height="30" class="table-header"/>
            <text id="scene2-right-header-n" x="540" y="80" text-anchor="middle" class="header-text">行号 n</text>
            <text id="scene2-right-header-val" x="600" y="80" text-anchor="middle" class="header-text">数值</text>
            <text id="scene2-right-header-den" x="660" y="80" text-anchor="middle" class="header-text">分母</text>
            <text id="scene2-right-header-pattern" x="710" y="80" text-anchor="middle" class="header-text">规律</text>

            <!-- 右表数据行背景 -->
            <rect id="scene2-right-row1-bg" x="480" y="90" width="240" height="30" class="table-row-white"/>
            <rect id="scene2-right-row2-bg" x="480" y="120" width="240" height="30" class="table-row-gray"/>
            <rect id="scene2-right-row3-bg" x="480" y="150" width="240" height="30" class="table-row-white"/>
            <rect id="scene2-right-row4-bg" x="480" y="180" width="240" height="30" class="table-row-gray"/>
            <rect id="scene2-right-row5-bg" x="480" y="210" width="240" height="30" class="table-row-white"/>

            <!-- 右表边框 -->
            <line x1="480" y1="60" x2="720" y2="60" class="table-border"/>
            <line x1="480" y1="240" x2="720" y2="240" class="table-border"/>
            <line x1="480" y1="60" x2="480" y2="240" class="table-border"/>
            <line x1="720" y1="60" x2="720" y2="240" class="table-border"/>

            <!-- 右表数据行分隔线 -->
            <line x1="480" y1="90" x2="720" y2="90" class="table-border"/>
            <line x1="480" y1="120" x2="720" y2="120" class="table-border"/>
            <line x1="480" y1="150" x2="720" y2="150" class="table-border"/>
            <line x1="480" y1="180" x2="720" y2="180" class="table-border"/>
            <line x1="480" y1="210" x2="720" y2="210" class="table-border"/>

            <!-- 右表数据内容（初始隐藏） -->
            <g id="scene2-right-data" class="fade-in" style="opacity: 0;">
                <!-- 行1: n=3 -->
                <text x="540" y="110" text-anchor="middle" class="cell-text">3</text>
                <text x="600" y="110" text-anchor="middle" class="cell-text">1/3</text>
                <text x="660" y="110" text-anchor="middle" class="cell-text">3=3×2×1/2</text>
                <text x="710" y="110" text-anchor="middle" class="cell-text">—</text>

                <!-- 行2: n=4 -->
                <text x="540" y="140" text-anchor="middle" class="cell-text">4</text>
                <text x="600" y="140" text-anchor="middle" class="cell-text">1/12</text>
                <text x="660" y="140" text-anchor="middle" class="cell-text">12=4×3×2/2</text>
                <text x="710" y="140" text-anchor="middle" class="cell-text">—</text>

                <!-- 行3: n=5 -->
                <text x="540" y="170" text-anchor="middle" class="cell-text">5</text>
                <text x="600" y="170" text-anchor="middle" class="cell-text">1/30</text>
                <text x="660" y="170" text-anchor="middle" class="cell-text">30=5×4×3/2</text>
                <text x="710" y="170" text-anchor="middle" class="cell-text">—</text>

                <!-- 行4: n=6 -->
                <text x="540" y="200" text-anchor="middle" class="cell-text">6</text>
                <text x="600" y="200" text-anchor="middle" class="cell-text">1/60</text>
                <text x="660" y="200" text-anchor="middle" class="cell-text">60=6×5×4/2</text>
                <text x="710" y="200" text-anchor="middle" class="cell-text">—</text>

                <!-- 行5: n=7 -->
                <text x="540" y="230" text-anchor="middle" class="cell-text">7</text>
                <text x="600" y="230" text-anchor="middle" class="cell-text">1/105</text>
                <text x="660" y="230" text-anchor="middle" class="cell-text">105=7×6×5/2</text>
                <text x="710" y="230" text-anchor="middle" class="cell-text">—</text>
            </g>

            <!-- 高亮框（初始隐藏） -->
            <rect id="scene2-highlight-left" x="235" y="105" width="50" height="110" class="highlight-box" style="opacity: 0;"/>
            <rect id="scene2-highlight-right" x="635" y="105" width="50" height="110" class="highlight-box" style="opacity: 0;"/>

            <!-- 推导箭头（初始隐藏） -->
            <g id="scene2-arrows" style="opacity: 0;">
                <line x1="340" y1="100" x2="460" y2="100" class="arrow-line"/>
                <line x1="340" y1="150" x2="460" y2="150" class="arrow-line"/>
                <text x="400" y="130" text-anchor="middle" class="cell-text" font-size="12" fill="#888888">推导</text>
            </g>

            <!-- 通项公式框 1 -->
            <rect id="scene2-formula-box-1" x="150" y="280" width="200" height="60" class="formula-box" style="opacity: 0.3;"/>
            <text id="scene2-formula-text-1" x="250" y="305" text-anchor="middle" class="formula-text" style="opacity: 0;">a(n,2) = ?</text>
            <text id="scene2-formula-text-1-full" x="250" y="330" text-anchor="middle" class="formula-text" style="opacity: 0;">1/[n(n-1)]</text>

            <!-- 通项公式框 2 -->
            <rect id="scene2-formula-box-2" x="450" y="280" width="200" height="60" class="formula-box" style="opacity: 0.3;"/>
            <text id="scene2-formula-text-2" x="550" y="305" text-anchor="middle" class="formula-text" style="opacity: 0;">a(n,3) = ?</text>
            <text id="scene2-formula-text-2-full" x="550" y="330" text-anchor="middle" class="formula-text" style="opacity: 0;">2/[n(n-1)(n-2)]</text>

            <!-- 控件栏背景 -->
            <rect x="50" y="450" width="700" height="40" fill="#f0f0f0" rx="5" ry="5"/>

            <!-- 上一步按钮 -->
            <rect id="scene2-btn-prev-bg" x="250" y="455" width="90" height="30" class="btn-rect" style="opacity: 0.5;"/>
            <text id="scene2-btn-prev-text" x="295" y="475" text-anchor="middle" class="btn-text">◀ 上一步</text>

            <!-- 下一步按钮 -->
            <rect id="scene2-btn-next-bg" x="460" y="455" width="90" height="30" class="btn-rect"/>
            <text id="scene2-btn-next-text" x="505" y="475" text-anchor="middle" class="btn-text">下一步 ▶</text>

            <!-- 步骤指示器 -->
            <text id="scene2-step-indicator" x="400" y="475" text-anchor="middle" class="step-text">步骤 0/5</text>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 2 实现：牛顿调和三角形规律探究

        let currentStep = 0;
        const totalSteps = 5;

        // 获取元素
        const leftData = document.getElementById('scene2-left-data');
        const rightData = document.getElementById('scene2-right-data');
        const highlightLeft = document.getElementById('scene2-highlight-left');
        const highlightRight = document.getElementById('scene2-highlight-right');
        const arrows = document.getElementById('scene2-arrows');
        const formulaBox1 = document.getElementById('scene2-formula-box-1');
        const formulaText1 = document.getElementById('scene2-formula-text-1');
        const formulaText1Full = document.getElementById('scene2-formula-text-1-full');
        const formulaBox2 = document.getElementById('scene2-formula-box-2');
        const formulaText2 = document.getElementById('scene2-formula-text-2');
        const formulaText2Full = document.getElementById('scene2-formula-text-2-full');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        const btnPrevBg = document.getElementById('scene2-btn-prev-bg');
        const btnPrevText = document.getElementById('scene2-btn-prev-text');
        const btnNextBg = document.getElementById('scene2-btn-next-bg');
        const btnNextText = document.getElementById('scene2-btn-next-text');

        // 辅助函数：显示/隐藏元素
        function show(el) {
            el.style.opacity = '1';
            el.style.display = '';
        }

        function hide(el) {
            el.style.opacity = '0';
        }

        function showFull(el) {
            el.style.opacity = '1';
        }

        // 更新按钮状态
        function updateButtons() {
            if (currentStep === 0) {
                btnPrevBg.style.opacity = '0.5';
                btnPrevText.style.opacity = '0.5';
            } else {
                btnPrevBg.style.opacity = '1';
                btnPrevText.style.opacity = '1';
            }

            if (currentStep === totalSteps) {
                btnNextBg.style.opacity = '0.5';
                btnNextText.style.opacity = '0.5';
            } else {
                btnNextBg.style.opacity = '1';
                btnNextText.style.opacity = '1';
            }

            stepIndicator.textContent = '步骤 ' + currentStep + '/' + totalSteps;
        }

        // 更新场景状态
        function updateScene() {
            // 重置所有元素状态
            hide(leftData);
            hide(rightData);
            hide(highlightLeft);
            hide(highlightRight);
            hide(arrows);
            hide(formulaBox1);
            hide(formulaText1);
            hide(formulaText1Full);
            hide(formulaBox2);
            hide(formulaText2);
            hide(formulaText2Full);

            // 根据当前步骤显示相应内容
            if (currentStep >= 1) {
                // 步骤1：显示左表数据
                show(leftData);
            }

            if (currentStep >= 2) {
                // 步骤2：高亮左表分母列，显示公式1
                show(highlightLeft);
                show(formulaBox1);
                show(formulaText1);
                showFull(formulaText1Full);
                formulaText1.textContent = 'a(n,2) =';
            }

            if (currentStep >= 3) {
                // 步骤3：显示右表数据
                show(rightData);
            }

            if (currentStep >= 4) {
                // 步骤4：显示推导箭头，高亮右表分母列
                show(arrows);
                show(highlightRight);
            }

            if (currentStep >= 5) {
                // 步骤5：显示公式2
                show(formulaBox2);
                show(formulaText2);
                showFull(formulaText2Full);
                formulaText2.textContent = 'a(n,3) =';
            }

            updateButtons();
        }

        // 按钮点击事件
        document.getElementById('scene2-btn-prev-bg').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        document.getElementById('scene2-btn-next-bg').addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateScene();
            }
        });

        // 初始化
        updateButtons();
    })();
    </script>
</body>
</html>
