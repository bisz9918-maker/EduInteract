<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>组合体体积计算与参数 a 的求解</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        .scene2-formula {
            font-size: 16px;
            font-family: 'Times New Roman', serif;
        }
        .scene2-value {
            font-size: 14px;
            font-family: 'Courier New', monospace;
        }
        .scene2-highlight {
            fill: #c62828;
            fill-opacity: 0.3;
        }
        .scene2-slider-thumb {
            cursor: pointer;
            fill: #1565c0;
            stroke: #0d47a1;
            stroke-width: 2;
        }
        .scene2-slider-thumb:hover {
            fill: #1976d2;
        }
        .scene2-hint {
            font-size: 14px;
            fill: #2e7d32;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义渐变和滤镜 -->
            <defs>
                <linearGradient id="scene2-gradient-hemisphere" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#1565c0;stop-opacity:0.3" />
                    <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:0.4" />
                </linearGradient>
                <linearGradient id="scene2-gradient-pyramid" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#2e7d32;stop-opacity:0.3" />
                    <stop offset="100%" style="stop-color:#1b5e20;stop-opacity:0.4" />
                </linearGradient>
            </defs>

            <!-- ========== 左侧立体图区域 ========== -->
            <g id="scene2-combine-shape">
                <!-- 半圆锥立体图 (50,80)-(320,320) -->
                <g id="scene2-hemisphere-cone">
                    <!-- 半圆锥底面半圆 -->
                    <ellipse cx="185" cy="300" rx="100" ry="30" fill="url(#scene2-gradient-hemisphere)" stroke="#000000" stroke-width="1.5"/>
                    <path d="M 85 300 L 185 120 L 285 300" fill="none" stroke="#000000" stroke-width="1.5"/>
                    <!-- 半圆锥后半部分轮廓（虚线） -->
                    <ellipse cx="185" cy="300" rx="100" ry="30" fill="none" stroke="#666666" stroke-width="1" stroke-dasharray="5,3"/>
                    <!-- 半圆锥高度标注 -->
                    <line x1="300" y1="120" x2="300" y2="300" stroke="#000000" stroke-width="1" stroke-dasharray="3,3"/>
                    <line x1="295" y1="120" x2="305" y2="120" stroke="#000000" stroke-width="1"/>
                    <line x1="295" y1="300" x2="305" y2="300" stroke="#000000" stroke-width="1"/>
                    <text x="315" y="215" font-size="14" fill="#000000">a</text>
                    <!-- 半圆锥标签 -->
                    <text id="scene2-label-hemisphere" x="185" y="65" font-size="14" fill="#1565c0" font-weight="bold" text-anchor="middle">半圆锥</text>
                </g>

                <!-- 三棱锥立体图 (50,320)-(320,420) -->
                <g id="scene2-triangular-pyramid">
                    <!-- 三棱锥底面三角形 -->
                    <polygon points="85,400 285,400 185,420" fill="url(#scene2-gradient-pyramid)" stroke="#000000" stroke-width="1.5"/>
                    <!-- 三棱锥侧面 -->
                    <path d="M 85 400 L 185 340 L 285 400 L 185 420 L 185 340 Z" fill="none" stroke="#000000" stroke-width="1.5"/>
                    <!-- 三棱锥底边中线 -->
                    <line x1="185" y1="400" x2="185" y2="420" stroke="#000000" stroke-width="1" stroke-dasharray="3,3"/>
                    <!-- 三棱锥高度标注 -->
                    <line x1="300" y1="340" x2="300" y2="400" stroke="#000000" stroke-width="1" stroke-dasharray="3,3"/>
                    <line x1="295" y1="340" x2="305" y2="340" stroke="#000000" stroke-width="1"/>
                    <line x1="295" y1="400" x2="305" y2="400" stroke="#000000" stroke-width="1"/>
                    <text x="315" y="375" font-size="14" fill="#000000">a</text>
                    <!-- 三棱锥标签 -->
                    <text id="scene2-label-triangular" x="185" y="445" font-size="14" fill="#2e7d32" font-weight="bold" text-anchor="middle">三棱锥</text>
                </g>
            </g>

            <!-- ========== 右侧公式面板区域 ========== -->
            <!-- 公式面板背景 -->
            <rect id="scene2-formula-panel" x="360" y="60" width="420" height="340" fill="#ffffff" stroke="#cccccc" stroke-width="1.5" rx="5"/>

            <!-- 体积公式 -->
            <text id="scene2-formula-hemisphere" x="380" y="100" class="scene2-formula" fill="#000000">
                <tspan>V</tspan><tspan baseline-shift="sub" font-size="11">半圆锥</tspan><tspan baseline-shift="0" font-size="16"> = </tspan><tspan font-style="italic">πa</tspan><tspan baseline-shift="0" font-size="16">/6</tspan>
            </text>

            <text id="scene2-formula-triangular" x="380" y="160" class="scene2-formula" fill="#000000">
                <tspan>V</tspan><tspan baseline-shift="sub" font-size="11">三棱锥</tspan><tspan baseline-shift="0" font-size="16"> = </tspan><tspan font-style="italic">a</tspan><tspan baseline-shift="0" font-size="16">/3</tspan>
            </text>

            <text id="scene2-formula-total" x="380" y="220" class="scene2-formula" fill="#000000">
                <tspan>V</tspan><tspan baseline-shift="sub" font-size="11">总</tspan><tspan baseline-shift="0" font-size="16"> = </tspan><tspan font-style="italic">a</tspan><tspan baseline-shift="0" font-size="16">(</tspan><tspan font-style="italic">π</tspan><tspan baseline-shift="0" font-size="16">+2)/6</tspan>
            </text>

            <!-- 体积数值显示区背景 -->
            <rect id="scene2-value-panel" x="380" y="280" width="380" height="80" fill="#f5f5f5" stroke="#dddddd" stroke-width="1" rx="5"/>

            <!-- 体积数值显示 -->
            <text id="scene2-value-hemisphere" x="400" y="305" class="scene2-value" fill="#1565c0">
                V<tspan baseline-shift="sub" font-size="10">半圆锥</tspan><tspan baseline-shift="0" font-size="14"> = </tspan>
            </text>

            <text id="scene2-value-triangular" x="400" y="335" class="scene2-value" fill="#2e7d32">
                V<tspan baseline-shift="sub" font-size="10">三棱锥</tspan><tspan baseline-shift="0" font-size="14"> = </tspan>
            </text>

            <text id="scene2-value-total" x="600" y="325" class="scene2-value" fill="#000000" font-weight="bold" text-anchor="middle">
                V<tspan baseline-shift="sub" font-size="10">总</tspan><tspan baseline-shift="0" font-size="14"> = </tspan>
            </text>

            <!-- 高亮提示文本（初始隐藏） -->
            <text id="scene2-highlight-hint" x="570" y="380" class="scene2-hint" text-anchor="middle" opacity="0">
                当 a=1 时，V<tspan baseline-shift="sub" font-size="10">总</tspan><tspan baseline-shift="0" font-size="14">=(π+2)/6</tspan>
            </text>

            <!-- ========== 滑块控件区域 ========== -->
            <!-- 滑块轨道 -->
            <line id="scene2-slider-track" x1="360" y1="450" x2="780" y2="450" stroke="#888888" stroke-width="4" stroke-linecap="round"/>

            <!-- 滑块刻度标记 -->
            <line x1="360" y1="445" x2="360" y2="455" stroke="#888888" stroke-width="2"/>
            <line x1="570" y1="445" x2="570" y2="455" stroke="#888888" stroke-width="2"/>
            <line x1="780" y1="445" x2="780" y2="455" stroke="#888888" stroke-width="2"/>

            <!-- 滑块最小值标签 -->
            <text x="360" y="475" font-size="12" fill="#666666" text-anchor="middle">0.5</text>

            <!-- 滑块最大值标签 -->
            <text x="780" y="475" font-size="12" fill="#666666" text-anchor="middle">2.0</text>

            <!-- 滑块按钮（可拖拽） -->
            <circle id="scene2-slider-thumb" class="scene2-slider-thumb" cx="570" cy="450" r="12"/>

            <!-- 当前 a 值显示 -->
            <text id="scene2-slider-value" x="570" y="425" font-size="16" fill="#1565c0" font-weight="bold" text-anchor="middle">
                a = 1.00
            </text>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 2: 组合体体积计算与参数 a 的求解

        // ===== 状态管理 =====
        let currentA = 1.0;  // 当前 a 值，默认 1.0
        const minA = 0.5;
        const maxA = 2.0;

        // ===== DOM 元素引用 =====
        const sliderThumb = document.getElementById('scene2-slider-thumb');
        const sliderValue = document.getElementById('scene2-slider-value');
        const valueHemisphere = document.getElementById('scene2-value-hemisphere');
        const valueTriangular = document.getElementById('scene2-value-triangular');
        const valueTotal = document.getElementById('scene2-value-total');
        const highlightHint = document.getElementById('scene2-highlight-hint');
        const valuePanel = document.getElementById('scene2-value-panel');

        // ===== 坐标映射函数 =====
        // a 值 -> 滑块 x 坐标: x = 360 + (a - 0.5) * 280
        function aToX(a) {
            return 360 + (a - minA) * (420 / (maxA - minA));
        }

        // 滑块 x 坐标 -> a 值: a = 0.5 + (x - 360) / 280
        function xToA(x) {
            const a = minA + (x - 360) * (maxA - minA) / 420;
            return Math.max(minA, Math.min(maxA, a));
        }

        // ===== 体积计算函数 =====
        function calculateVolumes(a) {
            const vHemisphere = Math.PI * a / 6;      // V_半圆锥 = πa/6
            const vTriangular = a / 3;                 // V_三棱锥 = a/3
            const vTotal = a * (Math.PI + 2) / 6;      // V_总 = a(π+2)/6
            return { vHemisphere, vTriangular, vTotal };
        }

        // ===== 格式化数值显示 =====
        function formatValue(val, decimals = 3) {
            return val.toFixed(decimals);
        }

        // ===== 更新显示 =====
        function updateDisplay() {
            const volumes = calculateVolumes(currentA);

            // 更新滑块位置
            const x = aToX(currentA);
            sliderThumb.setAttribute('cx', x);
            sliderValue.setAttribute('x', x);

            // 更新 a 值显示
            sliderValue.textContent = 'a = ' + formatValue(currentA, 2);

            // 更新体积数值显示
            valueHemisphere.textContent = 'V半圆锥 = π×' + formatValue(currentA, 2) + '/6 ≈ ' + formatValue(volumes.vHemisphere);
            valueTriangular.textContent = 'V三棱锥 = ' + formatValue(currentA, 2) + '/3 ≈ ' + formatValue(volumes.vTriangular);
            valueTotal.textContent = 'V总 = ' + formatValue(volumes.vTotal);

            // 检查是否需要高亮（a=1 时，容差±0.02）
            if (Math.abs(currentA - 1.0) < 0.02) {
                highlightHint.setAttribute('opacity', '1');
                // 添加高亮背景
                valueTotal.setAttribute('fill', '#c62828');
            } else {
                highlightHint.setAttribute('opacity', '0');
                valueTotal.setAttribute('fill', '#000000');
            }
        }

        // ===== 拖拽事件处理 =====
        let isDragging = false;

        function startDrag(e) {
            isDragging = true;
            e.preventDefault();
        }

        function doDrag(e) {
            if (!isDragging) return;

            const svg = document.getElementById('scene2-svg');
            const rect = svg.getBoundingClientRect();

            let clientX;
            if (e.touches) {
                clientX = e.touches[0].clientX;
            } else {
                clientX = e.clientX;
            }

            const x = clientX - rect.left;
            currentA = xToA(x);
            updateDisplay();
        }

        function endDrag() {
            isDragging = false;
        }

        // ===== 事件绑定 =====
        sliderThumb.addEventListener('mousedown', startDrag);
        sliderThumb.addEventListener('touchstart', startDrag, { passive: false });

        document.addEventListener('mousemove', doDrag);
        document.addEventListener('touchmove', doDrag, { passive: false });

        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchend', endDrag);

        // ===== 初始化显示 =====
        updateDisplay();

    })();
    </script>
</body>
</html>
