<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>椭圆轨迹演示 - 四面体 ABCD</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        .scene2-ellipse {
            fill: none;
            stroke: #888888;
            stroke-width: 2;
            stroke-dasharray: 5, 5;
        }
        .scene2-focus {
            fill: #000000;
        }
        .scene2-point-b {
            fill: #1565c0;
            cursor: pointer;
        }
        .scene2-point-c {
            fill: #c62828;
            cursor: pointer;
        }
        .scene2-line {
            stroke: #333333;
            stroke-width: 2;
            fill: none;
        }
        .scene2-line-ad {
            stroke: #666666;
            stroke-width: 2;
            stroke-dasharray: 5, 5;
            fill: none;
        }
        .scene2-label {
            font-size: 14px;
            font-family: 'Segoe UI', sans-serif;
        }
        .scene2-dist-label {
            font-size: 13px;
            fill: #2e7d32;
            font-family: 'Segoe UI', sans-serif;
        }
        .scene2-slider-track {
            stroke: #cccccc;
            stroke-width: 4;
        }
        .scene2-slider-fill {
            stroke: #1976d2;
            stroke-width: 4;
        }
        .scene2-slider-handle {
            fill: #1976d2;
            cursor: pointer;
        }
        .scene2-title {
            font-size: 14px;
            font-weight: bold;
            fill: #333333;
            text-anchor: middle;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 标题 -->
            <text id="scene2-title" x="400" y="22" class="scene2-title">椭圆轨迹演示</text>
            
            <!-- 椭圆轨迹 (缩小尺寸) -->
            <ellipse id="scene2-ellipse" class="scene2-ellipse" cx="400" cy="250" rx="200" ry="100"/>
            
            <!-- 焦点 A 和 D -->
            <circle id="scene2-focus-a" class="scene2-focus" cx="220" cy="250" r="6"/>
            <circle id="scene2-focus-d" class="scene2-focus" cx="580" cy="250" r="6"/>
            
            <!-- 线段 AD（长轴） -->
            <line id="scene2-line-ad" class="scene2-line-ad" x1="220" y1="250" x2="580" y2="250"/>
            
            <!-- 点 B 和 C -->
            <circle id="scene2-point-b" class="scene2-point-b" cx="400" cy="150" r="8"/>
            <circle id="scene2-point-c" class="scene2-point-c" cx="400" cy="350" r="8"/>
            
            <!-- 线段 AB, BD, AC, CD -->
            <line id="scene2-line-ab" class="scene2-line" x1="220" y1="250" x2="400" y2="150"/>
            <line id="scene2-line-bd" class="scene2-line" x1="400" y1="150" x2="580" y2="250"/>
            <line id="scene2-line-ac" class="scene2-line" x1="220" y1="250" x2="400" y2="350"/>
            <line id="scene2-line-cd" class="scene2-line" x1="400" y1="350" x2="580" y2="250"/>
            
            <!-- 标签 (放在椭圆外侧) -->
            <text id="scene2-label-a" x="195" y="270" class="scene2-label">A</text>
            <text id="scene2-label-d" x="595" y="270" class="scene2-label">D</text>
            <text id="scene2-label-b" x="415" y="140" class="scene2-label">B</text>
            <text id="scene2-label-c" x="415" y="375" class="scene2-label">C</text>
            
            <!-- 距离标注 (远离椭圆) -->
            <text id="scene2-dist-b" x="400" y="45" class="scene2-dist-label" text-anchor="middle">AB+BD=2a</text>
            <text id="scene2-dist-c" x="400" y="410" class="scene2-dist-label" text-anchor="middle">AC+CD=2a</text>
            <text id="scene2-label-ad" x="400" y="285" class="scene2-label" text-anchor="middle">AD=2c</text>
            
            <!-- 滑块区域 (上移) -->
            <text id="scene2-slider-label" x="400" y="445" class="scene2-label" text-anchor="middle">a = 1.5c</text>
            <line id="scene2-slider-track" class="scene2-slider-track" x1="170" y1="470" x2="630" y2="470"/>
            <line id="scene2-slider-fill" class="scene2-slider-fill" x1="170" y1="470" x2="350" y2="470"/>
            <circle id="scene2-slider-handle" class="scene2-slider-handle" cx="350" cy="470" r="10"/>
            <text x="170" y="490" class="scene2-label" font-size="11">c</text>
            <text x="630" y="490" class="scene2-label" font-size="11" text-anchor="end">3c</text>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 2: 椭圆轨迹演示
        
        // 常量定义
        const ELLIPSE_CENTER_X = 400;
        const ELLIPSE_CENTER_Y = 250;
        const ELLIPSE_RX = 200;
        const ELLIPSE_RY = 100;
        const FOCUS_A_X = 220;
        const FOCUS_A_Y = 250;
        const FOCUS_D_X = 580;
        const FOCUS_D_Y = 250;
        const C_VALUE = 180; // AD = 2c = 360, so c = 180
        
        // 状态变量
        let aRatio = 1.5; // a = 1.5c 初始值
        let angleB = -Math.PI / 2; // B 点初始角度（顶部）
        let angleC = Math.PI / 2;  // C 点初始角度（底部，与 B 对称）
        
        // 拖拽状态
        let isDraggingB = false;
        let isDraggingC = false;
        let isDraggingSlider = false;
        
        // DOM 元素
        const pointB = document.getElementById('scene2-point-b');
        const pointC = document.getElementById('scene2-point-c');
        const lineAB = document.getElementById('scene2-line-ab');
        const lineBD = document.getElementById('scene2-line-bd');
        const lineAC = document.getElementById('scene2-line-ac');
        const lineCD = document.getElementById('scene2-line-cd');
        const labelB = document.getElementById('scene2-label-b');
        const labelC = document.getElementById('scene2-label-c');
        const distB = document.getElementById('scene2-dist-b');
        const distC = document.getElementById('scene2-dist-c');
        const sliderHandle = document.getElementById('scene2-slider-handle');
        const sliderFill = document.getElementById('scene2-slider-fill');
        const sliderLabel = document.getElementById('scene2-slider-label');
        const ellipse = document.getElementById('scene2-ellipse');
        
        // 计算点 B 的坐标（基于椭圆参数方程）
        function getPointOnEllipse(angle, rx, ry) {
            return {
                x: ELLIPSE_CENTER_X + rx * Math.cos(angle),
                y: ELLIPSE_CENTER_Y + ry * Math.sin(angle)
            };
        }
        
        // 计算两点间距离
        function distance(x1, y1, x2, y2) {
            return Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
        }
        
        // 更新 B 点位置
        function updatePointB() {
            const pos = getPointOnEllipse(angleB, ELLIPSE_RX, ELLIPSE_RY);
            pointB.setAttribute('cx', pos.x);
            pointB.setAttribute('cy', pos.y);
            
            // 更新线段
            lineAB.setAttribute('x2', pos.x);
            lineAB.setAttribute('y2', pos.y);
            lineBD.setAttribute('x1', pos.x);
            lineBD.setAttribute('y1', pos.y);
            
            // 更新标签位置（向右上方偏移）
            labelB.setAttribute('x', pos.x + 18);
            labelB.setAttribute('y', pos.y - 12);
            
            // 计算并更新距离标注
            const ab = distance(FOCUS_A_X, FOCUS_A_Y, pos.x, pos.y);
            const bd = distance(pos.x, pos.y, FOCUS_D_X, FOCUS_D_Y);
            const sum = ab + bd;
            distB.textContent = 'AB+BD=' + (sum / C_VALUE).toFixed(2) + 'c';
        }
        
        // 更新 C 点位置（与 B 对称）
        function updatePointC() {
            const pos = getPointOnEllipse(angleC, ELLIPSE_RX, ELLIPSE_RY);
            pointC.setAttribute('cx', pos.x);
            pointC.setAttribute('cy', pos.y);
            
            // 更新线段
            lineAC.setAttribute('x2', pos.x);
            lineAC.setAttribute('y2', pos.y);
            lineCD.setAttribute('x1', pos.x);
            lineCD.setAttribute('y1', pos.y);
            
            // 更新标签位置（向右下方偏移）
            labelC.setAttribute('x', pos.x + 18);
            labelC.setAttribute('y', pos.y + 22);
            
            // 计算并更新距离标注
            const ac = distance(FOCUS_A_X, FOCUS_A_Y, pos.x, pos.y);
            const cd = distance(pos.x, pos.y, FOCUS_D_X, FOCUS_D_Y);
            const sum = ac + cd;
            distC.textContent = 'AC+CD=' + (sum / C_VALUE).toFixed(2) + 'c';
        }
        
        // 更新椭圆大小（基于 a 值）
        function updateEllipse() {
            // a = aRatio * c, 椭圆定义：2a = AB + BD
            // 椭圆焦距 2c = AD = 360, 所以 c = 180
            // 椭圆短轴 b = sqrt(a^2 - c^2)
            const a = aRatio * C_VALUE;
            const c = C_VALUE; // 半焦距
            const b = Math.sqrt(Math.max(0, a * a - c * c));
            
            // 更新椭圆尺寸
            ellipse.setAttribute('rx', a);
            ellipse.setAttribute('ry', b);
            
            // 更新滑块标签
            sliderLabel.textContent = 'a = ' + aRatio.toFixed(2) + 'c';
            
            // 重新计算 B 和 C 的位置
            updatePointB();
            updatePointC();
        }
        
        // 更新滑块位置
        function updateSlider() {
            const minX = 170;
            const maxX = 630;
            const range = maxX - minX;
            const ratio = (aRatio - 1.0) / 2.0; // a 范围 [1.0c, 3.0c]
            const handleX = minX + ratio * range;
            
            sliderHandle.setAttribute('cx', handleX);
            sliderFill.setAttribute('x2', handleX);
        }
        
        // 滑块拖拽处理
        function handleSliderMouseDown(e) {
            isDraggingSlider = true;
            e.preventDefault();
        }
        
        function handleSliderMouseMove(e) {
            if (!isDraggingSlider) return;
            
            const svgRect = document.getElementById('scene2-svg').getBoundingClientRect();
            let x = e.clientX - svgRect.left;
            
            const minX = 170;
            const maxX = 630;
            x = Math.max(minX, Math.min(maxX, x));
            
            const ratio = (x - minX) / (maxX - minX);
            aRatio = 1.0 + ratio * 2.0; // a 范围 [1.0c, 3.0c]
            
            updateSlider();
            updateEllipse();
        }
        
        function handleSliderMouseUp() {
            isDraggingSlider = false;
        }
        
        // B 点拖拽处理
        function handlePointBMouseDown(e) {
            isDraggingB = true;
            e.preventDefault();
            e.stopPropagation();
        }
        
        function handlePointCMouseDown(e) {
            isDraggingC = true;
            e.preventDefault();
            e.stopPropagation();
        }
        
        function handlePointMouseMove(e) {
            if (!isDraggingB && !isDraggingC) return;
            
            const svgRect = document.getElementById('scene2-svg').getBoundingClientRect();
            const x = e.clientX - svgRect.left;
            const y = e.clientY - svgRect.top;
            
            // 计算相对于椭圆中心的角度
            const dx = x - ELLIPSE_CENTER_X;
            const dy = y - ELLIPSE_CENTER_Y;
            let angle = Math.atan2(dy / ELLIPSE_RY, dx / ELLIPSE_RX);
            
            if (isDraggingB) {
                angleB = angle;
                // C 点与 B 点对称
                angleC = Math.PI - angleB;
                if (angleC > Math.PI) angleC -= 2 * Math.PI;
                updatePointC();
                updatePointB();
            } else if (isDraggingC) {
                angleC = angle;
                // B 点与 C 点对称
                angleB = Math.PI - angleC;
                if (angleB > Math.PI) angleB -= 2 * Math.PI;
                updatePointB();
                updatePointC();
            }
        }
        
        function handlePointMouseUp() {
            isDraggingB = false;
            isDraggingC = false;
        }
        
        // 事件监听
        sliderHandle.addEventListener('mousedown', handleSliderMouseDown);
        document.addEventListener('mousemove', handleSliderMouseMove);
        document.addEventListener('mouseup', handleSliderMouseUp);
        
        pointB.addEventListener('mousedown', handlePointBMouseDown);
        pointC.addEventListener('mousedown', handlePointCMouseDown);
        document.addEventListener('mousemove', handlePointMouseMove);
        document.addEventListener('mouseup', handlePointMouseUp);
        
        // 触摸事件支持
        sliderHandle.addEventListener('touchstart', (e) => {
            isDraggingSlider = true;
            e.preventDefault();
        });
        
        document.addEventListener('touchmove', (e) => {
            if (isDraggingSlider) {
                const touch = e.touches[0];
                const svgRect = document.getElementById('scene2-svg').getBoundingClientRect();
                let x = touch.clientX - svgRect.left;
                
                const minX = 170;
                const maxX = 630;
                x = Math.max(minX, Math.min(maxX, x));
                
                const ratio = (x - minX) / (maxX - minX);
                aRatio = 1.0 + ratio * 2.0;
                
                updateSlider();
                updateEllipse();
            } else if (isDraggingB || isDraggingC) {
                const touch = e.touches[0];
                const svgRect = document.getElementById('scene2-svg').getBoundingClientRect();
                const x = touch.clientX - svgRect.left;
                const y = touch.clientY - svgRect.top;
                
                const dx = x - ELLIPSE_CENTER_X;
                const dy = y - ELLIPSE_CENTER_Y;
                let angle = Math.atan2(dy / ELLIPSE_RY, dx / ELLIPSE_RX);
                
                if (isDraggingB) {
                    angleB = angle;
                    angleC = Math.PI - angleB;
                    if (angleC > Math.PI) angleC -= 2 * Math.PI;
                    updatePointC();
                    updatePointB();
                } else if (isDraggingC) {
                    angleC = angle;
                    angleB = Math.PI - angleC;
                    if (angleB > Math.PI) angleB -= 2 * Math.PI;
                    updatePointB();
                    updatePointC();
                }
            }
            e.preventDefault();
        });
        
        document.addEventListener('touchend', () => {
            isDraggingSlider = false;
            isDraggingB = false;
            isDraggingC = false;
        });
        
        // 初始化
        updateSlider();
        updateEllipse();
        
    })();
    </script>
</body>
</html>
