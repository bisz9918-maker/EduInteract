<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四面体体积最大化 - Scene 3</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene3-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene3-svg {
            width: 800px;
            height: 500px;
        }
        .scene3-edge {
            stroke: #000000;
            stroke-width: 2;
            fill: none;
        }
        .scene3-edge-highlight {
            stroke: #c62828;
            stroke-width: 4;
        }
        .scene3-vertex {
            fill: #000000;
        }
        .scene3-label {
            font-size: 14px;
            fill: #000000;
        }
        .scene3-annotation {
            font-size: 13px;
            fill: #333333;
        }
        .scene3-triangle-highlight {
            fill: #2e7d32;
            opacity: 0.3;
            display: none;
        }
        .scene3-formula-box {
            display: none;
        }
        .scene3-formula-bg {
            fill: #e3f2fd;
            stroke: #1565c0;
            stroke-width: 2;
        }
        .scene3-formula-text {
            font-size: 14px;
            fill: #1565c0;
        }
        .scene3-condition-box {
            display: none;
        }
        .scene3-condition-bg {
            fill: #ffebee;
            stroke: #c62828;
            stroke-width: 2;
        }
        .scene3-condition-text {
            font-size: 14px;
            fill: #c62828;
            font-weight: bold;
        }
        .scene3-result-box {
            display: none;
        }
        .scene3-result-bg {
            fill: #e8f5e9;
            stroke: #2e7d32;
            stroke-width: 2;
        }
        .scene3-result-text {
            font-size: 14px;
            fill: #2e7d32;
        }
        #scene3-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        .scene3-btn {
            width: 80px;
            height: 30px;
            background: #1565c0;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .scene3-btn:hover {
            background: #0d47a1;
        }
        .scene3-btn:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
        }
        #scene3-step-indicator {
            font-size: 14px;
            color: #333333;
            min-width: 80px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="scene3-container">
        <!-- SVG 图示区：固定 800×500px -->
        <svg id="scene3-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 四面体棱 -->
            <!-- AD: (120,140)-(120,380) 竖直棱 -->
            <line id="scene3-edge-ad" class="scene3-edge" x1="120" y1="140" x2="120" y2="380"/>
            <!-- AB: (120,380)-(300,350) 底面前棱 -->
            <line id="scene3-edge-ab" class="scene3-edge" x1="120" y1="380" x2="300" y2="350"/>
            <!-- AC: (120,380)-(400,280) 底面后棱 (虚线，遮挡) -->
            <line id="scene3-edge-ac" class="scene3-edge" x1="120" y1="380" x2="400" y2="280" stroke-dasharray="5,5"/>
            <!-- BC: (300,350)-(400,280) 右侧棱 -->
            <line id="scene3-edge-bc" class="scene3-edge" x1="300" y1="350" x2="400" y2="280"/>
            <!-- BD: (300,350)-(120,140) 后侧棱 -->
            <line id="scene3-edge-bd" class="scene3-edge" x1="300" y1="350" x2="120" y2="140"/>
            <!-- CD: (400,280)-(120,140) 右后棱 -->
            <line id="scene3-edge-cd" class="scene3-edge" x1="400" y1="280" x2="120" y2="140"/>

            <!-- △ABC 高亮区域 -->
            <polygon id="scene3-triangle-abc" class="scene3-triangle-highlight" points="120,380 300,350 400,280"/>

            <!-- 顶点 -->
            <circle id="scene3-vertex-a" class="scene3-vertex" cx="120" cy="380" r="4"/>
            <circle id="scene3-vertex-b" class="scene3-vertex" cx="300" cy="350" r="4"/>
            <circle id="scene3-vertex-c" class="scene3-vertex" cx="400" cy="280" r="4"/>
            <circle id="scene3-vertex-d" class="scene3-vertex" cx="120" cy="140" r="4"/>

            <!-- 顶点标签 - 调整位置避免与线段重叠 -->
            <!-- A: 左下偏移，远离 AB 和 AC 线 -->
            <text id="scene3-label-a" class="scene3-label" x="105" y="400">A</text>
            <!-- B: 右下偏移，远离 BC 和 BD 线，向下移动更多 -->
            <text id="scene3-label-b" class="scene3-label" x="315" y="395">B</text>
            <!-- C: 右上偏移，远离 BC 和 CD 线 -->
            <text id="scene3-label-c" class="scene3-label" x="415" y="270">C</text>
            <!-- D: 左上偏移，远离 AD 和 BD 线 -->
            <text id="scene3-label-d" class="scene3-label" x="105" y="125">D</text>

            <!-- 棱长标注 - 调整位置避免与线段重叠 -->
            <!-- BC=2: 放在 BC 线段右侧更远位置 -->
            <text id="scene3-annotation-bc" class="scene3-annotation" x="400" y="335">BC=2</text>
            <!-- AD=2c: 放在 AD 线段左侧更远位置 -->
            <text id="scene3-annotation-ad" class="scene3-annotation" x="55" y="265">AD=2c</text>

            <!-- 体积公式框（蓝色边框）- 增加高度，文字放在框内上方 -->
            <g id="scene3-formula-box" class="scene3-formula-box">
                <rect class="scene3-formula-bg" x="480" y="100" width="280" height="80"/>
                <!-- 文字放在框内，y 坐标调整到框的上半部分 -->
                <text class="scene3-formula-text" x="620" y="135" text-anchor="middle">V = ⅓ · S△ABC · h</text>
            </g>

            <!-- 最大值条件框（红色边框）- 增加高度 -->
            <g id="scene3-condition-box" class="scene3-condition-box">
                <rect class="scene3-condition-bg" x="480" y="200" width="280" height="80"/>
                <!-- 文字放在框内上半部分 -->
                <text class="scene3-condition-text" x="620" y="235" text-anchor="middle">BC ⊥ AD 且位于短轴</text>
                <text class="scene3-condition-text" x="620" y="260" text-anchor="middle" font-size="12px">体积最大</text>
            </g>

            <!-- 最终结果框（绿色边框）- 增加高度 -->
            <g id="scene3-result-box" class="scene3-result-box">
                <rect class="scene3-result-bg" x="480" y="300" width="280" height="80"/>
                <!-- 文字放在框内上半部分 -->
                <text class="scene3-result-text" x="620" y="335" text-anchor="middle">V_max = (2/3)c√(a²-c²-1)</text>
            </g>
        </svg>

        <!-- 控件栏叠在 SVG 底部 -->
        <div id="scene3-controls">
            <button id="scene3-prev-btn" class="scene3-btn" disabled>◀ 上一步</button>
            <span id="scene3-step-indicator">步骤 0/3</span>
            <button id="scene3-next-btn" class="scene3-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 3 实现：四面体体积最大化

        // 状态变量
        let currentStep = 0;
        const totalSteps = 3;

        // DOM 元素引用
        const prevBtn = document.getElementById('scene3-prev-btn');
        const nextBtn = document.getElementById('scene3-next-btn');
        const stepIndicator = document.getElementById('scene3-step-indicator');

        // 可显示/隐藏的元素
        const triangleAbc = document.getElementById('scene3-triangle-abc');
        const formulaBox = document.getElementById('scene3-formula-box');
        const conditionBox = document.getElementById('scene3-condition-box');
        const resultBox = document.getElementById('scene3-result-box');
        const edgeAd = document.getElementById('scene3-edge-ad');
        const edgeBc = document.getElementById('scene3-edge-bc');

        // 工具函数：显示元素
        function show(el) {
            el.style.display = 'block';
            el.style.opacity = '1';
        }

        // 工具函数：隐藏元素
        function hide(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        // 更新界面状态
        function updateState() {
            // 更新按钮状态
            prevBtn.disabled = currentStep === 0;
            nextBtn.disabled = currentStep === totalSteps;
            stepIndicator.textContent = `步骤 ${currentStep}/${totalSteps}`;

            // 根据步骤显示/隐藏元素
            // 步骤 0: 显示体积公式框
            // 步骤 1: 显示△ABC 高亮
            // 步骤 2: 显示最大值条件框，高亮 AD 和 BC
            // 步骤 3: 显示最终结果框

            // △ABC 高亮：步骤 1 及以后显示
            if (currentStep >= 1) {
                show(triangleAbc);
            } else {
                hide(triangleAbc);
            }

            // 体积公式框：始终显示（步骤 0-3）
            show(formulaBox);

            // 最大值条件框：步骤 2 及以后显示
            if (currentStep >= 2) {
                show(conditionBox);
                // 高亮 AD 棱（加粗）
                edgeAd.classList.add('scene3-edge-highlight');
                // 高亮 BC 棱（红色）
                edgeBc.classList.add('scene3-edge-highlight');
            } else {
                hide(conditionBox);
                edgeAd.classList.remove('scene3-edge-highlight');
                edgeBc.classList.remove('scene3-edge-highlight');
            }

            // 最终结果框：步骤 3 显示
            if (currentStep >= 3) {
                show(resultBox);
            } else {
                hide(resultBox);
            }
        }

        // 上一步按钮点击
        prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateState();
            }
        });

        // 下一步按钮点击
        nextBtn.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateState();
            }
        });

        // 初始化状态
        updateState();

    })();
    </script>
</body>
</html>
