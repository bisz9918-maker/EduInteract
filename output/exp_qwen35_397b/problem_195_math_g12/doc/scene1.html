<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆的切线与割线关系 - 切割线定理</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        .scene1-line {
            stroke-width: 3;
            stroke-linecap: round;
            transition: stroke 300ms ease;
        }
        .scene1-point {
            fill: #000000;
        }
        .scene1-label {
            font-size: 14px;
            fill: #000000;
        }
        .scene1-formula-box {
            fill: #ffffff;
            stroke: #000000;
            stroke-width: 2;
        }
        .scene1-formula-text {
            font-size: 16px;
            fill: #000000;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }
        #scene1-btn-prev, #scene1-btn-next {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            background: #1565c0;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            transition: background 200ms ease;
        }
        #scene1-btn-prev:hover, #scene1-btn-next:hover {
            background: #0d47a1;
        }
        #scene1-btn-prev:disabled, #scene1-btn-next:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #424242;
            min-width: 80px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 圆 O -->
            <circle id="scene1-circle-o" cx="520" cy="260" r="90" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 直径 AC (红色) -->
            <line id="scene1-line-ac" x1="520" y1="350" x2="520" y2="170" stroke="#c62828" stroke-width="3" stroke-linecap="round"/>
            
            <!-- 切线 PA (初始黑色，步骤 1 变蓝) -->
            <line id="scene1-line-pa" class="scene1-line" x1="280" y1="350" x2="520" y2="350" stroke="#000000"/>
            
            <!-- 割线 PCB (初始黑色，步骤 1 变绿) -->
            <line id="scene1-line-pcb" class="scene1-line" x1="280" y1="350" x2="520" y2="170" stroke="#000000"/>
            
            <!-- 点 P -->
            <circle id="scene1-point-p" class="scene1-point" cx="280" cy="350" r="4"/>
            
            <!-- 点 A -->
            <circle id="scene1-point-a" class="scene1-point" cx="520" cy="350" r="4"/>
            
            <!-- 点 C -->
            <circle id="scene1-point-c" class="scene1-point" cx="520" cy="170" r="4"/>
            
            <!-- 点 O -->
            <circle id="scene1-point-o" class="scene1-point" cx="520" cy="260" r="4"/>
            
            <!-- 点 B -->
            <circle id="scene1-point-b" class="scene1-point" cx="385" cy="265" r="4"/>
            
            <!-- 点标签 - 调整位置避免与图形重叠 -->
            <text id="scene1-label-p" class="scene1-label" x="265" y="370">P</text>
            <text id="scene1-label-a" class="scene1-label" x="535" y="370">A</text>
            <text id="scene1-label-c" class="scene1-label" x="535" y="145">C</text>
            <text id="scene1-label-o" class="scene1-label" x="625" y="265">O</text>
            <text id="scene1-label-b" class="scene1-label" x="380" y="155">B</text>
            
            <!-- 长度标签 - 调整位置避免与线段重叠 -->
            <text id="scene1-label-pa-2" class="scene1-label" x="400" y="385">PA=2</text>
            <text id="scene1-label-pb-1" class="scene1-label" x="250" y="240">PB=1</text>
            <text id="scene1-label-pc-4" class="scene1-label" x="575" y="145" style="opacity: 0; display: none;">PC=4</text>
            <text id="scene1-label-bc-3" class="scene1-label" x="625" y="145" style="opacity: 0; display: none;">BC=3</text>
            
            <!-- 公式框 (步骤 2 开始显示) - 增加高度，文字位置调整 -->
            <g id="scene1-formula-group" style="opacity: 0; display: none;">
                <rect id="scene1-formula-box" class="scene1-formula-box" x="50" y="50" width="300" height="80" rx="5"/>
                <text id="scene1-formula-text" class="scene1-formula-text" x="200" y="85" text-anchor="middle">切割线定理：PA² = PB × PC</text>
            </g>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/5</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现 - 圆的切线与割线关系
        
        // 状态变量
        let currentStep = 0;
        const totalSteps = 5;
        
        // 获取 DOM 元素
        const linePA = document.getElementById('scene1-line-pa');
        const linePCB = document.getElementById('scene1-line-pcb');
        const formulaGroup = document.getElementById('scene1-formula-group');
        const formulaText = document.getElementById('scene1-formula-text');
        const labelPC4 = document.getElementById('scene1-label-pc-4');
        const labelBC3 = document.getElementById('scene1-label-bc-3');
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        
        // 工具函数：显示元素
        function show(el) {
            el.style.display = '';
            el.style.opacity = '1';
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }
        
        // 更新步骤显示
        function updateStep() {
            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;
            
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);
            
            // 步骤 0：初始状态
            if (currentStep === 0) {
                linePA.setAttribute('stroke', '#000000');
                linePCB.setAttribute('stroke', '#000000');
                hide(formulaGroup);
                hide(labelPC4);
                hide(labelBC3);
            }
            // 步骤 1：高亮切线和割线
            else if (currentStep === 1) {
                linePA.setAttribute('stroke', '#1565c0');
                linePCB.setAttribute('stroke', '#2e7d32');
                hide(formulaGroup);
                hide(labelPC4);
                hide(labelBC3);
            }
            // 步骤 2：显示切割线定理公式
            else if (currentStep === 2) {
                linePA.setAttribute('stroke', '#1565c0');
                linePCB.setAttribute('stroke', '#2e7d32');
                show(formulaGroup);
                formulaText.textContent = '切割线定理：PA² = PB × PC';
                hide(labelPC4);
                hide(labelBC3);
            }
            // 步骤 3：显示计算过程
            else if (currentStep === 3) {
                linePA.setAttribute('stroke', '#1565c0');
                linePCB.setAttribute('stroke', '#2e7d32');
                show(formulaGroup);
                formulaText.textContent = '2² = 1 × PC → PC = 4';
                show(labelPC4);
                show(labelBC3);
            }
            // 步骤 4：显示结论
            else if (currentStep === 4) {
                linePA.setAttribute('stroke', '#1565c0');
                linePCB.setAttribute('stroke', '#2e7d32');
                show(formulaGroup);
                formulaText.textContent = '结论：PC = 4，BC = 3';
                show(labelPC4);
                show(labelBC3);
            }
        }
        
        // 前进一步
        function stepForward() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStep();
            }
        }
        
        // 后退一步
        function stepBack() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        }
        
        // 绑定事件
        btnPrev.addEventListener('click', stepBack);
        btnNext.addEventListener('click', stepForward);
        
        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
