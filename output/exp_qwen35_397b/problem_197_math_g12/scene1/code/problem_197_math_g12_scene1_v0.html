<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三角形沿中位线折叠演示</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        #scene1-btn-prev, #scene1-btn-next {
            width: 80px;
            height: 30px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #scene1-btn-prev {
            background: #e0e0e0;
            color: #666;
        }
        #scene1-btn-prev:disabled {
            background: #f0f0f0;
            color: #ccc;
            cursor: not-allowed;
        }
        #scene1-btn-prev:not(:disabled) {
            background: #1565c0;
            color: white;
        }
        #scene1-btn-next {
            background: #1565c0;
            color: white;
        }
        #scene1-btn-next:disabled {
            background: #e0e0e0;
            color: #ccc;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #333;
            min-width: 100px;
            text-align: center;
        }
        /* 元素显隐控制 */
        .scene1-hidden {
            display: none !important;
            opacity: 0 !important;
        }
        .scene1-visible {
            display: block !important;
            opacity: 1 !important;
        }
        /* SVG 元素显隐 */
        .scene1-svg-hidden {
            display: none;
            opacity: 0;
        }
        .scene1-svg-visible {
            display: block;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 原三角形 ABC 边 -->
            <!-- AB: (180,380)-(680,260) -->
            <line id="scene1-line-ab" x1="180" y1="380" x2="680" y2="260" stroke="#000000" stroke-width="2" fill="none"/>
            <!-- BC: (180,380)-(320,140) -->
            <line id="scene1-line-bc" x1="180" y1="380" x2="320" y2="140" stroke="#000000" stroke-width="2" fill="none"/>
            <!-- AC: (320,140)-(680,260) -->
            <line id="scene1-line-ac" x1="320" y1="140" x2="680" y2="260" stroke="#000000" stroke-width="2" fill="none"/>
            
            <!-- 中位线 DE: (430,320)-(500,200) -->
            <line id="scene1-line-de" x1="430" y1="320" x2="500" y2="200" stroke="#1565c0" stroke-width="2" fill="none"/>
            
            <!-- 折叠后三角形 A'DE 边（步骤 2 显示） -->
            <!-- A'D: (570,380)-(430,320) -->
            <line id="scene1-line-aprime-d" x1="570" y1="380" x2="430" y2="320" stroke="#2e7d32" stroke-width="2" fill="none" class="scene1-svg-hidden"/>
            <!-- A'E: (570,380)-(500,200) -->
            <line id="scene1-line-aprime-e" x1="570" y1="380" x2="500" y2="200" stroke="#2e7d32" stroke-width="2" fill="none" class="scene1-svg-hidden"/>
            
            <!-- 点 A 运动轨迹圆弧（步骤 1 显示） -->
            <!-- 圆心约 (480,300), 半径约 150, 从 A 到 A' -->
            <path id="scene1-arc-trajectory" d="M 680 260 A 150 150 0 0 1 570 380" stroke="#888888" stroke-width="1" fill="none" stroke-dasharray="5,5" class="scene1-svg-hidden"/>
            
            <!-- 等长标记（步骤 2 显示） -->
            <!-- AD 标记: (405,305)-(415,315) -->
            <line id="scene1-mark-ad" x1="405" y1="305" x2="415" y2="315" stroke="#c62828" stroke-width="2" class="scene1-svg-hidden"/>
            <!-- A'D 标记: (495,335)-(505,345) -->
            <line id="scene1-mark-aprime-d" x1="495" y1="335" x2="505" y2="345" stroke="#c62828" stroke-width="2" class="scene1-svg-hidden"/>
            <!-- DB 标记: (305,355)-(315,365) -->
            <line id="scene1-mark-db" x1="305" y1="355" x2="315" y2="365" stroke="#c62828" stroke-width="2" class="scene1-svg-hidden"/>
            
            <!-- 角度高亮弧（步骤 3 显示） -->
            <!-- ∠ADE 高亮弧: 圆心 D(430,320), 半径 25 -->
            <path id="scene1-angle-ade" d="M 455 320 A 25 25 0 0 0 445 305" stroke="#ff9800" stroke-width="2" fill="none" class="scene1-svg-hidden"/>
            <!-- ∠A'DE 高亮弧: 圆心 D(430,320), 半径 25 -->
            <path id="scene1-angle-aprime-de" d="M 445 305 A 25 25 0 0 0 430 295" stroke="#ff9800" stroke-width="2" fill="none" class="scene1-svg-hidden"/>
            
            <!-- 顶点 -->
            <circle id="scene1-point-a" cx="680" cy="260" r="4" fill="#000000"/>
            <circle id="scene1-point-b" cx="180" cy="380" r="4" fill="#000000"/>
            <circle id="scene1-point-c" cx="320" cy="140" r="4" fill="#000000"/>
            <circle id="scene1-point-d" cx="430" cy="320" r="4" fill="#1565c0"/>
            <circle id="scene1-point-e" cx="500" cy="200" r="4" fill="#1565c0"/>
            <circle id="scene1-point-aprime" cx="570" cy="380" r="4" fill="#2e7d32" class="scene1-svg-hidden"/>
            
            <!-- 标签 -->
            <text id="scene1-label-a" x="695" y="250" font-size="14px" fill="#000000">A</text>
            <text id="scene1-label-b" x="160" y="395" font-size="14px" fill="#000000">B</text>
            <text id="scene1-label-c" x="320" y="120" font-size="14px" fill="#000000">C</text>
            <text id="scene1-label-d" x="415" y="335" font-size="14px" fill="#1565c0">D</text>
            <text id="scene1-label-e" x="515" y="190" font-size="14px" fill="#1565c0">E</text>
            <text id="scene1-label-aprime" x="585" y="395" font-size="14px" fill="#2e7d32" class="scene1-svg-hidden">A'</text>
            
            <!-- 角度标注 -->
            <text id="scene1-angle-a" x="640" y="230" font-size="12px" fill="#000000">∠A=26°</text>
            <text id="scene1-angle-c" x="340" y="150" font-size="12px" fill="#000000">∠C=120°</text>
            
            <!-- 角度关系提示（步骤 3 显示） -->
            <text id="scene1-angle-hint" x="400" y="100" font-size="14px" fill="#ff9800" class="scene1-svg-hidden">∠ADE = ∠A'DE</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/4</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1: 三角形沿中位线折叠演示
        // 布局坐标表参考：
        // A(680,260), B(180,380), C(320,140), D(430,320), E(500,200), A'(570,380)
        
        let currentStep = 0;
        const totalSteps = 4;
        
        // 获取 DOM 元素
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        
        // 需要步骤控制的元素
        const trajectoryArc = document.getElementById('scene1-arc-trajectory');
        const triAprimeD = document.getElementById('scene1-line-aprime-d');
        const triAprimeE = document.getElementById('scene1-line-aprime-e');
        const pointAprime = document.getElementById('scene1-point-aprime');
        const labelAprime = document.getElementById('scene1-label-aprime');
        const markAD = document.getElementById('scene1-mark-ad');
        const markAprimeD = document.getElementById('scene1-mark-aprime-d');
        const markDB = document.getElementById('scene1-mark-db');
        const angleADE = document.getElementById('scene1-angle-ade');
        const angleAprimeDE = document.getElementById('scene1-angle-aprime-de');
        const angleHint = document.getElementById('scene1-angle-hint');
        
        // 显示/隐藏函数
        function showElement(el) {
            if (el) {
                el.classList.remove('scene1-svg-hidden');
                el.classList.add('scene1-svg-visible');
            }
        }
        
        function hideElement(el) {
            if (el) {
                el.classList.remove('scene1-svg-visible');
                el.classList.add('scene1-svg-hidden');
            }
        }
        
        // 更新场景状态
        function updateScene() {
            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;
            
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);
            
            // 根据步骤显示/隐藏元素
            if (currentStep === 0) {
                // 初始状态：只显示原三角形和中位线
                hideElement(trajectoryArc);
                hideElement(triAprimeD);
                hideElement(triAprimeE);
                hideElement(pointAprime);
                hideElement(labelAprime);
                hideElement(markAD);
                hideElement(markAprimeD);
                hideElement(markDB);
                hideElement(angleADE);
                hideElement(angleAprimeDE);
                hideElement(angleHint);
            } else if (currentStep === 1) {
                // 步骤 1：显示运动轨迹
                showElement(trajectoryArc);
                hideElement(triAprimeD);
                hideElement(triAprimeE);
                hideElement(pointAprime);
                hideElement(labelAprime);
                hideElement(markAD);
                hideElement(markAprimeD);
                hideElement(markDB);
                hideElement(angleADE);
                hideElement(angleAprimeDE);
                hideElement(angleHint);
            } else if (currentStep === 2) {
                // 步骤 2：显示折叠后三角形和等长标记
                showElement(trajectoryArc);
                showElement(triAprimeD);
                showElement(triAprimeE);
                showElement(pointAprime);
                showElement(labelAprime);
                showElement(markAD);
                showElement(markAprimeD);
                showElement(markDB);
                hideElement(angleADE);
                hideElement(angleAprimeDE);
                hideElement(angleHint);
            } else if (currentStep === 3) {
                // 步骤 3：显示角度高亮
                showElement(trajectoryArc);
                showElement(triAprimeD);
                showElement(triAprimeE);
                showElement(pointAprime);
                showElement(labelAprime);
                showElement(markAD);
                showElement(markAprimeD);
                showElement(markDB);
                showElement(angleADE);
                showElement(angleAprimeDE);
                showElement(angleHint);
            }
        }
        
        // 按钮事件绑定
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateScene();
            }
        });
        
        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
