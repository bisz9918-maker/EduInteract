<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三角形折叠问题 - 角度关系推导</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        .scene2-fade-in {
            opacity: 0;
            transition: opacity 0.3s ease-out;
        }
        .scene2-visible {
            opacity: 1;
        }
        .scene2-hidden {
            opacity: 0;
            display: none;
        }
        #scene2-btn-prev, #scene2-btn-next {
            padding: 8px 20px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #scene2-btn-prev {
            background-color: #e0e0e0;
            color: #333;
        }
        #scene2-btn-prev:hover {
            background-color: #c0c0c0;
        }
        #scene2-btn-next {
            background-color: #1565c0;
            color: white;
        }
        #scene2-btn-next:hover {
            background-color: #0d47a1;
        }
        #scene2-btn-prev:disabled, #scene2-btn-next:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene2-step-indicator {
            font-size: 14px;
            color: #666;
            min-width: 80px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene2-arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <path d="M0,0 L10,5 L0,10 Z" fill="#888888"/>
                </marker>
            </defs>

            <!-- ===== 基础图形 ===== -->
            <!-- △ABC 轮廓（虚线灰色） -->
            <path id="scene2-tri-abc" class="scene2-fade-in scene2-visible"
                  d="M 120 350 L 550 100 L 450 350 Z"
                  fill="none" stroke="#cccccc" stroke-width="1" stroke-dasharray="5,5"/>

            <!-- 线段 DB -->
            <line id="scene2-seg-db" class="scene2-fade-in scene2-visible"
                  x1="335" y1="225" x2="120" y2="350"
                  stroke="#000000" stroke-width="2"/>

            <!-- 线段 EC -->
            <line id="scene2-seg-ec" class="scene2-fade-in scene2-visible"
                  x1="500" y1="225" x2="450" y2="350"
                  stroke="#000000" stroke-width="2"/>

            <!-- 线段 BC -->
            <line id="scene2-seg-bc" class="scene2-fade-in scene2-visible"
                  x1="120" y1="350" x2="450" y2="350"
                  stroke="#000000" stroke-width="2"/>

            <!-- 中位线 DE -->
            <line id="scene2-seg-de" class="scene2-fade-in scene2-visible"
                  x1="335" y1="225" x2="500" y2="225"
                  stroke="#000000" stroke-width="2"/>

            <!-- △A'DE（折叠后三角形） -->
            <path id="scene2-tri-aprime-de" class="scene2-fade-in scene2-visible"
                  d="M 335 225 L 620 380 L 500 225 Z"
                  fill="none" stroke="#000000" stroke-width="2"/>

            <!-- ===== 平行标记 ===== -->
            <!-- DE 上方箭头 -->
            <path id="scene2-parallel-mark1" class="scene2-fade-in scene2-hidden"
                  d="M 410 215 L 417 210 L 424 215"
                  fill="none" stroke="#888888" stroke-width="1.5"/>

            <!-- BC 下方箭头 -->
            <path id="scene2-parallel-mark2" class="scene2-fade-in scene2-hidden"
                  d="M 278 360 L 285 365 L 292 360"
                  fill="none" stroke="#888888" stroke-width="1.5"/>

            <!-- DE∥BC 标签 -->
            <text id="scene2-parallel-label" class="scene2-fade-in scene2-hidden"
                  x="420" y="195" font-size="12" fill="#888888">DE∥BC</text>

            <!-- ===== 角度弧线 ===== -->
            <!-- ∠A 弧线 (半径 25) -->
            <path id="scene2-arc-a" class="scene2-fade-in scene2-visible"
                  d="M 528.3 87.5 A 25 25 0 0 1 535.5 114.5"
                  fill="none" stroke="#1565c0" stroke-width="1.5"/>

            <!-- ∠B 弧线 (半径 25) -->
            <path id="scene2-arc-b" class="scene2-fade-in scene2-hidden"
                  d="M 141.7 362.5 A 25 25 0 0 0 144.5 337.5"
                  fill="none" stroke="#1565c0" stroke-width="1.5"/>

            <!-- ∠C 弧线 (半径 25) -->
            <path id="scene2-arc-c" class="scene2-fade-in scene2-visible"
                  d="M 433.5 337.5 A 25 25 0 0 1 425 330"
                  fill="none" stroke="#1565c0" stroke-width="1.5"/>

            <!-- ∠ADE 弧线 (半径 20) -->
            <path id="scene2-arc-ade" class="scene2-fade-in scene2-hidden"
                  d="M 352.3 235 A 20 20 0 0 0 355 225"
                  fill="none" stroke="#2e7d32" stroke-width="1.5"/>

            <!-- ∠A'DE 弧线 (半径 28) -->
            <path id="scene2-arc-aprime-de" class="scene2-fade-in scene2-hidden"
                  d="M 363 225 A 28 28 0 0 0 358 241"
                  fill="none" stroke="#2e7d32" stroke-width="1.5"/>

            <!-- ∠A'DB 弧线 (半径 35, 加粗) -->
            <path id="scene2-arc-aprime-db" class="scene2-fade-in scene2-hidden"
                  d="M 365.3 207.5 A 35 35 0 1 0 317.5 260"
                  fill="none" stroke="#c62828" stroke-width="2.5"/>

            <!-- ===== 顶点标签 ===== -->
            <text id="scene2-label-a" class="scene2-fade-in scene2-visible"
                  x="565" y="90" font-size="14" fill="#000000">A</text>
            <text id="scene2-label-b" class="scene2-fade-in scene2-visible"
                  x="95" y="365" font-size="14" fill="#000000">B</text>
            <text id="scene2-label-c" class="scene2-fade-in scene2-visible"
                  x="465" y="355" font-size="14" fill="#000000">C</text>
            <text id="scene2-label-d" class="scene2-fade-in scene2-visible"
                  x="315" y="210" font-size="14" fill="#000000">D</text>
            <text id="scene2-label-e" class="scene2-fade-in scene2-visible"
                  x="515" y="210" font-size="14" fill="#000000">E</text>
            <text id="scene2-label-aprime" class="scene2-fade-in scene2-visible"
                  x="640" y="395" font-size="14" fill="#000000">A'</text>

            <!-- ===== 角度数值标签 ===== -->
            <!-- ∠A=26° -->
            <text id="scene2-angle-a" class="scene2-fade-in scene2-visible"
                  x="550" y="135" font-size="14" fill="#1565c0">26°</text>

            <!-- ∠B=34° -->
            <text id="scene2-angle-b" class="scene2-fade-in scene2-hidden"
                  x="145" y="325" font-size="14" fill="#1565c0">34°</text>

            <!-- ∠C=120° -->
            <text id="scene2-angle-c" class="scene2-fade-in scene2-visible"
                  x="410" y="310" font-size="14" fill="#1565c0">120°</text>

            <!-- ∠ADE=34° -->
            <text id="scene2-angle-ade" class="scene2-fade-in scene2-hidden"
                  x="365" y="250" font-size="14" fill="#2e7d32">34°</text>

            <!-- ∠A'DE=34° -->
            <text id="scene2-angle-aprime-de" class="scene2-fade-in scene2-hidden"
                  x="455" y="265" font-size="14" fill="#2e7d32">34°</text>

            <!-- ∠A'DB=112° -->
            <text id="scene2-angle-aprime-db" class="scene2-fade-in scene2-hidden"
                  x="275" y="285" font-size="16" fill="#c62828" font-weight="bold">112°</text>

            <!-- ===== 答案框 ===== -->
            <g id="scene2-answer-box" class="scene2-fade-in scene2-hidden">
                <rect x="600" y="415" width="180" height="65"
                      fill="#ffffff" stroke="#c62828" stroke-width="2"/>
                <text x="690" y="440" font-size="16" fill="#c62828" font-weight="bold" text-anchor="middle">∠A'DB = 112°</text>
                <text x="690" y="462" font-size="11" fill="#666666" text-anchor="middle">180° - 34° - 34° = 112°</text>
            </g>

            <!-- ===== 控件栏（SVG 内底部） ===== -->
            <g id="scene2-controls">
                <rect x="0" y="450" width="800" height="50" fill="#f5f5f5" opacity="0.8"/>
                <text id="scene2-step-indicator" x="400" y="475" font-size="14" fill="#666" text-anchor="middle">步骤 1/5</text>
            </g>
        </svg>

        <!-- HTML 按钮控件（叠在 SVG 底部） -->
        <div style="position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10;">
            <button id="scene2-btn-prev">◀ 上一步</button>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2: 三角形折叠问题 - 角度关系推导

        // 状态定义：每个步骤显示的元素 ID 列表
        // 步骤 0: 基础图形 + 已知角度 ∠A=26°, ∠C=120°
        const state0 = [
            'scene2-tri-abc', 'scene2-seg-de', 'scene2-tri-aprime-de',
            'scene2-seg-db', 'scene2-seg-ec', 'scene2-seg-bc',
            'scene2-label-a', 'scene2-label-b', 'scene2-label-c',
            'scene2-label-d', 'scene2-label-e', 'scene2-label-aprime',
            'scene2-arc-a', 'scene2-arc-c',
            'scene2-angle-a', 'scene2-angle-c'
        ];
        // 步骤 1: + ∠B=34°
        const state1 = state0.concat(['scene2-arc-b', 'scene2-angle-b']);
        // 步骤 2: + 平行标记 + ∠ADE=34°
        const state2 = state1.concat(['scene2-parallel-mark1', 'scene2-parallel-mark2', 'scene2-parallel-label', 'scene2-arc-ade', 'scene2-angle-ade']);
        // 步骤 3: + ∠A'DE=34°
        const state3 = state2.concat(['scene2-arc-aprime-de', 'scene2-angle-aprime-de']);
        // 步骤 4: + ∠A'DB=112° + 答案框
        const state4 = state3.concat(['scene2-arc-aprime-db', 'scene2-angle-aprime-db', 'scene2-answer-box']);

        const states = [state0, state1, state2, state3, state4];

        let currentStep = 0;

        // 工具函数：显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene2-hidden');
                el.classList.add('scene2-visible');
                el.offsetHeight;
            }
        }

        // 工具函数：隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene2-visible');
                el.classList.add('scene2-hidden');
            }
        }

        // 更新场景显示
        function updateScene() {
            const currentState = states[currentStep];
            const allElements = [];
            for (let i = 0; i < states.length; i++) {
                for (let j = 0; j < states[i].length; j++) {
                    if (allElements.indexOf(states[i][j]) < 0) {
                        allElements.push(states[i][j]);
                    }
                }
            }

            for (let i = 0; i < allElements.length; i++) {
                if (currentState.indexOf(allElements[i]) >= 0) {
                    showElement(allElements[i]);
                } else {
                    hideElement(allElements[i]);
                }
            }

            const indicator = document.getElementById('scene2-step-indicator');
            if (indicator) {
                indicator.textContent = '步骤 ' + (currentStep + 1) + '/5';
            }

            const prevBtn = document.getElementById('scene2-btn-prev');
            const nextBtn = document.getElementById('scene2-btn-next');
            if (prevBtn) {
                prevBtn.disabled = (currentStep === 0);
            }
            if (nextBtn) {
                nextBtn.disabled = (currentStep === states.length - 1);
            }
        }

        // 事件处理：上一步
        document.getElementById('scene2-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        // 事件处理：下一步
        document.getElementById('scene2-btn-next').addEventListener('click', function() {
            if (currentStep < states.length - 1) {
                currentStep++;
                updateScene();
            }
        });

        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
