<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四边形 PADB 面积计算</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-svg { width: 800px; height: 500px; }
        .scene2-control-btn {
            position: absolute;
            bottom: 10px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #333;
            border-radius: 4px;
            background: #f0f0f0;
        }
        #scene2-btn-prev { left: 280px; }
        #scene2-btn-next { left: 440px; }
        .scene2-hidden { display: none; opacity: 0; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <!-- 圆 O -->
            <circle id="scene2-circle-o" cx="360" cy="240" r="50" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 四边形 PADB 填充（初始显示） -->
            <polygon id="scene2-quad-padb" points="40,240 290,320 410,240 290,160" fill="#1565c0" fill-opacity="0.2" stroke="none"/>
            
            <!-- △PAD 填充（步骤 2 显示） -->
            <polygon id="scene2-tri-pad" points="40,240 290,320 410,240" fill="#2e7d32" fill-opacity="0.2" stroke="none" class="scene2-hidden"/>
            
            <!-- 线段 -->
            <line id="scene2-line-pa" x1="40" y1="240" x2="290" y2="320" stroke="#000000" stroke-width="2" fill="none"/>
            <line id="scene2-line-pb" x1="40" y1="240" x2="290" y2="160" stroke="#000000" stroke-width="2" fill="none"/>
            <line id="scene2-line-ad" x1="290" y1="320" x2="410" y2="240" stroke="#000000" stroke-width="2" fill="none"/>
            <line id="scene2-line-bd" x1="290" y1="160" x2="410" y2="240" stroke="#000000" stroke-width="2" fill="none"/>
            
            <!-- 对称轴 PO（步骤 1 显示） -->
            <line id="scene2-line-po" x1="40" y1="240" x2="360" y2="240" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" fill="none" class="scene2-hidden"/>
            
            <!-- 半径 OA（步骤 4 显示） -->
            <line id="scene2-line-oa" x1="360" y1="240" x2="290" y2="320" stroke="#888888" stroke-width="1" stroke-dasharray="3,3" fill="none" class="scene2-hidden"/>
            
            <!-- 点标记 -->
            <circle id="scene2-point-p" cx="40" cy="240" r="3" fill="#000000"/>
            <circle id="scene2-point-o" cx="360" cy="240" r="3" fill="#000000"/>
            <circle id="scene2-point-c" cx="310" cy="240" r="3" fill="#000000"/>
            <circle id="scene2-point-d" cx="410" cy="240" r="3" fill="#000000"/>
            <circle id="scene2-point-a" cx="290" cy="320" r="3" fill="#000000"/>
            <circle id="scene2-point-b" cx="290" cy="160" r="3" fill="#000000"/>
            
            <!-- 标签 - 全部移到图形外部，远离图形至少 15px -->
            <text id="scene2-label-p" x="20" y="235" font-size="14" fill="#000000">P</text>
            <text id="scene2-label-o" x="375" y="265" font-size="14" fill="#000000">O</text>
            <text id="scene2-label-c" x="310" y="225" font-size="14" fill="#000000">C</text>
            <text id="scene2-label-d" x="415" y="225" font-size="14" fill="#000000">D</text>
            <text id="scene2-label-a" x="295" y="345" font-size="14" fill="#000000">A</text>
            <text id="scene2-label-b" x="295" y="145" font-size="14" fill="#000000">B</text>
            
            <!-- 标注 - 全部移到四边形外部下方，远离线条，PD=2 和 PO=1.5 分开避免重叠 -->
            <text id="scene2-anno-pc1" x="175" y="280" font-size="13" fill="#000000">PC=1</text>
            <text id="scene2-anno-cd1" x="360" y="320" font-size="13" fill="#000000">CD=1</text>
            <text id="scene2-anno-pa-root2" x="130" y="350" font-size="13" fill="#000000" class="scene2-hidden">PA=√2</text>
            <text id="scene2-anno-pd2" x="250" y="205" font-size="13" fill="#000000" class="scene2-hidden">PD=2</text>
            <text id="scene2-anno-oa05" x="340" y="355" font-size="13" fill="#000000" class="scene2-hidden">OA=0.5</text>
            <text id="scene2-anno-po15" x="180" y="205" font-size="13" fill="#000000" class="scene2-hidden">PO=1.5</text>
            
            <!-- 公式框 - 加大尺寸，文字行间距加大到 40px -->
            <rect id="scene2-formula-box" x="460" y="70" width="320" height="300" fill="#f5f5f5" stroke="#000000" stroke-width="1"/>
            <text id="scene2-formula-title" x="475" y="110" font-size="14" fill="#000000" font-weight="bold">四边形 PADB 面积计算</text>
            <text id="scene2-formula-line1" x="475" y="160" font-size="13" fill="#000000" class="scene2-hidden"></text>
            <text id="scene2-formula-line2" x="475" y="205" font-size="13" fill="#000000" class="scene2-hidden"></text>
            <text id="scene2-formula-line3" x="475" y="250" font-size="13" fill="#000000" class="scene2-hidden"></text>
            <text id="scene2-formula-line4" x="475" y="295" font-size="13" fill="#000000" class="scene2-hidden"></text>
            <text id="scene2-formula-line5" x="475" y="340" font-size="13" fill="#000000" class="scene2-hidden"></text>
            
            <!-- 答案框 -->
            <rect id="scene2-answer-box" x="480" y="250" width="280" height="80" fill="#e8f5e9" stroke="#000000" stroke-width="2" class="scene2-hidden"/>
            <text id="scene2-answer-text" x="620" y="295" font-size="14" fill="#000000" text-anchor="middle" class="scene2-hidden">S = 2 × S_△PAD = √3/2</text>
            
            <!-- 步骤指示器 - y=475 确保不被裁切 -->
            <text id="scene2-step-indicator" x="400" y="475" font-size="14" fill="#000000" text-anchor="middle">步骤 0/6</text>
        </svg>
        
        <button id="scene2-btn-prev" class="scene2-control-btn">◀ 上一步</button>
        <button id="scene2-btn-next" class="scene2-control-btn">下一步 ▶</button>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现：四边形 PADB 面积计算
        // 布局坐标表（最终调整版）：
        // 圆 O: 圆心 (360,240), r=50
        // P(40,240), O(360,240), C(310,240), D(410,240), A(290,320), B(290,160)
        // 所有标签已移到图形外部，远离线条
        // PD=2 和 PO=1.5 已分开避免重叠
        
        let currentStep = 0;
        const totalSteps = 6;
        
        // 元素引用
        const elements = {
            quad: document.getElementById('scene2-quad-padb'),
            tri: document.getElementById('scene2-tri-pad'),
            linePO: document.getElementById('scene2-line-po'),
            lineOA: document.getElementById('scene2-line-oa'),
            annoPARoot2: document.getElementById('scene2-anno-pa-root2'),
            annoPD2: document.getElementById('scene2-anno-pd2'),
            annoOA05: document.getElementById('scene2-anno-oa05'),
            annoPO15: document.getElementById('scene2-anno-po15'),
            formulaTitle: document.getElementById('scene2-formula-title'),
            formulaLine1: document.getElementById('scene2-formula-line1'),
            formulaLine2: document.getElementById('scene2-formula-line2'),
            formulaLine3: document.getElementById('scene2-formula-line3'),
            formulaLine4: document.getElementById('scene2-formula-line4'),
            formulaLine5: document.getElementById('scene2-formula-line5'),
            answerBox: document.getElementById('scene2-answer-box'),
            answerText: document.getElementById('scene2-answer-text'),
            stepIndicator: document.getElementById('scene2-step-indicator'),
            btnPrev: document.getElementById('scene2-btn-prev'),
            btnNext: document.getElementById('scene2-btn-next')
        };
        
        // 显示/隐藏工具函数
        function show(el) {
            if (el) {
                el.classList.remove('scene2-hidden');
                el.style.display = '';
                el.style.opacity = '1';
            }
        }
        
        function hide(el) {
            if (el) {
                el.classList.add('scene2-hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        // 设置公式文本
        function setFormula(lineEl, text) {
            if (lineEl) {
                lineEl.textContent = text;
            }
        }
        
        // 更新步骤
        function updateStep() {
            // 更新步骤指示器
            elements.stepIndicator.textContent = '步骤 ' + currentStep + '/' + totalSteps;
            
            // 更新按钮状态
            elements.btnPrev.disabled = currentStep === 0;
            elements.btnNext.disabled = currentStep === totalSteps;
            elements.btnPrev.style.opacity = currentStep === 0 ? '0.5' : '1';
            elements.btnNext.style.opacity = currentStep === totalSteps ? '0.5' : '1';
            
            // 重置所有动态元素
            hide(elements.tri);
            hide(elements.linePO);
            hide(elements.lineOA);
            hide(elements.annoPARoot2);
            hide(elements.annoPD2);
            hide(elements.annoOA05);
            hide(elements.annoPO15);
            hide(elements.answerBox);
            hide(elements.answerText);
            
            // 清空公式行
            setFormula(elements.formulaLine1, '');
            setFormula(elements.formulaLine2, '');
            setFormula(elements.formulaLine3, '');
            setFormula(elements.formulaLine4, '');
            setFormula(elements.formulaLine5, '');
            
            // 根据当前步骤显示对应元素
            switch(currentStep) {
                case 0:
                    show(elements.quad);
                    elements.formulaTitle.textContent = '四边形 PADB 面积计算';
                    break;
                    
                case 1:
                    show(elements.quad);
                    show(elements.linePO);
                    elements.formulaTitle.textContent = '四边形 PADB 面积计算';
                    setFormula(elements.formulaLine1, 'S_PADB = 2 × S_△PAD');
                    show(elements.formulaLine1);
                    break;
                    
                case 2:
                    show(elements.tri);
                    show(elements.linePO);
                    elements.formulaTitle.textContent = '四边形 PADB 面积计算';
                    setFormula(elements.formulaLine1, 'S_PADB = 2 × S_△PAD');
                    setFormula(elements.formulaLine2, '思路：先求 S_△PAD');
                    show(elements.formulaLine1);
                    show(elements.formulaLine2);
                    break;
                    
                case 3:
                    show(elements.tri);
                    show(elements.linePO);
                    show(elements.annoPARoot2);
                    show(elements.annoPD2);
                    show(elements.annoOA05);
                    show(elements.annoPO15);
                    elements.formulaTitle.textContent = '四边形 PADB 面积计算';
                    setFormula(elements.formulaLine1, '已知：PC=CD=1');
                    setFormula(elements.formulaLine2, '→ 半径 r=0.5, PO=1.5');
                    show(elements.formulaLine1);
                    show(elements.formulaLine2);
                    break;
                    
                case 4:
                    show(elements.tri);
                    show(elements.linePO);
                    show(elements.lineOA);
                    show(elements.annoPARoot2);
                    show(elements.annoPD2);
                    show(elements.annoOA05);
                    show(elements.annoPO15);
                    elements.formulaTitle.textContent = '四边形 PADB 面积计算';
                    setFormula(elements.formulaLine1, '△POA 为直角三角形');
                    setFormula(elements.formulaLine2, 'PA² = PO² - OA²');
                    setFormula(elements.formulaLine3, '= 1.5² - 0.5² = 2');
                    setFormula(elements.formulaLine4, '→ PA = √2');
                    show(elements.formulaLine1);
                    show(elements.formulaLine2);
                    show(elements.formulaLine3);
                    show(elements.formulaLine4);
                    break;
                    
                case 5:
                    show(elements.tri);
                    show(elements.linePO);
                    show(elements.lineOA);
                    show(elements.annoPARoot2);
                    show(elements.annoPD2);
                    show(elements.annoOA05);
                    show(elements.annoPO15);
                    elements.formulaTitle.textContent = '四边形 PADB 面积计算';
                    setFormula(elements.formulaLine1, 'S_△PAD = ½ × PA × AD × sin(∠PAD)');
                    setFormula(elements.formulaLine2, '或用坐标法/三角函数法');
                    setFormula(elements.formulaLine3, 'S_△PAD = √3/4');
                    show(elements.formulaLine1);
                    show(elements.formulaLine2);
                    show(elements.formulaLine3);
                    break;
                    
                case 6:
                    show(elements.tri);
                    show(elements.linePO);
                    show(elements.lineOA);
                    show(elements.annoPARoot2);
                    show(elements.annoPD2);
                    show(elements.annoOA05);
                    show(elements.annoPO15);
                    show(elements.answerBox);
                    show(elements.answerText);
                    elements.formulaTitle.textContent = '四边形 PADB 面积计算';
                    setFormula(elements.formulaLine1, 'S = 2 × S_△PAD');
                    setFormula(elements.formulaLine2, '= 2 × (√3/4)');
                    setFormula(elements.formulaLine3, '= √3/2');
                    show(elements.formulaLine1);
                    show(elements.formulaLine2);
                    show(elements.formulaLine3);
                    break;
            }
        }
        
        // 按钮事件绑定
        elements.btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });
        
        elements.btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateStep();
            }
        });
        
        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
