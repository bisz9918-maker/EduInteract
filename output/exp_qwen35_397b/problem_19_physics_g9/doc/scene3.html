<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>两种量程下滑动范围对比</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene3-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene3-svg {
            width: 800px;
            height: 500px;
        }
        .scene3-btn {
            background: #1565c0;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .scene3-btn:hover {
            background: #0d47a1;
        }
        .scene3-btn.active {
            background: #0d47a1;
            box-shadow: 0 0 0 2px #64b5f6;
        }
        .scene3-range {
            transition: opacity 0.3s ease;
        }
        .scene3-label {
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 背景 -->
            <rect width="800" height="500" fill="#ffffff"/>
            
            <!-- 比值面板背景 -->
            <rect id="scene3-ratio-bg" x="680" y="80" width="110" height="140" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1" rx="4"/>
            
            <!-- 比值面板标题 -->
            <text id="scene3-ratio-title" x="735" y="105" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">最大电流比值</text>
            
            <!-- 0-0.6A 比值 -->
            <text id="scene3-ratio-06a" x="735" y="135" text-anchor="middle" font-size="16" fill="#1565c0" font-weight="bold" opacity="0">0-0.6A: 3:1</text>
            
            <!-- 0-3A 比值 -->
            <text id="scene3-ratio-3a" x="735" y="165" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold" opacity="0">0-3A: 19:1</text>
            
            <!-- 范围说明 -->
            <text id="scene3-range-info-06a" x="735" y="195" text-anchor="middle" font-size="11" fill="#666" opacity="0">范围: 12cm</text>
            <text id="scene3-range-info-3a" x="735" y="215" text-anchor="middle" font-size="11" fill="#666" opacity="0">范围: 21.6cm</text>
            
            <!-- 铅笔芯 AB (黑色粗线段) -->
            <line id="scene3-pencil-ab" x1="150" y1="250" x2="650" y2="250" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
            
            <!-- A 点标记 (竖线) -->
            <line id="scene3-mark-a" x1="150" y1="244" x2="150" y2="256" stroke="#1a1a1a" stroke-width="2"/>
            
            <!-- B 点标记 (竖线) -->
            <line id="scene3-mark-b" x1="650" y1="244" x2="650" y2="256" stroke="#1a1a1a" stroke-width="2"/>
            
            <!-- 刻度线 (13 条，每 2cm 一个，共 24cm) -->
            <!-- 比例尺: 500px / 24cm ≈ 20.83px/cm -->
            <g id="scene3-ticks">
                <line x1="150" y1="250" x2="150" y2="256" stroke="#666" stroke-width="1"/>
                <line x1="191.67" y1="250" x2="191.67" y2="256" stroke="#666" stroke-width="1"/>
                <line x1="233.33" y1="250" x2="233.33" y2="256" stroke="#666" stroke-width="1"/>
                <line x1="275" y1="250" x2="275" y2="256" stroke="#666" stroke-width="1"/>
                <line x1="316.67" y1="250" x2="316.67" y2="256" stroke="#666" stroke-width="1"/>
                <line x1="358.33" y1="250" x2="358.33" y2="256" stroke="#666" stroke-width="1"/>
                <line x1="400" y1="250" x2="400" y2="256" stroke="#666" stroke-width="1"/>
                <line x1="441.67" y1="250" x2="441.67" y2="256" stroke="#666" stroke-width="1"/>
                <line x1="483.33" y1="250" x2="483.33" y2="256" stroke="#666" stroke-width="1"/>
                <line x1="525" y1="250" x2="525" y2="256" stroke="#666" stroke-width="1"/>
                <line x1="566.67" y1="250" x2="566.67" y2="256" stroke="#666" stroke-width="1"/>
                <line x1="608.33" y1="250" x2="608.33" y2="256" stroke="#666" stroke-width="1"/>
                <line x1="650" y1="250" x2="650" y2="256" stroke="#666" stroke-width="1"/>
            </g>
            
            <!-- A 标签 -->
            <text id="scene3-label-a" x="145" y="275" text-anchor="end" class="scene3-label" fill="#1a1a1a">A</text>
            
            <!-- B 标签 -->
            <text id="scene3-label-b" x="655" y="275" text-anchor="start" class="scene3-label" fill="#1a1a1a">B</text>
            
            <!-- 0-0.6A 范围 (蓝色，上方) -->
            <g id="scene3-range-06a-group" class="scene3-range" opacity="0">
                <!-- 蓝色填充矩形 -->
                <rect id="scene3-range-06a" x="275" y="230" width="250" height="15" fill="#1565c0" fill-opacity="0.3" stroke="#1565c0" stroke-width="2"/>
                <!-- c 点标记 (6cm 位置) -->
                <line id="scene3-mark-c" x1="275" y1="238" x2="275" y2="226" stroke="#c62828" stroke-width="2"/>
                <text id="scene3-label-c" x="275" y="218" text-anchor="middle" class="scene3-label" fill="#c62828">c</text>
                <!-- d 点标记 (18cm 位置) -->
                <line id="scene3-mark-d" x1="525" y1="238" x2="525" y2="226" stroke="#c62828" stroke-width="2"/>
                <text id="scene3-label-d" x="525" y="218" text-anchor="middle" class="scene3-label" fill="#c62828">d</text>
            </g>
            
            <!-- 0-3A 范围 (绿色，下方) -->
            <g id="scene3-range-3a-group" class="scene3-range" opacity="0">
                <!-- 绿色填充矩形 -->
                <rect id="scene3-range-3a" x="175" y="255" width="450" height="15" fill="#2e7d32" fill-opacity="0.3" stroke="#2e7d32" stroke-width="2"/>
                <!-- c' 点标记 (1.2cm 位置) -->
                <line id="scene3-mark-cp" x1="175" y1="255" x2="175" y2="267" stroke="#c62828" stroke-width="2"/>
                <text id="scene3-label-cp" x="175" y="285" text-anchor="middle" class="scene3-label" fill="#c62828">c'</text>
                <!-- d' 点标记 (22.8cm 位置) -->
                <line id="scene3-mark-dp" x1="625" y1="255" x2="625" y2="267" stroke="#c62828" stroke-width="2"/>
                <text id="scene3-label-dp" x="625" y="285" text-anchor="middle" class="scene3-label" fill="#c62828">d'</text>
            </g>
            
            <!-- 控件栏 (放在 SVG 内部底部) -->
            <g id="scene3-controls" transform="translate(0, 440)">
                <rect x="190" y="0" width="420" height="45" fill="#f8f9fa" stroke="#e0e0e0" stroke-width="1" rx="4"/>
                
                <!-- 按钮 1: 0-0.6A 量程 -->
                <g id="scene3-btn-06a-group" style="cursor: pointer;">
                    <rect id="scene3-btn-06a-bg" x="200" y="7" width="120" height="32" fill="#1565c0" rx="4"/>
                    <text id="scene3-btn-06a-text" x="260" y="28" text-anchor="middle" fill="white" font-size="13" font-weight="500">0-0.6A 量程</text>
                </g>
                
                <!-- 按钮 2: 0-3A 量程 -->
                <g id="scene3-btn-3a-group" style="cursor: pointer;">
                    <rect id="scene3-btn-3a-bg" x="340" y="7" width="120" height="32" fill="#1565c0" rx="4"/>
                    <text id="scene3-btn-3a-text" x="400" y="28" text-anchor="middle" fill="white" font-size="13" font-weight="500">0-3A 量程</text>
                </g>
                
                <!-- 按钮 3: 对比 -->
                <g id="scene3-btn-compare-group" style="cursor: pointer;">
                    <rect id="scene3-btn-compare-bg" x="480" y="7" width="120" height="32" fill="#1565c0" rx="4"/>
                    <text id="scene3-btn-compare-text" x="540" y="28" text-anchor="middle" fill="white" font-size="13" font-weight="500">对比</text>
                </g>
            </g>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 3: 两种量程下滑动范围对比
        // 布局坐标表参考:
        // | 元素 | 位置/范围 | 备注 |
        // |------|-----------|------|
        // | 铅笔芯 AB | (150,250)-(650,250) | 500px 代表 24cm |
        // | 0-0.6A 范围 | (275,230)-(525,245) | c(6cm) 到 d(18cm) |
        // | 0-3A 范围 | (175,255)-(625,270) | c'(1.2cm) 到 d'(22.8cm) |
        // | 比值面板 | (680,80)-(790,220) | 显示两种比值 |
        
        // 状态变量
        let currentState = 0; // 0=初始, 1=0.6A, 2=3A, 3=对比
        
        // 获取 DOM 元素
        const range06aGroup = document.getElementById('scene3-range-06a-group');
        const range3aGroup = document.getElementById('scene3-range-3a-group');
        const ratio06a = document.getElementById('scene3-ratio-06a');
        const ratio3a = document.getElementById('scene3-ratio-3a');
        const rangeInfo06a = document.getElementById('scene3-range-info-06a');
        const rangeInfo3a = document.getElementById('scene3-range-info-3a');
        
        const btn06aBg = document.getElementById('scene3-btn-06a-bg');
        const btn3aBg = document.getElementById('scene3-btn-3a-bg');
        const btnCompareBg = document.getElementById('scene3-btn-compare-bg');
        
        // 辅助函数：显示元素
        function showElement(el) {
            el.style.opacity = '1';
        }
        
        // 辅助函数：隐藏元素
        function hideElement(el) {
            el.style.opacity = '0';
        }
        
        // 更新按钮高亮状态
        function updateButtons() {
            // 重置所有按钮
            btn06aBg.setAttribute('fill', '#1565c0');
            btn3aBg.setAttribute('fill', '#1565c0');
            btnCompareBg.setAttribute('fill', '#1565c0');
            
            // 高亮当前按钮
            if (currentState === 1) {
                btn06aBg.setAttribute('fill', '#0d47a1');
            } else if (currentState === 2) {
                btn3aBg.setAttribute('fill', '#0d47a1');
            } else if (currentState === 3) {
                btnCompareBg.setAttribute('fill', '#0d47a1');
            }
        }
        
        // 状态 1: 0-0.6A 量程
        function showState1() {
            hideElement(range3aGroup);
            hideElement(ratio3a);
            hideElement(rangeInfo3a);
            
            showElement(range06aGroup);
            showElement(ratio06a);
            showElement(rangeInfo06a);
            
            updateButtons();
        }
        
        // 状态 2: 0-3A 量程
        function showState2() {
            hideElement(range06aGroup);
            hideElement(ratio06a);
            hideElement(rangeInfo06a);
            
            showElement(range3aGroup);
            showElement(ratio3a);
            showElement(rangeInfo3a);
            
            updateButtons();
        }
        
        // 状态 3: 对比
        function showState3() {
            showElement(range06aGroup);
            showElement(range3aGroup);
            showElement(ratio06a);
            showElement(ratio3a);
            showElement(rangeInfo06a);
            showElement(rangeInfo3a);
            
            updateButtons();
        }
        
        // 状态 0: 初始 (隐藏所有范围)
        function showState0() {
            hideElement(range06aGroup);
            hideElement(range3aGroup);
            hideElement(ratio06a);
            hideElement(ratio3a);
            hideElement(rangeInfo06a);
            hideElement(rangeInfo3a);
            
            updateButtons();
        }
        
        // 按钮点击事件
        document.getElementById('scene3-btn-06a-group').addEventListener('click', function() {
            if (currentState === 1) {
                showState0(); // 再次点击取消
                currentState = 0;
            } else {
                currentState = 1;
                showState1();
            }
        });
        
        document.getElementById('scene3-btn-3a-group').addEventListener('click', function() {
            if (currentState === 2) {
                showState0(); // 再次点击取消
                currentState = 0;
            } else {
                currentState = 2;
                showState2();
            }
        });
        
        document.getElementById('scene3-btn-compare-group').addEventListener('click', function() {
            if (currentState === 3) {
                showState0(); // 再次点击取消
                currentState = 0;
            } else {
                currentState = 3;
                showState3();
            }
        });
        
        // 初始状态
        showState0();
    })();
    </script>
</body>
</html>
