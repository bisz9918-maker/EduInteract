<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>带电粒子在电场中的运动轨迹</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 10; }
        #scene1-btn-prev, #scene1-btn-next { padding: 8px 16px; font-size: 14px; cursor: pointer; background: #1976d2; color: white; border: none; border-radius: 4px; }
        #scene1-btn-prev:hover, #scene1-btn-next:hover { background: #1565c0; }
        #scene1-btn-prev:disabled, #scene1-btn-next:disabled { background: #bdbdbd; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #333; min-width: 80px; text-align: center; }
        .scene1-hidden { display: none !important; opacity: 0; }
        .scene1-visible { display: block !important; opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 箭头定义 -->
                <marker id="scene1-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0" />
                </marker>
                <marker id="scene1-arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#2e7d32" />
                </marker>
                <marker id="scene1-arrow-green-reverse" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M9,0 L9,6 L0,3 z" fill="#2e7d32" />
                </marker>
                <marker id="scene1-arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828" />
                </marker>
            </defs>

            <!-- 基础装置（始终显示） -->
            <!-- 金属板 A -->
            <line id="scene1-plate-a" x1="120" y1="200" x2="420" y2="200" stroke="#000000" stroke-width="4" />
            <!-- 金属板 B -->
            <line id="scene1-plate-b" x1="120" y1="300" x2="420" y2="300" stroke="#000000" stroke-width="4" />
            <!-- 中心线 RD -->
            <line id="scene1-center-line" x1="100" y1="250" x2="760" y2="250" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" />
            <!-- 界面 MN -->
            <line id="scene1-mn-line" x1="420" y1="150" x2="420" y2="350" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" />
            <!-- 界面 PS -->
            <line id="scene1-ps-line" x1="760" y1="100" x2="760" y2="400" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" />

            <!-- 固定标签 -->
            <text id="scene1-label-a" x="105" y="185" font-size="16" fill="#000000">A</text>
            <text id="scene1-label-b" x="105" y="315" font-size="16" fill="#000000">B</text>
            <text id="scene1-label-r" x="75" y="235" font-size="14" fill="#000000">R</text>
            <text id="scene1-label-m" x="425" y="135" font-size="14" fill="#000000">M</text>
            <text id="scene1-label-n" x="425" y="365" font-size="14" fill="#000000">N</text>
            <text id="scene1-label-p" x="765" y="85" font-size="14" fill="#000000">P</text>
            <text id="scene1-label-s" x="765" y="415" font-size="14" fill="#000000">S</text>
            <text id="scene1-label-d" x="765" y="270" font-size="14" fill="#000000">D</text>
            <text id="scene1-label-l" x="270" y="330" font-size="14" fill="#000000">L=8cm</text>
            <text id="scene1-label-d-dist" x="90" y="225" font-size="14" fill="#000000">d=8cm</text>
            <text id="scene1-label-12cm" x="590" y="135" font-size="14" fill="#000000">12cm</text>

            <!-- 初速度箭头 -->
            <line id="scene1-velocity-arrow" x1="100" y1="235" x2="160" y2="235" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow-red)" />
            <text id="scene1-label-v0" x="130" y="220" font-size="14" fill="#000000">v₀</text>

            <!-- 步骤 1：电场区域高亮和电场线 -->
            <g id="scene1-efield-group" class="scene1-hidden">
                <!-- 电场区域半透明填充 -->
                <rect id="scene1-efield-bg" x="120" y="200" width="300" height="100" fill="#1565c0" opacity="0.15" />
                <!-- 电场线 1 -->
                <line id="scene1-efield-1" x1="180" y1="210" x2="180" y2="290" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)" />
                <!-- 电场线 2 -->
                <line id="scene1-efield-2" x1="250" y1="210" x2="250" y2="290" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)" />
                <!-- 电场线 3 -->
                <line id="scene1-efield-3" x1="320" y1="210" x2="320" y2="290" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)" />
                <!-- 电场线 4 -->
                <line id="scene1-efield-4" x1="390" y1="210" x2="390" y2="290" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)" />
            </g>

            <!-- 步骤 2：电场中轨迹（抛物线） -->
            <g id="scene1-trajectory-field-group" class="scene1-hidden">
                <!-- 抛物线轨迹：从 R(100,250) 到 MN(420,280) -->
                <!-- 抛物线方程：y = 250 + k*(x-100)², 当 x=420 时 y=280, k = 30/320² ≈ 0.000293 -->
                <path id="scene1-trajectory-field" d="M 100 250 Q 260 265 420 280" stroke="#c62828" stroke-width="2" fill="none" />
                <!-- 起点标记 -->
                <circle id="scene1-start-point" cx="100" cy="250" r="4" fill="#c62828" />
            </g>

            <!-- 步骤 3：无电场区轨迹（直线） -->
            <g id="scene1-trajectory-free-group" class="scene1-hidden">
                <!-- 直线轨迹：从 MN(420,280) 到 PS(760,340) -->
                <line id="scene1-trajectory-free" x1="420" y1="280" x2="760" y2="340" stroke="#c62828" stroke-width="2" />
                <!-- 终点标记 -->
                <circle id="scene1-end-point" cx="760" cy="340" r="4" fill="#c62828" />
            </g>

            <!-- 步骤 4：偏移量标注 -->
            <g id="scene1-offset-group" class="scene1-hidden">
                <!-- y₁ 双箭头：从中心线(425,250) 到轨迹(425,280) -->
                <line id="scene1-y1-arrow" x1="425" y1="250" x2="425" y2="280" stroke="#2e7d32" stroke-width="2" marker-start="url(#scene1-arrow-green-reverse)" marker-end="url(#scene1-arrow-green)" />
                <text id="scene1-label-y1" x="430" y="265" font-size="14" fill="#2e7d32">y₁</text>
                <!-- y₂ 双箭头：从中心线(765,250) 到轨迹(765,340) -->
                <line id="scene1-y2-arrow" x1="765" y1="250" x2="765" y2="340" stroke="#2e7d32" stroke-width="2" marker-start="url(#scene1-arrow-green-reverse)" marker-end="url(#scene1-arrow-green)" />
                <text id="scene1-label-y2" x="770" y="295" font-size="14" fill="#2e7d32">y₂</text>
            </g>

            <!-- 控件栏 -->
            <g id="scene1-controls">
                <rect x="0" y="440" width="800" height="60" fill="none" />
            </g>
        </svg>

        <!-- HTML 控件层叠在 SVG 底部 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/4</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1: 带电粒子在电场中的运动轨迹

        // 状态变量
        let currentStep = 0;
        const totalSteps = 4;

        // DOM 元素引用
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        // 各步骤对应的元素组
        const stepGroups = {
            1: document.getElementById('scene1-efield-group'),
            2: document.getElementById('scene1-trajectory-field-group'),
            3: document.getElementById('scene1-trajectory-free-group'),
            4: document.getElementById('scene1-offset-group')
        };

        // 更新显示状态
        function updateDisplay() {
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep}/${totalSteps}`;

            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;

            // 更新各元素组的可见性
            for (let step = 1; step <= totalSteps; step++) {
                const group = stepGroups[step];
                if (step <= currentStep) {
                    group.classList.remove('scene1-hidden');
                    group.classList.add('scene1-visible');
                } else {
                    group.classList.remove('scene1-visible');
                    group.classList.add('scene1-hidden');
                }
            }
        }

        // 上一步
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });

        // 下一步
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateDisplay();
            }
        });

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
