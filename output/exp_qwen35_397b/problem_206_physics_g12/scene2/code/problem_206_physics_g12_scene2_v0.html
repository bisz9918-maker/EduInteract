<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>两球 v-t 图像 - 揭示碰撞规律</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; }
        #scene2-svg { width: 800px; height: 500px; display: block; background: #ffffff; }
        .scene2-hidden { display: none; }
        .scene2-visible { display: block; }
        svg .scene2-hidden { display: none; }
        svg .scene2-visible { display: block; }
        .scene2-btn { cursor: pointer; }
        .scene2-btn-disabled { opacity: 0.6; cursor: not-allowed; }
        .scene2-btn-text { pointer-events: none; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 坐标轴 -->
            <line id="scene2-axis-v" x1="80" y1="100" x2="80" y2="420" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow-v)"/>
            <line id="scene2-axis-t" x1="80" y1="420" x2="720" y2="420" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow-t)"/>
            
            <!-- 箭头定义 -->
            <defs>
                <marker id="scene2-arrow-v" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
                </marker>
                <marker id="scene2-arrow-t" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
                </marker>
            </defs>
            
            <!-- 轴标签 -->
            <text id="scene2-label-v" x="65" y="90" font-size="16" fill="#000000" class="scene2-visible">v</text>
            <text id="scene2-label-t" x="730" y="430" font-size="16" fill="#000000" class="scene2-visible">t</text>
            <text id="scene2-label-0" x="70" y="435" font-size="14" fill="#000000" class="scene2-visible">0</text>
            
            <!-- 刻度线 -->
            <line id="scene2-tick-t1" x1="240" y1="420" x2="240" y2="428" stroke="#000000" stroke-width="2" class="scene2-hidden"/>
            <line id="scene2-tick-t2" x1="400" y1="420" x2="400" y2="428" stroke="#000000" stroke-width="2" class="scene2-hidden"/>
            <line id="scene2-tick-t3" x1="560" y1="420" x2="560" y2="428" stroke="#000000" stroke-width="2" class="scene2-hidden"/>
            <line id="scene2-tick-v0" x1="72" y1="340" x2="80" y2="340" stroke="#000000" stroke-width="2" class="scene2-hidden"/>
            <line id="scene2-tick-2v0" x1="72" y1="260" x2="80" y2="260" stroke="#000000" stroke-width="2" class="scene2-hidden"/>
            <line id="scene2-tick-3v0" x1="72" y1="180" x2="80" y2="180" stroke="#000000" stroke-width="2" class="scene2-hidden"/>
            
            <!-- 刻度标签 -->
            <text id="scene2-label-t1" x="235" y="445" font-size="16" fill="#000000" class="scene2-hidden">t₁</text>
            <text id="scene2-label-t2" x="395" y="445" font-size="16" fill="#000000" class="scene2-hidden">t₂</text>
            <text id="scene2-label-t3" x="555" y="445" font-size="16" fill="#000000" class="scene2-hidden">t₃</text>
            <text id="scene2-label-v0" x="35" y="335" font-size="14" fill="#000000" class="scene2-hidden">v₀</text>
            <text id="scene2-label-2v0" x="25" y="255" font-size="14" fill="#000000" class="scene2-hidden">2v₀</text>
            <text id="scene2-label-3v0" x="25" y="175" font-size="14" fill="#000000" class="scene2-hidden">3v₀</text>
            
            <!-- A 球 v-t 线（蓝色）- 分段 -->
            <line id="scene2-line-a-seg1" x1="80" y1="420" x2="240" y2="340" stroke="#1565c0" stroke-width="2.5" class="scene2-visible"/>
            <line id="scene2-line-a-seg2" x1="240" y1="420" x2="400" y2="340" stroke="#1565c0" stroke-width="2.5" class="scene2-hidden"/>
            <line id="scene2-line-a-seg3" x1="400" y1="340" x2="560" y2="260" stroke="#1565c0" stroke-width="2.5" class="scene2-hidden"/>
            <line id="scene2-line-a-drop1" x1="240" y1="340" x2="240" y2="420" stroke="#1565c0" stroke-width="2.5" class="scene2-hidden"/>
            <line id="scene2-line-a-drop2" x1="400" y1="260" x2="400" y2="340" stroke="#1565c0" stroke-width="2.5" class="scene2-hidden"/>
            
            <!-- B 球 v-t 线（绿色）- 分段 -->
            <line id="scene2-line-b-seg1" x1="80" y1="420" x2="240" y2="420" stroke="#2e7d32" stroke-width="2.5" class="scene2-visible"/>
            <line id="scene2-line-b-seg2" x1="240" y1="340" x2="400" y2="340" stroke="#2e7d32" stroke-width="2.5" class="scene2-hidden"/>
            <line id="scene2-line-b-seg3" x1="400" y1="260" x2="560" y2="260" stroke="#2e7d32" stroke-width="2.5" class="scene2-hidden"/>
            <line id="scene2-line-b-rise1" x1="240" y1="420" x2="240" y2="340" stroke="#2e7d32" stroke-width="2.5" class="scene2-hidden"/>
            <line id="scene2-line-b-rise2" x1="400" y1="340" x2="400" y2="260" stroke="#2e7d32" stroke-width="2.5" class="scene2-hidden"/>
            
            <!-- 碰撞虚线 -->
            <line id="scene2-dash-1" x1="240" y1="100" x2="240" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" class="scene2-hidden"/>
            <line id="scene2-dash-2" x1="400" y1="100" x2="400" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" class="scene2-hidden"/>
            <line id="scene2-dash-3" x1="560" y1="100" x2="560" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" class="scene2-hidden"/>
            
            <!-- 速度交换点（红色圆点） -->
            <circle id="scene2-point-1" cx="240" cy="340" r="5" fill="#c62828" class="scene2-hidden"/>
            <circle id="scene2-point-2" cx="400" cy="260" r="5" fill="#c62828" class="scene2-hidden"/>
            <circle id="scene2-point-3" cx="560" cy="180" r="5" fill="#c62828" class="scene2-hidden"/>
            
            <!-- 图例（调整位置，增加间距） -->
            <g id="scene2-legend" class="scene2-hidden">
                <line x1="600" y1="120" x2="630" y2="120" stroke="#1565c0" stroke-width="2.5"/>
                <text x="640" y="125" font-size="14" fill="#000000">A 球</text>
                <line x1="600" y1="155" x2="630" y2="155" stroke="#2e7d32" stroke-width="2.5"/>
                <text x="640" y="160" font-size="14" fill="#000000">B 球</text>
            </g>
            
            <!-- 控件栏（放在 SVG 内部底部，调整位置避免裁切） -->
            <!-- 上一步按钮组 -->
            <g id="scene2-btn-prev-group" class="scene2-btn">
                <rect x="280" y="455" width="70" height="35" fill="#f0f0f0" stroke="#333" stroke-width="1" rx="4"/>
                <text x="315" y="477" font-size="13" fill="#000000" text-anchor="middle" class="scene2-btn-text">◀ 上一步</text>
            </g>
            <!-- 下一步按钮组 -->
            <g id="scene2-btn-next-group" class="scene2-btn">
                <rect x="450" y="455" width="70" height="35" fill="#f0f0f0" stroke="#333" stroke-width="1" rx="4"/>
                <text x="485" y="477" font-size="13" fill="#000000" text-anchor="middle" class="scene2-btn-text">下一步 ▶</text>
            </g>
            <!-- 步骤指示器 -->
            <text id="scene2-step-indicator" x="380" y="477" font-size="13" fill="#333" text-anchor="middle">步骤 1/6</text>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 2: v-t 图像 - 揭示碰撞规律
        // 布局坐标表（实现对照依据）：
        // | 元素 | 位置/范围 | 备注 |
        // |------|-----------|------|
        // | 纵轴 v | (80,100)-(80,420) | 速度轴 |
        // | 横轴 t | (80,420)-(720,420) | 时间轴 |
        // | t₁ 刻度 | (240,420)-(240,428) | 第一次碰撞时刻 |
        // | t₂ 刻度 | (400,420)-(400,428) | 第二次碰撞时刻 |
        // | t₃ 刻度 | (560,420)-(560,428) | 第三次碰撞时刻 |
        // | v₀ 刻度 | (72,340)-(80,340) | 速度单位 |
        // | 2v₀ 刻度 | (72,260)-(80,260) | 2 倍速度 |
        // | 3v₀ 刻度 | (72,180)-(80,180) | 3 倍速度 |
        
        var currentStep = 0;
        var totalSteps = 6;
        
        // 所有可切换显示的元素 ID
        var toggleableIds = [
            'scene2-tick-t1', 'scene2-label-t1', 'scene2-tick-v0', 'scene2-label-v0',
            'scene2-tick-t2', 'scene2-label-t2', 'scene2-tick-2v0', 'scene2-label-2v0',
            'scene2-tick-t3', 'scene2-label-t3', 'scene2-tick-3v0', 'scene2-label-3v0',
            'scene2-line-a-seg2', 'scene2-line-a-seg3', 'scene2-line-a-drop1', 'scene2-line-a-drop2',
            'scene2-line-b-seg2', 'scene2-line-b-seg3', 'scene2-line-b-rise1', 'scene2-line-b-rise2',
            'scene2-dash-1', 'scene2-dash-2', 'scene2-dash-3',
            'scene2-point-1', 'scene2-point-2', 'scene2-point-3',
            'scene2-legend'
        ];
        
        // 每步应显示的额外 ID（除了坐标轴和基础线段）
        var stepExtras = [
            // 步骤 0：t₁和 v₀标签
            ['scene2-tick-t1', 'scene2-label-t1', 'scene2-tick-v0', 'scene2-label-v0'],
            // 步骤 1：虚线 1 + 交换点 1 + 垂直线段
            ['scene2-tick-t1', 'scene2-label-t1', 'scene2-tick-v0', 'scene2-label-v0',
             'scene2-dash-1', 'scene2-point-1', 'scene2-line-a-drop1', 'scene2-line-b-rise1'],
            // 步骤 2：t₁ 到 t₂ 过程
            ['scene2-tick-t1', 'scene2-label-t1', 'scene2-tick-v0', 'scene2-label-v0',
             'scene2-dash-1', 'scene2-point-1', 'scene2-line-a-drop1', 'scene2-line-b-rise1',
             'scene2-line-a-seg2', 'scene2-line-b-seg2',
             'scene2-tick-t2', 'scene2-label-t2', 'scene2-tick-2v0', 'scene2-label-2v0'],
            // 步骤 3：第二次碰撞
            ['scene2-tick-t1', 'scene2-label-t1', 'scene2-tick-v0', 'scene2-label-v0',
             'scene2-dash-1', 'scene2-point-1', 'scene2-line-a-drop1', 'scene2-line-b-rise1',
             'scene2-line-a-seg2', 'scene2-line-b-seg2',
             'scene2-tick-t2', 'scene2-label-t2', 'scene2-tick-2v0', 'scene2-label-2v0',
             'scene2-dash-2', 'scene2-point-2', 'scene2-line-a-drop2', 'scene2-line-b-rise2'],
            // 步骤 4：t₂ 到 t₃ 过程
            ['scene2-tick-t1', 'scene2-label-t1', 'scene2-tick-v0', 'scene2-label-v0',
             'scene2-dash-1', 'scene2-point-1', 'scene2-line-a-drop1', 'scene2-line-b-rise1',
             'scene2-line-a-seg2', 'scene2-line-b-seg2',
             'scene2-tick-t2', 'scene2-label-t2', 'scene2-tick-2v0', 'scene2-label-2v0',
             'scene2-dash-2', 'scene2-point-2', 'scene2-line-a-drop2', 'scene2-line-b-rise2',
             'scene2-line-a-seg3', 'scene2-line-b-seg3',
             'scene2-tick-t3', 'scene2-label-t3', 'scene2-tick-3v0', 'scene2-label-3v0',
             'scene2-dash-3', 'scene2-point-3'],
            // 步骤 5：完整图像 + 图例
            ['scene2-tick-t1', 'scene2-label-t1', 'scene2-tick-v0', 'scene2-label-v0',
             'scene2-dash-1', 'scene2-point-1', 'scene2-line-a-drop1', 'scene2-line-b-rise1',
             'scene2-line-a-seg2', 'scene2-line-b-seg2',
             'scene2-tick-t2', 'scene2-label-t2', 'scene2-tick-2v0', 'scene2-label-2v0',
             'scene2-dash-2', 'scene2-point-2', 'scene2-line-a-drop2', 'scene2-line-b-rise2',
             'scene2-line-a-seg3', 'scene2-line-b-seg3',
             'scene2-tick-t3', 'scene2-label-t3', 'scene2-tick-3v0', 'scene2-label-3v0',
             'scene2-dash-3', 'scene2-point-3',
             'scene2-legend']
        ];
        
        function show(id) {
            var el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene2-hidden');
                el.classList.add('scene2-visible');
            }
        }
        
        function hide(id) {
            var el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene2-visible');
                el.classList.add('scene2-hidden');
            }
        }
        
        function updateDisplay() {
            // 隐藏所有可切换元素
            for (var i = 0; i < toggleableIds.length; i++) {
                hide(toggleableIds[i]);
            }
            
            // 显示当前步骤需要的元素
            for (var j = 0; j < stepExtras[currentStep].length; j++) {
                show(stepExtras[currentStep][j]);
            }
            
            // 更新步骤指示器
            document.getElementById('scene2-step-indicator').textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;
            
            // 更新按钮状态
            var prevGroup = document.getElementById('scene2-btn-prev-group');
            var nextGroup = document.getElementById('scene2-btn-next-group');
            var prevRect = prevGroup.querySelector('rect');
            var prevText = prevGroup.querySelector('text');
            var nextRect = nextGroup.querySelector('rect');
            var nextText = nextGroup.querySelector('text');
            
            if (currentStep === 0) {
                prevRect.setAttribute('fill', '#cccccc');
                prevText.setAttribute('fill', '#888888');
                prevGroup.classList.remove('scene2-btn');
                prevGroup.classList.add('scene2-btn-disabled');
            } else {
                prevRect.setAttribute('fill', '#f0f0f0');
                prevText.setAttribute('fill', '#000000');
                prevGroup.classList.remove('scene2-btn-disabled');
                prevGroup.classList.add('scene2-btn');
            }
            
            if (currentStep === totalSteps - 1) {
                nextRect.setAttribute('fill', '#cccccc');
                nextText.setAttribute('fill', '#888888');
                nextGroup.classList.remove('scene2-btn');
                nextGroup.classList.add('scene2-btn-disabled');
            } else {
                nextRect.setAttribute('fill', '#f0f0f0');
                nextText.setAttribute('fill', '#000000');
                nextGroup.classList.remove('scene2-btn-disabled');
                nextGroup.classList.add('scene2-btn');
            }
        }
        
        // 按钮点击事件
        document.getElementById('scene2-btn-prev-group').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });
        
        document.getElementById('scene2-btn-next-group').addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateDisplay();
            }
        });
        
        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
