<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>带电粒子在匀强磁场中的圆周运动</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-svg { width: 800px; height: 500px; }
        .scene2-hidden { display: none; opacity: 0; }
        .scene2-visible { display: block; opacity: 1; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 背景 -->
            <rect width="800" height="500" fill="#ffffff"/>
            
            <!-- 上金属板 -->
            <line id="scene2-plate-top" x1="80" y1="100" x2="280" y2="100" stroke="#000000" stroke-width="3"/>
            
            <!-- 下金属板 -->
            <line id="scene2-plate-bottom" x1="80" y1="140" x2="280" y2="140" stroke="#000000" stroke-width="3"/>
            
            <!-- 正极符号 -->
            <text id="scene2-label-plus" x="180" y="75" text-anchor="middle" font-size="20" fill="#000000">+</text>
            <line x1="180" y1="82" x2="180" y2="95" stroke="#000000" stroke-width="1.5"/>
            <circle cx="180" cy="100" r="3" fill="#000000"/>
            
            <!-- 负极符号 -->
            <text id="scene2-label-minus" x="180" y="165" text-anchor="middle" font-size="20" fill="#000000">−</text>
            <line x1="180" y1="145" x2="180" y2="158" stroke="#000000" stroke-width="1.5"/>
            <circle cx="180" cy="140" r="3" fill="#000000"/>
            
            <!-- 磁场区域 MNPQ 虚线框 -->
            <rect id="scene2-field-rect" x="320" y="150" width="400" height="250" fill="none" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
            
            <!-- 磁场方向标记（点阵）6x6 -->
            <g id="scene2-field-dots">
                <circle cx="340" cy="170" r="3" fill="#000000"/>
                <circle cx="407" cy="170" r="3" fill="#000000"/>
                <circle cx="473" cy="170" r="3" fill="#000000"/>
                <circle cx="540" cy="170" r="3" fill="#000000"/>
                <circle cx="607" cy="170" r="3" fill="#000000"/>
                <circle cx="673" cy="170" r="3" fill="#000000"/>
                
                <circle cx="340" cy="212" r="3" fill="#000000"/>
                <circle cx="407" cy="212" r="3" fill="#000000"/>
                <circle cx="473" cy="212" r="3" fill="#000000"/>
                <circle cx="540" cy="212" r="3" fill="#000000"/>
                <circle cx="607" cy="212" r="3" fill="#000000"/>
                <circle cx="673" cy="212" r="3" fill="#000000"/>
                
                <circle cx="340" cy="254" r="3" fill="#000000"/>
                <circle cx="407" cy="254" r="3" fill="#000000"/>
                <circle cx="473" cy="254" r="3" fill="#000000"/>
                <circle cx="540" cy="254" r="3" fill="#000000"/>
                <circle cx="607" cy="254" r="3" fill="#000000"/>
                <circle cx="673" cy="254" r="3" fill="#000000"/>
                
                <circle cx="340" cy="296" r="3" fill="#000000"/>
                <circle cx="407" cy="296" r="3" fill="#000000"/>
                <circle cx="473" cy="296" r="3" fill="#000000"/>
                <circle cx="540" cy="296" r="3" fill="#000000"/>
                <circle cx="607" cy="296" r="3" fill="#000000"/>
                <circle cx="673" cy="296" r="3" fill="#000000"/>
                
                <circle cx="340" cy="338" r="3" fill="#000000"/>
                <circle cx="407" cy="338" r="3" fill="#000000"/>
                <circle cx="473" cy="338" r="3" fill="#000000"/>
                <circle cx="540" cy="338" r="3" fill="#000000"/>
                <circle cx="607" cy="338" r="3" fill="#000000"/>
                <circle cx="673" cy="338" r="3" fill="#000000"/>
                
                <circle cx="340" cy="380" r="3" fill="#000000"/>
                <circle cx="407" cy="380" r="3" fill="#000000"/>
                <circle cx="473" cy="380" r="3" fill="#000000"/>
                <circle cx="540" cy="380" r="3" fill="#000000"/>
                <circle cx="607" cy="380" r="3" fill="#000000"/>
                <circle cx="673" cy="380" r="3" fill="#000000"/>
            </g>
            
            <!-- 顶点标签 M, N, P, Q -->
            <text id="scene2-label-M" x="305" y="145" text-anchor="end" font-size="16" fill="#000000">M</text>
            <text id="scene2-label-N" x="735" y="145" text-anchor="start" font-size="16" fill="#000000">N</text>
            <text id="scene2-label-P" x="305" y="410" text-anchor="end" font-size="16" fill="#000000">P</text>
            <text id="scene2-label-Q" x="735" y="410" text-anchor="start" font-size="16" fill="#000000">Q</text>
            
            <!-- 宽度 d 标注线（右侧双向箭头） -->
            <line x1="735" y1="150" x2="735" y2="400" stroke="#000000" stroke-width="2"/>
            <polygon points="735,150 730,160 740,160" fill="#000000"/>
            <polygon points="735,400 730,390 740,390" fill="#000000"/>
            <text id="scene2-label-d" x="755" y="280" text-anchor="start" font-size="16" fill="#000000">d</text>
            
            <!-- 入射速度 v 箭头（红色，从 M 点出发，与水平成 30°向下） -->
            <line id="scene2-velocity" x1="320" y1="150" x2="372" y2="180" stroke="#c62828" stroke-width="2.5"/>
            <polygon points="372,180 362,172 368,185" fill="#c62828"/>
            <text id="scene2-label-v" x="385" y="185" text-anchor="start" font-size="16" fill="#c62828" font-weight="bold">v</text>
            
            <!-- 30°角弧（以 M 为圆心，r=25，从 0°到 -30°） -->
            <path id="scene2-angle-arc" d="M 345 150 A 25 25 0 0 0 341.65 162.5" fill="none" stroke="#000000" stroke-width="1.5"/>
            <text id="scene2-label-angle30" x="355" y="170" text-anchor="start" font-size="14" fill="#000000">30°</text>
            
            <!-- 步骤 1：圆周运动轨迹（红色圆弧，从 M 到出射点 S） -->
            <path id="scene2-trajectory" class="scene2-hidden" d="M 320 150 A 200 200 0 0 1 720 270" fill="none" stroke="#c62828" stroke-width="3"/>
            <circle id="scene2-label-S" class="scene2-hidden" cx="720" cy="270" r="4" fill="#c62828"/>
            <text id="scene2-label-S-text" class="scene2-hidden" x="732" y="275" text-anchor="start" font-size="16" fill="#000000">S</text>
            
            <!-- 步骤 2：圆心 O、半径、辅助线 -->
            <line id="scene2-aux-line" class="scene2-hidden" x1="220" y1="200" x2="420" y2="100" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5"/>
            
            <circle id="scene2-center-O" class="scene2-hidden" cx="493" cy="250" r="5" fill="#1565c0"/>
            <text id="scene2-label-O" class="scene2-hidden" x="493" y="235" text-anchor="middle" font-size="16" fill="#1565c0" font-weight="bold">O</text>
            
            <line id="scene2-radius-OM" class="scene2-hidden" x1="493" y1="250" x2="320" y2="150" stroke="#1565c0" stroke-width="2" stroke-dasharray="5,5"/>
            <line id="scene2-radius-OS" class="scene2-hidden" x1="493" y1="250" x2="720" y2="270" stroke="#1565c0" stroke-width="2" stroke-dasharray="5,5"/>
            <text id="scene2-label-R" class="scene2-hidden" x="400" y="205" text-anchor="middle" font-size="14" fill="#1565c0">R</text>
            
            <!-- 步骤 3：公式 -->
            <text id="scene2-formula" class="scene2-hidden" x="400" y="430" text-anchor="middle" font-size="18" fill="#000000">R·sin30° = d</text>
            
            <!-- 控件栏背景 -->
            <rect x="0" y="450" width="800" height="50" fill="#f5f5f5" opacity="0.9"/>
            
            <!-- 控件栏按钮 -->
            <rect x="280" y="460" width="100" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1" rx="4" id="scene2-btn-prev-bg"/>
            <text id="scene2-btn-prev-text" x="330" y="480" text-anchor="middle" font-size="14" fill="#333">◀ 上一步</text>
            
            <rect x="420" y="460" width="100" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1" rx="4" id="scene2-btn-next-bg"/>
            <text id="scene2-btn-next-text" x="470" y="480" text-anchor="middle" font-size="14" fill="#333">下一步 ▶</text>
            
            <!-- 步骤指示 -->
            <text id="scene2-step-indicator" x="580" y="480" text-anchor="start" font-size="14" fill="#333">步骤 1/4</text>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现：带电粒子在匀强磁场中的圆周运动
        
        let currentStep = 0;
        const totalSteps = 4;
        
        // 元素引用
        const btnPrevBg = document.getElementById('scene2-btn-prev-bg');
        const btnPrevText = document.getElementById('scene2-btn-prev-text');
        const btnNextBg = document.getElementById('scene2-btn-next-bg');
        const btnNextText = document.getElementById('scene2-btn-next-text');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        
        // 各步骤需要显示的元素
        const stepElements = {
            1: ['scene2-trajectory', 'scene2-label-S', 'scene2-label-S-text'],
            2: ['scene2-aux-line', 'scene2-center-O', 'scene2-label-O', 'scene2-radius-OM', 'scene2-radius-OS', 'scene2-label-R'],
            3: ['scene2-formula']
        };
        
        // 显示/隐藏工具函数
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene2-hidden');
                el.classList.add('scene2-visible');
            }
        }
        
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene2-visible');
                el.classList.add('scene2-hidden');
            }
        }
        
        // 更新按钮状态
        function updateButtons() {
            if (currentStep === 0) {
                btnPrevBg.setAttribute('fill', '#cccccc');
                btnPrevText.setAttribute('fill', '#999999');
            } else {
                btnPrevBg.setAttribute('fill', '#e0e0e0');
                btnPrevText.setAttribute('fill', '#333');
            }
            
            if (currentStep === 3) {
                btnNextBg.setAttribute('fill', '#cccccc');
                btnNextText.setAttribute('fill', '#999999');
            } else {
                btnNextBg.setAttribute('fill', '#e0e0e0');
                btnNextText.setAttribute('fill', '#333');
            }
            
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/4';
        }
        
        // 更新显示状态
        function updateDisplay() {
            for (let step = 1; step <= 3; step++) {
                const elements = stepElements[step];
                elements.forEach(id => {
                    if (step <= currentStep) {
                        showElement(id);
                    } else {
                        hideElement(id);
                    }
                });
            }
            updateButtons();
        }
        
        // 按钮点击检测
        function checkButtonClick(x, y) {
            // 上一步按钮区域
            if (x >= 280 && x <= 380 && y >= 460 && y <= 490) {
                if (currentStep > 0) {
                    currentStep--;
                    updateDisplay();
                }
                return true;
            }
            // 下一步按钮区域
            if (x >= 420 && x <= 520 && y >= 460 && y <= 490) {
                if (currentStep < 3) {
                    currentStep++;
                    updateDisplay();
                }
                return true;
            }
            return false;
        }
        
        // 鼠标点击事件
        document.getElementById('scene2-svg').addEventListener('click', function(e) {
            const rect = this.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            checkButtonClick(x, y);
        });
        
        // 触摸事件
        document.getElementById('scene2-svg').addEventListener('touchend', function(e) {
            const rect = this.getBoundingClientRect();
            const touch = e.changedTouches[0];
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            checkButtonClick(x, y);
        });
        
        // 初始化
        updateDisplay();
    })();
    </script>
</body>
</html>
