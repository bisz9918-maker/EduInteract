<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三角形穿过正方形 - S-t 函数图像</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        .scene2-option-btn {
            cursor: pointer;
            border: 2px solid #ccc;
            border-radius: 4px;
            background: #fff;
            padding: 4px;
        }
        .scene2-option-btn.active {
            border-color: #2e7d32;
            background: #e8f5e9;
        }
        .scene2-option-label {
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <!-- 水平基线 -->
            <line id="scene2-baseline" x1="100" y1="200" x2="500" y2="200" stroke="#000000" stroke-width="2"/>
            
            <!-- 正方形 (固定) -->
            <rect id="scene2-square" x="250" y="80" width="120" height="120" fill="#b0bec5" stroke="#000000" stroke-width="2"/>
            
            <!-- 正三角形 (动态) -->
            <polygon id="scene2-triangle" fill="transparent" stroke="#000000" stroke-width="2"/>
            
            <!-- 重合部分 (动态) -->
            <polygon id="scene2-overlap" fill="#1565c0" fill-opacity="0.3" stroke="#1565c0" stroke-width="1"/>
            
            <!-- S-t 坐标系 -->
            <!-- t 轴 -->
            <line id="scene2-t-axis" x1="80" y1="440" x2="500" y2="440" stroke="#000000" stroke-width="2"/>
            <polygon points="500,440 490,435 490,445" fill="#000000"/>
            
            <!-- S 轴 -->
            <line id="scene2-s-axis" x1="80" y1="440" x2="80" y2="260" stroke="#000000" stroke-width="2"/>
            <polygon points="80,260 75,270 85,270" fill="#000000"/>
            
            <!-- 坐标轴标签 -->
            <text id="scene2-label-t" x="515" y="445" font-size="14px" fill="#000000">t</text>
            <text id="scene2-label-s" x="70" y="255" font-size="14px" fill="#000000">S</text>
            <text id="scene2-label-o" x="65" y="455" font-size="12px" fill="#000000">O</text>
            <text id="scene2-label-smax" x="620" y="270" font-size="12px" fill="#000000">S_max=√3/4</text>
            
            <!-- 函数曲线 (正确答案 C - 梯形) -->
            <path id="scene2-curve-c" d="M 80,440 L 200,320 L 340,320 L 460,440" fill="none" stroke="#2e7d32" stroke-width="2" opacity="0.6"/>
            
            <!-- 错误选项曲线 (初始隐藏) -->
            <!-- A: 三角形 -->
            <path id="scene2-curve-a" d="M 80,440 L 270,320 L 460,440" fill="none" stroke="#888888" stroke-width="2" stroke-dasharray="4,4" opacity="0"/>
            <!-- B: 抛物线 -->
            <path id="scene2-curve-b" d="M 80,440 Q 270,280 460,440" fill="none" stroke="#888888" stroke-width="2" stroke-dasharray="4,4" opacity="0"/>
            <!-- D: 钟形曲线 -->
            <path id="scene2-curve-d" d="M 80,440 C 180,440 200,350 270,350 C 340,350 360,440 460,440" fill="none" stroke="#888888" stroke-width="2" stroke-dasharray="4,4" opacity="0"/>
            
            <!-- 动态红点 -->
            <circle id="scene2-dot" cx="80" cy="440" r="6" fill="#c62828" opacity="0"/>
            
            <!-- 滑块轨道 -->
            <line id="scene2-slider-track" x1="100" y1="480" x2="500" y2="480" stroke="#cccccc" stroke-width="4"/>
            
            <!-- 滑块手柄 -->
            <circle id="scene2-slider-handle" cx="100" cy="480" r="10" fill="#1565c0" style="cursor: pointer"/>
            
            <!-- 选项按钮组 - 向右移动避免与 t 标签拥挤 -->
            <g id="scene2-options">
                <!-- 选项 A -->
                <text x="612" y="312" font-size="10px" class="scene2-option-label" text-anchor="end">A</text>
                <rect x="620" y="285" width="60" height="45" fill="#fff" stroke="#888888" stroke-width="1"/>
                <path d="M 625,325 L 650,295 L 675,325" fill="none" stroke="#888888" stroke-width="1.5"/>
                
                <!-- 选项 B -->
                <text x="612" y="367" font-size="10px" class="scene2-option-label" text-anchor="end">B</text>
                <rect x="620" y="340" width="60" height="45" fill="#fff" stroke="#888888" stroke-width="1"/>
                <path d="M 625,380 Q 650,350 675,380" fill="none" stroke="#888888" stroke-width="1.5"/>
                
                <!-- 选项 C -->
                <text x="612" y="422" font-size="10px" class="scene2-option-label" text-anchor="end" fill="#2e7d32">C</text>
                <rect x="620" y="395" width="60" height="45" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
                <path d="M 625,435 L 640,410 L 665,410 L 680,435" fill="none" stroke="#2e7d32" stroke-width="1.5"/>
                
                <!-- 选项 D - 向上移动避免裁切 -->
                <text x="612" y="467" font-size="10px" class="scene2-option-label" text-anchor="end">D</text>
                <rect x="620" y="450" width="60" height="35" fill="#fff" stroke="#888888" stroke-width="1"/>
                <path d="M 625,480 C 635,480 640,460 650,460 C 660,460 665,480 675,480" fill="none" stroke="#888888" stroke-width="1.5"/>
            </g>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 2: 三角形穿过正方形 - S-t 函数图像
        
        // 常量定义
        const SQRT3_4 = Math.sqrt(3) / 4; // 正三角形面积系数
        const TRIANGLE_BASE = 120; // 三角形底边长度
        const TRIANGLE_HEIGHT = TRIANGLE_BASE * Math.sqrt(3) / 2; // 三角形高度 ≈ 104
        
        // 坐标常量
        const SQUARE_LEFT = 250;
        const SQUARE_RIGHT = 370;
        const BASELINE_Y = 200;
        
        // 滑块范围
        const SLIDER_MIN_X = 100;
        const SLIDER_MAX_X = 500;
        const SLIDER_RANGE = SLIDER_MAX_X - SLIDER_MIN_X;
        
        // S-t 坐标系
        const ST_X_ORIGIN = 80;
        const ST_Y_ORIGIN = 440;
        const ST_X_END = 460;
        const ST_Y_MAX = 320; // S_max 对应的 y 坐标
        const ST_RANGE = ST_X_END - ST_X_ORIGIN;
        
        // DOM 元素
        const triangleEl = document.getElementById('scene2-triangle');
        const overlapEl = document.getElementById('scene2-overlap');
        const dotEl = document.getElementById('scene2-dot');
        const sliderHandleEl = document.getElementById('scene2-slider-handle');
        const curveA = document.getElementById('scene2-curve-a');
        const curveB = document.getElementById('scene2-curve-b');
        const curveC = document.getElementById('scene2-curve-c');
        const curveD = document.getElementById('scene2-curve-d');
        
        // 状态
        let sliderX = SLIDER_MIN_X;
        let isDragging = false;
        let currentOption = 'C'; // 默认显示正确答案 C
        
        // 计算 t 值 (0 到 3)
        function getT() {
            return (sliderX - SLIDER_MIN_X) / SLIDER_RANGE * 3;
        }
        
        // 计算三角形位置
        function getTrianglePoints(t) {
            // t=0: 三角形在正方形左侧，右顶点接触正方形左边界
            // t=3: 三角形在正方形右侧，左顶点接触正方形右边界
            const startX = SQUARE_LEFT - TRIANGLE_BASE; // 130
            const endX = SQUARE_RIGHT; // 370
            const triX = startX + (endX - startX) * (t / 3);
            
            const leftX = triX;
            const rightX = triX + TRIANGLE_BASE;
            const midX = triX + TRIANGLE_BASE / 2;
            const topY = BASELINE_Y - TRIANGLE_HEIGHT;
            
            return [
                { x: leftX, y: BASELINE_Y },
                { x: rightX, y: BASELINE_Y },
                { x: midX, y: topY }
            ];
        }
        
        // 简化版：计算重合面积
        function getOverlapArea(t) {
            if (t <= 0) return 0;
            if (t < 1) {
                // 进入阶段：面积与 t² 成正比
                return SQRT3_4 * t * t;
            } else if (t < 2) {
                // 平台阶段：最大面积
                return SQRT3_4;
            } else if (t < 3) {
                // 离开阶段：面积与 (3-t)² 成正比
                const ratio = 3 - t;
                return SQRT3_4 * ratio * ratio;
            } else {
                return 0;
            }
        }
        
        // 计算 S-t 曲线上的点
        function getCurvePoint(t) {
            const x = ST_X_ORIGIN + (t / 3) * ST_RANGE;
            const area = getOverlapArea(t);
            const maxArea = SQRT3_4;
            const y = ST_Y_ORIGIN - (area / maxArea) * (ST_Y_ORIGIN - ST_Y_MAX);
            return { x, y };
        }
        
        // 简化版重合多边形计算
        function getOverlapPolygonSimple(t, triPoints) {
            const triLeft = triPoints[0].x;
            const triRight = triPoints[1].x;
            const triMidX = triPoints[2].x;
            const triTopY = triPoints[2].y;
            
            if (t <= 0.05 || t >= 2.95) {
                return [];
            }
            
            if (t < 1) {
                // 进入阶段
                const intersectX = SQUARE_LEFT;
                const slope = TRIANGLE_HEIGHT / (TRIANGLE_BASE / 2);
                const intersectY = BASELINE_Y - Math.abs(intersectX - triMidX) * slope;
                
                return [
                    { x: intersectX, y: BASELINE_Y },
                    { x: triRight, y: BASELINE_Y },
                    { x: triMidX, y: triTopY },
                    { x: intersectX, y: Math.max(intersectY, triTopY) }
                ];
            } else if (t < 2) {
                // 平台阶段 - 完全在内
                return triPoints;
            } else {
                // 离开阶段
                const intersectX = SQUARE_RIGHT;
                const slope = TRIANGLE_HEIGHT / (TRIANGLE_BASE / 2);
                const intersectY = BASELINE_Y - Math.abs(intersectX - triMidX) * slope;
                
                return [
                    { x: triLeft, y: BASELINE_Y },
                    { x: intersectX, y: BASELINE_Y },
                    { x: intersectX, y: Math.max(intersectY, triTopY) },
                    { x: triMidX, y: triTopY }
                ];
            }
        }
        
        // 更新显示
        function update(t) {
            // 更新三角形位置
            const triPoints = getTrianglePoints(t);
            const triStr = triPoints.map(p => `${p.x},${p.y}`).join(' ');
            triangleEl.setAttribute('points', triStr);
            
            // 更新重合部分
            const overlapPoints = getOverlapPolygonSimple(t, triPoints);
            if (overlapPoints.length > 0) {
                const overlapStr = overlapPoints.map(p => `${p.x},${p.y}`).join(' ');
                overlapEl.setAttribute('points', overlapStr);
                overlapEl.style.opacity = '1';
            } else {
                overlapEl.style.opacity = '0';
            }
            
            // 更新滑块手柄
            sliderHandleEl.setAttribute('cx', sliderX);
            
            // 更新红点
            const curvePt = getCurvePoint(t);
            dotEl.setAttribute('cx', curvePt.x);
            dotEl.setAttribute('cy', curvePt.y);
            dotEl.style.opacity = t > 0 ? '1' : '0';
        }
        
        // 事件处理
        function handleMouseDown(e) {
            isDragging = true;
            updateSliderFromEvent(e);
        }
        
        function handleMouseMove(e) {
            if (!isDragging) return;
            e.preventDefault();
            updateSliderFromEvent(e);
        }
        
        function handleMouseUp() {
            isDragging = false;
        }
        
        function updateSliderFromEvent(e) {
            const rect = document.getElementById('scene2-slider-track').getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let newX = clientX - rect.left;
            newX = Math.max(SLIDER_MIN_X, Math.min(SLIDER_MAX_X, newX));
            sliderX = newX;
            update(getT());
        }
        
        // 选项切换
        function selectOption(option) {
            currentOption = option;
            
            // 隐藏所有曲线
            curveA.style.opacity = '0';
            curveB.style.opacity = '0';
            curveC.style.opacity = '0.6';
            curveD.style.opacity = '0';
            
            // 显示选中的曲线
            if (option === 'A') {
                curveA.style.opacity = '1';
                curveC.style.opacity = '0.3';
            } else if (option === 'B') {
                curveB.style.opacity = '1';
                curveC.style.opacity = '0.3';
            } else if (option === 'C') {
                curveC.style.opacity = '0.6';
            } else if (option === 'D') {
                curveD.style.opacity = '1';
                curveC.style.opacity = '0.3';
            }
        }
        
        // 绑定事件
        sliderHandleEl.addEventListener('mousedown', handleMouseDown);
        document.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseup', handleMouseUp);
        
        sliderHandleEl.addEventListener('touchstart', handleMouseDown);
        document.addEventListener('touchmove', handleMouseMove);
        document.addEventListener('touchend', handleMouseUp);
        
        // 选项按钮点击事件
        document.querySelectorAll('#scene2-options rect').forEach((rect, index) => {
            const options = ['A', 'B', 'C', 'D'];
            rect.addEventListener('click', () => selectOption(options[index]));
        });
        
        // 初始化
        update(0);
        
    })();
    </script>
</body>
</html>
