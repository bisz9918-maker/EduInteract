<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四边形 ABCD 平行条件图示</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-btn-prev, #scene1-btn-next { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; background: #f0f0f0; border-radius: 4px; }
        #scene1-btn-prev:disabled, #scene1-btn-next:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #333; min-width: 80px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" viewBox="0 0 800 500">
            <!-- 四边形 ABCD -->
            <!-- 坐标表参考 (根据题目图片调整):
                 A(150,60), B(80,380), C(650,380), D(720,60)
                 E 在 BD 上约 1/3 处: (293, 273)
                 F 在 BD 上约 2/3 处: (507, 167)
                 标签位置调整避免与线段重叠:
                 E 标签移到四边形外部下方
                 F 标签移到四边形外部上方
                 ∠1 标签移到三角形 ABD 内部空白处
                 ∠2 标签移到三角形 BCD 内部空白处
            -->
            
            <!-- 四边形边框 -->
            <path id="scene1-quad-abcd" d="M 150 60 L 80 380 L 650 380 L 720 60 Z" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 对角线 BD -->
            <line id="scene1-diag-bd" x1="80" y1="380" x2="720" y2="60" stroke="#000000" stroke-width="2"/>
            
            <!-- 线段 AE -->
            <line id="scene1-seg-ae" x1="150" y1="60" x2="293" y2="273" stroke="#000000" stroke-width="2"/>
            
            <!-- 线段 CF -->
            <line id="scene1-seg-cf" x1="650" y1="380" x2="507" y2="167" stroke="#000000" stroke-width="2"/>
            
            <!-- 平行标记组 (步骤 1 显示) -->
            <g id="scene1-parallel-mark" style="display: none;">
                <!-- AB 边上的平行箭头 (在 AB 中点附近，偏移避免与标签重叠) -->
                <path d="M 105 230 L 115 225 L 115 235 Z" fill="#000000"/>
                <path d="M 115 228 L 125 223 L 125 233 Z" fill="#000000"/>
                <!-- CD 边上的平行箭头 -->
                <path d="M 675 230 L 685 225 L 685 235 Z" fill="#000000"/>
                <path d="M 685 228 L 695 223 L 695 233 Z" fill="#000000"/>
            </g>
            
            <!-- 等长标记组 (步骤 2 显示) -->
            <g id="scene1-equal-mark" style="display: none;">
                <!-- AB 中点处的短划线 (垂直于 AB) -->
                <line x1="108" y1="215" x2="118" y2="220" stroke="#000000" stroke-width="2"/>
                <!-- CD 中点处的短划线 -->
                <line x1="682" y1="215" x2="692" y2="220" stroke="#000000" stroke-width="2"/>
            </g>
            
            <!-- 内错角弧线组 (步骤 3 高亮) -->
            <g id="scene1-alt-angle" style="display: none;">
                <!-- ∠ABE 弧线 (B 点，半径 25) -->
                <path d="M 100 355 A 25 25 0 0 1 120 370" fill="none" stroke="#1565c0" stroke-width="2"/>
                <!-- ∠CDF 弧线 (D 点，半径 25) -->
                <path d="M 695 85 A 25 25 0 0 1 710 100" fill="none" stroke="#1565c0" stroke-width="2"/>
                <!-- "相等" 文字移到弧线下方更远位置 -->
                <text x="115" y="400" font-size="12" fill="#1565c0">相等</text>
            </g>
            
            <!-- ∠1 弧线及标签 (步骤 4 显示) -->
            <g id="scene1-angle1" style="display: none;">
                <!-- ∠1 弧线 (A 点，半径 20，标注∠BAE) -->
                <path d="M 160 85 A 20 20 0 0 1 155 105" fill="none" stroke="#000000" stroke-width="1.5"/>
                <!-- ∠1 标签移到三角形 ABD 内部，远离所有线段 -->
                <text x="250" y="100" font-size="14" fill="#000000">∠1</text>
            </g>
            
            <!-- ∠2 弧线及标签 (步骤 4 显示) -->
            <g id="scene1-angle2" style="display: none;">
                <!-- ∠2 弧线 (C 点，半径 20，标注∠DCF) -->
                <path d="M 640 355 A 20 20 0 0 1 645 335" fill="none" stroke="#000000" stroke-width="1.5"/>
                <!-- ∠2 标签移到三角形 BCD 内部，远离所有线段 -->
                <text x="550" y="350" font-size="14" fill="#000000">∠2</text>
            </g>
            
            <!-- 顶点标签 (调整位置避免与线段重叠) -->
            <text x="145" y="50" font-size="16" fill="#000000">A</text>
            <text x="55" y="405" font-size="16" fill="#000000">B</text>
            <text x="660" y="405" font-size="16" fill="#000000">C</text>
            <text x="735" y="50" font-size="16" fill="#000000">D</text>
            <!-- E 标签移到四边形外部下方，完全远离所有线段 -->
            <text x="293" y="420" font-size="14" fill="#000000">E</text>
            <!-- F 标签移到四边形外部上方，完全远离所有线段 -->
            <text x="507" y="40" font-size="14" fill="#000000">F</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/4</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        let currentState = 0;
        const totalSteps = 4;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        
        // 元素组映射
        const stepElements = {
            1: ['scene1-parallel-mark'],
            2: ['scene1-equal-mark'],
            3: ['scene1-alt-angle'],
            4: ['scene1-angle1', 'scene1-angle2']
        };
        
        function updateDisplay() {
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentState}/${totalSteps}`;
            
            // 更新按钮状态
            btnPrev.disabled = (currentState === 0);
            btnNext.disabled = (currentState === totalSteps);
            
            // 更新各元素组的可见性
            for (let step = 1; step <= totalSteps; step++) {
                const elements = stepElements[step];
                const shouldShow = (step <= currentState);
                elements.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        el.style.display = shouldShow ? 'block' : 'none';
                    }
                });
            }
        }
        
        btnPrev.addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                updateDisplay();
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentState < totalSteps) {
                currentState++;
                updateDisplay();
            }
        });
        
        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
