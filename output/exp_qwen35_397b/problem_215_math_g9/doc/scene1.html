<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正方形与垂线构造的全等三角形证明</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f0f0f0; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-step-indicator { font-size: 14px; color: #333; }
        .scene1-fade { transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 正方形 ABCD: A(380,230), B(380,330), C(480,330), D(480,230) -->
            <path id="scene1-square" d="M 380 230 L 380 330 L 480 330 L 480 230 Z" fill="none" stroke="#000000" stroke-width="2" class="scene1-fade"/>
            
            <!-- 直线 a: 从 (200,370) 到 (560,150)，穿过 A 点 -->
            <line id="scene1-line-a" x1="200" y1="370" x2="560" y2="150" stroke="#000000" stroke-width="2" class="scene1-fade"/>
            
            <!-- 垂线段 DE: D(480,230) 到 E(445,175) -->
            <line id="scene1-de" x1="480" y1="230" x2="445" y2="175" stroke="#1565c0" stroke-width="2" class="scene1-fade"/>
            
            <!-- 垂线段 BF: B(380,330) 到 F(295,315) -->
            <line id="scene1-bf" x1="380" y1="330" x2="295" y2="315" stroke="#1565c0" stroke-width="2" class="scene1-fade"/>
            
            <!-- 直角标记 E: 8×8 小正方形 -->
            <rect id="scene1-rect-e" x="437" y="167" width="8" height="8" fill="none" stroke="#888888" stroke-width="1" class="scene1-fade"/>
            
            <!-- 直角标记 F: 8×8 小正方形 -->
            <rect id="scene1-rect-f" x="287" y="307" width="8" height="8" fill="none" stroke="#888888" stroke-width="1" class="scene1-fade"/>
            
            <!-- 三角形高亮填充 -->
            <polygon id="scene1-tri-aed" points="380,230 445,175 480,230" fill="#1565c0" fill-opacity="0.2" class="scene1-fade" style="opacity:0;"/>
            <polygon id="scene1-tri-bfa" points="380,330 295,315 380,230" fill="#2e7d32" fill-opacity="0.2" class="scene1-fade" style="opacity:0;"/>
            
            <!-- 角度弧线 -->
            <path id="scene1-arc-dae" d="M 395 215 A 15 15 0 0 1 405 205" fill="none" stroke="#c62828" stroke-width="1.5" class="scene1-fade" style="opacity:0;"/>
            <path id="scene1-arc-ade" d="M 465 215 A 15 15 0 0 1 455 205" fill="none" stroke="#c62828" stroke-width="1.5" class="scene1-fade" style="opacity:0;"/>
            <path id="scene1-arc-abf" d="M 365 315 A 15 15 0 0 1 375 305" fill="none" stroke="#c62828" stroke-width="1.5" class="scene1-fade" style="opacity:0;"/>
            <path id="scene1-arc-baf" d="M 365 245 A 20 20 0 0 1 375 235" fill="none" stroke="#c62828" stroke-width="1.5" class="scene1-fade" style="opacity:0;"/>
            
            <!-- EF 结果线段 -->
            <line id="scene1-ef-line" x1="445" y1="175" x2="295" y2="315" stroke="#c62828" stroke-width="3" class="scene1-fade" style="opacity:0;"/>
            
            <!-- 顶点标签 -->
            <text id="scene1-label-a" x="370" y="225" font-size="14" fill="#000000" class="scene1-fade">A</text>
            <text id="scene1-label-b" x="365" y="345" font-size="14" fill="#000000" class="scene1-fade">B</text>
            <text id="scene1-label-c" x="495" y="345" font-size="14" fill="#000000" class="scene1-fade">C</text>
            <text id="scene1-label-d" x="495" y="225" font-size="14" fill="#000000" class="scene1-fade">D</text>
            <text id="scene1-label-e" x="445" y="160" font-size="14" fill="#000000" class="scene1-fade">E</text>
            <text id="scene1-label-f" x="295" y="330" font-size="14" fill="#000000" class="scene1-fade">F</text>
            
            <!-- 直线 a 标签 -->
            <text id="scene1-label-a-line" x="570" y="145" font-size="14" fill="#000000" class="scene1-fade">a</text>
            
            <!-- 长度标注 -->
            <text id="scene1-label-de4" x="470" y="200" font-size="14" fill="#000000" class="scene1-fade" style="opacity:0;">DE=4</text>
            <text id="scene1-label-bf3" x="270" y="300" font-size="14" fill="#000000" class="scene1-fade" style="opacity:0;">BF=3</text>
            
            <!-- 直角标注 -->
            <text id="scene1-label-ae90" x="430" y="185" font-size="12" fill="#000000" class="scene1-fade" style="opacity:0;">∠AED=90°</text>
            <text id="scene1-label-bf90" x="310" y="305" font-size="12" fill="#000000" class="scene1-fade" style="opacity:0;">∠BFA=90°</text>
            
            <!-- 角度关系文字 -->
            <text id="scene1-text-ae90" x="400" y="80" font-size="13" fill="#000000" text-anchor="middle" class="scene1-fade" style="opacity:0;">∠DAE+∠ADE=90°</text>
            <text id="scene1-text-af90" x="400" y="100" font-size="13" fill="#000000" text-anchor="middle" class="scene1-fade" style="opacity:0;">∠BAF+∠ABF=90°</text>
            
            <!-- 对应边标注 -->
            <text id="scene1-label-ae3" x="340" y="200" font-size="14" fill="#000000" class="scene1-fade" style="opacity:0;">AE=3</text>
            <text id="scene1-label-af4" x="350" y="280" font-size="14" fill="#000000" class="scene1-fade" style="opacity:0;">AF=4</text>
            
            <!-- 全等结论 -->
            <text id="scene1-label-congruent" x="400" y="50" font-size="14" fill="#000000" text-anchor="middle" class="scene1-fade" style="opacity:0;">△AED≌△BFA (AAS)</text>
            
            <!-- EF 长度标注 -->
            <text id="scene1-label-ef7" x="380" y="180" font-size="16" fill="#c62828" font-weight="bold" text-anchor="middle" class="scene1-fade" style="opacity:0;">EF=AE+AF=3+4=7</text>
            
            <!-- 控件栏 -->
            <g id="scene1-controls">
                <rect x="310" y="455" width="80" height="30" fill="#f0f0f0" stroke="#333" stroke-width="1" rx="4"/>
                <text x="350" y="475" font-size="13" text-anchor="middle" fill="#000000">◀ 上一步</text>
                <rect x="410" y="455" width="80" height="30" fill="#f0f0f0" stroke="#333" stroke-width="1" rx="4"/>
                <text x="450" y="475" font-size="13" text-anchor="middle" fill="#000000">下一步 ▶</text>
                <text x="550" y="475" font-size="13" fill="#000000" id="scene1-step-indicator">步骤 1/6</text>
            </g>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现：正方形与垂线构造的全等三角形证明
        
        // 布局坐标表（实现对照依据）：
        // 正方形 ABCD: A(380,230), B(380,330), C(480,330), D(480,230)
        // 直线 a: (200,370)-(560,150)
        // 垂足 E: (445,175), 垂足 F: (295,315)
        // 所有标签位置见 spec.json 坐标表
        
        let currentStep = 0;
        const totalSteps = 6;
        
        // 状态配置：每个步骤显示哪些元素
        const stepConfig = {
            0: {
                // 初始状态：基础图形
                visible: ['square', 'line-a', 'de', 'bf', 'rect-e', 'rect-f', 
                          'label-a', 'label-b', 'label-c', 'label-d', 'label-e', 'label-f', 'label-a-line']
            },
            1: {
                // 标注已知条件
                visible: ['square', 'line-a', 'de', 'bf', 'rect-e', 'rect-f',
                          'label-a', 'label-b', 'label-c', 'label-d', 'label-e', 'label-f', 'label-a-line',
                          'label-de4', 'label-bf3']
            },
            2: {
                // 分析△AED
                visible: ['square', 'line-a', 'de', 'bf', 'rect-e', 'rect-f',
                          'label-a', 'label-b', 'label-c', 'label-d', 'label-e', 'label-f', 'label-a-line',
                          'label-de4', 'label-bf3',
                          'tri-aed', 'label-ae90', 'arc-dae', 'arc-ade', 'text-ae90']
            },
            3: {
                // 分析△BFA
                visible: ['square', 'line-a', 'de', 'bf', 'rect-e', 'rect-f',
                          'label-a', 'label-b', 'label-c', 'label-d', 'label-e', 'label-f', 'label-a-line',
                          'label-de4', 'label-bf3',
                          'tri-aed', 'label-ae90', 'arc-dae', 'arc-ade', 'text-ae90',
                          'tri-bfa', 'label-bf90', 'arc-abf', 'arc-baf', 'text-af90']
            },
            4: {
                // 证明角相等
                visible: ['square', 'line-a', 'de', 'bf', 'rect-e', 'rect-f',
                          'label-a', 'label-b', 'label-c', 'label-d', 'label-e', 'label-f', 'label-a-line',
                          'label-de4', 'label-bf3',
                          'tri-aed', 'label-ae90', 'arc-dae', 'arc-ade', 'text-ae90',
                          'tri-bfa', 'label-bf90', 'arc-abf', 'arc-baf', 'text-af90']
            },
            5: {
                // 全等结论与对应边
                visible: ['square', 'line-a', 'de', 'bf', 'rect-e', 'rect-f',
                          'label-a', 'label-b', 'label-c', 'label-d', 'label-e', 'label-f', 'label-a-line',
                          'label-de4', 'label-bf3',
                          'tri-aed', 'label-ae90', 'arc-dae', 'arc-ade', 'text-ae90',
                          'tri-bfa', 'label-bf90', 'arc-abf', 'arc-baf', 'text-af90',
                          'label-congruent', 'label-ae3', 'label-af4']
            },
            6: {
                // 计算 EF
                visible: ['square', 'line-a', 'de', 'bf', 'rect-e', 'rect-f',
                          'label-a', 'label-b', 'label-c', 'label-d', 'label-e', 'label-f', 'label-a-line',
                          'label-de4', 'label-bf3',
                          'tri-aed', 'label-ae90', 'arc-dae', 'arc-ade', 'text-ae90',
                          'tri-bfa', 'label-bf90', 'arc-abf', 'arc-baf', 'text-af90',
                          'label-congruent', 'label-ae3', 'label-af4',
                          'ef-line', 'label-ef7']
            }
        };
        
        // 显示/隐藏元素工具函数
        function showElement(id) {
            const el = document.getElementById('scene1-' + id);
            if (el) {
                el.style.opacity = '1';
                el.style.display = '';
            }
        }
        
        function hideElement(id) {
            const el = document.getElementById('scene1-' + id);
            if (el) {
                el.style.opacity = '0';
                // 对于需要完全隐藏的元素，设置 display:none
                if (id.includes('label') || id.includes('text') || id.includes('arc') || id.includes('tri') || id === 'ef-line') {
                    el.style.display = 'none';
                }
            }
        }
        
        // 更新步骤显示
        function updateStep(step) {
            const config = stepConfig[step];
            
            // 隐藏所有可切换元素
            const allElements = ['label-de4', 'label-bf3', 'tri-aed', 'label-ae90', 'arc-dae', 'arc-ade', 'text-ae90',
                                  'tri-bfa', 'label-bf90', 'arc-abf', 'arc-baf', 'text-af90',
                                  'label-congruent', 'label-ae3', 'label-af4', 'ef-line', 'label-ef7'];
            
            allElements.forEach(id => hideElement(id));
            
            // 显示当前步骤需要的元素
            config.visible.forEach(id => showElement(id));
            
            // 更新步骤指示器
            document.getElementById('scene1-step-indicator').textContent = '步骤 ' + (step + 1) + '/6';
            
            // 更新按钮状态
            const prevBtn = document.getElementById('scene1-btn-prev');
            const nextBtn = document.getElementById('scene1-btn-next');
            
            if (prevBtn) {
                prevBtn.disabled = (step === 0);
                prevBtn.style.opacity = (step === 0) ? '0.5' : '1';
                prevBtn.style.pointerEvents = (step === 0) ? 'none' : 'auto';
            }
            
            if (nextBtn) {
                nextBtn.disabled = (step === totalSteps);
                nextBtn.style.opacity = (step === totalSteps) ? '0.5' : '1';
                nextBtn.style.pointerEvents = (step === totalSteps) ? 'none' : 'auto';
            }
            
            currentStep = step;
        }
        
        // 初始化
        function init() {
            // 添加按钮点击事件
            const prevGroup = document.querySelector('#scene1-controls rect:first-of-type');
            const nextGroup = document.querySelector('#scene1-controls rect:last-of-type');
            
            if (prevGroup) {
                prevGroup.style.cursor = 'pointer';
                prevGroup.addEventListener('click', function() {
                    if (currentStep > 0) {
                        updateStep(currentStep - 1);
                    }
                });
            }
            
            if (nextGroup) {
                nextGroup.style.cursor = 'pointer';
                nextGroup.addEventListener('click', function() {
                    if (currentStep < totalSteps) {
                        updateStep(currentStep + 1);
                    }
                });
            }
            
            // 初始化显示步骤 0
            updateStep(0);
        }
        
        // 页面加载完成后初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
