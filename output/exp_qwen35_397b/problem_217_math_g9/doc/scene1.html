<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二次函数图像与坐标轴交点</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }
        .scene1-btn {
            padding: 8px 16px;
            font-size: 14px;
            border: 2px solid #1565c0;
            border-radius: 6px;
            background: #ffffff;
            color: #1565c0;
            cursor: pointer;
            transition: all 0.2s;
        }
        .scene1-btn:hover:not(:disabled) {
            background: #1565c0;
            color: #ffffff;
        }
        .scene1-btn:disabled {
            border-color: #cccccc;
            color: #cccccc;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #333333;
            min-width: 80px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 坐标轴 -->
            <!-- x 轴: (80,200) 到 (680,200) -->
            <line id="scene1-x-axis" x1="80" y1="200" x2="680" y2="200" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow-x)"/>
            <!-- y 轴: (250,50) 到 (250,420) -->
            <line id="scene1-y-axis" x1="250" y1="50" x2="250" y2="420" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow-y)"/>
            
            <!-- 箭头定义 -->
            <defs>
                <marker id="scene1-arrow-x" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
                </marker>
                <marker id="scene1-arrow-y" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
                </marker>
            </defs>
            
            <!-- 抛物线 y = x² - 2x - 3 -->
            <!-- 数学坐标转 SVG: svgX = 250 + x*60, svgY = 200 - y*40 -->
            <!-- 关键点: x=-2→y=5→(130,0), x=-1→y=0→(190,200), x=0→y=-3→(250,320), x=1→y=-4→(310,360), x=2→y=-3→(370,320), x=3→y=0→(430,200), x=4→y=5→(490,0) -->
            <path id="scene1-parabola" d="M 130,0 C 150,30 170,130 190,200 C 210,260 230,300 250,320 C 270,340 290,355 310,360 C 330,355 350,340 370,320 C 390,300 410,260 430,200 C 450,130 470,30 490,0" 
                  fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 刻度标记 -->
            <!-- x=-1 刻度 (190,200) - 标签放在 x 轴上方很远 -->
            <line id="scene1-tick-a" x1="190" y1="195" x2="190" y2="205" stroke="#666666" stroke-width="1"/>
            <text id="scene1-tick-label-a" x="190" y="145" text-anchor="middle" font-size="12" fill="#666666">-1</text>
            
            <!-- x=3 刻度 (430,200) - 标签放在 x 轴上方很远 -->
            <line id="scene1-tick-b" x1="430" y1="195" x2="430" y2="205" stroke="#666666" stroke-width="1"/>
            <text id="scene1-tick-label-b" x="430" y="145" text-anchor="middle" font-size="12" fill="#666666">3</text>
            
            <!-- y=-3 刻度 (250,320) - 标签放在 y 轴右侧更远 -->
            <line id="scene1-tick-c" x1="245" y1="320" x2="255" y2="320" stroke="#666666" stroke-width="1"/>
            <text id="scene1-tick-label-c" x="285" y="325" font-size="12" fill="#666666">-3</text>
            
            <!-- 原点 O - 放在右上角 -->
            <text id="scene1-label-o" x="260" y="190" font-size="14" fill="#000000">O</text>
            
            <!-- 坐标轴标签 -->
            <text id="scene1-label-x" x="665" y="195" font-size="14" fill="#000000">x</text>
            <text id="scene1-label-y" x="255" y="60" font-size="14" fill="#000000">y</text>
            
            <!-- 点 A (-1, 0) - 标签放在点左侧，坐标放在下方很远 -->
            <circle id="scene1-point-a" cx="190" cy="200" r="5" fill="#1565c0" opacity="0"/>
            <text id="scene1-label-a" x="165" y="205" text-anchor="end" font-size="14" fill="#000000" opacity="0">A</text>
            <text id="scene1-coord-a" x="190" y="295" text-anchor="middle" font-size="12" fill="#000000" opacity="0">(-1, 0)</text>
            
            <!-- 点 B (3, 0) - 标签放在点右侧，坐标放在下方很远 -->
            <circle id="scene1-point-b" cx="430" cy="200" r="5" fill="#1565c0" opacity="0"/>
            <text id="scene1-label-b" x="455" y="205" text-anchor="start" font-size="14" fill="#000000" opacity="0">B</text>
            <text id="scene1-coord-b" x="430" y="295" text-anchor="middle" font-size="12" fill="#000000" opacity="0">(3, 0)</text>
            
            <!-- 点 C (0, -3) - 标签放在点左侧，坐标放在更左侧下方 -->
            <circle id="scene1-point-c" cx="250" cy="320" r="5" fill="#1565c0" opacity="0"/>
            <text id="scene1-label-c" x="220" y="315" text-anchor="end" font-size="14" fill="#000000" opacity="0">C</text>
            <text id="scene1-coord-c" x="220" y="400" text-anchor="end" font-size="12" fill="#000000" opacity="0">(0, -3)</text>
            
            <!-- 顶点 V (1, -4) - 标签放在点下方 -->
            <circle id="scene1-point-v" cx="310" cy="360" r="4" fill="#1565c0" opacity="0"/>
            <text id="scene1-label-v" x="310" y="410" text-anchor="middle" font-size="12" fill="#000000" opacity="0">(1, -4)</text>
            
            <!-- AB 线段（绿色加粗） -->
            <line id="scene1-segment-ab" x1="190" y1="200" x2="430" y2="200" stroke="#2e7d32" stroke-width="4" opacity="0"/>
            <text id="scene1-label-ab" x="310" y="175" text-anchor="middle" font-size="14" fill="#2e7d32" opacity="0">AB = 4</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/4</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1: 二次函数图像与坐标轴交点
        
        // 状态变量
        let currentState = 0;
        const totalSteps = 4;
        
        // DOM 元素引用
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        
        // 各步骤需要显示的元素
        const stepElements = {
            0: [],  // 初始状态：仅坐标系和抛物线
            1: ['scene1-point-a', 'scene1-label-a', 'scene1-point-b', 'scene1-label-b'],
            2: ['scene1-point-c', 'scene1-label-c'],
            3: ['scene1-coord-a', 'scene1-coord-b', 'scene1-coord-c', 'scene1-point-v', 'scene1-label-v'],
            4: ['scene1-segment-ab', 'scene1-label-ab']
        };
        
        // 显示元素函数
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.opacity = '1';
                el.style.display = '';
            }
        }
        
        // 隐藏元素函数
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.opacity = '0';
                el.style.display = 'none';
            }
        }
        
        // 更新视图
        function updateView() {
            // 根据当前状态显示/隐藏元素
            for (let step = 1; step <= totalSteps; step++) {
                const elements = stepElements[step];
                elements.forEach(id => {
                    if (step <= currentState) {
                        showElement(id);
                    } else {
                        hideElement(id);
                    }
                });
            }
            
            // 更新按钮状态
            btnPrev.disabled = (currentState === 0);
            btnNext.disabled = (currentState === totalSteps);
            
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentState}/${totalSteps}`;
        }
        
        // 上一步
        function prevStep() {
            if (currentState > 0) {
                currentState--;
                updateView();
            }
        }
        
        // 下一步
        function nextStep() {
            if (currentState < totalSteps) {
                currentState++;
                updateView();
            }
        }
        
        // 绑定事件
        btnPrev.addEventListener('click', prevStep);
        btnNext.addEventListener('click', nextStep);
        
        // 初始化视图
        updateView();
        
    })();
    </script>
</body>
</html>
