<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直角三角板角度关系推导</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        .scene1-triangle {
            fill: none;
            stroke: #000000;
            stroke-width: 2px;
        }
        .scene1-triangle-highlight {
            fill: #1565c0;
            fill-opacity: 0.15;
            stroke: #1565c0;
            stroke-width: 2px;
        }
        .scene1-point {
            fill: #000000;
        }
        .scene1-label {
            font-size: 14px;
            font-family: sans-serif;
            fill: #000000;
        }
        .scene1-angle-arc {
            fill: none;
            stroke-width: 1.5px;
        }
        .scene1-angle-label {
            font-size: 12px;
            font-family: sans-serif;
        }
        .scene1-red {
            stroke: #c62828;
            fill: #c62828;
        }
        .scene1-green {
            stroke: #2e7d32;
            fill: #2e7d32;
        }
        .scene1-right-angle {
            fill: none;
            stroke: #000000;
            stroke-width: 1px;
        }
        .scene1-dashed-line {
            stroke: #888888;
            stroke-width: 2px;
            stroke-dasharray: 5,5;
        }
        .scene1-step-text {
            font-size: 14px;
            font-family: sans-serif;
            fill: #000000;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        .scene1-btn {
            width: 100px;
            height: 30px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #333;
            border-radius: 4px;
            background: #f0f0f0;
        }
        .scene1-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .scene1-btn:hover:not(:disabled) {
            background: #e0e0e0;
        }
        #scene1-step-indicator {
            font-size: 14px;
            font-family: sans-serif;
            min-width: 80px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- 步骤说明文本 -->
            <text id="scene1-step-desc" x="20" y="40" class="scene1-step-text"></text>
            
            <!-- E-C-F 共线虚线 -->
            <line id="scene1-ef-dashed" x1="150" y1="350" x2="650" y2="350" class="scene1-dashed-line"/>
            
            <!-- △ABC 三角形 -->
            <polygon id="scene1-tri-abc" class="scene1-triangle" points="580,100 220,160 520,350"/>
            
            <!-- △DEF 三角形 -->
            <polygon id="scene1-tri-def" class="scene1-triangle" points="550,200 150,350 650,350"/>
            
            <!-- 直角符号 ∠A -->
            <polyline id="scene1-right-angle-a" class="scene1-right-angle" points="565,100 565,115 580,115" fill="none"/>
            
            <!-- 直角符号 ∠EDF -->
            <polyline id="scene1-right-angle-d" class="scene1-right-angle" points="540,205 555,205 555,220" fill="none"/>
            
            <!-- 顶点 -->
            <circle id="scene1-point-a" class="scene1-point" cx="580" cy="100" r="4"/>
            <circle id="scene1-point-b" class="scene1-point" cx="220" cy="160" r="4"/>
            <circle id="scene1-point-c" class="scene1-point" cx="520" cy="350" r="4"/>
            <circle id="scene1-point-d" class="scene1-point" cx="550" cy="200" r="4"/>
            <circle id="scene1-point-e" class="scene1-point" cx="150" cy="350" r="4"/>
            <circle id="scene1-point-f" class="scene1-point" cx="650" cy="350" r="4"/>
            
            <!-- 顶点标签 -->
            <text id="scene1-label-a" x="590" y="90" class="scene1-label">A</text>
            <text id="scene1-label-b" x="205" y="145" class="scene1-label">B</text>
            <text id="scene1-label-c" x="520" y="375" class="scene1-label">C</text>
            <text id="scene1-label-d" x="580" y="190" class="scene1-label">D</text>
            <text id="scene1-label-e" x="135" y="375" class="scene1-label">E</text>
            <text id="scene1-label-f" x="670" y="385" class="scene1-label">F</text>
            
            <!-- 角度弧线 - ∠B=45° -->
            <path id="scene1-arc-b" class="scene1-angle-arc" d="" opacity="0"/>
            <text id="scene1-label-angle-b" x="160" y="55" class="scene1-angle-label" opacity="0">45°</text>
            
            <!-- 角度弧线 - ∠ACB=45° -->
            <path id="scene1-arc-acb" class="scene1-angle-arc" d="" opacity="0"/>
            <text id="scene1-label-angle-acb" x="455" y="265" class="scene1-angle-label" opacity="0">45°</text>
            
            <!-- 角度弧线 - ∠E=30° -->
            <path id="scene1-arc-e" class="scene1-angle-arc" d="" opacity="0"/>
            <text id="scene1-label-angle-e" x="160" y="280" class="scene1-angle-label" opacity="0">30°</text>
            
            <!-- 角度弧线 - ∠F=60° -->
            <path id="scene1-arc-f" class="scene1-angle-arc" d="" opacity="0"/>
            <text id="scene1-label-angle-f" x="645" y="260" class="scene1-angle-label" opacity="0">60°</text>
            
            <!-- 角度弧线 - ∠BCE=40° -->
            <path id="scene1-arc-bce" class="scene1-angle-arc scene1-red" d="" opacity="0"/>
            <text id="scene1-label-angle-bce" x="435" y="260" class="scene1-angle-label scene1-red" opacity="0">40°</text>
            
            <!-- 角度弧线 - ∠ACF=95° -->
            <path id="scene1-arc-acf" class="scene1-angle-arc scene1-green" d="" opacity="0"/>
            <text id="scene1-label-angle-acf" x="545" y="260" class="scene1-angle-label scene1-green" opacity="0">95°</text>
            
            <!-- 角度弧线 - ∠CDF=25° -->
            <path id="scene1-arc-cdf" class="scene1-angle-arc scene1-green" d="" opacity="0"/>
            <text id="scene1-label-angle-cdf" x="625" y="150" class="scene1-angle-label scene1-green" opacity="0" font-weight="bold">25°</text>
            
            <!-- △CDF 高亮 -->
            <polygon id="scene1-tri-cdf" class="scene1-triangle-highlight" points="520,350 550,200 650,350" opacity="0"/>
            
            <!-- 步骤 4 的关系式 -->
            <text id="scene1-formula" x="20" y="420" class="scene1-step-text" opacity="0">∠CDF = 180° - 95° - 60° = 25°</text>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/5</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现 - 直角三角板角度关系推导
        
        // 布局坐标表（实现对照依据）：
        // | 元素 | 坐标 |
        // | A | (580,100) |
        // | B | (220,160) |
        // | C | (520,350) |
        // | D | (550,200) |
        // | E | (150,350) |
        // | F | (650,350) |
        
        let currentStep = 0;
        const totalSteps = 5;
        
        // 获取 DOM 元素
        const stepDesc = document.getElementById('scene1-step-desc');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        
        // 三角形
        const triAbc = document.getElementById('scene1-tri-abc');
        const triDef = document.getElementById('scene1-tri-def');
        const triCdf = document.getElementById('scene1-tri-cdf');
        
        // 直角符号
        const rightAngleA = document.getElementById('scene1-right-angle-a');
        const rightAngleD = document.getElementById('scene1-right-angle-d');
        
        // 角度弧线
        const arcB = document.getElementById('scene1-arc-b');
        const arcAcb = document.getElementById('scene1-arc-acb');
        const arcE = document.getElementById('scene1-arc-e');
        const arcF = document.getElementById('scene1-arc-f');
        const arcBce = document.getElementById('scene1-arc-bce');
        const arcAcf = document.getElementById('scene1-arc-acf');
        const arcCdf = document.getElementById('scene1-arc-cdf');
        
        // 角度标签
        const labelAngleB = document.getElementById('scene1-label-angle-b');
        const labelAngleAcb = document.getElementById('scene1-label-angle-acb');
        const labelAngleE = document.getElementById('scene1-label-angle-e');
        const labelAngleF = document.getElementById('scene1-label-angle-f');
        const labelAngleBce = document.getElementById('scene1-label-angle-bce');
        const labelAngleAcf = document.getElementById('scene1-label-angle-acf');
        const labelAngleCdf = document.getElementById('scene1-label-angle-cdf');
        
        // 公式
        const formula = document.getElementById('scene1-formula');
        
        // 绘制角度弧线函数
        function drawArc(cx, cy, r, startAngle, endAngle) {
            const startRad = startAngle * Math.PI / 180;
            const endRad = endAngle * Math.PI / 180;
            const x1 = cx + r * Math.cos(startRad);
            const y1 = cy + r * Math.sin(startRad);
            const x2 = cx + r * Math.cos(endRad);
            const y2 = cy + r * Math.sin(endRad);
            const largeArc = endAngle - startAngle > 180 ? 1 : 0;
            return `M ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2}`;
        }
        
        // 初始化角度弧线
        // ∠B=45°: 以 B(220,160) 为圆心，从 BA 到 BC
        const angleBA = Math.atan2(100-160, 580-220) * 180 / Math.PI; // ≈ -9.5°
        const angleBC = Math.atan2(350-160, 520-220) * 180 / Math.PI; // ≈ 32.3°
        arcB.setAttribute('d', drawArc(220, 160, 25, angleBA, angleBC));
        
        // ∠ACB=45°: 以 C(520,350) 为圆心，从 CB 到 CA
        const angleCB = Math.atan2(160-350, 220-520) * 180 / Math.PI; // ≈ -147.7°
        const angleCA = Math.atan2(100-350, 580-520) * 180 / Math.PI; // ≈ -76.4°
        arcAcb.setAttribute('d', drawArc(520, 350, 25, angleCB, angleCA));
        
        // ∠E=30°: 以 E(150,350) 为圆心，从 EF 到 ED
        const angleEF = 0; // 水平向右
        const angleED = Math.atan2(200-350, 550-150) * 180 / Math.PI; // ≈ -20.6°
        arcE.setAttribute('d', drawArc(150, 350, 25, angleED, angleEF));
        
        // ∠F=60°: 以 F(650,350) 为圆心，从 FD 到 FE
        const angleFD = Math.atan2(200-350, 550-650) * 180 / Math.PI; // ≈ 56.3°
        const angleFE = 180; // 水平向左
        arcF.setAttribute('d', drawArc(650, 350, 25, angleFD, angleFE));
        
        // ∠BCE=40°: 以 C(520,350) 为圆心，从 CE 到 CB
        const angleCE = 180; // 水平向左
        arcBce.setAttribute('d', drawArc(520, 350, 35, angleCE, angleCB));
        
        // ∠ACF=95°: 以 C(520,350) 为圆心，从 CA 到 CF
        const angleCF = 0; // 水平向右
        arcAcf.setAttribute('d', drawArc(520, 350, 45, angleCA, angleCF));
        
        // ∠CDF=25°: 以 D(550,200) 为圆心，从 DC 到 DF
        const angleDC = Math.atan2(350-200, 520-550) * 180 / Math.PI; // ≈ -78.7°
        const angleDF = Math.atan2(350-200, 650-550) * 180 / Math.PI; // ≈ 56.3°
        arcCdf.setAttribute('d', drawArc(550, 200, 30, angleDC, angleDF));
        
        // 显示/隐藏函数
        function show(el) {
            el.style.display = '';
            el.style.opacity = '1';
        }
        
        function hide(el) {
            el.style.display = '';
            el.style.opacity = '0';
        }
        
        // 更新步骤
        function updateStep() {
            // 重置所有元素
            triAbc.classList.remove('scene1-triangle-highlight');
            triAbc.classList.add('scene1-triangle');
            triDef.classList.remove('scene1-triangle-highlight');
            triDef.classList.add('scene1-triangle');
            hide(triCdf);
            hide(rightAngleA);
            hide(rightAngleD);
            hide(arcB); hide(labelAngleB);
            hide(arcAcb); hide(labelAngleAcb);
            hide(arcE); hide(labelAngleE);
            hide(arcF); hide(labelAngleF);
            hide(arcBce); hide(labelAngleBce);
            hide(arcAcf); hide(labelAngleAcf);
            hide(arcCdf); hide(labelAngleCdf);
            hide(formula);
            
            // 根据当前步骤设置状态
            switch(currentStep) {
                case 0:
                    // 初始状态：只显示基础图形
                    stepDesc.textContent = '初始状态：观察两个三角板的摆放位置';
                    break;
                case 1:
                    // 步骤 1：等腰直角三角形 ABC
                    triAbc.classList.remove('scene1-triangle');
                    triAbc.classList.add('scene1-triangle-highlight');
                    show(rightAngleA);
                    show(arcB); show(labelAngleB);
                    show(arcAcb); show(labelAngleAcb);
                    stepDesc.textContent = '步骤 1：分析等腰直角三角形 ABC（∠A=90°, AB=AC → ∠B=∠ACB=45°）';
                    break;
                case 2:
                    // 步骤 2：直角三角形 DEF
                    triDef.classList.remove('scene1-triangle');
                    triDef.classList.add('scene1-triangle-highlight');
                    show(rightAngleD);
                    show(arcE); show(labelAngleE);
                    show(arcF); show(labelAngleF);
                    stepDesc.textContent = '步骤 2：分析直角三角形 DEF（∠EDF=90°, ∠E=30° → ∠F=60°）';
                    break;
                case 3:
                    // 步骤 3：利用平角求∠ACF
                    show(arcBce); show(labelAngleBce);
                    show(arcAcf); show(labelAngleAcf);
                    stepDesc.textContent = '步骤 3：利用平角 E-C-F 求∠ACF（180°-40°-45°=95°）';
                    break;
                case 4:
                    // 步骤 4：三角形内角和求∠CDF
                    triCdf.style.opacity = '1';
                    show(arcCdf); show(labelAngleCdf);
                    show(formula);
                    stepDesc.textContent = '步骤 4：三角形内角和求∠CDF（180°-95°-60°=25°）';
                    break;
            }
            
            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps - 1;
            
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;
        }
        
        // 事件绑定
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStep();
            }
        });
        
        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
