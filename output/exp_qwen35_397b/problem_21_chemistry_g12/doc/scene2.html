<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电路中电子与离子的流动方向</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        .scene2-electrode-label {
            font-size: 14px;
            font-weight: bold;
        }
        .scene2-solution-label {
            font-size: 13px;
        }
        .scene2-ion-label {
            font-size: 14px;
            font-weight: bold;
        }
        .scene2-legend-text {
            font-size: 12px;
        }
        .scene2-step-label {
            font-size: 13px;
            fill: #333;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene2-arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828" />
                </marker>
                <marker id="scene2-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0" />
                </marker>
                <marker id="scene2-arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#2e7d32" />
                </marker>
            </defs>

            <!-- 原电池烧杯 -->
            <g id="scene2-galvanic-cell">
                <!-- 烧杯轮廓 -->
                <path d="M80,200 L80,380 L280,380 L280,200" fill="none" stroke="#000000" stroke-width="2" />
                <!-- 稀硫酸溶液 -->
                <rect x="90" y="280" width="180" height="100" fill="#e3f2fd" opacity="0.8" />
                <line x1="90" y1="280" x2="270" y2="280" stroke="#000000" stroke-width="1" />
                <!-- 锌电极 -->
                <rect id="scene2-zinc-electrode" x="120" y="180" width="30" height="180" fill="#9e9e9e" stroke="#000000" stroke-width="2" />
                <!-- 铜电极 -->
                <rect id="scene2-copper-electrode" x="200" y="180" width="30" height="180" fill="#ff7043" stroke="#000000" stroke-width="2" />
                <!-- 电极标签 -->
                <text id="scene2-label-zn" x="135" y="165" text-anchor="middle" class="scene2-electrode-label">锌</text>
                <text id="scene2-label-cu" x="215" y="165" text-anchor="middle" class="scene2-electrode-label">铜</text>
                <!-- 稀硫酸标签 -->
                <text id="scene2-label-h2so4" x="290" y="350" class="scene2-solution-label">稀硫酸</text>
            </g>

            <!-- 电解池滤纸 -->
            <g id="scene2-electrolytic-cell">
                <!-- 滤纸椭圆 -->
                <ellipse cx="610" cy="290" rx="90" ry="50" fill="#f5f5f5" stroke="#000000" stroke-width="2" />
                <!-- 石墨棒 a -->
                <rect id="scene2-graphite-a" x="550" y="200" width="20" height="120" fill="#616161" stroke="#000000" stroke-width="2" />
                <!-- 石墨棒 b -->
                <rect id="scene2-graphite-b" x="630" y="200" width="20" height="120" fill="#616161" stroke="#000000" stroke-width="2" />
                <!-- 电极标签 -->
                <text id="scene2-label-a" x="560" y="185" text-anchor="middle" class="scene2-electrode-label">a</text>
                <text id="scene2-label-b" x="640" y="185" text-anchor="middle" class="scene2-electrode-label">b</text>
                <!-- 滤纸标签 -->
                <text id="scene2-label-filter" x="710" y="290" class="scene2-solution-label">饱和食盐水滤纸</text>
            </g>

            <!-- 导线 -->
            <g id="scene2-wires">
                <!-- 导线1: 锌→a -->
                <path d="M135,180 L135,150 L560,150 L560,200" fill="none" stroke="#000000" stroke-width="2" />
                <!-- 导线2: 铜→b -->
                <path d="M215,180 L215,150 L640,150 L640,200" fill="none" stroke="#000000" stroke-width="2" />
            </g>

            <!-- 电子流箭头组（外电路） -->
            <g id="scene2-electron-flow" opacity="0">
                <!-- 电子流箭头1: 锌→a -->
                <line id="scene2-arrow-e1" x1="135" y1="170" x2="350" y2="170" stroke="#c62828" stroke-width="2" stroke-dasharray="5,3" opacity="0.7" marker-end="url(#scene2-arrow-red)" />
                <text id="scene2-label-e1" x="240" y="155" text-anchor="middle" class="scene2-ion-label" fill="#c62828">e⁻</text>
                <!-- 电子流箭头2: b→铜 -->
                <line id="scene2-arrow-e2" x1="430" y1="170" x2="640" y2="170" stroke="#c62828" stroke-width="2" stroke-dasharray="5,3" opacity="0.7" marker-end="url(#scene2-arrow-red)" />
                <text id="scene2-label-e2" x="535" y="155" text-anchor="middle" class="scene2-ion-label" fill="#c62828">e⁻</text>
            </g>

            <!-- 原电池内离子移动 -->
            <g id="scene2-galvanic-ions" opacity="0">
                <!-- Zn²⁺离子箭头 -->
                <line id="scene2-arrow-zn" x1="135" y1="300" x2="215" y2="300" stroke="#1565c0" stroke-width="2" opacity="0.7" marker-end="url(#scene2-arrow-blue)" />
                <text id="scene2-label-zn-ion" x="175" y="290" text-anchor="middle" class="scene2-ion-label" fill="#1565c0">Zn²⁺</text>
                <!-- H⁺离子箭头 -->
                <line id="scene2-arrow-h" x1="135" y1="330" x2="215" y2="330" stroke="#1565c0" stroke-width="2" opacity="0.7" marker-end="url(#scene2-arrow-blue)" />
                <text id="scene2-label-h-ion" x="175" y="320" text-anchor="middle" class="scene2-ion-label" fill="#1565c0">H⁺</text>
            </g>

            <!-- 电解池内离子移动 -->
            <g id="scene2-electrolytic-ions" opacity="0">
                <!-- Na⁺离子箭头 -->
                <line id="scene2-arrow-na" x1="560" y1="280" x2="640" y2="280" stroke="#1565c0" stroke-width="2" opacity="0.7" marker-end="url(#scene2-arrow-blue)" />
                <text id="scene2-label-na-ion" x="600" y="270" text-anchor="middle" class="scene2-ion-label" fill="#1565c0">Na⁺</text>
                <!-- Cl⁻离子箭头 -->
                <line id="scene2-arrow-cl" x1="560" y1="310" x2="640" y2="310" stroke="#2e7d32" stroke-width="2" opacity="0.7" marker-end="url(#scene2-arrow-green)" />
                <text id="scene2-label-cl-ion" x="600" y="300" text-anchor="middle" class="scene2-ion-label" fill="#2e7d32">Cl⁻</text>
            </g>

            <!-- 图例框 -->
            <g id="scene2-legend">
                <rect x="620" y="420" width="160" height="70" fill="#ffffff" stroke="#000000" stroke-width="1" />
                <!-- 电子流图例 -->
                <line x1="630" y1="440" x2="660" y2="440" stroke="#c62828" stroke-width="2" stroke-dasharray="5,3" />
                <text x="670" y="445" class="scene2-legend-text">电子流</text>
                <!-- 阳离子图例 -->
                <line x1="630" y1="460" x2="660" y2="460" stroke="#1565c0" stroke-width="2" />
                <text x="670" y="465" class="scene2-legend-text">阳离子</text>
                <!-- 阴离子图例 -->
                <line x1="630" y1="480" x2="660" y2="480" stroke="#2e7d32" stroke-width="2" />
                <text x="670" y="485" class="scene2-legend-text">阴离子</text>
            </g>

            <!-- 滑块控件区域 -->
            <g id="scene2-slider-group">
                <!-- 滑块轨道 -->
                <rect x="250" y="450" width="300" height="10" fill="#bdbdbd" rx="5" />
                <!-- 滑块手柄 -->
                <circle id="scene2-slider-handle" cx="250" cy="455" r="12" fill="#1976d2" style="cursor: pointer;" />
                <!-- 刻度标记 -->
                <line x1="250" y1="465" x2="250" y2="475" stroke="#666" stroke-width="1" />
                <line x1="325" y1="465" x2="325" y2="475" stroke="#666" stroke-width="1" />
                <line x1="400" y1="465" x2="400" y2="475" stroke="#666" stroke-width="1" />
                <line x1="475" y1="465" x2="475" y2="475" stroke="#666" stroke-width="1" />
                <line x1="550" y1="465" x2="550" y2="475" stroke="#666" stroke-width="1" />
                <!-- 步骤说明 -->
                <text id="scene2-step-text" x="400" y="495" text-anchor="middle" class="scene2-step-label">初始状态</text>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 2 实现：电路中电子与离子的流动方向

        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 原电池烧杯 | 容器 | (80,200)-(280,380) | 200×180 | - | 左侧 |
        // | 稀硫酸液面 | 线段 | (90,280)-(270,280) | 180×2 | - | 烧杯内2/3高度 |
        // | 锌电极 | 矩形 | (120,180)-(150,360) | 30×180 | 上方 | 左侧电极 |
        // | 铜电极 | 矩形 | (200,180)-(230,360) | 30×180 | 上方 | 右侧电极 |
        // | 锌标签 | text | (125,165) | ~30×16 | 上方 | 锌电极正上方 |
        // | 铜标签 | text | (205,165) | ~30×16 | 上方 | 铜电极正上方 |
        // | 稀硫酸标签 | text | (285,350) | ~50×16 | 右侧 | 烧杯右侧引线 |
        // | 电解池滤纸 | 椭圆 | (520,240)-(700,340) | 180×100 | - | 右侧 |
        // | 石墨棒a | 矩形 | (550,200)-(570,320) | 20×120 | 上方 | 左侧石墨棒 |
        // | 石墨棒b | 矩形 | (630,200)-(650,320) | 20×120 | 上方 | 右侧石墨棒 |
        // | a标签 | text | (555,185) | ~15×16 | 上方 | a电极正上方 |
        // | b标签 | text | (635,185) | ~15×16 | 上方 | b电极正上方 |
        // | 滤纸标签 | text | (705,290) | ~60×16 | 右侧 | 滤纸右侧 |
        // | 导线1(锌→a) | 路径 | (135,180)-(560,200) | - | - | 折线连接 |
        // | 导线2(铜→b) | 路径 | (215,180)-(640,200) | - | - | 折线连接 |
        // | 电子流箭头1 | 箭头 | (135,170)-(350,170) | 215×4 | 上方 | 锌→a段，红色虚线 |
        // | 电子流箭头2 | 箭头 | (430,170)-(640,170) | 210×4 | 上方 | b→铜段，红色虚线 |
        // | Zn²⁺离子箭头 | 箭头 | (135,300)-(215,300) | 80×4 | 下方 | 原电池内，蓝色实线 |
        // | H⁺离子箭头 | 箭头 | (135,330)-(215,330) | 80×4 | 下方 | 原电池内，蓝色实线 |
        // | Na⁺离子箭头 | 箭头 | (560,280)-(640,280) | 80×4 | 上方 | 电解池内，蓝色实线 |
        // | Cl⁻离子箭头 | 箭头 | (560,310)-(640,310) | 80×4 | 下方 | 电解池内，绿色实线 |
        // | 滑块控件 | input | (250,450)-(550,480) | 300×30 | - | 底部中央 |
        // | 图例框 | 矩形 | (620,420)-(780,490) | 160×70 | - | 右下角 |

        const sliderHandle = document.getElementById('scene2-slider-handle');
        const stepText = document.getElementById('scene2-step-text');
        const electronFlowGroup = document.getElementById('scene2-electron-flow');
        const galvanicIonsGroup = document.getElementById('scene2-galvanic-ions');
        const electrolyticIonsGroup = document.getElementById('scene2-electrolytic-ions');
        const zincElectrode = document.getElementById('scene2-zinc-electrode');
        const copperElectrode = document.getElementById('scene2-copper-electrode');

        let currentStep = 0;
        let isDragging = false;

        const sliderStartX = 250;
        const sliderEndX = 550;
        const stepPositions = [250, 325, 400, 475, 550]; // 5 个位置的 x 坐标
        const stepLabels = ['初始状态', '电子从锌→a', '电子从 b→铜（外电路完成）', '原电池内离子移动', '电解池内离子移动'];

        // 更新显示状态
        function updateDisplay(step) {
            currentStep = step;

            // 更新滑块手柄位置
            sliderHandle.setAttribute('cx', stepPositions[step]);

            // 更新步骤说明
            stepText.textContent = stepLabels[step];

            // 重置所有高亮
            zincElectrode.setAttribute('stroke', '#000000');
            zincElectrode.setAttribute('stroke-width', '2');
            copperElectrode.setAttribute('stroke', '#000000');
            copperElectrode.setAttribute('stroke-width', '2');

            // 根据步骤显示/隐藏元素
            if (step === 0) {
                // 初始状态：无箭头
                electronFlowGroup.setAttribute('opacity', '0');
                galvanicIonsGroup.setAttribute('opacity', '0');
                electrolyticIonsGroup.setAttribute('opacity', '0');
            } else if (step === 1) {
                // 位置 1：电子从锌→a
                electronFlowGroup.setAttribute('opacity', '1');
                galvanicIonsGroup.setAttribute('opacity', '0');
                electrolyticIonsGroup.setAttribute('opacity', '0');
                // 高亮锌电极
                zincElectrode.setAttribute('stroke', '#c62828');
                zincElectrode.setAttribute('stroke-width', '3');
            } else if (step === 2) {
                // 位置 2：电子从 b→铜（完整外电路）
                electronFlowGroup.setAttribute('opacity', '1');
                galvanicIonsGroup.setAttribute('opacity', '0');
                electrolyticIonsGroup.setAttribute('opacity', '0');
                // 高亮铜电极
                copperElectrode.setAttribute('stroke', '#c62828');
                copperElectrode.setAttribute('stroke-width', '3');
            } else if (step === 3) {
                // 位置 3：原电池内离子移动
                electronFlowGroup.setAttribute('opacity', '1');
                galvanicIonsGroup.setAttribute('opacity', '1');
                electrolyticIonsGroup.setAttribute('opacity', '0');
            } else if (step === 4) {
                // 位置 4：电解池内离子移动（完整电路）
                electronFlowGroup.setAttribute('opacity', '1');
                galvanicIonsGroup.setAttribute('opacity', '1');
                electrolyticIonsGroup.setAttribute('opacity', '1');
            }
        }

        // 滑块拖拽处理
        function handleMouseDown(e) {
            isDragging = true;
            e.preventDefault();
        }

        function handleMouseMove(e) {
            if (!isDragging) return;

            const svgRect = document.getElementById('scene2-svg').getBoundingClientRect();
            let clientX = e.clientX;
            if (e.touches) {
                clientX = e.touches[0].clientX;
            }

            let newX = clientX - svgRect.left;
            // 限制在滑块轨道范围内
            newX = Math.max(sliderStartX, Math.min(sliderEndX, newX));

            // 找到最近的吸附位置
            let nearestStep = 0;
            let minDist = Math.abs(newX - stepPositions[0]);
            for (let i = 1; i < stepPositions.length; i++) {
                const dist = Math.abs(newX - stepPositions[i]);
                if (dist < minDist) {
                    minDist = dist;
                    nearestStep = i;
                }
            }

            // 只有当距离足够近时才吸附
            if (minDist < 40) {
                updateDisplay(nearestStep);
            } else {
                // 否则跟随鼠标
                sliderHandle.setAttribute('cx', newX);
            }
        }

        function handleMouseUp() {
            if (!isDragging) return;
            isDragging = false;

            // 最终吸附到最近的位置
            const currentX = parseFloat(sliderHandle.getAttribute('cx'));
            let nearestStep = 0;
            let minDist = Math.abs(currentX - stepPositions[0]);
            for (let i = 1; i < stepPositions.length; i++) {
                const dist = Math.abs(currentX - stepPositions[i]);
                if (dist < minDist) {
                    minDist = dist;
                    nearestStep = i;
                }
            }
            updateDisplay(nearestStep);
        }

        // 绑定事件
        sliderHandle.addEventListener('mousedown', handleMouseDown);
        sliderHandle.addEventListener('touchstart', handleMouseDown);

        document.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('touchmove', handleMouseMove);

        document.addEventListener('mouseup', handleMouseUp);
        document.addEventListener('touchend', handleMouseUp);

        // 初始化
        updateDisplay(0);
    })();
    </script>
</body>
</html>
