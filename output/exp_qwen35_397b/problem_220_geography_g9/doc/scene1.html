<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>热力环流侧视图 - 场景 1</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: "Microsoft YaHei", sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        /* 元素显隐控制 */
        .hidden {
            opacity: 0;
            display: none;
        }
        .visible {
            opacity: 1;
            display: block;
        }
        /* 箭头动画 */
        .arrow-path {
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
        }
        .arrow-draw {
            stroke-dasharray: 200;
            stroke-dashoffset: 200;
            transition: stroke-dashoffset 0.6s ease-out, opacity 0.4s ease;
        }
        .arrow-draw.active {
            stroke-dashoffset: 0;
            opacity: 1;
        }
        /* 按钮样式 */
        .scene1-btn {
            padding: 8px 20px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: #1976d2;
            color: white;
            transition: background 0.2s;
        }
        .scene1-btn:hover {
            background: #1565c0;
        }
        .scene1-btn:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
        }
        .scene1-step-indicator {
            font-size: 14px;
            color: #424242;
            min-width: 80px;
            text-align: center;
        }
        /* 受热冷却标识 - 半透明背景 */
        .heat-label-bg {
            fill: #2e7d32;
            opacity: 0.15;
        }
        .cool-label-bg {
            fill: #f57c00;
            opacity: 0.15;
        }
        /* 温度气压标注 */
        .temp-label {
            fill: #1565c0;
            font-size: 16px;
            font-weight: bold;
        }
        .pressure-label {
            fill: #c62828;
            font-size: 16px;
            font-weight: bold;
        }
        /* 结论框 */
        .conclusion-box {
            fill: #fff9c4;
            stroke: #fbc02d;
            stroke-width: 2;
        }
        .conclusion-text {
            fill: #333333;
            font-size: 13px;
        }
        /* 高亮效果 */
        .highlight-point {
            fill: #ffeb3b;
            stroke: #f57f17;
            stroke-width: 2;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828" />
                </marker>
                <marker id="scene1-arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0" />
                </marker>
                <marker id="scene1-arrowhead-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#7b1fa2" />
                </marker>
                <marker id="scene1-arrowhead-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#f57c00" />
                </marker>
                <marker id="scene1-arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#2e7d32" />
                </marker>
            </defs>

            <!-- 环流框架（始终显示） -->
            <g id="scene1-frame-group">
                <!-- 近地面线 ab -->
                <line id="scene1-line-ab" x1="250" y1="350" x2="550" y2="350" stroke="#000000" stroke-width="2" />
                <!-- 高空线 cd -->
                <line id="scene1-line-cd" x1="250" y1="150" x2="550" y2="150" stroke="#000000" stroke-width="2" />
                <!-- 左侧线 da -->
                <line id="scene1-line-da" x1="250" y1="150" x2="250" y2="350" stroke="#000000" stroke-width="2" />
                <!-- 右侧线 bc -->
                <line id="scene1-line-bc" x1="550" y1="150" x2="550" y2="350" stroke="#000000" stroke-width="2" />
            </g>

            <!-- 四个顶点（始终显示） -->
            <g id="scene1-points-group">
                <circle id="scene1-point-a" cx="250" cy="350" r="4" fill="#000000" />
                <circle id="scene1-point-b" cx="550" cy="350" r="4" fill="#000000" />
                <circle id="scene1-point-c" cx="550" cy="150" r="4" fill="#000000" />
                <circle id="scene1-point-d" cx="250" cy="150" r="4" fill="#000000" />
            </g>

            <!-- 点标签（始终显示） -->
            <g id="scene1-labels-group">
                <text id="scene1-label-a" x="230" y="370" font-size="14" fill="#000000">a</text>
                <text id="scene1-label-b" x="570" y="370" font-size="14" fill="#000000">b</text>
                <text id="scene1-label-c" x="570" y="135" font-size="14" fill="#000000">c</text>
                <text id="scene1-label-d" x="230" y="135" font-size="14" fill="#000000">d</text>
            </g>

            <!-- 受热冷却标识（步骤 1-2 显示）- 放在环流框外侧下方，远离点标签和箭头 -->
            <g id="scene1-heat-group" class="hidden">
                <text id="scene1-heat-text" x="550" y="425" font-size="14" fill="#2e7d32" text-anchor="middle">受热</text>
            </g>
            <g id="scene1-cool-group" class="hidden">
                <text id="scene1-cool-text" x="250" y="425" font-size="14" fill="#f57c00" text-anchor="middle">冷却</text>
            </g>

            <!-- 箭头组（步骤 1-3 显示） -->
            <g id="scene1-arrows-group">
                <!-- 箭头①：高空水平气流 c→d（从右到左） -->
                <g id="scene1-arrow-1-group" class="hidden">
                    <path id="scene1-arrow-1" d="M520,130 L280,130" class="arrow-path arrow-draw" stroke="#7b1fa2" marker-end="url(#scene1-arrowhead-purple)" />
                    <text id="scene1-arrow-label-1" x="400" y="110" font-size="14" fill="#7b1fa2" text-anchor="middle">①</text>
                </g>
                <!-- 箭头②：上升气流 b→c -->
                <g id="scene1-arrow-2-group" class="hidden">
                    <path id="scene1-arrow-2" d="M580,330 L580,170" class="arrow-path arrow-draw" stroke="#c62828" marker-end="url(#scene1-arrowhead-red)" />
                    <text id="scene1-arrow-label-2" x="600" y="250" font-size="14" fill="#c62828" text-anchor="middle">②</text>
                </g>
                <!-- 箭头③：近地面水平气流 a→b（放在 ab 线下方，受热冷却标识上方） -->
                <g id="scene1-arrow-3-group" class="hidden">
                    <path id="scene1-arrow-3" d="M280,385 L520,385" class="arrow-path arrow-draw" stroke="#f57c00" marker-end="url(#scene1-arrowhead-orange)" />
                    <text id="scene1-arrow-label-3" x="400" y="405" font-size="14" fill="#f57c00" text-anchor="middle">③</text>
                </g>
                <!-- 箭头④：下沉气流 d→a -->
                <g id="scene1-arrow-4-group" class="hidden">
                    <path id="scene1-arrow-4" d="M200,170 L200,330" class="arrow-path arrow-draw" stroke="#1565c0" marker-end="url(#scene1-arrowhead-blue)" />
                    <text id="scene1-arrow-label-4" x="180" y="250" font-size="14" fill="#1565c0" text-anchor="middle">④</text>
                </g>
            </g>

            <!-- 温度标注区（步骤 4 显示） -->
            <g id="scene1-temp-group" class="hidden">
                <text id="scene1-temp-title" x="40" y="145" font-size="16" fill="#1565c0" font-weight="bold">温度分布</text>
                <text id="scene1-temp-values" x="40" y="180" font-size="15" fill="#1565c0">b &gt; a &gt; d &gt; c</text>
            </g>

            <!-- 气压标注区（步骤 5 显示） -->
            <g id="scene1-pressure-group" class="hidden">
                <text id="scene1-pressure-title" x="680" y="145" font-size="16" fill="#c62828" font-weight="bold">气压分布</text>
                <text id="scene1-pressure-values" x="680" y="180" font-size="15" fill="#c62828">a &gt; b &gt; c &gt; d</text>
            </g>

            <!-- 结论框（步骤 6 显示）- 放在控件栏上方，与受热冷却标识不重叠 -->
            <g id="scene1-conclusion-group" class="hidden">
                <rect id="scene1-conclusion-rect" x="100" y="445" width="600" height="28" class="conclusion-box" />
                <text id="scene1-conclusion-text" x="400" y="465" font-size="12" fill="#333333" text-anchor="middle">
                    选项 A 错误（温度应为 b&gt;a，而非 a&gt;b）；选项 B 错误（气压应为 a&gt;b&gt;c&gt;d，而非 d&gt;a&gt;b&gt;c）
                </text>
            </g>

            <!-- 控件栏背景（始终显示，但在结论框下方层级） -->
            <g id="scene1-controls-group">
                <rect x="0" y="440" width="800" height="60" fill="#f5f5f5" opacity="0.95" />
                <line x1="0" y1="440" x2="800" y2="440" stroke="#e0e0e0" stroke-width="1" />
            </g>
        </svg>

        <!-- HTML 控件栏（叠在 SVG 底部） -->
        <div id="scene1-controls" style="position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 10;">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <span id="scene1-step-indicator" class="scene1-step-indicator">步骤 1/7</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1: 热力环流侧视图

        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 近地面线 ab | 线段 | (250,350)-(550,350) | 300×2 | - | 水平黑色实线 |
        // | 高空线 cd | 线段 | (250,150)-(550,150) | 300×2 | - | 水平黑色实线 |
        // | 左侧线 da | 线段 | (250,150)-(250,350) | 2×200 | - | 竖直黑色实线 |
        // | 右侧线 bc | 线段 | (550,150)-(550,350) | 2×200 | - | 竖直黑色实线 |
        // | 点 a | 圆点 | (250,350) | r=4 | - | 左下顶点 |
        // | 点 b | 圆点 | (550,350) | r=4 | - | 右下顶点 |
        // | 点 c | 圆点 | (550,150) | r=4 | - | 右上顶点 |
        // | 点 d | 圆点 | (250,150) | r=4 | - | 左上顶点 |
        // | 标签 a | text | (230,370) | ~12×16 | 左下 | 在点 a 左下方 |
        // | 标签 b | text | (570,370) | ~12×16 | 右下 | 在点 b 右下方 |
        // | 标签 c | text | (570,135) | ~12×16 | 右上 | 在点 c 右上方 |
        // | 标签 d | text | (230,135) | ~12×16 | 左上 | 在点 d 左上方 |
        // | 箭头① | 箭头 | (520,130)-(280,130) | 240×15 | 上方 | 高空水平气流 c→d |
        // | 箭头② | 箭头 | (580,330)-(580,170) | 15×160 | 右侧 | 上升气流 b→c |
        // | 箭头③ | 箭头 | (280,385)-(520,385) | 240×15 | 下方 | 近地面水平气流 a→b |
        // | 箭头④ | 箭头 | (200,170)-(200,330) | 15×160 | 左侧 | 下沉气流 d→a |
        // | 标签① | text | (400,110) | ~16×16 | 上方 | 箭头①中点上方 |
        // | 标签② | text | (600,250) | ~16×16 | 右侧 | 箭头②中点右侧 |
        // | 标签③ | text | (400,405) | ~16×16 | 下方 | 箭头③中点下方 |
        // | 标签④ | text | (180,250) | ~16×16 | 左侧 | 箭头④中点左侧 |
        // | 受热文字 | text | (550,425) | ~40×16 | - | "受热"绿色文字 |
        // | 冷却文字 | text | (250,425) | ~40×16 | - | "冷却"橙色文字 |
        // | 温度标题 | text | (40,145) | ~60×20 | - | "温度分布"蓝色 |
        // | 温度标注 | text | (40,180) | ~70×50 | - | "b>a>d>c"蓝色 |
        // | 气压标题 | text | (680,145) | ~60×20 | - | "气压分布"红色 |
        // | 气压标注 | text | (680,180) | ~70×50 | - | "a>b>c>d"红色 |
        // | 结论框 | rect+text | (100,445)-(700,473) | 600×28 | - | 最终步骤显示验证结论 |
        // | 控件栏 | div | (0,440)-(800,490) | 800×50 | - | 底部绝对定位 |

        // 状态管理
        let currentState = 0;
        const totalSteps = 7;

        // DOM 元素引用
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        // 元素组引用
        const heatGroup = document.getElementById('scene1-heat-group');
        const coolGroup = document.getElementById('scene1-cool-group');
        const arrow1Group = document.getElementById('scene1-arrow-1-group');
        const arrow2Group = document.getElementById('scene1-arrow-2-group');
        const arrow3Group = document.getElementById('scene1-arrow-3-group');
        const arrow4Group = document.getElementById('scene1-arrow-4-group');
        const tempGroup = document.getElementById('scene1-temp-group');
        const pressureGroup = document.getElementById('scene1-pressure-group');
        const conclusionGroup = document.getElementById('scene1-conclusion-group');

        // 箭头路径元素（用于动画）
        const arrow1 = document.getElementById('scene1-arrow-1');
        const arrow2 = document.getElementById('scene1-arrow-2');
        const arrow3 = document.getElementById('scene1-arrow-3');
        const arrow4 = document.getElementById('scene1-arrow-4');

        // 高亮点引用
        const pointA = document.getElementById('scene1-point-a');
        const pointB = document.getElementById('scene1-point-b');

        // 工具函数：显示元素
        function show(el) {
            el.classList.remove('hidden');
            el.classList.add('visible');
        }

        // 工具函数：隐藏元素
        function hide(el) {
            el.classList.remove('visible');
            el.classList.add('hidden');
        }

        // 工具函数：重置箭头动画
        function resetArrowAnimation(arrowEl) {
            arrowEl.classList.remove('active');
            // 强制重绘
            void arrowEl.offsetWidth;
        }

        // 工具函数：触发箭头动画
        function triggerArrowAnimation(arrowEl) {
            setTimeout(() => {
                arrowEl.classList.add('active');
            }, 50);
        }

        // 渲染状态函数
        function renderState(step) {
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${step + 1}/${totalSteps}`;

            // 更新按钮状态
            btnPrev.disabled = (step === 0);
            btnNext.disabled = (step === totalSteps - 1);

            // 重置所有箭头动画
            resetArrowAnimation(arrow1);
            resetArrowAnimation(arrow2);
            resetArrowAnimation(arrow3);
            resetArrowAnimation(arrow4);

            // 重置高亮
            pointA.setAttribute('r', '4');
            pointA.setAttribute('fill', '#000000');
            pointB.setAttribute('r', '4');
            pointB.setAttribute('fill', '#000000');

            // 根据步骤显示/隐藏元素
            switch(step) {
                case 0:
                    // 初始状态：只显示框架、点、标签
                    hide(heatGroup);
                    hide(coolGroup);
                    hide(arrow1Group);
                    hide(arrow2Group);
                    hide(arrow3Group);
                    hide(arrow4Group);
                    hide(tempGroup);
                    hide(pressureGroup);
                    hide(conclusionGroup);
                    break;

                case 1:
                    // 步骤 1：显示 b 处受热标识、箭头②（上升气流）
                    show(heatGroup);
                    hide(coolGroup);
                    hide(arrow1Group);
                    show(arrow2Group);
                    hide(arrow3Group);
                    hide(arrow4Group);
                    hide(tempGroup);
                    hide(pressureGroup);
                    hide(conclusionGroup);
                    triggerArrowAnimation(arrow2);
                    break;

                case 2:
                    // 步骤 2：显示 a 处冷却标识、箭头④（下沉气流）
                    show(heatGroup);
                    show(coolGroup);
                    hide(arrow1Group);
                    show(arrow2Group);
                    hide(arrow3Group);
                    show(arrow4Group);
                    hide(tempGroup);
                    hide(pressureGroup);
                    hide(conclusionGroup);
                    triggerArrowAnimation(arrow2);
                    triggerArrowAnimation(arrow4);
                    break;

                case 3:
                    // 步骤 3：显示箭头①和③，形成完整环流
                    show(heatGroup);
                    show(coolGroup);
                    show(arrow1Group);
                    show(arrow2Group);
                    show(arrow3Group);
                    show(arrow4Group);
                    hide(tempGroup);
                    hide(pressureGroup);
                    hide(conclusionGroup);
                    triggerArrowAnimation(arrow1);
                    triggerArrowAnimation(arrow2);
                    triggerArrowAnimation(arrow3);
                    triggerArrowAnimation(arrow4);
                    break;

                case 4:
                    // 步骤 4：显示温度标注区，高亮 b 点和 a 点
                    show(heatGroup);
                    show(coolGroup);
                    show(arrow1Group);
                    show(arrow2Group);
                    show(arrow3Group);
                    show(arrow4Group);
                    show(tempGroup);
                    hide(pressureGroup);
                    hide(conclusionGroup);
                    // 高亮 b 点（受热温度最高）
                    pointB.setAttribute('r', '6');
                    pointB.setAttribute('fill', '#ffeb3b');
                    // 高亮 a 点（冷却温度较低）
                    pointA.setAttribute('r', '6');
                    pointA.setAttribute('fill', '#ffeb3b');
                    break;

                case 5:
                    // 步骤 5：显示气压标注区
                    show(heatGroup);
                    show(coolGroup);
                    show(arrow1Group);
                    show(arrow2Group);
                    show(arrow3Group);
                    show(arrow4Group);
                    show(tempGroup);
                    show(pressureGroup);
                    hide(conclusionGroup);
                    pointB.setAttribute('r', '6');
                    pointB.setAttribute('fill', '#ffeb3b');
                    pointA.setAttribute('r', '6');
                    pointA.setAttribute('fill', '#ffeb3b');
                    break;

                case 6:
                    // 步骤 6：显示结论框
                    show(heatGroup);
                    show(coolGroup);
                    show(arrow1Group);
                    show(arrow2Group);
                    show(arrow3Group);
                    show(arrow4Group);
                    show(tempGroup);
                    show(pressureGroup);
                    show(conclusionGroup);
                    pointB.setAttribute('r', '6');
                    pointB.setAttribute('fill', '#ffeb3b');
                    pointA.setAttribute('r', '6');
                    pointA.setAttribute('fill', '#ffeb3b');
                    break;
            }
        }

        // 事件处理：上一步
        btnPrev.addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                renderState(currentState);
            }
        });

        // 事件处理：下一步
        btnNext.addEventListener('click', function() {
            if (currentState < totalSteps - 1) {
                currentState++;
                renderState(currentState);
            }
        });

        // 初始化
        renderState(currentState);

    })();
    </script>
</body>
</html>
