<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太阳直射点移动规律与南北半球季节对比</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 左侧坐标图区 -->
            
            <!-- 纵轴（纬度） -->
            <line id="scene2-axis-y" x1="80" y1="300" x2="80" y2="50" stroke="#000000" stroke-width="2"/>
            
            <!-- 横轴（月份） -->
            <line id="scene2-axis-x" x1="80" y1="300" x2="440" y2="300" stroke="#000000" stroke-width="2"/>
            
            <!-- 北回归线虚线 -->
            <line id="scene2-line-tropic-n" x1="80" y1="50" x2="440" y2="50" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
            
            <!-- 赤道虚线 -->
            <line id="scene2-line-equator" x1="80" y1="175" x2="440" y2="175" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
            
            <!-- 南回归线虚线 -->
            <line id="scene2-line-tropic-s" x1="80" y1="300" x2="440" y2="300" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
            
            <!-- 直射点轨迹正弦曲线 -->
            <path id="scene2-curve-trajectory" d="M 80,175 C 170,50 260,50 350,175 S 440,300 440,300" fill="none" stroke="#1565c0" stroke-width="3"/>
            
            <!-- 直射点标记（红色圆点，随滑块移动） -->
            <circle id="scene2-dot-sun" cx="260" cy="50" r="8" fill="#c62828"/>
            
            <!-- 纬度标签（左移，确保不超出边界） -->
            <text id="scene2-label-23-5n" x="72" y="55" font-size="14" fill="#000000" text-anchor="end">23.5°N</text>
            <text id="scene2-label-0" x="72" y="180" font-size="14" fill="#000000" text-anchor="end">0°</text>
            <text id="scene2-label-23-5s" x="72" y="305" font-size="14" fill="#000000" text-anchor="end">23.5°S</text>
            
            <!-- 月份标签（下移，确保不超出边界） -->
            <text id="scene2-label-jan" x="80" y="325" font-size="14" fill="#000000" text-anchor="middle">1 月</text>
            <text id="scene2-label-jun" x="260" y="325" font-size="14" fill="#000000" text-anchor="middle">6 月</text>
            <text id="scene2-label-dec" x="440" y="325" font-size="14" fill="#000000" text-anchor="middle">12 月</text>
            
            <!-- 节气标签（下移，确保距边缘≥20px） -->
            <text id="scene2-label-spring" x="170" y="40" font-size="14" fill="#000000" text-anchor="middle">春分</text>
            <text id="scene2-label-summer" x="260" y="40" font-size="14" fill="#000000" text-anchor="middle">夏至</text>
            <text id="scene2-label-autumn" x="350" y="40" font-size="14" fill="#000000" text-anchor="middle">秋分</text>
            <text id="scene2-label-winter" x="440" y="40" font-size="14" fill="#000000" text-anchor="middle">冬至</text>
            
            <!-- 右侧季节表区 -->
            
            <!-- 北半球标题 -->
            <text id="scene2-title-north" x="640" y="70" font-size="16" fill="#000000" text-anchor="middle" font-weight="bold">北半球</text>
            
            <!-- 北半球季节框 -->
            <rect id="scene2-box-north" x="510" y="85" width="260" height="70" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
            <text id="scene2-text-north-season" x="640" y="130" font-size="18" fill="#1565c0" text-anchor="middle" font-weight="bold">夏季</text>
            
            <!-- 南半球标题 -->
            <text id="scene2-title-south" x="640" y="190" font-size="16" fill="#000000" text-anchor="middle" font-weight="bold">南半球</text>
            
            <!-- 南半球季节框 -->
            <rect id="scene2-box-south" x="510" y="205" width="260" height="70" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
            <text id="scene2-text-south-season" x="640" y="250" font-size="18" fill="#c62828" text-anchor="middle" font-weight="bold">冬季</text>
            
            <!-- 当前月份显示（左移，避免与 12 月标签重叠） -->
            <text id="scene2-text-month" x="320" y="345" font-size="16" fill="#2e7d32" text-anchor="middle" font-weight="bold">6 月 夏至</text>
            
            <!-- 直射点纬度显示（下移，增加与月份显示的间距到 20px） -->
            <text id="scene2-text-latitude" x="320" y="385" font-size="14" fill="#2e7d32" text-anchor="middle">直射点纬度：23.5°N</text>
            
            <!-- 滑块轨道 -->
            <line id="scene2-slider-track" x1="50" y1="425" x2="750" y2="425" stroke="#888888" stroke-width="6" stroke-linecap="round"/>
            
            <!-- 滑块手柄 -->
            <circle id="scene2-slider-handle" cx="400" cy="425" r="12" fill="#2e7d32" style="cursor: pointer"/>
            
            <!-- 滑块刻度标签 -->
            <text id="scene2-text-slider-jan" x="50" y="455" font-size="12" fill="#000000" text-anchor="middle">1 月</text>
            <text id="scene2-text-slider-jun" x="400" y="455" font-size="12" fill="#000000" text-anchor="middle">6 月</text>
            <text id="scene2-text-slider-dec" x="750" y="455" font-size="12" fill="#000000" text-anchor="middle">12 月</text>
        </svg>
        
        <div id="scene2-controls"></div>
    </div>
    
    <script>
    (function() {
        // Scene 2: 太阳直射点移动规律与南北半球季节对比
        
        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 左侧坐标图区 | 区域 | (0,0)-(480,440) | 480×440 | - | 占画布 60% 宽度 |
        // | 右侧季节表区 | 区域 | (480,0)-(800,440) | 320×440 | - | 占画布 40% 宽度 |
        // | 纵轴（纬度） | 线段 | (80,300)-(80,50) | 2×250 | - | y 轴，纬度刻度 |
        // | 横轴（月份） | 线段 | (80,300)-(440,300) | 360×2 | - | x 轴，月份刻度 |
        // | 北回归线 | 虚线 | (80,50)-(440,50) | 360×2 | 右侧 | 23.5°N |
        // | 赤道线 | 虚线 | (80,175)-(440,175) | 360×2 | 右侧 | 0° |
        // | 南回归线 | 虚线 | (80,300)-(440,300) | 360×2 | 右侧 | 23.5°S |
        // | 直射点轨迹 | 正弦曲线 | (80,175)→(440,300) | 360×250 | - | 蓝色实线 |
        // | 直射点标记 | 红圆 | 沿曲线移动 | r=8 | - | 随滑块移动 |
        
        // 获取 DOM 元素
        const sliderHandle = document.getElementById('scene2-slider-handle');
        const sunDot = document.getElementById('scene2-dot-sun');
        const textMonth = document.getElementById('scene2-text-month');
        const textLatitude = document.getElementById('scene2-text-latitude');
        const textNorthSeason = document.getElementById('scene2-text-north-season');
        const textSouthSeason = document.getElementById('scene2-text-south-season');
        
        // 滑块参数
        const sliderStartX = 50;
        const sliderEndX = 750;
        const sliderLength = sliderEndX - sliderStartX;
        
        // 当前滑块值 (0-100)
        let sliderValue = 50; // 初始 50%，对应 6 月夏至
        let isDragging = false;
        
        // 计算直射点位置（正弦曲线）
        // sliderValue 0-100 对应 1 月到 12 月再到 1 月
        // 正弦曲线：y = 175 - 125 * sin((sliderValue / 100) * 2π - π/2)
        // x = 80 + (sliderValue / 100) * 360
        function calculatePosition(value) {
            const normalizedValue = value / 100;
            const x = 80 + normalizedValue * 360;
            // 正弦曲线：从 1 月 (冬至，最低点) 开始，到 6 月 (夏至，最高点)，再到 12 月 (冬至)
            // sin 函数：0 时=-1 (最低), 0.25 时=0, 0.5 时=1 (最高), 0.75 时=0, 1 时=-1
            const angle = normalizedValue * 2 * Math.PI - Math.PI / 2;
            const y = 175 - 125 * Math.sin(angle);
            return { x, y };
        }
        
        // 计算直射点纬度
        function calculateLatitude(value) {
            const normalizedValue = value / 100;
            const angle = normalizedValue * 2 * Math.PI - Math.PI / 2;
            const lat = 23.5 * Math.sin(angle);
            return lat;
        }
        
        // 获取月份和节气
        function getMonthAndTerm(value) {
            const month = Math.floor(value / 100 * 12) + 1;
            let term = '';
            
            // 节气判断（吸附点）
            if (value <= 3) {
                term = '冬至';
            } else if (value >= 22 && value <= 28) {
                term = '春分';
            } else if (value >= 47 && value <= 53) {
                term = '夏至';
            } else if (value >= 72 && value <= 78) {
                term = '秋分';
            } else if (value >= 97) {
                term = '冬至';
            } else {
                // 根据月份判断大致节气范围
                if (month <= 2) term = '冬季';
                else if (month <= 5) term = '春季';
                else if (month <= 8) term = '夏季';
                else if (month <= 11) term = '秋季';
                else term = '冬季';
            }
            
            return { month, term };
        }
        
        // 获取季节
        function getSeason(month) {
            let northSeason, southSeason;
            if (month >= 3 && month <= 5) {
                northSeason = '春季';
                southSeason = '秋季';
            } else if (month >= 6 && month <= 8) {
                northSeason = '夏季';
                southSeason = '冬季';
            } else if (month >= 9 && month <= 11) {
                northSeason = '秋季';
                southSeason = '春季';
            } else {
                northSeason = '冬季';
                southSeason = '夏季';
            }
            return { northSeason, southSeason };
        }
        
        // 吸附效果
        function snapToKeyPoint(value) {
            const keyPoints = [0, 25, 50, 75, 100];
            const snapRange = 3;
            
            for (const point of keyPoints) {
                if (Math.abs(value - point) <= snapRange) {
                    return point;
                }
            }
            return value;
        }
        
        // 更新显示
        function updateDisplay() {
            // 更新直射点位置
            const pos = calculatePosition(sliderValue);
            sunDot.setAttribute('cx', pos.x);
            sunDot.setAttribute('cy', pos.y);
            
            // 更新滑块手柄位置
            const handleX = sliderStartX + (sliderValue / 100) * sliderLength;
            sliderHandle.setAttribute('cx', handleX);
            
            // 更新月份和节气显示
            const { month, term } = getMonthAndTerm(sliderValue);
            textMonth.textContent = month + '月 ' + term;
            
            // 更新纬度显示
            const lat = calculateLatitude(sliderValue);
            if (Math.abs(lat) < 0.5) {
                textLatitude.textContent = '直射点纬度：0°';
            } else if (lat > 0) {
                textLatitude.textContent = '直射点纬度：' + lat.toFixed(1) + '°N';
            } else {
                textLatitude.textContent = '直射点纬度：' + Math.abs(lat).toFixed(1) + '°S';
            }
            
            // 更新季节显示
            const { northSeason, southSeason } = getSeason(month);
            textNorthSeason.textContent = northSeason;
            textSouthSeason.textContent = southSeason;
        }
        
        // 鼠标/触摸事件处理
        function startDrag(e) {
            isDragging = true;
            e.preventDefault();
        }
        
        function doDrag(e) {
            if (!isDragging) return;
            
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const rect = sliderHandle.getBoundingClientRect();
            const containerRect = document.getElementById('scene2-container').getBoundingClientRect();
            
            let newX = clientX - containerRect.left;
            newX = Math.max(sliderStartX, Math.min(sliderEndX, newX));
            
            sliderValue = ((newX - sliderStartX) / sliderLength) * 100;
            sliderValue = snapToKeyPoint(sliderValue);
            
            updateDisplay();
        }
        
        function endDrag() {
            isDragging = false;
        }
        
        // 绑定事件
        sliderHandle.addEventListener('mousedown', startDrag);
        sliderHandle.addEventListener('touchstart', startDrag);
        
        document.addEventListener('mousemove', doDrag);
        document.addEventListener('touchmove', doDrag);
        
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchend', endDrag);
        
        // 初始化显示
        updateDisplay();
        
    })();
    </script>
</body>
</html>
