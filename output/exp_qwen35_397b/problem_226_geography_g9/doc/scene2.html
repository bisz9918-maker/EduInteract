<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太阳直射点周年移动与昼夜长短变化</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: "Microsoft YaHei", sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        .scene2-btn {
            position: absolute;
            bottom: 10px;
            padding: 8px 20px;
            font-size: 14px;
            cursor: pointer;
            border: 2px solid #1565c0;
            border-radius: 5px;
            background: #ffffff;
            color: #1565c0;
            transition: all 0.3s;
        }
        .scene2-btn:hover:not(:disabled) {
            background: #1565c0;
            color: #ffffff;
        }
        .scene2-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        #scene2-prev-btn {
            left: 280px;
        }
        #scene2-next-btn {
            right: 280px;
        }
        #scene2-step-indicator {
            position: absolute;
            bottom: 15px;
            left: 380px;
            font-size: 14px;
            color: #666;
        }
        .scene2-hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <!-- 定义图案 -->
            <defs>
                <!-- 夜半球斜线填充 -->
                <pattern id="scene2-night-pattern" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
                    <line x1="0" y1="0" x2="0" y2="10" stroke="#888888" stroke-width="2"/>
                </pattern>
                <!-- 箭头定义 -->
                <marker id="scene2-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#ffa000"/>
                </marker>
            </defs>

            <!-- 太阳光线 -->
            <g id="scene2-sun-rays">
                <line x1="50" y1="120" x2="150" y2="120" stroke="#ffa000" stroke-width="2" marker-end="url(#scene2-arrow)"/>
                <line x1="50" y1="150" x2="150" y2="150" stroke="#ffa000" stroke-width="2" marker-end="url(#scene2-arrow)"/>
                <line x1="50" y1="180" x2="150" y2="180" stroke="#ffa000" stroke-width="2" marker-end="url(#scene2-arrow)"/>
                <line x1="50" y1="210" x2="150" y2="210" stroke="#ffa000" stroke-width="2" marker-end="url(#scene2-arrow)"/>
                <line x1="50" y1="240" x2="150" y2="240" stroke="#ffa000" stroke-width="2" marker-end="url(#scene2-arrow)"/>
            </g>

            <!-- 地球轮廓 -->
            <circle id="scene2-earth" cx="400" cy="200" r="100" fill="none" stroke="#000000" stroke-width="2"/>

            <!-- 昼半球（左半圆） -->
            <clipPath id="scene2-left-clip">
                <rect x="300" y="100" width="100" height="200"/>
            </clipPath>
            <circle id="scene2-day-hemisphere" cx="400" cy="200" r="100" fill="#2e7d32" opacity="0.2" clip-path="url(#scene2-left-clip)"/>

            <!-- 夜半球（右半圆） -->
            <clipPath id="scene2-right-clip">
                <rect x="400" y="100" width="100" height="200"/>
            </clipPath>
            <circle id="scene2-night-hemisphere" cx="400" cy="200" r="100" fill="url(#scene2-night-pattern)" opacity="0.3" clip-path="url(#scene2-right-clip)"/>

            <!-- 晨昏线 -->
            <line id="scene2-terminator" x1="400" y1="100" x2="400" y2="300" stroke="#000000" stroke-width="2"/>

            <!-- 赤道 -->
            <ellipse id="scene2-equator" cx="400" cy="200" rx="100" ry="5" fill="none" stroke="#666666" stroke-width="1" stroke-dasharray="5,5"/>

            <!-- 北回归线 -->
            <ellipse id="scene2-tropic-north" cx="400" cy="179" rx="92" ry="4" fill="none" stroke="#666666" stroke-width="1" stroke-dasharray="5,5"/>

            <!-- 南回归线 -->
            <ellipse id="scene2-tropic-south" cx="400" cy="221" rx="92" ry="4" fill="none" stroke="#666666" stroke-width="1" stroke-dasharray="5,5"/>

            <!-- 直射点 -->
            <circle id="scene2-direct-point" cx="400" cy="200" r="6" fill="#c62828"/>
            <!-- 直射点标签移到地球右侧外部 -->
            <text id="scene2-direct-label" x="520" y="205" text-anchor="start" font-size="12" fill="#c62828">直射点</text>

            <!-- 节气名称 - 调整 y 坐标增加间距 -->
            <text id="scene2-solar-term-name" x="400" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565c0">春分</text>

            <!-- 日期标注 - 调整 y 坐标增加间距 -->
            <text id="scene2-date-label" x="400" y="48" text-anchor="middle" font-size="12" fill="#000000">3 月 21 日前后</text>

            <!-- 直射纬度 - 调整 y 坐标增加间距 -->
            <text id="scene2-latitude-label" x="400" y="328" text-anchor="middle" font-size="12" fill="#000000">直射赤道 (0°)</text>

            <!-- 昼夜情况 - 调整 y 坐标增加间距 -->
            <text id="scene2-daynight-label" x="400" y="348" text-anchor="middle" font-size="11" fill="#000000">全球昼夜等长</text>

            <!-- 总结表格（步骤 4 显示）- 调整行间距为 28px -->
            <g id="scene2-summary-table" class="scene2-hidden">
                <!-- 表头 -->
                <text x="130" y="335" font-size="10" font-weight="bold">节气</text>
                <text x="220" y="335" font-size="10" font-weight="bold">日期</text>
                <text x="320" y="335" font-size="10" font-weight="bold">直射点</text>
                <text x="480" y="335" font-size="10" font-weight="bold">北半球昼夜</text>
                <!-- 数据行 - 行间距 28px -->
                <text x="130" y="363" font-size="9">春分</text>
                <text x="220" y="363" font-size="9">3.21</text>
                <text x="320" y="363" font-size="9">0°</text>
                <text x="480" y="363" font-size="9">昼夜等长</text>

                <text x="130" y="391" font-size="9">夏至</text>
                <text x="220" y="391" font-size="9">6.22</text>
                <text x="320" y="391" font-size="9">23.5°N</text>
                <text x="480" y="391" font-size="9">昼长夜短</text>

                <text x="130" y="419" font-size="9">秋分</text>
                <text x="220" y="419" font-size="9">9.23</text>
                <text x="320" y="419" font-size="9">0°</text>
                <text x="480" y="419" font-size="9">昼夜等长</text>

                <text x="130" y="447" font-size="9">冬至</text>
                <text x="220" y="447" font-size="9">12.22</text>
                <text x="320" y="447" font-size="9">23.5°S</text>
                <text x="480" y="447" font-size="9">昼短夜长</text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <button id="scene2-prev-btn" class="scene2-btn">◀ 上一步</button>
        <div id="scene2-step-indicator">1/5</div>
        <button id="scene2-next-btn" class="scene2-btn">下一步 ▶</button>
    </div>

    <script>
    (function() {
        // Scene 2: 太阳直射点周年移动与昼夜长短变化

        // 步骤数据配置
        const steps = [
            {
                // 步骤 0: 春分
                solarTerm: "春分",
                date: "3 月 21 日前后",
                latitude: "直射赤道 (0°)",
                dayNight: "全球昼夜等长",
                directY: 200,
                terminatorType: "vertical"
            },
            {
                // 步骤 1: 夏至
                solarTerm: "夏至",
                date: "6 月 22 日前后",
                latitude: "直射北回归线 (23.5°N)",
                dayNight: "北半球昼最长夜最短，北极圈内极昼",
                directY: 179,
                terminatorType: "summer"
            },
            {
                // 步骤 2: 秋分
                solarTerm: "秋分",
                date: "9 月 23 日前后",
                latitude: "直射赤道 (0°)",
                dayNight: "全球昼夜等长",
                directY: 200,
                terminatorType: "vertical"
            },
            {
                // 步骤 3: 冬至（本题状态）
                solarTerm: "冬至",
                date: "12 月 22 日前后",
                latitude: "直射南回归线 (23.5°S)",
                dayNight: "北半球昼最短夜最长，北极圈内极夜",
                directY: 221,
                terminatorType: "winter"
            },
            {
                // 步骤 4: 总结表格
                isSummary: true
            }
        ];

        let currentStep = 0;

        // 获取 DOM 元素
        const solarTermName = document.getElementById('scene2-solar-term-name');
        const dateLabel = document.getElementById('scene2-date-label');
        const latitudeLabel = document.getElementById('scene2-latitude-label');
        const dayNightLabel = document.getElementById('scene2-daynight-label');
        const directPoint = document.getElementById('scene2-direct-point');
        const directLabel = document.getElementById('scene2-direct-label');
        const terminator = document.getElementById('scene2-terminator');
        const summaryTable = document.getElementById('scene2-summary-table');
        const prevBtn = document.getElementById('scene2-prev-btn');
        const nextBtn = document.getElementById('scene2-next-btn');
        const stepIndicator = document.getElementById('scene2-step-indicator');

        // 地球光照相关元素
        const earthElements = [
            document.getElementById('scene2-earth'),
            document.getElementById('scene2-sun-rays'),
            document.getElementById('scene2-day-hemisphere'),
            document.getElementById('scene2-night-hemisphere'),
            document.getElementById('scene2-terminator'),
            document.getElementById('scene2-equator'),
            document.getElementById('scene2-tropic-north'),
            document.getElementById('scene2-tropic-south'),
            document.getElementById('scene2-direct-point'),
            solarTermName,
            dateLabel,
            latitudeLabel,
            dayNightLabel
        ];

        // 渲染步骤
        function renderStep() {
            const step = steps[currentStep];

            if (step.isSummary) {
                // 显示总结表格，隐藏地球光照图
                earthElements.forEach(el => {
                    if (el) el.style.display = 'none';
                });
                directLabel.style.display = 'none';
                summaryTable.style.display = 'block';
            } else {
                // 显示地球光照图，隐藏总结表格
                earthElements.forEach(el => {
                    if (el) el.style.display = 'block';
                });
                directLabel.style.display = 'block';
                summaryTable.style.display = 'none';

                // 更新文本内容
                solarTermName.textContent = step.solarTerm;
                dateLabel.textContent = step.date;
                latitudeLabel.textContent = step.latitude;
                dayNightLabel.textContent = step.dayNight;

                // 更新直射点位置（带动画）
                directPoint.setAttribute('cy', step.directY);
                // 直射点标签始终在地球右侧
                directLabel.setAttribute('y', step.directY + 5);

                // 更新晨昏线
                if (step.terminatorType === 'vertical') {
                    // 春分/秋分：垂直晨昏线
                    terminator.setAttribute('x1', '400');
                    terminator.setAttribute('y1', '100');
                    terminator.setAttribute('x2', '400');
                    terminator.setAttribute('y2', '300');
                } else if (step.terminatorType === 'summer') {
                    // 夏至：晨昏线倾斜，北极圈内极昼
                    terminator.setAttribute('x1', '370');
                    terminator.setAttribute('y1', '100');
                    terminator.setAttribute('x2', '430');
                    terminator.setAttribute('y2', '300');
                } else if (step.terminatorType === 'winter') {
                    // 冬至：晨昏线倾斜，北极圈内极夜（本题状态）
                    terminator.setAttribute('x1', '430');
                    terminator.setAttribute('y1', '100');
                    terminator.setAttribute('x2', '370');
                    terminator.setAttribute('y2', '300');
                }
            }

            // 更新按钮状态
            prevBtn.disabled = currentStep === 0;
            nextBtn.disabled = currentStep === 4;
            stepIndicator.textContent = (currentStep + 1) + '/5';
        }

        // 事件绑定
        prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        nextBtn.addEventListener('click', function() {
            if (currentStep < 4) {
                currentStep++;
                renderStep();
            }
        });

        // 初始化
        renderStep();

    })();
    </script>
</body>
</html>
