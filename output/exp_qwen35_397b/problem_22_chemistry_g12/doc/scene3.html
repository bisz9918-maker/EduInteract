<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电解池两种连接方式对比</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene3-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 2px solid #424242; border-radius: 4px; background: #f5f5f5; }
        .scene3-btn.active { background: #1976d2; color: white; border-color: #1976d2; }
        .scene3-btn:hover { background: #e3f2fd; }
        .scene3-btn.active:hover { background: #1565c0; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" id="scene3-svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene3-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0" />
                </marker>
                <marker id="scene3-arrow-yellow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#fbc02d" />
                </marker>
                <!-- 溶解效果渐变 -->
                <linearGradient id="scene3-dissolve-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#757575;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#757575;stop-opacity:0.3" />
                </linearGradient>
                <!-- 析出效果渐变 -->
                <linearGradient id="scene3-deposit-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#d84315;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#d84315;stop-opacity:0.5" />
                </linearGradient>
            </defs>

            <!-- 烧杯轮廓 -->
            <path id="scene3-beaker" d="M180,180 L180,420 L620,420 L620,180 L600,180 L600,400 L200,400 L200,180 Z" 
                  fill="none" stroke="#757575" stroke-width="2" />

            <!-- 溶液区域 -->
            <rect id="scene3-solution" x="190" y="280" width="420" height="120" 
                  fill="#bbdefb" opacity="0.4" />

            <!-- 铜电极（左侧） -->
            <rect id="scene3-electrode-cu" x="230" y="140" width="45" height="260" 
                  fill="#d84315" stroke="#bf360c" stroke-width="2" />
            <!-- Cu 标签放在电极顶部上方 -->
            <text id="scene3-label-cu" x="252" y="130" font-size="14" fill="#bf360c" text-anchor="middle" font-weight="bold">Cu</text>

            <!-- 铁电极（右侧） -->
            <rect id="scene3-electrode-fe" x="525" y="140" width="45" height="260" 
                  fill="#9e9e9e" stroke="#616161" stroke-width="2" />
            <!-- Fe 标签放在电极顶部上方 -->
            <text id="scene3-label-fe" x="547" y="130" font-size="14" fill="#616161" text-anchor="middle" font-weight="bold">Fe</text>

            <!-- 导线 -->
            <path id="scene3-wire-a" d="M252,140 L252,100" fill="none" stroke="#424242" stroke-width="2" />
            <path id="scene3-wire-b" d="M547,140 L547,100" fill="none" stroke="#424242" stroke-width="2" />

            <!-- 端子 a -->
            <circle id="scene3-terminal-a" cx="252" cy="100" r="6" fill="#424242" />
            <text id="scene3-label-a" x="252" y="82" font-size="14" fill="#424242" text-anchor="middle" font-weight="bold">a</text>

            <!-- 端子 b -->
            <circle id="scene3-terminal-b" cx="547" cy="100" r="6" fill="#424242" />
            <text id="scene3-label-b" x="547" y="82" font-size="14" fill="#424242" text-anchor="middle" font-weight="bold">b</text>

            <!-- 电源符号组（状态 1 和 2 显示） -->
            <g id="scene3-power-source" style="display:none;">
                <!-- 正极（长线）和负极（短线）- 无外框 -->
                <line id="scene3-power-plus" x1="430" y1="35" x2="430" y2="55" stroke="#c62828" stroke-width="3" />
                <line id="scene3-power-minus" x1="370" y1="40" x2="370" y2="50" stroke="#1565c0" stroke-width="3" />
                <!-- +/- 标签放在电源线外侧 -->
                <text id="scene3-power-plus-label" x="445" y="50" font-size="16" fill="#c62828" font-weight="bold">+</text>
                <text id="scene3-power-minus-label" x="352" y="50" font-size="16" fill="#1565c0" font-weight="bold">-</text>
                <!-- 电源到端子的导线 -->
                <path id="scene3-power-wire-left" d="M370,45 L370,35 L252,35 L252,94" fill="none" stroke="#424242" stroke-width="2" />
                <path id="scene3-power-wire-right" d="M430,45 L430,35 L547,35 L547,94" fill="none" stroke="#424242" stroke-width="2" />
            </g>

            <!-- 阳极标签（状态 1 在 Fe，状态 2 在 Cu）- 放在更上方避免与端子标签重叠 -->
            <text id="scene3-label-anode" x="547" y="65" font-size="14" fill="#c62828" text-anchor="middle" font-weight="bold" style="display:none;">阳极</text>
            <!-- 阴极标签（状态 1 在 Cu，状态 2 在 Fe） -->
            <text id="scene3-label-cathode" x="252" y="65" font-size="14" fill="#2e7d32" text-anchor="middle" font-weight="bold" style="display:none;">阴极</text>

            <!-- 电子流向箭头（状态 1 和 2 显示） -->
            <g id="scene3-arrow-electron" style="display:none;">
                <path id="scene3-electron-arrow1" d="M370,45 L340,45 L340,35 L252,35 L252,85" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#scene3-arrow-blue)" />
                <path id="scene3-electron-arrow2" d="M547,85 L547,35 L460,35 L460,45 L440,45" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#scene3-arrow-blue)" />
            </g>

            <!-- SO₄²⁻移动箭头（指向阳极）- 放在溶液下方 -->
            <g id="scene3-arrow-so4" style="display:none;">
                <path id="scene3-so4-arrow" d="M380,350 L510,350" fill="none" stroke="#fbc02d" stroke-width="2" marker-end="url(#scene3-arrow-yellow)" />
                <text x="445" y="345" font-size="12" fill="#f57c00" text-anchor="middle">SO₄²⁻</text>
            </g>

            <!-- Cu²⁺移动箭头（指向阴极）- 放在溶液下方 -->
            <g id="scene3-arrow-cu2" style="display:none;">
                <path id="scene3-cu2-arrow" d="M380,375 L260,375" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#scene3-arrow-blue)" />
                <text x="320" y="370" font-size="12" fill="#1565c0" text-anchor="middle">Cu²⁺</text>
            </g>

            <!-- 电极反应式（状态 1） -->
            <g id="scene3-reaction-state1" style="display:none;">
                <!-- Fe 电极反应（阳极） -->
                <text id="scene3-reaction-fe-s1" x="590" y="220" font-size="13" fill="#c62828" text-anchor="start">
                    <tspan x="590" dy="0">Fe - 2e⁻ = Fe²⁺</tspan>
                </text>
                <!-- Cu 电极反应（阴极） -->
                <text id="scene3-reaction-cu-s1" x="210" y="220" font-size="13" fill="#2e7d32" text-anchor="end">
                    <tspan x="210" dy="0">Cu²⁺ + 2e⁻ = Cu</tspan>
                </text>
            </g>

            <!-- 电极反应式（状态 2） -->
            <g id="scene3-reaction-state2" style="display:none;">
                <!-- Cu 电极反应（阳极） -->
                <text id="scene3-reaction-cu-s2" x="210" y="220" font-size="13" fill="#c62828" text-anchor="end">
                    <tspan x="210" dy="0">Cu - 2e⁻ = Cu²⁺</tspan>
                </text>
                <!-- Fe 电极反应（阴极） -->
                <text id="scene3-reaction-fe-s2" x="590" y="320" font-size="13" fill="#2e7d32" text-anchor="start">
                    <tspan x="590" dy="0">Cu²⁺ + 2e⁻ = Cu</tspan>
                </text>
            </g>

            <!-- 溶解效果（状态 1：Fe 溶解，状态 2：Cu 溶解） -->
            <g id="scene3-dissolve-s1" style="display:none;">
                <rect x="525" y="370" width="45" height="30" fill="url(#scene3-dissolve-grad)" opacity="0.6" />
            </g>
            <g id="scene3-dissolve-s2" style="display:none;">
                <rect x="230" y="370" width="45" height="30" fill="url(#scene3-dissolve-grad)" opacity="0.6" />
            </g>

            <!-- 析出效果（状态 1：Cu 析出，状态 2：Fe 析出） -->
            <g id="scene3-deposit-s1" style="display:none;">
                <rect x="230" y="370" width="45" height="30" fill="url(#scene3-deposit-grad)" opacity="0.6" />
            </g>
            <g id="scene3-deposit-s2" style="display:none;">
                <rect x="525" y="370" width="45" height="30" fill="url(#scene3-deposit-grad)" opacity="0.6" />
            </g>

            <!-- 对比表格（状态 3 显示）- 放在底部，不遮挡装置 -->
            <g id="scene3-table-compare" style="display:none;">
                <!-- 表格背景 -->
                <rect x="100" y="320" width="600" height="120" fill="#ffffff" stroke="#424242" stroke-width="1.5" />
                <!-- 表头背景 -->
                <rect x="100" y="320" width="600" height="28" fill="#e3f2fd" />
                <!-- 表头文字 -->
                <text x="155" y="340" font-size="12" fill="#424242" text-anchor="middle" font-weight="bold">连接</text>
                <text x="220" y="340" font-size="12" fill="#424242" text-anchor="middle" font-weight="bold">阳极</text>
                <text x="290" y="340" font-size="12" fill="#424242" text-anchor="middle" font-weight="bold">阴极</text>
                <text x="410" y="340" font-size="12" fill="#424242" text-anchor="middle" font-weight="bold">阳极反应</text>
                <text x="550" y="340" font-size="12" fill="#424242" text-anchor="middle" font-weight="bold">阴极反应</text>
                <text x="660" y="340" font-size="12" fill="#424242" text-anchor="middle" font-weight="bold">现象</text>
                <!-- 分隔线 -->
                <line x1="100" y1="348" x2="700" y2="348" stroke="#424242" stroke-width="1" />
                <line x1="100" y1="380" x2="700" y2="380" stroke="#424242" stroke-width="1" />
                <line x1="190" y1="320" x2="190" y2="440" stroke="#424242" stroke-width="1" />
                <line x1="250" y1="320" x2="250" y2="440" stroke="#424242" stroke-width="1" />
                <line x1="330" y1="320" x2="330" y2="440" stroke="#424242" stroke-width="1" />
                <line x1="490" y1="320" x2="490" y2="440" stroke="#424242" stroke-width="1" />
                <line x1="610" y1="320" x2="610" y2="440" stroke="#424242" stroke-width="1" />
                <!-- 行 1：b 正 a 负 -->
                <text x="155" y="368" font-size="11" fill="#424242" text-anchor="middle">b 正 a 负</text>
                <text x="220" y="368" font-size="11" fill="#c62828" text-anchor="middle" font-weight="bold">Fe</text>
                <text x="290" y="368" font-size="11" fill="#2e7d32" text-anchor="middle" font-weight="bold">Cu</text>
                <text x="410" y="368" font-size="10" fill="#c62828" text-anchor="middle">Fe-2e⁻=Fe²⁺</text>
                <text x="550" y="368" font-size="10" fill="#2e7d32" text-anchor="middle">Cu²⁺+2e⁻=Cu</text>
                <text x="660" y="368" font-size="10" fill="#424242" text-anchor="middle">Fe 溶解</text>
                <!-- 行 2：a 正 b 负 -->
                <text x="155" y="405" font-size="11" fill="#424242" text-anchor="middle">a 正 b 负</text>
                <text x="220" y="405" font-size="11" fill="#c62828" text-anchor="middle" font-weight="bold">Cu</text>
                <text x="290" y="405" font-size="11" fill="#2e7d32" text-anchor="middle" font-weight="bold">Fe</text>
                <text x="410" y="405" font-size="10" fill="#c62828" text-anchor="middle">Cu-2e⁻=Cu²⁺</text>
                <text x="550" y="405" font-size="10" fill="#2e7d32" text-anchor="middle">Cu²⁺+2e⁻=Cu</text>
                <text x="660" y="405" font-size="10" fill="#424242" text-anchor="middle">Cu 溶解</text>
                <text x="660" y="420" font-size="10" fill="#424242" text-anchor="middle">Fe 上析出 Cu</text>
            </g>

            <!-- 控件栏背景 -->
            <rect x="50" y="455" width="700" height="35" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1" rx="4" />
        </svg>

        <!-- 控件栏 -->
        <div id="scene3-controls">
            <button class="scene3-btn active" id="scene3-btn-state0" onclick="scene3SetState(0)">基础装置</button>
            <button class="scene3-btn" id="scene3-btn-state1" onclick="scene3SetState(1)">b 正 a 负</button>
            <button class="scene3-btn" id="scene3-btn-state2" onclick="scene3SetState(2)">a 正 b 负</button>
            <button class="scene3-btn" id="scene3-btn-state3" onclick="scene3SetState(3)">对比总结</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 3 实现：电解池两种连接方式对比
        // 布局坐标表参考：
        // | 元素 | 位置 | 备注 |
        // |------|------|------|
        // | 烧杯 | (180,180)-(620,420) | 梯形容器 |
        // | 溶液 | (190,280)-(610,400) | 浅蓝色半透明 |
        // | Cu 电极 | (230,140)-(275,400) | 左侧 |
        // | Fe 电极 | (525,140)-(570,400) | 右侧 |
        // | 端子 a | (252,100) | Cu 电极引出 |
        // | 端子 b | (547,100) | Fe 电极引出 |
        // | 电源 | (370,35)-(430,55) | 状态 1/2 显示 |
        // | 阳极标签 | 状态 1:(547,65) 状态 2:(252,65) | 红色 |
        // | 阴极标签 | 状态 1:(252,65) 状态 2:(547,65) | 绿色 |
        // | 反应式 Fe | 状态 1:(590,220) 状态 2:(590,320) | 右侧 |
        // | 反应式 Cu | 状态 1:(210,220) 状态 2:(210,220) | 左侧 |
        // | 表格 | (100,320)-(700,440) | 状态 3 显示 |

        let currentState = 0;

        // 显示/隐藏辅助函数
        function show(el) {
            if (el) {
                el.style.display = '';
                el.style.opacity = '1';
            }
        }
        function hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 获取元素
        function getEl(id) {
            return document.getElementById('scene3-' + id);
        }

        // 状态切换函数
        window.scene3SetState = function(state) {
            currentState = state;

            // 更新按钮状态
            for (let i = 0; i <= 3; i++) {
                const btn = getEl('btn-state' + i);
                if (btn) {
                    if (i === state) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                }
            }

            // 状态 0：基础装置
            if (state === 0) {
                hide(getEl('power-source'));
                hide(getEl('label-anode'));
                hide(getEl('label-cathode'));
                hide(getEl('arrow-electron'));
                hide(getEl('arrow-so4'));
                hide(getEl('arrow-cu2'));
                hide(getEl('reaction-state1'));
                hide(getEl('reaction-state2'));
                hide(getEl('dissolve-s1'));
                hide(getEl('dissolve-s2'));
                hide(getEl('deposit-s1'));
                hide(getEl('deposit-s2'));
                hide(getEl('table-compare'));
            }
            // 状态 1：b 正 a 负（Fe 为阳极，Cu 为阴极）
            else if (state === 1) {
                show(getEl('power-source'));
                // 电源正极在右侧（连接 b/Fe）
                const powerPlus = getEl('power-plus');
                const powerMinus = getEl('power-minus');
                const powerPlusLabel = getEl('power-plus-label');
                const powerMinusLabel = getEl('power-minus-label');
                if (powerPlus) { powerPlus.setAttribute('x1', '430'); powerPlus.setAttribute('x2', '430'); }
                if (powerMinus) { powerMinus.setAttribute('x1', '370'); powerMinus.setAttribute('x2', '370'); }
                if (powerPlusLabel) { powerPlusLabel.setAttribute('x', '445'); }
                if (powerMinusLabel) { powerMinusLabel.setAttribute('x', '352'); }

                show(getEl('label-anode'));
                getEl('label-anode').setAttribute('x', '547'); // Fe 上方
                show(getEl('label-cathode'));
                getEl('label-cathode').setAttribute('x', '252'); // Cu 上方

                show(getEl('arrow-electron'));
                show(getEl('arrow-so4'));
                // SO4 指向 Fe（阳极）
                const so4Arrow = getEl('so4-arrow');
                if (so4Arrow) { so4Arrow.setAttribute('d', 'M380,350 L510,350'); }
                show(getEl('arrow-cu2'));
                // Cu2 指向 Cu（阴极）
                const cu2Arrow = getEl('cu2-arrow');
                if (cu2Arrow) { cu2Arrow.setAttribute('d', 'M380,375 L260,375'); }

                show(getEl('reaction-state1'));
                hide(getEl('reaction-state2'));

                show(getEl('dissolve-s1')); // Fe 溶解
                hide(getEl('dissolve-s2'));
                show(getEl('deposit-s1')); // Cu 析出
                hide(getEl('deposit-s2'));

                hide(getEl('table-compare'));
            }
            // 状态 2：a 正 b 负（Cu 为阳极，Fe 为阴极）
            else if (state === 2) {
                show(getEl('power-source'));
                // 电源正极在左侧（连接 a/Cu）
                const powerPlus = getEl('power-plus');
                const powerMinus = getEl('power-minus');
                const powerPlusLabel = getEl('power-plus-label');
                const powerMinusLabel = getEl('power-minus-label');
                if (powerPlus) { powerPlus.setAttribute('x1', '370'); powerPlus.setAttribute('x2', '370'); }
                if (powerMinus) { powerMinus.setAttribute('x1', '430'); powerMinus.setAttribute('x2', '430'); }
                if (powerPlusLabel) { powerPlusLabel.setAttribute('x', '352'); }
                if (powerMinusLabel) { powerMinusLabel.setAttribute('x', '445'); }

                show(getEl('label-anode'));
                getEl('label-anode').setAttribute('x', '252'); // Cu 上方
                show(getEl('label-cathode'));
                getEl('label-cathode').setAttribute('x', '547'); // Fe 上方

                show(getEl('arrow-electron'));
                show(getEl('arrow-so4'));
                // SO4 指向 Cu（阳极）
                const so4Arrow = getEl('so4-arrow');
                if (so4Arrow) { so4Arrow.setAttribute('d', 'M380,350 L240,350'); }
                show(getEl('arrow-cu2'));
                // Cu2 指向 Fe（阴极）
                const cu2Arrow = getEl('cu2-arrow');
                if (cu2Arrow) { cu2Arrow.setAttribute('d', 'M380,375 L530,375'); }

                hide(getEl('reaction-state1'));
                show(getEl('reaction-state2'));

                hide(getEl('dissolve-s1'));
                show(getEl('dissolve-s2')); // Cu 溶解
                hide(getEl('deposit-s1'));
                show(getEl('deposit-s2')); // Fe 析出

                hide(getEl('table-compare'));
            }
            // 状态 3：对比表格
            else if (state === 3) {
                hide(getEl('power-source'));
                hide(getEl('label-anode'));
                hide(getEl('label-cathode'));
                hide(getEl('arrow-electron'));
                hide(getEl('arrow-so4'));
                hide(getEl('arrow-cu2'));
                hide(getEl('reaction-state1'));
                hide(getEl('reaction-state2'));
                hide(getEl('dissolve-s1'));
                hide(getEl('dissolve-s2'));
                hide(getEl('deposit-s1'));
                hide(getEl('deposit-s2'));
                show(getEl('table-compare'));
            }
        };

        // 初始化：状态 0
        scene3SetState(0);
    })();
    </script>
</body>
</html>
