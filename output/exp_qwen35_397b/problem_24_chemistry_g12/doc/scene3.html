<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>场景 3：乙容器恒压条件与甲容器对比</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-svg { width: 800px; height: 500px; }
        .scene3-molecule { transition: all 0.3s ease; }
        .scene3-hidden { opacity: 0; }
        .scene3-visible { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 甲容器背景 -->
            <rect id="scene3-container-a-bg" x="85" y="125" width="150" height="250" fill="#e3f2fd" fill-opacity="0.15" stroke="none"/>
            <!-- 甲容器外框 -->
            <rect id="scene3-container-a" x="80" y="120" width="160" height="260" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 乙容器背景 -->
            <rect id="scene3-container-b-bg" x="365" y="125" width="150" height="250" fill="#e8f5e9" fill-opacity="0.15" stroke="none"/>
            <!-- 乙容器外框（顶部开放） -->
            <rect id="scene3-container-b" x="360" y="120" width="160" height="260" fill="none" stroke="#000000" stroke-width="2"/>
            <line x1="360" y1="120" x2="520" y2="120" stroke="#ffffff" stroke-width="3"/>
            
            <!-- 乙容器活塞（可移动） -->
            <rect id="scene3-piston" x="365" y="140" width="150" height="15" fill="#888888" stroke="#666666" stroke-width="1"/>
            <rect id="scene3-piston-handle" x="425" y="130" width="30" height="10" fill="#888888" stroke="#666666" stroke-width="1"/>
            
            <!-- 甲容器标签 -->
            <text id="scene3-label-a" x="160" y="400" text-anchor="middle" font-size="16" fill="#000000">甲（恒容）</text>
            <!-- 乙容器标签 -->
            <text id="scene3-label-b" x="440" y="400" text-anchor="middle" font-size="16" fill="#000000">乙（恒压）</text>
            
            <!-- 甲初始物质标签 -->
            <text id="scene3-initial-a" x="160" y="160" text-anchor="middle" font-size="14" fill="#000000">0.2 mol NO₂</text>
            <!-- 乙初始物质标签 -->
            <text id="scene3-initial-b" x="440" y="160" text-anchor="middle" font-size="14" fill="#000000">0.2 mol NO₂</text>
            
            <!-- 体积标注 -->
            <text id="scene3-volume-a" x="50" y="250" text-anchor="middle" font-size="14" fill="#000000">V₀</text>
            <text id="scene3-volume-b" x="310" y="250" text-anchor="middle" font-size="14" fill="#000000" opacity="0">V_乙 &lt; V₀</text>
            
            <!-- 压强标注 -->
            <text id="scene3-pressure-label" x="540" y="200" text-anchor="middle" font-size="14" fill="#000000">压强 P 不变</text>
            
            <!-- 体积缩小箭头 -->
            <defs>
                <marker id="scene3-arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <polygon points="0,0 10,5 0,10" fill="#2e7d32"/>
                </marker>
            </defs>
            <line id="scene3-volume-arrow" x1="540" y1="230" x2="540" y2="300" stroke="#2e7d32" stroke-width="3" marker-end="url(#scene3-arrowhead)" opacity="0"/>
            
            <!-- 平衡移动标注 -->
            <text id="scene3-shift-label" x="540" y="330" text-anchor="middle" font-size="14" fill="#2e7d32" opacity="0">平衡正向移动</text>
            
            <!-- 对比结论 -->
            <text id="scene3-conclusion" x="580" y="380" text-anchor="middle" font-size="14" fill="#1565c0" opacity="0">N₂O₄% 乙 &gt; N₂O₄% 甲</text>
            
            <!-- 甲容器分子组 -->
            <g id="scene3-molecules-a">
                <!-- NO₂分子（红色，直径 16） -->
                <circle id="scene3-no2-a1" class="scene3-molecule" cx="110" cy="200" r="8" fill="#c62828" opacity="1"/>
                <circle id="scene3-no2-a2" class="scene3-molecule" cx="150" cy="210" r="8" fill="#c62828" opacity="1"/>
                <circle id="scene3-no2-a3" class="scene3-molecule" cx="190" cy="200" r="8" fill="#c62828" opacity="1"/>
                <circle id="scene3-no2-a4" class="scene3-molecule" cx="120" cy="240" r="8" fill="#c62828" opacity="1"/>
                <circle id="scene3-no2-a5" class="scene3-molecule" cx="170" cy="250" r="8" fill="#c62828" opacity="1"/>
                <circle id="scene3-no2-a6" class="scene3-molecule" cx="210" cy="240" r="8" fill="#c62828" opacity="1"/>
                <!-- N₂O₄分子（蓝色，直径 20） -->
                <circle id="scene3-n2o4-a1" class="scene3-molecule" cx="130" cy="280" r="10" fill="#1565c0" opacity="0"/>
                <circle id="scene3-n2o4-a2" class="scene3-molecule" cx="180" cy="290" r="10" fill="#1565c0" opacity="0"/>
                <circle id="scene3-n2o4-a3" class="scene3-molecule" cx="150" cy="320" r="10" fill="#1565c0" opacity="0"/>
                <circle id="scene3-n2o4-a4" class="scene3-molecule" cx="200" cy="310" r="10" fill="#1565c0" opacity="0"/>
            </g>
            
            <!-- 乙容器分子组 -->
            <g id="scene3-molecules-b">
                <!-- NO₂分子（红色，直径 16） -->
                <circle id="scene3-no2-b1" class="scene3-molecule" cx="390" cy="200" r="8" fill="#c62828" opacity="1"/>
                <circle id="scene3-no2-b2" class="scene3-molecule" cx="430" cy="210" r="8" fill="#c62828" opacity="1"/>
                <circle id="scene3-no2-b3" class="scene3-molecule" cx="470" cy="200" r="8" fill="#c62828" opacity="1"/>
                <circle id="scene3-no2-b4" class="scene3-molecule" cx="400" cy="240" r="8" fill="#c62828" opacity="1"/>
                <circle id="scene3-no2-b5" class="scene3-molecule" cx="450" cy="250" r="8" fill="#c62828" opacity="1"/>
                <circle id="scene3-no2-b6" class="scene3-molecule" cx="490" cy="240" r="8" fill="#c62828" opacity="1"/>
                <!-- N₂O₄分子（蓝色，直径 20） -->
                <circle id="scene3-n2o4-b1" class="scene3-molecule" cx="410" cy="280" r="10" fill="#1565c0" opacity="0"/>
                <circle id="scene3-n2o4-b2" class="scene3-molecule" cx="460" cy="290" r="10" fill="#1565c0" opacity="0"/>
                <circle id="scene3-n2o4-b3" class="scene3-molecule" cx="430" cy="320" r="10" fill="#1565c0" opacity="0"/>
                <circle id="scene3-n2o4-b4" class="scene3-molecule" cx="480" cy="310" r="10" fill="#1565c0" opacity="0"/>
                <circle id="scene3-n2o4-b5" class="scene3-molecule" cx="445" cy="350" r="10" fill="#1565c0" opacity="0"/>
            </g>
            
            <!-- N₂O₄% 指示器 -->
            <text id="scene3-percent-a" x="160" y="350" text-anchor="middle" font-size="13" fill="#000000">N₂O₄%: 0%</text>
            <text id="scene3-percent-b" x="440" y="350" text-anchor="middle" font-size="13" fill="#000000">N₂O₄%: 0%</text>
            
            <!-- 反应进度滑块 -->
            <text id="scene3-slider-title" x="400" y="430" text-anchor="middle" font-size="16" fill="#000000">反应进度</text>
            <line id="scene3-slider-track" x1="150" y1="450" x2="650" y2="450" stroke="#1565c0" stroke-width="6"/>
            <circle id="scene3-slider-handle" cx="150" cy="450" r="12" fill="#1565c0" style="cursor: pointer;"/>
            <text id="scene3-slider-0" x="150" y="475" text-anchor="middle" font-size="14" fill="#000000">0%</text>
            <text id="scene3-slider-100" x="650" y="475" text-anchor="middle" font-size="14" fill="#000000">100%</text>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 3 实现：乙容器恒压条件与甲容器对比
        
        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 甲容器外框 | 矩形 | (80,120)-(240,380) | 160×260 | - | 左侧恒容容器 |
        // | 乙容器外框 | 矩形 | (360,120)-(520,380) | 160×260 | - | 右侧恒压容器（活塞可动） |
        // | 甲容器背景 | 矩形填充 | (85,125)-(235,375) | 150×250 | - | #e3f2fd 15%透明 |
        // | 乙容器背景 | 矩形填充 | (365,125)-(515,375) | 150×250 | - | #e8f5e9 15%透明 |
        // | 甲容器标签 | text | (160,400) | ~60×18 | 下方 | "甲（恒容）" |
        // | 乙容器标签 | text | (440,400) | ~60×18 | 下方 | "乙（恒压）" |
        // | 甲初始物质 | text | (160,160) | ~70×16 | 容器内上 | "0.2 mol NO₂" |
        // | 乙初始物质 | text | (440,160) | ~70×16 | 容器内上 | "0.2 mol NO₂" |
        // | 甲体积标注 | text | (50,250) | ~40×16 | 左侧 | "V₀" |
        // | 乙体积标注 | text | (310,250) | ~50×16 | 左侧 | "V_乙 < V₀" |
        // | 乙活塞 | 矩形 | (365,140)-(515,155) | 150×15 | - | 可上下移动，初始 y=140 |
        // | 活塞手柄 | 矩形 | (425,130)-(455,140) | 30×10 | - | 活塞顶部手柄 |
        // | 压强标注 | text | (540,200) | ~70×16 | 乙右侧 | "压强 P 不变" |
        // | 体积缩小箭头 | 箭头 | (540,230)-(540,300) | 宽 8×高 70 | 乙右侧 | 向下绿色箭头 |
        // | 反应进度滑块轨道 | 线段 | (150,450)-(650,450) | 500×6 | - | 底部水平轨道 |
        // | 滑块手柄 | 圆形 | (150,450) | 半径 12 | - | 可拖动，初始最左 |
        // | 滑块 0% 标签 | text | (150,475) | ~30×14 | 轨道下方 | "0%" |
        // | 滑块 100% 标签 | text | (650,475) | ~40×14 | 轨道下方 | "100%" |
        // | 滑块标题 | text | (400,430) | ~100×16 | 轨道上方 | "反应进度" |
        
        const sliderTrack = document.getElementById('scene3-slider-track');
        const sliderHandle = document.getElementById('scene3-slider-handle');
        const piston = document.getElementById('scene3-piston');
        const pistonHandle = document.getElementById('scene3-piston-handle');
        const volumeB = document.getElementById('scene3-volume-b');
        const volumeArrow = document.getElementById('scene3-volume-arrow');
        const shiftLabel = document.getElementById('scene3-shift-label');
        const conclusion = document.getElementById('scene3-conclusion');
        const percentA = document.getElementById('scene3-percent-a');
        const percentB = document.getElementById('scene3-percent-b');
        
        // 甲容器分子
        const no2A = [
            document.getElementById('scene3-no2-a1'),
            document.getElementById('scene3-no2-a2'),
            document.getElementById('scene3-no2-a3'),
            document.getElementById('scene3-no2-a4'),
            document.getElementById('scene3-no2-a5'),
            document.getElementById('scene3-no2-a6')
        ];
        const n2o4A = [
            document.getElementById('scene3-n2o4-a1'),
            document.getElementById('scene3-n2o4-a2'),
            document.getElementById('scene3-n2o4-a3'),
            document.getElementById('scene3-n2o4-a4')
        ];
        
        // 乙容器分子
        const no2B = [
            document.getElementById('scene3-no2-b1'),
            document.getElementById('scene3-no2-b2'),
            document.getElementById('scene3-no2-b3'),
            document.getElementById('scene3-no2-b4'),
            document.getElementById('scene3-no2-b5'),
            document.getElementById('scene3-no2-b6')
        ];
        const n2o4B = [
            document.getElementById('scene3-n2o4-b1'),
            document.getElementById('scene3-n2o4-b2'),
            document.getElementById('scene3-n2o4-b3'),
            document.getElementById('scene3-n2o4-b4'),
            document.getElementById('scene3-n2o4-b5')
        ];
        
        // 状态变量
        let progress = 0; // 0-1
        let isDragging = false;
        
        // 更新函数
        function updateScene() {
            // 活塞位置：从 y=140 下移至 y=220
            const pistonY = 140 + progress * 80;
            piston.setAttribute('y', pistonY);
            pistonHandle.setAttribute('y', pistonY - 10);
            
            // 体积标注显示
            if (progress > 0.3) {
                volumeB.style.opacity = 1;
            } else {
                volumeB.style.opacity = 0;
            }
            
            // 体积缩小箭头显示
            if (progress > 0.5) {
                volumeArrow.style.opacity = 0.3 + (progress - 0.5) * 1.4;
            } else {
                volumeArrow.style.opacity = 0;
            }
            
            // 平衡移动标注显示
            if (progress > 0.7) {
                shiftLabel.style.opacity = (progress - 0.7) * 5;
            } else {
                shiftLabel.style.opacity = 0;
            }
            
            // 对比结论显示
            if (progress >= 0.95) {
                conclusion.style.opacity = 1;
            } else {
                conclusion.style.opacity = 0;
            }
            
            // 甲容器分子更新
            // NO₂数量 = 6 * (1 - progress)
            const no2CountA = Math.round(6 * (1 - progress));
            for (let i = 0; i < 6; i++) {
                if (i < no2CountA) {
                    no2A[i].style.opacity = 1;
                } else {
                    no2A[i].style.opacity = 0;
                }
            }
            
            // N₂O₄数量 = 4 * progress
            const n2o4CountA = Math.round(4 * progress);
            for (let i = 0; i < 4; i++) {
                if (i < n2o4CountA) {
                    n2o4A[i].style.opacity = 1;
                } else {
                    n2o4A[i].style.opacity = 0;
                }
            }
            
            // 乙容器分子更新（恒压条件下转化率更高）
            // NO₂数量 = 6 * (1 - progress * 1.2) 但最小为 0
            const no2CountB = Math.max(0, Math.round(6 * (1 - progress * 1.2)));
            for (let i = 0; i < 6; i++) {
                if (i < no2CountB) {
                    no2B[i].style.opacity = 1;
                } else {
                    no2B[i].style.opacity = 0;
                }
            }
            
            // N₂O₄数量 = 5 * progress
            const n2o4CountB = Math.round(5 * progress);
            for (let i = 0; i < 5; i++) {
                if (i < n2o4CountB) {
                    n2o4B[i].style.opacity = 1;
                } else {
                    n2o4B[i].style.opacity = 0;
                }
            }
            
            // N₂O₄% 计算
            // 甲：恒容，平衡转化率约 57%
            const percentAVal = Math.round(progress * 57);
            // 乙：恒压，平衡转化率约 71%
            const percentBVal = Math.round(progress * 71);
            
            percentA.textContent = 'N₂O₄%: ' + percentAVal + '%';
            percentB.textContent = 'N₂O₄%: ' + percentBVal + '%';
        }
        
        // 滑块拖动处理
        function handleSliderMove(clientX) {
            const trackRect = sliderTrack.getBoundingClientRect();
            const trackLeft = trackRect.left;
            const trackWidth = trackRect.width;
            
            let newX = clientX - trackLeft;
            newX = Math.max(0, Math.min(trackWidth, newX));
            
            progress = newX / trackWidth;
            
            sliderHandle.setAttribute('cx', 150 + newX);
            
            updateScene();
        }
        
        // 鼠标事件
        sliderHandle.addEventListener('mousedown', function(e) {
            isDragging = true;
            e.preventDefault();
        });
        
        document.addEventListener('mousemove', function(e) {
            if (isDragging) {
                handleSliderMove(e.clientX);
            }
        });
        
        document.addEventListener('mouseup', function() {
            isDragging = false;
        });
        
        // 触摸事件
        sliderHandle.addEventListener('touchstart', function(e) {
            isDragging = true;
            e.preventDefault();
        });
        
        document.addEventListener('touchmove', function(e) {
            if (isDragging) {
                handleSliderMove(e.touches[0].clientX);
            }
        });
        
        document.addEventListener('touchend', function() {
            isDragging = false;
        });
        
        // 初始化
        updateScene();
        
    })();
    </script>
</body>
</html>
