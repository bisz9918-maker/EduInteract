<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卷刚毛性状遗传的多种假说对比</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: "Microsoft YaHei", sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        .scene1-chromo {
            stroke: #000000;
            stroke-width: 2;
            fill: none;
        }
        .scene1-chromo-x {
            fill: rgba(21, 101, 192, 0.2);
        }
        .scene1-chromo-y {
            fill: rgba(46, 125, 50, 0.2);
        }
        .scene1-chromo-auto {
            fill: rgba(136, 136, 136, 0.3);
        }
        .scene1-gene-marker {
            fill: #000000;
            transition: cx 0.3s, cy 0.3s;
        }
        .scene1-mutation-arrow {
            stroke-width: 3;
            fill: none;
            transition: all 0.3s;
        }
        .scene1-mutation-arrow-red {
            stroke: #c62828;
        }
        .scene1-mutation-arrow-blue {
            stroke: #1565c0;
        }
        .scene1-label {
            font-size: 14px;
            fill: #333333;
        }
        .scene1-title {
            font-size: 16px;
            font-weight: bold;
            fill: #333333;
        }
        .scene1-genotype-text {
            font-size: 14px;
            fill: #333333;
        }
        .scene1-btn {
            font-size: 13px;
            padding: 8px 12px;
            border: 2px solid #333333;
            border-radius: 6px;
            background: #f5f5f5;
            cursor: pointer;
            transition: all 0.2s;
        }
        .scene1-btn:hover {
            background: #e0e0e0;
        }
        .scene1-btn.active {
            background: #1565c0;
            color: #ffffff;
            border-color: #1565c0;
        }
        .scene1-hypo-box {
            fill: #f9f9f9;
            stroke: #cccccc;
            stroke-width: 1;
        }
        .scene1-chromo-label {
            font-size: 12px;
            fill: #666666;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 染色体组背景区 -->
            <rect id="scene1-chromo-bg" x="40" y="80" width="340" height="300" fill="#fafafa" stroke="#dddddd" stroke-width="1"/>
            
            <!-- 常染色体Ⅰ -->
            <ellipse id="scene1-auto1-left" class="scene1-chromo scene1-chromo-auto" cx="95" cy="140" rx="30" ry="20"/>
            <ellipse id="scene1-auto1-right" class="scene1-chromo scene1-chromo-auto" cx="125" cy="140" rx="30" ry="20"/>
            <text id="scene1-label-auto1" class="scene1-chromo-label" x="110" y="105" text-anchor="middle">常Ⅰ</text>
            
            <!-- 常染色体Ⅱ -->
            <ellipse id="scene1-auto2-left" class="scene1-chromo scene1-chromo-auto" cx="175" cy="140" rx="30" ry="20"/>
            <ellipse id="scene1-auto2-right" class="scene1-chromo scene1-chromo-auto" cx="205" cy="140" rx="30" ry="20"/>
            <text id="scene1-label-auto2" class="scene1-chromo-label" x="190" y="105" text-anchor="middle">常Ⅱ</text>
            
            <!-- 常染色体Ⅲ -->
            <ellipse id="scene1-auto3-left" class="scene1-chromo scene1-chromo-auto" cx="255" cy="140" rx="30" ry="20"/>
            <ellipse id="scene1-auto3-right" class="scene1-chromo scene1-chromo-auto" cx="285" cy="140" rx="30" ry="20"/>
            <text id="scene1-label-auto3" class="scene1-chromo-label" x="270" y="105" text-anchor="middle">常Ⅲ</text>
            
            <!-- X 染色体 (棒状) -->
            <rect id="scene1-chromo-x" class="scene1-chromo scene1-chromo-x" x="120" y="220" width="40" height="100" rx="5"/>
            <text id="scene1-label-x" class="scene1-chromo-label" x="105" y="270" text-anchor="end">X 染色体</text>
            
            <!-- Y 染色体 (钩状) -->
            <path id="scene1-chromo-y" class="scene1-chromo scene1-chromo-y" d="M200,220 L240,220 L240,280 Q240,300 220,300 L200,300" stroke="#000000" stroke-width="2" fill="rgba(46,125,50,0.2)"/>
            <text id="scene1-label-y" class="scene1-chromo-label" x="245" y="260" text-anchor="start">Y 染色体</text>
            
            <!-- 基因标记点 (位置随假说变化) -->
            <circle id="scene1-gene-marker" class="scene1-gene-marker" cx="140" cy="260" r="6"/>
            
            <!-- 突变箭头 (随假说变化) -->
            <defs>
                <marker id="scene1-arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828"/>
                </marker>
                <marker id="scene1-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/>
                </marker>
            </defs>
            <line id="scene1-mutation-arrow" class="scene1-mutation-arrow" x1="80" y1="260" x2="110" y2="260" marker-end="url(#scene1-arrow-blue)"/>
            
            <!-- 右侧假说标题框 -->
            <rect id="scene1-title-box" class="scene1-hypo-box" x="420" y="60" width="340" height="40"/>
            <text id="scene1-title-text" class="scene1-title" x="590" y="85" text-anchor="middle">X 染色体隐性突变假说</text>
            
            <!-- 右侧基因型标注框 -->
            <rect id="scene1-genotype-box" class="scene1-hypo-box" x="420" y="120" width="340" height="220"/>
            <text id="scene1-genotype-parent" class="scene1-genotype-text" x="440" y="150">亲代：X^A X^a × X^a Y</text>
            <text id="scene1-genotype-offspring" class="scene1-genotype-text" x="440" y="180">子代：直刚毛雌:直刚毛雄:卷刚毛雄 = 2:1:1</text>
            <text id="scene1-genotype-note" class="scene1-genotype-text" x="440" y="210" style="font-size: 12px; fill: #666;">(测交实验验证)</text>
            
            <!-- 底部按钮组 -->
            <g id="scene1-controls">
                <rect x="80" y="445" width="140" height="35" rx="6" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
                <text id="scene1-btn1-text" x="150" y="468" text-anchor="middle" class="scene1-label" style="font-size: 13px;">X 染色体显性突变</text>
                
                <rect x="240" y="445" width="140" height="35" rx="6" fill="#1565c0" stroke="#1565c0" stroke-width="2"/>
                <text id="scene1-btn2-text" x="310" y="468" text-anchor="middle" class="scene1-label" style="font-size: 13px; fill: #fff;">X 染色体隐性突变</text>
                
                <rect x="400" y="445" width="140" height="35" rx="6" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
                <text id="scene1-btn3-text" x="470" y="468" text-anchor="middle" class="scene1-label" style="font-size: 13px;">常染色体显性突变</text>
                
                <rect x="560" y="445" width="140" height="35" rx="6" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
                <text id="scene1-btn4-text" x="630" y="468" text-anchor="middle" class="scene1-label" style="font-size: 13px;">常染色体隐性突变</text>
            </g>
            
            <!-- 可点击按钮区域 (透明) -->
            <rect id="scene1-btn-hypo1" x="80" y="445" width="140" height="35" fill="transparent" style="cursor: pointer;"/>
            <rect id="scene1-btn-hypo2" x="240" y="445" width="140" height="35" fill="transparent" style="cursor: pointer;"/>
            <rect id="scene1-btn-hypo3" x="400" y="445" width="140" height="35" fill="transparent" style="cursor: pointer;"/>
            <rect id="scene1-btn-hypo4" x="560" y="445" width="140" height="35" fill="transparent" style="cursor: pointer;"/>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 1: 卷刚毛性状遗传的多种假说对比
        
        // 状态数据配置
        const hypothesisData = {
            0: { // X 染色体显性突变
                title: "X 染色体显性突变假说",
                geneMarker: { cx: 140, cy: 260 },
                arrow: { x1: 80, y1: 260, x2: 110, y2: 260, color: "red" },
                parent: "亲代：XᵃXᵃ × XᴬY",
                offspring: "子代：雌性全卷刚毛，雄性全直刚毛",
                note: "(与性别相关，雌性表现父本性状)"
            },
            1: { // X 染色体隐性突变 (初始状态)
                title: "X 染色体隐性突变假说",
                geneMarker: { cx: 140, cy: 260 },
                arrow: { x1: 80, y1: 260, x2: 110, y2: 260, color: "blue" },
                parent: "亲代：XᴬXᵃ × XᵃY",
                offspring: "子代：直刚毛雌:直刚毛雄:卷刚毛雄 = 2:1:1",
                note: "(测交实验验证，与题目 F₂ 结果一致)"
            },
            2: { // 常染色体显性突变
                title: "常染色体显性突变假说",
                geneMarker: { cx: 110, cy: 140 },
                arrow: { x1: 50, y1: 140, x2: 80, y2: 140, color: "red" },
                parent: "亲代：aa × Aa",
                offspring: "子代：直刚毛:卷刚毛 = 1:1",
                note: "(与性别无关，雌雄比例相同)"
            },
            3: { // 常染色体隐性突变
                title: "常染色体隐性突变假说",
                geneMarker: { cx: 110, cy: 140 },
                arrow: { x1: 50, y1: 140, x2: 80, y2: 140, color: "blue" },
                parent: "亲代：Aa × aa",
                offspring: "子代：直刚毛:卷刚毛 = 1:1",
                note: "(与性别无关，雌雄比例相同)"
            }
        };
        
        let currentState = 1; // 初始状态为 X 染色体隐性突变
        
        // 获取 DOM 元素
        const geneMarker = document.getElementById("scene1-gene-marker");
        const mutationArrow = document.getElementById("scene1-mutation-arrow");
        const titleText = document.getElementById("scene1-title-text");
        const genotypeParent = document.getElementById("scene1-genotype-parent");
        const genotypeOffspring = document.getElementById("scene1-genotype-offspring");
        const genotypeNote = document.getElementById("scene1-genotype-note");
        
        const btn1 = document.getElementById("scene1-btn-hypo1");
        const btn2 = document.getElementById("scene1-btn-hypo2");
        const btn3 = document.getElementById("scene1-btn-hypo3");
        const btn4 = document.getElementById("scene1-btn-hypo4");
        
        const btn1Rect = btn1.previousElementSibling.previousElementSibling;
        const btn2Rect = btn2.previousElementSibling.previousElementSibling;
        const btn3Rect = btn3.previousElementSibling.previousElementSibling;
        const btn4Rect = btn4.previousElementSibling.previousElementSibling;
        
        // 更新状态函数
        function updateState(stateIndex) {
            const data = hypothesisData[stateIndex];
            currentState = stateIndex;
            
            // 更新基因标记点位置
            geneMarker.setAttribute("cx", data.geneMarker.cx);
            geneMarker.setAttribute("cy", data.geneMarker.cy);
            
            // 更新突变箭头
            mutationArrow.setAttribute("x1", data.arrow.x1);
            mutationArrow.setAttribute("y1", data.arrow.y1);
            mutationArrow.setAttribute("x2", data.arrow.x2);
            mutationArrow.setAttribute("y2", data.arrow.y2);
            mutationArrow.setAttribute("marker-end", data.arrow.color === "red" ? "url(#scene1-arrow-red)" : "url(#scene1-arrow-blue)");
            
            // 更新文本内容
            titleText.textContent = data.title;
            genotypeParent.textContent = data.parent;
            genotypeOffspring.textContent = data.offspring;
            genotypeNote.textContent = data.note;
            
            // 更新按钮高亮状态
            updateButtonHighlight(stateIndex);
        }
        
        // 更新按钮高亮
        function updateButtonHighlight(activeIndex) {
            const rects = [btn1Rect, btn2Rect, btn3Rect, btn4Rect];
            const texts = [
                document.getElementById("scene1-btn1-text"),
                document.getElementById("scene1-btn2-text"),
                document.getElementById("scene1-btn3-text"),
                document.getElementById("scene1-btn4-text")
            ];
            
            rects.forEach((rect, i) => {
                if (i === activeIndex) {
                    rect.setAttribute("fill", "#1565c0");
                    rect.setAttribute("stroke", "#1565c0");
                    texts[i].setAttribute("fill", "#fff");
                } else {
                    rect.setAttribute("fill", "#f5f5f5");
                    rect.setAttribute("stroke", "#333333");
                    texts[i].setAttribute("fill", "#333");
                }
            });
        }
        
        // 绑定按钮事件
        btn1.addEventListener("click", () => updateState(0));
        btn2.addEventListener("click", () => updateState(1));
        btn3.addEventListener("click", () => updateState(2));
        btn4.addEventListener("click", () => updateState(3));
        
        // 初始化显示
        updateState(1);
        
    })();
    </script>
</body>
</html>
