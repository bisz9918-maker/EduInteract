<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>果蝇翅型遗传杂交图解</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        .scene1-element {
            opacity: 0;
            transition: opacity 0.3s ease-in;
        }
        .scene1-visible {
            opacity: 1;
        }
        .scene1-fly-body {
            fill: #333;
        }
        .scene1-fly-wing {
            fill: rgba(200, 200, 200, 0.6);
            stroke: #666;
            stroke-width: 1;
        }
        .scene1-fly-wing-long {
            fill: rgba(46, 125, 50, 0.4);
            stroke: #2e7d32;
            stroke-width: 1;
        }
        .scene1-fly-wing-small {
            fill: rgba(198, 40, 40, 0.4);
            stroke: #c62828;
            stroke-width: 1;
        }
        .scene1-fly-wing-vestigial {
            fill: rgba(128, 128, 128, 0.4);
            stroke: #888;
            stroke-width: 1;
        }
        .scene1-female-color {
            fill: #f48fb1;
        }
        .scene1-male-color {
            fill: #64b5f6;
        }
        .scene1-arrow {
            stroke: #888;
            stroke-width: 3;
            fill: none;
            marker-end: url(#scene1-arrowhead);
        }
        .scene1-genotype-text {
            font-size: 12px;
            fill: #333;
        }
        .scene1-phenotype-text {
            font-size: 11px;
            fill: #555;
        }
        .scene1-title-text {
            font-size: 14px;
            font-weight: bold;
            fill: #333;
        }
        .scene1-grid-line {
            stroke: #ccc;
            stroke-width: 1;
            fill: none;
        }
        .scene1-grid-cell {
            stroke: #999;
            stroke-width: 1;
        }
        .scene1-long-wing-cell {
            fill: rgba(46, 125, 50, 0.12);
        }
        .scene1-small-wing-cell {
            fill: rgba(198, 40, 40, 0.12);
        }
        .scene1-vestigial-cell {
            fill: rgba(128, 128, 128, 0.12);
        }
        .scene1-ratio-text {
            font-size: 13px;
            font-weight: bold;
            fill: #333;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }
        .scene1-btn {
            padding: 8px 20px;
            font-size: 14px;
            border: 2px solid #1565c0;
            border-radius: 6px;
            background: #fff;
            color: #1565c0;
            cursor: pointer;
            transition: all 0.2s;
        }
        .scene1-btn:hover:not(:disabled) {
            background: #1565c0;
            color: #fff;
        }
        .scene1-btn:disabled {
            border-color: #ccc;
            color: #999;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #555;
            min-width: 80px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- Arrow markers -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#888" />
                </marker>
                <marker id="scene1-arrowhead-active" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#1565c0" />
                </marker>
            </defs>

            <!-- P 代标题 -->
            <text id="scene1-p-title" class="scene1-element scene1-title-text" x="50" y="30">P 代</text>

            <!-- P 代♀果蝇（残翅） -->
            <g id="scene1-p-female" class="scene1-element">
                <!-- 身体 -->
                <ellipse cx="80" cy="70" rx="10" ry="14" class="scene1-fly-body scene1-female-color"/>
                <!-- 残翅（短小） -->
                <ellipse cx="90" cy="68" rx="5" ry="8" class="scene1-fly-wing-vestigial"/>
                <!-- 标签 -->
                <text x="80" y="48" text-anchor="middle" class="scene1-phenotype-text">残翅♀</text>
                <!-- 基因型 -->
                <text x="80" y="105" text-anchor="middle" class="scene1-genotype-text">
                    aaX<tspan dy="-4" font-size="8">B</tspan><tspan dy="0">X</tspan><tspan dy="-4" font-size="8">B</tspan>
                </text>
            </g>

            <!-- P 代♂果蝇（小翅） -->
            <g id="scene1-p-male" class="scene1-element">
                <!-- 身体 -->
                <ellipse cx="250" cy="70" rx="10" ry="14" class="scene1-fly-body scene1-male-color"/>
                <!-- 小翅（中等） -->
                <ellipse cx="260" cy="68" rx="7" ry="10" class="scene1-fly-wing-small"/>
                <!-- 标签 -->
                <text x="250" y="48" text-anchor="middle" class="scene1-phenotype-text">小翅♂</text>
                <!-- 基因型 -->
                <text x="250" y="105" text-anchor="middle" class="scene1-genotype-text">
                    AAX<tspan dy="-4" font-size="8">b</tspan><tspan dy="0">Y</tspan>
                </text>
            </g>

            <!-- P 代杂交符号 -->
            <text id="scene1-p-cross" class="scene1-element scene1-title-text" x="190" y="80">×</text>

            <!-- P→F₁箭头 -->
            <line id="scene1-arrow-p-f1" class="scene1-element scene1-arrow" x1="160" y1="125" x2="160" y2="150"/>

            <!-- F₁代标题 -->
            <text id="scene1-f1-title" class="scene1-element scene1-title-text" x="50" y="155">F₁代</text>

            <!-- F₁♀果蝇（长翅） -->
            <g id="scene1-f1-female" class="scene1-element">
                <!-- 身体 -->
                <ellipse cx="110" cy="185" rx="10" ry="14" class="scene1-fly-body scene1-female-color"/>
                <!-- 长翅（大） -->
                <ellipse cx="122" cy="182" rx="9" ry="13" class="scene1-fly-wing-long"/>
                <!-- 标签 -->
                <text x="110" y="162" text-anchor="middle" class="scene1-phenotype-text">长翅♀</text>
                <!-- 基因型 -->
                <text x="110" y="220" text-anchor="middle" class="scene1-genotype-text">
                    AaX<tspan dy="-4" font-size="8">B</tspan><tspan dy="0">X</tspan><tspan dy="-4" font-size="8">b</tspan>
                </text>
            </g>

            <!-- F₁♂果蝇（长翅） -->
            <g id="scene1-f1-male" class="scene1-element">
                <!-- 身体 -->
                <ellipse cx="250" cy="185" rx="10" ry="14" class="scene1-fly-body scene1-male-color"/>
                <!-- 长翅（大） -->
                <ellipse cx="262" cy="182" rx="9" ry="13" class="scene1-fly-wing-long"/>
                <!-- 标签 -->
                <text x="250" y="162" text-anchor="middle" class="scene1-phenotype-text">长翅♂</text>
                <!-- 基因型 -->
                <text x="250" y="220" text-anchor="middle" class="scene1-genotype-text">
                    AaX<tspan dy="-4" font-size="8">B</tspan><tspan dy="0">Y</tspan>
                </text>
            </g>

            <!-- F₁→配子箭头 -->
            <line id="scene1-arrow-f1-gamete" class="scene1-element scene1-arrow" x1="180" y1="235" x2="180" y2="260"/>

            <!-- 配子区标题 -->
            <text id="scene1-gamete-title" class="scene1-element scene1-title-text" x="50" y="265">F₁配子</text>

            <!-- ♀配子 -->
            <g id="scene1-female-gametes" class="scene1-element">
                <text x="95" y="288" class="scene1-genotype-text">AX<tspan dy="-4" font-size="8">B</tspan></text>
                <text x="145" y="288" class="scene1-genotype-text">AX<tspan dy="-4" font-size="8">b</tspan></text>
                <text x="195" y="288" class="scene1-genotype-text">aX<tspan dy="-4" font-size="8">B</tspan></text>
                <text x="245" y="288" class="scene1-genotype-text">aX<tspan dy="-4" font-size="8">b</tspan></text>
            </g>

            <!-- ♂配子 -->
            <g id="scene1-male-gametes" class="scene1-element">
                <text x="310" y="288" class="scene1-genotype-text">AX<tspan dy="-4" font-size="8">B</tspan></text>
                <text x="360" y="288" class="scene1-genotype-text">AY</text>
                <text x="410" y="288" class="scene1-genotype-text">aX<tspan dy="-4" font-size="8">B</tspan></text>
                <text x="460" y="288" class="scene1-genotype-text">aY</text>
            </g>

            <!-- F₂代标题 -->
            <text id="scene1-f2-title" class="scene1-element scene1-title-text" x="50" y="315">F₂代</text>

            <!-- F₂棋盘格（简化） -->
            <g id="scene1-f2-grid" class="scene1-element">
                <!-- 网格框架 -->
                <rect x="80" y="325" width="450" height="50" class="scene1-grid-cell" fill="none"/>
                <!-- 分隔线 -->
                <line x1="195" y1="325" x2="195" y2="375" class="scene1-grid-line"/>
                <line x1="310" y1="325" x2="310" y2="375" class="scene1-grid-line"/>
                <line x1="425" y1="325" x2="425" y2="375" class="scene1-grid-line"/>
                <line x1="530" y1="325" x2="530" y2="375" class="scene1-grid-line"/>
                
                <!-- 长翅区域（9/16） -->
                <rect x="80" y="325" width="230" height="50" class="scene1-long-wing-cell"/>
                <text x="195" y="355" text-anchor="middle" class="scene1-genotype-text" font-size="11">长翅</text>
                
                <!-- 小翅区域（3/16） -->
                <rect x="310" y="325" width="115" height="50" class="scene1-small-wing-cell"/>
                <text x="367" y="355" text-anchor="middle" class="scene1-genotype-text" font-size="11">小翅♂</text>
                
                <!-- 残翅区域（4/16） -->
                <rect x="425" y="325" width="105" height="50" class="scene1-vestigial-cell"/>
                <text x="477" y="355" text-anchor="middle" class="scene1-genotype-text" font-size="11">残翅</text>
            </g>

            <!-- 表型比例 -->
            <g id="scene1-ratio" class="scene1-element">
                <text x="560" y="345" class="scene1-ratio-text">9:3:4</text>
                <text x="560" y="365" class="scene1-ratio-text" font-size="11" fill="#666">长：小：残</text>
            </g>

            <!-- 控件栏 -->
            <g id="scene1-controls">
                <button id="scene1-prev-btn" class="scene1-btn">◀ 上一步</button>
                <span id="scene1-step-indicator">步骤 1/5</span>
                <button id="scene1-next-btn" class="scene1-btn">下一步 ▶</button>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // 状态管理
        let currentState = 0;
        const totalSteps = 5;

        // 每步显示的元素 ID 列表
        const steps = [
            // 步骤 0: P 代
            ['scene1-p-title', 'scene1-p-female', 'scene1-p-male', 'scene1-p-cross'],
            // 步骤 1: F₁代
            ['scene1-p-title', 'scene1-p-female', 'scene1-p-male', 'scene1-p-cross', 'scene1-arrow-p-f1', 'scene1-f1-title', 'scene1-f1-female', 'scene1-f1-male'],
            // 步骤 2: 配子
            ['scene1-p-title', 'scene1-p-female', 'scene1-p-male', 'scene1-p-cross', 'scene1-arrow-p-f1', 'scene1-f1-title', 'scene1-f1-female', 'scene1-f1-male', 'scene1-arrow-f1-gamete', 'scene1-gamete-title', 'scene1-female-gametes', 'scene1-male-gametes'],
            // 步骤 3: F₂棋盘格
            ['scene1-p-title', 'scene1-p-female', 'scene1-p-male', 'scene1-p-cross', 'scene1-arrow-p-f1', 'scene1-f1-title', 'scene1-f1-female', 'scene1-f1-male', 'scene1-arrow-f1-gamete', 'scene1-gamete-title', 'scene1-female-gametes', 'scene1-male-gametes', 'scene1-f2-title', 'scene1-f2-grid'],
            // 步骤 4: 表型比例
            ['scene1-p-title', 'scene1-p-female', 'scene1-p-male', 'scene1-p-cross', 'scene1-arrow-p-f1', 'scene1-f1-title', 'scene1-f1-female', 'scene1-f1-male', 'scene1-arrow-f1-gamete', 'scene1-gamete-title', 'scene1-female-gametes', 'scene1-male-gametes', 'scene1-f2-title', 'scene1-f2-grid', 'scene1-ratio']
        ];

        // 更新显示
        function updateDisplay() {
            const allElements = document.querySelectorAll('.scene1-element');
            const currentStepElements = steps[currentState];

            allElements.forEach(el => {
                const id = el.id;
                if (currentStepElements.includes(id)) {
                    el.classList.add('scene1-visible');
                } else {
                    el.classList.remove('scene1-visible');
                }
            });

            // 更新按钮状态
            const prevBtn = document.getElementById('scene1-prev-btn');
            const nextBtn = document.getElementById('scene1-next-btn');
            const indicator = document.getElementById('scene1-step-indicator');

            prevBtn.disabled = (currentState === 0);
            nextBtn.disabled = (currentState === totalSteps - 1);
            indicator.textContent = `步骤 ${currentState + 1}/${totalSteps}`;
        }

        // 按钮事件
        document.getElementById('scene1-prev-btn').addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                updateDisplay();
            }
        });

        document.getElementById('scene1-next-btn').addEventListener('click', function() {
            if (currentState < totalSteps - 1) {
                currentState++;
                updateDisplay();
            }
        });

        // 初始化
        updateDisplay();
    })();
    </script>
</body>
</html>
