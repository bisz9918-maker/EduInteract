<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遗传系谱图分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; background: #1565c0; color: white; }
        .scene1-btn:disabled { background: #cccccc; cursor: not-allowed; opacity: 0.6; }
        .scene1-step-indicator { font-size: 14px; color: #333; margin: 0 10px; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 标题 -->
            <text id="scene1-title" x="400" y="25" text-anchor="middle" font-size="18" font-weight="bold">遗传系谱图分析</text>

            <!-- 代际标签（调整位置避免与个体标签重叠） -->
            <text id="scene1-gen-I-label" x="10" y="65" font-size="16" font-weight="bold">Ⅰ</text>
            <text id="scene1-gen-II-label" x="10" y="185" font-size="16" font-weight="bold">Ⅱ</text>
            <text id="scene1-gen-III-label" x="10" y="305" font-size="16" font-weight="bold">Ⅲ</text>

            <!-- 高亮框（初始隐藏） -->
            <rect id="scene1-highlight-box1" x="70" y="50" width="80" height="150" fill="#1565c0" opacity="0.2" display="none"/>
            <rect id="scene1-highlight-box2" x="290" y="170" width="80" height="150" fill="#1565c0" opacity="0.2" display="none"/>
            <rect id="scene1-highlight-box3" x="310" y="50" width="80" height="150" fill="#c62828" opacity="0.2" display="none"/>
            <rect id="scene1-highlight-box4" x="430" y="170" width="80" height="150" fill="#c62828" opacity="0.2" display="none"/>

            <!-- Ⅰ代个体 -->
            <!-- Ⅰ1: 正常女性 (圆形，白色) -->
            <circle id="scene1-individual-I1" cx="80" cy="60" r="15" fill="#ffffff" stroke="#000000" stroke-width="2"/>
            <text id="scene1-label-I1" x="70" y="55" font-size="12">Ⅰ1</text>

            <!-- Ⅰ2: 正常男性 (正方形，白色) -->
            <rect id="scene1-individual-I2" x="125" y="45" width="30" height="30" fill="#ffffff" stroke="#000000" stroke-width="2"/>
            <text id="scene1-label-I2" x="150" y="55" font-size="12">Ⅰ2</text>

            <!-- Ⅰ1-Ⅰ2 婚配线 -->
            <line id="scene1-marriage-I1-I2" x1="80" y1="60" x2="140" y2="60" stroke="#000000" stroke-width="2"/>

            <!-- Ⅰ3: 患乙病男性 (正方形，灰色) -->

            <!-- Ⅰ4: 患乙病女性 (圆形，灰色) -->

            <text id="scene1-label-I4" x="390" y="55" font-size="12">Ⅰ4</text>

            <!-- Ⅰ3-Ⅰ4 婚配线 -->
            <line id="scene1-marriage-I3-I4" x1="325" y1="60" x2="365" y2="60" stroke="#000000" stroke-width="2"/>

            <!-- Ⅱ代个体 -->
            <!-- Ⅱ1: 正常男性 -->
            <rect id="scene1-individual-II1" x="45" y="165" width="30" height="30" fill="#ffffff" stroke="#000000" stroke-width="2"/>

            <!-- Ⅱ2: 正常女性 -->
            <circle id="scene1-individual-II2" cx="120" cy="180" r="15" fill="#ffffff" stroke="#000000" stroke-width="2"/>
            <text id="scene1-label-II2" x="110" y="180" font-size="12">Ⅱ2</text>

            <!-- Ⅱ3: 患甲病男性 (蓝色) -->
            <rect id="scene1-individual-II3" x="165" y="165" width="30" height="30" fill="#1565c0" stroke="#000000" stroke-width="2"/>
            <text id="scene1-label-II3" x="170" y="215" font-size="12">Ⅱ3</text>

            <!-- Ⅱ4: XX男性 (虚线框) -->
            <rect id="scene1-individual-II4" x="225" y="165" width="30" height="30" fill="#ffffff" stroke="#888888" stroke-width="2" stroke-dasharray="4,2"/>
            <text id="scene1-label-II4" x="230" y="215" font-size="12">Ⅱ4</text>

            <!-- Ⅱ5: 正常女性 -->
            <circle id="scene1-individual-II5" cx="300" cy="180" r="15" fill="#ffffff" stroke="#000000" stroke-width="2"/>
            <text id="scene1-label-II5" x="295" y="215" font-size="12">Ⅱ5</text>

            <!-- Ⅱ6: 正常男性 -->
            <rect id="scene1-individual-II6" x="345" y="165" width="30" height="30" fill="#ffffff" stroke="#000000" stroke-width="2"/>
            <text id="scene1-label-II6" x="350" y="215" font-size="12">Ⅱ6</text>

            <!-- Ⅱ7: 患乙病女性 (灰色) -->
            <circle id="scene1-individual-II7" cx="440" cy="180" r="15" fill="#888888" stroke="#000000" stroke-width="2"/>
            <text id="scene1-label-II7" x="435" y="215" font-size="12">Ⅱ7</text>

            <!-- Ⅱ8: 正常男性 -->
            <rect id="scene1-individual-II8" x="485" y="165" width="30" height="30" fill="#ffffff" stroke="#000000" stroke-width="2"/>
            <text id="scene1-label-II8" x="490" y="215" font-size="12">Ⅱ8</text>

            <!-- Ⅱ9: 患乙病女性 (灰色) -->
            <circle id="scene1-individual-II9" cx="560" cy="180" r="15" fill="#888888" stroke="#000000" stroke-width="2"/>
            <text id="scene1-label-II9" x="555" y="215" font-size="12">Ⅱ9</text>

            <!-- Ⅱ10: 患乙病男性 (灰色) -->
            <rect id="scene1-individual-II10" x="605" y="165" width="30" height="30" fill="#888888" stroke="#000000" stroke-width="2"/>
            <text id="scene1-label-II10" x="610" y="215" font-size="12">Ⅱ10</text>

            <!-- Ⅱ11: 正常女性 -->
            <circle id="scene1-individual-II11" cx="680" cy="180" r="15" fill="#ffffff" stroke="#000000" stroke-width="2"/>
            <text id="scene1-label-II11" x="675" y="215" font-size="12">Ⅱ11</text>

            <!-- Ⅰ1-Ⅰ2 → Ⅱ代子女连接线 -->
            <line id="scene1-parent-line-1" x1="110" y1="60" x2="110" y2="100" stroke="#000000" stroke-width="2"/>
            <line id="scene1-sibling-line-1" x1="60" y1="100" x2="240" y2="100" stroke="#000000" stroke-width="2"/>
            <line id="scene1-child-line-II1" x1="60" y1="100" x2="60" y2="165" stroke="#000000" stroke-width="2"/>
            <line id="scene1-child-line-II2" x1="120" y1="100" x2="120" y2="165" stroke="#000000" stroke-width="2"/>
            <line id="scene1-child-line-II3" x1="180" y1="100" x2="180" y2="165" stroke="#000000" stroke-width="2"/>
            <line id="scene1-child-line-II4" x1="240" y1="100" x2="240" y2="165" stroke="#000000" stroke-width="2"/>

            <!-- Ⅰ3-Ⅰ4 → Ⅱ代子女连接线 -->
            <line id="scene1-parent-line-2" x1="345" y1="60" x2="345" y2="100" stroke="#000000" stroke-width="2"/>
            <line id="scene1-sibling-line-2" x1="300" y1="100" x2="680" y2="100" stroke="#000000" stroke-width="2"/>
            <line id="scene1-child-line-II5" x1="300" y1="100" x2="300" y2="165" stroke="#000000" stroke-width="2"/>
            <line id="scene1-child-line-II6" x1="360" y1="100" x2="360" y2="165" stroke="#000000" stroke-width="2"/>
            <line id="scene1-child-line-II7" x1="440" y1="100" x2="440" y2="165" stroke="#000000" stroke-width="2"/>
            <line id="scene1-child-line-II8" x1="500" y1="100" x2="500" y2="165" stroke="#000000" stroke-width="2"/>
            <line id="scene1-child-line-II9" x1="560" y1="100" x2="560" y2="165" stroke="#000000" stroke-width="2"/>
            <line id="scene1-child-line-II10" x1="620" y1="100" x2="620" y2="165" stroke="#000000" stroke-width="2"/>
            <line id="scene1-child-line-II11" x1="680" y1="100" x2="680" y2="165" stroke="#000000" stroke-width="2"/>

            <!-- Ⅱ5-Ⅱ6 婚配线 -->
            <line id="scene1-marriage-II5-II6" x1="300" y1="180" x2="360" y2="180" stroke="#000000" stroke-width="2"/>

            <!-- Ⅱ7-Ⅱ8 婚配线 -->
            <line id="scene1-marriage-II7-II8" x1="440" y1="180" x2="500" y2="180" stroke="#000000" stroke-width="2"/>

            <!-- Ⅲ代个体 -->
            <!-- Ⅲ1: 正常女性 -->
            <circle id="scene1-individual-III1" cx="90" cy="300" r="15" fill="#ffffff" stroke="#000000" stroke-width="2"/>
            <text id="scene1-label-III1" x="85" y="335" font-size="12">Ⅲ1</text>

            <!-- Ⅲ2: 患甲病男性 (蓝色) -->
            <rect id="scene1-individual-III2" x="315" y="285" width="30" height="30" fill="#1565c0" stroke="#000000" stroke-width="2"/>
            <text id="scene1-label-III2" x="320" y="335" font-size="12">Ⅲ2</text>

            <!-- Ⅲ3: 患乙病女性 (灰色) -->
            <circle id="scene1-individual-III3" cx="450" cy="300" r="15" fill="#888888" stroke="#000000" stroke-width="2"/>
            <text id="scene1-label-III3" x="445" y="335" font-size="12">Ⅲ3</text>

            <!-- Ⅲ4: 患乙病男性 (灰色) -->
            <rect id="scene1-individual-III4" x="605" y="285" width="30" height="30" fill="#888888" stroke="#000000" stroke-width="2"/>
            <text id="scene1-label-III4" x="610" y="335" font-size="12">Ⅲ4</text>

            <!-- Ⅲ5: 正常男性 -->
            <rect id="scene1-individual-III5" x="665" y="285" width="30" height="30" fill="#ffffff" stroke="#000000" stroke-width="2"/>
            <text id="scene1-label-III5" x="670" y="335" font-size="12">Ⅲ5</text>

            <!-- Ⅱ1-Ⅱ2 → Ⅲ1 连接线 -->
            <line id="scene1-parent-line-3" x1="75" y1="180" x2="75" y2="220" stroke="#000000" stroke-width="2"/>
            <line id="scene1-sibling-line-3" x1="75" y1="220" x2="105" y2="220" stroke="#000000" stroke-width="2"/>
            <line id="scene1-child-line-III1" x1="90" y1="220" x2="90" y2="285" stroke="#000000" stroke-width="2"/>

            <!-- Ⅱ5-Ⅱ6 → Ⅲ2 连接线 -->
            <line id="scene1-parent-line-4" x1="330" y1="180" x2="330" y2="220" stroke="#000000" stroke-width="2"/>
            <line id="scene1-sibling-line-4" x1="330" y1="220" x2="330" y2="220" stroke="#000000" stroke-width="2"/>
            <line id="scene1-child-line-III2" x1="330" y1="220" x2="330" y2="285" stroke="#000000" stroke-width="2"/>

            <!-- Ⅱ7-Ⅱ8 → Ⅲ3 连接线 -->
            <line id="scene1-parent-line-5" x1="470" y1="180" x2="470" y2="220" stroke="#000000" stroke-width="2"/>
            <line id="scene1-sibling-line-5" x1="450" y1="220" x2="490" y2="220" stroke="#000000" stroke-width="2"/>
            <line id="scene1-child-line-III3" x1="450" y1="220" x2="450" y2="285" stroke="#000000" stroke-width="2"/>

            <!-- Ⅱ9-Ⅱ10 → Ⅲ4,Ⅲ5 连接线 -->
            <line id="scene1-parent-line-6" x1="590" y1="180" x2="590" y2="220" stroke="#000000" stroke-width="2"/>
            <line id="scene1-sibling-line-6" x1="620" y1="220" x2="680" y2="220" stroke="#000000" stroke-width="2"/>
            <line id="scene1-child-line-III4" x1="620" y1="220" x2="620" y2="285" stroke="#000000" stroke-width="2"/>
            <line id="scene1-child-line-III5" x1="680" y1="220" x2="680" y2="285" stroke="#000000" stroke-width="2"/>

            <!-- 推导箭头（初始隐藏） -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#2e7d32"/>
                </marker>
            </defs>
            <path id="scene1-arrow1" d="M150,100 L180,160" stroke="#2e7d32" stroke-width="3" fill="none" marker-end="url(#scene1-arrowhead)" display="none"/>
            <path id="scene1-arrow2" d="M330,200 L330,280" stroke="#2e7d32" stroke-width="3" fill="none" marker-end="url(#scene1-arrowhead)" display="none"/>
            <path id="scene1-arrow3" d="M350,100 L450,160" stroke="#2e7d32" stroke-width="3" fill="none" marker-end="url(#scene1-arrowhead)" display="none"/>

            <!-- 图例区 -->
            <rect id="scene1-legend-bg" x="720" y="20" width="70" height="120" fill="#f5f5f5" stroke="#cccccc" stroke-width="1"/>
            <text id="scene1-legend-title" x="755" y="40" text-anchor="middle" font-size="14" font-weight="bold">图例</text>

            <!-- 图例1: 正常男女 -->
            <rect id="scene1-legend-normal-m" x="730" y="50" width="15" height="15" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
            <circle id="scene1-legend-normal-f" cx="755" cy="57.5" r="7.5" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
            <text id="scene1-legend-text1" x="775" y="62" font-size="11">正常</text>

            <!-- 图例2: 患甲病 -->
            <rect id="scene1-legend-aa-m" x="730" y="75" width="15" height="15" fill="#1565c0" stroke="#000000" stroke-width="1.5"/>
            <circle id="scene1-legend-aa-f" cx="755" cy="82.5" r="7.5" fill="#1565c0" stroke="#000000" stroke-width="1.5"/>
            <text id="scene1-legend-text2" x="775" y="87" font-size="11">甲病</text>

            <!-- 图例3: 患乙病 -->
            <rect id="scene1-legend-bb-m" x="730" y="100" width="15" height="15" fill="#888888" stroke="#000000" stroke-width="1.5"/>
            <circle id="scene1-legend-bb-f" cx="755" cy="107.5" r="7.5" fill="#888888" stroke="#000000" stroke-width="1.5"/>
            <text id="scene1-legend-text3" x="775" y="112" font-size="11">乙病</text>

            <!-- 图例4: XX男性 -->
            <rect id="scene1-legend-xx-m" x="730" y="125" width="15" height="15" fill="#ffffff" stroke="#888888" stroke-width="1.5" stroke-dasharray="3,2"/>
            <text id="scene1-legend-text4" x="755" y="137" font-size="11">XX男性</text>

            <!-- 结论文字区 -->
            <text id="scene1-conclusion-text" x="400" y="420" text-anchor="middle" font-size="14" fill="#333">请分析甲病和乙病的遗传方式</text>

            <!-- 控件栏（放在 SVG 内部底部） -->
            <g id="scene1-controls-group">
                <rect id="scene1-btn-prev-bg" x="280" y="450" width="80" height="30" fill="#1565c0" rx="4"/>
                <text id="scene1-btn-prev-text" x="320" y="470" text-anchor="middle" fill="#ffffff" font-size="14">◀ 上一步</text>
                <rect id="scene1-btn-next-bg" x="440" y="450" width="80" height="30" fill="#1565c0" rx="4"/>
                <text id="scene1-btn-next-text" x="480" y="470" text-anchor="middle" fill="#ffffff" font-size="14">下一步 ▶</text>
                <text id="scene1-step-indicator" x="400" y="465" text-anchor="middle" font-size="14" fill="#333">步骤 1/5</text>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 1 实现：遗传系谱图分析

        // 状态变量
        let currentStep = 0;
        const totalSteps = 5;

        // 结论文本数组
        const conclusions = [
            "请分析甲病和乙病的遗传方式",
            "Ⅰ1×Ⅰ2正常→Ⅱ3患甲病：无中生有为隐性，甲病为隐性遗传",
            "Ⅱ6携带甲病基因但正常，若为伴X隐性则Ⅱ6必患病，故甲病为常染色体隐性遗传",
            "Ⅰ3×Ⅰ4患乙病→Ⅱ8正常：有中生无为显性，排除隐性遗传；若为伴X显性，Ⅰ3患病则女儿必患病，但Ⅱ5正常，故排除伴X显性",
            "乙病可能为常染色体显性或常染色体隐性遗传（需进一步信息确认）",
            "分析完成：甲病为常染色体隐性遗传；乙病可能为常染色体显性或隐性遗传"
        ];

        // 获取元素辅助函数
        function getById(id) {
            return document.getElementById(id);
        }

        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }

        function hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 更新显示状态
        function updateDisplay() {
            // 高亮框
            const box1 = getById('scene1-highlight-box1');
            const box2 = getById('scene1-highlight-box2');
            const box3 = getById('scene1-highlight-box3');
            const box4 = getById('scene1-highlight-box4');

            // 箭头
            const arrow1 = getById('scene1-arrow1');
            const arrow2 = getById('scene1-arrow2');
            const arrow3 = getById('scene1-arrow3');

            // 结论文字
            const conclusionText = getById('scene1-conclusion-text');

            // 步骤指示器
            const stepIndicator = getById('scene1-step-indicator');

            // 按钮背景（用于禁用状态）
            const prevBg = getById('scene1-btn-prev-bg');
            const nextBg = getById('scene1-btn-next-bg');
            const prevText = getById('scene1-btn-prev-text');
            const nextText = getById('scene1-btn-next-text');

            // 重置所有高亮和箭头
            hide(box1);
            hide(box2);
            hide(box3);
            hide(box4);
            hide(arrow1);
            hide(arrow2);
            hide(arrow3);

            // 根据当前步骤显示对应元素
            if (currentStep >= 1) {
                show(box1);
                show(arrow1);
            }
            if (currentStep >= 2) {
                show(box2);
                show(arrow2);
            }
            if (currentStep >= 3) {
                show(box3);
                show(arrow3);
            }
            if (currentStep >= 4) {
                show(box4);
            }

            // 更新结论文字
            if (conclusionText) {
                conclusionText.textContent = conclusions[currentStep];
            }

            // 更新步骤指示器
            if (stepIndicator) {
                stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;
            }

            // 更新按钮状态
            if (currentStep === 0) {
                // 第一步，禁用上一步
                prevBg.setAttribute('fill', '#cccccc');
                prevText.setAttribute('fill', '#999999');
            } else {
                prevBg.setAttribute('fill', '#1565c0');
                prevText.setAttribute('fill', '#ffffff');
            }

            if (currentStep === totalSteps - 1) {
                // 最后一步，禁用下一步
                nextBg.setAttribute('fill', '#cccccc');
                nextText.setAttribute('fill', '#999999');
            } else {
                nextBg.setAttribute('fill', '#1565c0');
                nextText.setAttribute('fill', '#ffffff');
            }
        }

        // 按钮点击事件
        function handlePrevClick() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        }

        function handleNextClick() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateDisplay();
            }
        }

        // 绑定按钮事件
        const prevBtnBg = getById('scene1-btn-prev-bg');
        const nextBtnBg = getById('scene1-btn-next-bg');

        if (prevBtnBg) {
            prevBtnBg.addEventListener('click', handlePrevClick);
            prevBtnBg.style.cursor = 'pointer';
        }

        if (nextBtnBg) {
            nextBtnBg.addEventListener('click', handleNextClick);
            nextBtnBg.style.cursor = 'pointer';
        }

        // 初始化显示
        updateDisplay();

    })();
    </script>
</body>
</html>
