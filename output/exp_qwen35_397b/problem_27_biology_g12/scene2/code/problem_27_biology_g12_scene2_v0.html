<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遗传概率计算可视化 - Ⅱ5×Ⅱ6 婚配概率计算</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        .fade-in {
            animation: fadeIn 300ms ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .btn {
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.8;
        }
        .btn-disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 标题 -->
            <text id="scene2-title" x="400" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Ⅱ5×Ⅱ6 婚配概率计算</text>

            <!-- Ⅱ5信息框 -->
            <rect id="scene2-ii5-box" x="80" y="70" width="140" height="80" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
            <text id="scene2-ii5-label" x="150" y="95" text-anchor="middle" font-size="14" fill="#333">Ⅱ5 ♀</text>
            <text id="scene2-ii5-phenotype" x="150" y="120" text-anchor="middle" font-size="13" fill="#333">表现型：正常</text>
            <text id="scene2-ii5-genotype" x="150" y="145" text-anchor="middle" font-size="13" fill="#333">基因型：待推导</text>

            <!-- Ⅱ6信息框 -->
            <rect id="scene2-ii6-box" x="260" y="70" width="140" height="80" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
            <text id="scene2-ii6-label" x="330" y="95" text-anchor="middle" font-size="14" fill="#333">Ⅱ6 ♂</text>
            <text id="scene2-ii6-phenotype" x="330" y="120" text-anchor="middle" font-size="13" fill="#333">表现型：正常</text>
            <text id="scene2-ii6-genotype" x="330" y="145" text-anchor="middle" font-size="13" fill="#333">基因型：待推导</text>

            <!-- 说明文本（步骤1显示） -->
            <text id="scene2-explanation" x="400" y="175" text-anchor="middle" font-size="12" fill="#666" opacity="0">甲病为常染色体隐性遗传</text>

            <!-- 配子箭头（步骤2显示） -->
            <path id="scene2-arrow-ii5" d="M150 160 L150 195 M145 185 L150 195 L155 185" stroke="#1565c0" stroke-width="2" fill="none" opacity="0"/>
            <path id="scene2-arrow-ii6" d="M330 160 L330 195 M325 185 L330 195 L335 185" stroke="#1565c0" stroke-width="2" fill="none" opacity="0"/>

            <!-- 配子文本（步骤2显示） -->
            <text id="scene2-gamete-ii5-A" x="130" y="215" text-anchor="middle" font-size="14" fill="#1565c0" opacity="0">A</text>
            <text id="scene2-gamete-ii5-a" x="170" y="215" text-anchor="middle" font-size="14" fill="#1565c0" opacity="0">a</text>
            <text id="scene2-gamete-ii6-A" x="310" y="215" text-anchor="middle" font-size="14" fill="#1565c0" opacity="0">A</text>
            <text id="scene2-gamete-ii6-a" x="350" y="215" text-anchor="middle" font-size="14" fill="#1565c0" opacity="0">a</text>

            <!-- 棋盘格外框 -->
            <rect id="scene2-punnett-grid" x="250" y="240" width="300" height="180" fill="none" stroke="#000000" stroke-width="2"/>

            <!-- 棋盘格横线 -->
            <line id="scene2-grid-h1" x1="250" y1="285" x2="550" y2="285" stroke="#000000" stroke-width="1" opacity="0"/>
            <line id="scene2-grid-h2" x1="250" y1="330" x2="550" y2="330" stroke="#000000" stroke-width="1" opacity="0"/>
            <line id="scene2-grid-h3" x1="250" y1="375" x2="550" y2="375" stroke="#000000" stroke-width="1" opacity="0"/>

            <!-- 棋盘格竖线 -->
            <line id="scene2-grid-v1" x1="325" y1="240" x2="325" y2="420" stroke="#000000" stroke-width="1" opacity="0"/>
            <line id="scene2-grid-v2" x1="400" y1="240" x2="400" y2="420" stroke="#000000" stroke-width="1" opacity="0"/>
            <line id="scene2-grid-v3" x1="475" y1="240" x2="475" y2="420" stroke="#000000" stroke-width="1" opacity="0"/>

            <!-- 棋盘格标签 -->
            <text id="scene2-grid-label-corner" x="280" y="265" text-anchor="middle" font-size="12" fill="#333" opacity="0">配子</text>
            <text id="scene2-grid-top-A1" x="345" y="265" text-anchor="middle" font-size="12" fill="#1565c0" opacity="0">A</text>
            <text id="scene2-grid-top-a1" x="420" y="265" text-anchor="middle" font-size="12" fill="#1565c0" opacity="0">a</text>
            <text id="scene2-grid-top-A2" x="495" y="265" text-anchor="middle" font-size="12" fill="#1565c0" opacity="0">A</text>
            <text id="scene2-grid-top-a2" x="535" y="265" text-anchor="middle" font-size="12" fill="#1565c0" opacity="0">a</text>
            <text id="scene2-grid-left-A" x="265" y="310" text-anchor="middle" font-size="12" fill="#1565c0" opacity="0">A</text>
            <text id="scene2-grid-left-a" x="265" y="355" text-anchor="middle" font-size="12" fill="#1565c0" opacity="0">a</text>

            <!-- 棋盘格单元格 -->
            <!-- 第一行 -->
            <rect id="scene2-cell-1" x="325" y="285" width="75" height="45" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1" opacity="0"/>
            <text id="scene2-cell-1-text" x="362.5" y="310" text-anchor="middle" font-size="12" fill="#333" opacity="0">AA</text>

            <rect id="scene2-cell-2" x="400" y="285" width="75" height="45" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1" opacity="0"/>
            <text id="scene2-cell-2-text" x="437.5" y="310" text-anchor="middle" font-size="12" fill="#333" opacity="0">Aa</text>

            <rect id="scene2-cell-3" x="475" y="285" width="75" height="45" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1" opacity="0"/>
            <text id="scene2-cell-3-text" x="512.5" y="310" text-anchor="middle" font-size="12" fill="#333" opacity="0">Aa</text>

            <!-- 第二行 -->
            <rect id="scene2-cell-4" x="325" y="330" width="75" height="45" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1" opacity="0"/>
            <text id="scene2-cell-4-text" x="362.5" y="355" text-anchor="middle" font-size="12" fill="#333" opacity="0">Aa</text>

            <rect id="scene2-cell-5" x="400" y="330" width="75" height="45" fill="#ffcdd2" stroke="#c62828" stroke-width="1" opacity="0"/>
            <text id="scene2-cell-5-text" x="437.5" y="355" text-anchor="middle" font-size="12" fill="#333" opacity="0">aa</text>

            <rect id="scene2-cell-6" x="475" y="330" width="75" height="45" fill="#ffcdd2" stroke="#c62828" stroke-width="1" opacity="0"/>
            <text id="scene2-cell-6-text" x="512.5" y="355" text-anchor="middle" font-size="12" fill="#333" opacity="0">aa</text>

            <!-- 第三行 -->
            <rect id="scene2-cell-7" x="325" y="375" width="75" height="45" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1" opacity="0"/>
            <text id="scene2-cell-7-text" x="362.5" y="400" text-anchor="middle" font-size="12" fill="#333" opacity="0">Aa</text>

            <rect id="scene2-cell-8" x="400" y="375" width="75" height="45" fill="#ffcdd2" stroke="#c62828" stroke-width="1" opacity="0"/>
            <text id="scene2-cell-8-text" x="437.5" y="400" text-anchor="middle" font-size="12" fill="#333" opacity="0">aa</text>

            <rect id="scene2-cell-9" x="475" y="375" width="75" height="45" fill="#ffcdd2" stroke="#c62828" stroke-width="1" opacity="0"/>
            <text id="scene2-cell-9-text" x="512.5" y="400" text-anchor="middle" font-size="12" fill="#333" opacity="0">aa</text>

            <!-- 概率结果框 -->
            <rect id="scene2-prob-box" x="600" y="280" width="160" height="100" fill="#fff9c4" stroke="#fbc02d" stroke-width="1"/>
            <text id="scene2-prob-title" x="680" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">子代概率</text>
            <text id="scene2-prob-normal" x="680" y="335" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000" opacity="0">正常：3/4</text>
            <text id="scene2-prob-boy" x="680" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000" opacity="0">男孩：1/2</text>
            <text id="scene2-prob-final" x="680" y="395" text-anchor="middle" font-size="15" font-weight="bold" fill="#d32f27" opacity="0">正常男孩=3/8</text>

            <!-- 分隔线 -->
            <line id="scene2-separator" x1="50" y1="415" x2="750" y2="415" stroke="#999" stroke-width="1" stroke-dasharray="5,5" opacity="0"/>

            <!-- Ⅲ2×Ⅲ3区域 -->
            <text id="scene2-iii-title" x="400" y="435" text-anchor="middle" font-size="13" fill="#333" opacity="0">Ⅲ2×Ⅲ3 概率计算</text>
            <text id="scene2-iii2-info" x="150" y="460" text-anchor="middle" font-size="12" fill="#333" opacity="0">Ⅲ2：患乙病男性</text>
            <text id="scene2-iii3-info" x="350" y="460" text-anchor="middle" font-size="12" fill="#333" opacity="0">Ⅲ3：患乙病女性</text>
            <text id="scene2-iii-result" x="600" y="460" text-anchor="middle" font-size="13" font-weight="bold" fill="#d32f27" opacity="0">正常孩子概率：1/9</text>

            <!-- 控件按钮 -->
            <rect id="scene2-btn-prev-bg" x="320" y="450" width="70" height="30" fill="#1976d2" rx="4"/>
            <text id="scene2-btn-prev-text" x="355" y="470" text-anchor="middle" font-size="13" fill="#ffffff">◀上一步</text>

            <rect id="scene2-btn-next-bg" x="410" y="450" width="70" height="30" fill="#1976d2" rx="4"/>
            <text id="scene2-btn-next-text" x="445" y="470" text-anchor="middle" font-size="13" fill="#ffffff">下一步▶</text>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 2 实现 - 遗传概率计算可视化

        // 状态管理
        let currentState = 0;
        const maxState = 5;

        // 工具函数：显示元素
        function showElement(id) {
            const el = document.getElementById('scene2-' + id);
            if (el) {
                el.style.opacity = '1';
                el.classList.add('fade-in');
            }
        }

        // 工具函数：隐藏元素
        function hideElement(id) {
            const el = document.getElementById('scene2-' + id);
            if (el) {
                el.style.opacity = '0';
                el.classList.remove('fade-in');
            }
        }

        // 工具函数：更新文本内容
        function updateText(id, text) {
            const el = document.getElementById('scene2-' + id);
            if (el) {
                el.textContent = text;
            }
        }

        // 渲染每个状态
        function renderState(state) {
            // 步骤0：初始状态
            if (state === 0) {
                // Ⅱ5和Ⅱ6基因型显示"待推导"
                updateText('ii5-genotype', '基因型：待推导');
                updateText('ii6-genotype', '基因型：待推导');
                hideElement('explanation');
                hideElement('arrow-ii5');
                hideElement('arrow-ii6');
                hideElement('gamete-ii5-A');
                hideElement('gamete-ii5-a');
                hideElement('gamete-ii6-A');
                hideElement('gamete-ii6-a');
                hideElement('grid-h1');
                hideElement('grid-h2');
                hideElement('grid-h3');
                hideElement('grid-v1');
                hideElement('grid-v2');
                hideElement('grid-v3');
                hideElement('grid-label-corner');
                hideElement('grid-top-A1');
                hideElement('grid-top-a1');
                hideElement('grid-top-A2');
                hideElement('grid-top-a2');
                hideElement('grid-left-A');
                hideElement('grid-left-a');
                for (let i = 1; i <= 9; i++) {
                    hideElement('cell-' + i);
                    hideElement('cell-' + i + '-text');
                }
                hideElement('prob-normal');
                hideElement('prob-boy');
                hideElement('prob-final');
                hideElement('separator');
                hideElement('iii-title');
                hideElement('iii2-info');
                hideElement('iii3-info');
                hideElement('iii-result');
                updateText('btn-next-text', '下一步▶');
            }

            // 步骤1：显示基因型推导
            if (state >= 1) {
                updateText('ii5-genotype', '基因型：Aa（甲病）');
                updateText('ii6-genotype', '基因型：Aa（携带者）');
                showElement('explanation');
            }

            // 步骤2：显示配子
            if (state >= 2) {
                showElement('arrow-ii5');
                showElement('arrow-ii6');
                showElement('gamete-ii5-A');
                showElement('gamete-ii5-a');
                showElement('gamete-ii6-A');
                showElement('gamete-ii6-a');
            }

            // 步骤3：显示棋盘格
            if (state >= 3) {
                showElement('grid-h1');
                showElement('grid-h2');
                showElement('grid-h3');
                showElement('grid-v1');
                showElement('grid-v2');
                showElement('grid-v3');
                showElement('grid-label-corner');
                showElement('grid-top-A1');
                showElement('grid-top-a1');
                showElement('grid-top-A2');
                showElement('grid-top-a2');
                showElement('grid-left-A');
                showElement('grid-left-a');
                for (let i = 1; i <= 9; i++) {
                    showElement('cell-' + i);
                    showElement('cell-' + i + '-text');
                }
            }

            // 步骤4：显示概率结果
            if (state >= 4) {
                showElement('prob-normal');
                showElement('prob-boy');
                showElement('prob-final');
            }

            // 步骤5：显示Ⅲ2×Ⅲ3计算
            if (state >= 5) {
                showElement('separator');
                showElement('iii-title');
                showElement('iii2-info');
                showElement('iii3-info');
                showElement('iii-result');
                updateText('btn-next-text', '重新开始');
            }

            // 更新按钮状态
            updateButtonState();
        }

        // 更新按钮状态
        function updateButtonState() {
            const prevBtn = document.getElementById('scene2-btn-prev-bg');
            const nextBtn = document.getElementById('scene2-btn-next-bg');

            if (currentState === 0) {
                prevBtn.style.opacity = '0.5';
                prevBtn.style.cursor = 'not-allowed';
            } else {
                prevBtn.style.opacity = '1';
                prevBtn.style.cursor = 'pointer';
            }

            if (currentState === maxState) {
                nextBtn.style.opacity = '1';
                nextBtn.style.cursor = 'pointer';
            } else {
                nextBtn.style.opacity = '1';
                nextBtn.style.cursor = 'pointer';
            }
        }

        // 上一步按钮点击
        function handlePrev() {
            if (currentState > 0) {
                currentState--;
                renderState(currentState);
            }
        }

        // 下一步按钮点击
        function handleNext() {
            if (currentState < maxState) {
                currentState++;
                renderState(currentState);
            } else {
                // 重新开始
                currentState = 0;
                renderState(currentState);
            }
        }

        // 绑定按钮事件
        document.getElementById('scene2-btn-prev-bg').addEventListener('click', handlePrev);
        document.getElementById('scene2-btn-next-bg').addEventListener('click', handleNext);

        // 初始化
        renderState(currentState);
    })();
    </script>
</body>
</html>
