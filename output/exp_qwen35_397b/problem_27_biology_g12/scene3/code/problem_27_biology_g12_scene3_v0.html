<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>染色体易位导致 XX 男性</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene3-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene3-svg {
            width: 800px;
            height: 500px;
        }
        .chromosome-band {
            stroke: #cccccc;
            stroke-width: 1;
            fill: none;
        }
        .slider-track {
            fill: #e0e0e0;
        }
        .slider-handle {
            fill: #1565c0;
            cursor: pointer;
        }
        .slider-handle:hover {
            fill: #0d47a1;
        }
        #scene3-status-text {
            font-size: 14px;
            fill: #333333;
            text-anchor: middle;
        }
        #scene3-variation-label {
            font-size: 14px;
            fill: #666666;
            text-anchor: middle;
        }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 标题 -->
            <text id="scene3-title" x="400" y="40" font-size="18" fill="#333333" text-anchor="middle" font-weight="bold">染色体易位导致 XX 男性</text>
            
            <!-- 左侧区域标题 -->
            <text id="scene3-left-title" x="150" y="75" font-size="14" fill="#333333" text-anchor="middle">正常 XY 男性</text>
            
            <!-- 右侧区域标题 -->
            <text id="scene3-right-title" x="650" y="75" font-size="14" fill="#333333" text-anchor="middle">异常 XX 男性 (Ⅱ4)</text>
            
            <!-- 左侧区域：正常 XY 男性 -->
            <g id="scene3-left-group" opacity="1">
                <!-- X 染色体 (左) -->
                <path id="scene3-chrX-left" d="M80,120 L120,200 L80,280 M120,120 L80,200 L120,280" 
                      stroke="#1565c0" stroke-width="8" fill="none" stroke-linecap="round"/>
                <!-- X 染色体带纹 -->
                <line class="chromosome-band" x1="85" y1="150" x2="115" y2="150"/>
                <line class="chromosome-band" x1="85" y1="200" x2="115" y2="200"/>
                <line class="chromosome-band" x1="85" y1="250" x2="115" y2="250"/>
                <!-- X 标签 -->
                <text id="scene3-x-label-left" x="65" y="200" font-size="14" fill="#333333" text-anchor="end">X</text>
                
                <!-- Y 染色体 (左) -->
                <path id="scene3-chrY-left" d="M140,140 L170,200 L140,260 M170,140 L140,200 L170,260" 
                      stroke="#c62828" stroke-width="6" fill="none" stroke-linecap="round"/>
                <!-- Y 染色体带纹 -->
                <line class="chromosome-band" x1="145" y1="165" x2="165" y2="165"/>
                <line class="chromosome-band" x1="145" y1="200" x2="165" y2="200"/>
                <line class="chromosome-band" x1="145" y1="235" x2="165" y2="235"/>
                <!-- Y 标签 -->
                <text id="scene3-y-label-left" x="180" y="200" font-size="14" fill="#333333" text-anchor="start">Y</text>
                
                <!-- SRY 基因 (左 Y 上) -->
                <rect id="scene3-sry-left" x="145" y="150" width="20" height="25" fill="#2e7d32" opacity="1"/>
                <!-- SRY 标签 (左) -->
                <text id="scene3-sry-label-left" x="175" y="165" font-size="14" fill="#2e7d32" text-anchor="start" font-weight="bold">SRY</text>
                
                <!-- 断裂点虚线 -->
                <line id="scene3-break-line" x1="140" y1="180" x2="170" y2="180" stroke="#333333" stroke-width="1" stroke-dasharray="4,4" opacity="0"/>
            </g>
            
            <!-- 中间过渡区 -->
            <g id="scene3-mid-group" opacity="0">
                <!-- X 染色体 -->
                <path id="scene3-chrX-mid" d="M320,120 L360,200 L320,280 M360,120 L320,200 L360,280" 
                      stroke="#1565c0" stroke-width="8" fill="none" stroke-linecap="round"/>
                <line class="chromosome-band" x1="325" y1="150" x2="355" y2="150"/>
                <line class="chromosome-band" x1="325" y1="200" x2="355" y2="200"/>
                <line class="chromosome-band" x1="325" y1="250" x2="355" y2="250"/>
                
                <!-- Y 染色体残段 (下半段) -->
                <path id="scene3-chrY-mid" d="M380,190 L405,225 L380,260 M405,190 L380,225 L405,260" 
                      stroke="#c62828" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.5"/>
                
                <!-- SRY 游离片段 -->
                <rect id="scene3-sry-mid" x="385" y="140" width="25" height="30" fill="#2e7d32"/>
                <!-- SRY 标签 (中间，跟随游离片段) -->
                <text id="scene3-sry-label-mid" x="420" y="160" font-size="14" fill="#2e7d32" text-anchor="start" font-weight="bold" opacity="0">SRY</text>
                
                <!-- 常染色体 -->
                <path id="scene3-chrAuto-mid" d="M430,120 L460,200 L430,280 M460,120 L430,200 L460,280" 
                      stroke="#888888" stroke-width="6" fill="none" stroke-linecap="round"/>
                <line class="chromosome-band" x1="435" y1="150" x2="455" y2="150"/>
                <line class="chromosome-band" x1="435" y1="200" x2="455" y2="200"/>
                <line class="chromosome-band" x1="435" y1="250" x2="455" y2="250"/>
                
                <!-- 易位箭头 -->
                <path id="scene3-translocation-arrow" d="M415,175 L420,185 L410,185 Z M420,175 L420,195" 
                      stroke="#333333" stroke-width="2" fill="#333333" opacity="0"/>
            </g>
            
            <!-- 右侧区域：异常 XX 男性 -->
            <g id="scene3-right-group" opacity="0">
                <!-- X 染色体 1 -->
                <path id="scene3-chrX1-right" d="M580,120 L620,200 L580,280 M620,120 L580,200 L620,280" 
                      stroke="#1565c0" stroke-width="8" fill="none" stroke-linecap="round"/>
                <line class="chromosome-band" x1="585" y1="150" x2="615" y2="150"/>
                <line class="chromosome-band" x1="585" y1="200" x2="615" y2="200"/>
                <line class="chromosome-band" x1="585" y1="250" x2="615" y2="250"/>
                <!-- X 标签 1 -->
                <text id="scene3-x-label-right1" x="565" y="200" font-size="14" fill="#333333" text-anchor="end">X</text>
                
                <!-- X 染色体 2 -->
                <path id="scene3-chrX2-right" d="M640,120 L680,200 L640,280 M680,120 L640,200 L680,280" 
                      stroke="#1565c0" stroke-width="8" fill="none" stroke-linecap="round"/>
                <line class="chromosome-band" x1="645" y1="150" x2="675" y2="150"/>
                <line class="chromosome-band" x1="645" y1="200" x2="675" y2="200"/>
                <line class="chromosome-band" x1="645" y1="250" x2="675" y2="250"/>
                <!-- X 标签 2 -->
                <text id="scene3-x-label-right2" x="695" y="200" font-size="14" fill="#333333" text-anchor="start">X</text>
                
                <!-- 常染色体 -->
                <path id="scene3-chrAuto-right" d="M700,120 L730,200 L700,280 M730,120 L700,200 L730,280" 
                      stroke="#888888" stroke-width="6" fill="none" stroke-linecap="round"/>
                <line class="chromosome-band" x1="705" y1="150" x2="725" y2="150"/>
                <line class="chromosome-band" x1="705" y1="200" x2="725" y2="200"/>
                <line class="chromosome-band" x1="705" y1="250" x2="725" y2="250"/>
                
                <!-- SRY 基因 (右常上) -->
                <rect id="scene3-sry-right" x="705" y="145" width="20" height="25" fill="#2e7d32"/>
                <!-- SRY 标签 (右) -->
                <text id="scene3-sry-label-right" x="735" y="160" font-size="14" fill="#2e7d32" text-anchor="start" font-weight="bold">SRY</text>
                
                <!-- 常染色体标签 -->
                <text id="scene3-auto-label-right" x="745" y="200" font-size="14" fill="#333333" text-anchor="start">常染色体</text>
            </g>
            
            <!-- 变异类型标签 -->
            <text id="scene3-variation-label" x="400" y="320" font-size="14" fill="#666666" text-anchor="middle">染色体结构变异·易位</text>
            
            <!-- 状态说明文字 -->
            <text id="scene3-status-text" x="400" y="425">正常 XY 男性：X 染色体 + Y 染色体（Y 上含 SRY 基因）</text>
            
            <!-- 滑块控制区 -->
            <g id="scene3-slider-group">
                <!-- 滑块轨道 -->
                <rect id="scene3-slider-track" x="200" y="455" width="400" height="20" rx="10" class="slider-track"/>
                <!-- 滑块手柄 -->
                <circle id="scene3-slider-handle" cx="200" cy="465" r="12" class="slider-handle"/>
                <!-- 刻度标签 -->
                <text x="185" y="490" font-size="12" fill="#666666" text-anchor="end">0%</text>
                <text x="400" y="490" font-size="12" fill="#666666" text-anchor="middle">50%</text>
                <text x="615" y="490" font-size="12" fill="#666666" text-anchor="start">100%</text>
            </g>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 3 实现：染色体易位导致 XX 男性
        
        // 布局坐标表参考：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 标题文字 | text | (400,40) | ~200×24 | - | 居中 |
        // | 左侧区域标题 | text | (150,75) | ~80×16 | - | "正常 XY 男性" |
        // | 右侧区域标题 | text | (650,75) | ~80×16 | - | "异常 XX 男性 (Ⅱ4)" |
        // | X 染色体 (左) | path | (80,120)-(120,280) | 40×160 | 左侧 | 蓝色#1565c0 |
        // | Y 染色体 (左) | path | (140,140)-(170,260) | 30×120 | 右侧 | 红色#c62828 |
        // | SRY 基因 (左 Y 上) | rect | (145,150)-(165,175) | 20×25 | 右侧 | 绿色#2e7d32 |
        // | SRY 标签 (左) | text | (175,165) | ~35×14 | 右方 | "SRY" |
        // | X 标签 (左) | text | (65,200) | ~15×14 | 左方 | "X" |
        // | Y 标签 (左) | text | (180,200) | ~15×14 | 右方 | "Y" |
        // | 中间过渡区 X 染色体 | path | (320,120)-(360,280) | 40×160 | - | 蓝色#1565c0 |
        // | 中间 SRY 游离片段 | rect | (385,140)-(410,170) | 25×30 | - | 绿色#2e7d32 |
        // | 中间 SRY 标签 | text | (420,160) | ~35×14 | 右方 | "SRY" |
        // | 中间常染色体 | path | (430,120)-(460,280) | 30×160 | - | 灰色#888888 |
        // | 右侧 X 染色体 1 | path | (580,120)-(620,280) | 40×160 | 左侧 | 蓝色#1565c0 |
        // | 右侧 X 染色体 2 | path | (640,120)-(680,280) | 40×160 | 右侧 | 蓝色#1565c0 |
        // | 右侧常染色体 | path | (700,120)-(730,280) | 30×160 | 右侧 | 灰色#888888 |
        // | SRY 基因 (右常上) | rect | (705,145)-(725,170) | 20×25 | 右侧 | 绿色#2e7d32 |
        // | 滑块轨道 | rect | (200,455)-(600,475) | 400×20 | - | 浅灰色背景 |
        // | 滑块手柄 | circle | (200,465) | r=12 | - | 可拖拽 |
        
        // 状态变量
        let sliderValue = 0; // 0-100
        let isDragging = false;
        
        // DOM 元素
        const sliderHandle = document.getElementById('scene3-slider-handle');
        const sliderTrack = document.getElementById('scene3-slider-track');
        const statusText = document.getElementById('scene3-status-text');
        
        // 左侧区域元素
        const leftGroup = document.getElementById('scene3-left-group');
        const chrYLeft = document.getElementById('scene3-chrY-left');
        const sryLeft = document.getElementById('scene3-sry-left');
        const sryLabelLeft = document.getElementById('scene3-sry-label-left');
        const yLabelLeft = document.getElementById('scene3-y-label-left');
        const breakLine = document.getElementById('scene3-break-line');
        
        // 中间区域元素
        const midGroup = document.getElementById('scene3-mid-group');
        const chrYMid = document.getElementById('scene3-chrY-mid');
        const sryMid = document.getElementById('scene3-sry-mid');
        const sryLabelMid = document.getElementById('scene3-sry-label-mid');
        const translocationArrow = document.getElementById('scene3-translocation-arrow');
        
        // 右侧区域元素
        const rightGroup = document.getElementById('scene3-right-group');
        const sryRight = document.getElementById('scene3-sry-right');
        const sryLabelRight = document.getElementById('scene3-sry-label-right');
        
        // 更新显示状态
        function updateDisplay() {
            // 计算透明度
            const leftOpacity = 1 - sliderValue / 100;
            const midOpacity = sliderValue <= 50 ? sliderValue / 50 : (100 - sliderValue) / 50;
            const rightOpacity = sliderValue / 100;
            
            // 更新左侧区域
            leftGroup.setAttribute('opacity', Math.max(0, leftOpacity));
            
            if (sliderValue < 25) {
                chrYLeft.setAttribute('opacity', 1);
                sryLeft.setAttribute('opacity', 1);
                sryLabelLeft.setAttribute('opacity', 1);
                yLabelLeft.setAttribute('opacity', 1);
                breakLine.setAttribute('opacity', 0);
            } else if (sliderValue < 50) {
                const fadeProgress = (sliderValue - 25) / 25;
                chrYLeft.setAttribute('opacity', 1 - fadeProgress);
                sryLeft.setAttribute('opacity', 1 - fadeProgress);
                sryLabelLeft.setAttribute('opacity', 1 - fadeProgress);
                yLabelLeft.setAttribute('opacity', 1 - fadeProgress);
                breakLine.setAttribute('opacity', fadeProgress);
            } else {
                chrYLeft.setAttribute('opacity', 0);
                sryLeft.setAttribute('opacity', 0);
                sryLabelLeft.setAttribute('opacity', 0);
                yLabelLeft.setAttribute('opacity', 0);
                breakLine.setAttribute('opacity', 0);
            }
            
            // 更新中间区域
            midGroup.setAttribute('opacity', midOpacity);
            if (sliderValue >= 25 && sliderValue <= 75) {
                const midProgress = (sliderValue - 25) / 50;
                chrYMid.setAttribute('opacity', midProgress * 0.5);
                sryMid.setAttribute('opacity', 1);
                
                // 中间 SRY 标签在 35%-65% 显示
                if (sliderValue > 35 && sliderValue < 65) {
                    sryLabelMid.setAttribute('opacity', 1);
                } else {
                    sryLabelMid.setAttribute('opacity', 0);
                }
                
                translocationArrow.setAttribute('opacity', sliderValue > 50 ? (sliderValue - 50) / 25 : 0);
            } else {
                sryLabelMid.setAttribute('opacity', 0);
            }
            
            // 更新 SRY 游离片段位置（从 Y 染色体到常染色体）
            if (sliderValue >= 25 && sliderValue <= 75) {
                const progress = (sliderValue - 25) / 50;
                const startX = 155, startY = 162; // 左侧 SRY 中心
                const endX = 715, endY = 157; // 右侧常染色体上 SRY 位置
                const currentX = startX + (endX - startX) * progress;
                const currentY = startY + (endY - startY) * progress;
                sryMid.setAttribute('x', currentX - 12.5);
                sryMid.setAttribute('y', currentY - 15);
                
                // 中间 SRY 标签跟随移动
                sryLabelMid.setAttribute('x', currentX + 15);
                sryLabelMid.setAttribute('y', currentY + 5);
            }
            
            // 更新右侧区域
            rightGroup.setAttribute('opacity', rightOpacity);
            if (sliderValue > 75) {
                const rightProgress = (sliderValue - 75) / 25;
                sryRight.setAttribute('opacity', rightProgress);
                sryLabelRight.setAttribute('opacity', rightProgress);
            } else {
                sryRight.setAttribute('opacity', 0);
                sryLabelRight.setAttribute('opacity', 0);
            }
            
            // 更新状态说明文字
            if (sliderValue < 25) {
                statusText.textContent = '正常 XY 男性：X 染色体 + Y 染色体（Y 上含 SRY 基因）';
            } else if (sliderValue < 50) {
                statusText.textContent = 'Y 染色体断裂：SRY 基因片段从 Y 染色体分离';
            } else if (sliderValue < 75) {
                statusText.textContent = 'SRY 片段移接中：向常染色体移动';
            } else {
                statusText.textContent = '易位完成：XX 染色体 + 含 SRY 的常染色体 → XX 男性 (Ⅱ4)';
            }
            
            // 更新滑块手柄位置
            const trackStartX = 200;
            const trackEndX = 600;
            const handleX = trackStartX + (trackEndX - trackStartX) * (sliderValue / 100);
            sliderHandle.setAttribute('cx', handleX);
        }
        
        // 滑块拖拽事件处理
        function handleMouseDown(e) {
            isDragging = true;
            e.preventDefault();
        }
        
        function handleMouseMove(e) {
            if (!isDragging) return;
            
            const svg = document.getElementById('scene3-svg');
            const rect = svg.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            
            // 限制在轨道范围内
            const trackStartX = 200;
            const trackEndX = 600;
            const clampedX = Math.max(trackStartX, Math.min(trackEndX, mouseX));
            
            // 计算滑块值
            sliderValue = ((clampedX - trackStartX) / (trackEndX - trackStartX)) * 100;
            sliderValue = Math.max(0, Math.min(100, sliderValue));
            
            updateDisplay();
        }
        
        function handleMouseUp() {
            isDragging = false;
        }
        
        // 触摸事件支持
        function handleTouchStart(e) {
            isDragging = true;
            e.preventDefault();
        }
        
        function handleTouchMove(e) {
            if (!isDragging) return;
            
            const svg = document.getElementById('scene3-svg');
            const rect = svg.getBoundingClientRect();
            const touchX = e.touches[0].clientX - rect.left;
            
            const trackStartX = 200;
            const trackEndX = 600;
            const clampedX = Math.max(trackStartX, Math.min(trackEndX, touchX));
            
            sliderValue = ((clampedX - trackStartX) / (trackEndX - trackStartX)) * 100;
            sliderValue = Math.max(0, Math.min(100, sliderValue));
            
            updateDisplay();
            e.preventDefault();
        }
        
        function handleTouchEnd() {
            isDragging = false;
        }
        
        // 绑定事件
        sliderHandle.addEventListener('mousedown', handleMouseDown);
        document.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseup', handleMouseUp);
        
        sliderHandle.addEventListener('touchstart', handleTouchStart, { passive: false });
        document.addEventListener('touchmove', handleTouchMove, { passive: false });
        document.addEventListener('touchend', handleTouchEnd);
        
        // 初始化显示
        updateDisplay();
        
    })();
    </script>
</body>
</html>
