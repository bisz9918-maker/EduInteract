<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6 组交配实验数据对比</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        .scene1-bar-hairy {
            fill: #2e7d32;
            fill-opacity: 0.2;
            stroke: #2e7d32;
            stroke-width: 1;
            transition: all 0.3s ease;
        }
        .scene1-bar-bald {
            fill: #c62828;
            fill-opacity: 0.2;
            stroke: #c62828;
            stroke-width: 1;
            transition: all 0.3s ease;
        }
        .scene1-bar-highlight {
            fill-opacity: 0.8 !important;
            stroke-width: 3 !important;
        }
        .scene1-parent-label {
            fill: #1565c0;
            font-size: 13px;
            font-weight: normal;
            transition: all 0.3s ease;
        }
        .scene1-parent-label-highlight {
            font-weight: bold !important;
            font-size: 14px !important;
        }
        .scene1-ref-line {
            stroke: #888888;
            stroke-width: 1;
            stroke-dasharray: 5,5;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .scene1-ref-line-visible {
            opacity: 1;
        }
        .scene1-btn {
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .scene1-btn:hover {
            fill: #1976d2;
        }
        .scene1-btn-disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }
        .scene1-btn-text {
            fill: #ffffff;
            font-size: 14px;
            font-weight: bold;
            pointer-events: none;
        }
        .scene1-step-indicator {
            fill: #333333;
            font-size: 14px;
            text-anchor: middle;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 标题 -->
            <text id="scene1-title" x="400" y="35" text-anchor="middle" font-size="18px" font-weight="bold" fill="#333333">6 组交配实验数据对比</text>
            
            <!-- 图例框 -->
            <rect id="scene1-legend-box" x="620" y="20" width="150" height="50" fill="#f5f5f5" stroke="#cccccc" stroke-width="1"/>
            <rect id="scene1-legend-hairy" x="630" y="35" width="20" height="15" fill="#2e7d32" fill-opacity="0.8" stroke="#2e7d32" stroke-width="1"/>
            <text id="scene1-legend-hairy-label" x="655" y="47" font-size="13px" fill="#333333">有毛</text>
            <rect id="scene1-legend-bald" x="630" y="55" width="20" height="15" fill="#c62828" fill-opacity="0.8" stroke="#c62828" stroke-width="1"/>
            <text id="scene1-legend-bald-label" x="655" y="67" font-size="13px" fill="#333333">无毛</text>
            
            <!-- 坐标轴 -->
            <line id="scene1-y-axis" x1="100" y1="80" x2="100" y2="380" stroke="#000000" stroke-width="2"/>
            <line id="scene1-x-axis" x1="100" y1="380" x2="750" y2="380" stroke="#000000" stroke-width="2"/>
            
            <!-- 纵轴刻度标签 -->
            <text id="scene1-y-0" x="85" y="385" font-size="13px" fill="#666666" text-anchor="end">0</text>
            <text id="scene1-y-50" x="85" y="335" font-size="13px" fill="#666666" text-anchor="end">50</text>
            <text id="scene1-y-100" x="75" y="285" font-size="13px" fill="#666666" text-anchor="end">100</text>
            <text id="scene1-y-150" x="75" y="235" font-size="13px" fill="#666666" text-anchor="end">150</text>
            <text id="scene1-y-200" x="75" y="185" font-size="13px" fill="#666666" text-anchor="end">200</text>
            <text id="scene1-y-250" x="75" y="135" font-size="13px" fill="#666666" text-anchor="end">250</text>
            
            <!-- 纵轴标签 -->
            <text id="scene1-y-label" x="40" y="230" font-size="13px" fill="#666666" text-anchor="middle" transform="rotate(-90, 40, 230)">子代数量</text>
            
            <!-- 理论比例参考线（初始隐藏） -->
            <line id="scene1-ref-line-100" x1="100" y1="280" x2="750" y2="280" class="scene1-ref-line"/>
            <line id="scene1-ref-line-200" x1="100" y1="180" x2="750" y2="180" class="scene1-ref-line"/>
            
            <!-- 组 1：♀无×♂有，有毛 12，无毛 9 -->
            <!-- 柱子高度 = 数值/250 * 300，y = 380 - 高度 -->
            <rect id="scene1-bar-hairy-1" x="120" y="362.4" width="35" height="14.4" class="scene1-bar-hairy"/>
            <rect id="scene1-bar-bald-1" x="165" y="369.2" width="35" height="10.8" class="scene1-bar-bald"/>
            <text id="scene1-label-value-hairy-1" x="137.5" y="357" font-size="11px" fill="#333333" text-anchor="middle">12</text>
            <text id="scene1-label-value-bald-1" x="182.5" y="364" font-size="11px" fill="#333333" text-anchor="middle">9</text>
            <text id="scene1-label-group-1" x="142.5" y="405" font-size="13px" fill="#333333" text-anchor="middle">组 1</text>
            <text id="scene1-label-parent-1" x="142.5" y="60" font-size="13px" class="scene1-parent-label" text-anchor="middle">♀无×♂有</text>
            
            <!-- 组 2：♀有×♂无，有毛 27，无毛 20 -->
            <rect id="scene1-bar-hairy-2" x="230" y="347.6" width="35" height="32.4" class="scene1-bar-hairy"/>
            <rect id="scene1-bar-bald-2" x="275" y="356" width="35" height="24" class="scene1-bar-bald"/>
            <text id="scene1-label-value-hairy-2" x="247.5" y="342" font-size="11px" fill="#333333" text-anchor="middle">27</text>
            <text id="scene1-label-value-bald-2" x="292.5" y="351" font-size="11px" fill="#333333" text-anchor="middle">20</text>
            <text id="scene1-label-group-2" x="252.5" y="405" font-size="13px" fill="#333333" text-anchor="middle">组 2</text>
            <text id="scene1-label-parent-2" x="252.5" y="60" font-size="13px" class="scene1-parent-label" text-anchor="middle">♀有×♂无</text>
            
            <!-- 组 3：♀有×♂有，有毛 110，无毛 29 -->
            <rect id="scene1-bar-hairy-3" x="340" y="248" width="35" height="132" class="scene1-bar-hairy"/>
            <rect id="scene1-bar-bald-3" x="385" y="345.2" width="35" height="34.8" class="scene1-bar-bald"/>
            <text id="scene1-label-value-hairy-3" x="357.5" y="243" font-size="11px" fill="#333333" text-anchor="middle">110</text>
            <text id="scene1-label-value-bald-3" x="402.5" y="340" font-size="11px" fill="#333333" text-anchor="middle">29</text>
            <text id="scene1-label-group-3" x="362.5" y="405" font-size="13px" fill="#333333" text-anchor="middle">组 3</text>
            <text id="scene1-label-parent-3" x="362.5" y="60" font-size="13px" class="scene1-parent-label" text-anchor="middle">♀有×♂有</text>
            
            <!-- 组 4：♀无×♂无，有毛 0，无毛 11 -->
            <rect id="scene1-bar-hairy-4" x="450" y="380" width="35" height="0" class="scene1-bar-hairy"/>
            <rect id="scene1-bar-bald-4" x="495" y="366.8" width="35" height="13.2" class="scene1-bar-bald"/>
            <text id="scene1-label-value-hairy-4" x="467.5" y="378" font-size="11px" fill="#333333" text-anchor="middle">0</text>
            <text id="scene1-label-value-bald-4" x="512.5" y="361" font-size="11px" fill="#333333" text-anchor="middle">11</text>
            <text id="scene1-label-group-4" x="472.5" y="405" font-size="13px" fill="#333333" text-anchor="middle">组 4</text>
            <text id="scene1-label-parent-4" x="472.5" y="60" font-size="13px" class="scene1-parent-label" text-anchor="middle">♀无×♂无</text>
            
            <!-- 组 5：♀无×♂有，有毛 13，无毛 0 -->
            <rect id="scene1-bar-hairy-5" x="560" y="364.4" width="35" height="15.6" class="scene1-bar-hairy"/>
            <rect id="scene1-bar-bald-5" x="605" y="380" width="35" height="0" class="scene1-bar-bald"/>
            <text id="scene1-label-value-hairy-5" x="577.5" y="359" font-size="11px" fill="#333333" text-anchor="middle">13</text>
            <text id="scene1-label-value-bald-5" x="622.5" y="378" font-size="11px" fill="#333333" text-anchor="middle">0</text>
            <text id="scene1-label-group-5" x="582.5" y="405" font-size="13px" fill="#333333" text-anchor="middle">组 5</text>
            <text id="scene1-label-parent-5" x="582.5" y="60" font-size="13px" class="scene1-parent-label" text-anchor="middle">♀无×♂有</text>
            
            <!-- 组 6：♀有×♂无，有毛 40，无毛 0 -->
            <rect id="scene1-bar-hairy-6" x="670" y="332" width="35" height="48" class="scene1-bar-hairy"/>
            <rect id="scene1-bar-bald-6" x="715" y="380" width="35" height="0" class="scene1-bar-bald"/>
            <text id="scene1-label-value-hairy-6" x="687.5" y="327" font-size="11px" fill="#333333" text-anchor="middle">40</text>
            <text id="scene1-label-value-bald-6" x="732.5" y="378" font-size="11px" fill="#333333" text-anchor="middle">0</text>
            <text id="scene1-label-group-6" x="692.5" y="405" font-size="13px" fill="#333333" text-anchor="middle">组 6</text>
            <text id="scene1-label-parent-6" x="692.5" y="60" font-size="13px" class="scene1-parent-label" text-anchor="middle">♀有×♂无</text>
            
            <!-- 步骤指示器 -->
            <text id="scene1-step-indicator" x="400" y="435" class="scene1-step-indicator">步骤 1/5</text>
            
            <!-- 上一步按钮 -->
            <g id="scene1-btn-prev-group" class="scene1-btn scene1-btn-disabled">
                <rect id="scene1-btn-prev-bg" x="320" y="450" width="80" height="32" rx="4" fill="#1976d2"/>
                <text id="scene1-btn-prev-text" x="360" y="471" class="scene1-btn-text" text-anchor="middle">◀ 上一步</text>
            </g>
            
            <!-- 下一步按钮 -->
            <g id="scene1-btn-next-group" class="scene1-btn">
                <rect id="scene1-btn-next-bg" x="420" y="450" width="80" height="32" rx="4" fill="#1976d2"/>
                <text id="scene1-btn-next-text" x="460" y="471" class="scene1-btn-text" text-anchor="middle">下一步 ▶</text>
            </g>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现：6 组交配实验数据对比
        
        // 布局坐标表（实现对照依据）：
        // 标题：(400,35) 居中
        // 图例：右上角 (620,20) 150×50
        // 纵轴：(100,80)-(100,380)
        // 横轴：(100,380)-(750,380)
        // 柱子高度计算：height = (value/250) * 300, y = 380 - height
        // 组 1: x=120/165, 组 2: x=230/275, 组 3: x=340/385
        // 组 4: x=450/495, 组 5: x=560/605, 组 6: x=670/715
        // 按钮：上一步 (320,450), 下一步 (420,450)
        
        // 数据配置
        const groupData = [
            { group: 1, parent: '♀无×♂有', hairy: 12, bald: 9 },
            { group: 2, parent: '♀有×♂无', hairy: 27, bald: 20 },
            { group: 3, parent: '♀有×♂有', hairy: 110, bald: 29 },
            { group: 4, parent: '♀无×♂无', hairy: 0, bald: 11 },
            { group: 5, parent: '♀无×♂有', hairy: 13, bald: 0 },
            { group: 6, parent: '♀有×♂无', hairy: 40, bald: 0 }
        ];
        
        // 步骤配置
        const steps = [
            { highlight: [], showRefLines: false },  // 步骤 0：完整数据概览
            { highlight: [4], showRefLines: false },  // 步骤 1：高亮第 4 组
            { highlight: [5, 6], showRefLines: false },  // 步骤 2：高亮第 5、6 组
            { highlight: [1, 2, 3], showRefLines: false },  // 步骤 3：高亮第 1、2、3 组
            { highlight: [], showRefLines: true }  // 步骤 4：显示参考线
        ];
        
        // 当前步骤状态
        let currentStep = 0;
        const totalSteps = 5;
        
        // DOM 元素引用
        const stepIndicator = document.getElementById('scene1-step-indicator');
        const btnPrevGroup = document.getElementById('scene1-btn-prev-group');
        const btnNextGroup = document.getElementById('scene1-btn-next-group');
        const refLine100 = document.getElementById('scene1-ref-line-100');
        const refLine200 = document.getElementById('scene1-ref-line-200');
        
        // 获取指定组的所有相关元素
        function getGroupElements(groupNum) {
            return {
                hairyBar: document.getElementById(`scene1-bar-hairy-${groupNum}`),
                baldBar: document.getElementById(`scene1-bar-bald-${groupNum}`),
                parentLabel: document.getElementById(`scene1-label-parent-${groupNum}`)
            };
        }
        
        // 清除所有高亮
        function clearHighlights() {
            for (let i = 1; i <= 6; i++) {
                const els = getGroupElements(i);
                if (els.hairyBar) els.hairyBar.classList.remove('scene1-bar-highlight');
                if (els.baldBar) els.baldBar.classList.remove('scene1-bar-highlight');
                if (els.parentLabel) els.parentLabel.classList.remove('scene1-parent-label-highlight');
            }
        }
        
        // 应用高亮
        function applyHighlight(groupNum) {
            const els = getGroupElements(groupNum);
            if (els.hairyBar) els.hairyBar.classList.add('scene1-bar-highlight');
            if (els.baldBar) els.baldBar.classList.add('scene1-bar-highlight');
            if (els.parentLabel) els.parentLabel.classList.add('scene1-parent-label-highlight');
        }
        
        // 更新视图
        function updateView() {
            // 清除所有高亮
            clearHighlights();
            
            // 应用当前步骤的高亮
            const currentStepConfig = steps[currentStep];
            currentStepConfig.highlight.forEach(groupNum => {
                applyHighlight(groupNum);
            });
            
            // 更新参考线可见性
            if (currentStepConfig.showRefLines) {
                refLine100.classList.add('scene1-ref-line-visible');
                refLine200.classList.add('scene1-ref-line-visible');
            } else {
                refLine100.classList.remove('scene1-ref-line-visible');
                refLine200.classList.remove('scene1-ref-line-visible');
            }
            
            // 更新步骤指示器（显示 1-5 而非 0-4）
            stepIndicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;
            
            // 更新按钮状态
            if (currentStep === 0) {
                btnPrevGroup.classList.add('scene1-btn-disabled');
            } else {
                btnPrevGroup.classList.remove('scene1-btn-disabled');
            }
            
            if (currentStep === totalSteps - 1) {
                btnNextGroup.classList.add('scene1-btn-disabled');
            } else {
                btnNextGroup.classList.remove('scene1-btn-disabled');
            }
        }
        
        // 上一步
        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                updateView();
            }
        }
        
        // 下一步
        function nextStep() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateView();
            }
        }
        
        // 绑定按钮事件
        btnPrevGroup.addEventListener('click', prevStep);
        btnNextGroup.addEventListener('click', nextStep);
        
        // 初始化视图
        updateView();
        
    })();
    </script>
</body>
</html>
