<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遗传图解 - 第 4、5、6 组遗传数据分析</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        /* 元素分组样式 */
        .scene2-group {
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .scene2-visible {
            opacity: 1;
        }
        /* 按钮样式 */
        .scene2-btn {
            cursor: pointer;
            transition: opacity 0.2s ease;
        }
        .scene2-btn-disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        /* 结论框样式 */
        #scene2-conclusion-box {
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        /* 对比箭头样式 */
        #scene2-arrow-5-6-top,
        #scene2-arrow-5-6-bottom {
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        /* 高亮动画 */
        @keyframes scene2-highlight {
            0%, 100% { stroke: #1565c0; stroke-width: 2; }
            50% { stroke: #0d47a1; stroke-width: 3; }
        }
        .scene2-highlight {
            animation: scene2-highlight 0.6s ease 2;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene2-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000000" />
                </marker>
            </defs>

            <!-- ========== 第 4 组遗传图解 (y=30~170) ========== -->
            <g id="scene2-group4" class="scene2-group scene2-visible">
                <!-- 标题 -->
                <text x="50" y="30" font-size="16" font-weight="bold" fill="#000000">第 4 组</text>
                <!-- 亲本行 -->
                <text x="50" y="65" font-size="14" fill="#000000">
                    <tspan fill="#1565c0" font-weight="bold">♀无毛</tspan>
                    <tspan fill="#2e7d32">(Aa)</tspan>
                    <tspan fill="#000000"> × </tspan>
                    <tspan fill="#1565c0" font-weight="bold">♂无毛</tspan>
                    <tspan fill="#2e7d32">(Aa)</tspan>
                </text>
                <!-- 配子行 -->
                <text x="50" y="100" font-size="14" fill="#000000">
                    <tspan fill="#000000">配子：</tspan>
                    <tspan fill="#2e7d32">A</tspan>
                    <tspan fill="#000000">、</tspan>
                    <tspan fill="#c62828">a</tspan>
                    <tspan fill="#000000">        </tspan>
                    <tspan fill="#2e7d32">A</tspan>
                    <tspan fill="#000000">、</tspan>
                    <tspan fill="#c62828">a</tspan>
                </text>
                <!-- 子代基因型 -->
                <text x="50" y="135" font-size="14" fill="#000000">
                    <tspan fill="#000000">F₁: </tspan>
                    <tspan fill="#2e7d32">AA</tspan>
                    <tspan fill="#000000">、</tspan>
                    <tspan fill="#2e7d32">Aa</tspan>
                    <tspan fill="#000000">、</tspan>
                    <tspan fill="#c62828">aa</tspan>
                </text>
                <!-- 子代表型 -->
                <text x="50" y="170" font-size="14" fill="#000000">
                    <tspan fill="#1565c0">无毛:有毛 = 3:1</tspan>
                </text>
                <!-- 实际数据 -->
                <text x="250" y="170" font-size="12" fill="#666666">(实际: 0:11)</text>
            </g>

            <!-- ========== 第 5 组遗传图解 (y=200~340) ========== -->
            <g id="scene2-group5" class="scene2-group">
                <!-- 标题 -->
                <text x="50" y="200" font-size="16" font-weight="bold" fill="#000000">第 5 组</text>
                <!-- 亲本行 -->
                <text x="50" y="235" font-size="14" fill="#000000" id="scene2-group5-parents">
                    <tspan fill="#1565c0" font-weight="bold">♀无毛</tspan>
                    <tspan fill="#2e7d32">(Aa)</tspan>
                    <tspan fill="#000000"> × </tspan>
                    <tspan fill="#1565c0" font-weight="bold">♂有毛</tspan>
                    <tspan fill="#c62828">(aa)</tspan>
                </text>
                <!-- 配子行 -->
                <text x="50" y="270" font-size="14" fill="#000000">
                    <tspan fill="#000000">配子：</tspan>
                    <tspan fill="#2e7d32">A</tspan>
                    <tspan fill="#000000">、</tspan>
                    <tspan fill="#c62828">a</tspan>
                    <tspan fill="#000000">        </tspan>
                    <tspan fill="#c62828">a</tspan>
                </text>
                <!-- 子代基因型 -->
                <text x="50" y="305" font-size="14" fill="#000000">
                    <tspan fill="#000000">F₁: </tspan>
                    <tspan fill="#2e7d32">Aa</tspan>
                    <tspan fill="#000000">、</tspan>
                    <tspan fill="#c62828">aa</tspan>
                </text>
                <!-- 子代表型 -->
                <text x="50" y="340" font-size="14" fill="#000000" id="scene2-group5-phenotype">
                    <tspan fill="#1565c0">无毛:有毛 = 1:1</tspan>
                </text>
                <!-- 实际数据 -->
                <text x="250" y="340" font-size="12" fill="#666666">(实际: 0:13)</text>
            </g>

            <!-- ========== 第 6 组遗传图解 (y=200~340) ========== -->
            <g id="scene2-group6" class="scene2-group">
                <!-- 标题 -->
                <text x="450" y="200" font-size="16" font-weight="bold" fill="#000000">第 6 组</text>
                <!-- 亲本行 -->
                <text x="450" y="235" font-size="14" fill="#000000" id="scene2-group6-parents">
                    <tspan fill="#1565c0" font-weight="bold">♀有毛</tspan>
                    <tspan fill="#c62828">(aa)</tspan>
                    <tspan fill="#000000"> × </tspan>
                    <tspan fill="#1565c0" font-weight="bold">♂无毛</tspan>
                    <tspan fill="#2e7d32">(Aa)</tspan>
                </text>
                <!-- 配子行 -->
                <text x="450" y="270" font-size="14" fill="#000000">
                    <tspan fill="#000000">配子：</tspan>
                    <tspan fill="#c62828">a</tspan>
                    <tspan fill="#000000">        </tspan>
                    <tspan fill="#2e7d32">A</tspan>
                    <tspan fill="#000000">、</tspan>
                    <tspan fill="#c62828">a</tspan>
                </text>
                <!-- 子代基因型 -->
                <text x="450" y="305" font-size="14" fill="#000000">
                    <tspan fill="#000000">F₁: </tspan>
                    <tspan fill="#2e7d32">Aa</tspan>
                    <tspan fill="#000000">、</tspan>
                    <tspan fill="#c62828">aa</tspan>
                </text>
                <!-- 子代表型 -->
                <text x="450" y="340" font-size="14" fill="#000000" id="scene2-group6-phenotype">
                    <tspan fill="#1565c0">无毛:有毛 = 1:1</tspan>
                </text>
                <!-- 实际数据 -->
                <text x="650" y="340" font-size="12" fill="#666666">(实际: 0:40)</text>
            </g>

            <!-- ========== 对比箭头 (连接第 5、6 组) ========== -->
            <!-- 上方箭头：配子行之间 (y=270) -->
            <line id="scene2-arrow-5-6-top" x1="380" y1="270" x2="430" y2="270"
                  stroke="#000000" stroke-width="2"
                  marker-end="url(#scene2-arrowhead)" marker-start="url(#scene2-arrowhead)" />
            <!-- 下方箭头：子代基因型行之间 (y=305) -->
            <line id="scene2-arrow-5-6-bottom" x1="380" y1="305" x2="430" y2="305"
                  stroke="#000000" stroke-width="2"
                  marker-end="url(#scene2-arrowhead)" marker-start="url(#scene2-arrowhead)" />

            <!-- ========== 结论框 (y=375~425) ========== -->
            <g id="scene2-conclusion-box">
                <rect x="200" y="375" width="400" height="50"
                      fill="#e3f2fd" fill-opacity="0.3"
                      stroke="#1565c0" stroke-width="2" rx="5" />
                <text x="400" y="405" font-size="14" fill="#1565c0" text-anchor="middle" font-weight="bold">
                    正交反交结果一致 → 常染色体遗传
                </text>
            </g>

            <!-- ========== 控件栏 (SVG 内底部 y=440~490) ========== -->
            <!-- 上一步按钮 -->
            <g id="scene2-btn-prev" class="scene2-btn scene2-btn-disabled">
                <rect x="550" y="450" width="80" height="30" fill="#757575" rx="5" />
                <text x="590" y="470" font-size="14" fill="#ffffff" text-anchor="middle">◀ 上一步</text>
            </g>
            <!-- 步骤指示器 -->
            <text id="scene2-step-indicator" x="500" y="470" font-size="14" fill="#000000" text-anchor="middle">步骤 1/4</text>
            <!-- 下一步按钮 -->
            <g id="scene2-btn-next" class="scene2-btn">
                <rect x="650" y="450" width="80" height="30" fill="#1565c0" rx="5" />
                <text x="690" y="470" font-size="14" fill="#ffffff" text-anchor="middle">下一步 ▶</text>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 2 实现：遗传图解分步导航

        // 状态变量
        let currentStep = 0;
        const totalSteps = 4;

        // DOM 元素引用
        const group4 = document.getElementById('scene2-group4');
        const group5 = document.getElementById('scene2-group5');
        const group6 = document.getElementById('scene2-group6');
        const arrowTop = document.getElementById('scene2-arrow-5-6-top');
        const arrowBottom = document.getElementById('scene2-arrow-5-6-bottom');
        const conclusionBox = document.getElementById('scene2-conclusion-box');
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        const group5Parents = document.getElementById('scene2-group5-parents');
        const group5Phenotype = document.getElementById('scene2-group5-phenotype');
        const group6Parents = document.getElementById('scene2-group6-parents');
        const group6Phenotype = document.getElementById('scene2-group6-phenotype');

        // 更新步骤显示
        function updateStep() {
            // 重置所有元素可见性
            group4.classList.remove('scene2-visible');
            group5.classList.remove('scene2-visible');
            group6.classList.remove('scene2-visible');
            arrowTop.classList.remove('scene2-visible');
            arrowBottom.classList.remove('scene2-visible');
            conclusionBox.classList.remove('scene2-visible');

            // 移除高亮
            if (group5Parents) group5Parents.classList.remove('scene2-highlight');
            if (group5Phenotype) group5Phenotype.classList.remove('scene2-highlight');
            if (group6Parents) group6Parents.classList.remove('scene2-highlight');
            if (group6Phenotype) group6Phenotype.classList.remove('scene2-highlight');

            // 根据当前步骤设置可见性
            switch (currentStep) {
                case 0:
                    // 步骤 0: 仅显示第 4 组
                    group4.classList.add('scene2-visible');
                    break;
                case 1:
                    // 步骤 1: 显示第 4 组 + 第 5 组
                    group4.classList.add('scene2-visible');
                    group5.classList.add('scene2-visible');
                    break;
                case 2:
                    // 步骤 2: 显示第 4、5、6 组 + 对比箭头
                    group4.classList.add('scene2-visible');
                    group5.classList.add('scene2-visible');
                    group6.classList.add('scene2-visible');
                    arrowTop.classList.add('scene2-visible');
                    arrowBottom.classList.add('scene2-visible');
                    break;
                case 3:
                    // 步骤 3: 显示所有内容 + 结论框 + 高亮
                    group4.classList.add('scene2-visible');
                    group5.classList.add('scene2-visible');
                    group6.classList.add('scene2-visible');
                    arrowTop.classList.add('scene2-visible');
                    arrowBottom.classList.add('scene2-visible');
                    conclusionBox.classList.add('scene2-visible');
                    // 高亮第 5、6 组亲本行
                    if (group5Parents) group5Parents.classList.add('scene2-highlight');
                    if (group6Parents) group6Parents.classList.add('scene2-highlight');
                    break;
            }

            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;

            // 更新按钮状态
            if (currentStep === 0) {
                btnPrev.classList.add('scene2-btn-disabled');
            } else {
                btnPrev.classList.remove('scene2-btn-disabled');
            }

            if (currentStep === totalSteps - 1) {
                btnNext.classList.add('scene2-btn-disabled');
            } else {
                btnNext.classList.remove('scene2-btn-disabled');
            }
        }

        // 事件绑定：上一步按钮
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        // 事件绑定：下一步按钮
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStep();
            }
        });

        // 初始化显示
        updateStep();
    })();
    </script>
</body>
</html>
