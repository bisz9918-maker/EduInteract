<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>理想光滑表面 vs 实际粗糙表面的运动对比</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene3-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene3-svg {
            width: 800px;
            height: 500px;
        }
        .scene3-btn {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #333;
            border-radius: 4px;
            background: #f5f5f5;
            transition: background 0.2s;
        }
        .scene3-btn:hover {
            background: #e0e0e0;
        }
        .scene3-btn.active {
            background: #1976d2;
            color: white;
            border-color: #1976d2;
        }
        .scene3-hidden {
            display: none;
            opacity: 0;
        }
        .scene3-dimmed {
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头和纹理 -->
            <defs>
                <!-- 蓝色速度箭头 -->
                <marker id="scene3-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 L0,0" fill="#1565c0" />
                </marker>
                <!-- 红色摩擦力箭头 -->
                <marker id="scene3-arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 L0,0" fill="#c62828" />
                </marker>
                <!-- 粗糙表面斜线纹理 -->
                <pattern id="scene3-rough-pattern" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
                    <line x1="0" y1="0" x2="0" y2="10" stroke="#888888" stroke-width="2" />
                </pattern>
            </defs>

            <!-- ========== 左侧装置（粗糙表面） ========== -->
            <g id="scene3-left-group">
                <!-- 斜面 -->
                <line id="scene3-left-ramp" x1="50" y1="180" x2="150" y2="240" stroke="#333" stroke-width="3" />
                <!-- 水平面（带粗糙纹理） -->
                <rect id="scene3-left-surface" x="150" y="238" width="230" height="5" fill="url(#scene3-rough-pattern)" stroke="#333" stroke-width="2" />
                <!-- 小车（矩形+轮子） -->
                <g id="scene3-left-cart">
                    <rect x="70" y="160" width="35" height="25" fill="#2e7d32" fill-opacity="0.2" stroke="#2e7d32" stroke-width="2" />
                    <circle cx="80" cy="185" r="5" fill="#333" />
                    <circle cx="95" cy="185" r="5" fill="#333" />
                </g>
                <!-- 木块 -->
                <rect id="scene3-left-block" x="280" y="215" width="30" height="25" fill="#2e7d32" fill-opacity="0.2" stroke="#2e7d32" stroke-width="2" />
                <!-- 速度箭头（蓝色，向右） -->
                <line id="scene3-vel-arrow-left" x1="310" y1="205" x2="350" y2="205" stroke="#1565c0" stroke-width="3" marker-end="url(#scene3-arrow-blue)" />
                <!-- 摩擦力箭头（红色，向左，仅状态 0 显示） -->
                <line id="scene3-fric-arrow-left" x1="310" y1="245" x2="270" y2="245" stroke="#c62828" stroke-width="3" marker-end="url(#scene3-arrow-red)" />
                <!-- 标签 -->
                <text id="scene3-label-rough-surface" x="200" y="265" text-anchor="middle" font-size="14" fill="#000">粗糙表面</text>
                <text id="scene3-label-decelerate" x="200" y="285" text-anchor="middle" font-size="14" fill="#000">减速运动</text>
                <text id="scene3-label-ke-decrease-left" x="200" y="305" text-anchor="middle" font-size="14" fill="#c62828">动能减小</text>
            </g>

            <!-- ========== 右侧装置（光滑表面） ========== -->
            <g id="scene3-right-group">
                <!-- 斜面 -->
                <line id="scene3-right-ramp" x1="420" y1="180" x2="520" y2="240" stroke="#333" stroke-width="3" />
                <!-- 水平面（无纹理，光滑） -->
                <line id="scene3-right-surface" x1="520" y1="240" x2="750" y2="240" stroke="#333" stroke-width="3" />
                <!-- 小车（矩形+轮子） -->
                <g id="scene3-right-cart">
                    <rect x="440" y="160" width="35" height="25" fill="#2e7d32" fill-opacity="0.2" stroke="#2e7d32" stroke-width="2" />
                    <circle cx="450" cy="185" r="5" fill="#333" />
                    <circle cx="465" cy="185" r="5" fill="#333" />
                </g>
                <!-- 木块 -->
                <rect id="scene3-right-block" x="650" y="215" width="30" height="25" fill="#2e7d32" fill-opacity="0.2" stroke="#2e7d32" stroke-width="2" />
                <!-- 速度箭头（蓝色，向右） -->
                <line id="scene3-vel-arrow-right" x1="680" y1="205" x2="720" y2="205" stroke="#1565c0" stroke-width="3" marker-end="url(#scene3-arrow-blue)" />
                <!-- 标签 -->
                <text id="scene3-label-smooth-surface" x="570" y="265" text-anchor="middle" font-size="14" fill="#000">光滑表面</text>
                <text id="scene3-label-constant" x="570" y="285" text-anchor="middle" font-size="14" fill="#000">匀速运动</text>
                <text id="scene3-label-ke-constant-right" x="570" y="305" text-anchor="middle" font-size="14" fill="#1565c0">动能不变</text>
            </g>

            <!-- ========== v-t 图像区域（状态 2 显示） ========== -->
            <g id="scene3-vt-group" class="scene3-hidden">
                <!-- 坐标轴 -->
                <line id="scene3-vt-x-axis" x1="120" y1="420" x2="680" y2="420" stroke="#333" stroke-width="2" />
                <line id="scene3-vt-y-axis" x1="120" y1="360" x2="120" y2="420" stroke="#333" stroke-width="2" />
                <!-- 红色斜线（粗糙表面减速） -->
                <line id="scene3-vt-rough" x1="120" y1="360" x2="400" y2="420" stroke="#c62828" stroke-width="3" />
                <!-- 蓝色水平线（光滑表面匀速） -->
                <line id="scene3-vt-smooth" x1="120" y1="360" x2="680" y2="360" stroke="#1565c0" stroke-width="3" />
                <!-- 轴标签 -->
                <text id="scene3-label-v" x="105" y="355" text-anchor="end" font-size="14" fill="#000">v</text>
                <text id="scene3-label-t" x="690" y="425" text-anchor="start" font-size="14" fill="#000">t</text>
                <!-- 动能标签 -->
                <text id="scene3-label-ke-decrease-vt" x="180" y="380" text-anchor="middle" font-size="13" fill="#c62828">动能减小</text>
                <text id="scene3-label-ke-constant-vt" x="450" y="350" text-anchor="middle" font-size="13" fill="#1565c0">动能不变</text>
            </g>

            <!-- ========== 控件栏（在 SVG 内部底部） ========== -->
            <g id="scene3-controls">
                <rect x="160" y="455" width="100" height="30" fill="#f5f5f5" stroke="#333" stroke-width="1" rx="4" class="scene3-btn-bg" />
                <text x="210" y="475" text-anchor="middle" font-size="14" fill="#000" class="scene3-btn-text">实际粗糙</text>
                
                <rect x="340" y="455" width="100" height="30" fill="#f5f5f5" stroke="#333" stroke-width="1" rx="4" class="scene3-btn-bg" />
                <text x="390" y="475" text-anchor="middle" font-size="14" fill="#000" class="scene3-btn-text">理想光滑</text>
                
                <rect x="520" y="455" width="100" height="30" fill="#f5f5f5" stroke="#333" stroke-width="1" rx="4" class="scene3-btn-bg" />
                <text x="570" y="475" text-anchor="middle" font-size="14" fill="#000" class="scene3-btn-text">v-t 图像</text>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 3: 理想光滑表面 vs 实际粗糙表面的运动对比
        // 布局坐标表参考：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 左侧斜面 | 线段 | (50,180)-(150,240) | 100×60 | - | 粗糙表面装置 |
        // | 左侧水平面 | 线段 | (150,240)-(380,240) | 230×3 | - | 带摩擦纹理 |
        // | 左侧小车 | 矩形 | (70,160) | 35×25 | - | 斜面上方 |
        // | 左侧木块 | 矩形 | (280,215) | 30×25 | - | 水平面上 |
        // | 左侧速度箭头 | 箭头 | (310,205)-(350,205) | 40×8 | 上方 | 蓝色 #1565c0 |
        // | 左侧摩擦力箭头 | 箭头 | (310,245)-(270,245) | 40×8 | 下方 | 红色 #c62828，仅状态 0 显示 |
        // | "粗糙表面"标签 | text | (200,265) | ~60×16 | 下方 | 黑色 |
        // | "减速运动"标签 | text | (200,285) | ~50×16 | 下方 | 状态 0 显示 |
        // | 右侧斜面 | 线段 | (420,180)-(520,240) | 100×60 | - | 光滑表面装置 |
        // | 右侧水平面 | 线段 | (520,240)-(750,240) | 230×3 | - | 无纹理 |
        // | 右侧小车 | 矩形 | (440,160) | 35×25 | - | 斜面上方 |
        // | 右侧木块 | 矩形 | (650,215) | 30×25 | - | 水平面上 |
        // | 右侧速度箭头 | 箭头 | (680,205)-(720,205) | 40×8 | 上方 | 蓝色 #1565c0 |
        // | "光滑表面"标签 | text | (570,265) | ~60×16 | 下方 | 黑色 |
        // | "匀速运动"标签 | text | (570,285) | ~50×16 | 下方 | 状态 1 显示 |
        // | v-t 图坐标系 | 坐标轴 | (100,350)-(700,430) | 600×80 | - | 状态 2 显示 |
        // | v-t 横轴 | 线段 | (120,420)-(680,420) | 560×2 | - | 时间轴 t |
        // | v-t 纵轴 | 线段 | (120,360)-(120,420) | 2×60 | - | 速度轴 v |
        // | v-t 粗糙曲线 | 线段 | (120,360)-(400,420) | 280×60 | - | 红色 #c62828 斜向下 |
        // | v-t 光滑曲线 | 线段 | (120,360)-(680,360) | 560×0 | - | 蓝色 #1565c0 水平 |
        // | "v"轴标签 | text | (105,355) | ~12×16 | 左侧 | 纵轴顶端 |
        // | "t"轴标签 | text | (690,425) | ~12×16 | 右侧 | 横轴右端 |
        // | "动能减小"标签 | text | (180,380) | ~50×16 | - | 状态 2，红色曲线旁 |
        // | "动能不变"标签 | text | (450,350) | ~50×16 | - | 状态 2，蓝色曲线旁 |
        // | 状态 0 按钮 | 按钮 | (180,465) | 80×25 | - | 「实际粗糙」 |
        // | 状态 1 按钮 | 按钮 | (360,465) | 80×25 | - | 「理想光滑」 |
        // | 状态 2 按钮 | 按钮 | (540,465) | 80×25 | - | 「v-t 图像」 |

        let currentState = 0; // 0: 实际粗糙, 1: 理想光滑, 2: v-t 图像

        // 获取所有需要控制的元素
        const leftGroup = document.getElementById('scene3-left-group');
        const rightGroup = document.getElementById('scene3-right-group');
        const vtGroup = document.getElementById('scene3-vt-group');
        const fricArrowLeft = document.getElementById('scene3-fric-arrow-left');
        const labelDecelerate = document.getElementById('scene3-label-decelerate');
        const labelKeDecreaseLeft = document.getElementById('scene3-label-ke-decrease-left');
        const labelConstant = document.getElementById('scene3-label-constant');
        const labelKeConstantRight = document.getElementById('scene3-label-ke-constant-right');
        const controlsGroup = document.getElementById('scene3-controls');

        // 按钮背景矩形和文字
        const btnBgs = controlsGroup.querySelectorAll('.scene3-btn-bg');
        const btnTexts = controlsGroup.querySelectorAll('.scene3-btn-text');

        // 辅助函数：显示/隐藏元素
        function showElement(el) {
            if (el) {
                el.classList.remove('scene3-hidden');
                el.style.display = '';
                el.style.opacity = '1';
            }
        }

        function hideElement(el) {
            if (el) {
                el.classList.add('scene3-hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        function setDimmed(el, dimmed) {
            if (el) {
                if (dimmed) {
                    el.classList.add('scene3-dimmed');
                } else {
                    el.classList.remove('scene3-dimmed');
                }
            }
        }

        // 更新按钮高亮状态
        function updateButtons() {
            btnBgs.forEach((bg, i) => {
                if (i === currentState) {
                    bg.setAttribute('fill', '#1976d2');
                    btnTexts[i].setAttribute('fill', '#ffffff');
                } else {
                    bg.setAttribute('fill', '#f5f5f5');
                    btnTexts[i].setAttribute('fill', '#000000');
                }
            });
        }

        // 更新场景状态
        function updateScene() {
            if (currentState === 0) {
                // 状态 0：实际粗糙表面
                setDimmed(leftGroup, false);
                setDimmed(rightGroup, true);
                hideElement(vtGroup);
                showElement(fricArrowLeft);
                showElement(labelDecelerate);
                showElement(labelKeDecreaseLeft);
                hideElement(labelConstant);
                hideElement(labelKeConstantRight);
            } else if (currentState === 1) {
                // 状态 1：理想光滑表面
                setDimmed(leftGroup, true);
                setDimmed(rightGroup, false);
                hideElement(vtGroup);
                hideElement(fricArrowLeft);
                hideElement(labelDecelerate);
                hideElement(labelKeDecreaseLeft);
                showElement(labelConstant);
                showElement(labelKeConstantRight);
            } else if (currentState === 2) {
                // 状态 2：v-t 图像
                setDimmed(leftGroup, true);
                setDimmed(rightGroup, true);
                showElement(vtGroup);
                hideElement(fricArrowLeft);
                hideElement(labelDecelerate);
                hideElement(labelKeDecreaseLeft);
                hideElement(labelConstant);
                hideElement(labelKeConstantRight);
            }
            updateButtons();
        }

        // 按钮点击事件处理
        function setupClickHandlers() {
            // 创建可点击区域
            const btnAreas = [
                { x: 160, y: 455, w: 100, h: 30, state: 0 },
                { x: 340, y: 455, w: 100, h: 30, state: 1 },
                { x: 520, y: 455, w: 100, h: 30, state: 2 }
            ];

            const svg = document.getElementById('scene3-svg');
            svg.addEventListener('click', function(e) {
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                btnAreas.forEach(area => {
                    if (x >= area.x && x <= area.x + area.w && y >= area.y && y <= area.y + area.h) {
                        if (currentState !== area.state) {
                            currentState = area.state;
                            updateScene();
                        }
                    }
                });
            });

            // 添加鼠标悬停效果
            btnAreas.forEach((area, i) => {
                const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                rect.setAttribute('x', area.x);
                rect.setAttribute('y', area.y);
                rect.setAttribute('width', area.w);
                rect.setAttribute('height', area.h);
                rect.setAttribute('fill', 'transparent');
                rect.setAttribute('class', 'scene3-btn-hover');
                rect.style.cursor = 'pointer';
                rect.addEventListener('mouseenter', function() {
                    if (currentState !== i) {
                        this.setAttribute('fill', '#e0e0e0');
                    }
                });
                rect.addEventListener('mouseleave', function() {
                    this.setAttribute('fill', 'transparent');
                });
                controlsGroup.appendChild(rect);
            });
        }

        // 初始化
        updateScene();
        setupClickHandlers();
    })();
    </script>
</body>
</html>
