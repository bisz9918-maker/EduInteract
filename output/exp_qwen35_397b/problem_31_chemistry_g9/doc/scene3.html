<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>晶体结构转变 - 边长比与密度比推导</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene3-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene3-svg {
            width: 800px;
            height: 500px;
        }
        #scene3-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }
        .scene3-btn {
            width: 90px;
            height: 32px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        #scene3-btn-prev {
            background: #9e9e9e;
            color: white;
        }
        #scene3-btn-prev:disabled {
            background: #e0e0e0;
            cursor: not-allowed;
        }
        #scene3-btn-prev:not(:disabled):hover {
            background: #757575;
        }
        #scene3-btn-next {
            background: #1565c0;
            color: white;
        }
        #scene3-btn-next:disabled {
            background: #e0e0e0;
            cursor: not-allowed;
        }
        #scene3-btn-next:not(:disabled):hover {
            background: #0d47a1;
        }
        #scene3-step-indicator {
            font-size: 14px;
            color: #424242;
            min-width: 80px;
            text-align: center;
        }
        /* 淡入动画 */
        .scene3-fade-in {
            animation: scene3FadeIn 0.3s ease-out forwards;
        }
        @keyframes scene3FadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .scene3-hidden {
            opacity: 0;
            display: none;
        }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 背景 -->
            <rect width="800" height="500" fill="#ffffff"/>

            <!-- ========== BCC 晶胞 (左侧) ========== -->
            <!-- 标题 -->
            <text id="scene3-title-bcc" x="200" y="60" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565c0">BCC (910℃以下)</text>

            <!-- BCC 晶胞边框 - 立方体线框 (左下80,320 右上320,80) -->
            <g id="scene3-bcc-cell">
                <!-- 后方面 -->
                <line x1="80" y1="320" x2="320" y2="320" stroke="#1565c0" stroke-width="2"/>
                <line x1="320" y1="320" x2="320" y2="80" stroke="#1565c0" stroke-width="2"/>
                <line x1="320" y1="80" x2="80" y2="80" stroke="#1565c0" stroke-width="2"/>
                <line x1="80" y1="80" x2="80" y2="320" stroke="#1565c0" stroke-width="2"/>
                <!-- 前方面 (偏移) -->
                <line x1="120" y1="280" x2="360" y2="280" stroke="#1565c0" stroke-width="2"/>
                <line x1="360" y1="280" x2="360" y2="40" stroke="#1565c0" stroke-width="2"/>
                <line x1="360" y1="40" x2="120" y2="40" stroke="#1565c0" stroke-width="2"/>
                <line x1="120" y1="40" x2="120" y2="280" stroke="#1565c0" stroke-width="2"/>
                <!-- 连接边 -->
                <line x1="80" y1="320" x2="120" y2="280" stroke="#1565c0" stroke-width="2"/>
                <line x1="320" y1="320" x2="360" y2="280" stroke="#1565c0" stroke-width="2"/>
                <line x1="320" y1="80" x2="360" y2="40" stroke="#1565c0" stroke-width="2"/>
                <line x1="80" y1="80" x2="120" y2="40" stroke="#1565c0" stroke-width="2"/>
                <!-- 填充 -->
                <polygon points="120,280 360,280 360,40 120,40" fill="rgba(21,101,192,0.1)"/>
            </g>

            <!-- BCC 体对角线 (虚线，显示最近邻距离) -->
            <g id="scene3-bcc-diagonals" class="scene3-hidden">
                <line x1="80" y1="320" x2="360" y2="40" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.6"/>
                <line x1="320" y1="320" x2="120" y2="40" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.6"/>
                <line x1="320" y1="80" x2="120" y2="280" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.6"/>
                <line x1="80" y1="80" x2="360" y2="280" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.6"/>
            </g>

            <!-- BCC 原子 (8顶点 + 1体心) -->
            <g id="scene3-bcc-atoms">
                <!-- 后方面顶点 -->
                <circle cx="80" cy="320" r="7" fill="#000000"/>
                <circle cx="320" cy="320" r="7" fill="#000000"/>
                <circle cx="320" cy="80" r="7" fill="#000000"/>
                <circle cx="80" cy="80" r="7" fill="#000000"/>
                <!-- 前方面顶点 -->
                <circle cx="120" cy="280" r="7" fill="#000000"/>
                <circle cx="360" cy="280" r="7" fill="#000000"/>
                <circle cx="360" cy="40" r="7" fill="#000000"/>
                <circle cx="120" cy="40" r="7" fill="#000000"/>
                <!-- 体心原子 -->
                <circle cx="220" cy="200" r="7" fill="#000000"/>
            </g>

            <!-- BCC 边长标注 a₁ -->
            <g id="scene3-label-a1-group">
                <line x1="80" y1="335" x2="320" y2="335" stroke="#424242" stroke-width="1"/>
                <line x1="80" y1="330" x2="80" y2="340" stroke="#424242" stroke-width="1"/>
                <line x1="320" y1="330" x2="320" y2="340" stroke="#424242" stroke-width="1"/>
                <text x="200" y="355" text-anchor="middle" font-size="14" fill="#000000">a₁</text>
            </g>

            <!-- ========== FCC 晶胞 (右侧) ========== -->
            <!-- 标题 -->
            <text id="scene3-title-fcc" x="600" y="60" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e7d32">FCC (910℃以上)</text>

            <!-- FCC 晶胞边框 - 立方体线框 (左下480,320 右上720,80) -->
            <g id="scene3-fcc-cell">
                <!-- 后方面 -->
                <line x1="480" y1="320" x2="720" y2="320" stroke="#2e7d32" stroke-width="2"/>
                <line x1="720" y1="320" x2="720" y2="80" stroke="#2e7d32" stroke-width="2"/>
                <line x1="720" y1="80" x2="480" y2="80" stroke="#2e7d32" stroke-width="2"/>
                <line x1="480" y1="80" x2="480" y2="320" stroke="#2e7d32" stroke-width="2"/>
                <!-- 前方面 (偏移) -->
                <line x1="520" y1="280" x2="760" y2="280" stroke="#2e7d32" stroke-width="2"/>
                <line x1="760" y1="280" x2="760" y2="40" stroke="#2e7d32" stroke-width="2"/>
                <line x1="760" y1="40" x2="520" y2="40" stroke="#2e7d32" stroke-width="2"/>
                <line x1="520" y1="40" x2="520" y2="280" stroke="#2e7d32" stroke-width="2"/>
                <!-- 连接边 -->
                <line x1="480" y1="320" x2="520" y2="280" stroke="#2e7d32" stroke-width="2"/>
                <line x1="720" y1="320" x2="760" y2="280" stroke="#2e7d32" stroke-width="2"/>
                <line x1="720" y1="80" x2="760" y2="40" stroke="#2e7d32" stroke-width="2"/>
                <line x1="480" y1="80" x2="520" y2="40" stroke="#2e7d32" stroke-width="2"/>
                <!-- 填充 -->
                <polygon points="520,280 760,280 760,40 520,40" fill="rgba(46,125,50,0.1)"/>
            </g>

            <!-- FCC 面对角线 (虚线，显示最近邻距离) -->
            <g id="scene3-fcc-diagonals" class="scene3-hidden">
                <!-- 前面对角线 -->
                <line x1="520" y1="280" x2="760" y2="40" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.6"/>
                <line x1="760" y1="280" x2="520" y2="40" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.6"/>
            </g>

            <!-- FCC 原子 (8顶点 + 6面心) -->
            <g id="scene3-fcc-atoms">
                <!-- 后方面顶点 -->
                <circle cx="480" cy="320" r="7" fill="#000000"/>
                <circle cx="720" cy="320" r="7" fill="#000000"/>
                <circle cx="720" cy="80" r="7" fill="#000000"/>
                <circle cx="480" cy="80" r="7" fill="#000000"/>
                <!-- 前方面顶点 -->
                <circle cx="520" cy="280" r="7" fill="#000000"/>
                <circle cx="760" cy="280" r="7" fill="#000000"/>
                <circle cx="760" cy="40" r="7" fill="#000000"/>
                <circle cx="520" cy="40" r="7" fill="#000000"/>
                <!-- 面心原子 (6个) -->
                <!-- 前面中心 -->
                <circle cx="640" cy="160" r="7" fill="#000000"/>
                <!-- 后面中心 -->
                <circle cx="600" cy="200" r="7" fill="#000000"/>
                <!-- 左面中心 -->
                <circle cx="500" cy="180" r="7" fill="#000000"/>
                <!-- 右面中心 -->
                <circle cx="740" cy="180" r="7" fill="#000000"/>
                <!-- 上面中心 -->
                <circle cx="620" cy="60" r="7" fill="#000000"/>
                <!-- 下面中心 -->
                <circle cx="620" cy="300" r="7" fill="#000000"/>
            </g>

            <!-- FCC 边长标注 a₂ -->
            <g id="scene3-label-a2-group">
                <line x1="480" y1="335" x2="720" y2="335" stroke="#424242" stroke-width="1"/>
                <line x1="480" y1="330" x2="480" y2="340" stroke="#424242" stroke-width="1"/>
                <line x1="720" y1="330" x2="720" y2="340" stroke="#424242" stroke-width="1"/>
                <text x="600" y="355" text-anchor="middle" font-size="14" fill="#000000">a₂</text>
            </g>

            <!-- ========== 公式区域 ========== -->
            <!-- 步骤1: 最近邻距离公式 -->
            <g id="scene3-formula-distance" class="scene3-hidden">
                <text x="400" y="385" text-anchor="middle" font-size="13" fill="#000000">
                    <tspan fill="#c62828" font-weight="bold">最近邻距离相等：</tspan>
                    <tspan fill="#1565c0">d₁ = (√3/2)a₁</tspan>
                    <tspan fill="#c62828" font-weight="bold"> = </tspan>
                    <tspan fill="#2e7d32">d₂ = (√2/2)a₂</tspan>
                </text>
            </g>

            <!-- 步骤2: 边长比公式 -->
            <g id="scene3-formula-ratio" class="scene3-hidden">
                <text x="400" y="410" text-anchor="middle" font-size="13" fill="#000000">
                    <tspan fill="#c62828" font-weight="bold">边长比：</tspan>
                    <tspan>a₁/a₂ = √2/√3</tspan>
                </text>
            </g>

            <!-- 步骤3: 原子数统计框 -->
            <g id="scene3-atomcount-bcc" class="scene3-hidden">
                <rect x="100" y="425" width="240" height="28" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
                <text x="220" y="444" text-anchor="middle" font-size="12" fill="#000000">BCC晶胞原子数 = 8×1/8 + 1 = 2</text>
            </g>

            <g id="scene3-atomcount-fcc" class="scene3-hidden">
                <rect x="460" y="425" width="240" height="28" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
                <text x="580" y="444" text-anchor="middle" font-size="12" fill="#000000">FCC晶胞原子数 = 8×1/8 + 6×1/2 = 4</text>
            </g>

            <!-- 步骤4: 密度比公式 -->
            <g id="scene3-formula-density" class="scene3-hidden">
                <rect x="280" y="455" width="240" height="30" fill="#fff3e0" stroke="#c62828" stroke-width="2" rx="3"/>
                <text x="400" y="476" text-anchor="middle" font-size="12" fill="#c62828" font-weight="bold">
                    ρ₁/ρ₂ = (2/a₁³) / (4/a₂³) = 3√3 / 4√2
                </text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene3-controls">
            <button id="scene3-btn-prev" class="scene3-btn" disabled>◀ 上一步</button>
            <span id="scene3-step-indicator">步骤 1/5</span>
            <button id="scene3-btn-next" class="scene3-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 3 实现 - 晶体结构转变推导

        // 状态变量
        let currentStep = 0;
        const totalSteps = 5;

        // 每步需要显示的元素ID数组
        const stepElements = [
            [],  // 步骤0: 初始状态，只显示基础元素
            ['scene3-formula-distance', 'scene3-bcc-diagonals', 'scene3-fcc-diagonals'],  // 步骤1: 最近邻距离公式
            ['scene3-formula-ratio'],  // 步骤2: 边长比公式
            ['scene3-atomcount-bcc', 'scene3-atomcount-fcc'],  // 步骤3: 原子数统计
            ['scene3-formula-density']  // 步骤4: 密度比公式
        ];

        // 获取DOM元素
        const btnPrev = document.getElementById('scene3-btn-prev');
        const btnNext = document.getElementById('scene3-btn-next');
        const stepIndicator = document.getElementById('scene3-step-indicator');

        // 显示元素函数
        function showElement(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.classList.remove('scene3-hidden');
                el.classList.add('scene3-fade-in');
            }
        }

        // 隐藏元素函数
        function hideElement(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.classList.remove('scene3-fade-in');
                el.classList.add('scene3-hidden');
            }
        }

        // 渲染当前步骤
        function renderStep() {
            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);

            // 根据当前步骤显示/隐藏元素
            for (let step = 0; step < totalSteps; step++) {
                const elements = stepElements[step];
                for (let i = 0; i < elements.length; i++) {
                    if (step <= currentStep) {
                        showElement(elements[i]);
                    } else {
                        hideElement(elements[i]);
                    }
                }
            }
        }

        // 上一步按钮点击事件
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        // 下一步按钮点击事件
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep();
            }
        });

        // 初始化渲染
        renderStep();

    })();
    </script>
</body>
</html>
