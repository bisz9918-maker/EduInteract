<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>观察物体 - 从不同方向观察立体图形</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        .scene1-btn {
            padding: 8px 20px;
            font-size: 14px;
            border: 2px solid #1565c0;
            border-radius: 6px;
            background: #ffffff;
            color: #1565c0;
            cursor: pointer;
            transition: all 0.2s;
        }
        .scene1-btn:hover:not(:disabled) {
            background: #1565c0;
            color: #ffffff;
        }
        .scene1-btn:disabled {
            border-color: #bdbdbd;
            color: #9e9e9e;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #424242;
            min-width: 80px;
            text-align: center;
        }
        /* 箭头和标签的默认灰色状态 */
        .scene1-arrow-gray {
            stroke: #9e9e9e;
            fill: #9e9e9e;
            opacity: 0.5;
        }
        .scene1-arrow-blue {
            stroke: #1565c0;
            fill: #1565c0;
            opacity: 1;
        }
        .scene1-label-gray {
            fill: #9e9e9e;
            opacity: 0.5;
        }
        .scene1-label-blue {
            fill: #1565c0;
            opacity: 1;
            font-weight: bold;
        }
        /* 正方体面的样式 */
        .scene1-cube-face {
            fill: #f5f5f5;
            fill-opacity: 0.2;
            stroke: #000000;
            stroke-width: 1.5;
        }
        .scene1-cube-face-highlight {
            fill: #e3f2fd;
            fill-opacity: 0.4;
            stroke: #000000;
            stroke-width: 1.5;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 左图形：6个正方体 (底层3个，中层2个，顶层1个) -->
            <g id="scene1-left-figure">
                <!-- 底层左 (位置0,0) -->
                <polygon id="scene1-left-face-0-0-top" class="scene1-cube-face" points="180,260 210,245 240,260 210,275"/>
                <polygon id="scene1-left-face-0-0-left" class="scene1-cube-face" points="180,260 180,290 210,305 210,275"/>
                <polygon id="scene1-left-face-0-0-right" class="scene1-cube-face" points="210,275 210,305 240,290 240,260"/>
                
                <!-- 底层中 (位置1,0) -->
                <polygon id="scene1-left-face-1-0-top" class="scene1-cube-face" points="240,260 270,245 300,260 270,275"/>
                <polygon id="scene1-left-face-1-0-left" class="scene1-cube-face" points="240,260 240,290 270,305 270,275"/>
                <polygon id="scene1-left-face-1-0-right" class="scene1-cube-face" points="270,275 270,305 300,290 300,260"/>
                
                <!-- 底层右 (位置2,0) -->
                <polygon id="scene1-left-face-2-0-top" class="scene1-cube-face" points="300,260 330,245 360,260 330,275"/>
                <polygon id="scene1-left-face-2-0-left" class="scene1-cube-face" points="300,260 300,290 330,305 330,275"/>
                <polygon id="scene1-left-face-2-0-right" class="scene1-cube-face" points="330,275 330,305 360,290 360,260"/>
                
                <!-- 中层左 (位置0,1) -->
                <polygon id="scene1-left-face-0-1-top" class="scene1-cube-face" points="180,230 210,215 240,230 210,245"/>
                <polygon id="scene1-left-face-0-1-left" class="scene1-cube-face" points="180,230 180,260 210,275 210,245"/>
                <polygon id="scene1-left-face-0-1-right" class="scene1-cube-face" points="210,245 210,275 240,260 240,230"/>
                
                <!-- 中层中 (位置1,1) -->
                <polygon id="scene1-left-face-1-1-top" class="scene1-cube-face" points="240,230 270,215 300,230 270,245"/>
                <polygon id="scene1-left-face-1-1-left" class="scene1-cube-face" points="240,230 240,260 270,275 270,245"/>
                <polygon id="scene1-left-face-1-1-right" class="scene1-cube-face" points="270,245 270,275 300,260 300,230"/>
                
                <!-- 顶层左 (位置0,2) -->
                <polygon id="scene1-left-face-0-2-top" class="scene1-cube-face" points="180,200 210,185 240,200 210,215"/>
                <polygon id="scene1-left-face-0-2-left" class="scene1-cube-face" points="180,200 180,230 210,245 210,215"/>
                <polygon id="scene1-left-face-0-2-right" class="scene1-cube-face" points="210,215 210,245 240,230 240,200"/>
            </g>
            
            <!-- 右图形：5个正方体 (左列2层，中列1层，右列2层) -->
            <g id="scene1-right-figure">
                <!-- 底层左 (位置0,0) -->
                <polygon id="scene1-right-face-0-0-top" class="scene1-cube-face" points="540,260 570,245 600,260 570,275"/>
                <polygon id="scene1-right-face-0-0-left" class="scene1-cube-face" points="540,260 540,290 570,305 570,275"/>
                <polygon id="scene1-right-face-0-0-right" class="scene1-cube-face" points="570,275 570,305 600,290 600,260"/>
                
                <!-- 底层中 (位置1,0) -->
                <polygon id="scene1-right-face-1-0-top" class="scene1-cube-face" points="600,260 630,245 660,260 630,275"/>
                <polygon id="scene1-right-face-1-0-left" class="scene1-cube-face" points="600,260 600,290 630,305 630,275"/>
                <polygon id="scene1-right-face-1-0-right" class="scene1-cube-face" points="630,275 630,305 660,290 660,260"/>
                
                <!-- 底层右 (位置2,0) -->
                <polygon id="scene1-right-face-2-0-top" class="scene1-cube-face" points="660,260 690,245 720,260 690,275"/>
                <polygon id="scene1-right-face-2-0-left" class="scene1-cube-face" points="660,260 660,290 690,305 690,275"/>
                <polygon id="scene1-right-face-2-0-right" class="scene1-cube-face" points="690,275 690,305 720,290 720,260"/>
                
                <!-- 上层左 (位置0,1) -->
                <polygon id="scene1-right-face-0-1-top" class="scene1-cube-face" points="540,230 570,215 600,230 570,245"/>
                <polygon id="scene1-right-face-0-1-left" class="scene1-cube-face" points="540,230 540,260 570,275 570,245"/>
                <polygon id="scene1-right-face-0-1-right" class="scene1-cube-face" points="570,245 570,275 600,260 600,230"/>
                
                <!-- 上层右 (位置2,1) -->
                <polygon id="scene1-right-face-2-1-top" class="scene1-cube-face" points="660,230 690,215 720,230 690,245"/>
                <polygon id="scene1-right-face-2-1-left" class="scene1-cube-face" points="660,230 660,260 690,275 690,245"/>
                <polygon id="scene1-right-face-2-1-right" class="scene1-cube-face" points="690,245 690,275 720,260 720,230"/>
            </g>
            
            <!-- 观察方向箭头 -->
            <!-- 左面箭头 - 左图形 -->
            <g id="scene1-left-arrow-left">
                <line x1="100" y1="280" x2="160" y2="280" class="scene1-arrow-gray" stroke-width="3"/>
                <polygon points="160,280 150,275 150,285" class="scene1-arrow-gray"/>
            </g>
            <!-- 左面箭头 - 右图形 -->
            <g id="scene1-left-arrow-right">
                <line x1="500" y1="280" x2="560" y2="280" class="scene1-arrow-gray" stroke-width="3"/>
                <polygon points="560,280 550,275 550,285" class="scene1-arrow-gray"/>
            </g>
            
            <!-- 前面箭头 - 左图形 (从下方向上指) -->
            <g id="scene1-front-arrow-left">
                <line x1="270" y1="350" x2="270" y2="310" class="scene1-arrow-gray" stroke-width="3"/>
                <polygon points="270,310 265,320 275,320" class="scene1-arrow-gray"/>
            </g>
            <!-- 前面箭头 - 右图形 (从下方向上指) -->
            <g id="scene1-front-arrow-right">
                <line x1="630" y1="350" x2="630" y2="310" class="scene1-arrow-gray" stroke-width="3"/>
                <polygon points="630,310 625,320 635,320" class="scene1-arrow-gray"/>
            </g>
            
            <!-- 上面箭头 - 左图形 -->
            <g id="scene1-top-arrow-left">
                <line x1="270" y1="140" x2="270" y2="180" class="scene1-arrow-gray" stroke-width="3"/>
                <polygon points="270,180 265,170 275,170" class="scene1-arrow-gray"/>
            </g>
            <!-- 上面箭头 - 右图形 -->
            <g id="scene1-top-arrow-right">
                <line x1="630" y1="140" x2="630" y2="180" class="scene1-arrow-gray" stroke-width="3"/>
                <polygon points="630,180 625,170 635,170" class="scene1-arrow-gray"/>
            </g>
            
            <!-- 标签 -->
            <text id="scene1-label-left" x="60" y="295" text-anchor="middle" font-size="16" class="scene1-label-gray">左面</text>
            <text id="scene1-label-front" x="400" y="370" text-anchor="middle" font-size="16" class="scene1-label-gray">前面</text>
            <text id="scene1-label-top" x="400" y="120" text-anchor="middle" font-size="16" class="scene1-label-gray">上面</text>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/3</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现 - 观察物体
        
        const currentStep = { value: 0 };
        const TOTAL_STEPS = 3;
        
        // 获取所有需要控制的元素
        const arrows = {
            left: [
                document.getElementById('scene1-left-arrow-left'),
                document.getElementById('scene1-left-arrow-right')
            ],
            front: [
                document.getElementById('scene1-front-arrow-left'),
                document.getElementById('scene1-front-arrow-right')
            ],
            top: [
                document.getElementById('scene1-top-arrow-left'),
                document.getElementById('scene1-top-arrow-right')
            ]
        };
        
        const labels = {
            left: document.getElementById('scene1-label-left'),
            front: document.getElementById('scene1-label-front'),
            top: document.getElementById('scene1-label-top')
        };
        
        // 左图形的面 - 按观察方向分组
        // 前面：能看到的前面（右前面）
        const leftFrontFaces = [
            'scene1-left-face-0-0-right', 'scene1-left-face-1-0-right', 'scene1-left-face-2-0-right',
            'scene1-left-face-0-1-right', 'scene1-left-face-1-1-right', 'scene1-left-face-0-2-right'
        ];
        // 左面：能看到的左面（左前面）
        const leftLeftFaces = [
            'scene1-left-face-0-0-left', 'scene1-left-face-0-1-left', 'scene1-left-face-0-2-left'
        ];
        // 上面：能看到的顶面
        const leftTopFaces = [
            'scene1-left-face-0-0-top', 'scene1-left-face-1-0-top', 'scene1-left-face-2-0-top',
            'scene1-left-face-0-1-top', 'scene1-left-face-1-1-top', 'scene1-left-face-0-2-top'
        ];
        
        // 右图形的面 - 按观察方向分组
        const rightFrontFaces = [
            'scene1-right-face-0-0-right', 'scene1-right-face-1-0-right', 'scene1-right-face-2-0-right',
            'scene1-right-face-0-1-right', 'scene1-right-face-2-1-right'
        ];
        const rightLeftFaces = [
            'scene1-right-face-0-0-left', 'scene1-right-face-0-1-left'
        ];
        const rightTopFaces = [
            'scene1-right-face-0-0-top', 'scene1-right-face-1-0-top', 'scene1-right-face-2-0-top',
            'scene1-right-face-0-1-top', 'scene1-right-face-2-1-top'
        ];
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        
        // 设置箭头样式
        function setArrowStyle(arrowGroup, isBlue) {
            const lines = arrowGroup.querySelectorAll('line');
            const polygons = arrowGroup.querySelectorAll('polygon');
            lines.forEach(el => {
                el.classList.remove(isBlue ? 'scene1-arrow-gray' : 'scene1-arrow-blue');
                el.classList.add(isBlue ? 'scene1-arrow-blue' : 'scene1-arrow-gray');
            });
            polygons.forEach(el => {
                el.classList.remove(isBlue ? 'scene1-arrow-gray' : 'scene1-arrow-blue');
                el.classList.add(isBlue ? 'scene1-arrow-blue' : 'scene1-arrow-gray');
            });
        }
        
        // 设置标签样式
        function setLabelStyle(label, isBlue) {
            label.classList.remove(isBlue ? 'scene1-label-gray' : 'scene1-label-blue');
            label.classList.add(isBlue ? 'scene1-label-blue' : 'scene1-label-gray');
        }
        
        // 设置正方体面样式
        function setFaceStyle(faceId, isHighlight) {
            const face = document.getElementById(faceId);
            if (face) {
                face.classList.remove(isHighlight ? 'scene1-cube-face' : 'scene1-cube-face-highlight');
                face.classList.add(isHighlight ? 'scene1-cube-face-highlight' : 'scene1-cube-face');
            }
        }
        
        // 清除所有高亮
        function clearAllHighlights() {
            // 所有箭头灰色
            setArrowStyle(arrows.left[0], false);
            setArrowStyle(arrows.left[1], false);
            setArrowStyle(arrows.front[0], false);
            setArrowStyle(arrows.front[1], false);
            setArrowStyle(arrows.top[0], false);
            setArrowStyle(arrows.top[1], false);
            
            // 所有标签灰色
            setLabelStyle(labels.left, false);
            setLabelStyle(labels.front, false);
            setLabelStyle(labels.top, false);
            
            // 所有面恢复默认
            const allFaces = [
                ...leftFrontFaces, ...leftLeftFaces, ...leftTopFaces,
                ...rightFrontFaces, ...rightLeftFaces, ...rightTopFaces
            ];
            allFaces.forEach(faceId => setFaceStyle(faceId, false));
        }
        
        // 应用当前步骤的高亮
        function applyStep(step) {
            clearAllHighlights();
            
            if (step === 1) {
                // 前面
                setArrowStyle(arrows.front[0], true);
                setArrowStyle(arrows.front[1], true);
                setLabelStyle(labels.front, true);
                leftFrontFaces.forEach(id => setFaceStyle(id, true));
                rightFrontFaces.forEach(id => setFaceStyle(id, true));
            } else if (step === 2) {
                // 左面
                setArrowStyle(arrows.left[0], true);
                setArrowStyle(arrows.left[1], true);
                setLabelStyle(labels.left, true);
                leftLeftFaces.forEach(id => setFaceStyle(id, true));
                rightLeftFaces.forEach(id => setFaceStyle(id, true));
            } else if (step === 3) {
                // 上面
                setArrowStyle(arrows.top[0], true);
                setArrowStyle(arrows.top[1], true);
                setLabelStyle(labels.top, true);
                leftTopFaces.forEach(id => setFaceStyle(id, true));
                rightTopFaces.forEach(id => setFaceStyle(id, true));
            }
            
            // 更新按钮状态
            btnPrev.disabled = (step === 0);
            btnNext.disabled = (step === TOTAL_STEPS);
            stepIndicator.textContent = `步骤 ${step}/${TOTAL_STEPS}`;
        }
        
        // 按钮事件
        btnPrev.addEventListener('click', function() {
            if (currentStep.value > 0) {
                currentStep.value--;
                applyStep(currentStep.value);
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentStep.value < TOTAL_STEPS) {
                currentStep.value++;
                applyStep(currentStep.value);
            }
        });
        
        // 初始化
        applyStep(0);
    })();
    </script>
</body>
</html>
