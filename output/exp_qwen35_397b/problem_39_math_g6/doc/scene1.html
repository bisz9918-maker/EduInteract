<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小旗旋转 90° 图示</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 450px;
        }
        /* 元素显隐控制 */
        .scene1-hidden {
            opacity: 0;
            display: none;
        }
        .scene1-visible {
            opacity: 1;
            display: block;
        }
        /* 控件栏 - 放在 SVG 外部底部 */
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }
        .scene1-btn {
            width: 90px;
            height: 32px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .scene1-btn:hover {
            background: #1565c0;
        }
        .scene1-btn:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #333;
            min-width: 80px;
            text-align: center;
        }
        /* 过渡动画 */
        .scene1-transition {
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <!-- SVG 图示区：800×450px，底部留 50px 给控件 -->
        <svg id="scene1-svg" width="800" height="450">
            <!-- 网格背景 - 添加 data-decorative 属性供检测脚本跳过 -->
            <rect id="scene1-grid-bg" x="200" y="20" width="400" height="400" fill="#fafafa" stroke="#dddddd" stroke-width="1" data-decorative="true"/>
            
            <!-- 网格线（竖） -->
            <g id="scene1-grid-v">
                <line x1="250" y1="20" x2="250" y2="420" stroke="#dddddd" stroke-width="1"/>
                <line x1="300" y1="20" x2="300" y2="420" stroke="#dddddd" stroke-width="1"/>
                <line x1="350" y1="20" x2="350" y2="420" stroke="#dddddd" stroke-width="1"/>
                <line x1="400" y1="20" x2="400" y2="420" stroke="#dddddd" stroke-width="1"/>
                <line x1="450" y1="20" x2="450" y2="420" stroke="#dddddd" stroke-width="1"/>
                <line x1="500" y1="20" x2="500" y2="420" stroke="#dddddd" stroke-width="1"/>
                <line x1="550" y1="20" x2="550" y2="420" stroke="#dddddd" stroke-width="1"/>
            </g>
            
            <!-- 网格线（横） -->
            <g id="scene1-grid-h">
                <line x1="200" y1="70" x2="600" y2="70" stroke="#dddddd" stroke-width="1"/>
                <line x1="200" y1="120" x2="600" y2="120" stroke="#dddddd" stroke-width="1"/>
                <line x1="200" y1="170" x2="600" y2="170" stroke="#dddddd" stroke-width="1"/>
                <line x1="200" y1="220" x2="600" y2="220" stroke="#dddddd" stroke-width="1"/>
                <line x1="200" y1="270" x2="600" y2="270" stroke="#dddddd" stroke-width="1"/>
                <line x1="200" y1="320" x2="600" y2="320" stroke="#dddddd" stroke-width="1"/>
                <line x1="200" y1="370" x2="600" y2="370" stroke="#dddddd" stroke-width="1"/>
            </g>
            
            <!-- x 轴 -->
            <line id="scene1-x-axis" x1="200" y1="420" x2="600" y2="420" stroke="#000000" stroke-width="2"/>
            <!-- y 轴 -->
            <line id="scene1-y-axis" x1="200" y1="20" x2="200" y2="420" stroke="#000000" stroke-width="2"/>
            
            <!-- x 轴刻度数字 - 刻度 5 省略避免与 O 标签重叠 -->
            <g id="scene1-x-labels" font-size="12" fill="#000000" text-anchor="middle">
                <text x="200" y="440">0</text>
                <text x="250" y="440">1</text>
                <text x="300" y="440">2</text>
                <text x="350" y="440">3</text>
                <text x="400" y="440">4</text>
                <!-- 5 省略，由 O 标签代替 -->
                <text x="500" y="440">6</text>
                <text x="550" y="440">7</text>
                <text x="600" y="440">8</text>
            </g>
            
            <!-- y 轴刻度数字 - 顶部刻度下移避免裁切 -->
            <g id="scene1-y-labels" font-size="12" fill="#000000" text-anchor="end">
                <text x="185" y="425">0</text>
                <text x="185" y="375">1</text>
                <text x="185" y="325">2</text>
                <text x="185" y="275">3</text>
                <text x="185" y="225">4</text>
                <text x="185" y="175">5</text>
                <text x="185" y="125">6</text>
                <text x="185" y="75">7</text>
                <text x="185" y="35">8</text>
            </g>
            
            <!-- 原始小旗 -->
            <g id="scene1-flag-original" class="scene1-visible scene1-transition">
                <!-- 旗杆 -->
                <line x1="450" y1="220" x2="450" y2="420" stroke="#000000" stroke-width="4"/>
                <!-- 旗面（三角形） -->
                <polygon points="450,220 350,270 450,270" fill="rgba(0,0,0,0.2)" stroke="#000000" stroke-width="2"/>
            </g>
            
            <!-- 旋转后小旗（初始隐藏） -->
            <g id="scene1-flag-rotated" class="scene1-hidden scene1-transition">
                <!-- 旗杆 -->
                <line x1="450" y1="420" x2="650" y2="420" stroke="#2e7d32" stroke-width="4"/>
                <!-- 旗面（三角形） -->
                <polygon points="650,420 600,320 600,420" fill="rgba(46,125,50,0.2)" stroke="#2e7d32" stroke-width="2"/>
            </g>
            
            <!-- 旋转中心 O - 标签放在圆心下方，避开 x 轴刻度 -->
            <g id="scene1-point-o" class="scene1-hidden scene1-transition">
                <circle cx="450" cy="420" r="6" fill="#c62828"/>
                <text x="450" y="448" font-size="12" fill="#c62828" text-anchor="middle">O</text>
            </g>
            
            <!-- 原顶点标签 - 放在旗面顶点正上方，远离旗面 -->
            <text id="scene1-label-original" x="480" y="155" font-size="12" fill="#000000" class="scene1-visible">(5, 7)</text>
            
            <!-- 相对向量（原）- 蓝色 -->
            <line id="scene1-vector-original" x1="450" y1="420" x2="450" y2="220" stroke="#1565c0" stroke-width="3" class="scene1-hidden"/>
            
            <!-- 旋转轨迹弧 - 红色虚线 -->
            <path id="scene1-arc-trajectory" d="M 450 220 A 200 200 0 0 1 650 420" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" class="scene1-hidden"/>
            <!-- 轨迹弧箭头 -->
            <polygon id="scene1-arc-arrow" points="650,420 640,415 645,425" fill="#c62828" class="scene1-hidden"/>
            
            <!-- 相对向量（新）- 绿色 -->
            <line id="scene1-vector-new" x1="450" y1="420" x2="650" y2="420" stroke="#2e7d32" stroke-width="3" class="scene1-hidden"/>
            
            <!-- 新顶点标签 -->
            <text id="scene1-label-new" x="655" y="405" font-size="12" fill="#2e7d32" class="scene1-hidden">(9, 3)</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <div id="scene1-step-indicator">步骤 1/6</div>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现：小旗绕点 O 顺时针旋转 90°
        
        // 状态变量
        let currentStep = 0;
        const totalSteps = 6;
        
        // 每步显示的元素配置
        const stepConfig = {
            0: {
                show: ['scene1-flag-original', 'scene1-label-original'],
                hide: ['scene1-point-o', 'scene1-vector-original', 'scene1-arc-trajectory', 'scene1-arc-arrow', 'scene1-flag-rotated', 'scene1-vector-new', 'scene1-label-new'],
                originalOpacity: 1
            },
            1: {
                show: ['scene1-point-o'],
                hide: ['scene1-vector-original', 'scene1-arc-trajectory', 'scene1-arc-arrow', 'scene1-flag-rotated', 'scene1-vector-new', 'scene1-label-new'],
                originalOpacity: 1
            },
            2: {
                show: ['scene1-vector-original'],
                hide: ['scene1-arc-trajectory', 'scene1-arc-arrow', 'scene1-flag-rotated', 'scene1-vector-new', 'scene1-label-new'],
                originalOpacity: 1
            },
            3: {
                show: ['scene1-arc-trajectory', 'scene1-arc-arrow'],
                hide: ['scene1-flag-rotated', 'scene1-vector-new', 'scene1-label-new'],
                originalOpacity: 1
            },
            4: {
                show: ['scene1-flag-rotated', 'scene1-vector-new'],
                hide: ['scene1-label-new'],
                originalOpacity: 0.3
            },
            5: {
                show: ['scene1-label-new'],
                hide: [],
                originalOpacity: 0.3
            }
        };
        
        // 工具函数：显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene1-hidden');
                el.classList.add('scene1-visible');
                el.style.display = '';
                el.style.opacity = '1';
            }
        }
        
        // 工具函数：隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene1-visible');
                el.classList.add('scene1-hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        // 更新显示状态
        function updateDisplay() {
            const config = stepConfig[currentStep];
            
            config.show.forEach(id => showElement(id));
            config.hide.forEach(id => hideElement(id));
            
            const originalFlag = document.getElementById('scene1-flag-original');
            if (originalFlag) {
                originalFlag.style.opacity = config.originalOpacity;
            }
            
            const indicator = document.getElementById('scene1-step-indicator');
            if (indicator) {
                indicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;
            }
            
            const prevBtn = document.getElementById('scene1-btn-prev');
            const nextBtn = document.getElementById('scene1-btn-next');
            if (prevBtn) {
                prevBtn.disabled = (currentStep === 0);
            }
            if (nextBtn) {
                nextBtn.disabled = (currentStep === totalSteps - 1);
            }
        }
        
        function stepForward() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateDisplay();
            }
        }
        
        function stepBackward() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        }
        
        document.getElementById('scene1-btn-prev').addEventListener('click', stepBackward);
        document.getElementById('scene1-btn-next').addEventListener('click', stepForward);
        
        updateDisplay();
    })();
    </script>
</body>
</html>
