<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影子长度函数关系图</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        /* 淡入动画 */
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        /* 按钮样式 */
        .scene2-btn {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #333;
            border-radius: 4px;
            background: #f5f5f5;
        }
        .scene2-btn:hover {
            background: #e0e0e0;
        }
        .scene2-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        /* 控件栏 */
        #scene2-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        #scene2-step-indicator {
            font-size: 14px;
            color: #333;
            min-width: 80px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <!-- 坐标轴 -->
            <!-- 纵轴：(80,380)-(80,60) -->
            <line id="scene2-axis-y" x1="80" y1="380" x2="80" y2="60" stroke="#000000" stroke-width="2"/>
            <!-- 纵轴箭头 -->
            <polygon id="scene2-axis-y-arrow" points="80,60 75,70 85,70" fill="#000000"/>
            
            <!-- 横轴：(80,380)-(720,380) -->
            <line id="scene2-axis-x" x1="80" y1="380" x2="720" y2="380" stroke="#000000" stroke-width="2"/>
            <!-- 横轴箭头 -->
            <polygon id="scene2-axis-x-arrow" points="720,380 710,375 710,385" fill="#000000"/>
            
            <!-- 纵轴标签："影子长度"，竖排 -->
            <text id="scene2-label-y" x="35" y="220" font-size="14" fill="#000000" text-anchor="middle" writing-mode="tb">影子长度</text>
            
            <!-- 横轴标签："小亮位置" -->
            <text id="scene2-label-x" x="400" y="420" font-size="14" fill="#000000" text-anchor="middle">小亮位置</text>
            
            <!-- 横轴标记点 -->
            <!-- A 点标记 (120,380) -->
            <line id="scene2-mark-a" x1="120" y1="375" x2="120" y2="385" stroke="#000000" stroke-width="2"/>
            <text id="scene2-text-a" x="120" y="400" font-size="14" fill="#000000" text-anchor="middle">A</text>
            
            <!-- 路灯位置标记 (400,380) -->
            <line id="scene2-mark-lamp" x1="400" y1="375" x2="400" y2="385" stroke="#000000" stroke-width="2"/>
            <text id="scene2-text-lamp" x="400" y="400" font-size="14" fill="#000000" text-anchor="middle">路灯</text>
            
            <!-- B 点标记 (680,380) -->
            <line id="scene2-mark-b" x1="680" y1="375" x2="680" y2="385" stroke="#000000" stroke-width="2"/>
            <text id="scene2-text-b" x="680" y="400" font-size="14" fill="#000000" text-anchor="middle">B</text>
            
            <!-- 纵轴刻度线 -->
            <line x1="72" y1="380" x2="80" y2="380" stroke="#000000" stroke-width="1"/>
            <text x="65" y="385" font-size="12" fill="#000000" text-anchor="end">0</text>
            
            <line x1="72" y1="340" x2="80" y2="340" stroke="#000000" stroke-width="1"/>
            <text x="65" y="345" font-size="12" fill="#000000" text-anchor="end">1</text>
            
            <line x1="72" y1="300" x2="80" y2="300" stroke="#000000" stroke-width="1"/>
            <text x="65" y="305" font-size="12" fill="#000000" text-anchor="end">2</text>
            
            <line x1="72" y1="260" x2="80" y2="260" stroke="#000000" stroke-width="1"/>
            <text x="65" y="265" font-size="12" fill="#000000" text-anchor="end">3</text>
            
            <line x1="72" y1="220" x2="80" y2="220" stroke="#000000" stroke-width="1"/>
            <text x="65" y="225" font-size="12" fill="#000000" text-anchor="end">4</text>
            
            <line x1="72" y1="180" x2="80" y2="180" stroke="#000000" stroke-width="1"/>
            <text x="65" y="185" font-size="12" fill="#000000" text-anchor="end">5</text>
            
            <line x1="72" y1="140" x2="80" y2="140" stroke="#000000" stroke-width="1"/>
            <text x="65" y="145" font-size="12" fill="#000000" text-anchor="end">6</text>
            
            <line x1="72" y1="100" x2="80" y2="100" stroke="#000000" stroke-width="1"/>
            <text x="65" y="105" font-size="12" fill="#000000" text-anchor="end">7</text>
            
            <!-- 数据点（初始隐藏） -->
            <!-- 数据点 A (120,200) -->
            <circle id="scene2-point-a" cx="120" cy="200" r="4" fill="#1565c0" opacity="0"/>
            
            <!-- 数据点路灯 (400,360) -->
            <circle id="scene2-point-lamp" cx="400" cy="360" r="4" fill="#1565c0" opacity="0"/>
            
            <!-- 数据点 B (680,220) -->
            <circle id="scene2-point-b" cx="680" cy="220" r="4" fill="#1565c0" opacity="0"/>
            
            <!-- 函数曲线（初始隐藏） -->
            <path id="scene2-curve" d="M 120 200 Q 260 380 400 360 T 680 220" 
                  stroke="#c62828" stroke-width="2" fill="none" opacity="0"/>
            
            <!-- 最低点高亮圈（初始隐藏） -->
            <circle id="scene2-highlight" cx="400" cy="360" r="12" stroke="#2e7d32" stroke-width="2" fill="none" opacity="0"/>
            
            <!-- 最低点标注（初始隐藏） -->
            <text id="scene2-text-min" x="400" y="325" font-size="12" fill="#2e7d32" text-anchor="middle" opacity="0">最短</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn">◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 1/6</span>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现：影子长度函数关系图
        
        // 状态变量
        let currentStep = 0;
        const totalSteps = 6;
        
        // 每步显示的元素 ID 列表
        const steps = [
            // 步骤 0：空坐标系（只有坐标轴和标签）
            [],
            // 步骤 1：描出 A 点对应的影子长度点
            ['scene2-point-a'],
            // 步骤 2：描出路灯正下方对应的点（最低点）
            ['scene2-point-a', 'scene2-point-lamp'],
            // 步骤 3：描出 B 点对应的影子长度点
            ['scene2-point-a', 'scene2-point-lamp', 'scene2-point-b'],
            // 步骤 4：用平滑曲线连接三点
            ['scene2-point-a', 'scene2-point-lamp', 'scene2-point-b', 'scene2-curve'],
            // 步骤 5：高亮最低点并标注
            ['scene2-point-a', 'scene2-point-lamp', 'scene2-point-b', 'scene2-curve', 'scene2-highlight', 'scene2-text-min']
        ];
        
        // 获取 DOM 元素
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        
        // 显示元素函数
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.opacity = '1';
                el.classList.add('fade-in');
            }
        }
        
        // 隐藏元素函数
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.opacity = '0';
                el.classList.remove('fade-in');
            }
        }
        
        // 渲染当前步骤
        function renderStep() {
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;
            
            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps - 1;
            
            // 获取当前步骤应显示的元素
            const currentElements = steps[currentStep];
            
            // 所有可能显示的元素 ID
            const allElements = ['scene2-point-a', 'scene2-point-lamp', 'scene2-point-b', 'scene2-curve', 'scene2-highlight', 'scene2-text-min'];
            
            // 显示当前步骤的元素，隐藏其他
            allElements.forEach(id => {
                if (currentElements.includes(id)) {
                    showElement(id);
                } else {
                    hideElement(id);
                }
            });
        }
        
        // 上一步
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });
        
        // 下一步
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep();
            }
        });
        
        // 初始化
        renderStep();
        
    })();
    </script>
</body>
</html>
