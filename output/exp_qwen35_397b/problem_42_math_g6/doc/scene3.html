<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分层计数与答案验证 - Scene 3</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene3-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene3-svg {
            width: 800px;
            height: 500px;
        }
        .scene3-cube-top { fill: #e8e8e8; stroke: #000000; stroke-width: 2; }
        .scene3-cube-left { fill: #d0d0d0; stroke: #000000; stroke-width: 2; }
        .scene3-cube-right { fill: #b8b8b8; stroke: #000000; stroke-width: 2; }
        .scene3-highlight-layer1 { fill: #1565c0; opacity: 0; transition: opacity 0.3s ease; }
        .scene3-highlight-layer2 { fill: #2e7d32; opacity: 0; transition: opacity 0.3s ease; }
        .scene3-label { font-size: 16px; fill: #000000; opacity: 0; transition: opacity 0.3s ease; }
        .scene3-calc { font-size: 20px; fill: #000000; font-weight: bold; opacity: 0; transition: opacity 0.3s ease; }
        .scene3-option-box { fill: #f0f0f0; stroke: #000000; stroke-width: 1; transition: fill 0.3s ease; }
        .scene3-option-text { font-size: 16px; fill: #000000; }
        .scene3-title { font-size: 18px; fill: #000000; font-weight: bold; }
        .scene3-btn {
            position: absolute;
            bottom: 20px;
            width: 80px;
            height: 30px;
            border: 2px solid #333;
            border-radius: 5px;
            background: #fff;
            cursor: pointer;
            font-size: 14px;
        }
        .scene3-btn:hover { background: #f0f0f0; }
        .scene3-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene3-btn-prev { left: 280px; }
        #scene3-btn-next { left: 440px; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500">
            <!-- 立体图形区 (50,80)-(420,380) -->
            
            <!-- 第1层高亮层 (覆盖4个底层正方体) -->
            <g id="scene3-layer1-highlight">
                <rect id="scene3-hl1-1" class="scene3-highlight-layer1" x="115" y="215" width="50" height="50"/>
                <rect id="scene3-hl1-2" class="scene3-highlight-layer1" x="155" y="195" width="50" height="50"/>
                <rect id="scene3-hl1-3" class="scene3-highlight-layer1" x="195" y="195" width="50" height="50"/>
                <rect id="scene3-hl1-4" class="scene3-highlight-layer1" x="235" y="195" width="50" height="50"/>
            </g>
            
            <!-- 第2层高亮层 (覆盖1个上层正方体) -->
            <g id="scene3-layer2-highlight">
                <rect id="scene3-hl2-1" class="scene3-highlight-layer2" x="155" y="155" width="50" height="50"/>
            </g>
            
            <!-- 第1层正方体 (底层4个) -->
            <!-- 正方体1: (120,220) 底层前排左 -->
            <g id="scene3-cube-1">
                <polygon class="scene3-cube-top" points="140,220 160,210 180,220 160,230"/>
                <polygon class="scene3-cube-left" points="140,220 140,250 160,260 160,230"/>
                <polygon class="scene3-cube-right" points="160,230 160,260 180,250 180,220"/>
            </g>
            
            <!-- 正方体2: (160,200) 底层后排左 -->
            <g id="scene3-cube-2">
                <polygon class="scene3-cube-top" points="180,200 200,190 220,200 200,210"/>
                <polygon class="scene3-cube-left" points="180,200 180,230 200,240 200,210"/>
                <polygon class="scene3-cube-right" points="200,210 200,240 220,230 220,200"/>
            </g>
            
            <!-- 正方体3: (200,200) 底层后排中 -->
            <g id="scene3-cube-3">
                <polygon class="scene3-cube-top" points="220,200 240,190 260,200 240,210"/>
                <polygon class="scene3-cube-left" points="220,200 220,230 240,240 240,210"/>
                <polygon class="scene3-cube-right" points="240,210 240,240 260,230 260,200"/>
            </g>
            
            <!-- 正方体4: (240,200) 底层后排右 -->
            <g id="scene3-cube-4">
                <polygon class="scene3-cube-top" points="260,200 280,190 300,200 280,210"/>
                <polygon class="scene3-cube-left" points="260,200 260,230 280,240 280,210"/>
                <polygon class="scene3-cube-right" points="280,210 280,240 300,230 300,200"/>
            </g>
            
            <!-- 第2层正方体 (上层1个，在正方体2上方) -->
            <!-- 正方体5: (160,160) -->
            <g id="scene3-cube-5">
                <polygon class="scene3-cube-top" points="180,160 200,150 220,160 200,170"/>
                <polygon class="scene3-cube-left" points="180,160 180,190 200,200 200,170"/>
                <polygon class="scene3-cube-right" points="200,170 200,200 220,190 220,160"/>
            </g>
            
            <!-- 标签 -->
            <text id="scene3-label-layer1" class="scene3-label" x="180" y="280">第1层</text>
            <text id="scene3-label-count1" class="scene3-label" x="240" y="280">4个</text>
            <text id="scene3-label-layer2" class="scene3-label" x="180" y="120">第2层</text>
            <text id="scene3-label-count2" class="scene3-label" x="240" y="120">1个</text>
            
            <!-- 计数区 -->
            <text class="scene3-title" x="480" y="100">分层计数</text>
            <text id="scene3-calc" class="scene3-calc" x="480" y="180">4 + 1 = 5</text>
            
            <!-- 选项区 -->
            <rect id="scene3-option-a" class="scene3-option-box" x="480" y="240" width="120" height="30"/>
            <text class="scene3-option-text" x="495" y="260">A. 4</text>
            
            <rect id="scene3-option-b" class="scene3-option-box" x="480" y="280" width="120" height="30"/>
            <text class="scene3-option-text" x="495" y="300">B. 5</text>
            
            <rect id="scene3-option-c" class="scene3-option-box" x="480" y="320" width="120" height="30"/>
            <text class="scene3-option-text" x="495" y="340">C. 6</text>
            
            <rect id="scene3-option-d" class="scene3-option-box" x="480" y="360" width="120" height="30"/>
            <text class="scene3-option-text" x="495" y="380">D. 7</text>
            
            <!-- 总计标签 -->
            <text id="scene3-total" class="scene3-calc" x="480" y="420">总计 5个</text>
        </svg>
        
        <!-- 控件栏 -->
        <button id="scene3-btn-prev" class="scene3-btn" disabled>◀ 上一步</button>
        <button id="scene3-btn-next" class="scene3-btn">下一步 ▶</button>
    </div>
    
    <script>
    (function() {
        // Scene 3 实现
        let currentStep = 0;
        const totalSteps = 4;
        
        const btnPrev = document.getElementById('scene3-btn-prev');
        const btnNext = document.getElementById('scene3-btn-next');
        
        // 元素引用
        const layer1Highlight = document.getElementById('scene3-layer1-highlight');
        const layer2Highlight = document.getElementById('scene3-layer2-highlight');
        const labelLayer1 = document.getElementById('scene3-label-layer1');
        const labelCount1 = document.getElementById('scene3-label-count1');
        const labelLayer2 = document.getElementById('scene3-label-layer2');
        const labelCount2 = document.getElementById('scene3-label-count2');
        const calcText = document.getElementById('scene3-calc');
        const optionA = document.getElementById('scene3-option-a');
        const optionB = document.getElementById('scene3-option-b');
        const optionC = document.getElementById('scene3-option-c');
        const optionD = document.getElementById('scene3-option-d');
        const totalText = document.getElementById('scene3-total');
        
        // 更新按钮状态
        function updateButtons() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;
        }
        
        // 显示元素
        function show(el) {
            el.style.opacity = '1';
            el.style.display = '';
        }
        
        // 隐藏元素
        function hide(el) {
            el.style.opacity = '0';
            el.style.display = '';
        }
        
        // 更新场景状态
        function updateScene() {
            // 重置所有高亮和标签
            hide(layer1Highlight);
            hide(layer2Highlight);
            hide(labelLayer1);
            hide(labelCount1);
            hide(labelLayer2);
            hide(labelCount2);
            hide(calcText);
            hide(totalText);
            
            // 重置选项框颜色
            optionA.style.fill = '#f0f0f0';
            optionB.style.fill = '#f0f0f0';
            optionC.style.fill = '#f0f0f0';
            optionD.style.fill = '#f0f0f0';
            
            // 根据当前步骤显示相应元素
            if (currentStep >= 1) {
                show(layer1Highlight);
                show(labelLayer1);
                show(labelCount1);
            }
            if (currentStep >= 2) {
                show(layer2Highlight);
                show(labelLayer2);
                show(labelCount2);
            }
            if (currentStep >= 3) {
                show(calcText);
            }
            if (currentStep >= 4) {
                optionB.style.fill = '#2e7d32';
                optionA.style.fill = '#888888';
                optionC.style.fill = '#888888';
                optionD.style.fill = '#888888';
                show(totalText);
            }
            
            updateButtons();
        }
        
        // 按钮事件
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateScene();
            }
        });
        
        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
