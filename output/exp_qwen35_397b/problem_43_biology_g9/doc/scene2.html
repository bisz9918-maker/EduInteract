<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家蚕完全变态发育图示</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #1565c0; background: #e3f2fd; border-radius: 4px; }
        .scene2-btn:hover:not(:disabled) { background: #1565c0; color: #fff; }
        .scene2-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene2-node { transition: fill 0.3s ease-in-out; }
        .scene2-silk-tip { opacity: 0; transition: opacity 0.3s ease-in-out; }
        .scene2-silk-tip.visible { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 定义箭头 marker -->
            <defs>
                <marker id="scene2-arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                    <path d="M0,0 L8,4 L0,8 Z" fill="#000000" />
                </marker>
            </defs>

            <!-- 生命周期循环图组 -->
            <g id="scene2-cycle-group">
                <!-- 箭头路径 -->
                <path id="scene2-arrow-ab" d="M380,85 Q290,130 200,175" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene2-arrowhead)" />
                <path id="scene2-arrow-bd" d="M200,225 Q290,270 380,315" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene2-arrowhead)" />
                <path id="scene2-arrow-dc" d="M420,315 Q510,270 600,225" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene2-arrowhead)" />
                <path id="scene2-arrow-ca" d="M600,175 Q510,130 420,85" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene2-arrowhead)" />
                <path id="scene2-arrow-da" d="M400,315 L400,85" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene2-arrowhead)" />

                <!-- 节点圆形 -->
                <circle id="scene2-node-a" class="scene2-node" cx="400" cy="60" r="25" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" />
                <circle id="scene2-node-b" class="scene2-node" cx="180" cy="200" r="25" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" />
                <circle id="scene2-node-d" class="scene2-node" cx="400" cy="340" r="25" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" />
                <circle id="scene2-node-c" class="scene2-node" cx="620" cy="200" r="25" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" />

                <!-- 节点标签 -->
                <text id="scene2-label-a" x="400" y="45" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">A</text>
                <text id="scene2-label-b" x="165" y="205" text-anchor="end" font-size="14" font-weight="bold" fill="#000000">B</text>
                <text id="scene2-label-d" x="400" y="375" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">D</text>
                <text id="scene2-label-c" x="635" y="205" text-anchor="start" font-size="14" font-weight="bold" fill="#000000">C</text>
            </g>

            <!-- 蚕丝产量提示框（步骤 2 显示） -->
            <g id="scene2-silk-tip" class="scene2-silk-tip">
                <rect x="50" y="380" width="180" height="60" fill="#2e7d32" fill-opacity="0.2" stroke="#2e7d32" stroke-width="2" rx="4" />
                <text x="140" y="410" text-anchor="middle" font-size="13" fill="#2e7d32" font-weight="bold">延长 B 时期→增加蚕丝产量</text>
            </g>

            <!-- 阶段形态插图区 -->
            <g id="scene2-illustration" transform="translate(400,405)">
                <!-- 动态内容，由 JS 控制 -->
            </g>

            <!-- 阶段名称标签 -->
            <text id="scene2-stage-label" x="400" y="450" text-anchor="middle" font-size="16" fill="#333333">家蚕生命周期</text>

            <!-- 步骤指示器 -->
            <text id="scene2-step-indicator" x="720" y="485" text-anchor="end" font-size="14" fill="#666666">步骤 0/5</text>

            <!-- 控件栏（SVG 内底部） -->
            <g id="scene2-controls">
                <rect x="280" y="470" width="100" height="25" fill="#e3f2fd" stroke="#1565c0" rx="4" class="scene2-btn-bg" />
                <text x="330" y="487" text-anchor="middle" font-size="14" fill="#1565c0" id="scene2-btn-prev-text" style="cursor:pointer;">◀ 上一步</text>
                
                <rect x="420" y="470" width="100" height="25" fill="#e3f2fd" stroke="#1565c0" rx="4" class="scene2-btn-bg" />
                <text x="470" y="487" text-anchor="middle" font-size="14" fill="#1565c0" id="scene2-btn-next-text" style="cursor:pointer;">下一步 ▶</text>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 2 实现：家蚕完全变态发育图示

        // 状态管理
        let currentState = 0;
        const totalSteps = 5;

        // DOM 元素引用
        const nodes = {
            a: document.getElementById('scene2-node-a'),
            b: document.getElementById('scene2-node-b'),
            d: document.getElementById('scene2-node-d'),
            c: document.getElementById('scene2-node-c')
        };

        const illustration = document.getElementById('scene2-illustration');
        const stageLabel = document.getElementById('scene2-stage-label');
        const silkTip = document.getElementById('scene2-silk-tip');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        const btnPrevText = document.getElementById('scene2-btn-prev-text');
        const btnNextText = document.getElementById('scene2-btn-next-text');

        // 各状态配置
        const states = [
            { // 步骤 0：初始状态
                highlight: null,
                illustration: '',
                label: '家蚕生命周期',
                showSilkTip: false
            },
            { // 步骤 1：节点 A（卵）
                highlight: 'a',
                illustration: `
                    <ellipse cx="0" cy="0" rx="20" ry="12" fill="#fff9c4" stroke="#fbc02d" stroke-width="2" />
                    <ellipse cx="-5" cy="-2" rx="6" ry="4" fill="#ffe082" opacity="0.6" />
                    <ellipse cx="5" cy="2" rx="5" ry="3" fill="#ffe082" opacity="0.6" />
                `,
                label: '阶段 A：卵（受精卵）',
                showSilkTip: false
            },
            { // 步骤 2：节点 B（幼虫）
                highlight: 'b',
                illustration: `
                    <g>
                        <!-- 蚕宝宝身体 -->
                        <ellipse cx="-10" cy="0" rx="25" ry="10" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5" />
                        <ellipse cx="15" cy="0" rx="20" ry="9" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5" />
                        <!-- 环节 -->
                        <line x1="-5" y1="-8" x2="-5" y2="8" stroke="#bdbdbd" stroke-width="1" />
                        <line x1="5" y1="-8" x2="5" y2="8" stroke="#bdbdbd" stroke-width="1" />
                        <line x1="15" y1="-7" x2="15" y2="7" stroke="#bdbdbd" stroke-width="1" />
                        <!-- 头部 -->
                        <circle cx="-30" cy="0" r="8" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5" />
                        <circle cx="-33" cy="-2" r="2" fill="#333333" />
                        <circle cx="-33" cy="2" r="2" fill="#333333" />
                        <!-- 吐丝示意 -->
                        <path d="M10,10 Q20,15 25,5 Q30,-5 35,0" stroke="#2e7d32" stroke-width="2" fill="none" stroke-dasharray="3,3" opacity="0.7" />
                    </g>
                `,
                label: '阶段 B：幼虫（蚕宝宝）',
                showSilkTip: true
            },
            { // 步骤 3：节点 D（蛹）
                highlight: 'd',
                illustration: `
                    <g>
                        <!-- 茧 -->
                        <ellipse cx="0" cy="0" rx="30" ry="20" fill="#d7ccc8" stroke="#8d6e63" stroke-width="2" />
                        <ellipse cx="0" cy="0" rx="25" ry="15" fill="#efebe9" stroke="#a1887f" stroke-width="1" stroke-dasharray="4,4" />
                        <!-- 蛹 -->
                        <ellipse cx="0" cy="0" rx="18" ry="12" fill="#bcaaa4" stroke="#6d4c41" stroke-width="1.5" />
                        <path d="M-10,-5 Q0,0 10,-5" stroke="#6d4c41" stroke-width="1" fill="none" opacity="0.5" />
                    </g>
                `,
                label: '阶段 D：蛹（茧内）',
                showSilkTip: false
            },
            { // 步骤 4：节点 C（成虫）
                highlight: 'c',
                illustration: `
                    <g>
                        <!-- 身体 -->
                        <ellipse cx="0" cy="0" rx="12" ry="20" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5" />
                        <!-- 头部 -->
                        <circle cx="0" cy="-22" r="8" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5" />
                        <circle cx="-3" cy="-24" r="2" fill="#333333" />
                        <circle cx="3" cy="-24" r="2" fill="#333333" />
                        <!-- 触角 -->
                        <path d="M-5,-28 Q-10,-35 -8,-40" stroke="#9e9e9e" stroke-width="1.5" fill="none" />
                        <path d="M5,-28 Q10,-35 8,-40" stroke="#9e9e9e" stroke-width="1.5" fill="none" />
                        <!-- 翅膀 -->
                        <ellipse cx="-25" cy="-5" rx="20" ry="12" fill="#fafafa" stroke="#bdbdbd" stroke-width="1" opacity="0.8" />
                        <ellipse cx="25" cy="-5" rx="20" ry="12" fill="#fafafa" stroke="#bdbdbd" stroke-width="1" opacity="0.8" />
                        <ellipse cx="-25" cy="8" rx="15" ry="8" fill="#fafafa" stroke="#bdbdbd" stroke-width="1" opacity="0.8" />
                        <ellipse cx="25" cy="8" rx="15" ry="8" fill="#fafafa" stroke="#bdbdbd" stroke-width="1" opacity="0.8" />
                    </g>
                `,
                label: '阶段 C：成虫（蚕蛾）',
                showSilkTip: false
            },
            { // 步骤 5：总结
                highlight: null,
                illustration: `
                    <g>
                        <circle cx="0" cy="-10" r="25" fill="#2e7d32" opacity="0.1" />
                        <path d="M-12,-10 L-5,-3 L15,-18" stroke="#2e7d32" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                        <text x="0" y="20" text-anchor="middle" font-size="13" fill="#2e7d32" font-weight="bold">选项 C 正确</text>
                    </g>
                `,
                label: '家蚕幼虫期吐丝结茧，延长 B 时期可增加蚕丝产量',
                showSilkTip: false
            }
        ];

        // 更新节点高亮
        function updateNodeHighlight(highlightNode) {
            const defaultFill = '#e3f2fd';
            const highlightFill = '#1565c0';

            nodes.a.setAttribute('fill', highlightNode === 'a' ? highlightFill : defaultFill);
            nodes.b.setAttribute('fill', highlightNode === 'b' ? highlightFill : defaultFill);
            nodes.d.setAttribute('fill', highlightNode === 'd' ? highlightFill : defaultFill);
            nodes.c.setAttribute('fill', highlightNode === 'c' ? highlightFill : defaultFill);
        }

        // 更新插图
        function updateIllustration(svgContent) {
            illustration.innerHTML = svgContent;
        }

        // 更新阶段标签
        function updateStageLabel(text) {
            stageLabel.textContent = text;
        }

        // 更新蚕丝提示框
        function updateSilkTip(show) {
            if (show) {
                silkTip.classList.add('visible');
            } else {
                silkTip.classList.remove('visible');
            }
        }

        // 更新步骤指示器
        function updateStepIndicator() {
            stepIndicator.textContent = `步骤 ${currentState}/${totalSteps}`;
        }

        // 更新按钮状态
        function updateButtons() {
            // 步骤 0 时上一步不可用，步骤 5 时下一步不可用
            btnPrevText.setAttribute('fill', currentState === 0 ? '#bdbdbd' : '#1565c0');
            btnNextText.setAttribute('fill', currentState === totalSteps ? '#bdbdbd' : '#1565c0');
        }

        // 应用状态
        function applyState(stateIndex) {
            const state = states[stateIndex];
            updateNodeHighlight(state.highlight);
            updateIllustration(state.illustration);
            updateStageLabel(state.label);
            updateSilkTip(state.showSilkTip);
            updateStepIndicator();
            updateButtons();
        }

        // 上一步
        function prevStep() {
            if (currentState > 0) {
                currentState--;
                applyState(currentState);
            }
        }

        // 下一步
        function nextStep() {
            if (currentState < totalSteps) {
                currentState++;
                applyState(currentState);
            }
        }

        // 绑定事件
        btnPrevText.addEventListener('click', function() {
            if (currentState > 0) {
                prevStep();
            }
        });

        btnNextText.addEventListener('click', function() {
            if (currentState < totalSteps) {
                nextStep();
            }
        });

        // 初始化
        applyState(0);

    })();
    </script>
</body>
</html>
