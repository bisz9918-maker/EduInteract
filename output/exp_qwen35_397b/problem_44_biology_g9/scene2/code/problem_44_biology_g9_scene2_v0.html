<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人体内某结构的血流情况示意图</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: "Microsoft YaHei", sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        .scene2-btn {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 2px solid #1565c0;
            background: #ffffff;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .scene2-btn:hover {
            background: #e3f2fd;
        }
        .scene2-btn.active {
            background: #1565c0;
            color: #ffffff;
        }
        .scene2-hidden {
            opacity: 0;
            display: none;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 血管甲 -->
            <line id="scene2-vessel-甲" x1="80" y1="120" x2="220" y2="120" stroke="#000000" stroke-width="4" fill="none"/>
            <polygon id="scene2-arrow-甲" points="210,115 220,120 210,125" fill="#000000"/>
            <text id="scene2-label-甲" x="140" y="95" text-anchor="middle" font-size="18" fill="#000000">甲</text>
            <text id="scene2-label-甲-detail" x="140" y="110" text-anchor="middle" font-size="12" fill="#c62828" class="scene2-hidden">动脉血</text>

            <!-- 结构乙框 -->
            <rect id="scene2-organ-乙" x="220" y="80" width="360" height="80" stroke="#1565c0" stroke-width="3" fill="#ffffff"/>
            <text id="scene2-label-乙" x="390" y="125" text-anchor="middle" font-size="18" fill="#000000">乙</text>

            <!-- 血管丙 -->
            <line id="scene2-vessel-丙" x1="580" y1="120" x2="720" y2="120" stroke="#000000" stroke-width="4" fill="none"/>
            <polygon id="scene2-arrow-丙" points="710,115 720,120 710,125" fill="#000000"/>
            <text id="scene2-label-丙" x="640" y="95" text-anchor="middle" font-size="18" fill="#000000">丙</text>
            <text id="scene2-label-丙-detail" x="640" y="110" text-anchor="middle" font-size="12" fill="#1565c0" class="scene2-hidden">静脉血</text>

            <!-- 乙细节图区 -->
            <rect id="scene2-detail-frame" x="200" y="180" width="400" height="140" stroke="#1565c0" stroke-width="2" fill="#f5f5f5" stroke-dasharray="5,5"/>
            <text id="scene2-detail-title" x="400" y="200" text-anchor="middle" font-size="13" fill="#1565c0">乙结构细节图</text>
            <g id="scene2-detail-content"></g>

            <!-- 血液成分区 -->
            <text id="scene2-blood-info" x="400" y="350" text-anchor="middle" font-size="14" fill="#000000">请选择下方按钮查看具体情况</text>

            <!-- 选项判断区 -->
            <text id="scene2-option-result" x="400" y="375" text-anchor="middle" font-size="14" fill="#000000"></text>

            <!-- 控件栏 -->
            <g id="scene2-controls">
                <rect id="scene2-btn-capillary-bg" x="80" y="445" width="150" height="35" rx="4" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
                <text id="scene2-btn-capillary" x="155" y="467" text-anchor="middle" font-size="13" fill="#000000" style="cursor:pointer">毛细血管网</text>

                <rect id="scene2-btn-intestine-bg" x="245" y="445" width="150" height="35" rx="4" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
                <text id="scene2-btn-intestine" x="320" y="467" text-anchor="middle" font-size="13" fill="#000000" style="cursor:pointer">小肠</text>

                <rect id="scene2-btn-glomerulus-bg" x="410" y="445" width="150" height="35" rx="4" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
                <text id="scene2-btn-glomerulus" x="485" y="467" text-anchor="middle" font-size="13" fill="#000000" style="cursor:pointer">肾小球</text>

                <rect id="scene2-btn-islet-bg" x="575" y="445" width="150" height="35" rx="4" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
                <text id="scene2-btn-islet" x="650" y="467" text-anchor="middle" font-size="13" fill="#000000" style="cursor:pointer">胰岛</text>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 2 实现：人体内某结构的血流情况示意图

        const currentState = { value: 0 };

        // 工具函数：显示/隐藏元素
        function show(el) {
            if (el) {
                el.style.opacity = '1';
                el.style.display = '';
            }
        }

        function hide(el) {
            if (el) {
                el.style.opacity = '0';
                el.style.display = 'none';
            }
        }

        // 获取 SVG 元素
        const vessel甲 = document.getElementById('scene2-vessel-甲');
        const label甲Detail = document.getElementById('scene2-label-甲-detail');
        const label乙 = document.getElementById('scene2-label-乙');
        const vessel丙 = document.getElementById('scene2-vessel-丙');
        const label丙Detail = document.getElementById('scene2-label-丙-detail');
        const detailContent = document.getElementById('scene2-detail-content');
        const bloodInfo = document.getElementById('scene2-blood-info');
        const optionResult = document.getElementById('scene2-option-result');

        // 按钮背景
        const btnCapillaryBg = document.getElementById('scene2-btn-capillary-bg');
        const btnIntestineBg = document.getElementById('scene2-btn-intestine-bg');
        const btnGlomerulusBg = document.getElementById('scene2-btn-glomerulus-bg');
        const btnIsletBg = document.getElementById('scene2-btn-islet-bg');

        // 按钮文本
        const btnCapillary = document.getElementById('scene2-btn-capillary');
        const btnIntestine = document.getElementById('scene2-btn-intestine');
        const btnGlomerulus = document.getElementById('scene2-btn-glomerulus');
        const btnIslet = document.getElementById('scene2-btn-islet');

        // 重置所有按钮样式
        function resetButtons() {
            [btnCapillaryBg, btnIntestineBg, btnGlomerulusBg, btnIsletBg].forEach(bg => {
                bg.setAttribute('fill', '#ffffff');
            });
            [btnCapillary, btnIntestine, btnGlomerulus, btnIslet].forEach(text => {
                text.setAttribute('fill', '#000000');
            });
        }

        // 设置激活按钮
        function setActiveButton(btnIndex) {
            resetButtons();
            const bgs = [btnCapillaryBg, btnIntestineBg, btnGlomerulusBg, btnIsletBg];
            const texts = [btnCapillary, btnIntestine, btnGlomerulus, btnIslet];
            if (btnIndex >= 1 && btnIndex <= 4) {
                bgs[btnIndex - 1].setAttribute('fill', '#1565c0');
                texts[btnIndex - 1].setAttribute('fill', '#ffffff');
            }
        }

        // 清除细节图内容
        function clearDetailContent() {
            while (detailContent.firstChild) {
                detailContent.removeChild(detailContent.firstChild);
            }
        }

        // 状态 1：毛细血管网
        function state1_capillary() {
            clearDetailContent();

            // 血管颜色
            vessel甲.setAttribute('stroke', '#c62828');
            vessel丙.setAttribute('stroke', '#1565c0');

            // 标签
            label乙.textContent = '毛细血管网';
            label甲Detail.textContent = '动脉血';
            label甲Detail.setAttribute('fill', '#c62828');
            label丙Detail.textContent = '静脉血';
            label丙Detail.setAttribute('fill', '#1565c0');
            show(label甲Detail);
            show(label丙Detail);

            // 绘制毛细血管网（网状结构）
            const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');

            // 红色动脉端
            const arteryEnd = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            arteryEnd.setAttribute('x1', '250');
            arteryEnd.setAttribute('y1', '250');
            arteryEnd.setAttribute('x2', '320');
            arteryEnd.setAttribute('y2', '250');
            arteryEnd.setAttribute('stroke', '#c62828');
            arteryEnd.setAttribute('stroke-width', '3');
            g.appendChild(arteryEnd);

            // 蓝色静脉端
            const veinEnd = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            veinEnd.setAttribute('x1', '480');
            veinEnd.setAttribute('y1', '250');
            veinEnd.setAttribute('x2', '550');
            veinEnd.setAttribute('y2', '250');
            veinEnd.setAttribute('stroke', '#1565c0');
            veinEnd.setAttribute('stroke-width', '3');
            g.appendChild(veinEnd);

            // 毛细血管网（多条交叉线）
            const capillaries = [
                {x1:320, y1:230, x2:360, y2:270},
                {x1:320, y1:250, x2:360, y2:250},
                {x1:320, y1:270, x2:360, y2:230},
                {x1:360, y1:230, x2:400, y2:270},
                {x1:360, y1:250, x2:400, y2:250},
                {x1:360, y1:270, x2:400, y2:230},
                {x1:400, y1:230, x2:440, y2:270},
                {x1:400, y1:250, x2:440, y2:250},
                {x1:400, y1:270, x2:440, y2:230},
                {x1:440, y1:230, x2:480, y2:270},
                {x1:440, y1:250, x2:480, y2:250},
                {x1:440, y1:270, x2:480, y2:230}
            ];

            capillaries.forEach((cap, i) => {
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', cap.x1);
                line.setAttribute('y1', cap.y1);
                line.setAttribute('x2', cap.x2);
                line.setAttribute('y2', cap.y2);
                // 渐变效果
                const gradient = i % 3 === 0 ? '#c62828' : (i % 3 === 1 ? '#e57373' : '#1565c0');
                line.setAttribute('stroke', gradient);
                line.setAttribute('stroke-width', '2');
                line.setAttribute('opacity', '0.7');
                g.appendChild(line);
            });

            detailContent.appendChild(g);

            // 血液成分信息
            bloodInfo.textContent = '气体交换：氧气减少，二氧化碳增加';

            // 选项判断
            optionResult.innerHTML = '<tspan fill="#2e7d32" font-weight="bold">A ✓</tspan>（正确）';

            setActiveButton(1);
        }

        // 状态 2：小肠
        function state2_intestine() {
            clearDetailContent();

            // 血管颜色
            vessel甲.setAttribute('stroke', '#c62828');
            vessel丙.setAttribute('stroke', '#1565c0');

            // 标签
            label乙.textContent = '小肠毛细血管';
            label甲Detail.textContent = '动脉血';
            label甲Detail.setAttribute('fill', '#c62828');
            label丙Detail.textContent = '静脉血 营养↑';
            label丙Detail.setAttribute('fill', '#1565c0');
            show(label甲Detail);
            show(label丙Detail);

            // 绘制小肠绒毛结构（指状突起）
            const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');

            // 肠壁基底
            const base = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            base.setAttribute('d', 'M280,280 Q320,275 360,280 Q400,275 440,280 Q480,275 520,280 L520,290 L280,290 Z');
            base.setAttribute('fill', '#ffcdd2');
            base.setAttribute('stroke', '#c62828');
            base.setAttribute('stroke-width', '2');
            g.appendChild(base);

            // 绒毛（指状突起）
            const villi = [
                {x:300, h:35},
                {x:340, h:40},
                {x:380, h:38},
                {x:420, h:42},
                {x:460, h:36},
                {x:500, h:38}
            ];

            villi.forEach(villus => {
                // 绒毛主体
                const v = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                v.setAttribute('d', `M${villus.x-12},280 Q${villus.x-10},250 ${villus.x},245 Q${villus.x+10},250 ${villus.x+12},280 Z`);
                v.setAttribute('fill', '#ef9a9a');
                v.setAttribute('stroke', '#c62828');
                v.setAttribute('stroke-width', '1.5');
                g.appendChild(v);

                // 毛细血管（绒毛内部）
                const cap = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                cap.setAttribute('d', `M${villus.x},275 Q${villus.x-3},265 ${villus.x},255 Q${villus.x+3},265 ${villus.x},275`);
                cap.setAttribute('fill', 'none');
                cap.setAttribute('stroke', '#1565c0');
                cap.setAttribute('stroke-width', '2');
                g.appendChild(cap);

                // 营养颗粒（绿色小点）
                for (let i = 0; i < 3; i++) {
                    const particle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    particle.setAttribute('cx', villus.x - 25 + i * 12);
                    particle.setAttribute('cy', 295);
                    particle.setAttribute('r', '3');
                    particle.setAttribute('fill', '#2e7d32');
                    g.appendChild(particle);
                }
            });

            detailContent.appendChild(g);

            // 血液成分信息
            bloodInfo.textContent = '营养物质增加（吸收），氧气减少（消耗）';

            // 选项判断
            optionResult.innerHTML = '<tspan fill="#c62828" font-weight="bold">B ✗</tspan>（错误，含氧量应减少而非增加）';

            setActiveButton(2);
        }

        // 状态 3：肾小球
        function state3_glomerulus() {
            clearDetailContent();

            // 血管颜色（都是红色，因为都是动脉血）
            vessel甲.setAttribute('stroke', '#c62828');
            vessel丙.setAttribute('stroke', '#c62828');

            // 标签
            label乙.textContent = '肾小球';
            label甲Detail.textContent = '入球小动脉';
            label甲Detail.setAttribute('fill', '#c62828');
            label丙Detail.textContent = '出球小动脉';
            label丙Detail.setAttribute('fill', '#c62828');
            show(label甲Detail);
            show(label丙Detail);

            // 绘制肾小球毛细血管球（球状缠绕）
            const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');

            // 肾小球轮廓
            const sphere = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
            sphere.setAttribute('cx', '400');
            sphere.setAttribute('cy', '260');
            sphere.setAttribute('rx', '90');
            sphere.setAttribute('ry', '70');
            sphere.setAttribute('fill', '#ffcdd2');
            sphere.setAttribute('stroke', '#c62828');
            sphere.setAttribute('stroke-width', '2');
            sphere.setAttribute('opacity', '0.3');
            g.appendChild(sphere);

            // 入球小动脉
            const afferent = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            afferent.setAttribute('d', 'M280,260 Q320,260 340,260');
            afferent.setAttribute('fill', 'none');
            afferent.setAttribute('stroke', '#c62828');
            afferent.setAttribute('stroke-width', '5');
            g.appendChild(afferent);

            // 出球小动脉
            const efferent = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            efferent.setAttribute('d', 'M460,260 Q480,260 520,260');
            efferent.setAttribute('fill', 'none');
            efferent.setAttribute('stroke', '#c62828');
            efferent.setAttribute('stroke-width', '5');
            g.appendChild(efferent);

            // 毛细血管球（缠绕的曲线）
            const capillaryPaths = [
                'M340,260 Q360,240 380,250 Q400,260 420,250 Q440,240 460,260',
                'M340,250 Q360,230 380,240 Q400,250 420,240 Q440,230 460,250',
                'M340,270 Q360,250 380,260 Q400,270 420,260 Q440,250 460,270',
                'M340,240 Q360,220 380,230 Q400,240 420,230 Q440,220 460,240',
                'M340,280 Q360,260 380,270 Q400,280 420,270 Q440,260 460,280'
            ];

            capillaryPaths.forEach((path, i) => {
                const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                p.setAttribute('d', path);
                p.setAttribute('fill', 'none');
                p.setAttribute('stroke', '#c62828');
                p.setAttribute('stroke-width', '3');
                p.setAttribute('opacity', '0.6');
                g.appendChild(p);
            });

            detailContent.appendChild(g);

            // 血液成分信息
            bloodInfo.textContent = '过滤作用：血液成分基本不变（仍为动脉血）';

            // 选项判断
            optionResult.innerHTML = '<tspan fill="#c62828" font-weight="bold">C ✗</tspan>（错误，丙是出球小动脉而非静脉）';

            setActiveButton(3);
        }

        // 状态 4：胰岛
        function state4_islet() {
            clearDetailContent();

            // 血管颜色
            vessel甲.setAttribute('stroke', '#c62828');
            vessel丙.setAttribute('stroke', '#1565c0');

            // 标签
            label乙.textContent = '胰岛';
            label甲Detail.textContent = '动脉血';
            label甲Detail.setAttribute('fill', '#c62828');
            label丙Detail.textContent = '静脉血 胰岛素↑';
            label丙Detail.setAttribute('fill', '#8e24aa');
            show(label甲Detail);
            show(label丙Detail);

            // 绘制胰岛细胞团（细胞簇）
            const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');

            // 胰岛细胞（多个圆形细胞）
            const cells = [
                {x:340, y:240, r:20},
                {x:380, y:235, r:22},
                {x:420, y:240, r:18},
                {x:460, y:245, r:20},
                {x:360, y:270, r:19},
                {x:400, y:265, r:21},
                {x:440, y:270, r:19}
            ];

            cells.forEach((cell, i) => {
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', cell.x);
                circle.setAttribute('cy', cell.y);
                circle.setAttribute('r', cell.r);
                circle.setAttribute('fill', '#e1bee7');
                circle.setAttribute('stroke', '#8e24aa');
                circle.setAttribute('stroke-width', '2');
                g.appendChild(circle);

                // 细胞核
                const nucleus = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                nucleus.setAttribute('cx', cell.x - 3);
                nucleus.setAttribute('cy', cell.y - 3);
                nucleus.setAttribute('r', 6);
                nucleus.setAttribute('fill', '#ba68c8');
                nucleus.setAttribute('opacity', '0.5');
                g.appendChild(nucleus);
            });

            // 胰岛素颗粒（紫色小点，表示分泌）
            for (let i = 0; i < 15; i++) {
                const particle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                const angle = (i / 15) * Math.PI * 2;
                const radius = 50 + Math.random() * 30;
                particle.setAttribute('cx', 400 + Math.cos(angle) * radius);
                particle.setAttribute('cy', 260 + Math.sin(angle) * radius);
                particle.setAttribute('r', '3');
                particle.setAttribute('fill', '#8e24aa');
                particle.setAttribute('opacity', '0.7');
                g.appendChild(particle);
            }

            detailContent.appendChild(g);

            // 血液成分信息
            bloodInfo.textContent = '激素分泌：胰岛素增加（血糖调节）';

            // 选项判断
            optionResult.innerHTML = '<tspan fill="#2e7d32" font-weight="bold">D ✓</tspan>（正确）';

            setActiveButton(4);
        }

        // 重置到初始状态
        function resetState() {
            // 血管恢复黑色
            vessel甲.setAttribute('stroke', '#000000');
            vessel丙.setAttribute('stroke', '#000000');

            // 标签恢复
            label乙.textContent = '乙';
            hide(label甲Detail);
            hide(label丙Detail);

            // 清除细节图
            clearDetailContent();

            // 信息文本
            bloodInfo.textContent = '请选择下方按钮查看具体情况';
            optionResult.textContent = '';

            resetButtons();
        }

        // 绑定按钮点击事件
        btnCapillary.addEventListener('click', function() {
            currentState.value = 1;
            state1_capillary();
        });

        btnIntestine.addEventListener('click', function() {
            currentState.value = 2;
            state2_intestine();
        });

        btnGlomerulus.addEventListener('click', function() {
            currentState.value = 3;
            state3_glomerulus();
        });

        btnIslet.addEventListener('click', function() {
            currentState.value = 4;
            state4_islet();
        });

        // 初始状态
        resetState();
    })();
    </script>
</body>
</html>
