<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基因突变后复制的遗传比例推导</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene3-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene3-svg {
            width: 800px;
            height: 500px;
        }
        .scene3-element {
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        .scene3-visible {
            opacity: 1;
        }
        #scene3-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        #scene3-btn-prev, #scene3-btn-next {
            width: 80px;
            height: 30px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: #e0e0e0;
            color: #333;
        }
        #scene3-btn-prev:hover, #scene3-btn-next:hover {
            background: #c0c0c0;
        }
        #scene3-btn-prev:disabled, #scene3-btn-next:disabled {
            background: #f0f0f0;
            color: #aaa;
            cursor: not-allowed;
        }
        #scene3-step-indicator {
            font-size: 14px;
            color: #333;
            min-width: 60px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 正常DNA上链(左) -->
            <line id="scene3-dna-top-left" x1="150" y1="100" x2="280" y2="100" stroke="#000000" stroke-width="3" class="scene3-element scene3-visible"/>
            <!-- 正常DNA下链(左) -->
            <line id="scene3-dna-bottom-left" x1="150" y1="140" x2="280" y2="140" stroke="#000000" stroke-width="3" class="scene3-element scene3-visible"/>
            <!-- 正常DNA上链(右) -->
            <line id="scene3-dna-top-right" x1="520" y1="100" x2="650" y2="100" stroke="#000000" stroke-width="3" class="scene3-element scene3-visible"/>
            <!-- 正常DNA下链(右) -->
            <line id="scene3-dna-bottom-right" x1="520" y1="140" x2="650" y2="140" stroke="#000000" stroke-width="3" class="scene3-element scene3-visible"/>
            
            <!-- 中间虚线连接 -->
            <line id="scene3-dna-dash-top" x1="280" y1="100" x2="520" y2="100" stroke="#888888" stroke-width="3" stroke-dasharray="5,5" class="scene3-element scene3-visible"/>
            <line id="scene3-dna-dash-bottom" x1="280" y1="140" x2="520" y2="140" stroke="#888888" stroke-width="3" stroke-dasharray="5,5" class="scene3-element scene3-visible"/>
            
            <!-- 碱基对竖线(左) -->
            <line id="scene3-base-left-1" x1="170" y1="100" x2="170" y2="140" stroke="#000000" stroke-width="3" class="scene3-element scene3-visible"/>
            <line id="scene3-base-left-2" x1="200" y1="100" x2="200" y2="140" stroke="#000000" stroke-width="3" class="scene3-element scene3-visible"/>
            <line id="scene3-base-left-3" x1="230" y1="100" x2="230" y2="140" stroke="#000000" stroke-width="3" class="scene3-element scene3-visible"/>
            <line id="scene3-base-left-4" x1="260" y1="100" x2="260" y2="140" stroke="#000000" stroke-width="3" class="scene3-element scene3-visible"/>
            
            <!-- 碱基对竖线(右) -->
            <line id="scene3-base-right-1" x1="540" y1="100" x2="540" y2="140" stroke="#000000" stroke-width="3" class="scene3-element scene3-visible"/>
            <line id="scene3-base-right-2" x1="570" y1="100" x2="570" y2="140" stroke="#000000" stroke-width="3" class="scene3-element scene3-visible"/>
            <line id="scene3-base-right-3" x1="600" y1="100" x2="600" y2="140" stroke="#000000" stroke-width="3" class="scene3-element scene3-visible"/>
            <line id="scene3-base-right-4" x1="630" y1="100" x2="630" y2="140" stroke="#000000" stroke-width="3" class="scene3-element scene3-visible"/>
            
            <!-- 碱基字母(左上) -->
            <text id="scene3-base-top-1" x="165" y="95" font-size="14" fill="#000000" text-anchor="middle" class="scene3-element scene3-visible">C</text>
            <text id="scene3-base-top-2" x="195" y="95" font-size="14" fill="#000000" text-anchor="middle" class="scene3-element scene3-visible">T</text>
            <text id="scene3-base-top-3" x="225" y="95" font-size="14" fill="#000000" text-anchor="middle" class="scene3-element scene3-visible">G</text>
            <text id="scene3-base-top-4" x="255" y="95" font-size="14" fill="#000000" text-anchor="middle" class="scene3-element scene3-visible">C</text>
            
            <!-- 碱基字母(左下) -->
            <text id="scene3-base-bottom-1" x="165" y="155" font-size="14" fill="#000000" text-anchor="middle" class="scene3-element scene3-visible">G</text>
            <text id="scene3-base-bottom-2" x="195" y="155" font-size="14" fill="#000000" text-anchor="middle" class="scene3-element scene3-visible">A</text>
            <text id="scene3-base-bottom-3" x="225" y="155" font-size="14" fill="#000000" text-anchor="middle" class="scene3-element scene3-visible">C</text>
            <text id="scene3-base-bottom-4" x="255" y="155" font-size="14" fill="#000000" text-anchor="middle" class="scene3-element scene3-visible">G</text>
            
            <!-- 碱基字母(右上) -->
            <text id="scene3-base-top-5" x="535" y="95" font-size="14" fill="#000000" text-anchor="middle" class="scene3-element scene3-visible">C</text>
            <text id="scene3-base-top-6" x="565" y="95" font-size="14" fill="#000000" text-anchor="middle" class="scene3-element scene3-visible">T</text>
            <text id="scene3-base-top-7" x="595" y="95" font-size="14" fill="#000000" text-anchor="middle" class="scene3-element scene3-visible">T</text>
            <text id="scene3-base-top-8" x="625" y="95" font-size="14" fill="#000000" text-anchor="middle" class="scene3-element scene3-visible">A</text>
            
            <!-- 碱基字母(右下) -->
            <text id="scene3-base-bottom-5" x="535" y="155" font-size="14" fill="#000000" text-anchor="middle" class="scene3-element scene3-visible">G</text>
            <text id="scene3-base-bottom-6" x="565" y="155" font-size="14" fill="#000000" text-anchor="middle" class="scene3-element scene3-visible">A</text>
            <text id="scene3-base-bottom-7" x="595" y="155" font-size="14" fill="#000000" text-anchor="middle" class="scene3-element scene3-visible">A</text>
            <text id="scene3-base-bottom-8" x="625" y="155" font-size="14" fill="#000000" text-anchor="middle" class="scene3-element scene3-visible">T</text>
            
            <!-- ①箭头标记 -->
            <line id="scene3-arrow-1-line" x1="165" y1="70" x2="165" y2="90" stroke="#000000" stroke-width="2" class="scene3-element scene3-visible"/>
            <polygon id="scene3-arrow-1-head" points="165,90 160,80 170,80" fill="#000000" class="scene3-element scene3-visible"/>
            <text id="scene3-label-1" x="165" y="65" font-size="14" fill="#000000" text-anchor="middle" class="scene3-element scene3-visible">①</text>
            
            <!-- ②箭头标记 -->
            <line id="scene3-arrow-2-line" x1="380" y1="115" x2="400" y2="115" stroke="#000000" stroke-width="2" class="scene3-element scene3-visible"/>
            <polygon id="scene3-arrow-2-head" points="400,115 390,110 390,120" fill="#000000" class="scene3-element scene3-visible"/>
            <text id="scene3-label-2" x="370" y="120" font-size="14" fill="#000000" text-anchor="middle" class="scene3-element scene3-visible">②</text>
            
            <!-- 突变红圈 (步骤1显示) -->
            <circle id="scene3-mutation-circle" cx="195" cy="100" r="18" stroke="#c62828" stroke-width="2" fill="none" class="scene3-element"/>
            <text id="scene3-mutation-text" x="195" y="75" font-size="14" fill="#c62828" text-anchor="middle" font-weight="bold" class="scene3-element">T→A</text>
            
            <!-- 复制树-第1代连接线 -->
            <line id="scene3-replicate-line-left" x1="200" y1="200" x2="200" y2="280" stroke="#2e7d32" stroke-width="3" class="scene3-element"/>
            <line id="scene3-replicate-line-right" x1="600" y1="200" x2="600" y2="280" stroke="#c62828" stroke-width="3" class="scene3-element"/>
            
            <!-- 复制树-第1代DNA框 -->
            <rect id="scene3-replicate-box-left" x="150" y="280" width="100" height="40" fill="#2e7d32" fill-opacity="0.2" stroke="#2e7d32" stroke-width="2" class="scene3-element"/>
            <text id="scene3-replicate-label-left" x="200" y="305" font-size="12" fill="#2e7d32" text-anchor="middle" class="scene3-element">正常DNA</text>
            
            <rect id="scene3-replicate-box-right" x="550" y="280" width="100" height="40" fill="#c62828" fill-opacity="0.2" stroke="#c62828" stroke-width="2" class="scene3-element"/>
            <text id="scene3-replicate-label-right" x="600" y="305" font-size="12" fill="#c62828" text-anchor="middle" class="scene3-element">突变DNA</text>
            
            <!-- 选项C对比框 (步骤3显示) -->
            <rect id="scene3-option-c-box" x="50" y="380" width="180" height="50" fill="#ffebee" stroke="#c62828" stroke-width="2" class="scene3-element"/>
            <text id="scene3-option-c-text" x="140" y="405" font-size="14" fill="#c62828" text-anchor="middle" class="scene3-element">C说 1/4 ❌</text>
            
            <!-- 比例统计框 (步骤3显示) -->
            <rect id="scene3-stat-box" x="250" y="380" width="300" height="50" fill="#f5f5f5" stroke="#333" stroke-width="2" class="scene3-element"/>
            <text id="scene3-stat-text" x="400" y="410" font-size="16" fill="#333" text-anchor="middle" font-weight="bold" class="scene3-element">突变基因：1/2</text>
            
            <!-- 控件栏背景 -->
            <rect id="scene3-controls-bg" x="0" y="440" width="800" height="60" fill="#f0f0f0" class="scene3-element scene3-visible"/>
        </svg>
        
        <div id="scene3-controls">
            <button id="scene3-btn-prev">◀ 上一步</button>
            <span id="scene3-step-indicator">步骤 1/4</span>
            <button id="scene3-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 3 实现 - 基因突变后复制的遗传比例推导
        
        // 状态定义
        const TOTAL_STEPS = 4;
        let currentState = 0;
        
        // 每步显示的元素ID列表
        const steps = {
            0: [
                // 初始状态：DNA 结构 + ①②标记
                'scene3-dna-top-left', 'scene3-dna-bottom-left',
                'scene3-dna-top-right', 'scene3-dna-bottom-right',
                'scene3-dna-dash-top', 'scene3-dna-dash-bottom',
                'scene3-base-left-1', 'scene3-base-left-2', 'scene3-base-left-3', 'scene3-base-left-4',
                'scene3-base-right-1', 'scene3-base-right-2', 'scene3-base-right-3', 'scene3-base-right-4',
                'scene3-base-top-1', 'scene3-base-top-2', 'scene3-base-top-3', 'scene3-base-top-4',
                'scene3-base-bottom-1', 'scene3-base-bottom-2', 'scene3-base-bottom-3', 'scene3-base-bottom-4',
                'scene3-base-top-5', 'scene3-base-top-6', 'scene3-base-top-7', 'scene3-base-top-8',
                'scene3-base-bottom-5', 'scene3-base-bottom-6', 'scene3-base-bottom-7', 'scene3-base-bottom-8',
                'scene3-arrow-1-line', 'scene3-arrow-1-head', 'scene3-label-1',
                'scene3-arrow-2-line', 'scene3-arrow-2-head', 'scene3-label-2',
                'scene3-controls-bg'
            ],
            1: [
                // 步骤1：突变标记
                'scene3-mutation-circle', 'scene3-mutation-text'
            ],
            2: [
                // 步骤2：复制第1代
                'scene3-replicate-line-left', 'scene3-replicate-line-right',
                'scene3-replicate-box-left', 'scene3-replicate-label-left',
                'scene3-replicate-box-right', 'scene3-replicate-label-right'
            ],
            3: [
                // 步骤3：比例统计 + 选项C对比
                'scene3-option-c-box', 'scene3-option-c-text',
                'scene3-stat-box', 'scene3-stat-text'
            ]
        };
        
        // 工具函数：显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.add('scene3-visible');
            }
        }
        
        // 工具函数：隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene3-visible');
            }
        }
        
        // 更新状态
        function updateState() {
            // 更新步骤指示器
            const indicator = document.getElementById('scene3-step-indicator');
            indicator.textContent = '步骤 ' + (currentState + 1) + '/' + TOTAL_STEPS;
            
            // 更新按钮状态
            const prevBtn = document.getElementById('scene3-btn-prev');
            const nextBtn = document.getElementById('scene3-btn-next');
            prevBtn.disabled = (currentState === 0);
            nextBtn.disabled = (currentState === TOTAL_STEPS - 1);
            
            // 根据当前状态显示/隐藏元素
            for (let step = 0; step < TOTAL_STEPS; step++) {
                const elements = steps[step];
                if (elements) {
                    elements.forEach(function(id) {
                        if (step <= currentState) {
                            showElement(id);
                        } else {
                            hideElement(id);
                        }
                    });
                }
            }
        }
        
        // 事件绑定
        document.getElementById('scene3-btn-prev').addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                updateState();
            }
        });
        
        document.getElementById('scene3-btn-next').addEventListener('click', function() {
            if (currentState < TOTAL_STEPS - 1) {
                currentState++;
                updateState();
            }
        });
        
        // 初始化
        updateState();
    })();
    </script>
</body>
</html>
