<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆面积等比数列求和</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        .scene2-element {
            transition: opacity 0.3s ease, stroke 0.3s ease, fill 0.3s ease;
        }
        .scene2-hidden {
            opacity: 0;
            display: none;
        }
        .scene2-visible {
            opacity: 1;
            display: block;
        }
        /* 按钮样式 */
        .scene2-btn {
            position: absolute;
            width: 80px;
            height: 35px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        #scene2-btn-prev {
            left: 500px;
            top: 450px;
            background: #e0e0e0;
            color: #333;
        }
        #scene2-btn-prev:hover:not(:disabled) {
            background: #c0c0c0;
        }
        #scene2-btn-next {
            left: 600px;
            top: 450px;
            background: #1565c0;
            color: #fff;
        }
        #scene2-btn-next:hover:not(:disabled) {
            background: #0d47a1;
        }
        #scene2-btn-prev:disabled, #scene2-btn-next:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene2-step-indicator {
            position: absolute;
            left: 400px;
            top: 460px;
            transform: translateX(-50%);
            font-size: 14px;
            color: #666;
        }
        /* 表格样式 */
        .scene2-table-text {
            font-size: 14px;
            fill: #000000;
        }
        .scene2-table-header {
            font-weight: bold;
        }
        .scene2-highlight-blue {
            fill: #1565c0 !important;
        }
        .scene2-highlight-red {
            fill: #c62828 !important;
        }
        .scene2-highlight-green {
            fill: #2e7d32 !important;
            font-weight: bold;
            font-size: 18px;
        }
        /* 箭头标记 */
        .scene2-arrow {
            stroke: #1565c0;
            stroke-width: 2;
            fill: none;
            marker-end: url(#scene2-arrowhead);
        }
        .scene2-arrow-red {
            stroke: #c62828;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <!-- 箭头标记定义 -->
            <defs>
                <marker id="scene2-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#1565c0" />
                </marker>
                <marker id="scene2-arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#c62828" />
                </marker>
            </defs>

            <!-- ========== 左侧嵌套圆示意图 ========== -->
            <!-- 外圆 C0 (灰色初始) -->
            <circle id="scene2-circle-0" class="scene2-element" cx="140" cy="180" r="80" 
                    fill="none" stroke="#888888" stroke-width="2"/>
            
            <!-- 正六边形 H0 (内接于 C0) -->
            <polygon id="scene2-hex-0" class="scene2-element" 
                     points="220,180 180,249.28 100,249.28 60,180 100,110.72 180,110.72"
                     fill="none" stroke="#888888" stroke-width="2"/>
            
            <!-- 内圆 C1 (灰色初始) -->
            <circle id="scene2-circle-1" class="scene2-element" cx="140" cy="180" r="69.28" 
                    fill="none" stroke="#888888" stroke-width="2"/>
            
            <!-- 正六边形 H1 (内接于 C1) -->
            <polygon id="scene2-hex-1" class="scene2-element"
                     points="209.28,180 174.64,239.64 105.36,239.64 70.72,180 105.36,120.36 174.64,120.36"
                     fill="none" stroke="#888888" stroke-width="2"/>
            
            <!-- 内圆 C2 (灰色初始) -->
            <circle id="scene2-circle-2" class="scene2-element" cx="140" cy="180" r="60" 
                    fill="none" stroke="#888888" stroke-width="2"/>
            
            <!-- 半径标注 R0 -->
            <text id="scene2-label-r0" class="scene2-element scene2-table-text" x="140" y="90" text-anchor="middle">R₀=1</text>
            
            <!-- 半径标注 R1 -->
            <text id="scene2-label-r1" class="scene2-element scene2-table-text" x="235" y="185">R₁=√3/2</text>
            
            <!-- 半径标注 R2 -->
            <text id="scene2-label-r2" class="scene2-element scene2-table-text" x="235" y="225">R₂=3/4</text>

            <!-- ========== 右侧数列表格区 ========== -->
            <!-- 表格外框 -->
            <rect id="scene2-table-frame" class="scene2-element" x="340" y="60" width="420" height="180" 
                  fill="none" stroke="#000000" stroke-width="1"/>
            
            <!-- 表格标题行 -->
            <text id="scene2-table-header" class="scene2-element scene2-table-text scene2-table-header" 
                  x="360" y="85">n &nbsp;&nbsp;|&nbsp;&nbsp; Rₙ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp; Sₙ</text>
            
            <!-- 表格分隔线 -->
            <line id="scene2-table-line1" class="scene2-element" x1="340" y1="95" x2="760" y2="95" 
                  stroke="#000000" stroke-width="1"/>
            
            <!-- 表格行 0 -->
            <text id="scene2-table-row-0" class="scene2-element scene2-table-text scene2-highlight-blue" 
                  x="360" y="115">0 &nbsp;&nbsp;&nbsp;|&nbsp;&nbsp; 1 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp; π</text>
            
            <!-- 表格行 1 (初始隐藏) -->
            <text id="scene2-table-row-1" class="scene2-element scene2-table-text scene2-hidden" 
                  x="360" y="145">1 &nbsp;&nbsp;&nbsp;|&nbsp;&nbsp; √3/2 &nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp; 3π/4</text>
            
            <!-- 表格行 2 (初始隐藏) -->
            <text id="scene2-table-row-2" class="scene2-element scene2-table-text scene2-hidden" 
                  x="360" y="175">2 &nbsp;&nbsp;&nbsp;|&nbsp;&nbsp; 3/4 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp; 9π/16</text>
            
            <!-- 等比箭头 1 (初始隐藏) -->
            <path id="scene2-arrow-1" class="scene2-element scene2-arrow scene2-hidden" 
                  d="M 520 118 L 520 142"/>
            <text id="scene2-arrow-label-1" class="scene2-element scene2-table-text scene2-hidden" 
                  x="535" y="132">×3/4</text>
            
            <!-- 等比箭头 2 (初始隐藏) -->
            <path id="scene2-arrow-2" class="scene2-element scene2-arrow scene2-hidden" 
                  d="M 520 148 L 520 172"/>
            <text id="scene2-arrow-label-2" class="scene2-element scene2-table-text scene2-hidden" 
                  x="535" y="162">×3/4</text>
            
            <!-- 首项标注 (初始隐藏) -->
            <text id="scene2-label-a1" class="scene2-element scene2-table-text scene2-hidden" 
                  x="535" y="100" fill="#c62828">a₁=π</text>
            
            <!-- 公比标注 (初始隐藏) -->
            <text id="scene2-label-q" class="scene2-element scene2-table-text scene2-hidden" 
                  x="535" y="130" fill="#c62828">q=3/4</text>
            
            <!-- 虚线延伸箭头 (初始隐藏) -->
            <path id="scene2-arrow-extend" class="scene2-element scene2-hidden" 
                  d="M 520 178 L 520 200" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#scene2-arrowhead)"/>
            <text id="scene2-label-extend" class="scene2-element scene2-table-text scene2-hidden" 
                  x="535" y="195" fill="#888888">...</text>

            <!-- ========== 求和公式区 ========== -->
            <!-- 公式框 (初始隐藏) -->
            <rect id="scene2-formula-box" class="scene2-element scene2-hidden" 
                  x="340" y="260" width="420" height="80" fill="#f5f5f5" stroke="#888888" stroke-width="1"/>
            
            <!-- 求和公式 (初始隐藏) -->
            <text id="scene2-formula-text" class="scene2-element scene2-table-text scene2-hidden" 
                  x="360" y="290">S = a₁/(1-q)</text>
            
            <!-- 代入计算 (初始隐藏) -->
            <text id="scene2-formula-calc" class="scene2-element scene2-table-text scene2-hidden" 
                  x="360" y="315">= π/(1-3/4) = π/(1/4) = 4π</text>
            
            <!-- 最终结果 (初始隐藏) -->
            <text id="scene2-result" class="scene2-element scene2-table-text scene2-hidden" 
                  x="580" y="340" fill="#2e7d32" font-weight="bold" font-size="18">S=4π</text>

            <!-- ========== 控件栏 ========== -->
        </svg>
        
        <!-- 步骤指示器 -->
        <div id="scene2-step-indicator">步骤 1/5</div>
        
        <!-- 上一步按钮 -->
        <button id="scene2-btn-prev" class="scene2-btn" disabled>◀ 上一步</button>
        
        <!-- 下一步按钮 -->
        <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
    </div>

    <script>
    (function() {
        // Scene 2: 圆面积等比数列求和
        // 布局坐标表参考:
        // | 元素 | 位置 | 备注 |
        // |------|------|------|
        // | 外圆 C0 | 圆心 (140,180), r=80 | 最外层圆 |
        // | 正六边形 H0 | 内接于 C0 | 6 个顶点在 C0 上 |
        // | 内圆 C1 | 圆心 (140,180), r=69.28 | R1=√3/2 |
        // | 正六边形 H1 | 内接于 C1 | 第二层六边形 |
        // | 内圆 C2 | 圆心 (140,180), r=60 | R2=3/4 |
        // | R0 标注 | (140,90) | 上方 |
        // | R1 标注 | (235,185) | 右侧 |
        // | R2 标注 | (235,225) | 右侧 |
        // | 表格区 | (340,60) 420×180 | 数列表格 |
        // | 公式区 | (340,260) 420×80 | 求和公式 |
        // | 上一步按钮 | (500,450) | 控件 |
        // | 下一步按钮 | (600,450) | 控件 |

        let currentStep = 0;
        const totalSteps = 5;

        // 获取所有需要控制的元素
        const elements = {
            // 左侧图形
            circle0: document.getElementById('scene2-circle-0'),
            circle1: document.getElementById('scene2-circle-1'),
            circle2: document.getElementById('scene2-circle-2'),
            hex0: document.getElementById('scene2-hex-0'),
            hex1: document.getElementById('scene2-hex-1'),
            labelR0: document.getElementById('scene2-label-r0'),
            labelR1: document.getElementById('scene2-label-r1'),
            labelR2: document.getElementById('scene2-label-r2'),
            
            // 表格
            tableFrame: document.getElementById('scene2-table-frame'),
            tableHeader: document.getElementById('scene2-table-header'),
            tableLine1: document.getElementById('scene2-table-line1'),
            row0: document.getElementById('scene2-table-row-0'),
            row1: document.getElementById('scene2-table-row-1'),
            row2: document.getElementById('scene2-table-row-2'),
            
            // 箭头和标注
            arrow1: document.getElementById('scene2-arrow-1'),
            arrowLabel1: document.getElementById('scene2-arrow-label-1'),
            arrow2: document.getElementById('scene2-arrow-2'),
            arrowLabel2: document.getElementById('scene2-arrow-label-2'),
            labelA1: document.getElementById('scene2-label-a1'),
            labelQ: document.getElementById('scene2-label-q'),
            arrowExtend: document.getElementById('scene2-arrow-extend'),
            labelExtend: document.getElementById('scene2-label-extend'),
            
            // 公式区
            formulaBox: document.getElementById('scene2-formula-box'),
            formulaText: document.getElementById('scene2-formula-text'),
            formulaCalc: document.getElementById('scene2-formula-calc'),
            result: document.getElementById('scene2-result'),
            
            // 控件
            btnPrev: document.getElementById('scene2-btn-prev'),
            btnNext: document.getElementById('scene2-btn-next'),
            stepIndicator: document.getElementById('scene2-step-indicator')
        };

        // 显示元素
        function show(el) {
            if (el) {
                el.classList.remove('scene2-hidden');
                el.classList.add('scene2-visible');
                if (el.style) {
                    el.style.display = 'block';
                    el.style.opacity = '1';
                }
            }
        }

        // 隐藏元素
        function hide(el) {
            if (el) {
                el.classList.remove('scene2-visible');
                el.classList.add('scene2-hidden');
                if (el.style) {
                    el.style.display = 'none';
                    el.style.opacity = '0';
                }
            }
        }

        // 设置元素颜色
        function setColor(el, color) {
            if (el) {
                el.setAttribute('stroke', color);
                el.setAttribute('fill', color);
            }
        }

        // 更新按钮状态
        function updateButtons() {
            elements.btnPrev.disabled = (currentStep === 0);
            elements.btnNext.disabled = (currentStep === totalSteps - 1);
            elements.stepIndicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;
        }

        // 渲染每个步骤
        function renderStep(step) {
            // 步骤 0: 初始状态
            if (step === 0) {
                // 左侧图形：全部灰色
                setColor(elements.circle0, '#888888');
                setColor(elements.circle1, '#888888');
                setColor(elements.circle2, '#888888');
                setColor(elements.hex0, '#888888');
                setColor(elements.hex1, '#888888');
                show(elements.circle0);
                show(elements.circle1);
                show(elements.circle2);
                show(elements.hex0);
                show(elements.hex1);
                show(elements.labelR0);
                show(elements.labelR1);
                show(elements.labelR2);
                
                // 表格：显示外框、表头、第 0 行
                show(elements.tableFrame);
                show(elements.tableHeader);
                show(elements.tableLine1);
                show(elements.row0);
                elements.row0.classList.add('scene2-highlight-blue');
                elements.row0.classList.remove('scene2-highlight-red');
                hide(elements.row1);
                hide(elements.row2);
                
                // 隐藏箭头和标注
                hide(elements.arrow1);
                hide(elements.arrowLabel1);
                hide(elements.arrow2);
                hide(elements.arrowLabel2);
                hide(elements.labelA1);
                hide(elements.labelQ);
                hide(elements.arrowExtend);
                hide(elements.labelExtend);
                
                // 隐藏公式区
                hide(elements.formulaBox);
                hide(elements.formulaText);
                hide(elements.formulaCalc);
                hide(elements.result);
            }
            
            // 步骤 1: 显示完整表格和等比箭头
            if (step >= 1) {
                show(elements.row1);
                show(elements.row2);
                show(elements.arrow1);
                show(elements.arrowLabel1);
                show(elements.arrow2);
                show(elements.arrowLabel2);
                
                // 左侧 C1、C2 变蓝色
                setColor(elements.circle1, '#1565c0');
                setColor(elements.circle2, '#1565c0');
                setColor(elements.hex1, '#1565c0');
            }
            
            // 步骤 2: 高亮首项和公比
            if (step >= 2) {
                show(elements.labelA1);
                show(elements.labelQ);
                show(elements.arrowExtend);
                show(elements.labelExtend);
                
                // 第 0 行变红色（首项）
                elements.row0.classList.remove('scene2-highlight-blue');
                elements.row0.classList.add('scene2-highlight-red');
                
                // 箭头变红色
                elements.arrow1.setAttribute('stroke', '#c62828');
                elements.arrow1.setAttribute('marker-end', 'url(#scene2-arrowhead-red)');
                elements.arrow2.setAttribute('stroke', '#c62828');
                elements.arrow2.setAttribute('marker-end', 'url(#scene2-arrowhead-red)');
                elements.arrowLabel1.setAttribute('fill', '#c62828');
                elements.arrowLabel2.setAttribute('fill', '#c62828');
            }
            
            // 步骤 3: 显示求和公式
            if (step >= 3) {
                show(elements.formulaBox);
                show(elements.formulaText);
            }
            
            // 步骤 4: 显示代入计算和最终结果
            if (step >= 4) {
                show(elements.formulaCalc);
                show(elements.result);
                
                // 左侧所有圆变绿色
                setColor(elements.circle0, '#2e7d32');
                setColor(elements.circle1, '#2e7d32');
                setColor(elements.circle2, '#2e7d32');
                setColor(elements.hex0, '#2e7d32');
                setColor(elements.hex1, '#2e7d32');
            }
            
            updateButtons();
        }

        // 上一步
        elements.btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
            }
        });

        // 下一步
        elements.btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep(currentStep);
            }
        });

        // 初始化
        renderStep(0);
    })();
    </script>
</body>
</html>
