<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正弦定理求外接圆半径</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        .scene2-label {
            font-size: 14px;
            fill: #000000;
        }
        .scene2-formula {
            font-size: 16px;
            fill: #000000;
        }
        .scene2-highlight {
            stroke: #1565c0 !important;
            stroke-width: 3px !important;
        }
        .scene2-diameter {
            stroke: #666666;
            stroke-width: 2px;
            stroke-dasharray: 5,5;
        }
        .scene2-conclusion-box {
            fill: #f1f8e9;
            stroke: #2e7d32;
            stroke-width: 2px;
        }
        .scene2-formula-bg {
            fill: #f5f5f5;
            stroke: #cccccc;
            stroke-width: 1px;
        }
        .scene2-btn {
            padding: 8px 16px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: #1976d2;
            color: #ffffff;
        }
        .scene2-btn:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
        }
        .scene2-btn:hover:not(:disabled) {
            background: #1565c0;
        }
        .scene2-step-indicator {
            font-size: 14px;
            color: #666666;
            min-width: 80px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <!-- 圆 O -->
            <circle id="scene2-circle-o" cx="320" cy="240" r="130" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 圆心 O -->
            <circle id="scene2-point-o" cx="320" cy="240" r="3" fill="#000000"/>
            <text id="scene2-label-o" class="scene2-label" x="305" y="225">O</text>
            
            <!-- 点 A -->
            <circle id="scene2-point-a" cx="420" cy="280" r="4" fill="#000000"/>
            <text id="scene2-label-a" class="scene2-label" x="432" y="280">A</text>
            
            <!-- 点 B -->
            <circle id="scene2-point-b" cx="410" cy="150" r="4" fill="#000000"/>
            <text id="scene2-label-b" class="scene2-label" x="422" y="138">B</text>
            
            <!-- 点 C -->
            <circle id="scene2-point-c" cx="220" cy="350" r="4" fill="#000000"/>
            <text id="scene2-label-c" class="scene2-label" x="208" y="365">C</text>
            
            <!-- 弦 AB -->
            <line id="scene2-line-ab" x1="420" y1="280" x2="410" y2="150" stroke="#000000" stroke-width="2"/>
            
            <!-- 弦 BC -->
            <line id="scene2-line-bc" x1="410" y1="150" x2="220" y2="350" stroke="#000000" stroke-width="2"/>
            
            <!-- 弦 AC -->
            <line id="scene2-line-ac" x1="420" y1="280" x2="220" y2="350" stroke="#000000" stroke-width="2"/>
            
            <!-- AB=4 标注 -->
            <text id="scene2-label-ab" class="scene2-label" x="435" y="215">AB=4</text>
            
            <!-- 角 ACB 弧 -->
            <path id="scene2-angle-arc" d="M 220 325 A 25 25 0 0 1 245 340" fill="none" stroke="#000000" stroke-width="1.5"/>
            <text id="scene2-label-angle" class="scene2-label" x="250" y="340">37°</text>
            
            <!-- 直径辅助线（步骤 2 显示） -->
            <line id="scene2-diameter" class="scene2-diameter" x1="190" y1="240" x2="450" y2="240" opacity="0"/>
            <text id="scene2-label-diameter" class="scene2-label" x="320" y="220" opacity="0">2R</text>
            
            <!-- 公式区背景 -->
            <rect id="scene2-formula-bg" class="scene2-formula-bg" x="520" y="80" width="260" height="180" rx="5"/>
            
            <!-- 公式文本 -->
            <text id="scene2-formula-1" class="scene2-formula" x="540" y="110" opacity="0">正弦定理：</text>
            <text id="scene2-formula-2" class="scene2-formula" x="540" y="135" opacity="0">AB / sin∠ACB = 2R</text>
            <text id="scene2-formula-3" class="scene2-formula" x="540" y="165" opacity="0">4 / sin37° = 2R</text>
            <text id="scene2-formula-4" class="scene2-formula" x="540" y="195" opacity="0">R = 2 / sin37°</text>
            <text id="scene2-formula-5" class="scene2-formula" x="540" y="225" opacity="0">S = πR² = π(2/sin37°)²</text>
            <text id="scene2-formula-6" class="scene2-formula" x="540" y="255" opacity="0">S = 4π / sin²37°</text>
            
            <!-- 结论框（步骤 4 显示） -->
            <rect id="scene2-conclusion-box" class="scene2-conclusion-box" x="520" y="380" width="260" height="50" rx="5" opacity="0"/>
            <text id="scene2-conclusion-text" class="scene2-formula" x="650" y="405" text-anchor="middle" opacity="0" fill="#2e7d32" font-weight="bold">圆O的面积 = 4π/sin²37°</text>
            <text id="scene2-conclusion-approx" class="scene2-formula" x="650" y="425" text-anchor="middle" opacity="0" fill="#2e7d32" font-size="13px">≈ 11.05π ≈ 34.7</text>
            
            <!-- 控件栏 -->
            <g id="scene2-controls" transform="translate(0, 450)">
                <rect x="0" y="0" width="800" height="50" fill="#fafafa"/>
                <button id="scene2-btn-prev" class="scene2-btn" x="300" y="10" disabled>◀ 上一步</button>
                <text id="scene2-step-indicator" class="scene2-step-indicator" x="400" y="28" text-anchor="middle">步骤 0/4</text>
                <button id="scene2-btn-next" class="scene2-btn" x="500" y="10">下一步 ▶</button>
            </g>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 2: 正弦定理求外接圆半径
        let currentStep = 0;
        const totalSteps = 4;
        
        // 获取 DOM 元素
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        
        // 高亮元素
        const lineAB = document.getElementById('scene2-line-ab');
        const angleArc = document.getElementById('scene2-angle-arc');
        
        // 步骤 2 元素
        const diameter = document.getElementById('scene2-diameter');
        const labelDiameter = document.getElementById('scene2-label-diameter');
        
        // 公式元素
        const formula1 = document.getElementById('scene2-formula-1');
        const formula2 = document.getElementById('scene2-formula-2');
        const formula3 = document.getElementById('scene2-formula-3');
        const formula4 = document.getElementById('scene2-formula-4');
        const formula5 = document.getElementById('scene2-formula-5');
        const formula6 = document.getElementById('scene2-formula-6');
        
        // 结论元素
        const conclusionBox = document.getElementById('scene2-conclusion-box');
        const conclusionText = document.getElementById('scene2-conclusion-text');
        const conclusionApprox = document.getElementById('scene2-conclusion-approx');
        
        // 更新显示状态
        function updateDisplay() {
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep}/${totalSteps}`;
            
            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;
            
            // 重置所有高亮
            lineAB.classList.remove('scene2-highlight');
            angleArc.classList.remove('scene2-highlight');
            
            // 重置所有公式和结论的透明度
            formula1.setAttribute('opacity', '0');
            formula2.setAttribute('opacity', '0');
            formula3.setAttribute('opacity', '0');
            formula4.setAttribute('opacity', '0');
            formula5.setAttribute('opacity', '0');
            formula6.setAttribute('opacity', '0');
            conclusionBox.setAttribute('opacity', '0');
            conclusionText.setAttribute('opacity', '0');
            conclusionApprox.setAttribute('opacity', '0');
            diameter.setAttribute('opacity', '0');
            labelDiameter.setAttribute('opacity', '0');
            
            // 根据当前步骤显示相应内容
            if (currentStep >= 1) {
                // 步骤 1：高亮 AB 和角 ACB，显示公式 1-2
                lineAB.classList.add('scene2-highlight');
                angleArc.classList.add('scene2-highlight');
                formula1.setAttribute('opacity', '1');
                formula2.setAttribute('opacity', '1');
            }
            
            if (currentStep >= 2) {
                // 步骤 2：显示直径辅助线和公式 3
                diameter.setAttribute('opacity', '1');
                labelDiameter.setAttribute('opacity', '1');
                formula3.setAttribute('opacity', '1');
            }
            
            if (currentStep >= 3) {
                // 步骤 3：显示公式 4-5
                formula4.setAttribute('opacity', '1');
                formula5.setAttribute('opacity', '1');
            }
            
            if (currentStep >= 4) {
                // 步骤 4：显示公式 6 和结论
                formula6.setAttribute('opacity', '1');
                conclusionBox.setAttribute('opacity', '1');
                conclusionText.setAttribute('opacity', '1');
                conclusionApprox.setAttribute('opacity', '1');
            }
        }
        
        // 按钮事件绑定
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateDisplay();
            }
        });
        
        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
