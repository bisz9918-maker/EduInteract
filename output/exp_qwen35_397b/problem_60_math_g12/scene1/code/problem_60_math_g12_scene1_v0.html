<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆中切线性质验证 - PC·PD = PO²</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        .scene1-point {
            fill: #000000;
        }
        .scene1-point-p {
            fill: #1565c0;
            cursor: grab;
        }
        .scene1-point-p:active {
            cursor: grabbing;
        }
        .scene1-line {
            stroke: #000000;
            stroke-width: 2;
            fill: none;
        }
        .scene1-line-po {
            stroke: #1565c0;
            stroke-width: 2;
        }
        .scene1-line-pc {
            stroke: #2e7d32;
            stroke-width: 2;
        }
        .scene1-line-pd {
            stroke: #c62828;
            stroke-width: 2;
        }
        .scene1-label {
            font-size: 14px;
            fill: #000000;
            font-family: 'Times New Roman', serif;
        }
        .scene1-value-box {
            fill: #f5f5f5;
            stroke: #888888;
            stroke-width: 1;
        }
        .scene1-value-text {
            font-size: 14px;
            fill: #000000;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .scene1-hint {
            font-size: 14px;
            fill: #666666;
        }
        .scene1-equal-highlight {
            fill: #c8e6c9;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 圆 O -->
            <circle id="scene1-circle-o" cx="400" cy="280" r="100" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 直径 AB -->
            <line id="scene1-line-ab" x1="300" y1="280" x2="500" y2="280" class="scene1-line"/>
            
            <!-- 切线 AC -->
            <line id="scene1-line-ac" x1="300" y1="280" x2="300" y2="110" class="scene1-line"/>
            
            <!-- 切线 BD -->
            <line id="scene1-line-bd" x1="500" y1="280" x2="500" y2="225" class="scene1-line"/>
            
            <!-- 切线 CD (动态) -->
            <line id="scene1-line-cd" class="scene1-line"/>
            
            <!-- 线段 PO (动态) -->
            <line id="scene1-line-po" class="scene1-line-po"/>
            
            <!-- 线段 PC (动态) -->
            <line id="scene1-line-pc" class="scene1-line-pc"/>
            
            <!-- 线段 PD (动态) -->
            <line id="scene1-line-pd" class="scene1-line-pd"/>
            
            <!-- 点 A, B, O, C, D -->
            <circle id="scene1-point-a" cx="300" cy="280" r="4" class="scene1-point"/>
            <circle id="scene1-point-b" cx="500" cy="280" r="4" class="scene1-point"/>
            <circle id="scene1-point-o" cx="400" cy="280" r="4" class="scene1-point"/>
            <circle id="scene1-point-c" cx="300" cy="110" r="4" class="scene1-point"/>
            <circle id="scene1-point-d" cx="500" cy="225" r="4" class="scene1-point"/>
            
            <!-- 点 P (可拖拽) -->
            <circle id="scene1-point-p" cx="450" cy="193.4" r="6" class="scene1-point-p"/>
            
            <!-- 标签 -->
            <text id="scene1-label-a" x="285" y="300" class="scene1-label">A</text>
            <text id="scene1-label-b" x="515" y="300" class="scene1-label">B</text>
            <text id="scene1-label-o" x="400" y="295" class="scene1-label">O</text>
            <text id="scene1-label-c" x="288" y="98" class="scene1-label">C</text>
            <text id="scene1-label-d" x="512" y="213" class="scene1-label">D</text>
            <text id="scene1-label-p" x="462" y="181" class="scene1-label">P</text>
            
            <!-- 数值显示框 -->
            <rect id="scene1-value-rect1" x="100" y="430" width="180" height="50" class="scene1-value-box"/>
            <text id="scene1-value-text1" x="190" y="450" text-anchor="middle" class="scene1-value-text">PC·PD = 10000</text>
            
            <rect id="scene1-value-rect2" x="310" y="430" width="180" height="50" class="scene1-value-box"/>
            <text id="scene1-value-text2" x="400" y="450" text-anchor="middle" class="scene1-value-text">PO² = 10000</text>
            
            <!-- 拖拽提示 -->
            <text id="scene1-hint" x="520" y="455" class="scene1-hint">拖拽 P 点观察</text>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 1: 圆中切线性质验证 - PC·PD = PO²
        
        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 圆 O | circle | 圆心 (400,280), r=100 | r=100 | - | 黑色轮廓 2px |
        // | 直径 AB | 线段 | A(300,280)-B(500,280) | 200×2 | - | 水平居中 |
        // | 切线 AC | 线段 | A(300,280)-C(300,110) | 2×170 | - | 左侧垂直向上 |
        // | 切线 BD | 线段 | B(500,280)-D(500,225) | 2×55 | - | 右侧垂直向上 |
        // | 切线 CD | 线段 | C-D（动态） | 动态 | - | 过 P 点的切线 |
        // | 线段 PO | 线段 | P-O | 动态 | - | 蓝色#1565c0 |
        // | 线段 PC | 线段 | P-C | 动态 | - | 绿色#2e7d32 |
        // | 线段 PD | 线段 | P-D | 动态 | - | 红色#c62828 |
        // | 点 A | 实心圆 | (300,280) | r=4 | 左下 (-15,+20) | 黑色 |
        // | 点 B | 实心圆 | (500,280) | r=4 | 右下 (+15,+20) | 黑色 |
        // | 点 O | 实心圆 | (400,280) | r=4 | 下方 (0,+15) | 黑色 |
        // | 点 P | 实心圆 | 动态 (圆周上) | r=6 | 右上 (+12,-12) | 蓝色#1565c0，可拖拽 |
        // | 点 C | 实心圆 | (300,110) | r=4 | 左上 (-12,-12) | 黑色 |
        // | 点 D | 实心圆 | (500,225) | r=4 | 右上 (+12,-12) | 黑色 |
        
        const O = { x: 400, y: 280 };
        const A = { x: 300, y: 280 };
        const B = { x: 500, y: 280 };
        const R = 100;
        
        let currentAngle = -60 * Math.PI / 180; // 初始角度 -60°（300°）
        let isDragging = false;
        
        // DOM 元素
        const pointP = document.getElementById('scene1-point-p');
        const labelP = document.getElementById('scene1-label-p');
        const lineCD = document.getElementById('scene1-line-cd');
        const linePO = document.getElementById('scene1-line-po');
        const linePC = document.getElementById('scene1-line-pc');
        const linePD = document.getElementById('scene1-line-pd');
        const pointC = document.getElementById('scene1-point-c');
        const pointD = document.getElementById('scene1-point-d');
        const labelC = document.getElementById('scene1-label-c');
        const labelD = document.getElementById('scene1-label-d');
        const valueText1 = document.getElementById('scene1-value-text1');
        const valueText2 = document.getElementById('scene1-value-text2');
        const valueRect1 = document.getElementById('scene1-value-rect1');
        const valueRect2 = document.getElementById('scene1-value-rect2');
        const svg = document.getElementById('scene1-svg');
        
        // 计算 P 点位置
        function getPPosition(angle) {
            return {
                x: O.x + R * Math.cos(angle),
                y: O.y + R * Math.sin(angle)
            };
        }
        
        // 计算切线 CD 与 AC(x=300) 和 BD(x=500) 的交点
        // 切线方程：nx*(x-Px) + ny*(y-Py) = 0，其中 (nx, ny) = OP 向量
        function calculateCD(P) {
            const nx = P.x - O.x;
            const ny = P.y - O.y;
            
            // C 点：x = 300，代入切线方程求 y
            // nx*(300-Px) + ny*(y-Py) = 0
            // y = Py - nx*(300-Px)/ny
            let Cy, Dy;
            
            if (Math.abs(ny) < 0.001) {
                // P 在水平直径上，切线垂直，C、D 在无穷远
                // 这种情况限制拖拽角度避免
                Cy = 110;
                Dy = 225;
            } else {
                Cy = P.y - nx * (300 - P.x) / ny;
                Dy = P.y - nx * (500 - P.x) / ny;
            }
            
            return {
                C: { x: 300, y: Cy },
                D: { x: 500, y: Dy }
            };
        }
        
        // 计算两点距离
        function distance(p1, p2) {
            return Math.sqrt((p1.x - p2.x) ** 2 + (p1.y - p2.y) ** 2);
        }
        
        // 更新图示
        function update() {
            const P = getPPosition(currentAngle);
            const { C, D } = calculateCD(P);
            
            // 更新 P 点
            pointP.setAttribute('cx', P.x);
            pointP.setAttribute('cy', P.y);
            
            // 更新 P 标签位置（右上偏移）
            labelP.setAttribute('x', P.x + 12);
            labelP.setAttribute('y', P.y - 12);
            
            // 更新 C、D 点
            pointC.setAttribute('cy', C.y);
            pointD.setAttribute('cy', D.y);
            
            // 更新 C、D 标签
            labelC.setAttribute('y', C.y - 12);
            labelD.setAttribute('y', D.y - 12);
            
            // 更新切线 CD
            lineCD.setAttribute('x1', C.x);
            lineCD.setAttribute('y1', C.y);
            lineCD.setAttribute('x2', D.x);
            lineCD.setAttribute('y2', D.y);
            
            // 更新线段 PO
            linePO.setAttribute('x1', P.x);
            linePO.setAttribute('y1', P.y);
            linePO.setAttribute('x2', O.x);
            linePO.setAttribute('y2', O.y);
            
            // 更新线段 PC
            linePC.setAttribute('x1', P.x);
            linePC.setAttribute('y1', P.y);
            linePC.setAttribute('x2', C.x);
            linePC.setAttribute('y2', C.y);
            
            // 更新线段 PD
            linePD.setAttribute('x1', P.x);
            linePD.setAttribute('y1', P.y);
            linePD.setAttribute('x2', D.x);
            linePD.setAttribute('y2', D.y);
            
            // 计算数值
            const PC = distance(P, C);
            const PD = distance(P, D);
            const PO = R; // 半径恒为 100
            
            const productPCPD = PC * PD;
            const squarePO = PO * PO;
            
            // 更新数值显示
            valueText1.textContent = `PC·PD = ${productPCPD.toFixed(0)}`;
            valueText2.textContent = `PO² = ${squarePO.toFixed(0)}`;
            
            // 检查是否相等（允许±1 误差）
            if (Math.abs(productPCPD - squarePO) < 1) {
                valueRect1.classList.add('scene1-equal-highlight');
                valueRect2.classList.add('scene1-equal-highlight');
            } else {
                valueRect1.classList.remove('scene1-equal-highlight');
                valueRect2.classList.remove('scene1-equal-highlight');
            }
        }
        
        // 将屏幕坐标转换为相对于圆心的角度
        function angleFromMouse(clientX, clientY) {
            const rect = svg.getBoundingClientRect();
            const mouseX = clientX - rect.left;
            const mouseY = clientY - rect.top;
            return Math.atan2(mouseY - O.y, mouseX - O.x);
        }
        
        // 限制角度范围，避免 C、D 超出画布
        function clampAngle(angle) {
            // 限制在 30° 到 330° 之间（避开顶部极端位置）
            const minAngle = 30 * Math.PI / 180;
            const maxAngle = 330 * Math.PI / 180;
            
            // 规范化角度到 [0, 2π]
            let normalized = angle % (2 * Math.PI);
            if (normalized < 0) normalized += 2 * Math.PI;
            
            // 如果在禁止区域（330°~30°，即顶部），限制到边界
            if (normalized < minAngle) {
                return minAngle;
            } else if (normalized > maxAngle) {
                return maxAngle;
            }
            return angle;
        }
        
        // 事件处理
        pointP.addEventListener('mousedown', function(e) {
            isDragging = true;
            e.preventDefault();
        });
        
        document.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            
            let newAngle = angleFromMouse(e.clientX, e.clientY);
            newAngle = clampAngle(newAngle);
            currentAngle = newAngle;
            update();
        });
        
        document.addEventListener('mouseup', function() {
            isDragging = false;
        });
        
        // 触摸支持
        pointP.addEventListener('touchstart', function(e) {
            isDragging = true;
            e.preventDefault();
        });
        
        document.addEventListener('touchmove', function(e) {
            if (!isDragging) return;
            
            const touch = e.touches[0];
            let newAngle = angleFromMouse(touch.clientX, touch.clientY);
            newAngle = clampAngle(newAngle);
            currentAngle = newAngle;
            update();
            e.preventDefault();
        });
        
        document.addEventListener('touchend', function() {
            isDragging = false;
        });
        
        // 初始化
        update();
        
    })();
    </script>
</body>
</html>
