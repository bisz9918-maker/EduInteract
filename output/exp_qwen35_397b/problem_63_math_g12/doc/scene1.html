<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双曲线与圆的几何配置</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }
        #scene1-btn-prev, #scene1-btn-next {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 4px;
        }
        #scene1-btn-prev:hover, #scene1-btn-next:hover {
            background: #1565c0;
        }
        #scene1-btn-prev:disabled, #scene1-btn-next:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #333;
            min-width: 80px;
            text-align: center;
        }
        /* 元素显隐控制 */
        .scene1-hidden {
            opacity: 0;
            display: none;
        }
        .scene1-visible {
            opacity: 1;
            display: block;
        }
        /* 过渡动画 */
        .scene1-element {
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 坐标轴 -->
            <line id="scene1-x-axis" x1="80" y1="280" x2="720" y2="280" stroke="#000" stroke-width="2" marker-end="url(#scene1-arrow-x)"/>
            <line id="scene1-y-axis" x1="400" y1="60" x2="400" y2="420" stroke="#000" stroke-width="2" marker-end="url(#scene1-arrow-y)"/>
            
            <!-- 箭头定义 -->
            <defs>
                <marker id="scene1-arrow-x" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
                </marker>
                <marker id="scene1-arrow-y" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
                </marker>
            </defs>
            
            <!-- 双曲线左支 -->
            <path id="scene1-hyperbola-left" class="scene1-element scene1-visible" 
                  d="M 220,280 C 180,260 140,220 100,160 M 220,280 C 180,300 140,340 100,400" 
                  fill="none" stroke="#000" stroke-width="2"/>
            
            <!-- 双曲线右支 -->
            <path id="scene1-hyperbola-right" class="scene1-element scene1-visible" 
                  d="M 580,280 C 620,260 660,220 700,160 M 580,280 C 620,300 660,340 700,400" 
                  fill="none" stroke="#000" stroke-width="2"/>
            
            <!-- 圆 -->
            <circle id="scene1-circle" class="scene1-element scene1-visible" 
                    cx="400" cy="280" r="90" fill="none" stroke="#888888" stroke-width="1.5"/>
            
            <!-- 焦点 F -->
            <circle id="scene1-point-f" class="scene1-element scene1-visible" 
                    cx="560" cy="280" r="5" fill="#d32f2f"/>
            
            <!-- 点 P -->
            <circle id="scene1-point-p" class="scene1-element scene1-hidden" 
                    cx="520" cy="140" r="5" fill="#1565c0"/>
            
            <!-- 点 M -->
            <circle id="scene1-point-m" class="scene1-element scene1-hidden" 
                    cx="540" cy="210" r="5" fill="#1565c0"/>
            
            <!-- 线段 PF -->
            <line id="scene1-line-pf" class="scene1-element scene1-hidden" 
                  x1="520" y1="140" x2="560" y2="280" stroke="#1565c0" stroke-width="2"/>
            
            <!-- 线段 OM -->
            <line id="scene1-line-om" class="scene1-element scene1-hidden" 
                  x1="400" y1="280" x2="540" y2="210" stroke="#c62828" stroke-width="2"/>
            
            <!-- 直角符号 -->
            <path id="scene1-right-angle" class="scene1-element scene1-hidden" 
                  d="M 530,210 L 540,210 L 540,200" fill="none" stroke="#c62828" stroke-width="2"/>
            
            <!-- 等长标记 PM -->
            <line id="scene1-equal-pm" class="scene1-element scene1-hidden" 
                  x1="526" y1="166" x2="534" y2="174" stroke="#2e7d32" stroke-width="2"/>
            
            <!-- 等长标记 MF -->
            <line id="scene1-equal-mf" class="scene1-element scene1-hidden" 
                  x1="546" y1="246" x2="554" y2="254" stroke="#2e7d32" stroke-width="2"/>
            
            <!-- 标签 -->
            <text id="scene1-label-o" class="scene1-element scene1-visible" x="385" y="295" font-size="14" fill="#000">O</text>
            <text id="scene1-label-f" class="scene1-element scene1-visible" x="568" y="295" font-size="14" fill="#000">F</text>
            <text id="scene1-label-p" class="scene1-element scene1-hidden" x="528" y="128" font-size="14" fill="#000">P</text>
            <text id="scene1-label-m" class="scene1-element scene1-hidden" x="550" y="205" font-size="14" fill="#000">M</text>
            <text id="scene1-label-x" class="scene1-element scene1-visible" x="705" y="285" font-size="14" fill="#000">x</text>
            <text id="scene1-label-y" class="scene1-element scene1-visible" x="408" y="52" font-size="14" fill="#000">y</text>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/4</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表对照：
        // 原点 O: (400, 280), x 轴: (80,280)-(720,280), y 轴: (400,60)-(400,420)
        // 双曲线顶点: 左 (220,280), 右 (580,280)
        // 圆: 圆心 (400,280), 半径 90
        // F: (560,280), P: (520,140), M: (540,210)
        
        let currentStep = 0;
        const totalSteps = 4;
        
        // 各步骤需要显示的元素
        const stepElements = {
            0: ['scene1-x-axis', 'scene1-y-axis', 'scene1-hyperbola-left', 'scene1-hyperbola-right', 
                'scene1-circle', 'scene1-point-f', 'scene1-label-o', 'scene1-label-f', 
                'scene1-label-x', 'scene1-label-y'],
            1: ['scene1-x-axis', 'scene1-y-axis', 'scene1-hyperbola-left', 'scene1-hyperbola-right', 
                'scene1-circle', 'scene1-point-f', 'scene1-point-p', 'scene1-line-pf', 
                'scene1-label-o', 'scene1-label-f', 'scene1-label-p', 'scene1-label-x', 'scene1-label-y'],
            2: ['scene1-x-axis', 'scene1-y-axis', 'scene1-hyperbola-left', 'scene1-hyperbola-right', 
                'scene1-circle', 'scene1-point-f', 'scene1-point-p', 'scene1-point-m', 
                'scene1-line-pf', 'scene1-line-om', 'scene1-right-angle',
                'scene1-label-o', 'scene1-label-f', 'scene1-label-p', 'scene1-label-m', 
                'scene1-label-x', 'scene1-label-y'],
            3: ['scene1-x-axis', 'scene1-y-axis', 'scene1-hyperbola-left', 'scene1-hyperbola-right', 
                'scene1-circle', 'scene1-point-f', 'scene1-point-p', 'scene1-point-m', 
                'scene1-line-pf', 'scene1-line-om', 'scene1-right-angle',
                'scene1-equal-pm', 'scene1-equal-mf',
                'scene1-label-o', 'scene1-label-f', 'scene1-label-p', 'scene1-label-m', 
                'scene1-label-x', 'scene1-label-y'],
            4: ['scene1-x-axis', 'scene1-y-axis', 'scene1-hyperbola-left', 'scene1-hyperbola-right', 
                'scene1-circle', 'scene1-point-f', 'scene1-point-p', 'scene1-point-m', 
                'scene1-line-pf', 'scene1-line-om', 'scene1-right-angle',
                'scene1-equal-pm', 'scene1-equal-mf',
                'scene1-label-o', 'scene1-label-f', 'scene1-label-p', 'scene1-label-m', 
                'scene1-label-x', 'scene1-label-y']
        };
        
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene1-hidden');
                el.classList.add('scene1-visible');
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }
        
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene1-visible');
                el.classList.add('scene1-hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        function renderStep(step) {
            // 获取当前步骤需要显示的元素
            const visibleElements = stepElements[step];
            
            // 所有可能的元素 ID
            const allElements = [
                'scene1-x-axis', 'scene1-y-axis', 'scene1-hyperbola-left', 'scene1-hyperbola-right',
                'scene1-circle', 'scene1-point-f', 'scene1-point-p', 'scene1-point-m',
                'scene1-line-pf', 'scene1-line-om', 'scene1-right-angle',
                'scene1-equal-pm', 'scene1-equal-mf',
                'scene1-label-o', 'scene1-label-f', 'scene1-label-p', 'scene1-label-m',
                'scene1-label-x', 'scene1-label-y'
            ];
            
            // 更新每个元素的可见性
            allElements.forEach(id => {
                if (visibleElements.includes(id)) {
                    showElement(id);
                } else {
                    hideElement(id);
                }
            });
            
            // 更新步骤指示器
            document.getElementById('scene1-step-indicator').textContent = `步骤 ${step}/${totalSteps}`;
            
            // 更新按钮状态
            document.getElementById('scene1-btn-prev').disabled = (step === 0);
            document.getElementById('scene1-btn-next').disabled = (step === totalSteps);
        }
        
        // 按钮事件绑定
        document.getElementById('scene1-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
            }
        });
        
        document.getElementById('scene1-btn-next').addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                renderStep(currentStep);
            }
        });
        
        // 初始化
        renderStep(0);
    })();
    </script>
</body>
</html>
