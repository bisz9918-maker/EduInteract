<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直四棱柱中线线垂直关系</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 10;
        }
        .scene1-btn {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #333;
            border-radius: 4px;
            background: #f0f0f0;
        }
        .scene1-btn:hover {
            background: #e0e0e0;
        }
        .scene1-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .scene1-step-indicator {
            font-size: 14px;
            padding: 8px 12px;
            background: #e8e8e8;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 四棱柱线框 -->
            <!-- 侧棱 -->
            <line id="scene1-prism-AA1" x1="380" y1="340" x2="380" y2="200" stroke="#000" stroke-width="2" stroke-dasharray="5,5"/>
            <line id="scene1-prism-BB1" x1="300" y1="380" x2="300" y2="240" stroke="#000" stroke-width="2"/>
            <line id="scene1-prism-CC1" x1="420" y1="420" x2="420" y2="280" stroke="#000" stroke-width="2"/>
            <line id="scene1-prism-DD1" x1="500" y1="380" x2="500" y2="240" stroke="#000" stroke-width="2"/>
            
            <!-- 底边 -->
            <line id="scene1-edge-AB" x1="380" y1="340" x2="300" y2="380" stroke="#000" stroke-width="2" stroke-dasharray="5,5"/>
            <line id="scene1-edge-AD" x1="380" y1="340" x2="500" y2="380" stroke="#000" stroke-width="2" stroke-dasharray="5,5"/>
            <line id="scene1-edge-BC" x1="300" y1="380" x2="420" y2="420" stroke="#000" stroke-width="2"/>
            <line id="scene1-edge-CD" x1="420" y1="420" x2="500" y2="380" stroke="#000" stroke-width="2"/>
            
            <!-- 顶边 -->
            <line id="scene1-edge-A1B1" x1="380" y1="200" x2="300" y2="240" stroke="#000" stroke-width="2"/>
            <line id="scene1-edge-A1D1" x1="380" y1="200" x2="500" y2="240" stroke="#000" stroke-width="2"/>
            <line id="scene1-edge-B1C1" x1="300" y1="240" x2="420" y2="280" stroke="#000" stroke-width="2"/>
            <line id="scene1-edge-C1D1" x1="420" y1="280" x2="500" y2="240" stroke="#000" stroke-width="2"/>
            
            <!-- 对角线 -->
            <line id="scene1-diag-AC" x1="380" y1="340" x2="420" y2="420" stroke="#1565c0" stroke-width="2"/>
            <line id="scene1-diag-B1D1" x1="300" y1="240" x2="500" y2="240" stroke="#c62828" stroke-width="2"/>
            <line id="scene1-diag-BD" x1="300" y1="380" x2="500" y2="380" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" opacity="0"/>
            
            <!-- 平移箭头（步骤2显示） -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#888888"/>
                </marker>
            </defs>
            <line id="scene1-arrow-translate" x1="400" y1="240" x2="400" y2="380" stroke="#888888" stroke-width="2" marker-end="url(#scene1-arrowhead)" opacity="0"/>
            
            <!-- 垂直符号（步骤3显示） -->
            <path id="scene1-rect-perp" d="M 390 380 L 390 395 L 405 395" stroke="#2e7d32" stroke-width="2" fill="none" opacity="0"/>
            
            <!-- 顶点标签 -->
            <text id="scene1-label-A" x="375" y="355" font-size="14" fill="#000">A</text>
            <text id="scene1-label-B" x="285" y="395" font-size="14" fill="#000">B</text>
            <text id="scene1-label-C" x="420" y="440" font-size="14" fill="#000">C</text>
            <text id="scene1-label-D" x="510" y="395" font-size="14" fill="#000">D</text>
            <text id="scene1-label-A1" x="375" y="185" font-size="14" fill="#000">A₁</text>
            <text id="scene1-label-B1" x="285" y="225" font-size="14" fill="#000">B₁</text>
            <text id="scene1-label-C1" x="420" y="265" font-size="14" fill="#000">C₁</text>
            <text id="scene1-label-D1" x="510" y="225" font-size="14" fill="#000">D₁</text>
            
            <!-- 对角线标签 -->
            <text id="scene1-label-AC" x="395" y="395" font-size="14" fill="#1565c0">AC</text>
            <text id="scene1-label-B1D1" x="400" y="220" font-size="14" fill="#c62828">B₁D₁</text>
            <text id="scene1-label-BD" x="400" y="400" font-size="14" fill="#c62828" opacity="0">BD</text>
            
            <!-- 提示文本 -->
            <text id="scene1-hint-1" x="400" y="60" font-size="16" fill="#333" text-anchor="middle" opacity="0">顶面 A₁B₁C₁D₁ ∥ 底面 ABCD</text>
            <text id="scene1-hint-2" x="400" y="60" font-size="16" fill="#333" text-anchor="middle" opacity="0">B₁D₁ ∥ BD</text>
            <text id="scene1-hint-3" x="400" y="60" font-size="16" fill="#333" text-anchor="middle" opacity="0">若 AC⊥BD，则 AC⊥B₁D₁</text>
            
            <!-- 答案文本 -->
            <text id="scene1-answer-text" x="400" y="470" font-size="16" fill="#333" text-anchor="middle" opacity="0">AC⊥BD（或四边形 ABCD 是菱形/正方形）</text>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <span id="scene1-step-indicator" class="scene1-step-indicator">步骤 1/5</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现：直四棱柱中线线垂直关系
        
        let currentState = 0;
        const totalSteps = 5;
        
        // 获取所有需要控制的元素
        const elements = {
            // 侧棱
            AA1: document.getElementById('scene1-prism-AA1'),
            BB1: document.getElementById('scene1-prism-BB1'),
            CC1: document.getElementById('scene1-prism-CC1'),
            DD1: document.getElementById('scene1-prism-DD1'),
            // 底边
            AB: document.getElementById('scene1-edge-AB'),
            AD: document.getElementById('scene1-edge-AD'),
            BC: document.getElementById('scene1-edge-BC'),
            CD: document.getElementById('scene1-edge-CD'),
            // 顶边
            A1B1: document.getElementById('scene1-edge-A1B1'),
            A1D1: document.getElementById('scene1-edge-A1D1'),
            B1C1: document.getElementById('scene1-edge-B1C1'),
            C1D1: document.getElementById('scene1-edge-C1D1'),
            // 对角线
            AC: document.getElementById('scene1-diag-AC'),
            B1D1: document.getElementById('scene1-diag-B1D1'),
            BD: document.getElementById('scene1-diag-BD'),
            // 箭头和垂直符号
            arrow: document.getElementById('scene1-arrow-translate'),
            perpRect: document.getElementById('scene1-rect-perp'),
            // 标签
            labelBD: document.getElementById('scene1-label-BD'),
            // 提示文本
            hint1: document.getElementById('scene1-hint-1'),
            hint2: document.getElementById('scene1-hint-2'),
            hint3: document.getElementById('scene1-hint-3'),
            // 答案
            answer: document.getElementById('scene1-answer-text'),
            // 控件
            btnPrev: document.getElementById('scene1-btn-prev'),
            btnNext: document.getElementById('scene1-btn-next'),
            stepIndicator: document.getElementById('scene1-step-indicator')
        };
        
        // 显示/隐藏元素
        function show(el) {
            if (el) {
                el.style.opacity = '1';
                el.style.display = '';
            }
        }
        
        function hide(el) {
            if (el) {
                el.style.opacity = '0';
                el.style.display = '';
            }
        }
        
        // 更新场景状态
        function updateScene() {
            // 重置所有元素到默认状态
            resetAll();
            
            // 根据当前状态设置元素
            switch (currentState) {
                case 0:
                    // 初始状态：完整四棱柱，AC 和 B₁D₁ 高亮
                    break;
                    
                case 1:
                    // 步骤 1：强调顶面与底面平行
                    show(elements.hint1);
                    // 侧棱淡蓝色高亮
                    [elements.AA1, elements.BB1, elements.CC1, elements.DD1].forEach(el => {
                        if (el) el.style.stroke = '#64b5f6';
                    });
                    break;
                    
                case 2:
                    // 步骤 2：B₁D₁ 平移到 BD
                    show(elements.arrow);
                    show(elements.BD);
                    show(elements.labelBD);
                    show(elements.hint2);
                    break;
                    
                case 3:
                    // 步骤 3：聚焦底面，显示垂直符号
                    show(elements.BD);
                    show(elements.labelBD);
                    show(elements.perpRect);
                    show(elements.hint3);
                    // 淡化顶面和侧棱
                    fadeTopAndSides();
                    // 加粗 AC 和 BD
                    if (elements.AC) elements.AC.style.strokeWidth = '3';
                    if (elements.BD) elements.BD.style.strokeWidth = '3';
                    break;
                    
                case 4:
                    // 步骤 4：显示答案
                    show(elements.BD);
                    show(elements.labelBD);
                    show(elements.perpRect);
                    show(elements.hint3);
                    show(elements.answer);
                    // 淡化顶面和侧棱
                    fadeTopAndSides();
                    // 加粗 AC 和 BD
                    if (elements.AC) elements.AC.style.strokeWidth = '3';
                    if (elements.BD) elements.BD.style.strokeWidth = '3';
                    break;
            }
            
            // 更新按钮状态
            elements.btnPrev.disabled = (currentState === 0);
            elements.btnNext.disabled = (currentState === totalSteps - 1);
            elements.stepIndicator.textContent = `步骤 ${currentState + 1}/${totalSteps}`;
        }
        
        // 重置所有元素
        function resetAll() {
            // 侧棱恢复黑色
            [elements.AA1, elements.BB1, elements.CC1, elements.DD1].forEach(el => {
                if (el) {
                    el.style.stroke = '#000';
                    el.style.opacity = '1';
                }
            });
            // 顶边恢复不透明
            [elements.A1B1, elements.A1D1, elements.B1C1, elements.C1D1].forEach(el => {
                if (el) el.style.opacity = '1';
            });
            // 对角线恢复默认粗细
            if (elements.AC) elements.AC.style.strokeWidth = '2';
            if (elements.BD) elements.BD.style.strokeWidth = '2';
            // 隐藏所有提示和特殊元素
            hide(elements.arrow);
            hide(elements.perpRect);
            hide(elements.BD);
            hide(elements.labelBD);
            hide(elements.hint1);
            hide(elements.hint2);
            hide(elements.hint3);
            hide(elements.answer);
        }
        
        // 淡化顶面和侧棱
        function fadeTopAndSides() {
            [elements.AA1, elements.BB1, elements.CC1, elements.DD1].forEach(el => {
                if (el) el.style.opacity = '0.3';
            });
            [elements.A1B1, elements.A1D1, elements.B1C1, elements.C1D1].forEach(el => {
                if (el) el.style.opacity = '0.3';
            });
        }
        
        // 按钮事件绑定
        elements.btnPrev.addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                updateScene();
            }
        });
        
        elements.btnNext.addEventListener('click', function() {
            if (currentState < totalSteps - 1) {
                currentState++;
                updateScene();
            }
        });
        
        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
