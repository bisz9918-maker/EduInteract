<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>立体几何旋转问题 - 射影与垂直关系</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        #scene2-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        .scene2-btn {
            padding: 8px 16px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .scene2-btn-prev {
            background: #e0e0e0;
            color: #333;
        }
        .scene2-btn-prev:hover:not(:disabled) {
            background: #bdbdbd;
        }
        .scene2-btn-next {
            background: #1565c0;
            color: white;
        }
        .scene2-btn-next:hover:not(:disabled) {
            background: #0d47a1;
        }
        .scene2-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .scene2-step-indicator {
            font-size: 14px;
            color: #666;
            min-width: 80px;
            text-align: center;
        }
        .scene2-conclusion-box {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.95);
            border: 2px solid #1565c0;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 14px;
            color: #1565c0;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
        }
        /* 元素显隐控制 */
        .scene2-hidden {
            display: none;
            opacity: 0;
        }
        .scene2-visible {
            display: block;
            opacity: 1;
        }
        .scene2-fade-in {
            animation: scene2FadeIn 0.3s ease-in;
        }
        @keyframes scene2FadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头和标记 -->
            <defs>
                <marker id="scene2-perp-symbol" viewBox="0 0 16 16" refX="8" refY="8" markerWidth="16" markerHeight="16">
                    <path d="M4,4 L4,12 L12,12" stroke="#c62828" stroke-width="2" fill="none"/>
                </marker>
            </defs>

            <!-- 底面 BCED (半透明浅蓝填充) -->
            <polygon id="scene2-base-bced" 
                     points="200,320 400,400 550,320 350,320" 
                     fill="rgba(179,217,255,0.3)" 
                     stroke="#000000" 
                     stroke-width="2"/>

            <!-- 线段 BC (底边上沿) -->
            <line id="scene2-line-bc" x1="200" y1="320" x2="600" y2="320" stroke="#000000" stroke-width="2"/>

            <!-- 线段 CF (左侧边) -->
            <line id="scene2-line-cf" x1="400" y1="400" x2="200" y2="320" stroke="#000000" stroke-width="2"/>

            <!-- 线段 CE (右侧边) -->
            <line id="scene2-line-ce" x1="400" y1="400" x2="550" y2="320" stroke="#000000" stroke-width="2"/>

            <!-- 线段 DE (中位线) -->
            <line id="scene2-line-de" x1="350" y1="320" x2="550" y2="320" stroke="#000000" stroke-width="2"/>

            <!-- 线段 AF (中线，蓝色高亮) -->
            <line id="scene2-line-af" x1="650" y1="280" x2="400" y2="400" stroke="#1565c0" stroke-width="3"/>

            <!-- 三棱锥 A'-FED 棱线 -->
            <!-- 可见棱 A'D -->
            <line id="scene2-edge-a-d" x1="520" y1="120" x2="350" y2="320" stroke="#000000" stroke-width="2"/>
            <!-- 可见棱 A'E -->
            <line id="scene2-edge-a-e" x1="520" y1="120" x2="550" y2="320" stroke="#000000" stroke-width="2"/>
            <!-- 不可见棱 A'F (虚线) -->
            <line id="scene2-edge-a-f" x1="520" y1="120" x2="400" y2="400" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
            <!-- 不可见棱 A'G (虚线) -->
            <line id="scene2-edge-a-g" x1="520" y1="120" x2="450" y2="320" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" class="scene2-hidden"/>

            <!-- 垂线 A'H (红色，初始隐藏) -->
            <line id="scene2-altitude-a-h" x1="520" y1="120" x2="480" y2="350" stroke="#c62828" stroke-width="3" class="scene2-hidden"/>

            <!-- 垂足 H (红色圆点，初始隐藏) -->
            <circle id="scene2-point-h" cx="480" cy="350" r="4" fill="#c62828" class="scene2-hidden"/>

            <!-- 直角符号 (H 点处，初始隐藏) -->
            <g id="scene2-right-angle-h" class="scene2-hidden">
                <line x1="475" y1="350" x2="475" y2="360" stroke="#c62828" stroke-width="1.5"/>
                <line x1="475" y1="360" x2="485" y2="360" stroke="#c62828" stroke-width="1.5"/>
            </g>

            <!-- 平面 A'GF (半透明绿色，初始隐藏) -->
            <polygon id="scene2-plane-agf" 
                     points="520,120 450,320 400,400" 
                     fill="rgba(46,125,50,0.2)" 
                     stroke="#2e7d32" 
                     stroke-width="2"
                     class="scene2-hidden"/>

            <!-- 线段 A'G (绿色，初始隐藏) -->
            <line id="scene2-line-a-g" x1="520" y1="120" x2="450" y2="320" stroke="#2e7d32" stroke-width="2" class="scene2-hidden"/>

            <!-- 线段 GF (绿色，初始隐藏) -->
            <line id="scene2-line-g-f" x1="450" y1="320" x2="400" y2="400" stroke="#2e7d32" stroke-width="2" class="scene2-hidden"/>

            <!-- 垂直符号 ⊥ (红色，初始隐藏) -->
            <g id="scene2-perp-symbol-g" class="scene2-hidden" transform="translate(580,360)">
                <text x="0" y="0" font-size="20" fill="#c62828" font-weight="bold">⊥</text>
            </g>

            <!-- 垂直关系文本 (初始隐藏) -->
            <text id="scene2-perp-text" x="600" y="365" font-size="12" fill="#c62828" class="scene2-hidden">平面 A'GF⊥平面 BCED</text>

            <!-- 点标签 -->
            <text id="scene2-label-b" x="185" y="315" font-size="14" fill="#000000">B</text>
            <text id="scene2-label-c" x="400" y="420" font-size="14" fill="#000000">C</text>
            <text id="scene2-label-e" x="560" y="315" font-size="14" fill="#000000">E</text>
            <text id="scene2-label-d" x="335" y="315" font-size="14" fill="#000000">D</text>
            <text id="scene2-label-f" x="385" y="415" font-size="14" fill="#000000">F</text>
            <text id="scene2-label-g" x="450" y="340" font-size="14" fill="#000000">G</text>
            <text id="scene2-label-a" x="665" y="275" font-size="14" fill="#000000">A</text>
            <text id="scene2-label-a-prime" x="535" y="110" font-size="16" fill="#000000" font-weight="bold">A'</text>
            <text id="scene2-label-h" x="465" y="360" font-size="14" fill="#c62828" class="scene2-hidden">H</text>

            <!-- 结论文本框 -->
            <g id="scene2-conclusion" class="scene2-hidden">
                <rect x="580" y="20" width="200" y="60" fill="rgba(255,255,255,0.95)" stroke="#1565c0" stroke-width="2" rx="8"/>
                <text x="680" y="45" font-size="14" fill="#1565c0" font-weight="bold" text-anchor="middle">命题(1)(3)均正确</text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn scene2-btn-prev" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator" class="scene2-step-indicator">步骤 0/4</span>
            <button id="scene2-btn-next" class="scene2-btn scene2-btn-next">下一步 ▶</button>
        </div>

        <!-- 结论文本框 (绝对定位) -->
        <div id="scene2-conclusion-box" class="scene2-conclusion-box">
            命题(1)(3)均正确
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现：动点 A'的射影位置与平面垂直关系

        // 状态管理
        let currentState = 0;
        const totalSteps = 4;

        // 每步需要显示的元素 ID 列表
        const stepElements = {
            0: [],  // 初始状态：基础结构已显示
            1: ['scene2-altitude-a-h', 'scene2-point-h', 'scene2-right-angle-h', 'scene2-label-h'],
            2: ['scene2-plane-agf', 'scene2-line-a-g', 'scene2-line-g-f'],
            3: ['scene2-perp-symbol-g', 'scene2-perp-text'],
            4: ['scene2-conclusion', 'scene2-conclusion-box']
        };

        // 工具函数：显示元素
        function showElement(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.classList.remove('scene2-hidden');
                el.classList.add('scene2-visible', 'scene2-fade-in');
            }
        }

        // 工具函数：隐藏元素
        function hideElement(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.classList.remove('scene2-visible', 'scene2-fade-in');
                el.classList.add('scene2-hidden');
            }
        }

        // 渲染指定状态
        function renderState(step) {
            // 根据当前步骤显示/隐藏相应元素
            for (let s = 1; s <= totalSteps; s++) {
                const elements = stepElements[s];
                for (const elId of elements) {
                    if (s <= step) {
                        showElement(elId);
                    } else {
                        hideElement(elId);
                    }
                }
            }

            // 更新按钮状态
            const prevBtn = document.getElementById('scene2-btn-prev');
            const nextBtn = document.getElementById('scene2-btn-next');
            const indicator = document.getElementById('scene2-step-indicator');

            prevBtn.disabled = (step === 0);
            nextBtn.disabled = (step >= totalSteps);
            indicator.textContent = `步骤 ${step}/${totalSteps}`;
        }

        // 前进一步
        function stepForward() {
            if (currentState < totalSteps) {
                currentState++;
                renderState(currentState);
            }
        }

        // 后退一步
        function stepBackward() {
            if (currentState > 0) {
                currentState--;
                renderState(currentState);
            }
        }

        // 绑定事件
        document.getElementById('scene2-btn-prev').addEventListener('click', stepBackward);
        document.getElementById('scene2-btn-next').addEventListener('click', stepForward);

        // 初始化
        renderState(0);
    })();
    </script>
</body>
</html>
