<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>椭圆几何性质验证 - Scene 2</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 16px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; }
        .scene2-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene2-btn-prev { background: #e0e0e0; }
        #scene2-btn-next { background: #1565c0; color: white; }
        #scene2-step-indicator { font-size: 14px; color: #666; margin-left: 10px; }
        .scene2-hidden { display: none; opacity: 0; }
        .scene2-visible { display: block; opacity: 1; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 坐标轴 -->
            <line id="scene2-axis-x" x1="100" y1="250" x2="650" y2="250" stroke="#666666" stroke-width="1"/>
            <line id="scene2-axis-y" x1="350" y1="100" x2="350" y2="400" stroke="#666666" stroke-width="1"/>
            <text id="scene2-label-x" x="660" y="245" font-size="14" fill="#666">X</text>
            <text id="scene2-label-y" x="340" y="90" font-size="14" fill="#666">Y</text>
            
            <!-- 椭圆曲线 -->
            <ellipse id="scene2-ellipse" cx="350" cy="250" rx="200" ry="120" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 切线 l -->
            <line id="scene2-line-l" x1="550" y1="120" x2="550" y2="380" stroke="#000000" stroke-width="2"/>
            <text id="scene2-label-l" x="565" y="370" font-size="14" fill="#000000">l</text>
            
            <!-- 辅助线段 AP, PD, PF -->
            <line id="scene2-line-ap" x1="150" y1="250" x2="420" y2="190" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            <line id="scene2-line-pd" x1="420" y1="190" x2="550" y2="160" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            <line id="scene2-line-pf" x1="420" y1="190" x2="470" y2="250" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            
            <!-- 线段 BD -->
            <line id="scene2-line-bd" x1="550" y1="250" x2="550" y2="160" stroke="#000000" stroke-width="1"/>
            
            <!-- PM 线段（初始灰色，步骤1高亮） -->
            <line id="scene2-line-pm" x1="420" y1="190" x2="550" y2="205" stroke="#888888" stroke-width="1"/>
            
            <!-- 理论切线（步骤3显示） -->
            <line id="scene2-line-tangent" x1="380" y1="200" x2="460" y2="180" stroke="#2e7d32" stroke-width="2" stroke-dasharray="4,4" class="scene2-hidden"/>
            <text id="scene2-label-tangent" x="470" y="175" font-size="12" fill="#2e7d32" class="scene2-hidden">切线</text>
            
            <!-- 角度弧（步骤4显示） -->
            <path id="scene2-angle-fpm" d="" fill="#1565c0" opacity="0.2" stroke="#1565c0" stroke-width="2" class="scene2-hidden"/>
            <path id="scene2-angle-mpd" d="" fill="#1565c0" opacity="0.2" stroke="#1565c0" stroke-width="2" class="scene2-hidden"/>
            <text id="scene2-label-angle3" x="410" y="205" font-size="14" fill="#1565c0" class="scene2-hidden">∠3</text>
            <text id="scene2-label-angle4" x="450" y="180" font-size="14" fill="#1565c0" class="scene2-hidden">∠4</text>
            
            <!-- 放大视图（步骤2显示） -->
            <g id="scene2-zoom-group" class="scene2-hidden">
                <rect id="scene2-zoom-frame" x="620" y="320" width="160" height="100" fill="none" stroke="#cccccc" stroke-width="1"/>
                <text id="scene2-zoom-label" x="630" y="340" font-size="12" fill="#666">放大视图</text>
                <!-- 放大内容将通过 JS 动态生成 -->
            </g>
            
            <!-- 点 -->
            <circle id="scene2-point-a" cx="150" cy="250" r="4" fill="#000000"/>
            <circle id="scene2-point-b" cx="550" cy="250" r="4" fill="#000000"/>
            <circle id="scene2-point-o" cx="350" cy="250" r="3" fill="#000000"/>
            <circle id="scene2-point-f" cx="470" cy="250" r="4" fill="#000000"/>
            <circle id="scene2-point-p" cx="420" cy="190" r="5" fill="#000000" style="cursor: default;"/>
            <circle id="scene2-point-d" cx="550" cy="160" r="4" fill="#000000"/>
            <circle id="scene2-point-m" cx="550" cy="205" r="4" fill="#000000"/>
            
            <!-- 点标签 -->
            <text id="scene2-label-a" x="140" y="265" font-size="14" fill="#000000">A</text>
            <text id="scene2-label-b" x="560" y="265" font-size="14" fill="#000000">B</text>
            <text id="scene2-label-o" x="335" y="265" font-size="14" fill="#000000">O</text>
            <text id="scene2-label-f" x="480" y="265" font-size="14" fill="#000000">F</text>
            <text id="scene2-label-p" x="435" y="175" font-size="14" fill="#000000">P</text>
            <text id="scene2-label-d" x="565" y="150" font-size="14" fill="#000000">D</text>
            <text id="scene2-label-m" x="565" y="205" font-size="14" fill="#000000">M</text>
            
            <!-- 验证标记（步骤3显示） -->
            <text id="scene2-check-mark" x="480" y="190" font-size="24" fill="#2e7d32" class="scene2-hidden">✓</text>
            
            <!-- 提示文字 -->
            <text id="scene2-hint" x="400" y="480" font-size="14" fill="#333" text-anchor="middle">观察线段 PM 与椭圆的位置关系</text>
        </svg>
        
        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn">◀ 上一步</button>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
            <span id="scene2-step-indicator">步骤 1/5</span>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现
        const currentStep = { value: 0 };
        const totalSteps = 5;
        
        // 椭圆参数
        const ellipseCenter = { x: 350, y: 250 };
        const a = 200, b = 120;
        const c = Math.sqrt(a*a - b*b); // 焦距 ≈ 166
        
        // P 点参数（用角度表示）
        let pAngle = Math.PI / 4; // 初始角度
        
        // 获取元素
        const pointP = document.getElementById('scene2-point-p');
        const pointD = document.getElementById('scene2-point-d');
        const pointM = document.getElementById('scene2-point-m');
        const lineAP = document.getElementById('scene2-line-ap');
        const linePD = document.getElementById('scene2-line-pd');
        const linePF = document.getElementById('scene2-line-pf');
        const linePM = document.getElementById('scene2-line-pm');
        const lineBD = document.getElementById('scene2-line-bd');
        const lineTangent = document.getElementById('scene2-line-tangent');
        const labelTangent = document.getElementById('scene2-label-tangent');
        const angleFPM = document.getElementById('scene2-angle-fpm');
        const angleMPD = document.getElementById('scene2-angle-mpd');
        const labelAngle3 = document.getElementById('scene2-label-angle3');
        const labelAngle4 = document.getElementById('scene2-label-angle4');
        const zoomGroup = document.getElementById('scene2-zoom-group');
        const checkMark = document.getElementById('scene2-check-mark');
        const hint = document.getElementById('scene2-hint');
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        
        // 计算 P 点坐标
        function getPPoint(angle) {
            return {
                x: ellipseCenter.x + a * Math.cos(angle),
                y: ellipseCenter.y - b * Math.sin(angle)
            };
        }
        
        // 计算 D 点坐标（AP 延长线与 x=550 的交点）
        function getDPoint(p) {
            const A = { x: 150, y: 250 };
            // 直线 AP: y - 250 = (p.y - 250)/(p.x - 150) * (x - 150)
            // 当 x = 550 时
            const slope = (p.y - A.y) / (p.x - A.x);
            const dY = A.y + slope * (550 - A.x);
            return { x: 550, y: dY };
        }
        
        // 计算 M 点坐标（BD 中点）
        function getMPoint(d) {
            const B = { x: 550, y: 250 };
            return {
                x: 550,
                y: (B.y + d.y) / 2
            };
        }
        
        // 更新所有元素位置
        function updateElements() {
            const p = getPPoint(pAngle);
            const d = getDPoint(p);
            const m = getMPoint(d);
            
            // 更新点位置
            pointP.setAttribute('cx', p.x);
            pointP.setAttribute('cy', p.y);
            pointD.setAttribute('cx', d.x);
            pointD.setAttribute('cy', d.y);
            pointM.setAttribute('cx', m.x);
            pointM.setAttribute('cy', m.y);
            
            // 更新线段
            lineAP.setAttribute('x2', p.x);
            lineAP.setAttribute('y2', p.y);
            linePD.setAttribute('x1', p.x);
            linePD.setAttribute('y1', p.y);
            linePD.setAttribute('x2', d.x);
            linePD.setAttribute('y2', d.y);
            linePF.setAttribute('x1', p.x);
            linePF.setAttribute('y1', p.y);
            linePM.setAttribute('x1', p.x);
            linePM.setAttribute('y1', p.y);
            linePM.setAttribute('x2', m.x);
            linePM.setAttribute('y2', m.y);
            lineBD.setAttribute('x2', d.x);
            lineBD.setAttribute('y2', d.y);
            
            // 更新标签位置
            document.getElementById('scene2-label-p').setAttribute('x', p.x + 15);
            document.getElementById('scene2-label-p').setAttribute('y', p.y - 15);
            document.getElementById('scene2-label-d').setAttribute('x', d.x + 15);
            document.getElementById('scene2-label-d').setAttribute('y', d.y - 10);
            document.getElementById('scene2-label-m').setAttribute('x', m.x + 15);
            document.getElementById('scene2-label-m').setAttribute('y', m.y);
            
            // 更新理论切线（过 P 点的椭圆切线）
            // 椭圆上点 (x0, y0) 处切线斜率 k = -(b²x0)/(a²y0)
            const x0 = p.x - ellipseCenter.x;
            const y0 = p.y - ellipseCenter.y;
            const tangentSlope = -(b*b * x0) / (a*a * y0);
            const tangentLen = 80;
            const tangentX1 = p.x - tangentLen;
            const tangentY1 = p.y - tangentSlope * tangentLen;
            const tangentX2 = p.x + tangentLen;
            const tangentY2 = p.y + tangentSlope * tangentLen;
            lineTangent.setAttribute('x1', tangentX1);
            lineTangent.setAttribute('y1', tangentY1);
            lineTangent.setAttribute('x2', tangentX2);
            lineTangent.setAttribute('y2', tangentY2);
            labelTangent.setAttribute('x', tangentX2 + 5);
            labelTangent.setAttribute('y', tangentY2 - 5);
            
            // 更新角度弧
            updateAngleArcs(p, m, d);
            
            // 更新放大视图
            updateZoomView(p, m);
        }
        
        // 更新角度弧
        function updateAngleArcs(p, m, d) {
            const f = { x: 470, y: 250 };
            const r = 25;
            
            // 计算向量角度
            function getAngle(from, to) {
                return Math.atan2(to.y - from.y, to.x - from.x);
            }
            
            const anglePF = getAngle(p, f);
            const anglePM = getAngle(p, m);
            const anglePD = getAngle(p, d);
            
            // 绘制扇形弧
            function createArc(center, startAngle, endAngle, r) {
                const x1 = center.x + r * Math.cos(startAngle);
                const y1 = center.y + r * Math.sin(startAngle);
                const x2 = center.x + r * Math.cos(endAngle);
                const y2 = center.y + r * Math.sin(endAngle);
                return `M ${center.x} ${center.y} L ${x1} ${y1} A ${r} ${r} 0 0 1 ${x2} ${y2} Z`;
            }
            
            // ∠FPM
            const arc1 = createArc(p, anglePF, anglePM, r);
            angleFPM.setAttribute('d', arc1);
            
            // ∠MPD
            const arc2 = createArc(p, anglePM, anglePD, r);
            angleMPD.setAttribute('d', arc2);
            
            // 更新角度标签位置
            const midAngle1 = (anglePF + anglePM) / 2;
            labelAngle3.setAttribute('x', p.x + (r + 10) * Math.cos(midAngle1));
            labelAngle3.setAttribute('y', p.y + (r + 10) * Math.sin(midAngle1));
            
            const midAngle2 = (anglePM + anglePD) / 2;
            labelAngle4.setAttribute('x', p.x + (r + 10) * Math.cos(midAngle2));
            labelAngle4.setAttribute('y', p.y + (r + 10) * Math.sin(midAngle2));
        }
        
        // 更新放大视图
        function updateZoomView(p, m) {
            const zoomFrame = document.getElementById('scene2-zoom-frame');
            const zoomLabel = document.getElementById('scene2-zoom-label');
            
            // 清除旧的放大内容
            const oldContent = document.getElementById('scene2-zoom-content');
            if (oldContent) oldContent.remove();
            
            const zoomContent = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            zoomContent.setAttribute('id', 'scene2-zoom-content');
            
            // 放大视图中心
            const zoomCx = 700, zoomCy = 370;
            const scale = 3;
            
            // 计算 P 点在放大视图中的位置
            const localPx = zoomCx, localPy = zoomCy;
            
            // 绘制放大的椭圆弧段
            const arcPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            const startAngle = pAngle - 0.3;
            const endAngle = pAngle + 0.3;
            const arcR = 30;
            const x1 = localPx + arcR * scale * Math.cos(startAngle);
            const y1 = localPy - arcR * scale * Math.sin(startAngle);
            const x2 = localPx + arcR * scale * Math.cos(endAngle);
            const y2 = localPy - arcR * scale * Math.sin(endAngle);
            arcPath.setAttribute('d', `M ${localPx + arcR*scale} ${localPy} A ${arcR*scale} ${arcR*scale} 0 0 1 ${x2} ${y2}`);
            arcPath.setAttribute('fill', 'none');
            arcPath.setAttribute('stroke', '#000000');
            arcPath.setAttribute('stroke-width', '2');
            zoomContent.appendChild(arcPath);
            
            // 绘制放大的 PM 线段
            const localMx = localPx + (m.x - p.x) * scale;
            const localMy = localPy + (m.y - p.y) * scale;
            const linePMZoom = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            linePMZoom.setAttribute('x1', localPx);
            linePMZoom.setAttribute('y1', localPy);
            linePMZoom.setAttribute('x2', localMx);
            linePMZoom.setAttribute('y2', localMy);
            linePMZoom.setAttribute('stroke', '#c62828');
            linePMZoom.setAttribute('stroke-width', '3');
            zoomContent.appendChild(linePMZoom);
            
            // P 点
            const pointPZoom = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            pointPZoom.setAttribute('cx', localPx);
            pointPZoom.setAttribute('cy', localPy);
            pointPZoom.setAttribute('r', '5');
            pointPZoom.setAttribute('fill', '#000000');
            zoomContent.appendChild(pointPZoom);
            
            zoomGroup.appendChild(zoomContent);
        }
        
        // 更新步骤显示
        function updateStepDisplay() {
            stepIndicator.textContent = `步骤 ${currentStep.value + 1}/${totalSteps}`;
            btnPrev.disabled = currentStep.value === 0;
            btnNext.disabled = currentStep.value === totalSteps - 1;
            
            // 步骤 0: 初始状态
            // 步骤 1: PM 高亮
            if (currentStep.value >= 1) {
                linePM.setAttribute('stroke', '#c62828');
                linePM.setAttribute('stroke-width', '3');
                hint.textContent = '观察线段 PM 与椭圆的位置关系';
            } else {
                linePM.setAttribute('stroke', '#888888');
                linePM.setAttribute('stroke-width', '1');
            }
            
            // 步骤 2: 显示放大视图
            if (currentStep.value >= 2) {
                zoomGroup.classList.remove('scene2-hidden');
                zoomGroup.classList.add('scene2-visible');
                hint.textContent = '放大观察：PM 与椭圆在 P 点附近仅有一个公共点';
            } else {
                zoomGroup.classList.add('scene2-hidden');
                zoomGroup.classList.remove('scene2-visible');
            }
            
            // 步骤 3: 显示理论切线
            if (currentStep.value >= 3) {
                lineTangent.classList.remove('scene2-hidden');
                lineTangent.classList.add('scene2-visible');
                labelTangent.classList.remove('scene2-hidden');
                labelTangent.classList.add('scene2-visible');
                checkMark.classList.remove('scene2-hidden');
                checkMark.classList.add('scene2-visible');
                hint.textContent = 'PM 与 P 点处椭圆切线重合 → 结论②正确';
            } else {
                lineTangent.classList.add('scene2-hidden');
                lineTangent.classList.remove('scene2-visible');
                labelTangent.classList.add('scene2-hidden');
                labelTangent.classList.remove('scene2-visible');
                checkMark.classList.add('scene2-hidden');
                checkMark.classList.remove('scene2-visible');
            }
            
            // 步骤 4: 显示角度标记
            if (currentStep.value >= 4) {
                angleFPM.classList.remove('scene2-hidden');
                angleFPM.classList.add('scene2-visible');
                angleMPD.classList.remove('scene2-hidden');
                angleMPD.classList.add('scene2-visible');
                labelAngle3.classList.remove('scene2-hidden');
                labelAngle3.classList.add('scene2-visible');
                labelAngle4.classList.remove('scene2-hidden');
                labelAngle4.classList.add('scene2-visible');
                hint.textContent = '观察∠FPM(∠3)与∠MPD(∠4)的大小关系';
            } else {
                angleFPM.classList.add('scene2-hidden');
                angleFPM.classList.remove('scene2-visible');
                angleMPD.classList.add('scene2-hidden');
                angleMPD.classList.remove('scene2-visible');
                labelAngle3.classList.add('scene2-hidden');
                labelAngle3.classList.remove('scene2-visible');
                labelAngle4.classList.add('scene2-hidden');
                labelAngle4.classList.remove('scene2-visible');
            }
            
            // 步骤 5: 启用拖拽
            if (currentStep.value >= 5) {
                pointP.style.cursor = 'move';
                hint.textContent = '拖拽 P 点，观察∠3 与∠4 始终相等 → 结论③正确';
            } else {
                pointP.style.cursor = 'default';
            }
        }
        
        // 拖拽功能
        let isDragging = false;
        
        function startDrag(e) {
            if (currentStep.value < 5) return;
            isDragging = true;
            e.preventDefault();
        }
        
        function doDrag(e) {
            if (!isDragging) return;
            
            const svg = document.getElementById('scene2-svg');
            const rect = svg.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            // 计算新的角度
            const dx = mouseX - ellipseCenter.x;
            const dy = ellipseCenter.y - mouseY; // SVG y 轴向下
            let newAngle = Math.atan2(dy, dx);
            
            // 限制 P 点不在 A、B 点
            if (newAngle < 0.1) newAngle = 0.1;
            if (newAngle > Math.PI - 0.1) newAngle = Math.PI - 0.1;
            
            pAngle = newAngle;
            updateElements();
        }
        
        function endDrag() {
            isDragging = false;
        }
        
        // 事件绑定
        pointP.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', doDrag);
        document.addEventListener('mouseup', endDrag);
        
        // 触摸支持
        pointP.addEventListener('touchstart', startDrag);
        document.addEventListener('touchmove', doDrag);
        document.addEventListener('touchend', endDrag);
        
        // 按钮事件
        btnPrev.addEventListener('click', () => {
            if (currentStep.value > 0) {
                currentStep.value--;
                updateStepDisplay();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep.value < totalSteps - 1) {
                currentStep.value++;
                updateStepDisplay();
            }
        });
        
        // 初始化
        updateElements();
        updateStepDisplay();
    })();
    </script>
</body>
</html>
