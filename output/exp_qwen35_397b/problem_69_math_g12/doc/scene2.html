<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三棱柱外接球 - 球心位置与半径推导</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        #scene2-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        .scene2-btn {
            padding: 8px 16px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #scene2-btn-prev {
            background-color: #e0e0e0;
            color: #333;
        }
        #scene2-btn-prev:hover:not(:disabled) {
            background-color: #c0c0c0;
        }
        #scene2-btn-next {
            background-color: #1565c0;
            color: white;
        }
        #scene2-btn-next:hover:not(:disabled) {
            background-color: #0d47a1;
        }
        .scene2-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene2-step-indicator {
            font-size: 14px;
            color: #666;
            min-width: 80px;
            text-align: center;
        }
        /* 元素显隐控制 */
        .scene2-hidden {
            opacity: 0;
            display: none;
        }
        .scene2-visible {
            opacity: 1;
            display: block;
        }
        /* 动画过渡 */
        .scene2-fade {
            transition: opacity 0.3s ease-in-out;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 三棱柱线框 -->
            <!-- 底面三角形 A₁B₁C₁ -->
            <line id="scene2-edge-A1B1" x1="520" y1="280" x2="400" y2="280" stroke="#000000" stroke-width="2" class="scene2-visible"/>
            <line id="scene2-edge-B1C1" x1="400" y1="280" x2="400" y2="120" stroke="#000000" stroke-width="2" class="scene2-visible"/>
            <line id="scene2-edge-A1C1" x1="520" y1="280" x2="400" y2="120" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" class="scene2-hidden scene2-fade"/>
            
            <!-- 顶面三角形 ABC -->
            <line id="scene2-edge-AB" x1="520" y1="380" x2="400" y2="380" stroke="#000000" stroke-width="2" class="scene2-visible"/>
            <line id="scene2-edge-BC" x1="400" y1="380" x2="400" y2="220" stroke="#000000" stroke-width="2" class="scene2-visible"/>
            <line id="scene2-edge-AC" x1="520" y1="380" x2="400" y2="220" stroke="#000000" stroke-width="2" class="scene2-hidden scene2-fade"/>
            
            <!-- 侧棱 -->
            <line id="scene2-edge-AA1" x1="520" y1="280" x2="520" y2="380" stroke="#000000" stroke-width="2" class="scene2-visible"/>
            <line id="scene2-edge-BB1" x1="400" y1="280" x2="400" y2="380" stroke="#000000" stroke-width="2" class="scene2-visible"/>
            <line id="scene2-edge-CC1" x1="400" y1="120" x2="400" y2="220" stroke="#000000" stroke-width="2" class="scene2-visible"/>
            
            <!-- 顶点标签 -->
            <text id="scene2-label-A1" x="535" y="285" font-size="16" fill="#000000" class="scene2-visible">A₁</text>
            <text id="scene2-label-B1" x="385" y="285" font-size="16" fill="#000000" class="scene2-visible">B₁</text>
            <text id="scene2-label-C1" x="385" y="115" font-size="16" fill="#000000" class="scene2-visible">C₁</text>
            <text id="scene2-label-A" x="535" y="385" font-size="16" fill="#000000" class="scene2-visible">A</text>
            <text id="scene2-label-B" x="385" y="385" font-size="16" fill="#000000" class="scene2-visible">B</text>
            <text id="scene2-label-C" x="385" y="215" font-size="16" fill="#000000" class="scene2-visible">C</text>
            
            <!-- 底面外心 O₁ -->
            <circle id="scene2-O1" cx="460" cy="200" r="4" fill="#1565c0" class="scene2-hidden scene2-fade"/>
            <text id="scene2-label-O1" x="475" y="195" font-size="16" fill="#1565c0" class="scene2-hidden scene2-fade">O₁</text>
            
            <!-- 顶面外心 O₂ -->
            <circle id="scene2-O2" cx="460" cy="300" r="4" fill="#1565c0" class="scene2-hidden scene2-fade"/>
            <text id="scene2-label-O2" x="475" y="295" font-size="16" fill="#1565c0" class="scene2-hidden scene2-fade">O₂</text>
            
            <!-- 球心 O -->
            <circle id="scene2-O" cx="460" cy="250" r="5" fill="#1565c0" class="scene2-hidden scene2-fade"/>
            <text id="scene2-label-O" x="475" y="255" font-size="16" fill="#1565c0" class="scene2-hidden scene2-fade">O</text>
            
            <!-- 辅助线 -->
            <line id="scene2-OO1" x1="460" y1="250" x2="460" y2="200" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,5" class="scene2-hidden scene2-fade"/>
            <line id="scene2-O1A1" x1="460" y1="200" x2="520" y2="280" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,5" class="scene2-hidden scene2-fade"/>
            <line id="scene2-OA1" x1="460" y1="250" x2="520" y2="280" stroke="#c62828" stroke-width="3" class="scene2-hidden scene2-fade"/>
            
            <!-- 标注文字 -->
            <text id="scene2-label-A1C1" x="480" y="170" font-size="14" fill="#000000" class="scene2-hidden scene2-fade">A₁C₁=2√34</text>
            <text id="scene2-label-OO1" x="445" y="225" font-size="14" fill="#2e7d32" class="scene2-hidden scene2-fade">OO₁=4</text>
            <text id="scene2-label-O1A1" x="500" y="250" font-size="14" fill="#2e7d32" class="scene2-hidden scene2-fade">O₁A₁=√34</text>
            <text id="scene2-label-OA1" x="500" y="275" font-size="14" fill="#c62828" class="scene2-hidden scene2-fade">OA₁=R</text>
            
            <!-- 公式区 -->
            <g id="scene2-formula-group" class="scene2-hidden scene2-fade">
                <rect x="580" y="150" width="200" height="140" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="5"/>
                <text x="590" y="175" font-size="14" fill="#000000">在Rt△OO₁A₁中：</text>
                <text x="590" y="200" font-size="14" fill="#000000">R² = OO₁² + O₁A₁²</text>
                <text x="590" y="225" font-size="14" fill="#000000">R² = 4² + (√34)²</text>
                <text x="590" y="250" font-size="14" fill="#000000">R² = 16 + 34 = 50</text>
                <text x="590" y="275" font-size="14" fill="#000000">R = 5√2</text>
            </g>
            
            <!-- 体积公式 -->
            <g id="scene2-volume-group" class="scene2-hidden scene2-fade">
                <text x="590" y="305" font-size="14" fill="#c62828">V = (4/3)πR³</text>
                <text x="590" y="325" font-size="14" fill="#c62828">V = (4/3)π(5√2)³</text>
                <text x="590" y="345" font-size="14" fill="#c62828">V = (1000√2/3)π</text>
            </g>
            
            <!-- 外接球轮廓（半透明椭圆模拟） -->
            <ellipse id="scene2-sphere-outline" cx="460" cy="250" rx="120" ry="100" fill="none" stroke="#1565c0" stroke-width="1" opacity="0.15" class="scene2-hidden scene2-fade"/>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 0/5</span>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2: 三棱柱外接球 - 球心位置与半径推导
        
        // 状态管理
        let currentState = 0;
        const totalSteps = 5;
        
        // 每步需要显示的元素 ID 列表
        const steps = {
            0: [], // 初始状态：只显示三棱柱基本框架
            1: ['scene2-edge-A1C1', 'scene2-O1', 'scene2-label-O1', 'scene2-label-A1C1'],
            2: ['scene2-edge-AC', 'scene2-O2', 'scene2-label-O2'],
            3: ['scene2-O', 'scene2-label-O', 'scene2-OA1', 'scene2-label-OA1', 'scene2-sphere-outline'],
            4: ['scene2-OO1', 'scene2-O1A1', 'scene2-label-OO1', 'scene2-label-O1A1'],
            5: ['scene2-formula-group', 'scene2-volume-group']
        };
        
        // 显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene2-hidden');
                el.classList.add('scene2-visible');
            }
        }
        
        // 隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene2-visible');
                el.classList.add('scene2-hidden');
            }
        }
        
        // 渲染当前状态
        function render() {
            // 更新步骤指示器
            document.getElementById('scene2-step-indicator').textContent = `步骤 ${currentState}/${totalSteps}`;
            
            // 更新按钮状态
            document.getElementById('scene2-btn-prev').disabled = (currentState === 0);
            document.getElementById('scene2-btn-next').disabled = (currentState === totalSteps);
            
            // 根据当前状态显示/隐藏元素
            for (let step = 1; step <= totalSteps; step++) {
                const elements = steps[step];
                elements.forEach(id => {
                    if (step <= currentState) {
                        showElement(id);
                    } else {
                        hideElement(id);
                    }
                });
            }
        }
        
        // 上一步
        function prevStep() {
            if (currentState > 0) {
                currentState--;
                render();
            }
        }
        
        // 下一步
        function nextStep() {
            if (currentState < totalSteps) {
                currentState++;
                render();
            }
        }
        
        // 绑定事件
        document.getElementById('scene2-btn-prev').addEventListener('click', prevStep);
        document.getElementById('scene2-btn-next').addEventListener('click', nextStep);
        
        // 初始渲染
        render();
    })();
    </script>
</body>
</html>
