<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 铁球受力分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 定义箭头 marker -->
            <defs>
                <marker id="scene2-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0" />
                </marker>
                <marker id="scene2-arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#2e7d32" />
                </marker>
                <marker id="scene2-arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828" />
                </marker>
            </defs>

            <!-- 弹簧测力计标题 -->
            <text id="scene2-title-scale" x="355" y="40" font-size="14" fill="#333">弹簧测力计</text>

            <!-- 弹簧测力计外壳 -->
            <rect id="scene2-scale-body" x="370" y="50" width="60" height="110" fill="#f0f0f0" stroke="#333" stroke-width="1.5" />
            
            <!-- 测力计刻度盘 -->
            <ellipse id="scene2-scale-dial" cx="400" cy="110" rx="15" ry="30" fill="#ffffff" stroke="#333" stroke-width="1" />
            
            <!-- 刻度线 -->
            <line id="scene2-scale-tick1" x1="390" y1="85" x2="395" y2="85" stroke="#333" stroke-width="1" />
            <line id="scene2-scale-tick2" x1="390" y1="100" x2="395" y2="100" stroke="#333" stroke-width="1" />
            <line id="scene2-scale-tick3" x1="390" y1="115" x2="395" y2="115" stroke="#333" stroke-width="1" />
            <line id="scene2-scale-tick4" x1="390" y1="130" x2="395" y2="130" stroke="#333" stroke-width="1" />

            <!-- 测力计指针 -->
            <line id="scene2-scale-pointer" x1="400" y1="90" x2="400" y2="130" stroke="#c62828" stroke-width="2" />
            <circle id="scene2-scale-pointer-center" cx="400" cy="110" r="3" fill="#c62828" />

            <!-- 挂钩 -->
            <path id="scene2-scale-hook" d="M395,160 Q395,170 400,170 Q405,170 405,160" fill="none" stroke="#333" stroke-width="2" />

            <!-- 铁球（整体图） -->
            <circle id="scene2-ball-main" cx="400" cy="195" r="10" fill="#e0e0e0" stroke="#333" stroke-width="1.5" opacity="0.8" />
            <text id="scene2-ball-label" x="415" y="200" font-size="12" fill="#333">铁球</text>

            <!-- 铁球受力放大图区域 -->
            <circle id="scene2-force-ball" cx="400" cy="280" r="30" fill="#f5f5f5" stroke="#333" stroke-width="1.5" />

            <!-- 重力 G 向量 -->
            <line id="scene2-arrow-G" x1="400" y1="280" x2="400" y2="340" stroke="#1565c0" stroke-width="3" marker-end="url(#scene2-arrow-blue)" opacity="0.6" />
            <text id="scene2-label-G" x="425" y="315" font-size="14" fill="#1565c0" font-weight="bold" opacity="0.6">G</text>
            <text id="scene2-label-G-note" x="435" y="345" font-size="11" fill="#1565c0" opacity="0">重力不变</text>

            <!-- 弹簧拉力 F 拉 向量 -->
            <line id="scene2-arrow-Fpull" x1="400" y1="280" x2="400" y2="220" stroke="#2e7d32" stroke-width="3" marker-end="url(#scene2-arrow-green)" opacity="0.6" />
            <text id="scene2-label-Fpull" x="415" y="250" font-size="14" fill="#2e7d32" font-weight="bold" opacity="0.6">F拉</text>

            <!-- 电磁铁吸引力 F 吸 向量 -->
            <line id="scene2-arrow-Fattract" x1="400" y1="280" x2="400" y2="330" stroke="#c62828" stroke-width="3" marker-end="url(#scene2-arrow-red)" opacity="0.6" />
            <text id="scene2-label-Fattract" x="335" y="310" font-size="14" fill="#c62828" font-weight="bold" opacity="0.6">F吸</text>
            <text id="scene2-label-Fattract-note" x="310" y="345" font-size="11" fill="#c62828" opacity="0">磁性减弱→吸引力减小</text>

            <!-- 电磁铁上端示意 -->
            <rect id="scene2-magnet" x="360" y="350" width="80" height="50" fill="#cccccc" stroke="#333" stroke-width="1.5" />
            <text id="scene2-magnet-label" x="445" y="380" font-size="12" fill="#333">电磁铁</text>

            <!-- 平衡方程框 -->
            <rect id="scene2-equation-box" x="100" y="395" width="600" height="40" fill="#ffffff" stroke="#333" stroke-width="1" />
            <text id="scene2-equation" x="400" y="420" font-size="16" fill="#333" text-anchor="middle">F拉 = G - F吸</text>

            <!-- 结论框 -->
            <rect id="scene2-conclusion-box" x="100" y="440" width="600" height="30" fill="#e8f5e9" stroke="#333" stroke-width="1" />
            <text id="scene2-conclusion" x="400" y="460" font-size="13" fill="#333" text-anchor="middle"></text>

            <!-- 示数变小标签 -->
            <text id="scene2-label-reading" x="450" y="120" font-size="12" fill="#c62828" font-weight="bold" opacity="0">示数变小</text>

            <!-- 控件栏按钮 -->
            <rect id="scene2-btn-prev-bg" x="250" y="465" width="100" height="28" fill="#f5f5f5" stroke="#333" stroke-width="1" rx="4" />
            <text id="scene2-btn-prev-text" x="300" y="484" font-size="14" fill="#333" text-anchor="middle">◀ 上一步</text>
            
            <rect id="scene2-btn-next-bg" x="450" y="465" width="100" height="28" fill="#f5f5f5" stroke="#333" stroke-width="1" rx="4" />
            <text id="scene2-btn-next-text" x="500" y="484" font-size="14" fill="#333" text-anchor="middle">下一步 ▶</text>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 2 实现 - 铁球受力分析

        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 备注 |
        // | 弹簧测力计外壳 | 矩形 | (370,50)-(430,160) | 60×110 |
        // | 测力计刻度盘 | 椭圆 | (385,80)-(415,140) | 30×60 |
        // | 测力计指针 | 线段 | (400,90)-(400,130) | 4×40 |
        // | 挂钩 | 半圆 | (395,160)-(405,175) | 10×15 |
        // | 铁球（整体图） | 圆形 | (390,185)-(410,205) | 20×20 |
        // | 铁球（受力放大图） | 圆形 | (370,250)-(430,310) | 60×60 |
        // | 重力 G 向量 | 箭头 | (400,280)-(400,340) | 蓝色 |
        // | F 拉 向量 | 箭头 | (400,280)-(400,220) | 绿色 |
        // | F 吸 向量 | 箭头 | (400,280)-(400,330) | 红色 |
        // | 电磁铁上端 | 矩形 | (360,320)-(440,380) | 80×60 |
        // | 平衡方程框 | 矩形 | (100,390)-(700,425) | 600×35 |
        // | 结论框 | 矩形 | (100,430)-(700,460) | 600×30 |

        let currentState = 0;
        const totalSteps = 5;

        // 获取所有需要控制的元素
        const elements = {
            arrowG: document.getElementById('scene2-arrow-G'),
            labelG: document.getElementById('scene2-label-G'),
            labelGNote: document.getElementById('scene2-label-G-note'),
            arrowFpull: document.getElementById('scene2-arrow-Fpull'),
            labelFpull: document.getElementById('scene2-label-Fpull'),
            arrowFattract: document.getElementById('scene2-arrow-Fattract'),
            labelFattract: document.getElementById('scene2-label-Fattract'),
            labelFattractNote: document.getElementById('scene2-label-Fattract-note'),
            scalePointer: document.getElementById('scene2-scale-pointer'),
            labelReading: document.getElementById('scene2-label-reading'),
            equation: document.getElementById('scene2-equation'),
            equationBox: document.getElementById('scene2-equation-box'),
            conclusion: document.getElementById('scene2-conclusion'),
            conclusionBox: document.getElementById('scene2-conclusion-box'),
            btnPrevBg: document.getElementById('scene2-btn-prev-bg'),
            btnPrevText: document.getElementById('scene2-btn-prev-text'),
            btnNextBg: document.getElementById('scene2-btn-next-bg'),
            btnNextText: document.getElementById('scene2-btn-next-text')
        };

        // 辅助函数：设置元素高亮
        function setHighlight(el, isHighlight) {
            if (!el) return;
            if (isHighlight) {
                el.setAttribute('opacity', '1');
                el.setAttribute('stroke-width', '4');
            } else {
                el.setAttribute('opacity', '0.4');
                el.setAttribute('stroke-width', '3');
            }
        }

        // 辅助函数：设置文本标签可见性
        function setLabelVisible(el, visible) {
            if (!el) return;
            el.setAttribute('opacity', visible ? '1' : '0');
        }

        // 渲染当前状态
        function renderState(step) {
            // 重置所有元素
            setHighlight(elements.arrowG, false);
            setHighlight(elements.arrowFpull, false);
            setHighlight(elements.arrowFattract, false);
            setLabelVisible(elements.labelGNote, false);
            setLabelVisible(elements.labelFattractNote, false);
            setLabelVisible(elements.labelReading, false);
            elements.conclusion.textContent = '';

            // 恢复 F 吸 箭头长度
            elements.arrowFattract.setAttribute('x2', '400');
            elements.arrowFattract.setAttribute('y2', '330');

            // 恢复指针位置
            elements.scalePointer.setAttribute('x2', '400');
            elements.scalePointer.setAttribute('y2', '130');

            switch(step) {
                case 0:
                    // 初始状态：显示所有力向量，透明度适中
                    setHighlight(elements.arrowG, false);
                    setHighlight(elements.arrowFpull, false);
                    setHighlight(elements.arrowFattract, false);
                    elements.equation.textContent = 'F拉 = G - F吸';
                    break;

                case 1:
                    // 步骤 1：高亮重力 G
                    setHighlight(elements.arrowG, true);
                    setHighlight(elements.arrowFpull, false);
                    setHighlight(elements.arrowFattract, false);
                    setLabelVisible(elements.labelGNote, true);
                    elements.equation.textContent = 'F拉 = G - F吸';
                    break;

                case 2:
                    // 步骤 2：高亮 F 吸，动画缩短
                    setHighlight(elements.arrowG, false);
                    setHighlight(elements.arrowFpull, false);
                    setHighlight(elements.arrowFattract, true);
                    setLabelVisible(elements.labelFattractNote, true);
                    // 动画缩短 F 吸 箭头
                    animateArrow(elements.arrowFattract, 330, 310, 'y2');
                    elements.equation.textContent = 'F拉 = G - F吸';
                    break;

                case 3:
                    // 步骤 3：高亮 F 拉，显示推导
                    setHighlight(elements.arrowG, false);
                    setHighlight(elements.arrowFpull, true);
                    setHighlight(elements.arrowFattract, false);
                    elements.arrowFattract.setAttribute('y2', '310'); // 保持缩短状态
                    setLabelVisible(elements.labelFattractNote, true);
                    elements.equation.textContent = 'F吸 减小 → F拉 减小';
                    elements.equationBox.setAttribute('fill', '#fff3e0');
                    break;

                case 4:
                    // 步骤 4：指针上移，示数变小
                    setHighlight(elements.arrowG, false);
                    setHighlight(elements.arrowFpull, true);
                    setHighlight(elements.arrowFattract, false);
                    elements.arrowFattract.setAttribute('y2', '310');
                    setLabelVisible(elements.labelFattractNote, true);
                    setLabelVisible(elements.labelReading, true);
                    // 动画移动指针
                    animatePointer(130, 115);
                    elements.equation.textContent = 'F吸 减小 → F拉 减小';
                    elements.equationBox.setAttribute('fill', '#fff3e0');
                    elements.conclusion.textContent = '弹簧测力计示数变小';
                    break;

                case 5:
                    // 最终步骤：完整变化链
                    setHighlight(elements.arrowG, false);
                    setHighlight(elements.arrowFpull, true);
                    setHighlight(elements.arrowFattract, false);
                    elements.arrowFattract.setAttribute('y2', '310');
                    setLabelVisible(elements.labelFattractNote, true);
                    setLabelVisible(elements.labelReading, true);
                    elements.scalePointer.setAttribute('y2', '115');
                    elements.equation.textContent = 'F拉 = G - F吸';
                    elements.equationBox.setAttribute('fill', '#ffffff');
                    elements.conclusion.textContent = '滑片右移→电阻变大→电流变小→磁性减弱→F吸 减小→F拉 减小→示数变小';
                    elements.conclusionBox.setAttribute('fill', '#e8f5e9');
                    break;
            }

            // 更新按钮状态
            updateButtons();
        }

        // 动画函数：箭头长度变化
        function animateArrow(arrow, fromY, toY, duration = 400) {
            const startTime = performance.now();
            const startX = 400;
            const startY = 280;

            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3); // ease-out

                const currentY = startY + (toY - startY) * eased;
                arrow.setAttribute('x2', startX);
                arrow.setAttribute('y2', currentY);

                if (progress < 1) {
                    requestAnimationFrame(animate);
                }
            }

            requestAnimationFrame(animate);
        }

        // 动画函数：指针移动
        function animatePointer(fromY, toY, duration = 400) {
            const startTime = performance.now();

            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3); // ease-out

                const currentY = fromY + (toY - fromY) * eased;
                elements.scalePointer.setAttribute('y2', currentY);

                if (progress < 1) {
                    requestAnimationFrame(animate);
                }
            }

            requestAnimationFrame(animate);
        }

        // 更新按钮状态
        function updateButtons() {
            if (currentState === 0) {
                elements.btnPrevBg.setAttribute('fill', '#e0e0e0');
                elements.btnPrevText.setAttribute('fill', '#999');
            } else {
                elements.btnPrevBg.setAttribute('fill', '#f5f5f5');
                elements.btnPrevText.setAttribute('fill', '#333');
            }

            if (currentState >= totalSteps) {
                elements.btnNextBg.setAttribute('fill', '#e0e0e0');
                elements.btnNextText.setAttribute('fill', '#999');
            } else {
                elements.btnNextBg.setAttribute('fill', '#f5f5f5');
                elements.btnNextText.setAttribute('fill', '#333');
            }
        }

        // 按钮点击事件
        const btnPrevBg = document.getElementById('scene2-btn-prev-bg');
        const btnNextBg = document.getElementById('scene2-btn-next-bg');

        btnPrevBg.addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                renderState(currentState);
            }
        });

        btnNextBg.addEventListener('click', function() {
            if (currentState < totalSteps) {
                currentState++;
                renderState(currentState);
            }
        });

        // 初始渲染
        renderState(0);

    })();
    </script>
</body>
</html>
