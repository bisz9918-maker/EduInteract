<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四棱锥垂直关系推导</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 10;
        }
        .scene1-btn {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #333;
            border-radius: 4px;
            background: #f5f5f5;
        }
        .scene1-btn:hover {
            background: #e0e0e0;
        }
        .scene1-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .scene1-step-indicator {
            font-size: 14px;
            color: #666;
            align-self: center;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 平面 PAC 填充区域（步骤 3 显示） -->
            <polygon id="scene1-plane-pac" points="140,70 140,380 680,300" fill="#1565c0" fill-opacity="0" stroke="none"/>

            <!-- 不可见棱（虚线） -->
            <line id="scene1-edge-pa" x1="140" y1="70" x2="140" y2="380" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
            <line id="scene1-edge-pd" x1="140" y1="70" x2="340" y2="280" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
            <line id="scene1-edge-ab" x1="140" y1="380" x2="540" y2="420" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
            <line id="scene1-edge-da" x1="340" y1="280" x2="140" y2="380" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
            <line id="scene1-diag-ac" x1="140" y1="380" x2="680" y2="300" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
            <line id="scene1-diag-bd" x1="540" y1="420" x2="340" y2="280" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>

            <!-- 可见棱（实线） -->
            <line id="scene1-edge-pb" x1="140" y1="70" x2="540" y2="420" stroke="#000000" stroke-width="2"/>
            <line id="scene1-edge-pc" x1="140" y1="70" x2="680" y2="300" stroke="#000000" stroke-width="2"/>
            <line id="scene1-edge-bc" x1="540" y1="420" x2="680" y2="300" stroke="#000000" stroke-width="2"/>
            <line id="scene1-edge-cd" x1="680" y1="300" x2="340" y2="280" stroke="#000000" stroke-width="2"/>

            <!-- 垂直符号 1（PA⊥底面，步骤 1 显示） -->
            <g id="scene1-perp-symbol-1" style="opacity: 0;">
                <path d="M140,360 L140,345 L155,345" fill="none" stroke="#c62828" stroke-width="2"/>
            </g>
            <text id="scene1-perp-text-1" x="160" y="350" fill="#c62828" font-size="14" style="opacity: 0;">PA⊥底面</text>

            <!-- 垂直符号 2（AC⊥BD，步骤 2 显示） -->
            <g id="scene1-perp-symbol-2" style="opacity: 0;">
                <path d="M440,350 L440,335 L455,335" fill="none" stroke="#c62828" stroke-width="2"/>
            </g>
            <text id="scene1-perp-text-2" x="460" y="340" fill="#c62828" font-size="14" style="opacity: 0;">AC⊥BD</text>

            <!-- 结论文字（步骤 3、4 显示） -->
            <text id="scene1-conclusion-1" x="50" y="20" fill="#1565c0" font-size="14" font-weight="bold" style="opacity: 0;">BD⊥平面 PAC</text>
            <text id="scene1-conclusion-2" x="50" y="45" fill="#1565c0" font-size="14" font-weight="bold" style="opacity: 0;">BD⊥PC</text>

            <!-- 顶点标签 -->
            <text id="scene1-label-p" x="125" y="55" fill="#000000" font-size="16">P</text>
            <text id="scene1-label-a" x="125" y="395" fill="#000000" font-size="16">A</text>
            <text id="scene1-label-b" x="555" y="435" fill="#000000" font-size="16">B</text>
            <text id="scene1-label-c" x="695" y="300" fill="#000000" font-size="16">C</text>
            <text id="scene1-label-d" x="325" y="265" fill="#000000" font-size="16">D</text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <span id="scene1-step-indicator" class="scene1-step-indicator">步骤 0/4</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1: 四棱锥垂直关系推导

        let currentState = 0;
        const totalSteps = 4;

        // 获取所有需要控制的元素
        const elements = {
            planePac: document.getElementById('scene1-plane-pac'),
            edgePa: document.getElementById('scene1-edge-pa'),
            edgePc: document.getElementById('scene1-edge-pc'),
            diagBd: document.getElementById('scene1-diag-bd'),
            perpSymbol1: document.getElementById('scene1-perp-symbol-1'),
            perpText1: document.getElementById('scene1-perp-text-1'),
            perpSymbol2: document.getElementById('scene1-perp-symbol-2'),
            perpText2: document.getElementById('scene1-perp-text-2'),
            conclusion1: document.getElementById('scene1-conclusion-1'),
            conclusion2: document.getElementById('scene1-conclusion-2'),
            btnPrev: document.getElementById('scene1-btn-prev'),
            btnNext: document.getElementById('scene1-btn-next'),
            stepIndicator: document.getElementById('scene1-step-indicator')
        };

        // 显示/隐藏元素工具函数
        function show(el) {
            if (el) {
                el.style.display = '';
                el.style.opacity = '1';
            }
        }

        function hide(el) {
            if (el) {
                el.style.display = '';
                el.style.opacity = '0';
            }
        }

        // 更新场景状态
        function updateScene() {
            // 重置所有元素到初始状态
            elements.edgePa.setAttribute('stroke', '#888888');
            elements.edgePc.setAttribute('stroke', '#000000');
            elements.diagBd.setAttribute('stroke', '#888888');
            elements.planePac.setAttribute('fill-opacity', '0');

            hide(elements.perpSymbol1);
            hide(elements.perpText1);
            hide(elements.perpSymbol2);
            hide(elements.perpText2);
            hide(elements.conclusion1);
            hide(elements.conclusion2);

            // 根据当前状态应用相应的显示
            if (currentState >= 1) {
                // 步骤 1: PA⊥底面
                elements.edgePa.setAttribute('stroke', '#1565c0');
                show(elements.perpSymbol1);
                show(elements.perpText1);
            }

            if (currentState >= 2) {
                // 步骤 2: AC⊥BD
                elements.diagBd.setAttribute('stroke', '#2e7d32');
                show(elements.perpSymbol2);
                show(elements.perpText2);
            }

            if (currentState >= 3) {
                // 步骤 3: BD⊥平面 PAC
                show(elements.conclusion1);
                elements.planePac.setAttribute('fill-opacity', '0.15');
            }

            if (currentState >= 4) {
                // 步骤 4: BD⊥PC
                show(elements.conclusion2);
                elements.edgePc.setAttribute('stroke', '#1565c0');
            }

            // 更新按钮状态
            elements.btnPrev.disabled = (currentState === 0);
            elements.btnNext.disabled = (currentState === totalSteps);
            elements.stepIndicator.textContent = `步骤 ${currentState}/${totalSteps}`;
        }

        // 事件绑定
        elements.btnPrev.addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                updateScene();
            }
        });

        elements.btnNext.addEventListener('click', function() {
            if (currentState < totalSteps) {
                currentState++;
                updateScene();
            }
        });

        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
