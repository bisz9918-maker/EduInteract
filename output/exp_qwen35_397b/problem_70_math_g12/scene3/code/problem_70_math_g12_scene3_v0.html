<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四棱锥平面垂直证明</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene3-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        .scene3-btn:hover { background: #e0e0e0; }
        .scene3-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene3-step-indicator { font-size: 14px; color: #333; align-self: center; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" id="scene3-svg">
            <!-- 定义箭头和标记 -->
            <defs>
                <marker id="scene3-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#333" />
                </marker>
            </defs>

            <!-- 平面 PCD 填充 (绿色，步骤 3 显示) -->
            <polygon id="scene3-plane-pcd" points="220,80 680,300 320,300" fill="#2e7d32" fill-opacity="0" stroke="none" />

            <!-- 平面 MBD 填充 (蓝色，步骤 2 显示) -->
            <polygon id="scene3-plane-mbd" points="520,220 580,380 320,300" fill="#1565c0" fill-opacity="0" stroke="none" />

            <!-- 不可见棱 -->
            <line id="scene3-edge-ad" x1="220" y1="360" x2="320" y2="300" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,3" />
            <line id="scene3-edge-cd" x1="680" y1="300" x2="320" y2="300" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,3" />
            <line id="scene3-edge-pd" x1="220" y1="80" x2="320" y2="300" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,3" />

            <!-- 对角线 BD (绿色，步骤 1 显示) -->
            <line id="scene3-edge-bd" x1="580" y1="380" x2="320" y2="300" stroke="#2e7d32" stroke-width="2" opacity="0" />

            <!-- 可见棱 -->
            <line id="scene3-edge-pa" x1="220" y1="80" x2="220" y2="360" stroke="#000000" stroke-width="2" />
            <line id="scene3-edge-ab" x1="220" y1="360" x2="580" y2="380" stroke="#000000" stroke-width="2" />
            <line id="scene3-edge-bc" x1="580" y1="380" x2="680" y2="300" stroke="#000000" stroke-width="2" />
            <line id="scene3-edge-pb" x1="220" y1="80" x2="580" y2="380" stroke="#000000" stroke-width="2" />
            <line id="scene3-edge-pc" x1="220" y1="80" x2="680" y2="300" stroke="#1565c0" stroke-width="2" />

            <!-- 线段 BM (红色，步骤 2 显示) -->
            <line id="scene3-edge-bm" x1="580" y1="380" x2="520" y2="220" stroke="#c62828" stroke-width="2" opacity="0" />

            <!-- 线段 DM (红色，初始显示) -->
            <line id="scene3-edge-dm" x1="320" y1="300" x2="520" y2="220" stroke="#c62828" stroke-width="2" />

            <!-- 垂直符号1: DM⊥PC 在 M 点 (红色，初始显示) -->
            <g id="scene3-perp1" opacity="1">
                <line x1="505" y1="205" x2="520" y2="220" stroke="#c62828" stroke-width="1.5" />
                <line x1="520" y1="220" x2="535" y2="235" stroke="#c62828" stroke-width="1.5" />
            </g>

            <!-- 垂直符号2: BD⊥PC (绿色，步骤 1 显示) -->
            <g id="scene3-perp2" opacity="0">
                <!-- PC 与 BD 交点大约在 (450, 260) -->
                <line x1="435" y1="245" x2="450" y2="260" stroke="#2e7d32" stroke-width="1.5" />
                <line x1="450" y1="260" x2="465" y2="275" stroke="#2e7d32" stroke-width="1.5" />
            </g>

            <!-- 顶点标签 -->
            <text id="scene3-label-p" x="205" y="70" font-size="16" fill="#000000">P</text>
            <text id="scene3-label-a" x="205" y="385" font-size="16" fill="#000000">A</text>
            <text id="scene3-label-b" x="595" y="400" font-size="16" fill="#000000">B</text>
            <text id="scene3-label-c" x="695" y="305" font-size="16" fill="#000000">C</text>
            <text id="scene3-label-d" x="295" y="295" font-size="16" fill="#000000">D</text>
            <text id="scene3-label-m" x="535" y="210" font-size="16" fill="#000000">M</text>

            <!-- 提示文字 (步骤 2-3 显示) -->
            <text id="scene3-hint-step2" x="400" y="50" font-size="14" fill="#1565c0" text-anchor="middle" opacity="0">PC⊥平面 MBD</text>
            <text id="scene3-hint-step3" x="400" y="50" font-size="14" fill="#2e7d32" text-anchor="middle" opacity="0">平面 MBD⊥平面 PCD</text>

            <!-- 答案文本框 (步骤 4 显示) -->
            <g id="scene3-answer-box" opacity="0">
                <rect x="620" y="430" width="160" height="50" fill="#ffffff" stroke="#2e7d32" stroke-width="2" />
                <text x="700" y="455" font-size="14" fill="#2e7d32" text-anchor="middle">DM⊥PC</text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene3-controls">
            <button id="scene3-prev-btn" class="scene3-btn">◀ 上一步</button>
            <span id="scene3-step-indicator">步骤 1/5</span>
            <button id="scene3-next-btn" class="scene3-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 3: 结论验证—当 DM⊥PC 时平面垂直的完整证明
        // 布局坐标表:
        // P(220,80), A(220,360), B(580,380), C(680,300), D(320,300), M(520,220)

        let currentState = 0;
        const totalSteps = 5;

        const prevBtn = document.getElementById('scene3-prev-btn');
        const nextBtn = document.getElementById('scene3-next-btn');
        const stepIndicator = document.getElementById('scene3-step-indicator');

        // 元素引用
        const elements = {
            planePcd: document.getElementById('scene3-plane-pcd'),
            planeMbd: document.getElementById('scene3-plane-mbd'),
            edgeAd: document.getElementById('scene3-edge-ad'),
            edgeCd: document.getElementById('scene3-edge-cd'),
            edgePd: document.getElementById('scene3-edge-pd'),
            edgeBd: document.getElementById('scene3-edge-bd'),
            edgePa: document.getElementById('scene3-edge-pa'),
            edgeAb: document.getElementById('scene3-edge-ab'),
            edgeBc: document.getElementById('scene3-edge-bc'),
            edgePb: document.getElementById('scene3-edge-pb'),
            edgePc: document.getElementById('scene3-edge-pc'),
            edgeBm: document.getElementById('scene3-edge-bm'),
            edgeDm: document.getElementById('scene3-edge-dm'),
            perp1: document.getElementById('scene3-perp1'),
            perp2: document.getElementById('scene3-perp2'),
            hintStep2: document.getElementById('scene3-hint-step2'),
            hintStep3: document.getElementById('scene3-hint-step3'),
            answerBox: document.getElementById('scene3-answer-box')
        };

        function updateScene() {
            // 重置所有元素状态
            elements.planePcd.setAttribute('fill-opacity', '0');
            elements.planeMbd.setAttribute('fill-opacity', '0');
            elements.edgeBd.setAttribute('opacity', '0');
            elements.edgeBm.setAttribute('opacity', '0');
            elements.perp1.setAttribute('opacity', '1');
            elements.perp2.setAttribute('opacity', '0');
            elements.hintStep2.setAttribute('opacity', '0');
            elements.hintStep3.setAttribute('opacity', '0');
            elements.answerBox.setAttribute('opacity', '0');

            // 根据当前状态设置可见性
            switch (currentState) {
                case 0:
                    // 初始状态：四棱锥 + DM + DM⊥PC 垂直符号
                    break;
                case 1:
                    // 步骤 1: 显示 BD 和 BD⊥PC
                    elements.edgeBd.setAttribute('opacity', '1');
                    elements.perp2.setAttribute('opacity', '1');
                    break;
                case 2:
                    // 步骤 2: 显示平面 MBD 填充和 BM
                    elements.edgeBd.setAttribute('opacity', '1');
                    elements.perp2.setAttribute('opacity', '1');
                    elements.planeMbd.setAttribute('fill-opacity', '0.15');
                    elements.edgeBm.setAttribute('opacity', '1');
                    elements.hintStep2.setAttribute('opacity', '1');
                    break;
                case 3:
                    // 步骤 3: 显示平面 PCD 填充和垂直标记
                    elements.edgeBd.setAttribute('opacity', '1');
                    elements.perp2.setAttribute('opacity', '1');
                    elements.planeMbd.setAttribute('fill-opacity', '0.15');
                    elements.edgeBm.setAttribute('opacity', '1');
                    elements.hintStep2.setAttribute('opacity', '1');
                    elements.planePcd.setAttribute('fill-opacity', '0.15');
                    elements.hintStep3.setAttribute('opacity', '1');
                    break;
                case 4:
                    // 步骤 4: 显示答案
                    elements.edgeBd.setAttribute('opacity', '1');
                    elements.perp2.setAttribute('opacity', '1');
                    elements.planeMbd.setAttribute('fill-opacity', '0.15');
                    elements.edgeBm.setAttribute('opacity', '1');
                    elements.hintStep2.setAttribute('opacity', '1');
                    elements.planePcd.setAttribute('fill-opacity', '0.15');
                    elements.hintStep3.setAttribute('opacity', '1');
                    elements.answerBox.setAttribute('opacity', '1');
                    break;
            }

            // 更新按钮状态
            prevBtn.disabled = currentState === 0;
            nextBtn.disabled = currentState === totalSteps - 1;
            stepIndicator.textContent = `步骤 ${currentState + 1}/${totalSteps}`;
        }

        prevBtn.addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                updateScene();
            }
        });

        nextBtn.addEventListener('click', function() {
            if (currentState < totalSteps - 1) {
                currentState++;
                updateScene();
            }
        });

        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
