<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正六边形内接于圆 - 向量夹角问题</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        .scene1-btn {
            padding: 8px 20px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .scene1-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene1-btn-prev {
            background: #e0e0e0;
            color: #333;
        }
        #scene1-btn-prev:not(:disabled):hover {
            background: #c0c0c0;
        }
        #scene1-btn-next {
            background: #1565c0;
            color: #fff;
        }
        #scene1-btn-next:not(:disabled):hover {
            background: #0d47a1;
        }
        #scene1-step-desc {
            position: absolute;
            bottom: 15px;
            right: 20px;
            font-size: 13px;
            color: #555;
            max-width: 200px;
            text-align: right;
        }
        /* 元素显隐控制 */
        .scene1-hidden {
            display: none;
            opacity: 0;
        }
        .scene1-visible {
            display: block;
            opacity: 1;
        }
        /* 箭头标记 */
        .scene1-arrow {
            marker-end: url(#scene1-arrowhead);
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#1565c0" />
                </marker>
                <marker id="scene1-arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#c62828" />
                </marker>
            </defs>

            <!-- 圆 O -->
            <circle id="scene1-circle-o" cx="400" cy="250" r="150" fill="none" stroke="#000000" stroke-width="2"/>

            <!-- 正六边形 -->
            <polygon id="scene1-hexagon" points="550,250 475,120 325,120 250,250 325,380 475,380" fill="none" stroke="#000000" stroke-width="2"/>

            <!-- 半径 OA1-OA6 (蓝色箭头) -->
            <line id="scene1-radius-oa1" x1="400" y1="250" x2="550" y2="250" stroke="#1565c0" stroke-width="1.5" class="scene1-arrow" marker-end="url(#scene1-arrowhead)"/>
            <line id="scene1-radius-oa2" x1="400" y1="250" x2="475" y2="120" stroke="#1565c0" stroke-width="1.5" class="scene1-arrow" marker-end="url(#scene1-arrowhead)"/>
            <line id="scene1-radius-oa3" x1="400" y1="250" x2="325" y2="120" stroke="#1565c0" stroke-width="1.5" class="scene1-arrow" marker-end="url(#scene1-arrowhead)"/>
            <line id="scene1-radius-oa4" x1="400" y1="250" x2="250" y2="250" stroke="#1565c0" stroke-width="1.5" class="scene1-arrow" marker-end="url(#scene1-arrowhead)"/>
            <line id="scene1-radius-oa5" x1="400" y1="250" x2="325" y2="380" stroke="#1565c0" stroke-width="1.5" class="scene1-arrow" marker-end="url(#scene1-arrowhead)"/>
            <line id="scene1-radius-oa6" x1="400" y1="250" x2="475" y2="380" stroke="#1565c0" stroke-width="1.5" class="scene1-arrow" marker-end="url(#scene1-arrowhead)"/>

            <!-- 方向角扇形填充 (步骤1显示) -->
            <path id="scene1-sector-0" d="M 400,250 L 550,250 A 150,150 0 0,1 550,250 Z" fill="#1565c0" opacity="0" class="scene1-hidden"/>
            <path id="scene1-sector-60" d="M 400,250 L 550,250 A 150,150 0 0,1 475,120 Z" fill="#1565c0" opacity="0.2" class="scene1-hidden"/>
            <path id="scene1-sector-120" d="M 400,250 L 475,120 A 150,150 0 0,1 325,120 Z" fill="#1565c0" opacity="0.2" class="scene1-hidden"/>
            <path id="scene1-sector-180" d="M 400,250 L 325,120 A 150,150 0 0,1 250,250 Z" fill="#1565c0" opacity="0.2" class="scene1-hidden"/>
            <path id="scene1-sector-240" d="M 400,250 L 250,250 A 150,150 0 0,1 325,380 Z" fill="#1565c0" opacity="0.2" class="scene1-hidden"/>
            <path id="scene1-sector-300" d="M 400,250 L 325,380 A 150,150 0 0,1 475,380 Z" fill="#1565c0" opacity="0.2" class="scene1-hidden"/>

            <!-- 圆心 O -->
            <circle id="scene1-point-o" cx="400" cy="250" r="4" fill="#000000"/>

            <!-- 顶点 A1-A6 -->
            <circle id="scene1-vertex-a1" cx="550" cy="250" r="3" fill="#000000"/>
            <circle id="scene1-vertex-a2" cx="475" cy="120" r="3" fill="#000000"/>
            <circle id="scene1-vertex-a3" cx="325" cy="120" r="3" fill="#000000"/>
            <circle id="scene1-vertex-a4" cx="250" cy="250" r="3" fill="#000000"/>
            <circle id="scene1-vertex-a5" cx="325" cy="380" r="3" fill="#000000"/>
            <circle id="scene1-vertex-a6" cx="475" cy="380" r="3" fill="#000000"/>

            <!-- 顶点标签 A1-A6 -->
            <text id="scene1-label-a1" x="562" y="254" font-size="14" fill="#000000" text-anchor="start">A₁</text>
            <text id="scene1-label-a2" x="487" y="108" font-size="14" fill="#000000" text-anchor="start">A₂</text>
            <text id="scene1-label-a3" x="313" y="108" font-size="14" fill="#000000" text-anchor="end">A₃</text>
            <text id="scene1-label-a4" x="232" y="254" font-size="14" fill="#000000" text-anchor="end">A₄</text>
            <text id="scene1-label-a5" x="313" y="392" font-size="14" fill="#000000" text-anchor="end">A₅</text>
            <text id="scene1-label-a6" x="487" y="392" font-size="14" fill="#000000" text-anchor="start">A₆</text>

            <!-- 圆心标签 O -->
            <text id="scene1-label-o" x="386" y="268" font-size="14" fill="#000000" text-anchor="start">O</text>

            <!-- 方向角数值 (步骤1显示) -->
            <text id="scene1-angle-0" x="530" y="235" font-size="12" fill="#1565c0" text-anchor="middle" class="scene1-hidden">0°</text>
            <text id="scene1-angle-60" x="465" y="105" font-size="12" fill="#1565c0" text-anchor="middle" class="scene1-hidden">60°</text>
            <text id="scene1-angle-120" x="315" y="90" font-size="12" fill="#1565c0" text-anchor="middle" class="scene1-hidden">120°</text>
            <text id="scene1-angle-180" x="235" y="220" font-size="12" fill="#1565c0" text-anchor="middle" class="scene1-hidden">180°</text>
            <text id="scene1-angle-240" x="315" y="365" font-size="12" fill="#1565c0" text-anchor="middle" class="scene1-hidden">240°</text>
            <text id="scene1-angle-300" x="465" y="365" font-size="12" fill="#1565c0" text-anchor="middle" class="scene1-hidden">300°</text>

            <!-- 点 P (步骤2显示) -->
            <circle id="scene1-point-p" cx="520" cy="165" r="5" fill="#c62828" class="scene1-hidden"/>

            <!-- 向量 OP (步骤2显示) -->
            <line id="scene1-vector-op" x1="400" y1="250" x2="520" y2="165" stroke="#c62828" stroke-width="2" class="scene1-arrow scene1-hidden" marker-end="url(#scene1-arrowhead-red)"/>

            <!-- 点 P 标签 (步骤2显示) -->
            <text id="scene1-label-p" x="534" y="151" font-size="14" fill="#c62828" text-anchor="start" class="scene1-hidden">P</text>

            <!-- 方向角 φ 标签 (步骤2显示) -->
            <text id="scene1-label-phi" x="470" y="200" font-size="12" fill="#c62828" text-anchor="start" class="scene1-hidden">φ</text>

            <!-- 角度弧线 θ1, θ2 (步骤3显示) -->
            <path id="scene1-arc-theta1" d="M 440,250 A 40,40 0 0,0 518,193" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" class="scene1-hidden"/>
            <path id="scene1-arc-theta2" d="M 438,215 A 40,40 0 0,1 518,193" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" class="scene1-hidden"/>

            <!-- 夹角标签 θ1, θ2 (步骤3显示) -->
            <text id="scene1-label-theta1" x="500" y="230" font-size="12" fill="#c62828" text-anchor="start" class="scene1-hidden">θ₁</text>
            <text id="scene1-label-theta2" x="490" y="180" font-size="12" fill="#c62828" text-anchor="start" class="scene1-hidden">θ₂</text>

            <!-- 夹角表达式列表 (步骤4显示) -->
            <g id="scene1-expr-list" class="scene1-hidden">
                <text x="620" y="100" font-size="12" fill="#000000" text-anchor="start">θ₁ = |φ - 0°|</text>
                <text x="620" y="120" font-size="12" fill="#000000" text-anchor="start">θ₂ = |φ - 60°|</text>
                <text x="620" y="140" font-size="12" fill="#000000" text-anchor="start">θ₃ = |φ - 120°|</text>
                <text x="620" y="160" font-size="12" fill="#000000" text-anchor="start">θ₄ = |φ - 180°|</text>
                <text x="620" y="180" font-size="12" fill="#000000" text-anchor="start">θ₅ = |φ - 240°|</text>
                <text x="620" y="200" font-size="12" fill="#000000" text-anchor="start">θ₆ = |φ - 300°|</text>
                <text x="620" y="230" font-size="11" fill="#555555" text-anchor="start">当 φ=35° 时:</text>
                <text x="620" y="250" font-size="11" fill="#555555" text-anchor="start">35°, 25°, 85°, 145°, 205°→155°, 265°→95°</text>
                <text x="620" y="270" font-size="11" fill="#1565c0" text-anchor="start">排序后: 25°, 35°, 85°, 95°, 145°, 155°</text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>

        <!-- 步骤说明 -->
        <div id="scene1-step-desc">正六边形顶点均匀分布</div>
    </div>

    <script>
    (function() {
        // Scene 1 实现

        // 状态变量
        let currentStep = 0;
        const totalSteps = 5;

        // 每步可见元素 ID 列表
        const stepVisibility = {
            0: [
                'scene1-circle-o', 'scene1-hexagon',
                'scene1-radius-oa1', 'scene1-radius-oa2', 'scene1-radius-oa3',
                'scene1-radius-oa4', 'scene1-radius-oa5', 'scene1-radius-oa6',
                'scene1-point-o',
                'scene1-vertex-a1', 'scene1-vertex-a2', 'scene1-vertex-a3',
                'scene1-vertex-a4', 'scene1-vertex-a5', 'scene1-vertex-a6',
                'scene1-label-a1', 'scene1-label-a2', 'scene1-label-a3',
                'scene1-label-a4', 'scene1-label-a5', 'scene1-label-a6',
                'scene1-label-o'
            ],
            1: [
                'scene1-circle-o', 'scene1-hexagon',
                'scene1-radius-oa1', 'scene1-radius-oa2', 'scene1-radius-oa3',
                'scene1-radius-oa4', 'scene1-radius-oa5', 'scene1-radius-oa6',
                'scene1-sector-60', 'scene1-sector-120', 'scene1-sector-180',
                'scene1-sector-240', 'scene1-sector-300',
                'scene1-point-o',
                'scene1-vertex-a1', 'scene1-vertex-a2', 'scene1-vertex-a3',
                'scene1-vertex-a4', 'scene1-vertex-a5', 'scene1-vertex-a6',
                'scene1-label-a1', 'scene1-label-a2', 'scene1-label-a3',
                'scene1-label-a4', 'scene1-label-a5', 'scene1-label-a6',
                'scene1-label-o',
                'scene1-angle-0', 'scene1-angle-60', 'scene1-angle-120',
                'scene1-angle-180', 'scene1-angle-240', 'scene1-angle-300'
            ],
            2: [
                'scene1-circle-o', 'scene1-hexagon',
                'scene1-radius-oa1', 'scene1-radius-oa2', 'scene1-radius-oa3',
                'scene1-radius-oa4', 'scene1-radius-oa5', 'scene1-radius-oa6',
                'scene1-sector-60', 'scene1-sector-120', 'scene1-sector-180',
                'scene1-sector-240', 'scene1-sector-300',
                'scene1-point-o',
                'scene1-vertex-a1', 'scene1-vertex-a2', 'scene1-vertex-a3',
                'scene1-vertex-a4', 'scene1-vertex-a5', 'scene1-vertex-a6',
                'scene1-label-a1', 'scene1-label-a2', 'scene1-label-a3',
                'scene1-label-a4', 'scene1-label-a5', 'scene1-label-a6',
                'scene1-label-o',
                'scene1-angle-0', 'scene1-angle-60', 'scene1-angle-120',
                'scene1-angle-180', 'scene1-angle-240', 'scene1-angle-300',
                'scene1-point-p', 'scene1-vector-op', 'scene1-label-p', 'scene1-label-phi'
            ],
            3: [
                'scene1-circle-o', 'scene1-hexagon',
                'scene1-radius-oa1', 'scene1-radius-oa2', 'scene1-radius-oa3',
                'scene1-radius-oa4', 'scene1-radius-oa5', 'scene1-radius-oa6',
                'scene1-sector-60', 'scene1-sector-120', 'scene1-sector-180',
                'scene1-sector-240', 'scene1-sector-300',
                'scene1-point-o',
                'scene1-vertex-a1', 'scene1-vertex-a2', 'scene1-vertex-a3',
                'scene1-vertex-a4', 'scene1-vertex-a5', 'scene1-vertex-a6',
                'scene1-label-a1', 'scene1-label-a2', 'scene1-label-a3',
                'scene1-label-a4', 'scene1-label-a5', 'scene1-label-a6',
                'scene1-label-o',
                'scene1-angle-0', 'scene1-angle-60', 'scene1-angle-120',
                'scene1-angle-180', 'scene1-angle-240', 'scene1-angle-300',
                'scene1-point-p', 'scene1-vector-op', 'scene1-label-p', 'scene1-label-phi',
                'scene1-arc-theta1', 'scene1-arc-theta2', 'scene1-label-theta1', 'scene1-label-theta2'
            ],
            4: [
                'scene1-circle-o', 'scene1-hexagon',
                'scene1-radius-oa1', 'scene1-radius-oa2', 'scene1-radius-oa3',
                'scene1-radius-oa4', 'scene1-radius-oa5', 'scene1-radius-oa6',
                'scene1-sector-60', 'scene1-sector-120', 'scene1-sector-180',
                'scene1-sector-240', 'scene1-sector-300',
                'scene1-point-o',
                'scene1-vertex-a1', 'scene1-vertex-a2', 'scene1-vertex-a3',
                'scene1-vertex-a4', 'scene1-vertex-a5', 'scene1-vertex-a6',
                'scene1-label-a1', 'scene1-label-a2', 'scene1-label-a3',
                'scene1-label-a4', 'scene1-label-a5', 'scene1-label-a6',
                'scene1-label-o',
                'scene1-angle-0', 'scene1-angle-60', 'scene1-angle-120',
                'scene1-angle-180', 'scene1-angle-240', 'scene1-angle-300',
                'scene1-point-p', 'scene1-vector-op', 'scene1-label-p', 'scene1-label-phi',
                'scene1-arc-theta1', 'scene1-arc-theta2', 'scene1-label-theta1', 'scene1-label-theta2',
                'scene1-expr-list'
            ]
        };

        // 步骤说明文字
        const stepDescriptions = [
            '正六边形顶点均匀分布',
            '各顶点方向角：0°, 60°, 120°, 180°, 240°, 300°',
            '点 P 在圆上，OP 与 x 轴夹角为 φ',
            'θᵢ 表示向量 OP 与 OAᵢ 的夹角',
            '6 个夹角表达式及排序后的等差数列'
        ];

        // 获取元素
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepDesc = document.getElementById('scene1-step-desc');

        // 显示/隐藏元素工具函数
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene1-hidden');
                el.classList.add('scene1-visible');
                if (el.tagName === 'text' || el.tagName === 'circle' || el.tagName === 'line' || el.tagName === 'path' || el.tagName === 'polygon') {
                    el.style.display = '';
                    el.style.opacity = '1';
                } else {
                    el.style.display = 'block';
                    el.style.opacity = '1';
                }
            }
        }

        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene1-visible');
                el.classList.add('scene1-hidden');
                if (el.tagName === 'text' || el.tagName === 'circle' || el.tagName === 'line' || el.tagName === 'path' || el.tagName === 'polygon') {
                    el.style.display = 'none';
                    el.style.opacity = '0';
                } else {
                    el.style.display = 'none';
                    el.style.opacity = '0';
                }
            }
        }

        // 更新可见元素
        function updateVisibility() {
            // 获取所有可能的元素 ID
            const allIds = new Set();
            for (let step in stepVisibility) {
                stepVisibility[step].forEach(id => allIds.add(id));
            }
            allIds.add('scene1-expr-list');

            // 获取当前步骤可见的 ID 列表
            const visibleIds = new Set(stepVisibility[currentStep]);

            // 更新每个元素
            allIds.forEach(id => {
                if (visibleIds.has(id)) {
                    showElement(id);
                } else {
                    hideElement(id);
                }
            });

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);

            // 更新步骤说明
            stepDesc.textContent = stepDescriptions[currentStep];
        }

        // 下一步
        function stepForward() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateVisibility();
            }
        }

        // 上一步
        function stepBackward() {
            if (currentStep > 0) {
                currentStep--;
                updateVisibility();
            }
        }

        // 绑定事件
        btnPrev.addEventListener('click', stepBackward);
        btnNext.addEventListener('click', stepForward);

        // 初始化
        updateVisibility();
    })();
    </script>
</body>
</html>
