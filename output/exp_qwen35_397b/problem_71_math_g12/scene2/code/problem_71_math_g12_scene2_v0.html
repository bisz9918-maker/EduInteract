<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正六边形内接圆 - 夹角等差数列</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        .scene2-label {
            font-size: 13px;
            fill: #333;
        }
        .scene2-vertex-label {
            font-size: 15px;
            font-weight: bold;
            fill: #333;
        }
        .scene2-radius {
            stroke: #1565c0;
            stroke-width: 1.5;
            fill: none;
        }
        .scene2-hexagon {
            stroke: #1565c0;
            stroke-width: 2;
            fill: none;
        }
        .scene2-circle {
            stroke: #333;
            stroke-width: 1.5;
            fill: none;
        }
        .scene2-point {
            fill: #c62828;
        }
        .scene2-line-op {
            stroke: #c62828;
            stroke-width: 2;
        }
        .scene2-angle-arc {
            fill: none;
            stroke-width: 1;
        }
        .scene2-panel-bg {
            fill: #f5f5f5;
            stroke: none;
        }
        .scene2-panel-title {
            font-size: 15px;
            font-weight: bold;
            fill: #333;
        }
        .scene2-panel-value {
            font-size: 13px;
            fill: #333;
        }
        .scene2-isosceles-highlight {
            fill: #2e7d32;
            font-weight: bold;
        }
        .scene2-slider-track {
            stroke: #888;
            stroke-width: 4;
        }
        .scene2-slider-label {
            font-size: 13px;
            fill: #666;
        }
        .scene2-slider-current {
            font-size: 15px;
            font-weight: bold;
            fill: #c62828;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <!-- 圆 O -->
            <circle id="scene2-circle-o" class="scene2-circle" cx="200" cy="200" r="120"/>
            
            <!-- 正六边形 -->
            <polygon id="scene2-hexagon" class="scene2-hexagon" points="320,200 260,96.08 140,96.08 80,200 140,303.92 260,303.92"/>
            
            <!-- 半径 OA1-OA6 -->
            <line id="scene2-radius-1" class="scene2-radius" x1="200" y1="200" x2="320" y2="200"/>
            <line id="scene2-radius-2" class="scene2-radius" x1="200" y1="200" x2="260" y2="96.08"/>
            <line id="scene2-radius-3" class="scene2-radius" x1="200" y1="200" x2="140" y2="96.08"/>
            <line id="scene2-radius-4" class="scene2-radius" x1="200" y1="200" x2="80" y2="200"/>
            <line id="scene2-radius-5" class="scene2-radius" x1="200" y1="200" x2="140" y2="303.92"/>
            <line id="scene2-radius-6" class="scene2-radius" x1="200" y1="200" x2="260" y2="303.92"/>
            
            <!-- 点 P 和半径 OP -->
            <line id="scene2-line-op" class="scene2-line-op" x1="200" y1="200" x2="200" y2="200"/>
            <circle id="scene2-point-p" class="scene2-point" cx="200" cy="200" r="6"/>
            
            <!-- 顶点标签 - 向外偏移避免与圆重叠 -->
            <!-- O 标签放在圆心正上方，避免与水平线重叠 -->
            <text id="scene2-label-o" class="scene2-label" x="200" y="182" text-anchor="middle">O</text>
            <text id="scene2-label-a1" class="scene2-vertex-label" x="335" y="200">A₁</text>
            <text id="scene2-label-a2" class="scene2-vertex-label" x="275" y="75">A₂</text>
            <text id="scene2-label-a3" class="scene2-vertex-label" x="125" y="75">A₃</text>
            <text id="scene2-label-a4" class="scene2-vertex-label" x="65" y="200">A₄</text>
            <text id="scene2-label-a5" class="scene2-vertex-label" x="125" y="335">A₅</text>
            <text id="scene2-label-a6" class="scene2-vertex-label" x="275" y="335">A₆</text>
            
            <!-- 数值面板背景 -->
            <rect id="scene2-panel-bg" class="scene2-panel-bg" x="440" y="40" width="340" height="350" rx="8"/>
            
            <!-- 面板标题 -->
            <text id="scene2-panel-title1" class="scene2-panel-title" x="455" y="68">夹角值</text>
            
            <!-- 夹角值显示 - 行间距 28px -->
            <text id="scene2-theta1-val" class="scene2-panel-value" x="455" y="98">θ₁ = --°</text>
            <text id="scene2-theta2-val" class="scene2-panel-value" x="455" y="126">θ₂ = --°</text>
            <text id="scene2-theta3-val" class="scene2-panel-value" x="455" y="154">θ₃ = --°</text>
            <text id="scene2-theta4-val" class="scene2-panel-value" x="455" y="182">θ₄ = --°</text>
            <text id="scene2-theta5-val" class="scene2-panel-value" x="455" y="210">θ₅ = --°</text>
            <text id="scene2-theta6-val" class="scene2-panel-value" x="455" y="238">θ₆ = --°</text>
            
            <!-- 分隔线 -->
            <line id="scene2-separator" x1="440" y1="260" x2="780" y2="260" stroke="#ccc" stroke-width="1"/>
            
            <!-- 排序标题 -->
            <text id="scene2-panel-title2" class="scene2-panel-title" x="455" y="288">排序后</text>
            
            <!-- 排序数列显示 -->
            <text id="scene2-sorted-values" class="scene2-panel-value" x="455" y="316">--, --, --, --, --, --</text>
            
            <!-- 公差显示 -->
            <text id="scene2-common-diff" class="scene2-panel-value" x="455" y="344">公差 d = --°</text>
            
            <!-- 等差提示 - 增加间距到 15px -->
            <text id="scene2-isosceles-msg" class="scene2-isosceles-highlight" x="455" y="380" style="opacity: 0;">等差数列成立！</text>
            
            <!-- 滑块轨道 - y=445 -->
            <line id="scene2-slider-track" class="scene2-slider-track" x1="100" y1="445" x2="700" y2="445"/>
            
            <!-- 滑块手柄 -->
            <circle id="scene2-slider-handle" class="scene2-point" cx="100" cy="445" r="12" style="cursor: pointer;"/>
            
            <!-- 滑块标签 - 调整位置避免裁切 -->
            <text id="scene2-slider-label-0" class="scene2-slider-label" x="100" y="475" text-anchor="middle">0°</text>
            <text id="scene2-slider-label-60" class="scene2-slider-label" x="700" y="475" text-anchor="middle">60°</text>
            <text id="scene2-slider-current" class="scene2-slider-current" x="400" y="420" text-anchor="middle">φ = 15°</text>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现 - 正六边形夹角等差数列
        
        // 布局坐标表（实现对照依据）：
        // | 元素 | 位置/范围 | 备注 |
        // |------|-----------|------|
        // | 圆 O | 圆心 (200,200), r=120 | 左侧几何区中心 |
        // | 正六边形 | 6 顶点在圆上 | A₁(320,200) 起始 |
        // | A₁ 点 | (320,200) | 0°方向 |
        // | A₂ 点 | (260,96) | 60°方向 |
        // | A₃ 点 | (140,96) | 120°方向 |
        // | A₄ 点 | (80,200) | 180°方向 |
        // | A₅ 点 | (140,304) | 240°方向 |
        // | A₆ 点 | (260,304) | 300°方向 |
        // | 数值面板 | (440,40)-(780,390) | 显示夹角值和排序 |
        // | 滑块 | (100,445)-(700,445) | 0°-60°范围 |
        
        const R = 120; // 圆半径
        const CX = 200, CY = 200; // 圆心坐标
        
        // 六边形顶点角度（度）- A1 在 0°，逆时针
        const vertexAngles = [0, 60, 120, 180, 240, 300];
        
        // 当前 φ 值（点 P 相对于 OA1 的角度）
        let phi = 15;
        
        // DOM 元素
        const pointP = document.getElementById('scene2-point-p');
        const lineOP = document.getElementById('scene2-line-op');
        const sliderHandle = document.getElementById('scene2-slider-handle');
        const sliderCurrent = document.getElementById('scene2-slider-current');
        const isoscelesMsg = document.getElementById('scene2-isosceles-msg');
        
        // 夹角值显示元素
        const thetaVals = [
            document.getElementById('scene2-theta1-val'),
            document.getElementById('scene2-theta2-val'),
            document.getElementById('scene2-theta3-val'),
            document.getElementById('scene2-theta4-val'),
            document.getElementById('scene2-theta5-val'),
            document.getElementById('scene2-theta6-val')
        ];
        const sortedValuesEl = document.getElementById('scene2-sorted-values');
        const commonDiffEl = document.getElementById('scene2-common-diff');
        
        // 计算点 P 坐标
        function getPointP(phiDeg) {
            const phiRad = phiDeg * Math.PI / 180;
            // 注意：SVG 坐标系 y 轴向下，所以 sin 要取反
            return {
                x: CX + R * Math.cos(phiRad),
                y: CY - R * Math.sin(phiRad)
            };
        }
        
        // 计算夹角 θᵢ（OP 与 OAᵢ 的夹角，0-180°）
        function calcTheta(phiDeg, vertexAngleDeg) {
            let diff = Math.abs(phiDeg - vertexAngleDeg);
            if (diff > 180) {
                diff = 360 - diff;
            }
            return diff;
        }
        
        // 计算所有 6 个夹角
        function calcAllThetas(phiDeg) {
            return vertexAngles.map(angle => calcTheta(phiDeg, angle));
        }
        
        // 检查是否为等差数列
        function checkArithmetic(sorted) {
            if (sorted.length < 3) return { isArithmetic: false, diff: 0 };
            const diff = sorted[1] - sorted[0];
            for (let i = 2; i < sorted.length; i++) {
                if (Math.abs(sorted[i] - sorted[i-1] - diff) > 0.01) {
                    return { isArithmetic: false, diff: 0 };
                }
            }
            return { isArithmetic: true, diff: diff };
        }
        
        // 更新显示
        function updateDisplay() {
            // 更新点 P 位置
            const p = getPointP(phi);
            pointP.setAttribute('cx', p.x);
            pointP.setAttribute('cy', p.y);
            lineOP.setAttribute('x2', p.x);
            lineOP.setAttribute('y2', p.y);
            
            // 更新滑块手柄位置
            const sliderX = 100 + (600 * phi / 60);
            sliderHandle.setAttribute('cx', sliderX);
            
            // 更新滑块当前值显示
            sliderCurrent.textContent = `φ = ${phi.toFixed(1)}°`;
            
            // 计算并显示夹角值
            const thetas = calcAllThetas(phi);
            thetaVals.forEach((el, i) => {
                el.textContent = `θ${i+1} = ${thetas[i].toFixed(1)}°`;
            });
            
            // 排序并显示
            const sorted = [...thetas].sort((a, b) => a - b);
            sortedValuesEl.textContent = sorted.map(t => t.toFixed(1)).join(', ');
            
            // 检查等差数列
            const result = checkArithmetic(sorted);
            if (result.isArithmetic) {
                commonDiffEl.textContent = `公差 d = ${result.diff.toFixed(1)}°`;
                isoscelesMsg.style.opacity = '1';
            } else {
                commonDiffEl.textContent = '公差 d = --°';
                isoscelesMsg.style.opacity = '0';
            }
        }
        
        // 拖拽交互
        let isDragging = false;
        
        function startDrag(e) {
            isDragging = true;
            e.preventDefault();
        }
        
        function doDrag(e) {
            if (!isDragging) return;
            
            const rect = document.getElementById('scene2-slider-track').getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let x = clientX - rect.left;
            
            // 限制在轨道范围内
            x = Math.max(0, Math.min(600, x));
            
            // 计算 φ 值
            phi = (x / 600) * 60;
            
            updateDisplay();
        }
        
        function endDrag() {
            isDragging = false;
        }
        
        // 事件监听
        sliderHandle.addEventListener('mousedown', startDrag);
        sliderHandle.addEventListener('touchstart', startDrag);
        
        document.addEventListener('mousemove', doDrag);
        document.addEventListener('touchmove', doDrag);
        
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchend', endDrag);
        
        // 初始化显示
        updateDisplay();
        
    })();
    </script>
</body>
</html>
