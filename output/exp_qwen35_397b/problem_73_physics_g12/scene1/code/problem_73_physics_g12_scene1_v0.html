<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U 形框架导体棒受力分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 20px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        .scene1-btn:hover { background: #e0e0e0; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-step-indicator { font-size: 14px; color: #333; padding: 8px 16px; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#000000" />
                </marker>
                <marker id="scene1-arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#c62828" />
                </marker>
                <marker id="scene1-arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#1565c0" />
                </marker>
                <marker id="scene1-arrowhead-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#ff9800" />
                </marker>
            </defs>

            <!-- 步骤 0: 基础装置 -->
            <g id="scene1-step0">
                <!-- 水平参考虚线 -->
                <line id="scene1-horz-dash" x1="80" y1="320" x2="280" y2="320" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" />
                
                <!-- U 形导轨 -->
                <line id="scene1-rail-left" x1="100" y1="280" x2="350" y2="135" stroke="#000000" stroke-width="3" />
                <line id="scene1-rail-right" x1="130" y1="297" x2="380" y2="152" stroke="#000000" stroke-width="3" />
                <line id="scene1-rail-bottom" x1="100" y1="280" x2="130" y2="297" stroke="#000000" stroke-width="3" />
                
                <!-- 导体棒 MN -->
                <rect id="scene1-rod-mn" x="175" y="205" width="130" height="14" fill="#1565c0" stroke="#1565c0" stroke-width="2" transform="rotate(-30, 240, 212)" />
                
                <!-- 磁场 B 箭头（垂直向外） -->
                <line id="scene1-field-b-line" x1="200" y1="180" x2="200" y2="120" stroke="#2e7d32" stroke-width="3" marker-end="url(#scene1-arrowhead)" />
                <circle id="scene1-field-b-dot" cx="200" cy="120" r="8" fill="none" stroke="#2e7d32" stroke-width="2" />
                <text id="scene1-field-b-dot-inner" x="200" y="124" text-anchor="middle" font-size="10" fill="#2e7d32">·</text>
                
                <!-- 角度θ弧线 -->
                <path id="scene1-angle-arc" d="M 120 320 A 25 25 0 0 0 142 308" fill="none" stroke="#888888" stroke-width="2" />
                
                <!-- 标签 -->
                <text id="scene1-label-m" x="170" y="200" font-size="14" fill="#000000">M</text>
                <text id="scene1-label-n" x="310" y="280" font-size="14" fill="#000000">N</text>
                <text id="scene1-label-b" x="185" y="110" font-size="14" fill="#2e7d32">B</text>
                <text id="scene1-label-theta" x="145" y="315" font-size="14" fill="#000000">θ=30°</text>
            </g>

            <!-- 步骤 1: 重力及分力（右侧受力分析区） -->
            <g id="scene1-step1" style="display:none;">
                <!-- 受力分析原点 -->
                <circle id="scene1-force-origin" cx="640" cy="200" r="4" fill="#000000" />
                
                <!-- 重力 mg 箭头（竖直向下） -->
                <line id="scene1-force-mg" x1="640" y1="200" x2="640" y2="280" stroke="#c62828" stroke-width="3" marker-end="url(#scene1-arrowhead-red)" />
                <text id="scene1-label-mg" x="655" y="245" font-size="14" fill="#c62828">mg</text>
                
                <!-- 重力分力：平行斜面 mgsinθ（沿斜面向下，30°） -->
                <line id="scene1-force-mgsin" x1="640" y1="200" x2="720" y2="246" stroke="#c62828" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#scene1-arrowhead-red)" />
                <text id="scene1-label-mgsin" x="730" y="250" font-size="14" fill="#c62828">mgsinθ</text>
                
                <!-- 重力分力：垂直斜面 mgcosθ（垂直斜面向下，-60°） -->
                <line id="scene1-force-mgcos" x1="640" y1="200" x2="600" y2="269" stroke="#c62828" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#scene1-arrowhead-red)" />
                <text id="scene1-label-mgcos" x="560" y="285" font-size="14" fill="#c62828">mgcosθ</text>
            </g>

            <!-- 步骤 2: 安培力 F_安 -->
            <g id="scene1-step2" style="display:none;">
                <!-- 安培力 F_安（沿斜面向上，150°） -->
                <line id="scene1-force-ampere" x1="640" y1="200" x2="560" y2="154" stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrowhead-blue)" />
                <text id="scene1-label-ampere" x="530" y="145" font-size="14" fill="#1565c0">F_安</text>
            </g>

            <!-- 步骤 3: 感应电流 I -->
            <g id="scene1-step3" style="display:none;">
                <!-- 感应电流 I 箭头（导体棒内从 N 到 M） -->
                <line id="scene1-current-i" x1="280" y1="245" x2="200" y2="245" stroke="#ff9800" stroke-width="3" marker-end="url(#scene1-arrowhead-orange)" />
                <text id="scene1-label-i" x="245" y="230" font-size="14" fill="#ff9800">I</text>
            </g>

            <!-- 步骤 4: 平衡状态高亮 -->
            <g id="scene1-step4" style="display:none;">
                <!-- 高亮 mgsinθ -->
                <line id="scene1-force-mgsin-highlight" x1="640" y1="200" x2="720" y2="246" stroke="#c62828" stroke-width="5" stroke-dasharray="4,4" marker-end="url(#scene1-arrowhead-red)" opacity="0.6" />
                <!-- 高亮 F_安 -->
                <line id="scene1-force-ampere-highlight" x1="640" y1="200" x2="560" y2="154" stroke="#1565c0" stroke-width="5" marker-end="url(#scene1-arrowhead-blue)" opacity="0.6" />
                <!-- 平衡标注 -->
                <text id="scene1-label-balance" x="640" y="320" text-anchor="middle" font-size="16" fill="#000000" font-weight="bold">mgsinθ = F_安</text>
            </g>

            <!-- 控件栏（SVG 内部底部） -->
            <g id="scene1-controls-group">
                <rect x="260" y="450" width="280" height="40" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="4" />
                <text id="scene1-step-indicator" x="400" y="475" text-anchor="middle" font-size="14" fill="#333">步骤 1/5</text>
            </g>
        </svg>

        <!-- HTML 按钮控件 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1: U 形框架导体棒受力分析
        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 水平参考线 | 虚线 | (80,320)-(280,320) | 200×2 | - | 左侧装置区底部基准 |
        // | U 形导轨左线 | 线段 | (100,280)-(350,135) | 280×4 | - | 倾角 30°，黑色实线 |
        // | U 形导轨右线 | 线段 | (130,297)-(380,152) | 280×4 | - | 平行左线，间距 34px |
        // | 导轨底部连线 | 线段 | (100,280)-(130,297) | 34×3 | - | 闭合 U 形底部 |
        // | 导体棒 MN | 矩形 | (175,205)-(305,219) | 130×14 | - | 蓝色#1565c0，横跨导轨 |
        // | 磁场 B 箭头 | 箭头 | (200,180)-(200,120) | 60×3 | 左上方 | 绿色#2e7d32，带⊙符号 |
        // | 角度θ弧线 | 弧线 | (120,305) 半径 25 | 25×25 | 弧线内侧 | 标注 30° |
        // | M 标签 | text | (170,200) | ~12×16 | 左上方 | 导体棒左端 |
        // | N 标签 | text | (310,280) | ~12×16 | 右下方 | 导体棒右端 |
        // | B 标签 | text | (185,110) | ~12×16 | 左上方 | 磁场箭头末端 |
        // | θ=30°标签 | text | (145,315) | ~35×16 | 下方 | 角度弧线旁 |
        // | 受力分析原点 | 点 | (640,200) | 4×4 | - | 右侧受力图中心 |
        // | 重力 mg 箭头 | 箭头 | (640,200)-(640,280) | 80×3 | 右侧 | 红色#c62828，竖直向下 |
        // | mg 分力平行斜面 | 箭头 | (640,200)-(720,246) | 92×3 | 上方 | 红色虚线，沿斜面向下 |
        // | mg 分力垂直斜面 | 箭头 | (640,200)-(600,269) | 80×3 | 左侧 | 红色虚线，垂直斜面向下 |
        // | 安培力 F_安箭头 | 箭头 | (640,200)-(560,154) | 92×3 | 上方 | 蓝色#1565c0，沿斜面向上 |
        // | 感应电流 I 箭头 | 箭头 | (280,245)-(200,245) | 80×3 | 上方 | 橙色#ff9800，导体棒内 |
        // | mg 标签 | text | (655,245) | ~20×16 | 右侧 | 重力箭头旁 |
        // | mgsinθ标签 | text | (730,250) | ~45×16 | 右侧 | 平行分力箭头末端 |
        // | mgcosθ标签 | text | (560,285) | ~45×16 | 左侧 | 垂直分力箭头末端 |
        // | F_安标签 | text | (530,145) | ~35×16 | 左上方 | 安培力箭头末端 |
        // | I 标签 | text | (245,230) | ~10×16 | 上方 | 电流箭头上方 |
        // | 步骤按钮区 | 按钮组 | (260,450)-(540,490) | 280×40 | - | 上一步/下一步按钮 |

        const totalSteps = 5;
        let currentStep = 0;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        // 步骤对应的元素组
        const stepGroups = {
            0: ['scene1-step0'],
            1: ['scene1-step0', 'scene1-step1'],
            2: ['scene1-step0', 'scene1-step1', 'scene1-step2'],
            3: ['scene1-step0', 'scene1-step1', 'scene1-step2', 'scene1-step3'],
            4: ['scene1-step0', 'scene1-step1', 'scene1-step2', 'scene1-step3', 'scene1-step4']
        };

        function updateDisplay() {
            // 隐藏所有步骤组
            for (let i = 1; i <= 4; i++) {
                const group = document.getElementById('scene1-step' + i);
                if (group) {
                    group.style.display = 'none';
                }
            }

            // 显示当前步骤及之前的所有组
            const visibleGroups = stepGroups[currentStep];
            visibleGroups.forEach(groupId => {
                const group = document.getElementById(groupId);
                if (group) {
                    group.style.display = 'block';
                }
            });

            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateDisplay();
            }
        });

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
