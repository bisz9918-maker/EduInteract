<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>线圈穿越磁场过程 - 受力分析与运动状态</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        .scene1-btn {
            width: 120px;
            height: 35px;
            font-size: 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }
        #scene1-btn-prev {
            background: #e0e0e0;
            color: #333;
        }
        #scene1-btn-prev:hover:not(:disabled) {
            background: #bdbdbd;
        }
        #scene1-btn-next {
            background: #1976d2;
            color: white;
        }
        #scene1-btn-next:hover:not(:disabled) {
            background: #1565c0;
        }
        .scene1-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #555;
            min-width: 80px;
            text-align: center;
        }
        .scene1-element {
            transition: opacity 0.3s ease;
        }
        .scene1-hidden {
            opacity: 0;
            pointer-events: none;
        }
        .scene1-visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#333" />
                </marker>
                <marker id="scene1-arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#c62828" />
                </marker>
                <marker id="scene1-arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#2e7d32" />
                </marker>
                <marker id="scene1-arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#1565c0" />
                </marker>
            </defs>

            <!-- 天花板 -->
            <line id="scene1-ceiling" x1="100" y1="30" x2="700" y2="30" stroke="#333" stroke-width="4" />

            <!-- 左滑轮 -->
            <circle id="scene1-pulley-left" cx="200" cy="50" r="25" stroke="#666" stroke-width="3" fill="none" />
            <line x1="200" y1="50" x2="200" y2="30" stroke="#666" stroke-width="2" />

            <!-- 右滑轮 -->
            <circle id="scene1-pulley-right" cx="600" cy="50" r="25" stroke="#666" stroke-width="3" fill="none" />
            <line x1="600" y1="50" x2="600" y2="30" stroke="#666" stroke-width="2" />

            <!-- 磁场区域 -->
            <rect id="scene1-magnetic-field" x="100" y="80" width="300" height="80" fill="#cccccc" fill-opacity="0.2" stroke="#888" stroke-width="2" stroke-dasharray="5,5" />

            <!-- 磁感线× (3行5列) -->
            <g id="scene1-magnetic-lines">
                <text x="130" y="105" font-size="16" fill="#888" text-anchor="middle">×</text>
                <text x="180" y="105" font-size="16" fill="#888" text-anchor="middle">×</text>
                <text x="230" y="105" font-size="16" fill="#888" text-anchor="middle">×</text>
                <text x="280" y="105" font-size="16" fill="#888" text-anchor="middle">×</text>
                <text x="330" y="105" font-size="16" fill="#888" text-anchor="middle">×</text>
                <text x="130" y="125" font-size="16" fill="#888" text-anchor="middle">×</text>
                <text x="180" y="125" font-size="16" fill="#888" text-anchor="middle">×</text>
                <text x="230" y="125" font-size="16" fill="#888" text-anchor="middle">×</text>
                <text x="280" y="125" font-size="16" fill="#888" text-anchor="middle">×</text>
                <text x="330" y="125" font-size="16" fill="#888" text-anchor="middle">×</text>
                <text x="130" y="145" font-size="16" fill="#888" text-anchor="middle">×</text>
                <text x="180" y="145" font-size="16" fill="#888" text-anchor="middle">×</text>
                <text x="230" y="145" font-size="16" fill="#888" text-anchor="middle">×</text>
                <text x="280" y="145" font-size="16" fill="#888" text-anchor="middle">×</text>
                <text x="330" y="145" font-size="16" fill="#888" text-anchor="middle">×</text>
            </g>

            <!-- 绳索系统 -->
            <line id="scene1-rope-left" x1="200" y1="75" x2="200" y2="160" stroke="#333" stroke-width="2" />
            <line id="scene1-rope-top" x1="200" y1="75" x2="600" y2="75" stroke="#333" stroke-width="2" />
            <line id="scene1-rope-right" x1="600" y1="75" x2="650" y2="150" stroke="#333" stroke-width="2" />

            <!-- 线圈 abcd -->
            <g id="scene1-coil-group">
                <!-- 线圈边框 -->
                <rect id="scene1-coil" x="150" y="160" width="200" height="80" fill="none" stroke="#000" stroke-width="2" />
                <!-- ab 边高亮（步骤1显示） -->
                <line id="scene1-ab-highlight" x1="150" y1="160" x2="350" y2="160" stroke="#1565c0" stroke-width="4" class="scene1-element scene1-hidden" />
            </g>

            <!-- 砝码 m₂ -->
            <rect id="scene1-weight" x="630" y="150" width="40" height="40" fill="#666" />

            <!-- 标签 -->
            <text id="scene1-label-a" x="145" y="155" font-size="14" text-anchor="end">a</text>
            <text id="scene1-label-b" x="355" y="155" font-size="14" text-anchor="start">b</text>
            <text id="scene1-label-c" x="355" y="245" font-size="14" text-anchor="start">c</text>
            <text id="scene1-label-d" x="145" y="245" font-size="14" text-anchor="end">d</text>
            <text id="scene1-label-B" x="410" y="105" font-size="16" text-anchor="start">B</text>
            <text id="scene1-label-h" x="85" y="125" font-size="14" text-anchor="end">h</text>
            <text id="scene1-label-l" x="365" y="205" font-size="14" text-anchor="start">l</text>
            <text id="scene1-label-m1" x="250" y="265" font-size="16" text-anchor="middle">m₁</text>
            <text id="scene1-label-m2" x="675" y="175" font-size="16" text-anchor="start">m₂</text>

            <!-- 磁场高度标注线 -->
            <line x1="90" y1="80" x2="90" y2="160" stroke="#888" stroke-width="1" />
            <line x1="85" y1="80" x2="95" y2="80" stroke="#888" stroke-width="1" />
            <line x1="85" y1="160" x2="95" y2="160" stroke="#888" stroke-width="1" />

            <!-- 线圈边长标注线 -->
            <line x1="360" y1="160" x2="360" y2="240" stroke="#888" stroke-width="1" />
            <line x1="355" y1="160" x2="365" y2="160" stroke="#888" stroke-width="1" />
            <line x1="355" y1="240" x2="365" y2="240" stroke="#888" stroke-width="1" />

            <!-- 步骤1元素：感应电流箭头（逆时针） -->
            <g id="scene1-current-arrows" class="scene1-element scene1-hidden">
                <!-- ab 边：a→b (向右) -->
                <line x1="160" y1="155" x2="340" y2="155" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead-blue)" />
                <!-- bc 边：b→c (向下) -->
                <line x1="355" y1="170" x2="355" y2="230" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead-blue)" />
                <!-- cd 边：c→d (向左) -->
                <line x1="340" y1="245" x2="160" y2="245" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead-blue)" />
                <!-- da 边：d→a (向上) -->
                <line x1="145" y1="230" x2="145" y2="170" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead-blue)" />
                <text x="320" y="140" font-size="14" fill="#1565c0" text-anchor="start">I</text>
            </g>

            <!-- 步骤1元素：安培力 F_A 箭头（向下） -->
            <g id="scene1-force-fa" class="scene1-element scene1-hidden">
                <line x1="250" y1="160" x2="250" y2="220" stroke="#c62828" stroke-width="4" marker-end="url(#scene1-arrowhead-red)" />
                <text x="260" y="195" font-size="14" fill="#c62828" text-anchor="start">F_A</text>
            </g>

            <!-- 步骤2元素：线圈重力 m₁g 箭头 -->
            <g id="scene1-force-m1g" class="scene1-element scene1-hidden">
                <line x1="250" y1="200" x2="250" y2="250" stroke="#000" stroke-width="2" marker-end="url(#scene1-arrowhead)" />
                <text x="260" y="230" font-size="14" text-anchor="start">m₁g</text>
            </g>

            <!-- 步骤2元素：砝码重力 m₂g 箭头 -->
            <g id="scene1-force-m2g" class="scene1-element scene1-hidden">
                <line x1="650" y1="170" x2="650" y2="220" stroke="#000" stroke-width="2" marker-end="url(#scene1-arrowhead)" />
                <text x="660" y="200" font-size="14" text-anchor="start">m₂g</text>
            </g>

            <!-- 步骤2元素：左侧拉力 T 箭头（向上） -->
            <g id="scene1-force-t-left" class="scene1-element scene1-hidden">
                <line x1="200" y1="160" x2="200" y2="110" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrowhead-green)" />
                <text x="185" y="140" font-size="14" fill="#2e7d32" text-anchor="end">T</text>
            </g>

            <!-- 步骤2元素：右侧拉力 T 箭头（向上） -->
            <g id="scene1-force-t-right" class="scene1-element scene1-hidden">
                <line x1="650" y1="150" x2="650" y2="100" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrowhead-green)" />
                <text x="635" y="130" font-size="14" fill="#2e7d32" text-anchor="end">T</text>
            </g>

            <!-- 公式显示区 -->
            <g id="scene1-formula-group">
                <rect x="50" y="405" width="700" height="35" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="5" />
                <text id="scene1-formula-text" x="400" y="428" font-size="14" text-anchor="middle" fill="#333">问题：求线圈匀速运动速度 v</text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/4</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现：线圈穿越磁场过程

        // 状态变量
        let currentStep = 0;
        const totalSteps = 4;

        // 每步显示的公式文本
        const stepFormulas = [
            "问题：求线圈匀速运动速度 v",
            "感应电流方向：逆时针（楞次定律）",
            "线圈受力：T 向上，m₁g 向下，F_A 向下",
            "匀速→平衡：对线圈 T = m₁g + F_A；对砝码 T = m₂g",
            "$F_A = BIl = \\frac{B^2l^2v}{R} \\quad\\Rightarrow\\quad m_2g = m_1g + \\frac{B^2l^2v}{R} \\quad\\Rightarrow\\quad v = \\frac{(m_2-m_1)gR}{B^2l^2} = 4\\ \\text{m/s}$"
        ];

        // 每步需要显示的元素 ID 列表
        const stepElements = {
            0: [],  // 初始状态只显示基础元素
            1: ['scene1-ab-highlight', 'scene1-current-arrows', 'scene1-force-fa'],
            2: ['scene1-force-m1g', 'scene1-force-m2g', 'scene1-force-t-left', 'scene1-force-t-right'],
            3: [],  // 步骤 3 无新增元素，只更新公式
            4: []   // 步骤 4 无新增元素，只更新公式
        };

        // 工具函数：显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene1-hidden');
                el.classList.add('scene1-visible');
            }
        }

        // 工具函数：隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene1-visible');
                el.classList.add('scene1-hidden');
            }
        }

        // 渲染指定步骤
        function renderStep(step) {
            // 更新步骤指示器
            document.getElementById('scene1-step-indicator').textContent = '步骤 ' + step + '/' + totalSteps;

            // 更新按钮状态
            document.getElementById('scene1-btn-prev').disabled = (step === 0);
            document.getElementById('scene1-btn-next').disabled = (step === totalSteps);

            // 根据步骤显示/隐藏元素
            // 步骤 0：只显示基础元素（所有特殊元素都隐藏）
            // 步骤 1：显示 ab 高亮、电流箭头、安培力
            // 步骤 2：在步骤 1 基础上显示受力箭头
            // 步骤 3-4：保持步骤 2 的所有元素

            // 先隐藏所有特殊元素
            ['scene1-ab-highlight', 'scene1-current-arrows', 'scene1-force-fa',
             'scene1-force-m1g', 'scene1-force-m2g', 'scene1-force-t-left', 'scene1-force-t-right']
                .forEach(id => hideElement(id));

            // 根据当前步骤显示相应元素
            if (step >= 1) {
                showElement('scene1-ab-highlight');
                showElement('scene1-current-arrows');
                showElement('scene1-force-fa');
            }
            if (step >= 2) {
                showElement('scene1-force-m1g');
                showElement('scene1-force-m2g');
                showElement('scene1-force-t-left');
                showElement('scene1-force-t-right');
            }

            // 更新公式文本
            const formulaText = document.getElementById('scene1-formula-text');
            formulaText.innerHTML = stepFormulas[step];

            // 触发 MathJax 渲染
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([formulaText]).catch(function(err) {
                    console.log('MathJax 渲染错误:', err);
                });
            }
        }

        // 上一步
        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
            }
        }

        // 下一步
        function nextStep() {
            if (currentStep < totalSteps) {
                currentStep++;
                renderStep(currentStep);
            }
        }

        // 绑定事件
        document.getElementById('scene1-btn-prev').addEventListener('click', prevStep);
        document.getElementById('scene1-btn-next').addEventListener('click', nextStep);

        // 初始化渲染
        renderStep(0);
    })();
    </script>
</body>
</html>
