<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物理过程三阶段运动状态示意图</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 10;
        }
        .scene1-btn {
            width: 70px;
            height: 25px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid #333;
            border-radius: 4px;
            background: #f5f5f5;
        }
        .scene1-btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .scene1-btn:hover:not(:disabled) {
            background: #e0e0e0;
        }
        #scene1-step-indicator {
            font-size: 13px;
            line-height: 25px;
            color: #666;
        }
        /* 状态元素显隐控制 */
        .scene1-state {
            opacity: 0;
            display: none;
            transition: opacity 0.3s ease-out;
        }
        .scene1-state.active {
            opacity: 1;
            display: block;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头 marker -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                    <path d="M0,0 L8,4 L0,8 Z" fill="#000000"/>
                </marker>
            </defs>

            <!-- 地面线（贯穿所有状态） -->
            <line x1="40" y1="380" x2="760" y2="380" stroke="#000000" stroke-width="2"/>
            
            <!-- 地面阴影斜线 -->
            <g id="scene1-ground-hatch">
                <!-- 状态0区域地面阴影 -->
                <line x1="40" y1="385" x2="55" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="56" y1="385" x2="71" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="72" y1="385" x2="87" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="88" y1="385" x2="103" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="104" y1="385" x2="119" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="120" y1="385" x2="135" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="136" y1="385" x2="151" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="152" y1="385" x2="167" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="168" y1="385" x2="183" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="184" y1="385" x2="199" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="200" y1="385" x2="215" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="216" y1="385" x2="231" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="232" y1="385" x2="247" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="248" y1="385" x2="263" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="264" y1="385" x2="279" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="280" y1="385" x2="295" y2="395" stroke="#000000" stroke-width="1"/>
                <!-- 状态1区域地面阴影 -->
                <line x1="330" y1="385" x2="345" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="346" y1="385" x2="361" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="362" y1="385" x2="377" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="378" y1="385" x2="393" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="394" y1="385" x2="409" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="410" y1="385" x2="425" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="426" y1="385" x2="441" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="442" y1="385" x2="457" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="458" y1="385" x2="473" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="474" y1="385" x2="489" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="490" y1="385" x2="505" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="506" y1="385" x2="521" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="522" y1="385" x2="537" y2="395" stroke="#000000" stroke-width="1"/>
                <!-- 状态2区域地面阴影 -->
                <line x1="580" y1="385" x2="595" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="596" y1="385" x2="611" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="612" y1="385" x2="627" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="628" y1="385" x2="643" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="644" y1="385" x2="659" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="660" y1="385" x2="675" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="676" y1="385" x2="691" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="692" y1="385" x2="707" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="708" y1="385" x2="723" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="724" y1="385" x2="739" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="740" y1="385" x2="755" y2="395" stroke="#000000" stroke-width="1"/>
                <line x1="756" y1="385" x2="771" y2="395" stroke="#000000" stroke-width="1"/>
            </g>

            <!-- ==================== 状态 0：初始状态 ==================== -->
            <g id="scene1-state0" class="scene1-state active">
                <!-- 木块 A -->
                <rect id="scene1-s0-blockA" x="80" y="330" width="100" height="50" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" opacity="0.8"/>
                <text id="scene1-s0-labelA" x="130" y="360" text-anchor="middle" font-size="14" fill="#000000">A</text>
                
                <!-- 木块 B -->
                <rect id="scene1-s0-blockB" x="180" y="330" width="100" height="50" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" opacity="0.8"/>
                <text id="scene1-s0-labelB" x="230" y="360" text-anchor="middle" font-size="14" fill="#000000">B</text>
                
                <!-- 物块 C -->
                <rect id="scene1-s0-blockC" x="80" y="295" width="35" height="35" fill="#ffebee" stroke="#c62828" stroke-width="2" opacity="0.8"/>
                <text id="scene1-s0-labelC" x="97.5" y="317.5" text-anchor="middle" font-size="14" fill="#000000">C</text>
                
                <!-- 速度 v0 箭头 -->
                <line id="scene1-s0-arrow-v0" x1="80" y1="270" x2="140" y2="270" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrowhead)"/>
                <text id="scene1-s0-label-v0" x="110" y="255" text-anchor="middle" font-size="14" fill="#000000">v₀=25m/s</text>
                
                <!-- 阶段标签 -->
                <text id="scene1-s0-stage-label" x="160" y="420" text-anchor="middle" font-size="13" fill="#666666">初始状态</text>
            </g>

            <!-- ==================== 状态 1：C 滑离 A 瞬间 ==================== -->
            <g id="scene1-state1" class="scene1-state">
                <!-- 木块 A -->
                <rect id="scene1-s1-blockA" x="330" y="330" width="100" height="50" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" opacity="0.8"/>
                <text id="scene1-s1-labelA" x="380" y="360" text-anchor="middle" font-size="14" fill="#000000">A</text>
                
                <!-- 木块 B -->
                <rect id="scene1-s1-blockB" x="430" y="330" width="100" height="50" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" opacity="0.8"/>
                <text id="scene1-s1-labelB" x="480" y="360" text-anchor="middle" font-size="14" fill="#000000">B</text>
                
                <!-- 物块 C -->
                <rect id="scene1-s1-blockC" x="430" y="295" width="35" height="35" fill="#ffebee" stroke="#c62828" stroke-width="2" opacity="0.8"/>
                <text id="scene1-s1-labelC" x="447.5" y="317.5" text-anchor="middle" font-size="14" fill="#000000">C</text>
                
                <!-- 速度 vA 箭头（A 下方） -->
                <line id="scene1-s1-arrow-vA" x1="330" y1="400" x2="390" y2="400" stroke="#000000" stroke-width="3" marker-end="url(#scene1-arrowhead)"/>
                <text id="scene1-s1-label-vA" x="360" y="420" text-anchor="middle" font-size="14" fill="#000000">vA</text>
                
                <!-- 速度 vC 箭头（C 上方） -->
                <line id="scene1-s1-arrow-vC" x1="430" y1="270" x2="500" y2="270" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrowhead)"/>
                <text id="scene1-s1-label-vC" x="465" y="255" text-anchor="middle" font-size="14" fill="#000000">vC</text>
                
                <!-- 阶段标签 -->
                <text id="scene1-s1-stage-label" x="410" y="450" text-anchor="middle" font-size="13" fill="#666666">C 滑离 A 瞬间</text>
            </g>

            <!-- ==================== 状态 2：最终状态 ==================== -->
            <g id="scene1-state2" class="scene1-state">
                <!-- 木块 A（已分离） -->
                <rect id="scene1-s2-blockA" x="580" y="330" width="100" height="50" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" opacity="0.8"/>
                <text id="scene1-s2-labelA" x="630" y="360" text-anchor="middle" font-size="14" fill="#000000">A</text>
                
                <!-- 木块 B（与 A 有间隙） -->
                <rect id="scene1-s2-blockB" x="690" y="330" width="100" height="50" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" opacity="0.8"/>
                <text id="scene1-s2-labelB" x="740" y="360" text-anchor="middle" font-size="14" fill="#000000">B</text>
                
                <!-- 物块 C（停在 B 上） -->
                <rect id="scene1-s2-blockC" x="720" y="295" width="35" height="35" fill="#ffebee" stroke="#c62828" stroke-width="2" opacity="0.8"/>
                <text id="scene1-s2-labelC" x="737.5" y="317.5" text-anchor="middle" font-size="14" fill="#000000">C</text>
                
                <!-- 速度 vA 箭头（A 下方） -->
                <line id="scene1-s2-arrow-vA" x1="580" y1="400" x2="630" y2="400" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrowhead)"/>
                <text id="scene1-s2-label-vA" x="605" y="420" text-anchor="middle" font-size="14" fill="#000000">vA</text>
                
                <!-- 速度 v 箭头（B+C 共同速度） -->
                <line id="scene1-s2-arrow-v" x1="690" y1="270" x2="780" y2="270" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrowhead)"/>
                <text id="scene1-s2-label-v" x="735" y="255" text-anchor="middle" font-size="14" fill="#d32f2f" font-weight="bold">v=2.5m/s</text>
                
                <!-- 阶段标签 -->
                <text id="scene1-s2-stage-label" x="680" y="450" text-anchor="middle" font-size="13" fill="#666666">最终状态</text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">1/3</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现：物理过程三阶段运动状态示意图
        
        // 状态机变量
        let currentStep = 0;
        const totalSteps = 3;
        
        // 获取 DOM 元素
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        const state0 = document.getElementById('scene1-state0');
        const state1 = document.getElementById('scene1-state1');
        const state2 = document.getElementById('scene1-state2');
        
        // 状态元素数组
        const states = [state0, state1, state2];
        
        // 更新步骤显示
        function updateStep() {
            // 隐藏所有状态
            states.forEach((state, index) => {
                if (state) {
                    state.classList.remove('active');
                    // 使用 setTimeout 确保 display 在 transition 后切换
                    if (index !== currentStep) {
                        setTimeout(() => {
                            if (index !== currentStep) {
                                state.style.display = 'none';
                            }
                        }, 300);
                    } else {
                        state.style.display = 'block';
                        // 强制重绘后添加 active 类以触发 transition
                        requestAnimationFrame(() => {
                            state.classList.add('active');
                        });
                    }
                }
            });
            
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);
            
            // 更新步骤指示器
            stepIndicator.textContent = (currentStep + 1) + '/' + totalSteps;
        }
        
        // 上一步按钮事件
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });
        
        // 下一步按钮事件
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStep();
            }
        });
        
        // 初始化显示
        updateStep();
    })();
    </script>
</body>
</html>
