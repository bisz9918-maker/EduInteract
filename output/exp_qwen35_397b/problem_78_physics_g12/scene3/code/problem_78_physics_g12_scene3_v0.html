<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>两棒运动时序与能量转化</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-svg { width: 800px; height: 500px; }
        .scene3-rod-marker { transition: transform 0.3s ease-out; }
        .scene3-fade { opacity: 0.3; }
        .scene3-hidden { opacity: 0; }
        .scene3-btn { cursor: pointer; }
        .scene3-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500">
            <!-- 标题 -->
            <text id="scene3-title" x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">两棒运动时序与能量转化</text>
            
            <!-- 时间轴主线 -->
            <line id="scene3-timeline" x1="80" y1="60" x2="720" y2="60" stroke="#000" stroke-width="3"/>
            
            <!-- 时间点标记 -->
            <circle id="scene3-time-point-0" cx="80" cy="60" r="5" fill="#000"/>
            <circle id="scene3-time-point-1" cx="400" cy="60" r="5" fill="#000"/>
            <circle id="scene3-time-point-2" cx="720" cy="60" r="5" fill="#000"/>
            
            <!-- 时间标签 -->
            <text id="scene3-time-label-0" x="80" y="40" text-anchor="middle" font-size="14" fill="#000">t=0</text>
            <text id="scene3-time-label-1" x="400" y="40" text-anchor="middle" font-size="14" fill="#000">t₁</text>
            <text id="scene3-time-label-2" x="720" y="40" text-anchor="middle" font-size="14" fill="#000">t₂</text>
            
            <!-- a 棒轨迹线（蓝色） -->
            <line id="scene3-rod-a-track" x1="100" y1="80" x2="100" y2="180" stroke="#1565c0" stroke-width="3" class="scene3-fade"/>
            
            <!-- b 棒轨迹线（红色） -->
            <line id="scene3-rod-b-track" x1="150" y1="80" x2="150" y2="180" stroke="#c62828" stroke-width="3" class="scene3-fade"/>
            
            <!-- a 棒位置标记（蓝色小矩形） -->
            <rect id="scene3-rod-a-pos" x="95" y="80" width="10" height="4" fill="#1565c0" class="scene3-rod-marker"/>
            
            <!-- b 棒位置标记（红色小矩形） -->
            <rect id="scene3-rod-b-pos" x="145" y="100" width="10" height="4" fill="#c62828" class="scene3-rod-marker"/>
            
            <!-- 磁场区域示意 -->
            <g id="scene3-magnetic-zone" class="scene3-hidden">
                <rect x="200" y="100" width="80" height="80" fill="#e0e0e0" stroke="#888" stroke-width="1"/>
                <text x="240" y="145" text-anchor="middle" font-size="20" fill="#666">B</text>
                <!-- 磁场×符号 -->
                <text x="215" y="120" font-size="14" fill="#666">×</text>
                <text x="250" y="120" font-size="14" fill="#666">×</text>
                <text x="215" y="150" font-size="14" fill="#666">×</text>
                <text x="250" y="150" font-size="14" fill="#666">×</text>
                <text x="215" y="175" font-size="14" fill="#666">×</text>
                <text x="250" y="175" font-size="14" fill="#666">×</text>
            </g>
            
            <!-- 磁场边界标签 -->
            <text id="scene3-l1-label" x="295" y="105" font-size="12" fill="#666" class="scene3-hidden">L₁</text>
            <text id="scene3-l2-label" x="295" y="185" font-size="12" fill="#666" class="scene3-hidden">L₂</text>
            
            <!-- 步骤状态文字 -->
            <text id="scene3-status-text" x="400" y="210" text-anchor="middle" font-size="14" fill="#333"></text>
            
            <!-- 能量转化框 -->
            <g id="scene3-energy-flow" class="scene3-hidden">
                <!-- 重力势能框 -->
                <rect id="scene3-energy-box-1" x="320" y="240" width="100" height="30" rx="5" fill="#f5f5f5" stroke="#888" stroke-width="1"/>
                <text x="370" y="260" text-anchor="middle" font-size="12" fill="#333">重力势能</text>
                
                <!-- 电能框 -->
                <rect id="scene3-energy-box-2" x="480" y="240" width="100" height="30" rx="5" fill="#f5f5f5" stroke="#888" stroke-width="1"/>
                <text x="530" y="260" text-anchor="middle" font-size="12" fill="#333">电能</text>
                
                <!-- 焦耳热框 -->
                <rect id="scene3-energy-box-3" x="640" y="240" width="100" height="30" rx="5" fill="#f5f5f5" stroke="#888" stroke-width="1"/>
                <text x="690" y="260" text-anchor="middle" font-size="12" fill="#333">焦耳热</text>
                
                <!-- 箭头（势能→电能） -->
                <line x1="420" y1="255" x2="475" y2="255" stroke="#2e7d32" stroke-width="3" marker-end="url(#scene3-arrowhead)"/>
                
                <!-- 箭头（电能→焦耳热） -->
                <line x1="580" y1="255" x2="635" y2="255" stroke="#2e7d32" stroke-width="3" marker-end="url(#scene3-arrowhead)"/>
            </g>
            
            <!-- 箭头定义 -->
            <defs>
                <marker id="scene3-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
                </marker>
            </defs>
            
            <!-- 热量分配柱状图 -->
            <g id="scene3-heat-bars" class="scene3-hidden">
                <!-- R 柱（最高） -->
                <rect id="scene3-heat-bar-r" x="350" y="360" width="40" height="50" fill="#1565c0"/>
                <text x="370" y="350" text-anchor="middle" font-size="12" fill="#333">R</text>
                
                <!-- Ra 柱（中等） -->
                <rect id="scene3-heat-bar-ra" x="410" y="375" width="40" height="35" fill="#1565c0"/>
                <text x="430" y="365" text-anchor="middle" font-size="12" fill="#333">Rₐ</text>
                
                <!-- Rb 柱（最矮） -->
                <rect id="scene3-heat-bar-rb" x="470" y="390" width="40" height="20" fill="#c62828"/>
                <text x="490" y="380" text-anchor="middle" font-size="12" fill="#333">R_b</text>
            </g>
            
            <!-- 公式框 -->
            <g id="scene3-formula-box" class="scene3-hidden">
                <rect x="550" y="350" width="190" height="60" rx="5" fill="#f5f5f5" stroke="#888" stroke-width="1"/>
                <text x="645" y="370" text-anchor="middle" font-size="11" fill="#333">Q_b = m_b·g·d</text>
                <text x="645" y="390" text-anchor="middle" font-size="11" fill="#333">= 0.1×10×0.5 = 0.5J</text>
            </g>
            
            <!-- 控件栏背景 -->
            <rect x="0" y="440" width="800" height="60" fill="#f0f0f0"/>
            
            <!-- 上一步按钮 -->
            <g id="scene3-btn-prev" class="scene3-btn">
                <rect x="280" y="455" width="100" height="35" rx="5" fill="#1565c0"/>
                <text x="330" y="477" text-anchor="middle" font-size="14" fill="#fff">◀ 上一步</text>
            </g>
            
            <!-- 步骤指示器 -->
            <text id="scene3-step-indicator" x="400" y="477" text-anchor="middle" font-size="14" fill="#333">步骤 0/4</text>
            
            <!-- 下一步按钮 -->
            <g id="scene3-btn-next" class="scene3-btn">
                <rect x="450" y="455" width="100" height="35" rx="5" fill="#1565c0"/>
                <text x="500" y="477" text-anchor="middle" font-size="14" fill="#fff">下一步 ▶</text>
            </g>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 3 实现：两棒运动时序与能量转化
        
        let currentStep = 0;
        const totalSteps = 4;
        
        // 获取 DOM 元素
        const rodAPos = document.getElementById('scene3-rod-a-pos');
        const rodBPos = document.getElementById('scene3-rod-b-pos');
        const magneticZone = document.getElementById('scene3-magnetic-zone');
        const l1Label = document.getElementById('scene3-l1-label');
        const l2Label = document.getElementById('scene3-l2-label');
        const statusText = document.getElementById('scene3-status-text');
        const energyFlow = document.getElementById('scene3-energy-flow');
        const heatBars = document.getElementById('scene3-heat-bars');
        const formulaBox = document.getElementById('scene3-formula-box');
        const stepIndicator = document.getElementById('scene3-step-indicator');
        const btnPrev = document.getElementById('scene3-btn-prev');
        const btnNext = document.getElementById('scene3-btn-next');
        
        // 步骤状态文字
        const statusMessages = [
            '',
            't=0：两棒同时释放',
            't₁：b 棒进入磁场',
            't₂：b 穿出磁场，a 正好进入',
            '能量转化与热量分配'
        ];
        
        // 棒位置数据 [步骤 0, 步骤 1, 步骤 2, 步骤 3]
        const rodAPositions = [80, 80, 130, 180];
        const rodBPositions = [100, 100, 140, 180];
        
        // 更新显示状态
        function updateDisplay() {
            // 更新棒位置
            rodAPos.setAttribute('y', rodAPositions[currentStep]);
            rodBPos.setAttribute('y', rodBPositions[currentStep]);
            
            // 更新磁场区域显示（步骤 2 开始显示）
            if (currentStep >= 2) {
                magneticZone.classList.remove('scene3-hidden');
                l1Label.classList.remove('scene3-hidden');
                l2Label.classList.remove('scene3-hidden');
            } else {
                magneticZone.classList.add('scene3-hidden');
                l1Label.classList.add('scene3-hidden');
                l2Label.classList.add('scene3-hidden');
            }
            
            // 更新状态文字
            statusText.textContent = statusMessages[currentStep];
            
            // 更新能量转化和热量分配显示（步骤 4）
            if (currentStep >= 4) {
                energyFlow.classList.remove('scene3-hidden');
                heatBars.classList.remove('scene3-hidden');
                formulaBox.classList.remove('scene3-hidden');
            } else {
                energyFlow.classList.add('scene3-hidden');
                heatBars.classList.add('scene3-hidden');
                formulaBox.classList.add('scene3-hidden');
            }
            
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep}/${totalSteps}`;
            
            // 更新按钮状态
            btnPrev.style.opacity = currentStep === 0 ? '0.5' : '1';
            btnPrev.style.pointerEvents = currentStep === 0 ? 'none' : 'auto';
            btnNext.style.opacity = currentStep === totalSteps ? '0.5' : '1';
            btnNext.style.pointerEvents = currentStep === totalSteps ? 'none' : 'auto';
        }
        
        // 上一步
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });
        
        // 下一步
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateDisplay();
            }
        });
        
        // 初始化
        updateDisplay();
    })();
    </script>
</body>
</html>
