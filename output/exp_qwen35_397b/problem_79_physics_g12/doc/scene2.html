<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物理 - 板块模型相对运动分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-svg { width: 800px; height: 500px; }
        .step-group { opacity: 1; transition: opacity 0.3s ease; }
        .hidden { opacity: 0; pointer-events: none; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 20px; }
        #scene2-btn-prev, #scene2-btn-next { width: 100px; height: 35px; font-size: 14px; cursor: pointer; border: 2px solid #333; border-radius: 5px; background: #f5f5f5; }
        #scene2-btn-prev:hover, #scene2-btn-next:hover { background: #e0e0e0; }
        #scene2-btn-prev:disabled, #scene2-btn-next:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 16px; font-weight: bold; color: #333; min-width: 200px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 地面基准线 -->
            <line id="scene2-ground" x1="80" y1="240" x2="720" y2="240" stroke="#000000" stroke-width="3"/>
            
            <!-- 地面阴影（45°斜线） -->
            <g id="scene2-ground-hatch">
                <line x1="80" y1="240" x2="80" y2="260" stroke="#666666" stroke-width="1"/>
                <line x1="100" y1="240" x2="80" y2="260" stroke="#666666" stroke-width="1"/>
                <line x1="120" y1="240" x2="100" y2="260" stroke="#666666" stroke-width="1"/>
                <line x1="140" y1="240" x2="120" y2="260" stroke="#666666" stroke-width="1"/>
                <line x1="160" y1="240" x2="140" y2="260" stroke="#666666" stroke-width="1"/>
                <line x1="180" y1="240" x2="160" y2="260" stroke="#666666" stroke-width="1"/>
                <line x1="200" y1="240" x2="180" y2="260" stroke="#666666" stroke-width="1"/>
                <line x1="220" y1="240" x2="200" y2="260" stroke="#666666" stroke-width="1"/>
                <line x1="240" y1="240" x2="220" y2="260" stroke="#666666" stroke-width="1"/>
                <line x1="260" y1="240" x2="240" y2="260" stroke="#666666" stroke-width="1"/>
                <line x1="280" y1="240" x2="260" y2="260" stroke="#666666" stroke-width="1"/>
                <line x1="300" y1="240" x2="280" y2="260" stroke="#666666" stroke-width="1"/>
                <line x1="320" y1="240" x2="300" y2="260" stroke="#666666" stroke-width="1"/>
                <line x1="340" y1="240" x2="320" y2="260" stroke="#666666" stroke-width="1"/>
                <line x1="360" y1="240" x2="340" y2="260" stroke="#666666" stroke-width="1"/>
                <line x1="380" y1="240" x2="360" y2="260" stroke="#666666" stroke-width="1"/>
                <line x1="400" y1="240" x2="380" y2="260" stroke="#666666" stroke-width="1"/>
                <line x1="420" y1="240" x2="400" y2="260" stroke="#666666" stroke-width="1"/>
                <line x1="440" y1="240" x2="420" y2="260" stroke="#666666" stroke-width="1"/>
                <line x1="460" y1="240" x2="440" y2="260" stroke="#666666" stroke-width="1"/>
                <line x1="480" y1="240" x2="460" y2="260" stroke="#666666" stroke-width="1"/>
                <line x1="500" y1="240" x2="480" y2="260" stroke="#666666" stroke-width="1"/>
                <line x1="520" y1="240" x2="500" y2="260" stroke="#666666" stroke-width="1"/>
                <line x1="540" y1="240" x2="520" y2="260" stroke="#666666" stroke-width="1"/>
                <line x1="560" y1="240" x2="540" y2="260" stroke="#666666" stroke-width="1"/>
                <line x1="580" y1="240" x2="560" y2="260" stroke="#666666" stroke-width="1"/>
                <line x1="600" y1="240" x2="580" y2="260" stroke="#666666" stroke-width="1"/>
                <line x1="620" y1="240" x2="600" y2="260" stroke="#666666" stroke-width="1"/>
                <line x1="640" y1="240" x2="620" y2="260" stroke="#666666" stroke-width="1"/>
                <line x1="660" y1="240" x2="640" y2="260" stroke="#666666" stroke-width="1"/>
                <line x1="680" y1="240" x2="660" y2="260" stroke="#666666" stroke-width="1"/>
                <line x1="700" y1="240" x2="680" y2="260" stroke="#666666" stroke-width="1"/>
                <line x1="720" y1="240" x2="700" y2="260" stroke="#666666" stroke-width="1"/>
            </g>
            
            <!-- 步骤 0：初始状态 -->
            <g id="scene2-step0" class="step-group">
                <!-- 木板 M 初始位置（虚线） -->
                <rect id="scene2-board-initial" x="150" y="170" width="400" height="70" fill="none" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
                <text id="scene2-label-M-initial" x="350" y="210" text-anchor="middle" font-size="18" fill="#888888">M</text>
                
                <!-- 物块 m 初始位置（虚线） -->
                <rect id="scene2-block-initial" x="500" y="130" width="50" height="40" fill="none" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
                <text id="scene2-label-m-initial" x="525" y="155" text-anchor="middle" font-size="16" fill="#888888">m</text>
                
                <!-- 拉力 F 箭头 -->
                <line id="scene2-force-F-line" x1="550" y1="205" x2="620" y2="205" stroke="#000000" stroke-width="3"/>
                <polygon id="scene2-force-F-arrow" points="620,205 610,200 610,210" fill="#000000"/>
                <text id="scene2-label-F" x="585" y="195" text-anchor="middle" font-size="16" fill="#000000">F</text>
            </g>
            
            <!-- 步骤 1：运动过程中 -->
            <g id="scene2-step1" class="step-group hidden">
                <!-- 木板 M 当前位置（实线） -->
                <rect id="scene2-board-current" x="250" y="170" width="400" height="70" fill="#e3f2fd" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
                <text id="scene2-label-M-current" x="450" y="210" text-anchor="middle" font-size="18" fill="#000000">M</text>
                
                <!-- 物块 m 当前位置（实线） -->
                <rect id="scene2-block-current" x="580" y="130" width="50" height="40" fill="#fff3e0" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
                <text id="scene2-label-m-current" x="605" y="155" text-anchor="middle" font-size="16" fill="#000000">m</text>
                
                <!-- 位移箭头 x_M -->
                <line id="scene2-arrow-xM-line" x1="150" y1="260" x2="250" y2="260" stroke="#1565c0" stroke-width="3"/>
                <polygon id="scene2-arrow-xM-head1" points="150,260 160,255 160,265" fill="#1565c0"/>
                <polygon id="scene2-arrow-xM-head2" points="250,260 240,255 240,265" fill="#1565c0"/>
                <text id="scene2-label-xM" x="200" y="278" text-anchor="middle" font-size="14" fill="#1565c0">x_M</text>
                
                <!-- 位移箭头 x_m -->
                <line id="scene2-arrow-xm-line" x1="500" y1="260" x2="580" y2="260" stroke="#1565c0" stroke-width="3"/>
                <polygon id="scene2-arrow-xm-head1" points="500,260 510,255 510,265" fill="#1565c0"/>
                <polygon id="scene2-arrow-xm-head2" points="580,260 570,255 570,265" fill="#1565c0"/>
                <text id="scene2-label-xm" x="540" y="278" text-anchor="middle" font-size="14" fill="#1565c0">x_m</text>
            </g>
            
            <!-- 步骤 2：刚好抽出 -->
            <g id="scene2-step2" class="step-group hidden">
                <!-- 木板 M 最终位置 -->
                <rect id="scene2-board-final" x="350" y="170" width="400" height="70" fill="#e3f2fd" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
                <text id="scene2-label-M-final" x="550" y="210" text-anchor="middle" font-size="18" fill="#000000">M</text>
                
                <!-- 物块 m 最终位置 -->
                <rect id="scene2-block-final" x="700" y="130" width="50" height="40" fill="#fff3e0" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
                <text id="scene2-label-m-final" x="725" y="155" text-anchor="middle" font-size="16" fill="#000000">m</text>
                
                <!-- 位移箭头 x_M（延伸） -->
                <line id="scene2-arrow-xM-final" x1="150" y1="260" x2="350" y2="260" stroke="#1565c0" stroke-width="3"/>
                <polygon points="150,260 160,255 160,265" fill="#1565c0"/>
                <polygon points="350,260 340,255 340,265" fill="#1565c0"/>
                <text id="scene2-label-xM-final" x="250" y="278" text-anchor="middle" font-size="14" fill="#1565c0">x_M</text>
                
                <!-- 位移箭头 x_m（延伸） -->
                <line id="scene2-arrow-xm-final" x1="500" y1="260" x2="700" y2="260" stroke="#1565c0" stroke-width="3"/>
                <polygon points="500,260 510,255 510,265" fill="#1565c0"/>
                <polygon points="700,260 690,255 690,265" fill="#1565c0"/>
                <text id="scene2-label-xm-final" x="600" y="278" text-anchor="middle" font-size="14" fill="#1565c0">x_m</text>
                
                <!-- 相对位移 L 标注（双向箭头） -->
                <line id="scene2-arrow-L" x1="150" y1="290" x2="750" y2="290" stroke="#c62828" stroke-width="4"/>
                <polygon id="scene2-arrow-L-head1" points="150,290 160,285 160,295" fill="#c62828"/>
                <polygon id="scene2-arrow-L-head2" points="750,290 740,285 740,295" fill="#c62828"/>
                <text id="scene2-label-L" x="450" y="315" text-anchor="middle" font-size="16" fill="#c62828" font-weight="bold">L = x_M - x_m</text>
            </g>
            
            <!-- 步骤 3：v-t 图像 -->
            <g id="scene2-step3" class="step-group hidden">
                <!-- v-t 图坐标轴 -->
                <line id="scene2-vt-y-axis" x1="100" y1="350" x2="100" y2="420" stroke="#000000" stroke-width="2"/>
                <line id="scene2-vt-x-axis" x1="100" y1="420" x2="700" y2="420" stroke="#000000" stroke-width="2"/>
                
                <!-- 轴标签 -->
                <text id="scene2-vt-label-v" x="85" y="345" text-anchor="end" font-size="14" fill="#000000">v</text>
                <text id="scene2-vt-label-t" x="705" y="435" text-anchor="start" font-size="14" fill="#000000">t</text>
                <text id="scene2-vt-label-O" x="90" y="435" text-anchor="start" font-size="12" fill="#000000">O</text>
                
                <!-- v_m 图线（斜率较小） -->
                <line id="scene2-vm-line" x1="100" y1="420" x2="500" y2="380" stroke="#2e7d32" stroke-width="2"/>
                <text id="scene2-vm-label" x="320" y="370" text-anchor="middle" font-size="14" fill="#2e7d32">v_m</text>
                
                <!-- v_M 图线（斜率较大） -->
                <line id="scene2-vM-line" x1="100" y1="420" x2="500" y2="340" stroke="#1565c0" stroke-width="2"/>
                <text id="scene2-vM-label" x="320" y="330" text-anchor="middle" font-size="14" fill="#1565c0">v_M</text>
            </g>
            
            <!-- 控件栏（固定在 SVG 底部） -->
            <g id="scene2-controls-group">
                <rect x="0" y="440" width="800" height="60" fill="#ffffff" fill-opacity="0.9"/>
                <text id="scene2-step-indicator" x="400" y="465" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">步骤 0：初始状态</text>
            </g>
        </svg>
        
        <!-- HTML 按钮控件 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev">◀ 上一步</button>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现 - 板块模型相对运动分析
        
        const TOTAL_STEPS = 4;
        let currentStep = 0;
        
        const stepDescriptions = [
            "步骤 0：初始状态",
            "步骤 1：运动过程中",
            "步骤 2：刚好抽出（L = x_M - x_m）",
            "步骤 3：速度 - 时间图像"
        ];
        
        // 获取 DOM 元素
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        
        // 步骤分组元素
        const stepGroups = {
            0: document.getElementById('scene2-step0'),
            1: document.getElementById('scene2-step1'),
            2: document.getElementById('scene2-step2'),
            3: document.getElementById('scene2-step3')
        };
        
        // 更新视图函数
        function updateView() {
            // 隐藏所有步骤组
            for (let i = 0; i < TOTAL_STEPS; i++) {
                if (stepGroups[i]) {
                    stepGroups[i].classList.add('hidden');
                }
            }
            
            // 显示当前步骤及之前所有步骤
            for (let i = 0; i <= currentStep; i++) {
                if (stepGroups[i]) {
                    stepGroups[i].classList.remove('hidden');
                }
            }
            
            // 更新步骤指示器
            stepIndicator.textContent = stepDescriptions[currentStep];
            
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === TOTAL_STEPS - 1);
        }
        
        // 按钮事件处理
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateView();
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentStep < TOTAL_STEPS - 1) {
                currentStep++;
                updateView();
            }
        });
        
        // 初始化视图
        updateView();
    })();
    </script>
</body>
</html>
