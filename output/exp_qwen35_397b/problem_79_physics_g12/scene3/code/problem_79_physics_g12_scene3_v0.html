<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>临界条件与 F 作用时间的关系分析</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene3-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene3-svg {
            width: 800px;
            height: 440px;
        }
        .scene3-fade-in {
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .scene3-visible {
            opacity: 1;
        }
        .scene3-hidden {
            opacity: 0;
        }
        #scene3-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }
        #scene3-step-indicator {
            font-size: 14px;
            color: #333;
            min-width: 70px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="440" viewBox="0 0 800 440">
            <!-- 左侧标题 -->
            <text id="scene3-title-left" x="20" y="35" font-size="15" font-weight="bold" fill="#333">F 作用阶段</text>
            <text id="scene3-title-right" x="480" y="35" font-size="15" font-weight="bold" fill="#333">v-t 图像</text>

            <!-- F 作用阶段示意图 -->
            <!-- 木板 M -->
            <rect id="scene3-M-phase1" x="30" y="60" width="250" height="50" fill="#bdbdbd" stroke="#000" stroke-width="2"/>
            <text x="155" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" stroke="#fff" stroke-width="3">M</text>
            
            <!-- 物块 m -->
            <rect id="scene3-m-phase1" x="230" y="35" width="40" height="25" fill="#757575" stroke="#000" stroke-width="2"/>
            <text x="250" y="53" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff" stroke="#757575" stroke-width="3">m</text>
            
            <!-- 地面 -->
            <line id="scene3-ground-phase1" x1="10" y1="110" x2="300" y2="110" stroke="#000" stroke-width="2"/>
            <!-- 地面阴影线 -->
            <g id="scene3-ground-hatch-phase1">
                <line x1="20" y1="110" x2="15" y2="118" stroke="#666" stroke-width="1"/>
                <line x1="40" y1="110" x2="35" y2="118" stroke="#666" stroke-width="1"/>
                <line x1="60" y1="110" x2="55" y2="118" stroke="#666" stroke-width="1"/>
                <line x1="80" y1="110" x2="75" y2="118" stroke="#666" stroke-width="1"/>
                <line x1="100" y1="110" x2="95" y2="118" stroke="#666" stroke-width="1"/>
                <line x1="120" y1="110" x2="115" y2="118" stroke="#666" stroke-width="1"/>
                <line x1="140" y1="110" x2="135" y2="118" stroke="#666" stroke-width="1"/>
                <line x1="160" y1="110" x2="155" y2="118" stroke="#666" stroke-width="1"/>
                <line x1="180" y1="110" x2="175" y2="118" stroke="#666" stroke-width="1"/>
                <line x1="200" y1="110" x2="195" y2="118" stroke="#666" stroke-width="1"/>
                <line x1="220" y1="110" x2="215" y2="118" stroke="#666" stroke-width="1"/>
                <line x1="240" y1="110" x2="235" y2="118" stroke="#666" stroke-width="1"/>
                <line x1="260" y1="110" x2="255" y2="118" stroke="#666" stroke-width="1"/>
                <line x1="280" y1="110" x2="275" y2="118" stroke="#666" stroke-width="1"/>
            </g>
            
            <!-- 拉力 F 箭头 -->
            <g id="scene3-F-arrow-phase1">
                <line x1="280" y1="85" x2="320" y2="85" stroke="#d32f2f" stroke-width="3" marker-end="url(#scene3-arrowhead)"/>
                <text x="300" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#d32f2f">F</text>
            </g>
            
            <!-- 加速度标注 -->
            <text id="scene3-aM1-label" x="155" y="135" text-anchor="middle" font-size="13" fill="#1565c0" class="scene3-fade-in">a_M1=3m/s²</text>
            <text id="scene3-am1-label" x="250" y="25" text-anchor="middle" font-size="13" fill="#2e7d32" class="scene3-fade-in">a_m=1m/s²</text>

            <!-- F 撤去后示意图 -->
            <text id="scene3-title-phase2" x="20" y="160" font-size="14" font-weight="bold" fill="#333" class="scene3-fade-in">F 撤去后</text>
            
            <!-- 木板 M -->
            <rect id="scene3-M-phase2" x="30" y="180" width="250" height="50" fill="#bdbdbd" stroke="#000" stroke-width="2" class="scene3-fade-in"/>
            <text id="scene3-M-label-phase2" x="155" y="210" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" stroke="#fff" stroke-width="3" class="scene3-fade-in">M</text>
            
            <!-- 物块 m -->
            <rect id="scene3-m-phase2" x="230" y="155" width="40" height="25" fill="#757575" stroke="#000" stroke-width="2" class="scene3-fade-in"/>
            <text id="scene3-m-label-phase2" x="250" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff" stroke="#757575" stroke-width="3" class="scene3-fade-in">m</text>
            
            <!-- 地面 -->
            <line id="scene3-ground-phase2" x1="10" y1="230" x2="300" y2="230" stroke="#000" stroke-width="2" class="scene3-fade-in"/>
            <g id="scene3-ground-hatch-phase2" class="scene3-fade-in">
                <line x1="20" y1="230" x2="15" y2="238" stroke="#666" stroke-width="1"/>
                <line x1="40" y1="230" x2="35" y2="238" stroke="#666" stroke-width="1"/>
                <line x1="60" y1="230" x2="55" y2="238" stroke="#666" stroke-width="1"/>
                <line x1="80" y1="230" x2="75" y2="238" stroke="#666" stroke-width="1"/>
                <line x1="100" y1="230" x2="95" y2="238" stroke="#666" stroke-width="1"/>
                <line x1="120" y1="230" x2="115" y2="238" stroke="#666" stroke-width="1"/>
                <line x1="140" y1="230" x2="135" y2="238" stroke="#666" stroke-width="1"/>
                <line x1="160" y1="230" x2="155" y2="238" stroke="#666" stroke-width="1"/>
                <line x1="180" y1="230" x2="175" y2="238" stroke="#666" stroke-width="1"/>
                <line x1="200" y1="230" x2="195" y2="238" stroke="#666" stroke-width="1"/>
                <line x1="220" y1="230" x2="215" y2="238" stroke="#666" stroke-width="1"/>
                <line x1="240" y1="230" x2="235" y2="238" stroke="#666" stroke-width="1"/>
                <line x1="260" y1="230" x2="255" y2="238" stroke="#666" stroke-width="1"/>
                <line x1="280" y1="230" x2="275" y2="238" stroke="#666" stroke-width="1"/>
            </g>
            
            <!-- 加速度标注（阶段 2） -->
            <text id="scene3-aM2-label" x="155" y="255" text-anchor="middle" font-size="13" fill="#1565c0" class="scene3-fade-in">a_M2=-1/3m/s²</text>
            <text id="scene3-am2-label" x="250" y="145" text-anchor="middle" font-size="13" fill="#2e7d32" class="scene3-fade-in">a_m=1m/s²</text>

            <!-- v-t 图像区域 -->
            <!-- 坐标轴 -->
            <line id="scene3-vt-t-axis" x1="420" y1="400" x2="760" y2="400" stroke="#000" stroke-width="2"/>
            <line id="scene3-vt-v-axis" x1="420" y1="400" x2="420" y2="50" stroke="#000" stroke-width="2"/>
            
            <!-- 轴标签 -->
            <text id="scene3-vt-t-label" x="770" y="405" font-size="14" fill="#000">t</text>
            <text id="scene3-vt-v-label" x="405" y="45" font-size="14" fill="#000">v</text>
            <text id="scene3-vt-origin" x="410" y="420" font-size="12" fill="#000">0</text>

            <!-- F 作用区域背景（步骤 0 显示） -->
            <rect id="scene3-vt-phase1-bg" x="420" y="280" width="120" height="120" fill="#e3f2fd" opacity="0.1" class="scene3-fade-in scene3-visible"/>
            
            <!-- F 撤去区域背景（步骤 1 显示） -->
            <rect id="scene3-vt-phase2-bg" x="540" y="360" width="160" height="40" fill="#ffebee" opacity="0.1" class="scene3-fade-in"/>

            <!-- M 速度图线 -->
            <!-- 阶段 1: (420,400) 到 (540,280) -->
            <path id="scene3-vt-M-line-phase1" d="M 420 400 L 540 280" stroke="#1565c0" stroke-width="3" fill="none" class="scene3-fade-in scene3-visible"/>
            <!-- 阶段 2: (540,280) 到 (700,360) -->
            <path id="scene3-vt-M-line-phase2" d="M 540 280 L 700 360" stroke="#1565c0" stroke-width="3" fill="none" class="scene3-fade-in"/>

            <!-- m 速度图线 -->
            <!-- 阶段 1: (420,400) 到 (540,280) 斜率较小 -->
            <path id="scene3-vt-m-line-phase1" d="M 420 400 L 540 280" stroke="#2e7d32" stroke-width="3" fill="none" class="scene3-fade-in scene3-visible"/>
            <!-- 阶段 2: (540,280) 到 (700,120) -->
            <path id="scene3-vt-m-line-phase2" d="M 540 280 L 700 120" stroke="#2e7d32" stroke-width="3" fill="none" class="scene3-fade-in"/>

            <!-- 位移面积填充（步骤 3 显示） -->
            <path id="scene3-vt-area-fill" d="M 420 400 L 540 280 L 700 360 L 700 120 L 540 280 L 420 400 Z" fill="#888888" opacity="0.15" class="scene3-fade-in"/>

            <!-- t₀ 标记点 -->
            <circle id="scene3-t0-point" cx="540" cy="400" r="5" fill="#000" class="scene3-fade-in"/>
            <text id="scene3-t0-label" x="540" y="425" text-anchor="middle" font-size="12" fill="#000" class="scene3-fade-in">t₀</text>

            <!-- t₁ 标记点 -->
            <circle id="scene3-t1-point" cx="700" cy="400" r="5" fill="#000" class="scene3-fade-in"/>
            <text id="scene3-t1-label" x="700" y="425" text-anchor="middle" font-size="12" fill="#000" class="scene3-fade-in">t₁</text>

            <!-- v_共 标记点 -->
            <circle id="scene3-v-common-point" cx="700" cy="360" r="6" fill="#c62828" class="scene3-fade-in"/>
            <text id="scene3-v-common-label" x="715" y="355" font-size="12" fill="#c62828" class="scene3-fade-in">v_共</text>

            <!-- 临界状态提示（步骤 2 显示）- 移到 v-t 图右侧空白区 -->
            <text id="scene3-critical-hint" x="770" y="90" text-anchor="end" font-size="11" fill="#c62828" class="scene3-fade-in">临界状态：m 到达 M 左端时 v_M = v_m</text>

            <!-- 位移标注（步骤 3 显示）- 移到 v-t 图右侧空白区，加大间距 -->
            <text id="scene3-displacement-label" x="770" y="120" text-anchor="end" font-size="11" fill="#333" class="scene3-fade-in">阴影面积 = L = 1.6m</text>
            <text id="scene3-time-result" x="770" y="150" text-anchor="end" font-size="12" font-weight="bold" fill="#1565c0" class="scene3-fade-in">t₀ = 0.8s</text>

            <!-- 箭头定义 -->
            <defs>
                <marker id="scene3-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#d32f2f"/>
                </marker>
            </defs>
        </svg>

        <!-- 控件栏 -->
        <div id="scene3-controls">
            <button id="scene3-prev-btn" style="width: 100px; height: 35px; font-size: 14px; background: #e0e0e0; border: 1px solid #bdbdbd; border-radius: 4px; cursor: not-allowed;" disabled>◀ 上一步</button>
            <span id="scene3-step-indicator">步骤 0/3</span>
            <button id="scene3-next-btn" style="width: 100px; height: 35px; font-size: 14px; background: #1565c0; color: white; border: none; border-radius: 4px; cursor: pointer;">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 3 实现：临界条件与 F 作用时间的关系分析
        
        // 状态管理
        let currentState = 0;
        const totalSteps = 3;

        // 元素引用
        const prevBtn = document.getElementById('scene3-prev-btn');
        const nextBtn = document.getElementById('scene3-next-btn');
        const stepIndicator = document.getElementById('scene3-step-indicator');

        // 步骤 0 可见元素
        const step0Elements = [
            'scene3-vt-phase1-bg',
            'scene3-vt-M-line-phase1',
            'scene3-vt-m-line-phase1'
        ];

        // 步骤 1 新增元素
        const step1Elements = [
            'scene3-title-phase2',
            'scene3-M-phase2',
            'scene3-M-label-phase2',
            'scene3-m-phase2',
            'scene3-m-label-phase2',
            'scene3-ground-phase2',
            'scene3-ground-hatch-phase2',
            'scene3-aM2-label',
            'scene3-am2-label',
            'scene3-vt-phase2-bg',
            'scene3-vt-M-line-phase2',
            'scene3-vt-m-line-phase2'
        ];

        // 步骤 2 新增元素
        const step2Elements = [
            'scene3-t0-point',
            'scene3-t0-label',
            'scene3-t1-point',
            'scene3-t1-label',
            'scene3-v-common-point',
            'scene3-v-common-label',
            'scene3-critical-hint'
        ];

        // 步骤 3 新增元素
        const step3Elements = [
            'scene3-vt-area-fill',
            'scene3-displacement-label',
            'scene3-time-result'
        ];

        // 始终可见的基础元素（步骤 0 就显示）
        const baseElements = [
            'scene3-aM1-label',
            'scene3-am1-label'
        ];

        // 工具函数：显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.add('scene3-visible');
                el.classList.remove('scene3-hidden');
            }
        }

        // 工具函数：隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene3-visible');
                el.classList.add('scene3-hidden');
            }
        }

        // 更新显示状态
        function updateDisplay() {
            // 隐藏所有分步元素
            step1Elements.forEach(id => hideElement(id));
            step2Elements.forEach(id => hideElement(id));
            step3Elements.forEach(id => hideElement(id));

            // 根据当前状态显示相应元素
            if (currentState >= 0) {
                step0Elements.forEach(id => showElement(id));
                baseElements.forEach(id => showElement(id));
            }
            if (currentState >= 1) {
                step1Elements.forEach(id => showElement(id));
            }
            if (currentState >= 2) {
                step2Elements.forEach(id => showElement(id));
            }
            if (currentState >= 3) {
                step3Elements.forEach(id => showElement(id));
            }

            // 更新按钮状态
            prevBtn.disabled = (currentState === 0);
            prevBtn.style.cursor = (currentState === 0) ? 'not-allowed' : 'pointer';
            prevBtn.style.background = (currentState === 0) ? '#e0e0e0' : '#1565c0';
            prevBtn.style.color = (currentState === 0) ? '#999' : 'white';

            nextBtn.disabled = (currentState === totalSteps);
            nextBtn.style.cursor = (currentState === totalSteps) ? 'not-allowed' : 'pointer';
            nextBtn.style.background = (currentState === totalSteps) ? '#e0e0e0' : '#1565c0';
            nextBtn.style.color = (currentState === totalSteps) ? '#999' : 'white';

            // 更新步骤指示
            stepIndicator.textContent = `步骤 ${currentState}/${totalSteps}`;
        }

        // 按钮事件处理
        prevBtn.addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                updateDisplay();
            }
        });

        nextBtn.addEventListener('click', function() {
            if (currentState < totalSteps) {
                currentState++;
                updateDisplay();
            }
        });

        // 初始化显示
        updateDisplay();

        // MathJax 渲染（如果有公式）
        if (window.MathJax) {
            MathJax.typesetPromise();
        }
    })();
    </script>
</body>
</html>
