<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物理受力分析 - 场景 2</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { background: #1976d2; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .scene2-btn:disabled { background: #bdbdbd; cursor: not-allowed; }
        .scene2-hidden { display: none; opacity: 0; }
        .scene2-visible { display: block; opacity: 1; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene2-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#000000" />
                </marker>
                <marker id="scene2-arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#1565c0" />
                </marker>
                <marker id="scene2-arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#c62828" />
                </marker>
            </defs>

            <!-- 水面线 -->
            <line id="scene2-water-line-L" x1="50" y1="80" x2="380" y2="80" stroke="#1565c0" stroke-width="2" />
            <line id="scene2-water-line-R" x1="420" y1="80" x2="750" y2="80" stroke="#1565c0" stroke-width="2" />

            <!-- 水波纹线（左侧） -->
            <line id="scene2-wave-1-L" x1="50" y1="110" x2="380" y2="110" stroke="#1565c0" stroke-width="1" stroke-dasharray="5,5" opacity="0.5" />
            <line id="scene2-wave-2-L" x1="50" y1="140" x2="380" y2="140" stroke="#1565c0" stroke-width="1" stroke-dasharray="5,5" opacity="0.5" />
            <line id="scene2-wave-3-L" x1="50" y1="170" x2="380" y2="170" stroke="#1565c0" stroke-width="1" stroke-dasharray="5,5" opacity="0.5" />
            <line id="scene2-wave-4-L" x1="50" y1="200" x2="380" y2="200" stroke="#1565c0" stroke-width="1" stroke-dasharray="5,5" opacity="0.5" />

            <!-- 水波纹线（右侧） -->
            <line id="scene2-wave-1-R" x1="420" y1="110" x2="750" y2="110" stroke="#1565c0" stroke-width="1" stroke-dasharray="5,5" opacity="0.5" />
            <line id="scene2-wave-2-R" x1="420" y1="140" x2="750" y2="140" stroke="#1565c0" stroke-width="1" stroke-dasharray="5,5" opacity="0.5" />
            <line id="scene2-wave-3-R" x1="420" y1="170" x2="750" y2="170" stroke="#1565c0" stroke-width="1" stroke-dasharray="5,5" opacity="0.5" />
            <line id="scene2-wave-4-R" x1="420" y1="200" x2="750" y2="200" stroke="#1565c0" stroke-width="1" stroke-dasharray="5,5" opacity="0.5" />

            <!-- 左侧物块：甲 -->
            <rect id="scene2-block-jia-L" x="155" y="80" width="120" height="60" fill="#e3f2fd" stroke="#000000" stroke-width="2" />
            <text id="scene2-label-jia-L" x="215" y="115" text-anchor="middle" font-size="16" fill="#000000">甲</text>

            <!-- 左侧物块：乙 -->
            <rect id="scene2-block-yi" x="185" y="170" width="60" height="40" fill="#e3f2fd" stroke="#000000" stroke-width="2" />
            <text id="scene2-label-yi" x="215" y="195" text-anchor="middle" font-size="16" fill="#000000">乙</text>

            <!-- 绳子 -->
            <line id="scene2-rope" x1="215" y1="140" x2="215" y2="170" stroke="#000000" stroke-width="2" />

            <!-- 右侧物块：甲（初始灰色半透明） -->
            <rect id="scene2-block-jia-R" x="545" y="80" width="120" height="60" fill="#e3f2fd" stroke="#000000" stroke-width="2" opacity="0.3" />
            <text id="scene2-label-jia-R" x="605" y="115" text-anchor="middle" font-size="16" fill="#000000" opacity="0.3">甲</text>

            <!-- 右侧物块：丙（初始灰色半透明） -->
            <rect id="scene2-block-bing" x="575" y="40" width="60" height="40" fill="#e3f2fd" stroke="#000000" stroke-width="2" opacity="0.3" />
            <text id="scene2-label-bing" x="605" y="65" text-anchor="middle" font-size="16" fill="#000000" opacity="0.3">丙</text>

            <!-- ========== 左侧甲受力分析箭头 ========== -->
            <!-- F_浮甲-L：向上浮力，箭头向左偏移 -->
            <g id="scene2-arrow-float-jia-L" class="scene2-hidden">
                <line x1="145" y1="80" x2="145" y2="35" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrowhead-blue)" />
                <text x="115" y="50" font-size="12" fill="#1565c0">F_浮甲</text>
            </g>

            <!-- G_甲：向下重力，箭头向右 -->
            <g id="scene2-arrow-grav-jia" class="scene2-hidden">
                <line x1="285" y1="140" x2="285" y2="185" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrowhead)" />
                <text x="295" y="165" font-size="12" fill="#000000">G_甲</text>
            </g>

            <!-- T_甲：绳拉力向下，箭头向右，位置更低避免与 G_甲重叠 -->
            <g id="scene2-arrow-tension-jia" class="scene2-hidden">
                <line x1="275" y1="140" x2="275" y2="170" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrowhead-red)" />
                <text x="285" y="158" font-size="12" fill="#c62828">T</text>
            </g>

            <!-- ========== 左侧乙受力分析箭头 ========== -->
            <!-- F_浮乙：向上浮力，箭头向左 -->
            <g id="scene2-arrow-float-yi" class="scene2-hidden">
                <line x1="175" y1="170" x2="175" y2="140" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrowhead-blue)" />
                <text x="145" y="155" font-size="12" fill="#1565c0">F_浮乙</text>
            </g>

            <!-- G_乙：向下重力，箭头向右 -->
            <g id="scene2-arrow-grav-yi" class="scene2-hidden">
                <line x1="255" y1="210" x2="255" y2="255" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrowhead)" />
                <text x="265" y="235" font-size="12" fill="#000000">G_乙</text>
            </g>

            <!-- T_乙：绳拉力向上，箭头向左，与 F_浮乙分开 -->
            <g id="scene2-arrow-tension-yi" class="scene2-hidden">
                <line x1="160" y1="170" x2="160" y2="145" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrowhead-red)" />
                <text x="130" y="160" font-size="12" fill="#c62828">T</text>
            </g>

            <!-- ========== 右侧甲受力分析箭头 ========== -->
            <!-- F_浮甲-R：向上浮力，箭头向左 -->
            <g id="scene2-arrow-float-jia-R" class="scene2-hidden">
                <line x1="535" y1="80" x2="535" y2="35" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrowhead-blue)" />
                <text x="505" y="50" font-size="12" fill="#1565c0">F_浮甲</text>
            </g>

            <!-- G_甲-R：向下重力，箭头向右 -->
            <g id="scene2-arrow-grav-jia-R" class="scene2-hidden">
                <line x1="675" y1="140" x2="675" y2="185" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrowhead)" />
                <text x="685" y="165" font-size="12" fill="#000000">G_甲</text>
            </g>

            <!-- N_丙压：丙对甲的压力向下，箭头向右 -->
            <g id="scene2-arrow-press-bing" class="scene2-hidden">
                <line x1="675" y1="80" x2="675" y2="110" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrowhead-red)" />
                <text x="685" y="98" font-size="12" fill="#c62828">N</text>
            </g>

            <!-- ========== 右侧丙受力分析箭头 ========== -->
            <!-- G_丙：向下重力，箭头向右，起点下移避免超出边界 -->
            <g id="scene2-arrow-grav-bing" class="scene2-hidden">
                <line x1="645" y1="40" x2="645" y2="20" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrowhead)" />
                <text x="655" y="30" font-size="12" fill="#000000">G_丙</text>
            </g>

            <!-- N_支：甲对丙的支持力向上，箭头向左 -->
            <g id="scene2-arrow-support" class="scene2-hidden">
                <line x1="565" y1="80" x2="565" y2="55" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrowhead-red)" />
                <text x="535" y="70" font-size="12" fill="#c62828">N</text>
            </g>

            <!-- 方程框背景 -->
            <rect id="scene2-equation-bg" x="50" y="260" width="700" height="100" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1" />
            <text id="scene2-equation-text" x="60" y="285" font-size="13" fill="#000000">受力分析中...</text>

            <!-- 选项框背景 -->
            <rect id="scene2-option-bg" x="50" y="370" width="700" height="60" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1" />
            <text id="scene2-option-text" x="60" y="395" font-size="12" fill="#000000">分析完成后判断</text>

            <!-- 步骤指示 -->
            <text id="scene2-step-indicator" x="400" y="465" text-anchor="middle" font-size="14" fill="#000000">步骤 0/5</text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn" disabled>◀ 上一步</button>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现 - 受力分析与选项判断

        let currentStep = 0;
        const totalSteps = 5;

        // 获取 DOM 元素
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        const equationText = document.getElementById('scene2-equation-text');
        const optionText = document.getElementById('scene2-option-text');

        // 右侧情景元素（步骤 3 高亮）
        const rightScenarioElements = [
            'scene2-block-jia-R', 'scene2-label-jia-R',
            'scene2-block-bing', 'scene2-label-bing'
        ];

        // 各步骤需要显示的元素
        const stepElements = {
            0: [], // 初始状态只显示基础情景
            1: ['scene2-arrow-float-jia-L', 'scene2-arrow-grav-jia', 'scene2-arrow-tension-jia'],
            2: ['scene2-arrow-float-yi', 'scene2-arrow-grav-yi', 'scene2-arrow-tension-yi'],
            3: ['scene2-arrow-float-jia-R', 'scene2-arrow-grav-jia-R', 'scene2-arrow-press-bing',
                'scene2-arrow-grav-bing', 'scene2-arrow-support'],
            4: [], // 方程推导
            5: []  // 选项判断
        };

        // 各步骤的方程文本
        const equationTexts = {
            0: '受力分析中...',
            1: '甲受力：F_浮甲 = G_甲 + T',
            2: '甲受力：F_浮甲 = G_甲 + T；乙受力：T + F_浮乙 = G_乙',
            3: '右侧：F_浮甲 = G_甲 + G_丙（丙压甲）',
            4: '左侧：F_浮甲 = G_甲 + T；右侧：F_浮甲 = G_甲 + G_丙；∴ T = G_丙',
            5: '错误选项：C（乙悬浮，ρ_乙 > ρ_水）'
        };

        // 各步骤的选项文本
        const optionTexts = {
            0: '分析完成后判断',
            1: '分析完成后判断',
            2: '分析完成后判断',
            3: '分析完成后判断',
            4: '分析完成后判断',
            5: 'A✓ 浮力相等；B✓ T=G_丙；C✗ 乙密度<水(错)；D✓ m_乙>m_丙'
        };

        // 显示/隐藏元素工具函数
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene2-hidden');
                el.classList.add('scene2-visible');
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }

        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene2-visible');
                el.classList.add('scene2-hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 设置右侧情景透明度
        function setRightScenarioOpacity(opacity) {
            rightScenarioElements.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.style.opacity = opacity;
                }
            });
        }

        // 更新步骤显示
        function updateStep() {
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep}/${totalSteps}`;

            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;

            // 隐藏所有步骤特定元素
            for (let step = 1; step <= totalSteps; step++) {
                if (stepElements[step]) {
                    stepElements[step].forEach(id => hideElement(id));
                }
            }

            // 显示当前步骤及之前步骤的元素
            for (let step = 1; step <= currentStep; step++) {
                if (stepElements[step]) {
                    stepElements[step].forEach(id => showElement(id));
                }
            }

            // 特殊处理：步骤 3+ 高亮右侧情景
            if (currentStep >= 3) {
                setRightScenarioOpacity(1);
            } else {
                setRightScenarioOpacity(0.3);
            }

            // 更新方程文本
            equationText.textContent = equationTexts[currentStep];

            // 更新选项文本
            optionText.textContent = optionTexts[currentStep];
        }

        // 按钮事件监听
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateStep();
            }
        });

        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
