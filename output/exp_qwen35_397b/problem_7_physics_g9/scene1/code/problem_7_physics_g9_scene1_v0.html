<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浮力情景对比 - 场景1</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 10;
        }
        .scene1-btn {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #333;
            border-radius: 4px;
            background: #f5f5f5;
        }
        .scene1-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .scene1-btn:hover:not(:disabled) {
            background: #e0e0e0;
        }
        #scene1-step-indicator {
            position: absolute;
            bottom: 45px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: #333;
        }
        /* 元素显隐控制 */
        .scene1-hidden {
            display: none;
            opacity: 0;
        }
        .scene1-visible {
            display: block;
            opacity: 1;
        }
        /* 标签淡入动画 */
        .scene1-label {
            transition: opacity 0.3s ease-in-out;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 左图：乙悬挂情景 -->
            <!-- 左图-水下虚线 (5条) -->
            <line id="scene1-left-waterline-1" x1="80" y1="180" x2="290" y2="180" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
            <line id="scene1-left-waterline-2" x1="80" y1="210" x2="290" y2="210" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
            <line id="scene1-left-waterline-3" x1="80" y1="240" x2="290" y2="240" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
            <line id="scene1-left-waterline-4" x1="80" y1="270" x2="290" y2="270" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
            <line id="scene1-left-waterline-5" x1="80" y1="300" x2="290" y2="300" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
            
            <!-- 左图-水面线 -->
            <line id="scene1-left-water" x1="80" y1="150" x2="290" y2="150" stroke="#1565c0" stroke-width="3"/>
            
            <!-- 左图-甲物块 -->
            <rect id="scene1-left-jia" x="120" y="150" width="110" height="70" fill="#f0f0f0" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
            
            <!-- 左图-绳子 -->
            <line id="scene1-left-rope" x1="175" y1="220" x2="175" y2="260" stroke="#000000" stroke-width="2"/>
            
            <!-- 左图-乙物块 -->
            <rect id="scene1-left-yi" x="145" y="260" width="60" height="50" fill="#f0f0f0" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
            
            <!-- 左图-V排高亮框 (步骤3显示) -->
            <rect id="scene1-left-vdisp" x="120" y="150" width="110" height="70" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,5" class="scene1-hidden"/>
            
            <!-- 右图：丙放置情景 -->
            <!-- 右图-水下虚线 (5条) -->
            <line id="scene1-right-waterline-1" x1="480" y1="180" x2="690" y2="180" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
            <line id="scene1-right-waterline-2" x1="480" y1="210" x2="690" y2="210" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
            <line id="scene1-right-waterline-3" x1="480" y1="240" x2="690" y2="240" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
            <line id="scene1-right-waterline-4" x1="480" y1="270" x2="690" y2="270" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
            <line id="scene1-right-waterline-5" x1="480" y1="300" x2="690" y2="300" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
            
            <!-- 右图-水面线 -->
            <line id="scene1-right-water" x1="480" y1="150" x2="690" y2="150" stroke="#1565c0" stroke-width="3"/>
            
            <!-- 右图-丙物块 -->
            <rect id="scene1-right-bing" x="545" y="90" width="60" height="60" fill="#f0f0f0" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
            
            <!-- 右图-甲物块 -->
            <rect id="scene1-right-jia" x="520" y="150" width="110" height="70" fill="#f0f0f0" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
            
            <!-- 右图-V排高亮框 (步骤3显示) -->
            <rect id="scene1-right-vdisp" x="520" y="150" width="110" height="70" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,5" class="scene1-hidden"/>
            
            <!-- 标签 (初始隐藏，步骤1显示) -->
            <!-- 左图标签 -->
            <text id="scene1-label-jia-left" x="175" y="140" text-anchor="middle" font-size="14" fill="#000000" class="scene1-hidden scene1-label">甲</text>
            <text id="scene1-label-yi" x="175" y="330" text-anchor="middle" font-size="14" fill="#000000" class="scene1-hidden scene1-label">乙</text>
            <text id="scene1-label-water-left" x="60" y="145" font-size="14" fill="#000000" class="scene1-hidden scene1-label">水面</text>
            <text id="scene1-label-vdisp-left" x="175" y="250" text-anchor="middle" font-size="14" fill="#2e7d32" class="scene1-hidden scene1-label">V_排</text>
            
            <!-- 右图标签 -->
            <text id="scene1-label-jia-right" x="575" y="185" text-anchor="middle" font-size="14" fill="#000000" class="scene1-hidden scene1-label">甲</text>
            <text id="scene1-label-bing" x="575" y="110" text-anchor="middle" font-size="14" fill="#000000" class="scene1-hidden scene1-label">丙</text>
            <text id="scene1-label-water-right" x="460" y="145" font-size="14" fill="#000000" class="scene1-hidden scene1-label">水面</text>
            <text id="scene1-label-vdisp-right" x="575" y="250" text-anchor="middle" font-size="14" fill="#2e7d32" class="scene1-hidden scene1-label">V_排</text>
        </svg>
        
        <!-- 步骤指示 -->
        <div id="scene1-step-indicator">步骤0：基础框架</div>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现 - 浮力情景对比
        
        // 状态变量
        let currentStep = 0;
        const totalSteps = 4;
        const stepNames = ["步骤0：基础框架", "步骤1：标注物块", "步骤2：水面位置", "步骤3：排开体积对比"];
        
        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.classList.remove('scene1-hidden');
                el.classList.add('scene1-visible');
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.classList.remove('scene1-visible');
                el.classList.add('scene1-hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        // 获取所有相关元素
        const elements = {
            // 左图元素
            leftJia: document.getElementById('scene1-left-jia'),
            leftYi: document.getElementById('scene1-left-yi'),
            leftRope: document.getElementById('scene1-left-rope'),
            leftWater: document.getElementById('scene1-left-water'),
            leftVdisp: document.getElementById('scene1-left-vdisp'),
            // 右图元素
            rightJia: document.getElementById('scene1-right-jia'),
            rightBing: document.getElementById('scene1-right-bing'),
            rightWater: document.getElementById('scene1-right-water'),
            rightVdisp: document.getElementById('scene1-right-vdisp'),
            // 标签
            labelJiaLeft: document.getElementById('scene1-label-jia-left'),
            labelYi: document.getElementById('scene1-label-yi'),
            labelJiaRight: document.getElementById('scene1-label-jia-right'),
            labelBing: document.getElementById('scene1-label-bing'),
            labelWaterLeft: document.getElementById('scene1-label-water-left'),
            labelWaterRight: document.getElementById('scene1-label-water-right'),
            labelVdispLeft: document.getElementById('scene1-label-vdisp-left'),
            labelVdispRight: document.getElementById('scene1-label-vdisp-right'),
            // 控件
            btnPrev: document.getElementById('scene1-btn-prev'),
            btnNext: document.getElementById('scene1-btn-next'),
            stepIndicator: document.getElementById('scene1-step-indicator')
        };
        
        // 更新步骤状态
        function updateStep() {
            // 更新步骤指示
            elements.stepIndicator.textContent = stepNames[currentStep];
            
            // 更新按钮状态
            elements.btnPrev.disabled = (currentStep === 0);
            
            if (currentStep === totalSteps - 1) {
                elements.btnNext.textContent = "重新开始";
            } else {
                elements.btnNext.textContent = "下一步 ▶";
            }
            
            // 根据步骤显示/隐藏元素
            switch(currentStep) {
                case 0:
                    // 基础框架：隐藏所有标签和V排框
                    hide(elements.labelJiaLeft);
                    hide(elements.labelYi);
                    hide(elements.labelJiaRight);
                    hide(elements.labelBing);
                    hide(elements.labelWaterLeft);
                    hide(elements.labelWaterRight);
                    hide(elements.labelVdispLeft);
                    hide(elements.labelVdispRight);
                    hide(elements.leftVdisp);
                    hide(elements.rightVdisp);
                    // 恢复水面线样式
                    elements.leftWater.setAttribute('stroke-width', '3');
                    elements.leftWater.setAttribute('stroke', '#1565c0');
                    elements.rightWater.setAttribute('stroke-width', '3');
                    elements.rightWater.setAttribute('stroke', '#1565c0');
                    break;
                    
                case 1:
                    // 标注物块：显示所有物块标签和水面标签
                    show(elements.labelJiaLeft);
                    show(elements.labelYi);
                    show(elements.labelJiaRight);
                    show(elements.labelBing);
                    show(elements.labelWaterLeft);
                    show(elements.labelWaterRight);
                    hide(elements.labelVdispLeft);
                    hide(elements.labelVdispRight);
                    hide(elements.leftVdisp);
                    hide(elements.rightVdisp);
                    // 恢复水面线样式
                    elements.leftWater.setAttribute('stroke-width', '3');
                    elements.leftWater.setAttribute('stroke', '#1565c0');
                    elements.rightWater.setAttribute('stroke-width', '3');
                    elements.rightWater.setAttribute('stroke', '#1565c0');
                    break;
                    
                case 2:
                    // 水面位置：保持标签显示，加粗水面线
                    show(elements.labelJiaLeft);
                    show(elements.labelYi);
                    show(elements.labelJiaRight);
                    show(elements.labelBing);
                    show(elements.labelWaterLeft);
                    show(elements.labelWaterRight);
                    hide(elements.labelVdispLeft);
                    hide(elements.labelVdispRight);
                    hide(elements.leftVdisp);
                    hide(elements.rightVdisp);
                    // 加粗水面线
                    elements.leftWater.setAttribute('stroke-width', '5');
                    elements.leftWater.setAttribute('stroke', '#0d47a1');
                    elements.rightWater.setAttribute('stroke-width', '5');
                    elements.rightWater.setAttribute('stroke', '#0d47a1');
                    break;
                    
                case 3:
                    // 排开体积对比：显示V排框和标签
                    show(elements.labelJiaLeft);
                    show(elements.labelYi);
                    show(elements.labelJiaRight);
                    show(elements.labelBing);
                    show(elements.labelWaterLeft);
                    show(elements.labelWaterRight);
                    show(elements.labelVdispLeft);
                    show(elements.labelVdispRight);
                    show(elements.leftVdisp);
                    show(elements.rightVdisp);
                    // 保持水面线加粗
                    elements.leftWater.setAttribute('stroke-width', '5');
                    elements.leftWater.setAttribute('stroke', '#0d47a1');
                    elements.rightWater.setAttribute('stroke-width', '5');
                    elements.rightWater.setAttribute('stroke', '#0d47a1');
                    break;
            }
            
            // 触发 MathJax 重新渲染
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }
        
        // 按钮事件处理
        elements.btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });
        
        elements.btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStep();
            } else {
                // 重新开始
                currentStep = 0;
                updateStep();
            }
        });
        
        // 初始化
        updateStep();
        
    })();
    </script>
</body>
</html>
