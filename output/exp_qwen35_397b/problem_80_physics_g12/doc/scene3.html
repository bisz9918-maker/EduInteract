<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平抛运动轨迹与水平距离计算</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-svg { width: 800px; height: 500px; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene3-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        .scene3-btn:hover { background: #e0e0e0; }
        .scene3-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene3-step-indicator { font-size: 14px; padding: 8px 16px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene3-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#333" />
                </marker>
                <marker id="scene3-arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828" />
                </marker>
                <marker id="scene3-arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0" />
                </marker>
                <marker id="scene3-arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#2e7d32" />
                </marker>
                <marker id="scene3-arrowhead-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#f57c00" />
                </marker>
            </defs>

            <!-- 悬挂点 O -->
            <circle id="scene3-point-o" cx="200" cy="100" r="6" fill="#1565c0" />
            <text id="scene3-label-o" x="210" y="90" font-size="16" fill="#1565c0" font-weight="bold">O</text>

            <!-- 竖直参考线 -->
            <line id="scene3-ref-line" x1="200" y1="100" x2="200" y2="140" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="4,4" />

            <!-- 角度α弧线 -->
            <path id="scene3-angle-arc" d="M 200,125 A 25,25 0 0,0 217.5,117.5" fill="none" stroke="#757575" stroke-width="1" />
            <text id="scene3-label-alpha" x="195" y="135" font-size="14" fill="#757575">α=53°</text>

            <!-- 初始位置 A -->
            <circle id="scene3-point-a" cx="80" cy="260" r="5" fill="#9e9e9e" />
            <text id="scene3-label-a" x="70" y="275" font-size="14" fill="#9e9e9e">A</text>

            <!-- 绳 OA（初始位置） -->
            <line id="scene3-rope-oa" x1="200" y1="100" x2="80" y2="260" stroke="#9e9e9e" stroke-width="2" />

            <!-- 最低点 B -->
            <circle id="scene3-point-b" cx="200" cy="300" r="5" fill="#1565c0" />
            <text id="scene3-label-b" x="215" y="295" font-size="14" fill="#1565c0" font-weight="bold">B</text>

            <!-- 绳 OB（竖直位置） -->
            <line id="scene3-rope-ob" x1="200" y1="100" x2="200" y2="300" stroke="#1565c0" stroke-width="2" />

            <!-- 绳长标注 l=2m -->
            <text id="scene3-label-l" x="150" y="190" font-size="14" fill="#424242">l=2m</text>

            <!-- H 高度标注 -->
            <line id="scene3-arrow-h-line" x1="280" y1="100" x2="280" y2="400" stroke="#424242" stroke-width="2" />
            <line id="scene3-arrow-h-top" x1="275" y1="100" x2="285" y2="100" stroke="#424242" stroke-width="2" />
            <line id="scene3-arrow-h-bottom" x1="275" y1="400" x2="285" y2="400" stroke="#424242" stroke-width="2" />
            <text id="scene3-label-h" x="290" y="250" font-size="14" fill="#424242">H=3.8m</text>

            <!-- 岸边 -->
            <path id="scene3-shore" d="M 50,350 L 50,400 L 80,400" fill="none" stroke="#795548" stroke-width="2" />
            <!-- 岸边填充 -->
            <path id="scene3-shore-fill" d="M 0,350 L 50,350 L 50,400 L 0,400 Z" fill="#795548" opacity="0.3" />

            <!-- 水面线 -->
            <line id="scene3-water-line" x1="50" y1="400" x2="750" y2="400" stroke="#000000" stroke-width="2" />

            <!-- 水波纹 -->
            <line id="scene3-water-wave1" x1="50" y1="415" x2="750" y2="415" stroke="#64b5f6" stroke-width="1" stroke-dasharray="8,4" />
            <line id="scene3-water-wave2" x1="50" y1="430" x2="750" y2="430" stroke="#64b5f6" stroke-width="1" stroke-dasharray="8,4" />
            <line id="scene3-water-wave3" x1="50" y1="445" x2="750" y2="445" stroke="#64b5f6" stroke-width="1" stroke-dasharray="8,4" />

            <!-- 浮台 -->
            <rect id="scene3-platform" x="550" y="395" width="200" height="10" fill="#2e7d32" />
            <text id="scene3-label-platform" x="650" y="385" font-size="14" fill="#2e7d32" text-anchor="middle">浮台</text>

            <!-- 初始偏移 l·sinα 箭头 -->
            <line id="scene3-arrow-offset-line" x1="50" y1="320" x2="200" y2="320" stroke="#f57c00" stroke-width="2" marker-end="url(#scene3-arrowhead-orange)" marker-start="url(#scene3-arrowhead-orange)" class="hidden" />
            <text id="scene3-label-offset" x="125" y="310" font-size="14" fill="#f57c00" text-anchor="middle" class="hidden">l·sinα</text>

            <!-- 竖直高度 h' 箭头 -->
            <line id="scene3-arrow-hp-line" x1="230" y1="300" x2="230" y2="400" stroke="#c62828" stroke-width="2" marker-end="url(#scene3-arrowhead-red)" marker-start="url(#scene3-arrowhead-red)" class="hidden" />
            <text id="scene3-label-hp" x="240" y="350" font-size="14" fill="#c62828" class="hidden">h'=H-l=1.8m</text>

            <!-- 水平位移 x 箭头 -->
            <line id="scene3-arrow-x-line" x1="200" y1="420" x2="550" y2="420" stroke="#1565c0" stroke-width="2" marker-end="url(#scene3-arrowhead-blue)" marker-start="url(#scene3-arrowhead-blue)" class="hidden" />
            <text id="scene3-label-x" x="375" y="435" font-size="14" fill="#1565c0" text-anchor="middle" class="hidden">x=vt</text>

            <!-- 总距离 d 箭头 -->
            <line id="scene3-arrow-d-line" x1="50" y1="450" x2="550" y2="450" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene3-arrowhead-green)" marker-start="url(#scene3-arrowhead-green)" class="hidden" />
            <text id="scene3-label-d" x="300" y="465" font-size="14" fill="#2e7d32" text-anchor="middle" class="hidden">d=x+l·sinα</text>

            <!-- 平抛轨迹（抛物线） -->
            <path id="scene3-trajectory" d="M 200,300 Q 375,300 550,400" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="8,4" class="hidden" />

            <!-- 计算文本框 -->
            <rect id="scene3-box-t" x="600" y="340" width="180" height="30" fill="#f5f5f5" stroke="#c62828" stroke-width="1" class="hidden" />
            <text id="scene3-text-t" x="610" y="360" font-size="12" fill="#333" class="hidden">t=√(2h'/g)=0.6s</text>

            <rect id="scene3-box-v" x="600" y="375" width="180" height="30" fill="#f5f5f5" stroke="#1565c0" stroke-width="1" class="hidden" />
            <text id="scene3-text-v" x="610" y="395" font-size="12" fill="#333" class="hidden">v=4m/s, x=4×0.6=2.4m</text>

            <rect id="scene3-box-d" x="600" y="410" width="180" height="30" fill="#f5f5f5" stroke="#2e7d32" stroke-width="1" class="hidden" />
            <text id="scene3-text-d" x="610" y="430" font-size="12" fill="#333" class="hidden">d=2.4+2×0.8=4.0m</text>

            <!-- 控件栏 -->
            <g id="scene3-controls" transform="translate(0, 460)">
                <rect x="0" y="0" width="800" height="40" fill="#ffffff" opacity="0.9" />
                <rect id="scene3-btn-prev" x="300" y="5" width="100" height="30" fill="#f5f5f5" stroke="#333" stroke-width="1" rx="4" />
                <text x="350" y="25" font-size="14" text-anchor="middle" fill="#333">◀ 上一步</text>
                
                <text id="scene3-step-indicator" x="400" y="25" font-size="14" text-anchor="middle" fill="#333">步骤 0/4</text>
                
                <rect id="scene3-btn-next" x="450" y="5" width="100" height="30" fill="#f5f5f5" stroke="#333" stroke-width="1" rx="4" />
                <text x="500" y="25" font-size="14" text-anchor="middle" fill="#333">下一步 ▶</text>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 3: 平抛运动轨迹与水平距离计算
        // 布局坐标表（对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 悬挂点 O | 实心圆 | (200, 100) | r=6 | 右上方 (210, 90) | 蓝 #1565c0 |
        // | 最低点 B | 实心圆 | (200, 300) | r=5 | 右侧 (215, 295) | 蓝 #1565c0 |
        // | 初始位置 A | 实心圆 | (80, 260) | r=5 | 左下 (70, 275) | 灰 #9e9e9e |
        // | 绳 OA | 线段 | (200,100)-(80,260) | 2px | - | 灰 #9e9e9e |
        // | 绳 OB | 线段 | (200,100)-(200,300) | 2px | - | 蓝 #1565c0 |
        // | 水面线 | 实线 | (50,400)-(750,400) | 2px | - | 黑 #000000 |
        // | 浮台 | 矩形 | (550,395)-(750,405) | 200×10 | - | 绿 #2e7d32 |
        // | 平抛轨迹 | 抛物线 | (200,300) 到 (550,400) | 2px 虚线 | - | 蓝 #1565c0 |
        // | 竖直高度 h' | 双向箭头 | (230,300)-(230,400) | 2px | 右侧 (240,350) | 红 #c62828 |
        // | 水平位移 x | 双向箭头 | (200,420)-(550,420) | 2px | 下方 (375,435) | 蓝 #1565c0 |
        // | 总距离 d | 双向箭头 | (50,450)-(550,450) | 2px | 下方 (300,465) | 绿 #2e7d32 |

        let currentStep = 0;
        const totalSteps = 4;

        // 每步可见元素配置
        const stepConfig = {
            0: {
                // 初始状态：悬挂点 O、最低点 B、绳 OB、水面线、浮台、岸边、标注 H 和 l
                visible: ['scene3-point-o', 'scene3-label-o', 'scene3-point-b', 'scene3-label-b',
                          'scene3-rope-ob', 'scene3-label-l', 'scene3-ref-line', 'scene3-angle-arc', 'scene3-label-alpha',
                          'scene3-water-line', 'scene3-water-wave1', 'scene3-water-wave2', 'scene3-water-wave3',
                          'scene3-platform', 'scene3-label-platform', 'scene3-shore', 'scene3-shore-fill',
                          'scene3-arrow-h-line', 'scene3-arrow-h-top', 'scene3-arrow-h-bottom', 'scene3-label-h',
                          'scene3-point-a', 'scene3-label-a', 'scene3-rope-oa']
            },
            1: {
                // 步骤 1：显示平抛轨迹
                visible: ['scene3-point-o', 'scene3-label-o', 'scene3-point-b', 'scene3-label-b',
                          'scene3-rope-ob', 'scene3-label-l', 'scene3-ref-line', 'scene3-angle-arc', 'scene3-label-alpha',
                          'scene3-water-line', 'scene3-water-wave1', 'scene3-water-wave2', 'scene3-water-wave3',
                          'scene3-platform', 'scene3-label-platform', 'scene3-shore', 'scene3-shore-fill',
                          'scene3-arrow-h-line', 'scene3-arrow-h-top', 'scene3-arrow-h-bottom', 'scene3-label-h',
                          'scene3-point-a', 'scene3-label-a', 'scene3-rope-oa',
                          'scene3-trajectory']
            },
            2: {
                // 步骤 2：显示竖直高度 h' 和时间计算
                visible: ['scene3-point-o', 'scene3-label-o', 'scene3-point-b', 'scene3-label-b',
                          'scene3-rope-ob', 'scene3-label-l', 'scene3-ref-line', 'scene3-angle-arc', 'scene3-label-alpha',
                          'scene3-water-line', 'scene3-water-wave1', 'scene3-water-wave2', 'scene3-water-wave3',
                          'scene3-platform', 'scene3-label-platform', 'scene3-shore', 'scene3-shore-fill',
                          'scene3-arrow-h-line', 'scene3-arrow-h-top', 'scene3-arrow-h-bottom', 'scene3-label-h',
                          'scene3-point-a', 'scene3-label-a', 'scene3-rope-oa',
                          'scene3-trajectory',
                          'scene3-arrow-hp-line', 'scene3-label-hp',
                          'scene3-box-t', 'scene3-text-t']
            },
            3: {
                // 步骤 3：显示水平位移 x 和速度计算
                visible: ['scene3-point-o', 'scene3-label-o', 'scene3-point-b', 'scene3-label-b',
                          'scene3-rope-ob', 'scene3-label-l', 'scene3-ref-line', 'scene3-angle-arc', 'scene3-label-alpha',
                          'scene3-water-line', 'scene3-water-wave1', 'scene3-water-wave2', 'scene3-water-wave3',
                          'scene3-platform', 'scene3-label-platform', 'scene3-shore', 'scene3-shore-fill',
                          'scene3-arrow-h-line', 'scene3-arrow-h-top', 'scene3-arrow-h-bottom', 'scene3-label-h',
                          'scene3-point-a', 'scene3-label-a', 'scene3-rope-oa',
                          'scene3-trajectory',
                          'scene3-arrow-hp-line', 'scene3-label-hp',
                          'scene3-box-t', 'scene3-text-t',
                          'scene3-arrow-x-line', 'scene3-label-x',
                          'scene3-box-v', 'scene3-text-v']
            },
            4: {
                // 步骤 4：显示总距离 d 和最终结果
                visible: ['scene3-point-o', 'scene3-label-o', 'scene3-point-b', 'scene3-label-b',
                          'scene3-rope-ob', 'scene3-label-l', 'scene3-ref-line', 'scene3-angle-arc', 'scene3-label-alpha',
                          'scene3-water-line', 'scene3-water-wave1', 'scene3-water-wave2', 'scene3-water-wave3',
                          'scene3-platform', 'scene3-label-platform', 'scene3-shore', 'scene3-shore-fill',
                          'scene3-arrow-h-line', 'scene3-arrow-h-top', 'scene3-arrow-h-bottom', 'scene3-label-h',
                          'scene3-point-a', 'scene3-label-a', 'scene3-rope-oa',
                          'scene3-trajectory',
                          'scene3-arrow-hp-line', 'scene3-label-hp',
                          'scene3-box-t', 'scene3-text-t',
                          'scene3-arrow-x-line', 'scene3-label-x',
                          'scene3-box-v', 'scene3-text-v',
                          'scene3-arrow-offset-line', 'scene3-label-offset',
                          'scene3-arrow-d-line', 'scene3-label-d',
                          'scene3-box-d', 'scene3-text-d']
            }
        };

        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('hidden');
                el.style.display = '';
                el.style.opacity = '1';
            }
        }

        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.add('hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        function updateDisplay() {
            // 隐藏所有可切换元素
            const allElements = [
                'scene3-trajectory',
                'scene3-arrow-hp-line', 'scene3-label-hp',
                'scene3-arrow-x-line', 'scene3-label-x',
                'scene3-arrow-offset-line', 'scene3-label-offset',
                'scene3-arrow-d-line', 'scene3-label-d',
                'scene3-box-t', 'scene3-text-t',
                'scene3-box-v', 'scene3-text-v',
                'scene3-box-d', 'scene3-text-d'
            ];

            allElements.forEach(id => hideElement(id));

            // 显示当前步骤的元素
            const config = stepConfig[currentStep];
            if (config) {
                config.visible.forEach(id => showElement(id));
            }

            // 更新步骤指示器
            const indicator = document.getElementById('scene3-step-indicator');
            if (indicator) {
                indicator.textContent = `步骤 ${currentStep}/${totalSteps}`;
            }

            // 更新按钮状态
            const prevBtn = document.getElementById('scene3-btn-prev');
            const nextBtn = document.getElementById('scene3-btn-next');
            
            if (prevBtn) {
                prevBtn.style.opacity = currentStep === 0 ? '0.5' : '1';
                prevBtn.style.cursor = currentStep === 0 ? 'not-allowed' : 'pointer';
            }
            if (nextBtn) {
                nextBtn.style.opacity = currentStep === totalSteps ? '0.5' : '1';
                nextBtn.style.cursor = currentStep === totalSteps ? 'not-allowed' : 'pointer';
            }
        }

        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        }

        function nextStep() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateDisplay();
            }
        }

        // 绑定按钮事件
        document.getElementById('scene3-btn-prev').addEventListener('click', prevStep);
        document.getElementById('scene3-btn-next').addEventListener('click', nextStep);

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
