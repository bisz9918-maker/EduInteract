<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>能量转化关系 - 场景3</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-svg { width: 800px; height: 500px; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene3-btn { padding: 8px 20px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f0f0f0; }
        .scene3-btn:hover { background: #e0e0e0; }
        .scene3-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene3-hidden { display: none; opacity: 0; }
        .scene3-visible { display: block; opacity: 1; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 标题 -->
            <text id="scene3-title" x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">能量转化关系</text>

            <!-- 初动能条形 (高度180px, 从y=80到y=260) -->
            <g id="scene3-group-ek-initial">
                <rect id="scene3-bar-ek-initial" x="80" y="80" width="60" height="180" fill="#1565c0" />
                <text id="scene3-label-ek-initial" x="110" y="70" text-anchor="middle" font-size="14" fill="#000000">E_k 初</text>
            </g>

            <!-- 末动能条形 (高度60px, 从y=200到y=260) -->
            <g id="scene3-group-ek-final" class="scene3-hidden">
                <rect id="scene3-bar-ek-final" x="180" y="200" width="60" height="60" fill="#1565c0" fill-opacity="0.3" />
                <text id="scene3-label-ek-final" x="210" y="190" text-anchor="middle" font-size="14" fill="#000000">E_k 末</text>
            </g>

            <!-- 弹性势能条形 (高度100px, 从y=140到y=240) -->
            <g id="scene3-group-ep" class="scene3-hidden">
                <rect id="scene3-bar-ep" x="280" y="140" width="60" height="100" fill="#2e7d32" />
                <text id="scene3-label-ep" x="310" y="130" text-anchor="middle" font-size="14" fill="#000000">E_p</text>
            </g>

            <!-- 摩擦生热条形 (高度80px, 从y=160到y=240) -->
            <g id="scene3-group-q" class="scene3-hidden">
                <rect id="scene3-bar-q" x="380" y="160" width="60" height="80" fill="#c62828" />
                <text id="scene3-label-q" x="410" y="150" text-anchor="middle" font-size="14" fill="#000000">Q_摩擦</text>
            </g>

            <!-- 能量流向箭头 -->
            <g id="scene3-group-arrows" class="scene3-hidden">
                <!-- 箭头1: 初动能→末动能 -->
                <path id="scene3-arrow-1" d="M 150 120 Q 160 170 170 220" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene3-arrowhead)" />
                <!-- 箭头2: 初动能→弹性势能 -->
                <path id="scene3-arrow-2" d="M 150 120 Q 210 150 270 180" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene3-arrowhead)" />
                <!-- 箭头3: 初动能→摩擦生热 -->
                <path id="scene3-arrow-3" d="M 150 120 Q 260 160 370 200" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene3-arrowhead)" />
            </g>

            <!-- 箭头标记定义 -->
            <defs>
                <marker id="scene3-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#000000" />
                </marker>
            </defs>

            <!-- 弹簧压缩示意图 -->
            <g id="scene3-spring-group" class="scene3-hidden">
                <!-- 小车轮廓 -->
                <rect x="450" y="100" width="200" height="60" fill="none" stroke="#000000" stroke-width="2" />
                <!-- 车轮 -->
                <circle cx="480" cy="160" r="10" fill="#333" />
                <circle cx="620" cy="160" r="10" fill="#333" />
                <!-- 左侧挡板 -->
                <rect x="450" y="70" width="10" height="30" fill="#333" />
                <!-- 弹簧 (锯齿线，压缩状态) -->
                <path id="scene3-spring" d="M 470 130 L 480 125 L 490 135 L 500 125 L 510 135 L 520 125 L 530 135 L 540 125 L 550 135 L 560 125 L 570 135 L 580 125 L 590 130" stroke="#666" stroke-width="2" fill="none" />
                <!-- 滑块 -->
                <rect x="590" y="110" width="40" height="40" fill="#888" stroke="#000" stroke-width="1" />
                <!-- 压缩量d标注 - 双箭头 -->
                <line x1="470" y1="155" x2="590" y2="155" stroke="#000" stroke-width="1" />
                <line x1="470" y1="150" x2="470" y2="160" stroke="#000" stroke-width="1" />
                <line x1="590" y1="150" x2="590" y2="160" stroke="#000" stroke-width="1" />
                <text x="530" y="175" text-anchor="middle" font-size="12" fill="#000000">d=0.50m</text>
            </g>

            <!-- 能量方程框 -->
            <g id="scene3-group-equation" class="scene3-hidden">
                <rect id="scene3-equation-box" x="420" y="280" width="340" height="80" fill="#ffffff" stroke="#000000" stroke-width="1" />
                <text id="scene3-equation-text" x="590" y="310" text-anchor="middle" font-size="16" fill="#000000">ΔE_k = E_p + Q_摩擦</text>
                <text id="scene3-equation-detail" x="590" y="335" text-anchor="middle" font-size="14" fill="#333333">E_k 初 - E_k 末 = E_p + Q_摩擦</text>
                <text id="scene3-label-delta-ek" x="100" y="270" text-anchor="middle" font-size="14" fill="#000000">ΔE_k</text>
            </g>

            <!-- 控件栏 (放在SVG内部底部) -->
            <g id="scene3-controls-group">
                <rect id="scene3-btn-prev-bg" x="280" y="450" width="100" height="35" fill="#f0f0f0" stroke="#333" stroke-width="1" rx="4" />
                <text id="scene3-btn-prev-text" x="330" y="472" text-anchor="middle" font-size="14" fill="#000000">◀ 上一步</text>
                
                <rect id="scene3-btn-next-bg" x="420" y="450" width="100" height="35" fill="#f0f0f0" stroke="#333" stroke-width="1" rx="4" />
                <text id="scene3-btn-next-text" x="470" y="472" text-anchor="middle" font-size="14" fill="#000000">下一步 ▶</text>
                
                <text id="scene3-step-indicator" x="400" y="472" text-anchor="middle" font-size="14" fill="#666666">步骤 1/3</text>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 3 实现 - 能量转化关系

        // 状态变量
        let currentStep = 0;
        const totalSteps = 3;

        // 获取DOM元素
        const btnPrevBg = document.getElementById('scene3-btn-prev-bg');
        const btnPrevText = document.getElementById('scene3-btn-prev-text');
        const btnNextBg = document.getElementById('scene3-btn-next-bg');
        const btnNextText = document.getElementById('scene3-btn-next-text');
        const stepIndicator = document.getElementById('scene3-step-indicator');

        // 元素组
        const groupEkInitial = document.getElementById('scene3-group-ek-initial');
        const groupEkFinal = document.getElementById('scene3-group-ek-final');
        const groupEp = document.getElementById('scene3-group-ep');
        const groupQ = document.getElementById('scene3-group-q');
        const groupArrows = document.getElementById('scene3-group-arrows');
        const groupSpring = document.getElementById('scene3-spring-group');
        const groupEquation = document.getElementById('scene3-group-equation');

        // 显示/隐藏工具函数
        function show(el) {
            if (el) {
                el.classList.remove('scene3-hidden');
                el.classList.add('scene3-visible');
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }

        function hide(el) {
            if (el) {
                el.classList.remove('scene3-visible');
                el.classList.add('scene3-hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 更新步骤显示
        function updateStep() {
            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;

            // 根据步骤显示/隐藏元素
            if (currentStep === 0) {
                // 初始状态：只显示初动能
                show(groupEkInitial);
                hide(groupEkFinal);
                hide(groupEp);
                hide(groupQ);
                hide(groupArrows);
                hide(groupSpring);
                hide(groupEquation);
            } else if (currentStep === 1) {
                // 步骤1：显示末态能量分配
                show(groupEkInitial);
                show(groupEkFinal);
                show(groupEp);
                show(groupQ);
                show(groupArrows);
                show(groupSpring);
                hide(groupEquation);
            } else if (currentStep === 2) {
                // 步骤2：显示能量守恒方程
                show(groupEkInitial);
                show(groupEkFinal);
                show(groupEp);
                show(groupQ);
                show(groupArrows);
                show(groupSpring);
                show(groupEquation);
            }

            // 更新按钮状态
            btnPrevBg.style.opacity = currentStep === 0 ? '0.5' : '1';
            btnPrevText.style.opacity = currentStep === 0 ? '0.5' : '1';
            btnNextBg.style.opacity = currentStep === totalSteps - 1 ? '0.5' : '1';
            btnNextText.style.opacity = currentStep === totalSteps - 1 ? '0.5' : '1';
        }

        // 按钮点击处理
        btnPrevBg.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        btnNextBg.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStep();
            }
        });

        // 设置按钮点击区域（让整个按钮区域可点击）
        btnPrevBg.style.cursor = 'pointer';
        btnNextBg.style.cursor = 'pointer';

        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
