<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>场景 2：运动过程与力 - 速度关系动态演示</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .axis { stroke: #000000; stroke-width: 2; fill: none; }
        .tick { stroke: #000000; stroke-width: 1; }
        .vt-curve { stroke: #1565c0; stroke-width: 3; fill: none; }
        .fa-curve { stroke: #c62828; stroke-width: 3; fill: none; }
        .fnet-curve { stroke: #2e7d32; stroke-width: 3; fill: none; }
        .stable-point { fill: #2e7d32; fill-opacity: 0.3; }
        .stable-point-highlight { fill: #2e7d32; fill-opacity: 0.8; }
        .slider-track { stroke: #888888; stroke-width: 8; stroke-linecap: round; }
        .slider-handle { fill: #1565c0; cursor: pointer; }
        .highlight-point { fill: #1565c0; }
        .highlight-point-fa { fill: #c62828; }
        .highlight-point-fnet { fill: #2e7d32; }
        .value-label { font-size: 14px; fill: #000000; }
        .axis-label { font-size: 14px; fill: #000000; }
        .stable-label { font-size: 12px; fill: #2e7d32; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <!-- SVG 图示区：固定 800×500px -->
        <svg id="scene2-svg" width="800" height="500">
            <!-- 左侧 v-t 坐标系 -->
            <g id="scene2-vt-group">
                <!-- 坐标轴 -->
                <line id="scene2-vt-y-axis" x1="50" y1="50" x2="50" y2="350" class="axis"/>
                <line id="scene2-vt-x-axis" x1="50" y1="350" x2="350" y2="350" class="axis"/>
                <!-- 刻度线 -->
                <g id="scene2-vt-ticks">
                    <line x1="45" y1="350" x2="50" y2="350" class="tick"/><text x="35" y="355" font-size="10">0</text>
                    <line x1="45" y1="290" x2="50" y2="290" class="tick"/><text x="30" y="295" font-size="10">0.5</text>
                    <line x1="45" y1="230" x2="50" y2="230" class="tick"/><text x="35" y="235" font-size="10">1.0</text>
                    <line x1="45" y1="170" x2="50" y2="170" class="tick"/><text x="30" y="175" font-size="10">1.5</text>
                    <line x1="45" y1="110" x2="50" y2="110" class="tick"/><text x="30" y="115" font-size="10">2.0</text>
                    <line x1="45" y1="50" x2="50" y2="50" class="tick"/><text x="30" y="55" font-size="10">2.5</text>
                    <line x1="50" y1="355" x2="50" y2="350" class="tick"/><text x="45" y="370" font-size="10">0</text>
                    <line x1="110" y1="355" x2="110" y2="350" class="tick"/><text x="105" y="370" font-size="10">1</text>
                    <line x1="170" y1="355" x2="170" y2="350" class="tick"/><text x="165" y="370" font-size="10">2</text>
                    <line x1="230" y1="355" x2="230" y2="350" class="tick"/><text x="225" y="370" font-size="10">3</text>
                    <line x1="290" y1="355" x2="290" y2="350" class="tick"/><text x="285" y="370" font-size="10">4</text>
                    <line x1="350" y1="355" x2="350" y2="350" class="tick"/><text x="345" y="370" font-size="10">5</text>
                </g>
                <!-- v-t 曲线：v(t) = 2*(1 - e^(-2t))，t 从 0 到 5 -->
                <path id="scene2-vt-curve" class="vt-curve" d="M 50,350 L 62,326 L 74,302 L 86,279 L 98,258 L 110,238 L 122,220 L 134,204 L 146,189 L 158,176 L 170,164 L 182,154 L 194,145 L 206,137 L 218,130 L 230,124 L 242,119 L 254,115 L 266,112 L 278,109 L 290,107 L 302,105 L 314,103 L 326,102 L 338,101 L 350,100"/>
                <!-- v-t 图上的高亮点 -->
                <circle id="scene2-vt-highlight" class="highlight-point" r="5" cx="50" cy="350" style="display:none;"/>
                <!-- 轴标签 -->
                <text id="scene2-vt-y-label" x="30" y="200" class="axis-label">v(m/s)</text>
                <text id="scene2-vt-x-label" x="340" y="370" class="axis-label">t(s)</text>
            </g>

            <!-- 右侧 F-v 坐标系 -->
            <g id="scene2-fv-group">
                <!-- 坐标轴 -->
                <line id="scene2-fv-y-axis" x1="450" y1="50" x2="450" y2="350" class="axis"/>
                <line id="scene2-fv-x-axis" x1="450" y1="350" x2="750" y2="350" class="axis"/>
                <!-- 刻度线 -->
                <g id="scene2-fv-ticks">
                    <line x1="445" y1="350" x2="450" y2="350" class="tick"/><text x="430" y="355" font-size="10">0</text>
                    <line x1="445" y1="290" x2="450" y2="290" class="tick"/><text x="435" y="295" font-size="10">0.5</text>
                    <line x1="445" y1="230" x2="450" y2="230" class="tick"/><text x="440" y="235" font-size="10">1.0</text>
                    <line x1="445" y1="170" x2="450" y2="170" class="tick"/><text x="440" y="175" font-size="10">1.5</text>
                    <line x1="445" y1="110" x2="450" y2="110" class="tick"/><text x="440" y="115" font-size="10">2.0</text>
                    <line x1="445" y1="50" x2="450" y2="50" class="tick"/><text x="440" y="55" font-size="10">2.5</text>
                    <line x1="450" y1="355" x2="450" y2="350" class="tick"/><text x="445" y="370" font-size="10">0</text>
                    <line x1="510" y1="355" x2="510" y2="350" class="tick"/><text x="505" y="370" font-size="10">0.5</text>
                    <line x1="570" y1="355" x2="570" y2="350" class="tick"/><text x="565" y="370" font-size="10">1.0</text>
                    <line x1="630" y1="355" x2="630" y2="350" class="tick"/><text x="625" y="370" font-size="10">1.5</text>
                    <line x1="690" y1="355" x2="690" y2="350" class="tick"/><text x="685" y="370" font-size="10">2.0</text>
                    <line x1="750" y1="355" x2="750" y2="350" class="tick"/><text x="745" y="370" font-size="10">2.5</text>
                </g>
                <!-- F_A 曲线：F_A = v，从 (450,350) 到 (750,150) -->
                <path id="scene2-fa-curve" class="fa-curve" d="M 450,350 L 750,150"/>
                <!-- F_net 曲线：F_net = 2 - v，从 (450,230) 到 (750,350) -->
                <path id="scene2-fnet-curve" class="fnet-curve" d="M 450,230 L 750,350"/>
                <!-- 稳定点标记 -->
                <circle id="scene2-stable-point" class="stable-point" r="6" cx="690" cy="230"/>
                <text id="scene2-stable-label" x="695" y="220" class="stable-label" style="display:none;">稳定状态</text>
                <!-- F-v 图上的高亮点 -->
                <circle id="scene2-fa-highlight" class="highlight-point-fa" r="5" cx="450" cy="350" style="display:none;"/>
                <circle id="scene2-fnet-highlight" class="highlight-point-fnet" r="5" cx="450" cy="230" style="display:none;"/>
                <!-- 轴标签 -->
                <text id="scene2-fv-y-label" x="420" y="200" class="axis-label">F(N)</text>
                <text id="scene2-fv-x-label" x="740" y="370" class="axis-label">v(m/s)</text>
            </g>

            <!-- 数值显示区 -->
            <g id="scene2-values-group">
                <rect x="500" y="380" width="130" height="50" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
                <text id="scene2-val-v" x="510" y="400" class="value-label">v=0.0m/s</text>
                <text id="scene2-val-fa" x="510" y="420" class="value-label">F_A=0.0N</text>
                <rect x="640" y="380" width="130" height="50" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
                <text id="scene2-val-fnet" x="650" y="400" class="value-label">F_net=2.0N</text>
                <text id="scene2-val-a" x="650" y="420" class="value-label">a=10.0m/s²</text>
            </g>

            <!-- 速度滑块 -->
            <g id="scene2-slider-group">
                <line id="scene2-slider-track" x1="100" y1="460" x2="700" y2="460" class="slider-track"/>
                <circle id="scene2-slider-handle" class="slider-handle" r="12" cx="100" cy="460"/>
                <text x="90" y="485" font-size="12">0</text>
                <text x="680" y="485" font-size="12">2.5 m/s</text>
            </g>
        </svg>

        <!-- 控件栏叠在 SVG 底部 -->
        <div id="scene2-controls"></div>
    </div>

    <script>
    (function() {
        // Scene 2 实现：速度滑块拖拽交互
        // 布局坐标表（对照 spec.json）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 备注 |
        // |------|------|-----------|------|------|
        // | 左侧坐标系 | 坐标轴 | (50,50)-(350,350) | 300×300 | v-t 图区域 |
        // | 右侧坐标系 | 坐标轴 | (450,50)-(750,350) | 300×300 | F-v 图区域 |
        // | v-t 曲线 | 路径 | (50,350)→(350,100) | 曲线 | 蓝色渐近线 |
        // | F_A 曲线 | 路径 | (450,350)→(750,150) | 直线 | 红色线性增加 |
        // | F_net 曲线 | 路径 | (450,230)→(750,350) | 直线 | 绿色线性减小 |
        // | 稳定点标记 | 圆点 | (690,230) | r=6 | 绿色填充 (v=2.0m/s) |
        // | 速度滑块轨道 | 线段 | (100,460)-(700,460) | 600×8 | 灰色 |
        // | 滑块手柄 | 圆形 | 随 v 变化 | r=12 | 蓝色可拖拽 |
        // | 数值显示区 | 文本框 | (500,380)-(780,430) | 显示 v/F_A/F_net/a |

        // 物理常量
        const V_STABLE = 2.0; // 稳定速度 m/s
        const F = 3.0; // 恒力 N
        const f = 1.0; // 摩擦力 μmg = 0.5*0.2*10 = 1N
        const m = 0.2; // 质量 kg

        // 滑块参数
        const SLIDER_X_MIN = 100;
        const SLIDER_X_MAX = 700;
        const SLIDER_RANGE = SLIDER_X_MAX - SLIDER_X_MIN;
        const V_MAX = 2.5;

        // 坐标映射函数
        function vToX(v) {
            return SLIDER_X_MIN + (v / V_MAX) * SLIDER_RANGE;
        }

        function xToV(x) {
            const clampedX = Math.max(SLIDER_X_MIN, Math.min(SLIDER_X_MAX, x));
            return ((clampedX - SLIDER_X_MIN) / SLIDER_RANGE) * V_MAX;
        }

        // v-t 图坐标映射：t(0-5) -> x(50-350), v(0-2.5) -> y(350-50)
        function vtMap(t, v) {
            const x = 50 + (t / 5) * 300;
            const y = 350 - (v / 2.5) * 300;
            return { x, y };
        }

        // F-v 图坐标映射：v(0-2.5) -> x(450-750), F(0-3.5) -> y(350-50)
        function fvMap(v, F_val) {
            const x = 450 + (v / 2.5) * 300;
            const y = 350 - (F_val / 3.5) * 300;
            return { x, y };
        }

        // 计算物理量
        function calcPhysics(v) {
            const F_A = v; // F_A = B²L²v/(R+r) = v (因为 B²L²/(R+r) = 1)
            const F_net = F - F_A - f; // = 3 - v - 1 = 2 - v
            const a = F_net / m; // = (2-v)/0.2 = 10 - 5v
            return { F_A, F_net, a };
        }

        // 更新显示
        function updateDisplay(v) {
            const { F_A, F_net, a } = calcPhysics(v);
            
            document.getElementById('scene2-val-v').textContent = `v=${v.toFixed(1)}m/s`;
            document.getElementById('scene2-val-fa').textContent = `F_A=${F_A.toFixed(1)}N`;
            document.getElementById('scene2-val-fnet').textContent = `F_net=${F_net.toFixed(1)}N`;
            document.getElementById('scene2-val-a').textContent = `a=${a.toFixed(1)}m/s²`;

            // 更新滑块手柄位置
            const handle = document.getElementById('scene2-slider-handle');
            handle.setAttribute('cx', vToX(v));

            // 更新 v-t 图高亮点
            const t_for_v = -0.5 * Math.log(1 - v / V_STABLE); // 反解 v(t) = 2*(1-e^(-2t))
            const vtPoint = vtMap(Math.min(t_for_v, 5), v);
            const vtHighlight = document.getElementById('scene2-vt-highlight');
            if (v > 0 && v < V_STABLE) {
                vtHighlight.setAttribute('cx', vtPoint.x);
                vtHighlight.setAttribute('cy', vtPoint.y);
                vtHighlight.style.display = 'block';
            } else {
                vtHighlight.style.display = 'none';
            }

            // 更新 F-v 图高亮点
            const faPoint = fvMap(v, F_A);
            const fnetPoint = fvMap(v, F_net);
            const faHighlight = document.getElementById('scene2-fa-highlight');
            const fnetHighlight = document.getElementById('scene2-fnet-highlight');
            
            faHighlight.setAttribute('cx', faPoint.x);
            faHighlight.setAttribute('cy', faPoint.y);
            fnetHighlight.setAttribute('cx', fnetPoint.x);
            fnetHighlight.setAttribute('cy', fnetPoint.y);
            
            if (v >= 0 && v <= V_MAX) {
                faHighlight.style.display = 'block';
                fnetHighlight.style.display = 'block';
            } else {
                faHighlight.style.display = 'none';
                fnetHighlight.style.display = 'none';
            }

            // 稳定点高亮检测
            const stablePoint = document.getElementById('scene2-stable-point');
            const stableLabel = document.getElementById('scene2-stable-label');
            if (Math.abs(v - V_STABLE) < 0.05) {
                stablePoint.classList.remove('stable-point');
                stablePoint.classList.add('stable-point-highlight');
                stableLabel.style.display = 'block';
            } else {
                stablePoint.classList.remove('stable-point-highlight');
                stablePoint.classList.add('stable-point');
                stableLabel.style.display = 'none';
            }
        }

        // 拖拽交互
        let isDragging = false;
        const handle = document.getElementById('scene2-slider-handle');
        const svg = document.getElementById('scene2-svg');

        function startDrag(e) {
            isDragging = true;
            e.preventDefault();
        }

        function doDrag(e) {
            if (!isDragging) return;
            e.preventDefault();
            
            const rect = svg.getBoundingClientRect();
            let clientX;
            if (e.touches) {
                clientX = e.touches[0].clientX;
            } else {
                clientX = e.clientX;
            }
            
            const x = clientX - rect.left;
            const v = xToV(x);
            updateDisplay(v);
        }

        function endDrag(e) {
            isDragging = false;
        }

        // 事件绑定
        handle.addEventListener('mousedown', startDrag);
        handle.addEventListener('touchstart', startDrag);
        
        svg.addEventListener('mousemove', doDrag);
        svg.addEventListener('touchmove', doDrag);
        
        svg.addEventListener('mouseup', endDrag);
        svg.addEventListener('touchend', endDrag);
        svg.addEventListener('mouseleave', endDrag);

        // 初始化显示
        updateDisplay(0);

    })();
    </script>
</body>
</html>
