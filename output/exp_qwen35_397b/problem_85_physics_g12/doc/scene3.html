<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>过程 (2)：活塞 a 上升与氧气等温压缩</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-svg { width: 800px; height: 500px; }
        .scene3-btn { position: absolute; bottom: 20px; padding: 8px 16px; font-size: 14px; cursor: pointer; background: #1565c0; color: white; border: none; border-radius: 4px; }
        #scene3-btn-prev { left: 280px; }
        #scene3-btn-next { left: 480px; }
        #scene3-step-indicator { position: absolute; bottom: 25px; left: 400px; transform: translateX(-50%); font-size: 14px; color: #333; }
        .scene3-hidden { opacity: 0; }
        .scene3-visible { opacity: 1; transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 标题 -->
            <text id="scene3-title" x="400" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">过程 (2)：活塞 a 上升与氧气等温压缩</text>
            
            <!-- A 气缸壁 -->
            <line id="scene3-cylinder-a-left" x1="120" y1="160" x2="120" y2="400" stroke="#000" stroke-width="4"/>
            <line id="scene3-cylinder-a-right" x1="280" y1="160" x2="280" y2="400" stroke="#000" stroke-width="4"/>
            <line id="scene3-cylinder-a-top" x1="120" y1="160" x2="280" y2="160" stroke="#000" stroke-width="4"/>
            
            <!-- B 气缸壁 -->
            <line id="scene3-cylinder-b-left" x1="520" y1="160" x2="520" y2="400" stroke="#000" stroke-width="4"/>
            <line id="scene3-cylinder-b-right" x1="600" y1="160" x2="600" y2="400" stroke="#000" stroke-width="4"/>
            
            <!-- 连通管 -->
            <path id="scene3-connecting-tube" d="M 280 380 L 520 380 L 520 400" stroke="#000" stroke-width="4" fill="none"/>
            <line id="scene3-bottom-tube" x1="120" y1="400" x2="280" y2="400" stroke="#000" stroke-width="4"/>
            
            <!-- 电阻丝（波浪线） -->
            <path id="scene3-heater" d="M 150 385 Q 162 375 175 385 T 200 385 T 225 385 T 250 385" stroke="#e53935" stroke-width="2" fill="none"/>
            
            <!-- 氮气区域（活塞 a 下方及 B 气缸） -->
            <rect id="scene3-nitrogen-area-a" x="120" y="220" width="160" height="180" fill="#4caf50" opacity="0.15"/>
            <rect id="scene3-nitrogen-area-b" x="520" y="160" width="80" height="240" fill="#4caf50" opacity="0.15"/>
            <rect id="scene3-connecting-nitrogen" x="280" y="380" width="240" height="20" fill="#4caf50" opacity="0.15"/>
            
            <!-- 氧气区域初始状态 -->
            <rect id="scene3-oxygen-area-initial" x="120" y="160" width="160" height="60" fill="#1565c0" opacity="0.2"/>
            
            <!-- 氧气区域末态 -->
            <rect id="scene3-oxygen-area-final" x="120" y="160" width="160" height="45" fill="#1565c0" opacity="0.3" class="scene3-hidden"/>
            
            <!-- 活塞 a 初始位置（虚线灰色） -->
            <line id="scene3-piston-a-initial" x1="120" y1="220" x2="280" y2="220" stroke="#888888" stroke-width="6" stroke-dasharray="8,4"/>
            
            <!-- 活塞 a 末态位置（实线黑色） -->
            <line id="scene3-piston-a-final" x1="120" y1="205" x2="280" y2="205" stroke="#000" stroke-width="6" class="scene3-hidden"/>
            
            <!-- 活塞 b（固定在顶部） -->
            <line id="scene3-piston-b" x1="520" y1="160" x2="600" y2="160" stroke="#888888" stroke-width="6"/>
            
            <!-- 锁定符号 -->
            <g id="scene3-lock-icon" class="scene3-hidden">
                <rect x="550" y="135" width="20" height="15" fill="none" stroke="#888888" stroke-width="2"/>
                <line x1="560" y1="135" x2="560" y2="142" stroke="#888888" stroke-width="2"/>
                <line x1="555" y1="142" x2="565" y2="142" stroke="#888888" stroke-width="2"/>
            </g>
            
            <!-- 位移箭头 -->
            <g id="scene3-arrow-displacement" class="scene3-hidden">
                <line x1="290" y1="220" x2="290" y2="205" stroke="#1565c0" stroke-width="2" marker-end="url(#scene3-arrowhead)"/>
                <polygon points="290,205 285,215 295,215" fill="#1565c0"/>
            </g>
            
            <!-- 箭头定义 -->
            <defs>
                <marker id="scene3-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#1565c0"/>
                </marker>
            </defs>
            
            <!-- 标签 -->
            <text id="scene3-label-p0" x="200" y="145" text-anchor="middle" font-size="16" fill="#333" class="scene3-hidden">$P_0$</text>
            <text id="scene3-label-p1" x="200" y="145" text-anchor="middle" font-size="16" fill="#1565c0" font-weight="bold" class="scene3-hidden">$P'$</text>
            <text id="scene3-label-vo1" x="320" y="195" font-size="16" fill="#333" class="scene3-hidden">$V_{O1}$</text>
            <text id="scene3-label-vo2" x="320" y="175" font-size="16" fill="#1565c0" font-weight="bold" class="scene3-hidden">$V_{O2}$</text>
            <text id="scene3-label-displacement" x="305" y="217" font-size="14" fill="#1565c0" class="scene3-hidden">$H/16$</text>
            <text id="scene3-label-lock" x="560" y="130" text-anchor="middle" font-size="12" fill="#888888" class="scene3-hidden">锁定</text>
            
            <!-- 公式框 -->
            <g id="scene3-formula-box" class="scene3-hidden">
                <rect x="650" y="180" width="130" height="120" fill="white" stroke="#1565c0" stroke-width="2" rx="5"/>
                <text x="715" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0">玻意耳定律</text>
                <text x="715" y="230" text-anchor="middle" font-size="13" fill="#333">$P_0 V_{O1} = P' V_{O2}$</text>
                <text x="715" y="255" text-anchor="middle" font-size="12" fill="#333">$V_{O1} = S_A \cdot \frac{H}{4}$</text>
                <text x="715" y="275" text-anchor="middle" font-size="12" fill="#333">$V_{O2} = S_A \cdot \frac{3H}{16}$</text>
                <text x="715" y="295" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565c0">$P' = P_0 \cdot \frac{4}{3}$</text>
            </g>
            
            <!-- 步骤指示器和按钮 -->
            <text id="scene3-step-indicator" x="400" y="475" text-anchor="middle" font-size="14" fill="#333">步骤 0/4</text>
        </svg>
        
        <button id="scene3-btn-prev" class="scene3-btn">◀ 上一步</button>
        <button id="scene3-btn-next" class="scene3-btn">下一步 ▶</button>
    </div>
    
    <script>
    (function() {
        // Scene 3 实现：过程 (2) — 活塞 a 上升与氧气等温压缩
        
        let currentState = 0;
        const totalSteps = 4;
        
        // 获取所有元素
        const elements = {
            oxygenInitial: document.getElementById('scene3-oxygen-area-initial'),
            oxygenFinal: document.getElementById('scene3-oxygen-area-final'),
            pistonAInitial: document.getElementById('scene3-piston-a-initial'),
            pistonAFinal: document.getElementById('scene3-piston-a-final'),
            lockIcon: document.getElementById('scene3-lock-icon'),
            labelLock: document.getElementById('scene3-label-lock'),
            arrowDisplacement: document.getElementById('scene3-arrow-displacement'),
            labelP0: document.getElementById('scene3-label-p0'),
            labelP1: document.getElementById('scene3-label-p1'),
            labelVO1: document.getElementById('scene3-label-vo1'),
            labelVO2: document.getElementById('scene3-label-vo2'),
            labelDisplacement: document.getElementById('scene3-label-displacement'),
            formulaBox: document.getElementById('scene3-formula-box'),
            stepIndicator: document.getElementById('scene3-step-indicator'),
            btnPrev: document.getElementById('scene3-btn-prev'),
            btnNext: document.getElementById('scene3-btn-next')
        };
        
        // 显示/隐藏工具函数
        function show(el) {
            if (el) {
                el.classList.remove('scene3-hidden');
                el.classList.add('scene3-visible');
                el.style.opacity = '1';
                el.style.display = '';
            }
        }
        
        function hide(el) {
            if (el) {
                el.classList.remove('scene3-visible');
                el.classList.add('scene3-hidden');
                el.style.opacity = '0';
                // 对于需要完全隐藏的元素，设置 display 为 none
                if (el.id.includes('formula') || el.id.includes('label')) {
                    el.style.display = 'none';
                }
            }
        }
        
        // 更新步骤显示
        function updateStep() {
            // 重置所有元素
            hide(elements.oxygenFinal);
            hide(elements.pistonAFinal);
            hide(elements.lockIcon);
            hide(elements.labelLock);
            hide(elements.arrowDisplacement);
            hide(elements.labelP0);
            hide(elements.labelP1);
            hide(elements.labelVO1);
            hide(elements.labelVO2);
            hide(elements.labelDisplacement);
            hide(elements.formulaBox);
            
            // 恢复初始氧气区域透明度
            elements.oxygenInitial.setAttribute('opacity', '0.2');
            
            // 根据当前状态显示相应元素
            switch (currentState) {
                case 0:
                    // 初始状态：只显示基本结构
                    break;
                    
                case 1:
                    // 步骤 1：高亮氧气区域，显示初始参量
                    show(elements.labelP0);
                    show(elements.labelVO1);
                    break;
                    
                case 2:
                    // 步骤 2：活塞 a 上升动画
                    show(elements.labelP0);
                    show(elements.labelVO1);
                    show(elements.lockIcon);
                    show(elements.labelLock);
                    show(elements.arrowDisplacement);
                    show(elements.labelDisplacement);
                    
                    // 动画：活塞 a 从初始位置移动到末态位置
                    animatePistonA();
                    break;
                    
                case 3:
                    // 步骤 3：显示末态参量
                    show(elements.oxygenFinal);
                    show(elements.pistonAFinal);
                    hide(elements.oxygenInitial);
                    hide(elements.pistonAInitial);
                    show(elements.lockIcon);
                    show(elements.labelLock);
                    show(elements.labelP1);
                    show(elements.labelVO2);
                    break;
                    
                case 4:
                    // 步骤 4：显示公式推导
                    show(elements.oxygenFinal);
                    show(elements.pistonAFinal);
                    hide(elements.oxygenInitial);
                    hide(elements.pistonAInitial);
                    show(elements.lockIcon);
                    show(elements.labelLock);
                    show(elements.labelP1);
                    show(elements.labelVO2);
                    show(elements.formulaBox);
                    elements.formulaBox.style.display = '';
                    break;
            }
            
            // 更新步骤指示器
            elements.stepIndicator.textContent = `步骤 ${currentState}/${totalSteps}`;
            
            // 更新按钮状态
            elements.btnPrev.disabled = currentState === 0;
            elements.btnPrev.style.opacity = currentState === 0 ? '0.5' : '1';
            elements.btnNext.disabled = currentState === totalSteps;
            elements.btnNext.style.opacity = currentState === totalSteps ? '0.5' : '1';
        }
        
        // 活塞 a 上升动画
        function animatePistonA() {
            const pistonInitial = elements.pistonAInitial;
            const pistonFinal = elements.pistonAFinal;
            const oxygenInitial = elements.oxygenInitial;
            const oxygenFinal = elements.oxygenFinal;
            
            let startTime = null;
            const duration = 500; // 500ms
            const startY = 220;
            const endY = 205;
            
            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // 缓动函数（ease-out）
                const easedProgress = 1 - Math.pow(1 - progress, 3);
                
                const currentY = startY + (endY - startY) * easedProgress;
                
                // 更新活塞位置
                pistonInitial.setAttribute('y1', currentY);
                pistonInitial.setAttribute('y2', currentY);
                
                // 更新氧气区域高度
                const oxygenHeight = currentY - 160;
                oxygenInitial.setAttribute('height', oxygenHeight);
                oxygenInitial.setAttribute('y', 160);
                
                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    // 动画完成后，切换到末态显示
                    hide(oxygenInitial);
                    hide(pistonInitial);
                    show(oxygenFinal);
                    show(pistonFinal);
                }
            }
            
            requestAnimationFrame(animate);
        }
        
        // 按钮事件绑定
        elements.btnPrev.addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                updateStep();
            }
        });
        
        elements.btnNext.addEventListener('click', function() {
            if (currentState < totalSteps) {
                currentState++;
                updateStep();
            }
        });
        
        // 初始化
        updateStep();
        
    })();
    </script>
</body>
</html>
