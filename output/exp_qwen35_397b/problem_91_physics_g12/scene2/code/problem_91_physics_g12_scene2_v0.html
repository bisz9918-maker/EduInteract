<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A 球受力分解与几何关系</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        .scene2-btn:hover { background: #e0e0e0; }
        .scene2-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 14px; padding: 8px 16px; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene2-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#1565c0" />
                </marker>
                <marker id="scene2-arrowhead-dim" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#888888" />
                </marker>
                <marker id="scene2-arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#2e7d32" />
                </marker>
            </defs>

            <!-- 等边三角形参考线（虚线） -->
            <line id="scene2-line-ab" x1="250" y1="218" x2="250" y2="332" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" />
            <line id="scene2-line-ac" x1="250" y1="200" x2="510" y2="275" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" />
            <line id="scene2-line-bc" x1="250" y1="350" x2="510" y2="275" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" />

            <!-- A 球 -->
            <circle id="scene2-ball-a" cx="250" cy="200" r="18" fill="#ffffff" stroke="#000000" stroke-width="2" opacity="0.85" />
            <text id="scene2-label-a" x="230" y="185" font-size="16" text-anchor="end">A</text>
            <text id="scene2-label-q-a" x="265" y="185" font-size="16" fill="#1565c0">+q</text>

            <!-- B 球（参考用） -->
            <circle id="scene2-ball-b" cx="250" cy="350" r="18" fill="#ffffff" stroke="#000000" stroke-width="2" opacity="0.85" />
            <text id="scene2-label-b" x="230" y="365" font-size="16" text-anchor="end">B</text>
            <text id="scene2-label-q-b" x="265" y="365" font-size="16" fill="#1565c0">+q</text>

            <!-- C 球（参考用） -->
            <circle id="scene2-ball-c" cx="510" cy="275" r="18" fill="#ffffff" stroke="#000000" stroke-width="2" opacity="0.85" />
            <text id="scene2-label-c" x="525" y="290" font-size="16">C</text>

            <!-- r 标注 -->
            <text id="scene2-label-r-ab" x="260" y="275" font-size="14">r</text>
            <text id="scene2-label-r-ac" x="380" y="230" font-size="14">r</text>
            <text id="scene2-label-r-bc" x="380" y="320" font-size="14">r</text>

            <!-- F_BA 矢量（B 对 A 的斥力，竖直向上） -->
            <line id="scene2-arrow-fba" x1="250" y1="200" x2="250" y2="130" stroke="#1565c0" stroke-width="3" marker-end="url(#scene2-arrowhead)" />
            <text id="scene2-label-fba" x="235" y="165" font-size="16" text-anchor="end" fill="#1565c0">F_BA</text>

            <!-- F_CA 矢量（C 对 A 的引力，沿 CA 指向 A） -->
            <line id="scene2-arrow-fca" x1="250" y1="200" x2="360" y2="260" stroke="#1565c0" stroke-width="3" marker-end="url(#scene2-arrowhead)" />
            <text id="scene2-label-fca" x="315" y="235" font-size="16" fill="#1565c0">F_CA</text>

            <!-- F_CAx 分量（水平向右，虚线） -->
            <line id="scene2-arrow-fcax" x1="250" y1="200" x2="310" y2="200" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene2-arrowhead-dim)" style="display:none;" />
            <text id="scene2-label-fcax" x="280" y="175" font-size="14" text-anchor="middle" fill="#888888" style="display:none;">F_CAx</text>

            <!-- F_CAy 分量（竖直向下，虚线） -->
            <line id="scene2-arrow-fcay" x1="250" y1="200" x2="250" y2="260" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene2-arrowhead-dim)" style="display:none;" />
            <text id="scene2-label-fcay" x="255" y="235" font-size="14" fill="#888888" style="display:none;">F_CAy</text>

            <!-- 坐标系（x 轴向右，y 轴向上） -->
            <g id="scene2-coordinates" style="display:none;">
                <line id="scene2-axis-x" x1="320" y1="200" x2="380" y2="200" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrowhead)" />
                <text id="scene2-label-x" x="385" y="205" font-size="16">x</text>
                <line id="scene2-axis-y" x1="320" y1="200" x2="320" y2="140" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrowhead)" />
                <text id="scene2-label-y" x="320" y="130" font-size="16" text-anchor="end">y</text>
            </g>

            <!-- 60° 角弧 -->
            <g id="scene2-angle-60" style="display:none;">
                <path id="scene2-arc-60deg" d="M 285 200 A 35 35 0 0 1 302.5 230.3" fill="none" stroke="#2e7d32" stroke-width="2" />
                <text id="scene2-label-60deg" x="295" y="215" font-size="14" fill="#2e7d32">60°</text>
            </g>

            <!-- 控件栏 -->
            <g id="scene2-controls-svg">
                <rect x="340" y="455" width="120" height="35" fill="#f5f5f5" stroke="#333" stroke-width="1" rx="4" />
                <text id="scene2-step-indicator" x="400" y="477" font-size="14" text-anchor="middle">步骤 1/5</text>
            </g>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn">◀ 上一步</button>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2: A 球受力分解与几何关系
        let currentStep = 0;
        const totalSteps = 5;

        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepIndicator = document.getElementById('scene2-step-indicator');

        // 各步骤需要显示的元素
        const stepElements = {
            0: {
                show: ['scene2-ball-a', 'scene2-ball-b', 'scene2-ball-c', 'scene2-line-ab', 'scene2-line-ac', 'scene2-line-bc',
                       'scene2-label-a', 'scene2-label-q-a', 'scene2-label-b', 'scene2-label-q-b', 'scene2-label-c',
                       'scene2-label-r-ab', 'scene2-label-r-ac', 'scene2-label-r-bc',
                       'scene2-arrow-fba', 'scene2-label-fba', 'scene2-arrow-fca', 'scene2-label-fca'],
                hide: ['scene2-arrow-fcax', 'scene2-label-fcax', 'scene2-arrow-fcay', 'scene2-label-fcay',
                       'scene2-coordinates', 'scene2-angle-60'],
                highlight: []
            },
            1: {
                show: ['scene2-coordinates'],
                hide: [],
                highlight: []
            },
            2: {
                show: ['scene2-arrow-fcax', 'scene2-label-fcax', 'scene2-arrow-fcay', 'scene2-label-fcay'],
                hide: [],
                highlight: []
            },
            3: {
                show: ['scene2-angle-60'],
                hide: [],
                highlight: []
            },
            4: {
                show: [],
                hide: [],
                highlight: ['scene2-arrow-fba', 'scene2-arrow-fcay']
            },
            5: {
                show: [],
                hide: [],
                highlight: ['scene2-arrow-fcax']
            }
        };

        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = '';
                el.style.opacity = '1';
            }
        }

        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        function highlightElement(id, color) {
            const el = document.getElementById(id);
            if (el && el.tagName === 'line') {
                el.setAttribute('stroke', color);
                el.setAttribute('marker-end', `url(#scene2-arrowhead-green)`);
            }
        }

        function resetHighlight(id, originalColor) {
            const el = document.getElementById(id);
            if (el && el.tagName === 'line') {
                el.setAttribute('stroke', originalColor);
                if (id.includes('fca')) {
                    el.setAttribute('marker-end', 'url(#scene2-arrowhead)');
                } else if (id.includes('fcax') || id.includes('fcay')) {
                    el.setAttribute('marker-end', 'url(#scene2-arrowhead-dim)');
                }
            }
        }

        function updateStep() {
            // 显示当前步骤应有的元素
            for (let step = 0; step <= currentStep; step++) {
                const elements = stepElements[step];
                if (elements) {
                    elements.show.forEach(id => showElement(id));
                    elements.hide.forEach(id => hideElement(id));
                }
            }

            // 处理高亮（步骤 4 和 5）
            if (currentStep >= 4) {
                highlightElement('scene2-arrow-fba', '#2e7d32');
                highlightElement('scene2-arrow-fcay', '#2e7d32');
            }
            if (currentStep >= 5) {
                highlightElement('scene2-arrow-fcax', '#2e7d32');
            }

            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;
            stepIndicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < totalSteps) {
                currentStep++;
                updateStep();
            }
        });

        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
