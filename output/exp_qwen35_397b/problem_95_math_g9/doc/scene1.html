<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>两船距离函数图像解析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: none; border-radius: 4px; }
        .scene1-btn:disabled { background: #cccccc; color: #666666; cursor: not-allowed; }
        .scene1-btn:enabled { background: #1565c0; color: #ffffff; }
        .scene1-btn:hover:enabled { background: #0d47a1; }
        .scene1-step-indicator { font-size: 14px; color: #333333; padding: 8px 16px; }
        .scene1-speed-box { display: none; }
        .scene1-fade-in { animation: scene1-fade-in-anim 0.5s ease-in forwards; }
        @keyframes scene1-fade-in-anim {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 坐标轴 -->
            <line id="scene1-x-axis" x1="80" y1="400" x2="720" y2="400" stroke="#000000" stroke-width="2" />
            <line id="scene1-y-axis" x1="80" y1="400" x2="80" y2="50" stroke="#000000" stroke-width="2" />
            
            <!-- 辅助虚线 -->
            <line id="scene1-dash-h" x1="80" y1="50" x2="628" y2="50" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" />
            <line id="scene1-dash-v" x1="628" y1="50" x2="628" y2="400" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" />
            
            <!-- 甲船 A→B 段 (初始灰色) -->
            <line id="scene1-line-甲-AB" x1="80" y1="50" x2="446" y2="400" stroke="#999999" stroke-width="3" />
            <!-- 甲船 B→C 段 (初始灰色) -->
            <line id="scene1-line-甲-BC" x1="446" y1="400" x2="628" y2="244" stroke="#999999" stroke-width="3" />
            <!-- 乙船 B→A 段 (初始灰色虚线) -->
            <line id="scene1-line-乙-BA" x1="171" y1="400" x2="628" y2="50" stroke="#999999" stroke-width="3" stroke-dasharray="5,5" />
            
            <!-- 关键点 (初始半径 5) -->
            <circle id="scene1-point-0-400" cx="80" cy="50" r="5" fill="#000000" />
            <circle id="scene1-point-4-0" cx="446" cy="400" r="5" fill="#000000" />
            <circle id="scene1-point-6-200" cx="628" cy="244" r="5" fill="#000000" />
            <circle id="scene1-point-1-0" cx="171" cy="400" r="5" fill="#000000" />
            <circle id="scene1-point-6-400" cx="628" cy="50" r="5" fill="#000000" />
            
            <!-- 坐标轴刻度标签 -->
            <text id="scene1-x-0" x="80" y="420" font-size="14" text-anchor="middle" fill="#000000">0</text>
            <text id="scene1-x-1" x="171" y="420" font-size="14" text-anchor="middle" fill="#000000">1</text>
            <text id="scene1-x-4" x="446" y="420" font-size="14" text-anchor="middle" fill="#000000">4</text>
            <text id="scene1-x-6" x="628" y="420" font-size="14" text-anchor="middle" fill="#000000">6</text>
            <text id="scene1-y-400" x="55" y="55" font-size="14" text-anchor="end" fill="#000000">400</text>
            <text id="scene1-y-200" x="55" y="249" font-size="14" text-anchor="end" fill="#000000">200</text>
            
            <!-- 坐标轴标签 -->
            <text id="scene1-x-label" x="680" y="435" font-size="14" fill="#000000">时间 x/h</text>
            <text id="scene1-y-label" x="50" y="30" font-size="14" fill="#000000">距离 y/km</text>
            
            <!-- 位置标签 (初始正常，步骤中加粗) -->
            <text id="scene1-label-A 港" x="70" y="25" font-size="14" fill="#000000">A 港</text>
            <text id="scene1-label-B 港" x="450" y="445" font-size="14" fill="#000000">B 港</text>
            <text id="scene1-label-C 港方向" x="635" y="230" font-size="14" fill="#000000">C 港方向</text>
            <text id="scene1-label-A 港方向" x="635" y="35" font-size="14" fill="#000000">A 港方向</text>
            
            <!-- 速度公式框 (步骤 4 显示) -->
            <g id="scene1-speed-box" class="scene1-speed-box">
                <rect x="680" y="80" width="110" height="130" fill="#f1f8e9" stroke="#2e7d32" stroke-width="2" />
                <text id="scene1-speed-text1" x="690" y="105" font-size="12" fill="#000000">甲船速度</text>
                <text id="scene1-speed-text2" x="690" y="125" font-size="12" fill="#000000">= 400km ÷ 4h</text>
                <text id="scene1-speed-text3" x="690" y="145" font-size="12" fill="#000000">= 100km/h</text>
                <text id="scene1-speed-text4" x="690" y="170" font-size="12" fill="#000000">乙船速度</text>
                <text id="scene1-speed-text5" x="690" y="190" font-size="12" fill="#000000">= 100 ÷ 1.25</text>
                <text id="scene1-speed-text6" x="690" y="210" font-size="12" fill="#000000">= 80km/h</text>
            </g>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator" class="scene1-step-indicator">步骤 0/4</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        let currentStep = 0;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        
        // 元素引用
        const line甲AB = document.getElementById('scene1-line-甲-AB');
        const line甲BC = document.getElementById('scene1-line-甲-BC');
        const line乙BA = document.getElementById('scene1-line-乙-BA');
        
        const point0400 = document.getElementById('scene1-point-0-400');
        const point40 = document.getElementById('scene1-point-4-0');
        const point6200 = document.getElementById('scene1-point-6-200');
        const point10 = document.getElementById('scene1-point-1-0');
        const point6400 = document.getElementById('scene1-point-6-400');
        
        const labelA 港 = document.getElementById('scene1-label-A 港');
        const labelB 港 = document.getElementById('scene1-label-B 港');
        const labelC 港方向 = document.getElementById('scene1-label-C 港方向');
        const labelA 港方向 = document.getElementById('scene1-label-A 港方向');
        
        const speedBox = document.getElementById('scene1-speed-box');
        
        // 更新步骤显示
        function updateStepDisplay() {
            stepIndicator.textContent = `步骤 ${currentStep}/4`;
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === 4;
        }
        
        // 应用步骤样式
        function applyStep(step) {
            // 重置所有样式
            line甲AB.setAttribute('stroke', '#999999');
            line甲AB.setAttribute('stroke-width', '3');
            line甲BC.setAttribute('stroke', '#999999');
            line甲BC.setAttribute('stroke-width', '3');
            line乙BA.setAttribute('stroke', '#999999');
            line乙BA.setAttribute('stroke-width', '3');
            
            point0400.setAttribute('r', '5');
            point40.setAttribute('r', '5');
            point6200.setAttribute('r', '5');
            point10.setAttribute('r', '5');
            point6400.setAttribute('r', '5');
            
            labelA 港.setAttribute('font-weight', 'normal');
            labelB 港.setAttribute('font-weight', 'normal');
            labelC 港方向.setAttribute('font-weight', 'normal');
            labelA 港方向.setAttribute('font-weight', 'normal');
            
            speedBox.style.display = 'none';
            speedBox.classList.remove('scene1-fade-in');
            
            // 步骤 0：初始状态，全部灰色
            if (step === 0) {
                // 已重置
            }
            
            // 步骤 1：高亮甲船 A→B 段
            if (step >= 1) {
                line甲AB.setAttribute('stroke', '#1565c0');
                line甲AB.setAttribute('stroke-width', '4');
                point0400.setAttribute('r', '7');
                point40.setAttribute('r', '7');
                labelA 港.setAttribute('font-weight', 'bold');
                labelB 港.setAttribute('font-weight', 'bold');
            }
            
            // 步骤 2：高亮甲船 B→C 段
            if (step >= 2) {
                line甲BC.setAttribute('stroke', '#1565c0');
                line甲BC.setAttribute('stroke-width', '4');
                point6200.setAttribute('r', '7');
                labelC 港方向.setAttribute('font-weight', 'bold');
            }
            
            // 步骤 3：高亮乙船线段
            if (step >= 3) {
                line乙BA.setAttribute('stroke', '#c62828');
                line乙BA.setAttribute('stroke-width', '4');
                point10.setAttribute('r', '7');
                point6400.setAttribute('r', '7');
                labelA 港方向.setAttribute('font-weight', 'bold');
            }
            
            // 步骤 4：显示速度公式框
            if (step >= 4) {
                speedBox.style.display = 'block';
                speedBox.classList.add('scene1-fade-in');
            }
            
            updateStepDisplay();
        }
        
        // 按钮事件
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                applyStep(currentStep);
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentStep < 4) {
                currentStep++;
                applyStep(currentStep);
            }
        });
        
        // 初始化
        applyStep(0);
    })();
    </script>
</body>
</html>
