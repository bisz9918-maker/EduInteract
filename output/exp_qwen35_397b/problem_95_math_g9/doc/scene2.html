<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>场景 2：乙出发 4h 时两船位置与距离</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-svg { width: 800px; height: 500px; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-label { font-size: 14px; fill: #000000; }
        .scene2-axis { stroke: #000000; stroke-width: 2; fill: none; }
        .scene2-ship-a { stroke: #1565c0; stroke-width: 2; fill: none; }
        .scene2-ship-b { stroke: #c62828; stroke-width: 2; fill: none; }
        .scene2-point-a { fill: #1565c0; }
        .scene2-point-b { fill: #c62828; }
        .scene2-dashed { stroke: #888888; stroke-width: 1; stroke-dasharray: 5,5; fill: none; }
        .scene2-distance-arrow { stroke: #2e7d32; stroke-width: 4; fill: none; }
        .scene2-slider-track { fill: #cccccc; }
        .scene2-slider-handle { fill: #1565c0; cursor: pointer; }
        .scene2-tick { stroke: #000000; stroke-width: 1; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 坐标轴 -->
            <line id="scene2-x-axis" x1="80" y1="420" x2="720" y2="420" class="scene2-axis" marker-end="url(#scene2-arrow-x)"/>
            <line id="scene2-y-axis" x1="80" y1="420" x2="80" y2="60" class="scene2-axis" marker-end="url(#scene2-arrow-y)"/>
            
            <!-- 箭头定义 -->
            <defs>
                <marker id="scene2-arrow-x" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
                </marker>
                <marker id="scene2-arrow-y" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
                </marker>
            </defs>
            
            <!-- 轴标签 -->
            <text id="scene2-x-label" x="730" y="425" class="scene2-label">x/h</text>
            <text id="scene2-y-label" x="75" y="50" class="scene2-label">y/km</text>
            
            <!-- x 轴刻度标签 -->
            <text id="scene2-x-0" x="75" y="435" class="scene2-label">0</text>
            <text id="scene2-x-1" x="155" y="435" class="scene2-label">1</text>
            <text id="scene2-x-4" x="395" y="435" class="scene2-label">4</text>
            <text id="scene2-x-5" x="475" y="435" class="scene2-label" font-weight="bold">5</text>
            <text id="scene2-x-6" x="555" y="435" class="scene2-label">6</text>
            
            <!-- y 轴刻度标签 -->
            <text id="scene2-y-100" x="65" y="325" class="scene2-label" text-anchor="end">100</text>
            <text id="scene2-y-200" x="65" y="245" class="scene2-label" text-anchor="end">200</text>
            <text id="scene2-y-300" x="65" y="165" class="scene2-label" text-anchor="end">300</text>
            <text id="scene2-y-400" x="65" y="65" class="scene2-label" text-anchor="end">400</text>
            
            <!-- 甲船轨迹 A→B→C -->
            <polyline id="scene2-ship-a-path" points="80,60 480,420 720,220" class="scene2-ship-a"/>
            
            <!-- 乙船轨迹 B→A -->
            <line id="scene2-ship-b-path" x1="160" y1="420" x2="720" y2="100" class="scene2-ship-b"/>
            
            <!-- 甲船位置点 -->
            <circle id="scene2-ship-a-point" cx="560" cy="320" r="6" class="scene2-point-a"/>
            
            <!-- 乙船位置点 -->
            <circle id="scene2-ship-b-point" cx="560" cy="108" r="6" class="scene2-point-b"/>
            
            <!-- 甲船垂线 -->
            <line id="scene2-ship-a-vertical" x1="560" y1="420" x2="560" y2="320" class="scene2-dashed"/>
            
            <!-- 乙船垂线 -->
            <line id="scene2-ship-b-vertical" x1="560" y1="420" x2="560" y2="108" class="scene2-dashed"/>
            
            <!-- 距离箭头（双向） -->
            <line id="scene2-distance-line" x1="575" y1="108" x2="575" y2="320" class="scene2-distance-arrow"/>
            <!-- 箭头两端 -->
            <polygon id="scene2-distance-arrow-top" points="575,108 570,118 580,118" fill="#2e7d32"/>
            <polygon id="scene2-distance-arrow-bottom" points="575,320 570,310 580,310" fill="#2e7d32"/>
            
            <!-- 标签 -->
            <text id="scene2-label-ship-a" x="575" y="310" class="scene2-label">甲船</text>
            <text id="scene2-label-ship-b" x="575" y="98" class="scene2-label">乙船</text>
            <text id="scene2-label-ya" x="590" y="345" class="scene2-label">y_甲=100</text>
            <text id="scene2-label-yb" x="590" y="78" class="scene2-label">y_乙=320</text>
            <text id="scene2-label-total" x="600" y="200" class="scene2-label" font-weight="bold">总距离=420</text>
            <text id="scene2-label-time" x="560" y="455" class="scene2-label" text-anchor="middle">乙出发 4h</text>
            
            <!-- 滑块轨道 -->
            <rect id="scene2-slider-track" x="100" y="460" width="600" height="15" rx="7" class="scene2-slider-track"/>
            
            <!-- 滑块刻度线 -->
            <line id="scene2-slider-tick-1" x1="100" y1="460" x2="100" y2="475" class="scene2-tick"/>
            <line id="scene2-slider-tick-2" x1="200" y1="460" x2="200" y2="475" class="scene2-tick"/>
            <line id="scene2-slider-tick-3" x1="300" y1="460" x2="300" y2="475" class="scene2-tick"/>
            <line id="scene2-slider-tick-4" x1="400" y1="460" x2="400" y2="475" class="scene2-tick"/>
            <line id="scene2-slider-tick-5" x1="500" y1="460" x2="500" y2="475" class="scene2-tick"/>
            <line id="scene2-slider-tick-6" x1="600" y1="460" x2="600" y2="475" class="scene2-tick"/>
            
            <!-- 滑块手柄 -->
            <circle id="scene2-slider-handle" cx="560" cy="467" r="10" class="scene2-slider-handle"/>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现：乙出发 4h 时两船位置与距离计算
        
        // 坐标转换函数
        function xToCanvas(sliderX) {
            // sliderX: 1-6, 画布 x: 80-720
            return 80 + (sliderX / 6) * 640;
        }
        
        function yToCanvas(yValue) {
            // yValue: 0-400, 画布 y: 420-60
            return 420 - (yValue / 400) * 360;
        }
        
        // 计算甲船 y 坐标（与 B 港距离）
        function getShipAY(sliderX) {
            if (sliderX < 4) {
                return 400 - 100 * sliderX;
            } else {
                return 100 * (sliderX - 4);
            }
        }
        
        // 计算乙船 y 坐标（与 B 港距离）
        function getShipBY(sliderX) {
            if (sliderX >= 1) {
                return 80 * (sliderX - 1);
            }
            return 0;
        }
        
        // 更新图示
        function updateScene(sliderX) {
            const shipAY = getShipAY(sliderX);
            const shipBY = getShipBY(sliderX);
            const totalDistance = shipAY + shipBY;
            
            const canvasX = xToCanvas(sliderX);
            const canvasAY = yToCanvas(shipAY);
            const canvasBY = yToCanvas(shipBY);
            
            // 更新甲船位置
            document.getElementById('scene2-ship-a-point').setAttribute('cx', canvasX);
            document.getElementById('scene2-ship-a-point').setAttribute('cy', canvasAY);
            document.getElementById('scene2-ship-a-vertical').setAttribute('x1', canvasX);
            document.getElementById('scene2-ship-a-vertical').setAttribute('x2', canvasX);
            document.getElementById('scene2-ship-a-vertical').setAttribute('y2', canvasAY);
            document.getElementById('scene2-label-ship-a').setAttribute('x', canvasX + 15);
            document.getElementById('scene2-label-ya').setAttribute('x', canvasX + 30);
            document.getElementById('scene2-label-ya').textContent = 'y_甲=' + Math.round(shipAY);
            
            // 更新乙船位置
            document.getElementById('scene2-ship-b-point').setAttribute('cx', canvasX);
            document.getElementById('scene2-ship-b-point').setAttribute('cy', canvasBY);
            document.getElementById('scene2-ship-b-vertical').setAttribute('x1', canvasX);
            document.getElementById('scene2-ship-b-vertical').setAttribute('x2', canvasX);
            document.getElementById('scene2-ship-b-vertical').setAttribute('y2', canvasBY);
            document.getElementById('scene2-label-ship-b').setAttribute('x', canvasX + 15);
            document.getElementById('scene2-label-yb').setAttribute('x', canvasX + 30);
            document.getElementById('scene2-label-yb').textContent = 'y_乙=' + Math.round(shipBY);
            
            // 更新距离箭头
            const arrowX = canvasX + 15;
            document.getElementById('scene2-distance-line').setAttribute('x1', arrowX);
            document.getElementById('scene2-distance-line').setAttribute('x2', arrowX);
            document.getElementById('scene2-distance-line').setAttribute('y1', canvasBY);
            document.getElementById('scene2-distance-line').setAttribute('y2', canvasAY);
            
            document.getElementById('scene2-distance-arrow-top').setAttribute('points', 
                arrowX + ',' + canvasBY + ' ' + (arrowX-5) + ',' + (canvasBY+10) + ' ' + (arrowX+5) + ',' + (canvasBY+10));
            document.getElementById('scene2-distance-arrow-bottom').setAttribute('points',
                arrowX + ',' + canvasAY + ' ' + (arrowX-5) + ',' + (canvasAY-10) + ' ' + (arrowX+5) + ',' + (canvasAY-10));
            
            document.getElementById('scene2-label-total').setAttribute('x', canvasX + 40);
            document.getElementById('scene2-label-total').setAttribute('y', (canvasAY + canvasBY) / 2);
            document.getElementById('scene2-label-total').textContent = '总距离=' + Math.round(totalDistance);
            
            // 更新时间标签
            const hoursSinceBStart = sliderX - 1;
            document.getElementById('scene2-label-time').setAttribute('x', canvasX);
            document.getElementById('scene2-label-time').textContent = '乙出发 ' + hoursSinceBStart.toFixed(0) + 'h';
            
            // 更新滑块手柄位置
            document.getElementById('scene2-slider-handle').setAttribute('cx', canvasX);
        }
        
        // 滑块拖拽逻辑
        let isDragging = false;
        const sliderTrack = document.getElementById('scene2-slider-track');
        const sliderHandle = document.getElementById('scene2-slider-handle');
        
        function handleMove(clientX) {
            const rect = sliderTrack.getBoundingClientRect();
            let newX = clientX - rect.left;
            // 限制在轨道范围内
            newX = Math.max(0, Math.min(600, newX));
            // 转换为 sliderX 值 (1-6)
            const sliderX = 1 + (newX / 600) * 5;
            updateScene(sliderX);
        }
        
        sliderHandle.addEventListener('mousedown', function(e) {
            isDragging = true;
            e.preventDefault();
        });
        
        document.addEventListener('mousemove', function(e) {
            if (isDragging) {
                handleMove(e.clientX);
            }
        });
        
        document.addEventListener('mouseup', function() {
            isDragging = false;
        });
        
        // 触摸支持
        sliderHandle.addEventListener('touchstart', function(e) {
            isDragging = true;
            e.preventDefault();
        });
        
        document.addEventListener('touchmove', function(e) {
            if (isDragging) {
                handleMove(e.touches[0].clientX);
            }
        });
        
        document.addEventListener('touchend', function() {
            isDragging = false;
        });
        
        // 初始化
        updateScene(5); // 默认显示 x=5（乙出发 4h）
        
    })();
    </script>
</body>
</html>
