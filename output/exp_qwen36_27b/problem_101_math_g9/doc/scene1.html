<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正方形折叠挖洞展开 - 轴对称变换</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; display: block; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 8px 20px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            background: #f5f5f5;
            cursor: pointer;
            font-size: 14px;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            transition: background 0.2s ease;
        }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* SVG transitions for smooth animations */
        #scene1-square { transition: stroke 0.4s ease, stroke-width 0.4s ease; }
        #scene1-diag-ac { transition: stroke-width 0.4s ease; }
        #scene1-fold-area { transition: opacity 0.4s ease; }
        #scene1-hole-a, #scene1-hole-b, #scene1-hole-c, #scene1-hole-d { transition: opacity 0.4s ease; }
        #scene1-annot-on-fold, #scene1-annot-off-fold, #scene1-annot-symmetry, #scene1-symmetry-line { transition: opacity 0.4s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 正方形ABCD: 用4条line代替rect，避免大边界框与文字重叠 -->
            <g id="scene1-square" stroke="#000000" stroke-width="2">
                <line x1="280" y1="100" x2="520" y2="100"/>
                <line x1="520" y1="100" x2="520" y2="340"/>
                <line x1="520" y1="340" x2="280" y2="340"/>
                <line x1="280" y1="340" x2="280" y2="100"/>
            </g>

            <!-- 对角线AC（折痕）: (280,100)-(520,340) -->
            <line id="scene1-diag-ac" x1="280" y1="100" x2="520" y2="340" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5"/>

            <!-- 折叠覆盖区ADC: 左下三角 (280,100)-(280,340)-(520,340) -->
            <polygon id="scene1-fold-area" points="280,100 280,340 520,340" fill="#000000" opacity="0"/>

            <!-- 顶点标签 -->
            <text id="scene1-label-a" x="260" y="85" font-size="14" fill="#000000" text-anchor="end">A</text>
            <text id="scene1-label-b" x="540" y="85" font-size="14" fill="#000000" text-anchor="start">B</text>
            <text id="scene1-label-c" x="540" y="365" font-size="14" fill="#000000" text-anchor="start">C</text>
            <text id="scene1-label-d" x="260" y="365" font-size="14" fill="#000000" text-anchor="end">D</text>

            <!-- 折痕标注：移到正方形右侧外部 (540, 220) -->
            <text id="scene1-annot-fold" x="540" y="220" font-size="12" fill="#888888" text-anchor="start">折痕</text>

            <!-- 圆洞（空心圆，r=14） -->
            <!-- A: 折痕上，蓝色 -->
            <circle id="scene1-hole-a" cx="280" cy="100" r="14" fill="none" stroke="#1565c0" stroke-width="2" opacity="0"/>
            <!-- B: 不在折痕上，红色 -->
            <circle id="scene1-hole-b" cx="520" cy="100" r="14" fill="none" stroke="#c62828" stroke-width="2" opacity="0"/>
            <!-- C: 折痕上，蓝色 -->
            <circle id="scene1-hole-c" cx="520" cy="340" r="14" fill="none" stroke="#1565c0" stroke-width="2" opacity="0"/>
            <!-- D: B的对称镜像，红色 -->
            <circle id="scene1-hole-d" cx="280" cy="340" r="14" fill="none" stroke="#c62828" stroke-width="2" opacity="0"/>

            <!-- 步骤2标注：移到正方形外部 -->
            <text id="scene1-annot-on-fold" x="230" y="50" font-size="12" fill="#1565c0" text-anchor="end" opacity="0">在折痕上</text>
            <text id="scene1-annot-off-fold" x="570" y="55" font-size="12" fill="#c62828" text-anchor="start" opacity="0">不在折痕上</text>

            <!-- 对称连线BD: (520,100)-(280,340) -->
            <line id="scene1-symmetry-line" x1="520" y1="100" x2="280" y2="340" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5" opacity="0"/>

            <!-- 对称点标注：移到正方形下方 (420, 370) -->
            <text id="scene1-annot-symmetry" x="420" y="370" font-size="12" fill="#888888" text-anchor="middle" opacity="0">对称点</text>

            <!-- 步骤说明文字 -->
            <text id="scene1-step-desc" x="400" y="420" font-size="12" fill="#000000" text-anchor="middle">步骤0/4：正方形纸片，沿对角线AC折叠</text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        // 布局坐标表（对照 spec.json 实现计划，已调整避免重叠）：
        // 正方形ABCD: 4条line组成 (280,100)-(520,340) 的边框
        // 对角线AC: (280,100)-(520,340)
        // 折叠区ADC: (280,100)-(280,340)-(520,340)
        // 顶点标签: A(260,85) B(540,85) C(540,365) D(260,365)
        // 折痕标注: (540,220) 正方形右侧外部
        // 圆洞: A(280,100) B(520,100) C(520,340) D(280,340), r=14
        // 在折痕上: (230,50) 正方形左上方外部
        // 不在折痕上: (570,55) 正方形右上方外部
        // 对称点: (420,370) 正方形下方外部
        // 对称线BD: (520,100)-(280,340)
        // 步骤说明: (400,420)

        var currentStep = 0;

        var stepDescriptions = [
            "步骤0/4：正方形纸片，沿对角线AC折叠",
            "步骤1/4：沿对角线AC折叠，得到等腰直角三角形ABC",
            "步骤2/4：在三角形三个角上各挖去一个圆洞",
            "步骤3/4：展开纸片，B处圆洞对称生成D处圆洞",
            "步骤4/4：结论——四个顶点各有一个圆洞，对应选项A"
        ];

        function getEl(id) {
            return document.getElementById('scene1-' + id);
        }

        function show(el) {
            el.setAttribute('opacity', '1');
        }

        function hide(el) {
            el.setAttribute('opacity', '0');
        }

        function renderStep(step) {
            var square = getEl('square');
            var diag = getEl('diag-ac');
            var foldArea = getEl('fold-area');
            var holeA = getEl('hole-a');
            var holeB = getEl('hole-b');
            var holeC = getEl('hole-c');
            var holeD = getEl('hole-d');
            var annotFold = getEl('annot-fold');
            var annotOnFold = getEl('annot-on-fold');
            var annotOffFold = getEl('annot-off-fold');
            var symmetryLine = getEl('symmetry-line');
            var annotSymmetry = getEl('annot-symmetry');
            var stepDesc = getEl('step-desc');

            // 重置所有动态元素
            square.setAttribute('stroke', '#000000');
            square.setAttribute('stroke-width', '2');
            diag.setAttribute('stroke-dasharray', '5,5');
            diag.setAttribute('stroke-width', '1.5');
            hide(foldArea);
            hide(holeA); hide(holeB); hide(holeC); hide(holeD);
            hide(annotOnFold); hide(annotOffFold);
            hide(symmetryLine); hide(annotSymmetry);
            show(annotFold);

            // 按步骤渲染
            switch(step) {
                case 0:
                    // 初始状态：正方形 + 虚线对角线 + 顶点标签 + 折痕标注
                    break;
                case 1:
                    // 折叠：对角线变实线，折叠区10%半透明
                    diag.setAttribute('stroke-dasharray', 'none');
                    diag.setAttribute('stroke-width', '2');
                    foldArea.setAttribute('opacity', '0.1');
                    break;
                case 2:
                    // 挖洞：A、B、C三处圆洞渐显
                    diag.setAttribute('stroke-dasharray', 'none');
                    diag.setAttribute('stroke-width', '2');
                    foldArea.setAttribute('opacity', '0.1');
                    show(holeA); show(holeB); show(holeC);
                    show(annotOnFold); show(annotOffFold);
                    break;
                case 3:
                    // 展开：D处圆洞渐显，对称线BD显示
                    show(holeA); show(holeB); show(holeC); show(holeD);
                    show(symmetryLine); show(annotSymmetry);
                    break;
                case 4:
                    // 结论：正方形边框绿色高亮
                    square.setAttribute('stroke', '#2e7d32');
                    square.setAttribute('stroke-width', '3');
                    show(holeA); show(holeB); show(holeC); show(holeD);
                    break;
            }

            // 更新步骤说明
            stepDesc.textContent = stepDescriptions[step];

            // 更新按钮状态
            getEl('btn-prev').disabled = (step === 0);
            getEl('btn-next').disabled = (step === 4);
        }

        function nextStep() {
            if (currentStep < 4) {
                currentStep++;
                renderStep(currentStep);
            }
        }

        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
            }
        }

        // 事件绑定
        getEl('btn-next').addEventListener('click', nextStep);
        getEl('btn-prev').addEventListener('click', prevStep);

        // 初始渲染
        renderStep(0);
    })();
    </script>
</body>
</html>
