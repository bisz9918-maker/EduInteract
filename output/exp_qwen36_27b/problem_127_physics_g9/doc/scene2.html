<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光的折射 - 玻璃砖光路分析</title>
    <style>
        body { margin: 0; padding: 0; background: #fff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #fff; margin: 0 auto; overflow: hidden; }
        #scene2-svg { display: block; }
        #scene2-controls { position: absolute; bottom: 12px; left: 0; right: 0; display: flex; justify-content: center; gap: 16px; z-index: 10; }
        #scene2-controls button { padding: 8px 24px; font-size: 15px; border: 1.5px solid #555; border-radius: 6px; cursor: pointer; background: #fff; color: #333; font-family: inherit; }
        #scene2-controls button:hover:not(:disabled) { background: #f0f0f0; }
        #scene2-controls button:disabled { background: #e8e8e8; color: #aaa; border-color: #ccc; cursor: default; }
        .scene2-option { transition: opacity 0.35s ease; }
        .scene2-highlight { transition: opacity 0.35s ease; }
        .scene2-annotation { transition: opacity 0.35s ease; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <marker id="scene2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#000"/>
                </marker>
            </defs>
            <!-- 选项A -->
            <g id="scene2-opt-A" class="scene2-option" opacity="0.4">
                <rect x="40" y="160" width="120" height="50" fill="#e3f2fd" fill-opacity="0.15" stroke="#000" stroke-width="1.5"/>
                <line x1="80" y1="130" x2="80" y2="190" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="95" y1="180" x2="95" y2="240" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="30" y1="80" x2="80" y2="160" stroke="#000" stroke-width="2" marker-end="url(#scene2-arrow)"/>
                <line x1="80" y1="160" x2="95" y2="210" stroke="#000" stroke-width="2" marker-end="url(#scene2-arrow)"/>
                <line x1="95" y1="210" x2="105" y2="290" stroke="#000" stroke-width="2" marker-end="url(#scene2-arrow)"/>
                <text x="100" y="315" text-anchor="middle" font-size="20" font-weight="bold" fill="#000">A</text>
            </g>
            <!-- 选项B -->
            <g id="scene2-opt-B" class="scene2-option" opacity="0.4">
                <rect x="240" y="160" width="120" height="50" fill="#e3f2fd" fill-opacity="0.15" stroke="#000" stroke-width="1.5"/>
                <line x1="280" y1="130" x2="280" y2="190" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="295" y1="180" x2="295" y2="240" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="230" y1="80" x2="280" y2="160" stroke="#000" stroke-width="2" marker-end="url(#scene2-arrow)"/>
                <line x1="280" y1="160" x2="295" y2="210" stroke="#000" stroke-width="2" marker-end="url(#scene2-arrow)"/>
                <line x1="295" y1="210" x2="322" y2="290" stroke="#000" stroke-width="2" marker-end="url(#scene2-arrow)"/>
                <text x="300" y="315" text-anchor="middle" font-size="20" font-weight="bold" fill="#000">B</text>
            </g>
            <!-- 选项C -->
            <g id="scene2-opt-C" class="scene2-option" opacity="0.4">
                <rect x="440" y="160" width="120" height="50" fill="#e3f2fd" fill-opacity="0.15" stroke="#000" stroke-width="1.5"/>
                <line x1="480" y1="130" x2="480" y2="190" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="460" y1="180" x2="460" y2="240" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="430" y1="80" x2="480" y2="160" stroke="#000" stroke-width="2" marker-end="url(#scene2-arrow)"/>
                <line x1="480" y1="160" x2="460" y2="210" stroke="#000" stroke-width="2" marker-end="url(#scene2-arrow)"/>
                <line x1="460" y1="210" x2="445" y2="290" stroke="#000" stroke-width="2" marker-end="url(#scene2-arrow)"/>
                <text x="500" y="315" text-anchor="middle" font-size="20" font-weight="bold" fill="#000">C</text>
            </g>
            <!-- 选项D -->
            <g id="scene2-opt-D" class="scene2-option" opacity="0.4">
                <rect x="640" y="160" width="120" height="50" fill="#e3f2fd" fill-opacity="0.15" stroke="#000" stroke-width="1.5"/>
                <line x1="680" y1="130" x2="680" y2="190" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="697" y1="180" x2="697" y2="240" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="630" y1="80" x2="680" y2="160" stroke="#000" stroke-width="2" marker-end="url(#scene2-arrow)"/>
                <line x1="680" y1="160" x2="697" y2="210" stroke="#000" stroke-width="2" marker-end="url(#scene2-arrow)"/>
                <line x1="697" y1="210" x2="724" y2="290" stroke="#000" stroke-width="2" marker-end="url(#scene2-arrow)"/>
                <text x="700" y="315" text-anchor="middle" font-size="20" font-weight="bold" fill="#000">D</text>
            </g>
            <!-- 高亮边框（用line代替rect避免重叠） -->
            <g id="scene2-hl-A" class="scene2-highlight" opacity="0">
                <line x1="35" y1="75" x2="165" y2="75" stroke="#f9a825" stroke-width="3"/>
                <line x1="35" y1="75" x2="35" y2="330" stroke="#f9a825" stroke-width="3"/>
                <line x1="165" y1="75" x2="165" y2="330" stroke="#f9a825" stroke-width="3"/>
                <line x1="35" y1="330" x2="165" y2="330" stroke="#f9a825" stroke-width="3"/>
            </g>
            <g id="scene2-hl-B" class="scene2-highlight" opacity="0">
                <line x1="235" y1="75" x2="365" y2="75" stroke="#f9a825" stroke-width="3"/>
                <line x1="235" y1="75" x2="235" y2="330" stroke="#f9a825" stroke-width="3"/>
                <line x1="365" y1="75" x2="365" y2="330" stroke="#f9a825" stroke-width="3"/>
                <line x1="235" y1="330" x2="365" y2="330" stroke="#f9a825" stroke-width="3"/>
            </g>
            <g id="scene2-hl-C" class="scene2-highlight" opacity="0">
                <line x1="435" y1="75" x2="565" y2="75" stroke="#f9a825" stroke-width="3"/>
                <line x1="435" y1="75" x2="435" y2="330" stroke="#f9a825" stroke-width="3"/>
                <line x1="565" y1="75" x2="565" y2="330" stroke="#f9a825" stroke-width="3"/>
                <line x1="435" y1="330" x2="565" y2="330" stroke="#f9a825" stroke-width="3"/>
            </g>
            <g id="scene2-hl-D" class="scene2-highlight" opacity="0">
                <line x1="635" y1="75" x2="765" y2="75" stroke="#f9a825" stroke-width="3"/>
                <line x1="635" y1="75" x2="635" y2="330" stroke="#f9a825" stroke-width="3"/>
                <line x1="765" y1="75" x2="765" y2="330" stroke="#f9a825" stroke-width="3"/>
                <line x1="635" y1="330" x2="765" y2="330" stroke="#f9a825" stroke-width="3"/>
            </g>
            <!-- 标注文本 -->
            <text id="scene2-ann-A-top" class="scene2-annotation" x="100" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32" opacity="0">向法线偏折 ✓</text>
            <text id="scene2-ann-A-bot" class="scene2-annotation" x="100" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828" opacity="0">仍向法线偏折 ✗</text>
            <text id="scene2-ann-B-top" class="scene2-annotation" x="300" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32" opacity="0">向法线偏折 ✓</text>
            <text id="scene2-ann-B-bot" class="scene2-annotation" x="300" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32" opacity="0">远离法线偏折 ✓</text>
            <text id="scene2-ann-B-par" class="scene2-annotation" x="300" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32" opacity="0">出射∥入射 ✓</text>
            <text id="scene2-ann-C-top" class="scene2-annotation" x="500" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828" opacity="0">远离法线偏折 ✗</text>
            <text id="scene2-ann-C-bot" class="scene2-annotation" x="500" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828" opacity="0">向法线偏折 ✗</text>
            <text id="scene2-ann-D-mid" class="scene2-annotation" x="700" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828" opacity="0">无折射 ✗</text>
            <text id="scene2-sum-A" class="scene2-annotation" x="100" y="375" text-anchor="middle" font-size="18" font-weight="bold" fill="#c62828" opacity="0">✗</text>
            <text id="scene2-sum-B" class="scene2-annotation" x="300" y="375" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e7d32" opacity="0">✓ 正确答案</text>
            <text id="scene2-sum-C" class="scene2-annotation" x="500" y="375" text-anchor="middle" font-size="18" font-weight="bold" fill="#c62828" opacity="0">✗</text>
            <text id="scene2-sum-D" class="scene2-annotation" x="700" y="375" text-anchor="middle" font-size="18" font-weight="bold" fill="#c62828" opacity="0">✗</text>
        </svg>
        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        'use strict';
        var currentStep = 0, totalSteps = 5;
        var optA = document.getElementById('scene2-opt-A');
        var optB = document.getElementById('scene2-opt-B');
        var optC = document.getElementById('scene2-opt-C');
        var optD = document.getElementById('scene2-opt-D');
        var hlA = document.getElementById('scene2-hl-A');
        var hlB = document.getElementById('scene2-hl-B');
        var hlC = document.getElementById('scene2-hl-C');
        var hlD = document.getElementById('scene2-hl-D');
        var btnPrev = document.getElementById('scene2-btn-prev');
        var btnNext = document.getElementById('scene2-btn-next');
        var ann = {
            A_top: document.getElementById('scene2-ann-A-top'),
            A_bot: document.getElementById('scene2-ann-A-bot'),
            B_top: document.getElementById('scene2-ann-B-top'),
            B_bot: document.getElementById('scene2-ann-B-bot'),
            B_par: document.getElementById('scene2-ann-B-par'),
            C_top: document.getElementById('scene2-ann-C-top'),
            C_bot: document.getElementById('scene2-ann-C-bot'),
            D_mid: document.getElementById('scene2-ann-D-mid'),
            sumA: document.getElementById('scene2-sum-A'),
            sumB: document.getElementById('scene2-sum-B'),
            sumC: document.getElementById('scene2-sum-C'),
            sumD: document.getElementById('scene2-sum-D')
        };
        function hideAllAnn() { for (var k in ann) ann[k].style.opacity = '0'; }
        function hideAllHL() { hlA.style.opacity='0'; hlB.style.opacity='0'; hlC.style.opacity='0'; hlD.style.opacity='0'; }
        function setHLColor(g, c) { var ls = g.querySelectorAll('line'); for (var i=0;i<ls.length;i++) ls[i].setAttribute('stroke',c); }
        function updateStep(s) {
            currentStep = s;
            optA.style.opacity='0.4'; optB.style.opacity='0.4'; optC.style.opacity='0.4'; optD.style.opacity='0.4';
            hideAllAnn(); hideAllHL();
            setHLColor(hlA,'#f9a825'); setHLColor(hlB,'#f9a825'); setHLColor(hlC,'#f9a825'); setHLColor(hlD,'#f9a825');
            if (s===1) { optA.style.opacity='1'; hlA.style.opacity='1'; ann.A_top.style.opacity='1'; ann.A_bot.style.opacity='1'; }
            else if (s===2) { optB.style.opacity='1'; hlB.style.opacity='1'; ann.B_top.style.opacity='1'; ann.B_bot.style.opacity='1'; ann.B_par.style.opacity='1'; }
            else if (s===3) { optC.style.opacity='1'; hlC.style.opacity='1'; ann.C_top.style.opacity='1'; ann.C_bot.style.opacity='1'; }
            else if (s===4) { optD.style.opacity='1'; hlD.style.opacity='1'; ann.D_mid.style.opacity='1'; }
            else if (s===5) { optB.style.opacity='1'; setHLColor(hlB,'#2e7d32'); hlB.style.opacity='1'; ann.sumA.style.opacity='1'; ann.sumB.style.opacity='1'; ann.sumC.style.opacity='1'; ann.sumD.style.opacity='1'; }
            btnPrev.disabled = (s===0); btnNext.disabled = (s===totalSteps);
        }
        btnPrev.addEventListener('click', function(){ if(currentStep>0) updateStep(currentStep-1); });
        btnNext.addEventListener('click', function(){ if(currentStep<totalSteps) updateStep(currentStep+1); });
        updateStep(0);
    })();
    </script>
</body>
</html>
