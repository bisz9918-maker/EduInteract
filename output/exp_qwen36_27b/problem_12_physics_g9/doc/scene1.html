<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>弹簧测力计受力分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; display: block; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene1-controls button {
            padding: 8px 20px; font-size: 15px; border: 2px solid #1565c0; background: #ffffff;
            color: #1565c0; border-radius: 6px; cursor: pointer; transition: all 0.2s;
            font-family: inherit;
        }
        #scene1-controls button:hover:not(:disabled) { background: #1565c0; color: #ffffff; }
        #scene1-controls button:disabled { opacity: 0.4; cursor: default; border-color: #999; color: #999; }
        #scene1-step-indicator { font-size: 15px; color: #555; min-width: 50px; text-align: center; font-weight: bold; }

        /* Dynamic elements: hidden by default */
        .scene1-dyn { opacity: 0; transition: opacity 0.35s ease-in-out; pointer-events: none; }
        .scene1-dyn.visible { opacity: 1; pointer-events: auto; }

        /* Highlight overlays */
        .scene1-highlight { opacity: 0; transition: opacity 0.35s ease-in-out; }
        .scene1-highlight.visible { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <!-- Arrow markers -->
                <marker id="scene1-marker-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
                <marker id="scene1-marker-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
                </marker>
                <marker id="scene1-marker-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
                </marker>
            </defs>

            <!-- ====== STATIC ELEMENTS (always visible) ====== -->

            <!-- Meter A body -->
            <rect id="scene1-meterA-body" x="150" y="190" width="160" height="60" rx="3" ry="3"
                  fill="#ffffff" stroke="#000000" stroke-width="2"/>
            <!-- Meter B body -->
            <rect id="scene1-meterB-body" x="490" y="190" width="160" height="60" rx="3" ry="3"
                  fill="#ffffff" stroke="#000000" stroke-width="2"/>

            <!-- Spring A (zigzag) -->
            <polyline id="scene1-springA"
                      points="175,220 185,208 195,232 205,208 215,232 225,208 235,232 245,208 255,232 265,208 275,232 285,208 295,220"
                      fill="none" stroke="#000000" stroke-width="2"/>
            <!-- Spring B (zigzag) -->
            <polyline id="scene1-springB"
                      points="505,220 515,208 525,232 535,208 545,232 555,208 565,232 575,208 585,232 595,208 605,232 615,208 625,220"
                      fill="none" stroke="#000000" stroke-width="2"/>

            <!-- Left ring of A -->
            <circle id="scene1-ringA" cx="150" cy="220" r="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
            <!-- Right ring of B -->
            <circle id="scene1-ringB" cx="650" cy="220" r="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>

            <!-- Hook connection between A and B -->
            <path id="scene1-hook-conn" d="M310,220 Q320,205 330,220 Q340,235 350,220 Q360,205 370,220 Q380,235 390,220 Q400,205 410,220 Q420,235 430,220 Q440,205 450,220 Q460,235 470,220 Q480,205 490,220"
                  fill="none" stroke="#000000" stroke-width="2"/>

            <!-- Static labels -->
            <text id="scene1-label-A" x="230" y="172" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">A</text>
            <text id="scene1-label-B" x="570" y="172" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">B</text>
            <text id="scene1-label-jia" x="230" y="280" text-anchor="middle" font-size="16" fill="#000000">甲</text>
            <text id="scene1-label-yi" x="570" y="280" text-anchor="middle" font-size="16" fill="#000000">乙</text>

            <!-- ====== DYNAMIC ELEMENTS (shown per step) ====== -->

            <!-- Step 1: A reading + F_B对A -->
            <rect id="scene1-highlightA" class="scene1-highlight" x="150" y="190" width="160" height="60" rx="3" ry="3"
                  fill="#1565c0" fill-opacity="0.15" stroke="none"/>
            <text id="scene1-readingA" class="scene1-dyn" x="230" y="155" text-anchor="middle" font-size="15" fill="#1565c0" font-weight="bold">读数 = 8N</text>
            <!-- F_B对A arrow: from hook area pointing right into A -->
            <line id="scene1-arrow-FBA" class="scene1-dyn" x1="310" y1="200" x2="370" y2="200"
                  stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-marker-blue)"/>
            <text id="scene1-label-FBA" class="scene1-dyn" x="340" y="188" text-anchor="middle" font-size="14" fill="#1565c0">F<sub>B对A</sub> = 8N</text>
            <text id="scene1-hintA" class="scene1-dyn" x="230" y="305" text-anchor="middle" font-size="13" fill="#888888">弹簧测力计读数 = 挂钩处受力</text>

            <!-- Step 2: B reading + F_A对B + Newton's 3rd law -->
            <rect id="scene1-highlightB" class="scene1-highlight" x="490" y="190" width="160" height="60" rx="3" ry="3"
                  fill="#c62828" fill-opacity="0.15" stroke="none"/>
            <text id="scene1-readingB" class="scene1-dyn" x="570" y="155" text-anchor="middle" font-size="15" fill="#c62828" font-weight="bold">读数 = 8N</text>
            <!-- F_A对B arrow: from hook area pointing left into B -->
            <line id="scene1-arrow-FAB" class="scene1-dyn" x1="490" y1="200" x2="430" y2="200"
                  stroke="#c62828" stroke-width="3" marker-end="url(#scene1-marker-red)"/>
            <text id="scene1-label-FAB" class="scene1-dyn" x="460" y="188" text-anchor="middle" font-size="14" fill="#c62828">F<sub>A对B</sub> = 8N</text>
            <!-- Newton's 3rd law text -->
            <text id="scene1-newton3" class="scene1-dyn" x="400" y="115" text-anchor="middle" font-size="14" fill="#333333" font-weight="bold">牛顿第三定律：作用力与反作用力</text>
            <text id="scene1-newton3b" class="scene1-dyn" x="400" y="135" text-anchor="middle" font-size="14" fill="#333333" font-weight="bold">大小相等、方向相反</text>

            <!-- Step 3: Hand force on A -->
            <line id="scene1-arrow-handA" class="scene1-dyn" x1="140" y1="240" x2="60" y2="240"
                  stroke="#2e7d32" stroke-width="3" marker-end="url(#scene1-marker-green)"/>
            <text id="scene1-label-handA" class="scene1-dyn" x="100" y="235" text-anchor="middle" font-size="14" fill="#2e7d32">F<sub>手对A</sub> = 8N</text>
            <text id="scene1-balanceA" class="scene1-dyn" x="230" y="330" text-anchor="middle" font-size="13" fill="#555555">A静止 → 合力为0 → F<sub>手对A</sub> = F<sub>B对A</sub> = 8N</text>

            <!-- Step 4: Hand force on B -->
            <line id="scene1-arrow-handB" class="scene1-dyn" x1="660" y1="240" x2="740" y2="240"
                  stroke="#2e7d32" stroke-width="3" marker-end="url(#scene1-marker-green)"/>
            <text id="scene1-label-handB" class="scene1-dyn" x="700" y="235" text-anchor="middle" font-size="14" fill="#2e7d32">F<sub>手对B</sub> = 8N</text>
            <text id="scene1-balanceB" class="scene1-dyn" x="570" y="330" text-anchor="middle" font-size="13" fill="#555555">B静止 → 合力为0 → F<sub>手对B</sub> = F<sub>A对B</sub> = 8N</text>

            <!-- Step 5: Conclusion box -->
            <g id="scene1-conclusion" class="scene1-dyn">
                <rect x="100" y="365" width="600" height="55" rx="6" ry="6"
                      fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
                <text x="400" y="390" text-anchor="middle" font-size="16" fill="#1565c0" font-weight="bold">B的读数 = 8N，手对测力计的拉力 = 8N</text>
                <text x="400" y="412" text-anchor="middle" font-size="15" fill="#1565c0" font-weight="bold">故选 A</text>
            </g>
        </svg>

        <!-- Controls -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">0/5</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        var currentStep = 0;
        var maxStep = 5;

        // Element ID lists per step
        var stepElements = {
            1: ['scene1-highlightA', 'scene1-readingA', 'scene1-arrow-FBA', 'scene1-label-FBA', 'scene1-hintA'],
            2: ['scene1-highlightB', 'scene1-readingB', 'scene1-arrow-FAB', 'scene1-label-FAB', 'scene1-newton3', 'scene1-newton3b'],
            3: ['scene1-arrow-handA', 'scene1-label-handA', 'scene1-balanceA'],
            4: ['scene1-arrow-handB', 'scene1-label-handB', 'scene1-balanceB'],
            5: ['scene1-conclusion']
        };

        function show(id) {
            var el = document.getElementById(id);
            if (!el) return;
            el.style.display = '';
            el.classList.add('visible');
            el.style.opacity = '';
        }

        function hide(id) {
            var el = document.getElementById(id);
            if (!el) return;
            el.classList.remove('visible');
            el.style.opacity = '0';
        }

        function renderStep(step) {
            // Show/hide elements for each step
            for (var s = 1; s <= maxStep; s++) {
                var ids = stepElements[s];
                if (ids) {
                    for (var i = 0; i < ids.length; i++) {
                        if (s <= step) {
                            show(ids[i]);
                        } else {
                            hide(ids[i]);
                        }
                    }
                }
            }

            // Update buttons
            document.getElementById('scene1-btn-prev').disabled = (step <= 0);
            document.getElementById('scene1-btn-next').disabled = (step >= maxStep);
            document.getElementById('scene1-step-indicator').textContent = step + '/' + maxStep;
        }

        // Event listeners
        document.getElementById('scene1-btn-next').addEventListener('click', function() {
            if (currentStep < maxStep) {
                currentStep++;
                renderStep(currentStep);
            }
        });

        document.getElementById('scene1-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
            }
        });

        // Initial render
        renderStep(0);

    })();
    </script>
</body>
</html>
