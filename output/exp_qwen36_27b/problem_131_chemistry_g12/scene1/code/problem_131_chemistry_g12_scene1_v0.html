<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原电池-电解池组合装置</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; display: block; }
        #scene1-controls {
            position: absolute; bottom: 8px; left: 0; right: 0;
            display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10;
        }
        #scene1-controls button {
            padding: 6px 18px; font-size: 14px; border: 1px solid #999; border-radius: 4px;
            background: #f0f0f0; cursor: pointer; transition: background 0.2s;
        }
        #scene1-controls button:hover:not(:disabled) { background: #ddd; }
        #scene1-controls button:disabled { opacity: 0.4; cursor: default; }
        #scene1-step-indicator { font-size: 14px; color: #333; min-width: 80px; text-align: center; }

        .step-element {
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }
        .step-element.visible {
            opacity: 1;
            pointer-events: auto;
        }

        @keyframes dashFlow {
            to { stroke-dashoffset: -20; }
        }
        .electron-flow {
            stroke-dasharray: 8, 4;
            animation: dashFlow 0.8s linear infinite;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <marker id="scene1-arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                    <polygon points="0,0 8,3 0,6" fill="#1565c0"/>
                </marker>
                <marker id="scene1-arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                    <polygon points="0,0 8,3 0,6" fill="#2e7d32"/>
                </marker>
            </defs>

            <!-- ====== STATIC ELEMENTS ====== -->

            <!-- Left beaker (electrolytic cell) -->
            <path id="scene1-beaker-left" d="M170,130 L170,220 Q170,240 190,240 L310,240 Q330,240 330,220 L330,130"
                  fill="none" stroke="#000" stroke-width="2"/>
            <path id="scene1-beaker-left-liquid" d="M172,150 L172,218 Q172,238 190,238 L310,238 Q328,238 328,218 L328,150 Z"
                  fill="#e3f2fd" opacity="0.3"/>
            <line x1="172" y1="150" x2="328" y2="150" stroke="#000" stroke-width="1"/>

            <!-- Right beaker (galvanic cell) -->
            <path id="scene1-beaker-right" d="M470,130 L470,220 Q470,240 490,240 L610,240 Q630,240 630,220 L630,130"
                  fill="none" stroke="#000" stroke-width="2"/>
            <path id="scene1-beaker-right-liquid" d="M472,150 L472,218 Q472,238 490,238 L610,238 Q628,238 628,218 L628,150 Z"
                  fill="#e3f2fd" opacity="0.3"/>
            <line x1="472" y1="150" x2="628" y2="150" stroke="#000" stroke-width="1"/>

            <!-- Electrodes (extend above beaker) -->
            <rect id="scene1-elec-pt" x="195" y="80" width="10" height="150" fill="#888" stroke="#000" stroke-width="1.5" rx="1"/>
            <rect id="scene1-elec-cu" x="295" y="80" width="10" height="150" fill="#b87333" stroke="#000" stroke-width="1.5" rx="1"/>
            <rect id="scene1-elec-zn" x="495" y="80" width="10" height="150" fill="#78909c" stroke="#000" stroke-width="1.5" rx="1"/>
            <rect id="scene1-elec-c" x="595" y="80" width="10" height="150" fill="#424242" stroke="#000" stroke-width="1.5" rx="1"/>

            <!-- Electrode name labels (offset 25px from electrodes, well below wires) -->
            <text id="scene1-label-pt" x="168" y="178" text-anchor="end" font-size="15" fill="#000" font-weight="bold">Pt</text>
            <text id="scene1-label-cu" x="322" y="178" text-anchor="start" font-size="15" fill="#000" font-weight="bold">Cu</text>
            <text id="scene1-label-zn" x="468" y="178" text-anchor="end" font-size="15" fill="#000" font-weight="bold">Zn</text>
            <text id="scene1-label-c" x="622" y="178" text-anchor="start" font-size="15" fill="#000" font-weight="bold">C</text>

            <!-- Top wire: Pt → Ammeter → C -->
            <path id="scene1-wire-top" d="M200,80 L200,50 L590,50 L590,80" fill="none" stroke="#000" stroke-width="2"/>

            <!-- Bottom wire: Cu → Switch → Zn -->
            <path id="scene1-wire-bottom-left" d="M300,80 L300,105 L380,105" fill="none" stroke="#000" stroke-width="2"/>
            <path id="scene1-wire-bottom-right" d="M420,105 L500,105 L500,80" fill="none" stroke="#000" stroke-width="2"/>

            <!-- Ammeter (ring only, no fill) -->
            <circle id="scene1-ammeter" cx="400" cy="50" r="18" fill="none" stroke="#000" stroke-width="2"/>
            <text id="scene1-ammeter-label" x="400" y="55" text-anchor="middle" font-size="14" fill="#000" font-weight="bold">A</text>

            <!-- Switch (open state) -->
            <circle cx="380" cy="105" r="3" fill="#000"/>
            <circle cx="420" cy="105" r="3" fill="#000"/>
            <line id="scene1-switch-lever" x1="380" y1="105" x2="415" y2="93" stroke="#000" stroke-width="2"/>

            <!-- Solution labels -->
            <text id="scene1-soln-left" x="250" y="265" text-anchor="middle" font-size="14" fill="#000">NaCl溶液</text>
            <text id="scene1-soln-right" x="550" y="265" text-anchor="middle" font-size="14" fill="#000">稀H₂SO₄</text>

            <!-- ====== STEP 1: Cell type labels + switch close ====== -->
            <path id="scene1-highlight-left" class="step-element" data-step="1"
                  d="M172,150 L172,218 Q172,238 190,238 L310,238 Q328,238 328,218 L328,150 Z"
                  fill="#c62828" opacity="0"/>
            <text id="scene1-label-electrolytic" class="step-element" data-step="1"
                  x="250" y="30" text-anchor="middle" font-size="15" fill="#c62828" font-weight="bold">电解池</text>

            <path id="scene1-highlight-right" class="step-element" data-step="1"
                  d="M472,150 L472,218 Q472,238 490,238 L610,238 Q628,238 628,218 L628,150 Z"
                  fill="#1565c0" opacity="0"/>
            <text id="scene1-label-galvanic" class="step-element" data-step="1"
                  x="550" y="30" text-anchor="middle" font-size="15" fill="#1565c0" font-weight="bold">原电池</text>

            <!-- ====== STEP 2: Electrode polarity + electron flow ====== -->
            <!-- Pt=阳极, Cu=阴极 (electrolytic); Zn=负极, C=正极 (galvanic) -->
            <text id="scene1-label-anode" class="step-element" data-step="2"
                  x="200" y="65" text-anchor="middle" font-size="12" fill="#c62828" font-weight="bold">阳极</text>
            <text id="scene1-label-cathode" class="step-element" data-step="2"
                  x="300" y="65" text-anchor="middle" font-size="12" fill="#c62828" font-weight="bold">阴极</text>
            <text id="scene1-label-negative" class="step-element" data-step="2"
                  x="500" y="65" text-anchor="middle" font-size="12" fill="#1565c0" font-weight="bold">负极</text>
            <text id="scene1-label-positive" class="step-element" data-step="2"
                  x="600" y="65" text-anchor="middle" font-size="12" fill="#1565c0" font-weight="bold">正极</text>

            <!-- Electron flow arrows on wires -->
            <path id="scene1-elec-flow-top" class="step-element" data-step="2"
                  d="M230,50 L560,50" fill="none" stroke="#1565c0" stroke-width="2.5"
                  marker-end="url(#scene1-arrow-blue)" class="electron-flow"/>
            <path id="scene1-elec-flow-bottom" class="step-element" data-step="2"
                  d="M470,105 L330,105" fill="none" stroke="#1565c0" stroke-width="2.5"
                  marker-end="url(#scene1-arrow-blue)" class="electron-flow"/>

            <!-- ====== STEP 3: Ion migration ====== -->
            <!-- Na+ → Cu(cathode), Cl- → Pt(anode) in electrolytic cell -->
            <path id="scene1-ion-na" class="step-element" data-step="3"
                  d="M260,215 L290,175" fill="none" stroke="#2e7d32" stroke-width="2"
                  stroke-dasharray="4,4" marker-end="url(#scene1-arrow-green)"/>
            <text id="scene1-ion-na-label" class="step-element" data-step="3"
                  x="298" y="168" text-anchor="start" font-size="12" fill="#2e7d32" font-weight="bold">Na⁺</text>

            <path id="scene1-ion-cl" class="step-element" data-step="3"
                  d="M240,215 L210,175" fill="none" stroke="#2e7d32" stroke-width="2"
                  stroke-dasharray="4,4" marker-end="url(#scene1-arrow-green)"/>
            <text id="scene1-ion-cl-label" class="step-element" data-step="3"
                  x="205" y="168" text-anchor="end" font-size="12" fill="#2e7d32" font-weight="bold">Cl⁻</text>

            <!-- H+ → C(positive), SO4 2- → Zn(negative) in galvanic cell -->
            <path id="scene1-ion-h" class="step-element" data-step="3"
                  d="M560,215 L590,175" fill="none" stroke="#2e7d32" stroke-width="2"
                  stroke-dasharray="4,4" marker-end="url(#scene1-arrow-green)"/>
            <text id="scene1-ion-h-label" class="step-element" data-step="3"
                  x="598" y="168" text-anchor="start" font-size="12" fill="#2e7d32" font-weight="bold">H⁺</text>

            <path id="scene1-ion-so4" class="step-element" data-step="3"
                  d="M540,215 L510,175" fill="none" stroke="#2e7d32" stroke-width="2"
                  stroke-dasharray="4,4" marker-end="url(#scene1-arrow-green)"/>
            <text id="scene1-ion-so4-label" class="step-element" data-step="3"
                  x="505" y="168" text-anchor="end" font-size="11" fill="#2e7d32" font-weight="bold">SO₄²⁻</text>

            <!-- ====== STEP 4: Electrode reactions + option analysis ====== -->
            <!-- Pt (anode): 2Cl⁻→Cl₂↑+2e⁻ -->
            <rect id="scene1-rxn-pt-bg" class="step-element" data-step="4"
                  x="130" y="288" width="115" height="28" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1"/>
            <text id="scene1-rxn-pt" class="step-element" data-step="4"
                  x="187" y="307" text-anchor="middle" font-size="11" fill="#000">2Cl⁻→Cl₂↑+2e⁻</text>

            <!-- Cu (cathode): 2H₂O+2e⁻→H₂↑+2OH⁻ -->
            <rect id="scene1-rxn-cu-bg" class="step-element" data-step="4"
                  x="260" y="288" width="145" height="28" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1"/>
            <text id="scene1-rxn-cu" class="step-element" data-step="4"
                  x="332" y="307" text-anchor="middle" font-size="11" fill="#000">2H₂O+2e⁻→H₂↑+2OH⁻</text>

            <!-- Zn (negative): Zn-2e⁻→Zn²⁺ -->
            <rect id="scene1-rxn-zn-bg" class="step-element" data-step="4"
                  x="435" y="288" width="115" height="28" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1"/>
            <text id="scene1-rxn-zn" class="step-element" data-step="4"
                  x="492" y="307" text-anchor="middle" font-size="11" fill="#000">Zn-2e⁻→Zn²⁺</text>

            <!-- C (positive): 2H⁺+2e⁻→H₂↑ -->
            <rect id="scene1-rxn-c-bg" class="step-element" data-step="4"
                  x="560" y="288" width="125" height="28" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1"/>
            <text id="scene1-rxn-c" class="step-element" data-step="4"
                  x="622" y="307" text-anchor="middle" font-size="11" fill="#000">2H⁺+2e⁻→H₂↑</text>

            <!-- Option analysis (2 rows of 2, well spaced) -->
            <text id="scene1-option-a" class="step-element" data-step="4"
                  x="250" y="340" text-anchor="middle" font-size="13" fill="#c62828">A. C为电解池阳极 ×</text>
            <text id="scene1-option-b" class="step-element" data-step="4"
                  x="550" y="340" text-anchor="middle" font-size="13" fill="#2e7d32" font-weight="bold">B. Cu附近OH⁻增大 √</text>
            <text id="scene1-option-c" class="step-element" data-step="4"
                  x="250" y="365" text-anchor="middle" font-size="13" fill="#c62828">C. Na⁺移向Pt ×</text>
            <text id="scene1-option-d" class="step-element" data-step="4"
                  x="550" y="365" text-anchor="middle" font-size="13" fill="#c62828">D. Pt上有O₂生成 ×</text>

        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0 / 4</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        var currentStep = 0;
        var maxStep = 4;

        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var stepIndicator = document.getElementById('scene1-step-indicator');
        var switchLever = document.getElementById('scene1-switch-lever');

        var switchClosed = { x2: 420, y2: 105 };
        var switchOpen = { x2: 415, y2: 93 };

        function updateSwitch(closed) {
            if (closed) {
                switchLever.setAttribute('x2', switchClosed.x2);
                switchLever.setAttribute('y2', switchClosed.y2);
            } else {
                switchLever.setAttribute('x2', switchOpen.x2);
                switchLever.setAttribute('y2', switchOpen.y2);
            }
        }

        function renderStep(step) {
            var allStepElements = document.querySelectorAll('.step-element');
            for (var i = 0; i < allStepElements.length; i++) {
                var el = allStepElements[i];
                var elStep = parseInt(el.getAttribute('data-step'));
                if (elStep <= step) {
                    el.classList.add('visible');
                    el.style.opacity = '1';
                } else {
                    el.classList.remove('visible');
                    el.style.opacity = '0';
                }
            }

            updateSwitch(step >= 1);

            var hlLeft = document.getElementById('scene1-highlight-left');
            var hlRight = document.getElementById('scene1-highlight-right');
            if (step >= 1) {
                hlLeft.style.opacity = '0.2';
                hlRight.style.opacity = '0.2';
            } else {
                hlLeft.style.opacity = '0';
                hlRight.style.opacity = '0';
            }

            btnPrev.disabled = (step <= 0);
            btnNext.disabled = (step >= maxStep);
            stepIndicator.textContent = '步骤 ' + step + ' / ' + maxStep;
        }

        btnNext.addEventListener('click', function() {
            if (currentStep < maxStep) {
                currentStep++;
                renderStep(currentStep);
            }
        });

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
            }
        });

        renderStep(0);

    })();
    </script>
</body>
</html>
