<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三视图与立体图形</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 24px; background: #1976d2; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; transition: background 0.2s; }
        .scene1-btn:hover { background: #1565c0; }
        .scene1-btn:disabled { background: #bdbdbd; cursor: default; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- ===== 左侧：已知视图 ===== -->
            <text x="170" y="48" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">已知视图</text>

            <!-- 正面视图：矩形60×90，中间竖线 -->
            <g id="scene1-front-view">
                <rect x="70" y="105" width="60" height="90" fill="#fff" stroke="#000" stroke-width="2"/>
                <line x1="100" y1="105" x2="100" y2="195" stroke="#000" stroke-width="2"/>
            </g>
            <text id="scene1-front-label" x="100" y="218" text-anchor="middle" font-size="14" fill="#333">正面</text>

            <!-- 侧面视图：梯形（左斜边） -->
            <g id="scene1-side-view">
                <polygon points="190,105 250,105 250,195 215,195" fill="#fff" stroke="#000" stroke-width="2"/>
            </g>
            <text id="scene1-side-label" x="220" y="228" text-anchor="middle" font-size="14" fill="#333">侧面</text>

            <!-- 上面视图：等腰梯形 -->
            <g id="scene1-top-view">
                <polygon points="125,250 195,250 180,310 140,310" fill="#fff" stroke="#000" stroke-width="2"/>
            </g>
            <text id="scene1-top-label" x="160" y="338" text-anchor="middle" font-size="14" fill="#333">上面</text>

            <!-- ===== 右侧：选项 ===== -->
            <text x="560" y="48" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">选项</text>

            <!-- 选项①：直四棱柱（梯形底面） -->
            <g id="scene1-obj1">
                <!-- 顶面（梯形） -->
                <polygon points="370,160 470,160 450,120 390,120" fill="#e3f2fd" fill-opacity="0.2" stroke="#000" stroke-width="2"/>
                <!-- 右侧面 -->
                <polygon points="470,160 470,260 450,220 450,120" fill="#e3f2fd" fill-opacity="0.2" stroke="#000" stroke-width="2"/>
                <!-- 正面 -->
                <polygon points="370,160 470,160 470,260 370,260" fill="#e3f2fd" fill-opacity="0.2" stroke="#000" stroke-width="2"/>
                <!-- 正面中线 -->
                <line x1="420" y1="160" x2="420" y2="260" stroke="#000" stroke-width="2"/>
            </g>
            <text id="scene1-obj1-label" x="420" y="340" text-anchor="middle" font-size="16" fill="#333">①</text>

            <!-- 选项②：五棱柱（房子形）- 初始隐藏 -->
            <g id="scene1-obj2" style="display:none;">
                <!-- 顶面 -->
                <polygon points="510,160 610,160 590,120 530,120" fill="#f5f5f5" fill-opacity="0.2" stroke="#000" stroke-width="2"/>
                <!-- 右侧面 -->
                <polygon points="610,160 610,260 590,220 590,120" fill="#f5f5f5" fill-opacity="0.2" stroke="#000" stroke-width="2"/>
                <!-- 正面（五边形） -->
                <polygon points="510,260 610,260 610,160 560,120 510,160" fill="#f5f5f5" fill-opacity="0.2" stroke="#000" stroke-width="2"/>
            </g>
            <text id="scene1-obj2-label" x="560" y="340" text-anchor="middle" font-size="16" fill="#333" style="display:none;">②</text>

            <!-- 选项③：五棱柱（房子形）- 初始隐藏 -->
            <g id="scene1-obj3" style="display:none;">
                <!-- 顶面 -->
                <polygon points="650,160 750,160 730,120 670,120" fill="#f5f5f5" fill-opacity="0.2" stroke="#000" stroke-width="2"/>
                <!-- 右侧面 -->
                <polygon points="750,160 750,260 730,220 730,120" fill="#f5f5f5" fill-opacity="0.2" stroke="#000" stroke-width="2"/>
                <!-- 正面（五边形） -->
                <polygon points="650,260 750,260 750,160 700,120 650,160" fill="#f5f5f5" fill-opacity="0.2" stroke="#000" stroke-width="2"/>
            </g>
            <text id="scene1-obj3-label" x="700" y="340" text-anchor="middle" font-size="16" fill="#333" style="display:none;">③</text>

            <!-- ===== 动态元素 ===== -->

            <!-- 投影线 -->
            <line id="scene1-proj-front" x1="420" y1="200" x2="100" y2="150" stroke="#1565c0" stroke-width="2" stroke-dasharray="5,5" style="display:none;"/>
            <line id="scene1-proj-side" x1="420" y1="200" x2="220" y2="150" stroke="#1565c0" stroke-width="2" stroke-dasharray="5,5" style="display:none;"/>
            <!-- 上面投影线：从物体底部指向梯形上方，避开侧面标签区域 -->
            <line id="scene1-proj-top" x1="420" y1="280" x2="160" y2="320" stroke="#1565c0" stroke-width="2" stroke-dasharray="5,5" style="display:none;"/>

            <!-- 高亮边框 -->
            <rect id="scene1-hl-front" x="65" y="100" width="70" height="100" fill="none" stroke="#1565c0" stroke-width="3" rx="4" style="display:none;"/>
            <rect id="scene1-hl-side" x="185" y="100" width="70" height="100" fill="none" stroke="#1565c0" stroke-width="3" rx="4" style="display:none;"/>
            <rect id="scene1-hl-top" x="120" y="245" width="80" height="70" fill="none" stroke="#1565c0" stroke-width="3" rx="4" style="display:none;"/>
            <rect id="scene1-hl-obj1" x="360" y="110" width="120" height="160" fill="none" stroke="#1565c0" stroke-width="3" rx="4" style="display:none;"/>
            <rect id="scene1-hl-obj1-green" x="360" y="110" width="120" height="160" fill="none" stroke="#2e7d32" stroke-width="3" rx="4" style="display:none;"/>

            <!-- 绿勾标记 -->
            <g id="scene1-check-front" style="display:none;">
                <path d="M 140 145 L 144 149 L 152 141" stroke="#2e7d32" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
            <g id="scene1-check-side" style="display:none;">
                <path d="M 260 145 L 264 149 L 272 141" stroke="#2e7d32" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
            <g id="scene1-check-top" style="display:none;">
                <path d="M 200 275 L 204 279 L 212 271" stroke="#2e7d32" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </g>

            <!-- 红叉标记 -->
            <g id="scene1-x-obj2" style="display:none;">
                <path d="M 550 100 L 574 124 M 574 100 L 550 124" stroke="#c62828" stroke-width="3" fill="none" stroke-linecap="round"/>
            </g>
            <g id="scene1-x-obj3" style="display:none;">
                <path d="M 690 100 L 714 124 M 714 100 L 690 124" stroke="#c62828" stroke-width="3" fill="none" stroke-linecap="round"/>
            </g>

            <!-- 结论文字 -->
            <text id="scene1-conclusion" x="400" y="400" text-anchor="middle" font-size="24" fill="#2e7d32" font-weight="bold" style="display:none;">正确答案：①</text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn" class="scene1-btn">观察①</button>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        let currentStep = 0;
        var btn = document.getElementById('scene1-btn');

        function show(el) {
            el.style.display = '';
            el.style.opacity = '1';
        }

        function hide(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        function updateStep() {
            // 重置所有动态元素
            hide(document.getElementById('scene1-proj-front'));
            hide(document.getElementById('scene1-proj-side'));
            hide(document.getElementById('scene1-proj-top'));
            hide(document.getElementById('scene1-hl-front'));
            hide(document.getElementById('scene1-hl-side'));
            hide(document.getElementById('scene1-hl-top'));
            hide(document.getElementById('scene1-hl-obj1'));
            hide(document.getElementById('scene1-hl-obj1-green'));
            hide(document.getElementById('scene1-check-front'));
            hide(document.getElementById('scene1-check-side'));
            hide(document.getElementById('scene1-check-top'));
            hide(document.getElementById('scene1-x-obj2'));
            hide(document.getElementById('scene1-x-obj3'));
            hide(document.getElementById('scene1-conclusion'));
            hide(document.getElementById('scene1-obj2'));
            hide(document.getElementById('scene1-obj2-label'));
            hide(document.getElementById('scene1-obj3'));
            hide(document.getElementById('scene1-obj3-label'));

            switch(currentStep) {
                case 0:
                    btn.textContent = '观察①';
                    break;
                case 1:
                    show(document.getElementById('scene1-proj-front'));
                    show(document.getElementById('scene1-hl-front'));
                    show(document.getElementById('scene1-hl-obj1'));
                    show(document.getElementById('scene1-check-front'));
                    btn.textContent = '下一步';
                    break;
                case 2:
                    show(document.getElementById('scene1-proj-side'));
                    show(document.getElementById('scene1-hl-side'));
                    show(document.getElementById('scene1-check-side'));
                    btn.textContent = '下一步';
                    break;
                case 3:
                    show(document.getElementById('scene1-proj-top'));
                    show(document.getElementById('scene1-hl-top'));
                    show(document.getElementById('scene1-check-top'));
                    btn.textContent = '对比②③';
                    break;
                case 4:
                    show(document.getElementById('scene1-obj2'));
                    show(document.getElementById('scene1-obj2-label'));
                    show(document.getElementById('scene1-obj3'));
                    show(document.getElementById('scene1-obj3-label'));
                    show(document.getElementById('scene1-x-obj2'));
                    show(document.getElementById('scene1-x-obj3'));
                    btn.textContent = '结论';
                    break;
                case 5:
                    show(document.getElementById('scene1-hl-obj1-green'));
                    show(document.getElementById('scene1-conclusion'));
                    btn.textContent = '重置';
                    break;
            }
        }

        btn.addEventListener('click', function() {
            if (currentStep === 5) {
                currentStep = 0;
            } else {
                currentStep++;
            }
            updateStep();
        });

        // 初始化
        updateStep();

    })();
    </script>
</body>
</html>
