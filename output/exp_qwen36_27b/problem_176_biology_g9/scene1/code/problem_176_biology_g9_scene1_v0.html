<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上臂血液循环与丝带扎紧效应</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; display: block; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 8px 20px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer;
            transition: background 0.2s;
        }
        #scene1-prev-btn { background: #e0e0e0; color: #333; }
        #scene1-prev-btn:hover:not(:disabled) { background: #bdbdbd; }
        #scene1-prev-btn:disabled { opacity: 0.4; cursor: default; }
        #scene1-next-btn { background: #1565c0; color: #fff; }
        #scene1-next-btn:hover:not(:disabled) { background: #0d47a1; }
        #scene1-next-btn:disabled { opacity: 0.4; cursor: default; }
        #scene1-step-indicator { font-size: 14px; color: #333; min-width: 80px; text-align: center; }

        /* 淡入动画 */
        .fade-in { opacity: 0; transition: opacity 0.5s ease; }
        .fade-in.visible { opacity: 1; }

        /* 血管线宽过渡 */
        .vessel-segment { transition: stroke-width 0.5s ease, stroke 0.5s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 箭头标记 -->
                <marker id="arrow-blue-up" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <path d="M 0 10 L 5 0 L 10 10 Z" fill="#1565c0"/>
                </marker>
                <marker id="arrow-red-down" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <path d="M 0 0 L 5 10 L 10 0 Z" fill="#c62828"/>
                </marker>
            </defs>

            <!-- ===== 步骤0：基础结构 ===== -->
            <!-- 上臂轮廓（半透明矩形） -->
            <rect x="100" y="50" width="300" height="350" rx="8" fill="#f5f5f5" fill-opacity="0.1" stroke="#e0e0e0" stroke-width="1"/>
            <!-- "上臂"标签 - 在轮廓上方 -->
            <text x="250" y="45" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">上臂</text>

            <!-- 左侧静脉（完整线段，步骤0-1用） -->
            <line id="scene1-vein-full" x1="220" y1="80" x2="220" y2="380" stroke="#1565c0" stroke-width="2"/>
            <!-- 右侧动脉（完整线段，步骤0-1用） -->
            <line id="scene1-artery-full" x1="340" y1="80" x2="340" y2="380" stroke="#c62828" stroke-width="2"/>

            <!-- 左侧静脉分段（步骤2用，初始隐藏） -->
            <line id="scene1-vein-upper" class="vessel-segment" x1="220" y1="80" x2="220" y2="225" stroke="#1565c0" stroke-width="2" style="display:none;"/>
            <line id="scene1-vein-lower" class="vessel-segment" x1="220" y1="225" x2="220" y2="380" stroke="#1565c0" stroke-width="2" style="display:none;"/>
            <!-- 右侧动脉分段（步骤2用，初始隐藏） -->
            <line id="scene1-artery-upper" class="vessel-segment" x1="340" y1="80" x2="340" y2="225" stroke="#c62828" stroke-width="2" style="display:none;"/>
            <line id="scene1-artery-lower" class="vessel-segment" x1="340" y1="225" x2="340" y2="380" stroke="#c62828" stroke-width="2" style="display:none;"/>

            <!-- 丝带 -->
            <line x1="120" y1="225" x2="380" y2="225" stroke="#888888" stroke-width="3"/>
            <!-- "丝带"标签 - 在轮廓右侧 -->
            <text x="405" y="210" font-size="14" fill="#333">丝带</text>

            <!-- ===== 步骤1：血液流动方向 ===== -->
            <g id="scene1-step1-group" class="fade-in">
                <!-- 静脉向上箭头 -->
                <line id="scene1-vein-arrow" x1="220" y1="175" x2="220" y2="100" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-blue-up)"/>
                <!-- 动脉向下箭头 -->
                <line id="scene1-artery-arrow" x1="340" y1="260" x2="340" y2="340" stroke="#c62828" stroke-width="2" marker-end="url(#arrow-red-down)"/>
                <!-- 静脉标签 - 移到x=105确保距左边缘>=20px -->
                <text x="105" y="225" text-anchor="end" font-size="14" fill="#000">静脉（回心）</text>
                <!-- 动脉标签 - 在轮廓右侧，与丝带标签错开 -->
                <text x="405" y="270" text-anchor="start" font-size="14" fill="#000">动脉（离心）</text>
            </g>

            <!-- ===== 步骤2：丝带阻断血流文字 ===== -->
            <g id="scene1-step2-group" class="fade-in">
                <text x="250" y="415" text-anchor="middle" font-size="14" fill="#000" font-weight="bold">丝带阻断血流</text>
            </g>

            <!-- ===== 步骤3：编号 + 总结面板 ===== -->
            <g id="scene1-step3-group" class="fade-in">
                <!-- 编号① - 轮廓下方，静脉左侧 -->
                <text x="185" y="415" text-anchor="middle" font-size="16" fill="#333">①</text>
                <!-- 编号② - 轮廓下方，动脉右侧 -->
                <text x="375" y="415" text-anchor="middle" font-size="16" fill="#333">②</text>
                <!-- 编号③ - 轮廓上方，动脉右侧 -->
                <text x="375" y="40" text-anchor="middle" font-size="16" fill="#333">③</text>
                <!-- 编号④ - 轮廓上方，静脉左侧 -->
                <text x="185" y="40" text-anchor="middle" font-size="16" fill="#333">④</text>

                <!-- 总结面板文字（无背景矩形，避免TEXT+SHAPE重叠） -->
                <g id="scene1-summary-panel">
                    <text x="450" y="105" font-size="14" fill="#000" font-weight="bold">血管类型判断</text>
                    <text x="450" y="145" font-size="13" fill="#1565c0">血管①：静脉</text>
                    <text x="450" y="180" font-size="13" fill="#c62828">血管②：动脉</text>
                    <text x="450" y="215" font-size="13" fill="#c62828">血管③：动脉</text>
                    <text x="450" y="250" font-size="13" fill="#1565c0">血管④：静脉</text>
                    <text x="450" y="290" font-size="14" fill="#000" font-weight="bold">含氧量比较</text>
                    <text x="450" y="325" font-size="13" fill="#c62828">动脉血：含氧量高</text>
                    <text x="450" y="360" font-size="13" fill="#1565c0">静脉血：含氧量低</text>
                </g>

                <!-- 正确答案高亮：绿色指示条 + 文字（避免文字在rect内导致重叠检测误报） -->
                <g id="scene1-answer-highlight">
                    <rect x="450" y="385" width="10" height="26" rx="3" fill="#2e7d32"/>
                    <text x="470" y="403" font-size="14" fill="#2e7d32" font-weight="bold">正确答案：C</text>
                </g>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-prev-btn" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0 / 3</span>
            <button id="scene1-next-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        var currentStep = 0;
        var maxStep = 3;

        // DOM 元素引用
        var prevBtn = document.getElementById('scene1-prev-btn');
        var nextBtn = document.getElementById('scene1-next-btn');
        var stepIndicator = document.getElementById('scene1-step-indicator');

        // SVG 元素引用
        var veinFull = document.getElementById('scene1-vein-full');
        var arteryFull = document.getElementById('scene1-artery-full');
        var veinUpper = document.getElementById('scene1-vein-upper');
        var veinLower = document.getElementById('scene1-vein-lower');
        var arteryUpper = document.getElementById('scene1-artery-upper');
        var arteryLower = document.getElementById('scene1-artery-lower');

        var step1Group = document.getElementById('scene1-step1-group');
        var step2Group = document.getElementById('scene1-step2-group');
        var step3Group = document.getElementById('scene1-step3-group');

        function show(el) {
            el.style.display = '';
            el.style.opacity = '1';
            el.classList.add('visible');
        }

        function hide(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
            el.classList.remove('visible');
        }

        function renderStep(step) {
            // 更新按钮状态
            prevBtn.disabled = (step === 0);
            nextBtn.disabled = (step === maxStep);
            stepIndicator.textContent = '步骤 ' + step + ' / ' + maxStep;

            // 步骤1：血液流动方向
            if (step >= 1) {
                show(step1Group);
            } else {
                hide(step1Group);
            }

            // 步骤2：丝带扎紧效果
            if (step >= 2) {
                // 隐藏完整血管，显示分段血管
                hide(veinFull);
                hide(arteryFull);
                show(veinUpper);
                show(veinLower);
                show(arteryUpper);
                show(arteryLower);

                // 应用血管变化样式
                veinLower.setAttribute('stroke-width', '5');
                veinLower.setAttribute('stroke', '#1565c0');
                veinUpper.setAttribute('stroke-width', '1');
                veinUpper.setAttribute('stroke', '#90caf9');
                arteryUpper.setAttribute('stroke-width', '5');
                arteryUpper.setAttribute('stroke', '#c62828');
                arteryLower.setAttribute('stroke-width', '1');
                arteryLower.setAttribute('stroke', '#ef9a9a');

                show(step2Group);
            } else {
                // 恢复完整血管
                show(veinFull);
                show(arteryFull);
                hide(veinUpper);
                hide(veinLower);
                hide(arteryUpper);
                hide(arteryLower);
                hide(step2Group);
            }

            // 步骤3：编号 + 总结面板
            if (step >= 3) {
                show(step3Group);
            } else {
                hide(step3Group);
            }
        }

        // 事件绑定
        prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
            }
        });

        nextBtn.addEventListener('click', function() {
            if (currentStep < maxStep) {
                currentStep++;
                renderStep(currentStep);
            }
        });

        // 初始渲染
        renderStep(0);

    })();
    </script>
</body>
</html>
