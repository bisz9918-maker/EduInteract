<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四棱锥P-ABCD — 命题①反证法验证</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; display: block; }
        #scene1-controls {
            position: absolute; bottom: 10px; left: 0; right: 0;
            display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10;
        }
        #scene1-controls button {
            padding: 8px 20px; font-size: 14px; border: 1px solid #999; border-radius: 6px;
            background: #f5f5f5; cursor: pointer; transition: background 0.2s;
        }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.4; cursor: default; }
        #scene1-step-indicator { font-size: 14px; color: #555; min-width: 80px; text-align: center; }
        .step-hidden { opacity: 0; pointer-events: none; transition: opacity 0.35s ease; }
        .step-visible { opacity: 1; pointer-events: auto; transition: opacity 0.35s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <line id="scene1-edge-pd" x1="280" y1="70" x2="320" y2="290" stroke="#000" stroke-width="1.5" stroke-dasharray="8,4" />
            <line id="scene1-edge-ad" x1="100" y1="350" x2="320" y2="290" stroke="#000" stroke-width="1.5" stroke-dasharray="8,4" />
            <line id="scene1-edge-cd" x1="320" y1="290" x2="460" y2="370" stroke="#000" stroke-width="1.5" stroke-dasharray="8,4" />
            <line id="scene1-edge-pa" x1="280" y1="70" x2="100" y2="350" stroke="#000" stroke-width="2" />
            <line id="scene1-edge-pb" x1="280" y1="70" x2="260" y2="390" stroke="#000" stroke-width="2" />
            <line id="scene1-edge-pc" x1="280" y1="70" x2="460" y2="370" stroke="#000" stroke-width="2" />
            <line id="scene1-edge-ab" x1="100" y1="350" x2="260" y2="390" stroke="#000" stroke-width="2" />
            <line id="scene1-edge-bc" x1="260" y1="390" x2="460" y2="370" stroke="#000" stroke-width="2" />
            <circle id="scene1-vertex-p" cx="280" cy="70" r="4" fill="#000" />
            <circle id="scene1-vertex-a" cx="100" cy="350" r="4" fill="#000" />
            <circle id="scene1-vertex-b" cx="260" cy="390" r="4" fill="#000" />
            <circle id="scene1-vertex-c" cx="460" cy="370" r="4" fill="#000" />
            <circle id="scene1-vertex-d" cx="320" cy="290" r="4" fill="#000" />
            <text id="scene1-label-p" x="280" y="55" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">P</text>
            <text id="scene1-label-a" x="80" y="360" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">A</text>
            <text id="scene1-label-b" x="250" y="415" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">B</text>
            <text id="scene1-label-c" x="480" y="380" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">C</text>
            <text id="scene1-label-d" x="300" y="275" text-anchor="end" font-size="16" font-weight="bold" fill="#000">D</text>
            <polygon id="scene1-plane-pab" points="280,70 100,350 260,390" fill="#1565c0" fill-opacity="0.2" stroke="none" class="step-hidden" />
            <line id="scene1-line-dc" x1="320" y1="290" x2="460" y2="370" stroke="#c62828" stroke-width="3" class="step-hidden" />
            <line id="scene1-line-l" x1="180" y1="210" x2="300" y2="240" stroke="#2e7d32" stroke-width="2" stroke-dasharray="8,4" class="step-hidden" />
            <text id="scene1-label-l" x="75" y="185" text-anchor="end" font-size="16" font-weight="bold" fill="#2e7d32" class="step-hidden">l</text>
            <g id="scene1-line-l-cross" class="step-hidden">
                <line x1="180" y1="210" x2="300" y2="240" stroke="#c62828" stroke-width="2.5" stroke-dasharray="8,4" />
                <line x1="228" y1="218" x2="252" y2="228" stroke="#c62828" stroke-width="3" />
                <line x1="252" y1="218" x2="228" y2="228" stroke="#c62828" stroke-width="3" />
            </g>
            <text id="scene1-prop-text" x="460" y="100" font-size="15" fill="#333" class="step-hidden">命题①：平面PAB内是否存在直线与DC平行？</text>
            <text id="scene1-assume-text" x="460" y="145" font-size="15" fill="#2e7d32" class="step-hidden">假设：l ⊂ 平面PAB，l ∥ DC</text>
            <text id="scene1-derive-1" x="460" y="200" font-size="14" fill="#888" class="step-hidden">l ∥ DC</text>
            <line id="scene1-arrow-1" x1="460" y1="210" x2="460" y2="228" stroke="#888" stroke-width="1" stroke-dasharray="4,3" class="step-hidden" />
            <text id="scene1-derive-2" x="460" y="245" font-size="14" fill="#888" class="step-hidden">⇒ DC ∥ 平面PAB（线面平行判定）</text>
            <line id="scene1-arrow-2" x1="460" y1="255" x2="460" y2="273" stroke="#888" stroke-width="1" stroke-dasharray="4,3" class="step-hidden" />
            <text id="scene1-derive-3" x="460" y="290" font-size="14" fill="#888" class="step-hidden">⇒ DC ∥ AB（线面平行性质）</text>
            <text id="scene1-contradict" x="460" y="345" font-size="15" font-weight="bold" fill="#c62828" class="step-hidden">矛盾！题设：AB与DC不平行</text>
            <text id="scene1-conclusion" x="460" y="420" font-size="15" font-weight="bold" fill="#2e7d32" class="step-hidden">命题① ✓ 正确</text>
        </svg>
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/4</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        var currentStep = 0;
        var maxStep = 4;
        var btnPrev = document.getElementById("scene1-btn-prev");
        var btnNext = document.getElementById("scene1-btn-next");
        var stepIndicator = document.getElementById("scene1-step-indicator");
        var stepElements = {
            1: ["scene1-plane-pab", "scene1-line-dc", "scene1-prop-text"],
            2: ["scene1-line-l", "scene1-label-l", "scene1-assume-text"],
            3: ["scene1-derive-1", "scene1-arrow-1", "scene1-derive-2", "scene1-arrow-2", "scene1-derive-3"],
            4: ["scene1-line-l-cross", "scene1-contradict", "scene1-conclusion"]
        };
        function showElement(id) {
            var el = document.getElementById(id);
            if (el) { el.classList.remove("step-hidden"); el.classList.add("step-visible"); el.style.display = ""; el.style.opacity = ""; }
        }
        function hideElement(id) {
            var el = document.getElementById(id);
            if (el) { el.classList.remove("step-visible"); el.classList.add("step-hidden"); }
        }
        function renderStep(step) {
            for (var s = 1; s <= maxStep; s++) {
                var ids = stepElements[s];
                for (var i = 0; i < ids.length; i++) hideElement(ids[i]);
            }
            for (var s = 1; s <= step; s++) {
                var ids = stepElements[s];
                for (var i = 0; i < ids.length; i++) showElement(ids[i]);
            }
            if (step >= 4) { hideElement("scene1-line-l"); hideElement("scene1-label-l"); }
            btnPrev.disabled = (step === 0);
            btnNext.disabled = (step === maxStep);
            stepIndicator.textContent = "步骤 " + step + "/4";
        }
        btnNext.addEventListener("click", function() { if (currentStep < maxStep) { currentStep++; renderStep(currentStep); } });
        btnPrev.addEventListener("click", function() { if (currentStep > 0) { currentStep--; renderStep(currentStep); } });
        renderStep(0);
    })();
    </script>
</body>
</html>
