<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四面体ABCD - 空间结构展示</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; display: block; }

        /* 棱的过渡动画 */
        #scene1-edge-ad, #scene1-edge-bc {
            transition: stroke 0.4s ease, stroke-width 0.4s ease;
        }

        /* 淡入效果 */
        .scene1-fade-in {
            transition: opacity 0.4s ease-in;
        }

        /* 控件栏 */
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        #scene1-controls button {
            width: 80px;
            height: 32px;
            font-size: 14px;
            border: 1px solid #999;
            border-radius: 4px;
            background: #f5f5f5;
            cursor: pointer;
            color: #333;
        }
        #scene1-controls button:disabled {
            background: #e0e0e0;
            color: #aaa;
            cursor: not-allowed;
            border-color: #ccc;
        }
        #scene1-controls button:not(:disabled):hover {
            background: #e8e8e8;
        }
        #scene1-step-indicator {
            font-size: 13px;
            color: #666;
            min-width: 70px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- ===== 棱（步骤0即显示） ===== -->
            <!-- AC: 虚线灰（被遮挡的棱） -->
            <line id="scene1-edge-ac" x1="260" y1="380" x2="540" y2="260"
                  stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4" />
            <!-- AB: 实线黑 -->
            <line id="scene1-edge-ab" x1="260" y1="380" x2="410" y2="300"
                  stroke="#000000" stroke-width="2" />
            <!-- AD: 实线黑（步骤1高亮蓝） -->
            <line id="scene1-edge-ad" x1="260" y1="380" x2="260" y2="100"
                  stroke="#000000" stroke-width="2" />
            <!-- BC: 实线黑（步骤1高亮红） -->
            <line id="scene1-edge-bc" x1="410" y1="300" x2="540" y2="260"
                  stroke="#000000" stroke-width="2" />
            <!-- BD: 实线黑 -->
            <line id="scene1-edge-bd" x1="410" y1="300" x2="260" y2="100"
                  stroke="#000000" stroke-width="2" />
            <!-- CD: 实线黑 -->
            <line id="scene1-edge-cd" x1="540" y1="260" x2="260" y2="100"
                  stroke="#000000" stroke-width="2" />

            <!-- ===== 顶点（步骤0即显示） ===== -->
            <circle id="scene1-vert-a" cx="260" cy="380" r="3" fill="#000000" />
            <circle id="scene1-vert-b" cx="410" cy="300" r="3" fill="#000000" />
            <circle id="scene1-vert-c" cx="540" cy="260" r="3" fill="#000000" />
            <circle id="scene1-vert-d" cx="260" cy="100" r="3" fill="#000000" />

            <!-- ===== 顶点标签（步骤0即显示） ===== -->
            <!-- A: 左下方，x<260, y>380 -->
            <text id="scene1-label-a" x="238" y="402" font-size="16" font-weight="bold" fill="#000000" text-anchor="end">A</text>
            <!-- B: 右下方，远离所有线段边界框 -->
            <text id="scene1-label-b" x="430" y="420" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">B</text>
            <!-- C: 右方，x>540 -->
            <text id="scene1-label-c" x="562" y="252" font-size="16" font-weight="bold" fill="#000000" text-anchor="start">C</text>
            <!-- D: 左上方，x<260, y<100 -->
            <text id="scene1-label-d" x="238" y="88" font-size="16" font-weight="bold" fill="#000000" text-anchor="end">D</text>

            <!-- ===== 步骤1：垂直符号 ===== -->
            <polyline id="scene1-perp-symbol" class="scene1-fade-in"
                      points="275,225 295,225 295,245"
                      fill="none" stroke="#1565c0" stroke-width="2"
                      opacity="0" />

            <!-- ===== 步骤2：长度标注 ===== -->
            <!-- AD=2c: AD左侧，x<260 -->
            <text id="scene1-label-ad" class="scene1-fade-in"
                  x="222" y="242" font-size="14" fill="#1565c0" text-anchor="end"
                  opacity="0">AD=2c</text>
            <!-- BC=2: BC右方，x>540, y>300 -->
            <text id="scene1-label-bc" class="scene1-fade-in"
                  x="565" y="320" font-size="14" fill="#c62828" text-anchor="start"
                  opacity="0">BC=2</text>

            <!-- ===== 步骤3：约束条件标注 ===== -->
            <!-- AB+BD=2a: 下方，y>380 -->
            <text id="scene1-label-ab-bd" class="scene1-fade-in"
                  x="340" y="420" font-size="14" fill="#2e7d32" text-anchor="middle"
                  opacity="0">AB+BD=2a</text>
            <!-- AC+CD=2a: 上方，y<100 -->
            <text id="scene1-label-ac-cd" class="scene1-fade-in"
                  x="440" y="60" font-size="14" fill="#2e7d32" text-anchor="middle"
                  opacity="0">AC+CD=2a</text>

            <!-- ===== 步骤4：公垂线段 ===== -->
            <line id="scene1-common-perp" class="scene1-fade-in"
                  x1="260" y1="240" x2="410" y2="280"
                  stroke="#ef6c00" stroke-width="2" stroke-dasharray="6,4"
                  opacity="0" />
            <!-- h: 公垂线段左侧，x<260, y=290 (远离AD=2c标签) -->
            <text id="scene1-label-h" class="scene1-fade-in"
                  x="240" y="290" font-size="14" fill="#ef6c00" text-anchor="end"
                  opacity="0">h</text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/4</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // ===== 顶点坐标常量 =====
        var VERTS = {
            A: { x: 260, y: 380 },
            B: { x: 410, y: 300 },
            C: { x: 540, y: 260 },
            D: { x: 260, y: 100 }
        };

        // ===== 状态变量 =====
        var currentStep = 0;
        var maxStep = 4;

        // ===== DOM 引用 =====
        var btnPrev = document.getElementById("scene1-btn-prev");
        var btnNext = document.getElementById("scene1-btn-next");
        var stepIndicator = document.getElementById("scene1-step-indicator");
        var edgeAD = document.getElementById("scene1-edge-ad");
        var edgeBC = document.getElementById("scene1-edge-bc");
        var perpSymbol = document.getElementById("scene1-perp-symbol");
        var labelAD = document.getElementById("scene1-label-ad");
        var labelBC = document.getElementById("scene1-label-bc");
        var labelABBD = document.getElementById("scene1-label-ab-bd");
        var labelACCD = document.getElementById("scene1-label-ac-cd");
        var commonPerp = document.getElementById("scene1-common-perp");
        var labelH = document.getElementById("scene1-label-h");

        // ===== 工具函数：显示/隐藏元素 =====
        function show(el) {
            el.style.display = "";
            requestAnimationFrame(function() {
                el.style.opacity = "1";
            });
        }

        function hide(el) {
            el.style.opacity = "0";
            setTimeout(function() {
                if (el.style.opacity === "0") {
                    el.style.display = "none";
                }
            }, 400);
        }

        // ===== 步骤渲染 =====
        function renderStep(step) {
            stepIndicator.textContent = "步骤 " + step + "/4";
            btnPrev.disabled = (step === 0);
            btnNext.disabled = (step === maxStep);

            // 步骤1：AD⊥BC 高亮 + 垂直符号
            if (step >= 1) {
                edgeAD.style.stroke = "#1565c0";
                edgeAD.style.strokeWidth = "3";
                edgeBC.style.stroke = "#c62828";
                edgeBC.style.strokeWidth = "3";
                show(perpSymbol);
            } else {
                edgeAD.style.stroke = "#000000";
                edgeAD.style.strokeWidth = "2";
                edgeBC.style.stroke = "#000000";
                edgeBC.style.strokeWidth = "2";
                hide(perpSymbol);
            }

            // 步骤2：长度标注
            if (step >= 2) {
                show(labelAD);
                show(labelBC);
            } else {
                hide(labelAD);
                hide(labelBC);
            }

            // 步骤3：约束条件标注
            if (step >= 3) {
                show(labelABBD);
                show(labelACCD);
            } else {
                hide(labelABBD);
                hide(labelACCD);
            }

            // 步骤4：公垂线段
            if (step >= 4) {
                show(commonPerp);
                show(labelH);
            } else {
                hide(commonPerp);
                hide(labelH);
            }
        }

        // ===== 事件绑定 =====
        btnNext.addEventListener("click", function() {
            if (currentStep < maxStep) {
                currentStep++;
                renderStep(currentStep);
            }
        });

        btnPrev.addEventListener("click", function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
            }
        });

        // ===== 初始化：渲染步骤0 =====
        renderStep(0);

    })();
    </script>
</body>
</html>
