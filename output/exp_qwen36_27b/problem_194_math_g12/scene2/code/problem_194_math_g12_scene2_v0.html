<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四面体体积公式推导</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-svg { width: 800px; height: 500px; display: block; }
        #scene2-controls {
            position: absolute; bottom: 10px; left: 0; right: 0;
            display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10;
        }
        #scene2-btn-prev, #scene2-btn-next {
            padding: 8px 20px; font-size: 14px; border: none; border-radius: 6px;
            cursor: pointer; color: #fff; background: #1565c0; min-width: 100px;
            transition: background 0.2s;
        }
        #scene2-btn-prev:disabled, #scene2-btn-next:disabled {
            background: #cccccc; cursor: not-allowed;
        }
        #scene2-btn-prev:hover:not(:disabled), #scene2-btn-next:hover:not(:disabled) {
            background: #0d47a1;
        }
        #scene2-step-indicator {
            font-size: 14px; color: #333; min-width: 100px; text-align: center;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <marker id="scene2-arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0" />
                </marker>
                <marker id="scene2-arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#555555" />
                </marker>
            </defs>

            <!-- ===== 静态元素：四面体 ===== -->
            <g id="scene2-static">
                <!-- 棱 AC（灰色虚线，不可见棱） -->
                <line x1="130" y1="380" x2="370" y2="280" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4" />
                <!-- 棱 AB（黑色实线） -->
                <line x1="130" y1="380" x2="270" y2="360" stroke="#000000" stroke-width="2" />
                <!-- 棱 BD（黑色实线） -->
                <line x1="270" y1="360" x2="130" y2="100" stroke="#000000" stroke-width="2" />
                <!-- 棱 CD（黑色实线） -->
                <line x1="370" y1="280" x2="130" y2="100" stroke="#000000" stroke-width="2" />
                <!-- 棱 AD（蓝色高亮） -->
                <line x1="130" y1="380" x2="130" y2="100" stroke="#1565c0" stroke-width="3" />
                <!-- 棱 BC（红色高亮） -->
                <line x1="270" y1="360" x2="370" y2="280" stroke="#c62828" stroke-width="3" />

                <!-- 公垂线段 h（橙色虚线） -->
                <line id="scene2-h-line" x1="130" y1="240" x2="320" y2="320" stroke="#ef6c00" stroke-width="2" stroke-dasharray="6,4" />

                <!-- 垂足 M（橙色圆点） -->
                <circle cx="130" cy="240" r="5" fill="#ef6c00" />
                <!-- 垂足 N（橙色圆点） -->
                <circle cx="320" cy="320" r="5" fill="#ef6c00" />

                <!-- 顶点（黑色圆点） -->
                <circle cx="130" cy="380" r="4" fill="#000000" />
                <circle cx="270" cy="360" r="4" fill="#000000" />
                <circle cx="370" cy="280" r="4" fill="#000000" />
                <circle cx="130" cy="100" r="4" fill="#000000" />

                <!-- 顶点标签（远离线条，无需白边） -->
                <text x="110" y="400" font-size="16" fill="#000000" text-anchor="end">A</text>
                <text x="285" y="385" font-size="16" fill="#000000" text-anchor="start">B</text>
                <text x="390" y="285" font-size="16" fill="#000000" text-anchor="start">C</text>
                <text x="110" y="90" font-size="16" fill="#000000" text-anchor="end">D</text>

                <!-- 棱标注 AD（白边防重叠，移到AD线左侧更远） -->
                <text x="92" y="240" font-size="14" fill="#1565c0" text-anchor="middle"
                      stroke="#ffffff" stroke-width="5" paint-order="stroke fill">AD</text>

                <!-- 棱标注 BC（白边防重叠，移到BC线下方更远） -->
                <text x="320" y="398" font-size="14" fill="#c62828" text-anchor="middle"
                      stroke="#ffffff" stroke-width="5" paint-order="stroke fill">BC</text>

                <!-- 公垂线段 h（白边防重叠，移到虚线上方） -->
                <text x="225" y="258" font-size="14" fill="#ef6c00" text-anchor="middle"
                      stroke="#ffffff" stroke-width="5" paint-order="stroke fill">h</text>

                <!-- 垂足 M（白边防重叠，移到右侧更远） -->
                <text x="155" y="238" font-size="13" fill="#ef6c00" text-anchor="start"
                      stroke="#ffffff" stroke-width="5" paint-order="stroke fill">M</text>

                <!-- 垂足 N（白边防重叠，移到右下方更远） -->
                <text x="345" y="348" font-size="13" fill="#ef6c00" text-anchor="start"
                      stroke="#ffffff" stroke-width="5" paint-order="stroke fill">N</text>
            </g>

            <!-- ===== 步骤1：向量箭头 + 公式 ===== -->
            <g id="scene2-step1" style="display:none;">
                <!-- 向量箭头 AD（蓝色，从A指向D） -->
                <line x1="130" y1="376" x2="130" y2="108" stroke="#1565c0" stroke-width="2.5" marker-end="url(#scene2-arrow-blue)" />
                <!-- 向量箭头 AB（深灰色，从A指向B） -->
                <line x1="130" y1="380" x2="266" y2="363" stroke="#555555" stroke-width="2" marker-end="url(#scene2-arrow-gray)" />
                <!-- 向量箭头 AC（深灰色，从A指向C） -->
                <line x1="130" y1="380" x2="366" y2="283" stroke="#555555" stroke-width="2" marker-end="url(#scene2-arrow-gray)" />

                <!-- 公式1 -->
                <text x="470" y="170" font-size="16" fill="#000000" id="scene2-formula1">V = 1/6 |AD·(AB×AC)|</text>
                <text x="470" y="200" font-size="12" fill="#888888">向量形式的四面体体积公式</text>
            </g>

            <!-- ===== 步骤2：简化公式 ===== -->
            <g id="scene2-step2" style="display:none;">
                <text x="470" y="245" font-size="16" fill="#000000" font-weight="bold">V = 1/6 · AD · BC · h</text>
                <text x="470" y="275" font-size="12" fill="#888888">利用AD⊥BC，体积 = 1/6 × 两异面棱长 × 公垂线段长</text>
            </g>

            <!-- ===== 步骤3：代入已知值 ===== -->
            <g id="scene2-step3" style="display:none;">
                <rect id="scene2-formula-bg" x="470" y="295" width="220" height="44" rx="4" fill="#e8f5e9" />
                <text x="580" y="323" font-size="20" fill="#2e7d32" font-weight="bold" text-anchor="middle">V = 2/3 ch</text>
                <text x="470" y="360" font-size="12" fill="#888888">代入AD=2c，BC=2</text>
            </g>

            <!-- ===== 步骤4：结论 ===== -->
            <g id="scene2-step4" style="display:none;">
                <text x="470" y="390" font-size="16" fill="#000000" font-weight="bold">V ∝ h</text>
                <text x="470" y="415" font-size="14" fill="#000000">求V的最大值 ⇔ 求h的最大值</text>
            </g>

            <!-- ===== 公式区标题（始终显示） ===== -->
            <text x="470" y="110" font-size="18" fill="#333333" font-weight="bold">体积公式推导</text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 0 / 4</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        var currentStep = 0;
        var totalSteps = 4;
        var hAnimFrame = null;

        var btnPrev = document.getElementById('scene2-btn-prev');
        var btnNext = document.getElementById('scene2-btn-next');
        var stepIndicator = document.getElementById('scene2-step-indicator');
        var hLine = document.getElementById('scene2-h-line');

        var stepGroups = [
            null,
            document.getElementById('scene2-step1'),
            document.getElementById('scene2-step2'),
            document.getElementById('scene2-step3'),
            document.getElementById('scene2-step4')
        ];

        function show(el) {
            el.style.display = '';
            el.style.opacity = '1';
        }

        function hide(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        function setOpacity(el, val) {
            el.style.opacity = String(val);
        }

        function stopHAnimation() {
            if (hAnimFrame) {
                cancelAnimationFrame(hAnimFrame);
                hAnimFrame = null;
            }
            hLine.setAttribute('stroke-width', '2');
        }

        function startHAnimation() {
            stopHAnimation();
            var startTime = null;
            var duration = 1000;
            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                var elapsed = timestamp - startTime;
                var progress = elapsed / duration;
                if (progress >= 1) {
                    hLine.setAttribute('stroke-width', '2');
                    return;
                }
                var width = 2 + 2 * Math.sin(progress * Math.PI);
                hLine.setAttribute('stroke-width', String(width));
                hAnimFrame = requestAnimationFrame(animate);
            }
            hAnimFrame = requestAnimationFrame(animate);
        }

        function renderStep(step) {
            stepIndicator.textContent = '步骤 ' + step + ' / ' + totalSteps;
            btnPrev.disabled = (step === 0);
            btnNext.disabled = (step === totalSteps);

            for (var i = 1; i <= totalSteps; i++) {
                hide(stepGroups[i]);
            }

            for (var j = 1; j <= step; j++) {
                show(stepGroups[j]);
                if (j < step) {
                    setOpacity(stepGroups[j], '0.3');
                } else {
                    setOpacity(stepGroups[j], '1');
                }
            }

            if (step === 4) {
                startHAnimation();
            } else {
                stopHAnimation();
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                renderStep(currentStep);
            }
        });

        renderStep(0);

    })();
    </script>
</body>
</html>
