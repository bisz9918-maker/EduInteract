<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆盘系统受力分析 - 分步图示</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "SimHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; display: block; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 8px 20px; font-size: 14px; border: 2px solid #1565c0; background: #ffffff;
            color: #1565c0; border-radius: 6px; cursor: pointer; transition: all 0.2s;
        }
        #scene1-controls button:hover:not(:disabled) { background: #1565c0; color: #ffffff; }
        #scene1-controls button:disabled { border-color: #cccccc; color: #cccccc; cursor: not-allowed; }
        .indicator-dot { transition: fill 0.3s; }
        .line-transition { transition: stroke 0.3s, stroke-width 0.3s; }
        .force-transition { transition: stroke 0.3s, stroke-width 0.3s, opacity 0.3s; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <marker id="scene1-marker-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#888888"/>
                </marker>
                <marker id="scene1-marker-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
                <marker id="scene1-marker-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
                </marker>
                <marker id="scene1-marker-red-dash" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
                </marker>
            </defs>

            <!-- ===== 圆盘俯视图区 ===== -->
            <!-- 圆盘椭圆（仅轮廓，无填充以避免重叠检测误报） -->
            <ellipse id="scene1-disk" cx="240" cy="210" rx="200" ry="70" fill="none" stroke="#000000" stroke-width="2"/>
            <!-- 圆盘底部弧线（透视效果） -->
            <path id="scene1-disk-bottom" d="M 40 210 A 200 70 0 0 0 440 210" fill="none" stroke="#000000" stroke-width="2"/>

            <!-- 转轴 -->
            <rect id="scene1-axis" x="235" y="100" width="10" height="220" fill="#666666" rx="2"/>

            <!-- 转动箭头（逆时针） -->
            <path id="scene1-rotation-arrow" d="M 210 130 A 35 35 0 0 1 270 110" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#scene1-marker-gray)"/>

            <!-- 半径线 -->
            <line id="scene1-radius-line" x1="240" y1="210" x2="440" y2="210" stroke="#000000" stroke-width="1"/>

            <!-- OB细线 -->
            <line id="scene1-line-ob" class="line-transition" x1="240" y1="210" x2="310" y2="210" stroke="#888888" stroke-width="1.5"/>

            <!-- AB细线 -->
            <line id="scene1-line-ab" class="line-transition" x1="330" y1="210" x2="390" y2="210" stroke="#888888" stroke-width="1.5"/>

            <!-- 物体B -->
            <rect id="scene1-object-b" x="310" y="200" width="20" height="20" fill="#ffffff" stroke="#000000" stroke-width="2" rx="2"/>

            <!-- 物体A -->
            <rect id="scene1-object-a" x="390" y="200" width="20" height="20" fill="#ffffff" stroke="#000000" stroke-width="2" rx="2"/>

            <!-- 标签：移到椭圆边界框外以避免重叠检测 -->
            <!-- O 标签：移到圆盘下方 -->
            <text id="scene1-label-o" x="225" y="298" font-size="14" fill="#000000" text-anchor="middle">O</text>
            <!-- B 标签：移到圆盘上方 -->
            <text id="scene1-label-b" x="320" y="132" font-size="14" fill="#000000" text-anchor="middle">B</text>
            <!-- A 标签：移到圆盘上方 -->
            <text id="scene1-label-a" x="400" y="132" font-size="14" fill="#000000" text-anchor="middle">A</text>
            <!-- 半径标注：移到圆盘上方 -->
            <text id="scene1-label-rb" x="275" y="120" font-size="12" fill="#000000" text-anchor="middle">r<sub>B</sub>=10cm</text>
            <text id="scene1-label-ra" x="360" y="120" font-size="12" fill="#000000" text-anchor="middle">r<sub>A</sub>=20cm</text>
            <!-- 质量标注 -->
            <text id="scene1-label-mb" x="335" y="230" font-size="13" fill="#000000" text-anchor="start">m</text>
            <text id="scene1-label-ma" x="415" y="230" font-size="13" fill="#000000" text-anchor="start">m</text>

            <!-- ===== 受力分析区 ===== -->
            <text id="scene1-force-a-title" x="635" y="95" font-size="14" fill="#000000" text-anchor="middle" font-weight="bold">A的受力</text>
            <rect id="scene1-force-a-block" x="623" y="128" width="24" height="24" fill="#ffffff" stroke="#000000" stroke-width="2" rx="2"/>

            <text id="scene1-force-b-title" x="635" y="215" font-size="14" fill="#000000" text-anchor="middle" font-weight="bold">B的受力</text>
            <rect id="scene1-force-b-block" x="623" y="248" width="24" height="24" fill="#ffffff" stroke="#000000" stroke-width="2" rx="2"/>

            <!-- ===== A的受力箭头 ===== -->
            <line id="scene1-force-a-f" class="force-transition" x1="623" y1="140" x2="593" y2="140" stroke="#888888" stroke-width="1.5" marker-end="url(#scene1-marker-gray)"/>
            <text id="scene1-force-a-f-label" x="580" y="135" font-size="12" fill="#888888" text-anchor="end">f_A</text>

            <line id="scene1-force-a-tab" class="force-transition" x1="623" y1="150" x2="588" y2="150" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-marker-blue)" opacity="0"/>
            <text id="scene1-force-a-tab-label" x="575" y="155" font-size="12" fill="#1565c0" text-anchor="end" opacity="0">T_AB</text>

            <line id="scene1-force-a-slide" class="force-transition" x1="647" y1="140" x2="677" y2="140" stroke="#c62828" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#scene1-marker-red-dash)" opacity="0"/>
            <text id="scene1-force-a-slide-label" x="685" y="135" font-size="12" fill="#c62828" text-anchor="start" opacity="0">滑动</text>

            <!-- ===== B的受力箭头 ===== -->
            <line id="scene1-force-b-f" class="force-transition" x1="623" y1="260" x2="603" y2="260" stroke="#888888" stroke-width="1.5" marker-end="url(#scene1-marker-gray)"/>
            <text id="scene1-force-b-f-label" x="590" y="255" font-size="12" fill="#888888" text-anchor="end">f_B</text>

            <line id="scene1-force-b-tob" class="force-transition" x1="623" y1="270" x2="588" y2="270" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-marker-blue)" opacity="0"/>
            <text id="scene1-force-b-tob-label" x="575" y="275" font-size="12" fill="#1565c0" text-anchor="end" opacity="0">T_OB</text>

            <line id="scene1-force-b-tab" class="force-transition" x1="647" y1="260" x2="682" y2="260" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-marker-blue)" opacity="0"/>
            <text id="scene1-force-b-tab-label" x="690" y="255" font-size="12" fill="#1565c0" text-anchor="start" opacity="0">T_AB</text>

            <!-- ===== 公式框 ===== -->
            <rect id="scene1-formula-box" x="80" y="385" width="640" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
            <text id="scene1-formula-text" x="400" y="408" font-size="14" fill="#0d47a1" text-anchor="middle">初始状态：ω &lt; ω₀，细线无张力，仅静摩擦力提供向心力</text>

            <!-- ===== 步骤指示器 ===== -->
            <circle id="scene1-indicator-0" cx="340" cy="475" r="6" fill="#1565c0" class="indicator-dot"/>
            <circle id="scene1-indicator-1" cx="365" cy="475" r="6" fill="#cccccc" class="indicator-dot"/>
            <circle id="scene1-indicator-2" cx="390" cy="475" r="6" fill="#cccccc" class="indicator-dot"/>
            <circle id="scene1-indicator-3" cx="415" cy="475" r="6" fill="#cccccc" class="indicator-dot"/>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() { 'use strict';

        var currentStep = 0;
        var totalSteps = 3;

        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var formulaText = document.getElementById('scene1-formula-text');

        var lineOB = document.getElementById('scene1-line-ob');
        var lineAB = document.getElementById('scene1-line-ab');

        var forceAF = document.getElementById('scene1-force-a-f');
        var forceAFLabel = document.getElementById('scene1-force-a-f-label');
        var forceATab = document.getElementById('scene1-force-a-tab');
        var forceATabLabel = document.getElementById('scene1-force-a-tab-label');
        var forceASlide = document.getElementById('scene1-force-a-slide');
        var forceASlideLabel = document.getElementById('scene1-force-a-slide-label');

        var forceBF = document.getElementById('scene1-force-b-f');
        var forceBFLabel = document.getElementById('scene1-force-b-f-label');
        var forceBTob = document.getElementById('scene1-force-b-tob');
        var forceBTobLabel = document.getElementById('scene1-force-b-tob-label');
        var forceBTab = document.getElementById('scene1-force-b-tab');
        var forceBTabLabel = document.getElementById('scene1-force-b-tab-label');

        var indicators = [
            document.getElementById('scene1-indicator-0'),
            document.getElementById('scene1-indicator-1'),
            document.getElementById('scene1-indicator-2'),
            document.getElementById('scene1-indicator-3')
        ];

        function show(el) {
            el.style.display = '';
            el.style.opacity = '1';
        }

        function hide(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        function updateScene(step) {
            // Reset all to defaults
            lineOB.setAttribute('stroke', '#888888');
            lineOB.setAttribute('stroke-width', '1.5');
            lineAB.setAttribute('stroke', '#888888');
            lineAB.setAttribute('stroke-width', '1.5');

            forceAF.setAttribute('stroke', '#888888');
            forceAF.setAttribute('stroke-width', '1.5');
            forceAF.setAttribute('marker-end', 'url(#scene1-marker-gray)');
            forceAF.setAttribute('x2', '593');
            forceAFLabel.setAttribute('fill', '#888888');
            forceAFLabel.textContent = 'f_A';
            show(forceAF);
            show(forceAFLabel);

            hide(forceATab);
            hide(forceATabLabel);
            hide(forceASlide);
            hide(forceASlideLabel);

            forceBF.setAttribute('stroke', '#888888');
            forceBF.setAttribute('stroke-width', '1.5');
            forceBF.setAttribute('marker-end', 'url(#scene1-marker-gray)');
            forceBF.setAttribute('x2', '603');
            forceBFLabel.setAttribute('fill', '#888888');
            forceBFLabel.textContent = 'f_B';
            show(forceBF);
            show(forceBFLabel);

            hide(forceBTob);
            hide(forceBTobLabel);
            hide(forceBTab);
            hide(forceBTabLabel);

            for (var i = 0; i <= totalSteps; i++) {
                indicators[i].setAttribute('fill', i === step ? '#1565c0' : '#cccccc');
            }

            btnPrev.disabled = (step === 0);
            btnNext.disabled = (step === totalSteps);

            switch(step) {
                case 0:
                    formulaText.textContent = '初始状态：ω < ω₀，细线无张力，仅静摩擦力提供向心力';
                    break;

                case 1:
                    lineAB.setAttribute('stroke', '#1565c0');
                    lineAB.setAttribute('stroke-width', '2.5');
                    forceAF.setAttribute('stroke', '#c62828');
                    forceAF.setAttribute('stroke-width', '2.5');
                    forceAF.setAttribute('marker-end', 'url(#scene1-marker-red)');
                    forceAF.setAttribute('x2', '583');
                    forceAFLabel.setAttribute('fill', '#c62828');
                    forceAFLabel.textContent = 'f_A=0.5mg';
                    show(forceATab);
                    show(forceATabLabel);
                    forceATab.setAttribute('x2', '588');
                    forceATabLabel.textContent = 'T_AB';
                    forceBF.setAttribute('x2', '588');
                    formulaText.textContent = 'mω₀²r_A = μmg → ω₀ = √(μg/r_A) = √(0.5×10/0.2) = 5 rad/s';
                    break;

                case 2:
                    lineOB.setAttribute('stroke', '#1565c0');
                    lineOB.setAttribute('stroke-width', '2.5');
                    lineAB.setAttribute('stroke', '#1565c0');
                    lineAB.setAttribute('stroke-width', '2.5');
                    forceAF.setAttribute('stroke', '#c62828');
                    forceAF.setAttribute('stroke-width', '2.5');
                    forceAF.setAttribute('marker-end', 'url(#scene1-marker-red)');
                    forceAF.setAttribute('x2', '583');
                    forceAFLabel.setAttribute('fill', '#c62828');
                    forceAFLabel.textContent = 'f_A=0.5mg';
                    show(forceATab);
                    show(forceATabLabel);
                    forceATab.setAttribute('x2', '578');
                    forceATabLabel.textContent = 'T_AB';
                    forceBF.setAttribute('stroke', '#c62828');
                    forceBF.setAttribute('stroke-width', '2.5');
                    forceBF.setAttribute('marker-end', 'url(#scene1-marker-red)');
                    forceBF.setAttribute('x2', '583');
                    forceBFLabel.setAttribute('fill', '#c62828');
                    forceBFLabel.textContent = 'f_B=0.5mg';
                    show(forceBTob);
                    show(forceBTobLabel);
                    forceBTob.setAttribute('x2', '588');
                    forceBTobLabel.textContent = 'T_OB';
                    show(forceBTab);
                    show(forceBTabLabel);
                    forceBTab.setAttribute('x2', '682');
                    forceBTabLabel.textContent = 'T_AB';
                    formulaText.textContent = '2μmg = mω₁²(r_A + r_B) → ω₁ = √(2μg/(r_A+r_B)) = 10/√3 rad/s';
                    break;

                case 3:
                    lineOB.setAttribute('stroke', '#1565c0');
                    lineOB.setAttribute('stroke-width', '2.5');
                    lineAB.setAttribute('stroke', '#c62828');
                    lineAB.setAttribute('stroke-width', '3');
                    forceAF.setAttribute('stroke', '#c62828');
                    forceAF.setAttribute('stroke-width', '2.5');
                    forceAF.setAttribute('marker-end', 'url(#scene1-marker-red)');
                    forceAF.setAttribute('x2', '583');
                    forceAFLabel.setAttribute('fill', '#c62828');
                    forceAFLabel.textContent = 'f_A=0.5mg';
                    show(forceATab);
                    show(forceATabLabel);
                    forceATab.setAttribute('stroke', '#c62828');
                    forceATab.setAttribute('stroke-width', '2.5');
                    forceATab.setAttribute('marker-end', 'url(#scene1-marker-red)');
                    forceATab.setAttribute('x2', '553');
                    forceATabLabel.setAttribute('fill', '#c62828');
                    forceATabLabel.textContent = 'T_AB=2mg';
                    show(forceASlide);
                    show(forceASlideLabel);
                    forceBF.setAttribute('stroke', '#c62828');
                    forceBF.setAttribute('stroke-width', '2.5');
                    forceBF.setAttribute('marker-end', 'url(#scene1-marker-red)');
                    forceBF.setAttribute('x2', '583');
                    forceBFLabel.setAttribute('fill', '#c62828');
                    forceBFLabel.textContent = 'f_B=0.5mg';
                    show(forceBTob);
                    show(forceBTobLabel);
                    forceBTob.setAttribute('x2', '578');
                    forceBTobLabel.textContent = 'T_OB';
                    show(forceBTab);
                    show(forceBTabLabel);
                    forceBTab.setAttribute('stroke', '#c62828');
                    forceBTab.setAttribute('stroke-width', '2.5');
                    forceBTab.setAttribute('marker-end', 'url(#scene1-marker-red)');
                    forceBTab.setAttribute('x2', '697');
                    forceBTabLabel.setAttribute('fill', '#c62828');
                    forceBTabLabel.textContent = 'T_AB=2mg';
                    formulaText.textContent = 'T_AB_max + μmg = mω₂²r_A → ω₂ = √((2mg+0.5mg)/(m×0.2)) = 5√5 rad/s';
                    break;
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene(currentStep);
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateScene(currentStep);
            }
        });

        updateScene(0);

    })();
    </script>
</body>
</html>
