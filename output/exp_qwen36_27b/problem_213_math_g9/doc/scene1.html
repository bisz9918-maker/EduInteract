<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自行车链条连接规律</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; display: block; }
        .chain-circle { fill: #ffffff; stroke: #000000; stroke-width: 2; }
        .chain-center { fill: #000000; }
        .chain-line { fill: none; stroke: #000000; stroke-width: 2; }
        .overlap-highlight { fill: #c62828; fill-opacity: 0.2; stroke: none; }
        .dim-line { stroke: #1565c0; stroke-width: 1.5; }
        .dim-text { fill: #1565c0; font-size: 15px; font-weight: bold; }
        .step-title { fill: #333333; font-size: 18px; font-weight: bold; }
        .label-text { fill: #333333; font-size: 15px; }
        .ellipsis-text { fill: #888888; font-size: 28px; }

        /* Formula box as HTML element */
        #scene1-formula-container {
            position: absolute;
            left: 150px;
            top: 328px;
            width: 500px;
            height: 55px;
            background: #e3f2fd;
            border: 1.5px solid #1565c0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            color: #1565c0;
            pointer-events: none;
        }
        #scene1-formula-container .highlight {
            color: #2e7d32;
        }

        /* Controls as HTML elements */
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }
        .scene1-btn {
            padding: 8px 24px;
            font-size: 14px;
            font-weight: bold;
            border: 1.5px solid #1565c0;
            border-radius: 6px;
            background: #e3f2fd;
            color: #1565c0;
            cursor: pointer;
            font-family: inherit;
        }
        .scene1-btn:hover { background: #bbdefb; }
        .scene1-btn:disabled {
            background: #f5f5f5;
            border-color: #bdbdbd;
            color: #bdbdbd;
            cursor: default;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #666666;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <marker id="scene1-arrow-left" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                    <path d="M 8,0 L 0,3 L 8,6" fill="#1565c0" />
                </marker>
                <marker id="scene1-arrow-right" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
                    <path d="M 0,0 L 8,3 L 0,6" fill="#1565c0" />
                </marker>
            </defs>

            <!-- Step Title -->
            <text id="scene1-step-title" class="step-title" x="400" y="48" text-anchor="middle">1节链条</text>

            <!-- Chain Group -->
            <g id="scene1-chain-group"></g>

            <!-- Dimensions Group -->
            <g id="scene1-dimensions-group"></g>
        </svg>

        <!-- Formula Box (HTML) -->
        <div id="scene1-formula-container">单节链条长度 = 2.5cm</div>

        <!-- Controls (HTML) -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/5</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        var currentStep = 0;
        var totalSteps = 5;

        // Helper: draw a chain link (two circles + connecting lines)
        function createChainLink(leftCx, leftCy, rightCx, rightCy) {
            var r = 16;
            var ns = 'http://www.w3.org/2000/svg';
            var g = document.createElementNS(ns, 'g');

            // Left circle
            var c1 = document.createElementNS(ns, 'circle');
            c1.setAttribute('cx', leftCx);
            c1.setAttribute('cy', leftCy);
            c1.setAttribute('r', r);
            c1.setAttribute('class', 'chain-circle');
            g.appendChild(c1);

            // Right circle
            var c2 = document.createElementNS(ns, 'circle');
            c2.setAttribute('cx', rightCx);
            c2.setAttribute('cy', rightCy);
            c2.setAttribute('r', r);
            c2.setAttribute('class', 'chain-circle');
            g.appendChild(c2);

            // Upper connecting line
            var p1 = document.createElementNS(ns, 'path');
            p1.setAttribute('d', 'M ' + leftCx + ',' + (leftCy - r) + ' Q ' + ((leftCx + rightCx) / 2) + ',' + (leftCy - r - 4) + ' ' + rightCx + ',' + (rightCy - r));
            p1.setAttribute('class', 'chain-line');
            g.appendChild(p1);

            // Lower connecting line
            var p2 = document.createElementNS(ns, 'path');
            p2.setAttribute('d', 'M ' + leftCx + ',' + (leftCy + r) + ' Q ' + ((leftCx + rightCx) / 2) + ',' + (leftCy + r + 4) + ' ' + rightCx + ',' + (rightCy + r));
            p2.setAttribute('class', 'chain-line');
            g.appendChild(p2);

            // Left center dot
            var d1 = document.createElementNS(ns, 'circle');
            d1.setAttribute('cx', leftCx);
            d1.setAttribute('cy', leftCy);
            d1.setAttribute('r', 3);
            d1.setAttribute('class', 'chain-center');
            g.appendChild(d1);

            // Right center dot
            var d2 = document.createElementNS(ns, 'circle');
            d2.setAttribute('cx', rightCx);
            d2.setAttribute('cy', rightCy);
            d2.setAttribute('r', 3);
            d2.setAttribute('class', 'chain-center');
            g.appendChild(d2);

            return g;
        }

        // Helper: create SVG element
        function svgEl(tag, attrs) {
            var ns = 'http://www.w3.org/2000/svg';
            var el = document.createElementNS(ns, tag);
            for (var k in attrs) {
                if (attrs.hasOwnProperty(k)) el.setAttribute(k, attrs[k]);
            }
            return el;
        }

        // Helper: clear group
        function clearGroup(id) {
            var g = document.getElementById(id);
            while (g.firstChild) g.removeChild(g.firstChild);
        }

        // Render each step
        function renderStep(step) {
            var chainGroup = document.getElementById('scene1-chain-group');
            var dimGroup = document.getElementById('scene1-dimensions-group');
            var title = document.getElementById('scene1-step-title');
            var formulaContainer = document.getElementById('scene1-formula-container');
            var indicator = document.getElementById('scene1-step-indicator');
            var btnPrev = document.getElementById('scene1-btn-prev');
            var btnNext = document.getElementById('scene1-btn-next');

            clearGroup('scene1-chain-group');
            clearGroup('scene1-dimensions-group');

            // Update buttons
            btnPrev.disabled = (step === 0);
            btnNext.disabled = (step === totalSteps - 1);

            indicator.textContent = '步骤 ' + (step + 1) + '/5';

            switch (step) {
                case 0: renderStep0(chainGroup, dimGroup, title, formulaContainer); break;
                case 1: renderStep1(chainGroup, dimGroup, title, formulaContainer); break;
                case 2: renderStep2(chainGroup, dimGroup, title, formulaContainer); break;
                case 3: renderStep3(chainGroup, dimGroup, title, formulaContainer); break;
                case 4: renderStep4(chainGroup, dimGroup, title, formulaContainer); break;
            }
        }

        // Step 0: 1 link
        function renderStep0(chainGroup, dimGroup, title, formulaContainer) {
            title.textContent = '1节链条';
            formulaContainer.innerHTML = '单节链条长度 = 2.5cm';

            // Chain: left circle (366,190), right circle (434,190)
            chainGroup.appendChild(createChainLink(366, 190, 434, 190));

            // Dimension line for 2.5cm (above chain)
            dimGroup.appendChild(svgEl('line', {
                x1: '350', y1: '138', x2: '450', y2: '138',
                class: 'dim-line',
                'marker-start': 'url(#scene1-arrow-left)',
                'marker-end': 'url(#scene1-arrow-right)'
            }));
            dimGroup.appendChild(svgEl('line', { x1: '350', y1: '132', x2: '350', y2: '144', class: 'dim-line' }));
            dimGroup.appendChild(svgEl('line', { x1: '450', y1: '132', x2: '450', y2: '144', class: 'dim-line' }));
            dimGroup.appendChild(svgEl('text', {
                x: '400', y: '128', class: 'dim-text', 'text-anchor': 'middle'
            })).textContent = '2.5cm';

            // Diameter annotation (right side)
            dimGroup.appendChild(svgEl('line', {
                x1: '452', y1: '174', x2: '452', y2: '206',
                class: 'dim-line',
                'marker-start': 'url(#scene1-arrow-left)',
                'marker-end': 'url(#scene1-arrow-right)'
            }));
            dimGroup.appendChild(svgEl('text', {
                x: '472', y: '194', class: 'dim-text', 'text-anchor': 'start'
            })).textContent = '0.8cm';

            // "1节" label below chain
            dimGroup.appendChild(svgEl('text', {
                x: '400', y: '248', class: 'label-text', 'text-anchor': 'middle'
            })).textContent = '1节';
        }

        // Step 1: 2 links
        function renderStep1(chainGroup, dimGroup, title, formulaContainer) {
            title.textContent = '2节链条连接';
            formulaContainer.innerHTML = '2.5×2 − 0.8×1 = 4.2cm';

            // Chain: circles at (332,190), (400,190), (468,190)
            chainGroup.appendChild(createChainLink(332, 190, 400, 190));
            chainGroup.appendChild(createChainLink(400, 190, 468, 190));

            // Overlap highlight at (400, 190)
            chainGroup.appendChild(svgEl('circle', {
                cx: '400', cy: '190', r: '16', class: 'overlap-highlight'
            }));

            // "0.8cm" overlap label above
            dimGroup.appendChild(svgEl('text', {
                x: '400', y: '165', class: 'dim-text', 'text-anchor': 'middle'
            })).textContent = '0.8cm';

            // Total length dimension line (below chain)
            dimGroup.appendChild(svgEl('line', {
                x1: '316', y1: '238', x2: '484', y2: '238',
                class: 'dim-line',
                'marker-start': 'url(#scene1-arrow-left)',
                'marker-end': 'url(#scene1-arrow-right)'
            }));
            dimGroup.appendChild(svgEl('line', { x1: '316', y1: '232', x2: '316', y2: '244', class: 'dim-line' }));
            dimGroup.appendChild(svgEl('line', { x1: '484', y1: '232', x2: '484', y2: '244', class: 'dim-line' }));
            dimGroup.appendChild(svgEl('text', {
                x: '400', y: '258', class: 'dim-text', 'text-anchor': 'middle'
            })).textContent = '4.2cm';

            // "2节" label - moved down to y=295 for proper spacing
            dimGroup.appendChild(svgEl('text', {
                x: '400', y: '295', class: 'label-text', 'text-anchor': 'middle'
            })).textContent = '2节';
        }

        // Step 2: 3 links
        function renderStep2(chainGroup, dimGroup, title, formulaContainer) {
            title.textContent = '3节链条连接';
            formulaContainer.innerHTML = '2.5×3 − 0.8×2 = 5.9cm';

            // Chain: circles at (298,190), (366,190), (434,190), (502,190)
            chainGroup.appendChild(createChainLink(298, 190, 366, 190));
            chainGroup.appendChild(createChainLink(366, 190, 434, 190));
            chainGroup.appendChild(createChainLink(434, 190, 502, 190));

            // Overlap highlights
            chainGroup.appendChild(svgEl('circle', {
                cx: '366', cy: '190', r: '16', class: 'overlap-highlight'
            }));
            chainGroup.appendChild(svgEl('circle', {
                cx: '434', cy: '190', r: '16', class: 'overlap-highlight'
            }));

            // "0.8cm" overlap labels
            dimGroup.appendChild(svgEl('text', {
                x: '366', y: '165', class: 'dim-text', 'text-anchor': 'middle'
            })).textContent = '0.8cm';
            dimGroup.appendChild(svgEl('text', {
                x: '434', y: '165', class: 'dim-text', 'text-anchor': 'middle'
            })).textContent = '0.8cm';

            // Total length dimension line
            dimGroup.appendChild(svgEl('line', {
                x1: '282', y1: '238', x2: '518', y2: '238',
                class: 'dim-line',
                'marker-start': 'url(#scene1-arrow-left)',
                'marker-end': 'url(#scene1-arrow-right)'
            }));
            dimGroup.appendChild(svgEl('line', { x1: '282', y1: '232', x2: '282', y2: '244', class: 'dim-line' }));
            dimGroup.appendChild(svgEl('line', { x1: '518', y1: '232', x2: '518', y2: '244', class: 'dim-line' }));
            dimGroup.appendChild(svgEl('text', {
                x: '400', y: '258', class: 'dim-text', 'text-anchor': 'middle'
            })).textContent = '5.9cm';

            // "3节" label - moved down to y=295 for proper spacing
            dimGroup.appendChild(svgEl('text', {
                x: '400', y: '295', class: 'label-text', 'text-anchor': 'middle'
            })).textContent = '3节';
        }

        // Step 3: n links general formula
        function renderStep3(chainGroup, dimGroup, title, formulaContainer) {
            title.textContent = 'n节链条通项公式';
            formulaContainer.innerHTML = 'L = 2.5n − 0.8(n−1) = 1.7n + 0.8';

            // Left 3 links
            chainGroup.appendChild(createChainLink(151, 190, 219, 190));
            chainGroup.appendChild(createChainLink(219, 190, 287, 190));
            chainGroup.appendChild(createChainLink(287, 190, 355, 190));

            // Ellipsis
            dimGroup.appendChild(svgEl('text', {
                x: '420', y: '196', class: 'ellipsis-text', 'text-anchor': 'middle'
            })).textContent = '···';

            // Right 2 links
            chainGroup.appendChild(createChainLink(516, 190, 584, 190));
            chainGroup.appendChild(createChainLink(584, 190, 652, 190));

            // "n节" label
            dimGroup.appendChild(svgEl('text', {
                x: '400', y: '248', class: 'label-text', 'text-anchor': 'middle'
            })).textContent = 'n节';

            // "(n−1)处重叠" label - moved down to y=285 for proper spacing
            dimGroup.appendChild(svgEl('text', {
                x: '400', y: '285', class: 'label-text', 'text-anchor': 'middle'
            })).textContent = '(n−1)处重叠';
        }

        // Step 4: n=100 calculation
        function renderStep4(chainGroup, dimGroup, title, formulaContainer) {
            title.textContent = '100节链条总长度';

            // Same chain as step 3
            chainGroup.appendChild(createChainLink(151, 190, 219, 190));
            chainGroup.appendChild(createChainLink(219, 190, 287, 190));
            chainGroup.appendChild(createChainLink(287, 190, 355, 190));

            dimGroup.appendChild(svgEl('text', {
                x: '420', y: '196', class: 'ellipsis-text', 'text-anchor': 'middle'
            })).textContent = '···';

            chainGroup.appendChild(createChainLink(516, 190, 584, 190));
            chainGroup.appendChild(createChainLink(584, 190, 652, 190));

            // "100节" label
            dimGroup.appendChild(svgEl('text', {
                x: '400', y: '248', class: 'label-text', 'text-anchor': 'middle'
            })).textContent = '100节';

            // Formula with highlighted answer
            formulaContainer.innerHTML = 'L = 1.7×100 + 0.8 = <span class="highlight">170.8cm</span>';
        }

        // Navigation
        function stepNext() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep(currentStep);
            }
        }

        function stepPrev() {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
            }
        }

        // Event listeners
        document.getElementById('scene1-btn-next').addEventListener('click', stepNext);
        document.getElementById('scene1-btn-prev').addEventListener('click', stepPrev);

        // Initial render
        renderStep(0);
    })();
    </script>
</body>
</html>
