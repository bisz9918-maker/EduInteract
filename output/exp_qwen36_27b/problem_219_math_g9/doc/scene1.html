<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>反比例函数面积关系图示</title>
    <script>
    window.MathJax = {
        tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$']] },
        svg: { fontCache: 'global' },
        startup: { typeset: false }
    };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; display: block; }

        /* Formula blocks */
        .formula-block {
            position: absolute;
            font-size: 14px;
            line-height: 1.8;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        .formula-block.visible {
            display: block;
        }
        .formula-block.fade-in {
            opacity: 1;
        }

        #scene1-formula-s1 { left: 440px; top: 100px; }
        #scene1-formula-s2 { left: 440px; top: 220px; }
        #scene1-conclusion { left: 440px; top: 340px; font-size: 20px; font-weight: bold; color: #2e7d32; }

        /* SVG element transitions */
        #scene1-trapezoid, #scene1-triangle {
            transition: fill 0.3s ease-in-out, stroke 0.3s ease-in-out, stroke-width 0.3s ease-in-out, fill-opacity 0.3s ease-in-out;
        }

        /* Step-dependent SVG elements */
        .step-element {
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        .step-element.visible {
            opacity: 1;
        }

        /* HTML Buttons */
        #scene1-btn-prev, #scene1-btn-next {
            position: absolute;
            bottom: 10px;
            width: 100px;
            height: 32px;
            border: 1px solid #999999;
            border-radius: 4px;
            background: #f5f5f5;
            font-size: 13px;
            cursor: pointer;
            font-family: "Microsoft YaHei", sans-serif;
            transition: background 0.2s;
        }
        #scene1-btn-prev { left: 200px; }
        #scene1-btn-next { left: 500px; }
        #scene1-btn-prev:hover:not(:disabled) { background: #e3f2fd; }
        #scene1-btn-next:hover:not(:disabled) { background: #e3f2fd; }
        #scene1-btn-prev:disabled, #scene1-btn-next:disabled {
            opacity: 0.4;
            cursor: default;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <marker id="scene1-arrow-x" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
                </marker>
                <marker id="scene1-arrow-y" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
                </marker>
            </defs>

            <!-- Coordinate axes -->
            <line x1="80" y1="400" x2="500" y2="400" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow-x)"/>
            <line x1="80" y1="400" x2="80" y2="50" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow-y)"/>

            <!-- Axis labels -->
            <text x="505" y="415" font-size="14" fill="#000000" font-style="italic">x</text>
            <text x="70" y="45" font-size="14" fill="#000000" font-style="italic">y</text>

            <!-- Inverse proportion curve (split into 3 segments to avoid label overlap) -->
            <!-- Segment 1: math_x 40 to 57 (before point A) -->
            <path id="scene1-curve-1" d="" fill="none" stroke="#000000" stroke-width="2"/>
            <!-- Segment 2: math_x 63 to 237 (between A and B) -->
            <path id="scene1-curve-2" d="" fill="none" stroke="#000000" stroke-width="2"/>
            <!-- Segment 3: math_x 243 to 420 (after point B) -->
            <path id="scene1-curve-3" d="" fill="none" stroke="#000000" stroke-width="2"/>

            <!-- Function label - positioned above curve bounding box -->
            <text x="260" y="80" font-size="14" fill="#000000">y = k/x</text>

            <!-- Trapezoid ABCD (step 0: outline only) -->
            <polygon id="scene1-trapezoid" points="140,160 320,340 80,340 80,160"
                fill="none" stroke="#cccccc" stroke-width="1"/>

            <!-- Triangle OAB (step 0: outline only) -->
            <polygon id="scene1-triangle" points="80,400 140,160 320,340"
                fill="none" stroke="#cccccc" stroke-width="1"/>

            <!-- Lines OA, OB, AB -->
            <line id="scene1-line-oa" x1="80" y1="400" x2="140" y2="160" stroke="#000000" stroke-width="2"/>
            <line id="scene1-line-ob" x1="80" y1="400" x2="320" y2="340" stroke="#000000" stroke-width="2"/>
            <line id="scene1-line-ab" x1="140" y1="160" x2="320" y2="340" stroke="#000000" stroke-width="2"/>

            <!-- Perpendicular dashed lines AD, BC -->
            <line id="scene1-line-ad" x1="80" y1="160" x2="140" y2="160" stroke="#888888" stroke-width="1" stroke-dasharray="6,4"/>
            <line id="scene1-line-bc" x1="80" y1="340" x2="320" y2="340" stroke="#888888" stroke-width="1" stroke-dasharray="6,4"/>

            <!-- Points -->
            <circle cx="80" cy="400" r="4" fill="#000000"/>
            <circle cx="140" cy="160" r="4" fill="#000000"/>
            <circle cx="320" cy="340" r="4" fill="#000000"/>
            <circle cx="80" cy="340" r="4" fill="#000000"/>
            <circle cx="80" cy="160" r="4" fill="#000000"/>

            <!-- Point labels (step 0) -->
            <text x="65" y="415" font-size="14" fill="#000000">O</text>
            <text x="148" y="152" font-size="14" fill="#000000">A</text>
            <text x="328" y="332" font-size="14" fill="#000000">B</text>
            <text x="65" y="345" font-size="14" fill="#000000">C</text>
            <text x="65" y="155" font-size="14" fill="#000000">D</text>

            <!-- Coordinate labels (step 1) - positioned outside curve bounding boxes -->
            <text id="scene1-coord-a" class="step-element" x="160" y="115" font-size="13" fill="#000000" font-style="italic">A(a, k/a)</text>
            <text id="scene1-coord-b" class="step-element" x="348" y="295" font-size="13" fill="#000000" font-style="italic">B(b, k/b)</text>
            <text id="scene1-coord-c" class="step-element" x="28" y="390" font-size="13" fill="#000000" font-style="italic">C(0, k/b)</text>
            <text id="scene1-coord-d" class="step-element" x="28" y="115" font-size="13" fill="#000000" font-style="italic">D(0, k/a)</text>
            <text id="scene1-coord-o" class="step-element" x="100" y="418" font-size="13" fill="#000000" font-style="italic">O(0, 0)</text>
            <!-- Annotation below x-axis -->
            <text id="scene1-annotation-ab" class="step-element" x="160" y="428" font-size="13" fill="#000000">0 &lt; a &lt; b</text>

            <!-- S1 label (step 2) - outside trapezoid bounding box (x > 320) -->
            <text id="scene1-label-s1" class="step-element" x="350" y="200" font-size="16" fill="#1565c0" font-weight="bold">S₁</text>

            <!-- S2 label (step 3) - outside triangle bounding box (x > 320, y > 366) -->
            <text id="scene1-label-s2" class="step-element" x="350" y="375" font-size="16" fill="#c62828" font-weight="bold">S₂</text>

            <!-- Step indicator (SVG text) -->
            <text id="scene1-step-indicator" x="400" y="474" text-anchor="middle" font-size="14" fill="#333333">步骤 1/5</text>
        </svg>

        <!-- HTML Buttons -->
        <button id="scene1-btn-prev" disabled>◀ 上一步</button>
        <button id="scene1-btn-next">下一步 ▶</button>

        <!-- Formula blocks (HTML overlay) -->
        <div id="scene1-formula-s1" class="formula-block">
            <div>$$S_1 = \frac{(AD+BC)\cdot CD}{2}$$</div>
            <div>$$= \frac{(a+b)\left(\frac{k}{a}-\frac{k}{b}\right)}{2}$$</div>
            <div>$$= \frac{k(b^2-a^2)}{2ab}$$</div>
        </div>
        <div id="scene1-formula-s2" class="formula-block">
            <div>$$S_2 = \frac{|x_A y_B - x_B y_A|}{2}$$</div>
            <div>$$= \frac{\left|a\cdot\frac{k}{b}-b\cdot\frac{k}{a}\right|}{2}$$</div>
            <div>$$= \frac{k(b^2-a^2)}{2ab}$$</div>
        </div>
        <div id="scene1-conclusion" class="formula-block">
            $$S_1 : S_2 = 1 : 1$$
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        // ===== Layout coordinate table (from plan, adjusted for overlap fixes) =====
        // O(80,400), A(140,160), B(320,340), C(80,340), D(80,160)
        // x-axis: (80,400)->(500,400), y-axis: (80,400)->(80,50)
        // k=14400, curve split into 3 segments to avoid label overlap:
        //   Seg1: math_x 40-57, Seg2: math_x 63-237, Seg3: math_x 243-420
        // Labels positioned outside curve/polygon bounding boxes

        var currentStep = 0;
        var totalSteps = 5; // 0-4

        // Generate curve path segments
        function generateCurve() {
            var k = 14400;
            function makePath(xStart, xEnd) {
                var parts = [];
                for (var mx = xStart; mx <= xEnd; mx += 5) {
                    var sx = 80 + mx;
                    var sy = 400 - k / mx;
                    parts.push((parts.length === 0 ? 'M' : 'L') + sx.toFixed(1) + ',' + sy.toFixed(1));
                }
                return parts.join(' ');
            }
            document.getElementById('scene1-curve-1').setAttribute('d', makePath(40, 57));
            document.getElementById('scene1-curve-2').setAttribute('d', makePath(63, 237));
            document.getElementById('scene1-curve-3').setAttribute('d', makePath(243, 420));
        }

        // Show/hide helper
        function show(el) {
            el.style.display = '';
            el.style.opacity = '';
            if (el.classList) el.classList.add('visible');
            if (el.id && (el.id.indexOf('formula') !== -1 || el.id.indexOf('conclusion') !== -1)) {
                el.classList.add('visible');
                requestAnimationFrame(function() {
                    el.classList.add('fade-in');
                });
            }
        }

        function hide(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
            if (el.classList) {
                el.classList.remove('visible');
                el.classList.remove('fade-in');
            }
        }

        // Update view based on current step
        function updateView() {
            var trapezoid = document.getElementById('scene1-trapezoid');
            var triangle = document.getElementById('scene1-triangle');

            // Reset all step-dependent elements
            var stepEls = document.querySelectorAll('.step-element');
            for (var i = 0; i < stepEls.length; i++) {
                hide(stepEls[i]);
            }

            // Reset formula blocks
            hide(document.getElementById('scene1-formula-s1'));
            hide(document.getElementById('scene1-formula-s2'));
            hide(document.getElementById('scene1-conclusion'));

            // Reset trapezoid and triangle styles
            trapezoid.setAttribute('fill', 'none');
            trapezoid.setAttribute('stroke', '#cccccc');
            trapezoid.setAttribute('stroke-width', '1');
            trapezoid.setAttribute('fill-opacity', '0');
            triangle.setAttribute('fill', 'none');
            triangle.setAttribute('stroke', '#cccccc');
            triangle.setAttribute('stroke-width', '1');
            triangle.setAttribute('fill-opacity', '0');

            // Step 1: Show coordinates
            if (currentStep >= 1) {
                show(document.getElementById('scene1-coord-a'));
                show(document.getElementById('scene1-coord-b'));
                show(document.getElementById('scene1-coord-c'));
                show(document.getElementById('scene1-coord-d'));
                show(document.getElementById('scene1-coord-o'));
                show(document.getElementById('scene1-annotation-ab'));
            }

            // Step 2: Highlight trapezoid + S1 formula
            if (currentStep >= 2) {
                trapezoid.setAttribute('fill', '#1565c0');
                trapezoid.setAttribute('fill-opacity', '0.2');
                trapezoid.setAttribute('stroke', '#1565c0');
                trapezoid.setAttribute('stroke-width', '3');
                show(document.getElementById('scene1-label-s1'));
                show(document.getElementById('scene1-formula-s1'));
            }

            // Step 3: Highlight triangle + S2 formula
            if (currentStep >= 3) {
                triangle.setAttribute('fill', '#c62828');
                triangle.setAttribute('fill-opacity', '0.2');
                triangle.setAttribute('stroke', '#c62828');
                triangle.setAttribute('stroke-width', '3');
                show(document.getElementById('scene1-label-s2'));
                show(document.getElementById('scene1-formula-s2'));
            }

            // Step 4: Show conclusion
            if (currentStep >= 4) {
                show(document.getElementById('scene1-conclusion'));
            }

            // Update buttons
            var prevBtn = document.getElementById('scene1-btn-prev');
            var nextBtn = document.getElementById('scene1-btn-next');
            var indicator = document.getElementById('scene1-step-indicator');

            indicator.textContent = '步骤 ' + (currentStep + 1) + '/5';

            if (currentStep === 0) {
                prevBtn.disabled = true;
            } else {
                prevBtn.disabled = false;
            }

            if (currentStep === totalSteps - 1) {
                nextBtn.disabled = true;
            } else {
                nextBtn.disabled = false;
            }

            // Re-typeset MathJax for visible formula blocks
            if (window.MathJax && MathJax.typesetPromise) {
                var visibleBlocks = [];
                var s1 = document.getElementById('scene1-formula-s1');
                var s2 = document.getElementById('scene1-formula-s2');
                var conc = document.getElementById('scene1-conclusion');
                if (s1.classList.contains('visible')) visibleBlocks.push(s1);
                if (s2.classList.contains('visible')) visibleBlocks.push(s2);
                if (conc.classList.contains('visible')) visibleBlocks.push(conc);
                if (visibleBlocks.length > 0) {
                    MathJax.typesetPromise(visibleBlocks).catch(function(err) { console.log('MathJax error:', err); });
                }
            }
        }

        // Step navigation
        function stepNext() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateView();
            }
        }

        function stepPrev() {
            if (currentStep > 0) {
                currentStep--;
                updateView();
            }
        }

        // Event binding
        document.getElementById('scene1-btn-next').addEventListener('click', function() {
            if (!this.disabled) {
                stepNext();
            }
        });

        document.getElementById('scene1-btn-prev').addEventListener('click', function() {
            if (!this.disabled) {
                stepPrev();
            }
        });

        // Initialize
        generateCurve();
        updateView();

    })();
    </script>
</body>
</html>
