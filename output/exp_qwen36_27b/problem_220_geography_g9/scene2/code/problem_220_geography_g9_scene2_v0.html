<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北半球三圈环流 - 中纬环流侧视图</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-svg { width: 800px; height: 500px; display: block; }
        #scene2-controls { position: absolute; bottom: 5px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene2-controls button {
            padding: 4px 16px; font-size: 13px; cursor: pointer;
            border: 1px solid #999; border-radius: 4px; background: #f5f5f5; color: #333;
            transition: background 0.2s;
        }
        #scene2-controls button:hover { background: #e0e0e0; }
        #scene2-controls button:disabled { opacity: 0.4; cursor: default; }
        #scene2-step-indicator { font-size: 13px; color: #555; min-width: 80px; text-align: center; }
        .step-group { opacity: 0; transition: opacity 0.4s ease; }
        .step-group.visible { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <marker id="scene2-arrow-black" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
                </marker>
                <marker id="scene2-arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
                </marker>
                <marker id="scene2-arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
                </marker>
                <marker id="scene2-arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
            </defs>

            <!-- ===== 地面平行四边形 ===== -->
            <polygon id="scene2-ground" points="250,280 550,280 590,340 210,340" fill="#e0e0e0" fill-opacity="0.2" stroke="#999" stroke-width="1"/>

            <!-- ===== 环流矩形框架 ===== -->
            <rect id="scene2-loop-frame" x="250" y="100" width="300" height="180" fill="none" stroke="#000000" stroke-width="2"/>

            <!-- ===== 四个顶点 ===== -->
            <circle id="scene2-point-a" cx="250" cy="280" r="3" fill="#000000"/>
            <circle id="scene2-point-b" cx="550" cy="280" r="3" fill="#000000"/>
            <circle id="scene2-point-c" cx="550" cy="100" r="3" fill="#000000"/>
            <circle id="scene2-point-d" cx="250" cy="100" r="3" fill="#000000"/>

            <!-- ===== 顶点标签（移到框架外） ===== -->
            <text id="scene2-label-a" x="230" y="298" font-size="14" font-weight="bold" fill="#000000">a</text>
            <text id="scene2-label-b" x="565" y="298" font-size="14" font-weight="bold" fill="#000000">b</text>
            <text id="scene2-label-c" x="565" y="95" font-size="14" font-weight="bold" fill="#000000">c</text>
            <text id="scene2-label-d" x="230" y="95" font-size="14" font-weight="bold" fill="#000000">d</text>

            <!-- ===== 箭头①：c→d（高空，右向左） ===== -->
            <line id="scene2-arrow-1" x1="545" y1="100" x2="255" y2="100" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow-black)"/>
            <!-- 箭头编号①（放在框架上方，无圆圈背景） -->
            <text id="scene2-num-1" x="400" y="82" font-size="15" fill="#000000" text-anchor="middle" font-weight="bold">①</text>

            <!-- ===== 箭头②：b→c（右侧，上升） ===== -->
            <line id="scene2-arrow-2" x1="550" y1="275" x2="550" y2="105" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow-black)"/>
            <!-- 箭头编号② -->
            <text id="scene2-num-2" x="580" y="195" font-size="15" fill="#000000" font-weight="bold">②</text>

            <!-- ===== 箭头③：a→b（近地面，左向右） ===== -->
            <line id="scene2-arrow-3" x1="255" y1="280" x2="545" y2="280" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow-black)"/>
            <!-- 箭头编号③（放在地面下方） -->
            <text id="scene2-num-3" x="400" y="365" font-size="15" fill="#000000" text-anchor="middle" font-weight="bold">③</text>

            <!-- ===== 箭头④：d→a（左侧，下沉） ===== -->
            <line id="scene2-arrow-4" x1="250" y1="105" x2="250" y2="275" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow-black)"/>
            <!-- 箭头编号④ -->
            <text id="scene2-num-4" x="210" y="195" font-size="15" fill="#000000" font-weight="bold">④</text>

            <!-- ===== 步骤1：纬度对应与气压带标注 ===== -->
            <g id="scene2-step1-group" class="step-group">
                <!-- 纬度标注（放在地面下方） -->
                <text x="250" y="390" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">30°N</text>
                <text x="550" y="390" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">60°N</text>
                <!-- 气压带标注（放在框架外左侧和右侧） -->
                <text x="215" y="260" font-size="12" fill="#000000" text-anchor="end">副热带高压带</text>
                <text x="585" y="260" font-size="12" fill="#000000" text-anchor="start">副极地低压带</text>
                <!-- 箭头②高亮（红色上升） -->
                <line x1="550" y1="275" x2="550" y2="105" stroke="#c62828" stroke-width="3" marker-end="url(#scene2-arrow-red)" opacity="0.6"/>
                <!-- 箭头④高亮（绿色下沉） -->
                <line x1="250" y1="105" x2="250" y2="275" stroke="#2e7d32" stroke-width="3" marker-end="url(#scene2-arrow-green)" opacity="0.6"/>
            </g>

            <!-- ===== 步骤2：风带与气流相遇 ===== -->
            <g id="scene2-step2-group" class="step-group">
                <!-- 中纬西风带标注（放在地面下方） -->
                <text x="400" y="410" font-size="13" fill="#1565c0" text-anchor="middle">中纬西风带（西南风）</text>
                <!-- 极地东风箭头（从右上斜向指向b点，在框架内） -->
                <line x1="470" y1="160" x2="540" y2="265" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow-blue)"/>
                <!-- 极地东风标注（放在框架内上方） -->
                <text x="460" y="185" font-size="12" fill="#1565c0">极地东风（冷）</text>
                <!-- 极锋波浪线（放在b点右侧地面附近） -->
                <path d="M555,290 Q560,285 565,290 Q570,295 575,290 Q580,285 585,290 Q590,295 595,290" fill="none" stroke="#c62828" stroke-width="2"/>
                <!-- 极锋标注 -->
                <text x="575" y="280" font-size="12" fill="#c62828" text-anchor="middle">极锋</text>
            </g>

            <!-- ===== 步骤3：下沉原因分析与选项判断 ===== -->
            <g id="scene2-step3-group" class="step-group">
                <!-- 动力原因标注（放在框架外左侧） -->
                <text x="215" y="200" font-size="11" fill="#000000" text-anchor="end">动力原因：高空空气堆积下沉</text>
                <!-- 非热力原因标注 -->
                <text x="215" y="218" font-size="11" fill="#c62828" text-anchor="end">✗ 非热力原因</text>
                <!-- 选项C文本框 -->
                <rect x="80" y="425" width="300" height="28" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
                <text x="230" y="444" font-size="13" fill="#2e7d32" text-anchor="middle">C．b处有冷暖气流相遇 ✓</text>
                <!-- 选项D文本框 -->
                <rect x="420" y="425" width="300" height="28" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
                <text x="570" y="444" font-size="13" fill="#c62828" text-anchor="middle">D．④为热力原因引起的下沉 ✗</text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-prev-btn" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 0/3</span>
            <button id="scene2-next-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        var currentStep = 0;
        var totalSteps = 3;

        var prevBtn = document.getElementById("scene2-prev-btn");
        var nextBtn = document.getElementById("scene2-next-btn");
        var stepIndicator = document.getElementById("scene2-step-indicator");

        var stepGroups = [
            document.getElementById("scene2-step1-group"),
            document.getElementById("scene2-step2-group"),
            document.getElementById("scene2-step3-group")
        ];

        function updateDisplay() {
            stepIndicator.textContent = "步骤 " + currentStep + "/" + totalSteps;
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === totalSteps);

            for (var i = 0; i < stepGroups.length; i++) {
                if (i < currentStep) {
                    stepGroups[i].classList.add("visible");
                    stepGroups[i].style.opacity = "1";
                    stepGroups[i].style.display = "";
                } else {
                    stepGroups[i].classList.remove("visible");
                    stepGroups[i].style.opacity = "0";
                    stepGroups[i].style.display = "none";
                }
            }
        }

        prevBtn.addEventListener("click", function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });

        nextBtn.addEventListener("click", function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateDisplay();
            }
        });

        updateDisplay();
    })();
    </script>
</body>
</html>
