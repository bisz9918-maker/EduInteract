<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H₂O₂分子结构 - 场景1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; display: block; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 8px 20px; font-size: 14px; cursor: pointer;
            border: 1px solid #333; border-radius: 4px; background: #f5f5f5;
            transition: background 0.2s;
        }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.4; cursor: default; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <!-- ===== 步骤0: 基础分子结构 ===== -->

            <!-- 左侧平面 (三角形, 边界框 x:230-310, y:150-280) -->
            <polygon id="scene1-plane-left" points="310,220 230,150 270,280"
                     fill="#e0e0e0" fill-opacity="0.2" stroke="#000000" stroke-width="1" />

            <!-- 右侧平面 (三角形, 边界框 x:390-470, y:160-290) -->
            <polygon id="scene1-plane-right" points="390,220 470,290 430,160"
                     fill="#e0e0e0" fill-opacity="0.2" stroke="#000000" stroke-width="1" />

            <!-- 化学键 -->
            <line id="scene1-bond-oo" x1="310" y1="220" x2="390" y2="220"
                  stroke="#000000" stroke-width="2" />
            <line id="scene1-bond-oh1" x1="310" y1="220" x2="230" y2="150"
                  stroke="#000000" stroke-width="2" />
            <line id="scene1-bond-oh2" x1="390" y1="220" x2="470" y2="290"
                  stroke="#000000" stroke-width="2" />

            <!-- 原子 -->
            <circle id="scene1-atom-o1" cx="310" cy="220" r="18" fill="#c62828" />
            <circle id="scene1-atom-o2" cx="390" cy="220" r="18" fill="#c62828" />
            <circle id="scene1-atom-h1" cx="230" cy="150" r="12" fill="#ffffff" stroke="#000000" stroke-width="2" />
            <circle id="scene1-atom-h2" cx="470" cy="290" r="12" fill="#ffffff" stroke="#000000" stroke-width="2" />

            <!-- 原子标签（放在圆外部，远离平面） -->
            <text id="scene1-label-o1" x="335" y="285" font-size="14" fill="#000000" font-weight="bold">O</text>
            <text id="scene1-label-o2" x="362" y="305" font-size="14" fill="#000000" font-weight="bold">O</text>
            <text id="scene1-label-h1" x="205" y="135" font-size="14" fill="#000000" font-weight="bold">H</text>
            <text id="scene1-label-h2" x="495" y="315" font-size="14" fill="#000000" font-weight="bold">H</text>

            <!-- 分子标题 -->
            <text id="scene1-title" x="350" y="440" font-size="16" fill="#000000" text-anchor="middle" font-weight="bold">H₂O₂ 的分子结构</text>

            <!-- ===== 步骤1: 化学键类型标注 ===== -->
            <text id="scene1-label-nonpolar" x="350" y="185" font-size="14" fill="#c62828" text-anchor="middle" opacity="0">非极性键</text>
            <text id="scene1-label-polar1" x="270" y="130" font-size="14" fill="#1565c0" text-anchor="middle" opacity="0">极性键</text>
            <text id="scene1-label-polar2" x="430" y="310" font-size="14" fill="#1565c0" text-anchor="middle" opacity="0">极性键</text>

            <!-- ===== 步骤2: 电荷分布与极性结论 ===== -->
            <text id="scene1-charge-dminus-o1" x="335" y="255" font-size="14" fill="#1565c0" opacity="0">δ⁻</text>
            <text id="scene1-charge-dminus-o2" x="362" y="255" font-size="14" fill="#1565c0" opacity="0">δ⁻</text>
            <text id="scene1-charge-dplus-h1" x="170" y="105" font-size="14" fill="#c62828" opacity="0">δ⁺</text>
            <text id="scene1-charge-dplus-h2" x="520" y="340" font-size="14" fill="#c62828" opacity="0">δ⁺</text>
            <text id="scene1-conclusion-polarity" x="400" y="65" font-size="16" fill="#333333" text-anchor="middle" opacity="0">正负电荷中心不重合 → 极性分子</text>

            <!-- ===== 步骤3: 分子间作用力 ===== -->
            <!-- 第二分子虚影 -->
            <g id="scene1-molecule2" opacity="0">
                <circle cx="580" cy="370" r="16" fill="#c62828" fill-opacity="0.5" />
                <circle cx="660" cy="370" r="16" fill="#c62828" fill-opacity="0.5" />
                <circle cx="510" cy="310" r="10" fill="#ffffff" stroke="#999999" stroke-width="1.5" />
                <circle cx="730" cy="430" r="10" fill="#ffffff" stroke="#999999" stroke-width="1.5" />
                <line x1="580" y1="370" x2="660" y2="370" stroke="#999999" stroke-width="1.5" />
                <line x1="580" y1="370" x2="510" y2="310" stroke="#999999" stroke-width="1.5" />
                <line x1="660" y1="370" x2="730" y2="430" stroke="#999999" stroke-width="1.5" />
                <!-- 第二分子标签放在圆外部 -->
                <text x="595" y="385" font-size="12" fill="#000000" font-weight="bold">O</text>
                <text x="675" y="385" font-size="12" fill="#000000" font-weight="bold">O</text>
                <text x="470" y="315" font-size="11" fill="#000000" font-weight="bold">H</text>
                <text x="745" y="445" font-size="11" fill="#000000" font-weight="bold">H</text>
            </g>

            <!-- 氢键虚线 -->
            <line id="scene1-hbond-line" x1="470" y1="290" x2="580" y2="370"
                  stroke="#1565c0" stroke-width="2" stroke-dasharray="5,5" opacity="0" />
            <!-- 氢键标签：放在虚线右侧外部 -->
            <text id="scene1-label-hbond" x="595" y="330" font-size="14" fill="#1565c0" opacity="0">氢键</text>

            <!-- 范德华力标签 -->
            <text id="scene1-label-vdw" x="700" y="465" font-size="14" fill="#333333" opacity="0">范德华力</text>

            <!-- 步骤3结论 -->
            <text id="scene1-conclusion-crystal" x="400" y="65" font-size="15" fill="#333333" text-anchor="middle" opacity="0">晶体作用力：极性键、非极性键、氢键、范德华力</text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() { 'use strict';

        var currentStep = 0;
        var maxStep = 3;

        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');

        var bondOO = document.getElementById('scene1-bond-oo');
        var bondOH1 = document.getElementById('scene1-bond-oh1');
        var bondOH2 = document.getElementById('scene1-bond-oh2');

        var labelNonpolar = document.getElementById('scene1-label-nonpolar');
        var labelPolar1 = document.getElementById('scene1-label-polar1');
        var labelPolar2 = document.getElementById('scene1-label-polar2');

        var chargeDminusO1 = document.getElementById('scene1-charge-dminus-o1');
        var chargeDminusO2 = document.getElementById('scene1-charge-dminus-o2');
        var chargeDplusH1 = document.getElementById('scene1-charge-dplus-h1');
        var chargeDplusH2 = document.getElementById('scene1-charge-dplus-h2');
        var conclusionPolarity = document.getElementById('scene1-conclusion-polarity');

        var molecule2 = document.getElementById('scene1-molecule2');
        var hbondLine = document.getElementById('scene1-hbond-line');
        var labelHbond = document.getElementById('scene1-label-hbond');
        var labelVdw = document.getElementById('scene1-label-vdw');
        var conclusionCrystal = document.getElementById('scene1-conclusion-crystal');

        var title = document.getElementById('scene1-title');

        function show(el) {
            el.style.display = '';
            el.style.opacity = '1';
        }
        function hide(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        function updateScene(step) {
            hide(labelNonpolar);
            hide(labelPolar1);
            hide(labelPolar2);
            hide(chargeDminusO1);
            hide(chargeDminusO2);
            hide(chargeDplusH1);
            hide(chargeDplusH2);
            hide(conclusionPolarity);
            hide(molecule2);
            hide(hbondLine);
            hide(labelHbond);
            hide(labelVdw);
            hide(conclusionCrystal);

            bondOO.setAttribute('stroke', '#000000');
            bondOO.setAttribute('stroke-width', '2');
            bondOH1.setAttribute('stroke', '#000000');
            bondOH1.setAttribute('stroke-width', '2');
            bondOH2.setAttribute('stroke', '#000000');
            bondOH2.setAttribute('stroke-width', '2');

            show(title);

            if (step >= 1) {
                bondOO.setAttribute('stroke', '#c62828');
                bondOO.setAttribute('stroke-width', '4');
                bondOH1.setAttribute('stroke', '#1565c0');
                bondOH1.setAttribute('stroke-width', '4');
                bondOH2.setAttribute('stroke', '#1565c0');
                bondOH2.setAttribute('stroke-width', '4');
                show(labelNonpolar);
                show(labelPolar1);
                show(labelPolar2);
            }

            if (step >= 2) {
                bondOO.setAttribute('stroke-width', '3');
                bondOH1.setAttribute('stroke-width', '3');
                bondOH2.setAttribute('stroke-width', '3');
                show(chargeDminusO1);
                show(chargeDminusO2);
                show(chargeDplusH1);
                show(chargeDplusH2);
                show(conclusionPolarity);
            }

            if (step >= 3) {
                show(molecule2);
                show(hbondLine);
                show(labelHbond);
                show(labelVdw);
                show(conclusionCrystal);
                hide(conclusionPolarity);
                hide(title);
            }

            btnPrev.disabled = (step === 0);
            btnNext.disabled = (step === maxStep);
        }

        btnNext.addEventListener('click', function() {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene(currentStep);
            }
        });

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene(currentStep);
            }
        });

        updateScene(0);

    })();
    </script>
</body>
</html>
