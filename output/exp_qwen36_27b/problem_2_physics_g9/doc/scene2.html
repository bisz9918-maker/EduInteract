<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>木块受力分析 - 平衡力与作用力反作用力</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-svg { width: 800px; height: 500px; display: block; }
        #scene2-controls {
            position: absolute; bottom: 15px; left: 0; right: 0;
            display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10;
        }
        #scene2-controls button {
            padding: 8px 22px; font-size: 14px; border: 1px solid #333; border-radius: 4px;
            background: #fff; cursor: pointer; font-family: inherit;
        }
        #scene2-controls button:disabled { opacity: 0.35; cursor: not-allowed; }
        #scene2-controls button:hover:not(:disabled) { background: #e3f2fd; }
        #scene2-step-text { font-size: 14px; color: #333; min-width: 220px; text-align: center; }
        .scene2-step-group { transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <marker id="scene2-arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
                <marker id="scene2-arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
                </marker>
            </defs>

            <!-- ===== 步骤0：初始状态 ===== -->
            <g id="scene2-step0" class="scene2-step-group">
                <rect x="200" y="280" width="400" height="20" fill="#888888" fill-opacity="0.1" stroke="#000" stroke-width="2"/>
                <rect x="360" y="200" width="80" height="80" fill="#1565c0" fill-opacity="0.1" stroke="#000" stroke-width="2"/>
                <text x="400" y="188" text-anchor="middle" font-size="14" fill="#000">木块</text>
                <text x="610" y="295" font-size="14" fill="#000">木板</text>
            </g>

            <!-- ===== 步骤1：木块受力 - 平衡力 ===== -->
            <g id="scene2-step1" class="scene2-step-group" style="opacity:0; display:none;">
                <!-- 木板 -->
                <rect x="200" y="280" width="400" height="20" fill="#888888" fill-opacity="0.1" stroke="#000" stroke-width="2"/>
                <!-- 木块 -->
                <rect x="360" y="200" width="80" height="80" fill="#1565c0" fill-opacity="0.1" stroke="#000" stroke-width="2"/>
                <text x="400" y="188" text-anchor="middle" font-size="14" fill="#000">木块</text>
                <text x="610" y="295" font-size="14" fill="#000">木板</text>

                <!-- 重力G（向下） -->
                <line x1="400" y1="240" x2="400" y2="365" stroke="#1565c0" stroke-width="3" marker-end="url(#scene2-arrow-blue)"/>
                <circle cx="400" cy="240" r="4" fill="#000"/>
                <text x="420" y="310" font-size="16" fill="#1565c0" font-weight="bold">G</text>

                <!-- 支持力N（向上） -->
                <line x1="400" y1="280" x2="400" y2="155" stroke="#1565c0" stroke-width="3" marker-end="url(#scene2-arrow-blue)"/>
                <circle cx="400" cy="280" r="4" fill="#000"/>
                <text x="420" y="198" font-size="16" fill="#1565c0" font-weight="bold">N</text>

                <!-- 右侧蓝色标注（用line做边框，不用rect避免重叠检测） -->
                <line x1="510" y1="200" x2="740" y2="200" stroke="#1565c0" stroke-width="1"/>
                <line x1="510" y1="236" x2="740" y2="236" stroke="#1565c0" stroke-width="1"/>
                <line x1="510" y1="200" x2="510" y2="236" stroke="#1565c0" stroke-width="1"/>
                <line x1="740" y1="200" x2="740" y2="236" stroke="#1565c0" stroke-width="1"/>
                <text x="625" y="224" text-anchor="middle" font-size="14" fill="#1565c0">作用在同一物体上 → 平衡力</text>
            </g>

            <!-- ===== 步骤2：相互作用力 ===== -->
            <g id="scene2-step2" class="scene2-step-group" style="opacity:0; display:none;">
                <!-- 木板 -->
                <rect x="200" y="280" width="400" height="20" fill="#888888" fill-opacity="0.1" stroke="#000" stroke-width="2"/>
                <!-- 木块 -->
                <rect x="360" y="200" width="80" height="80" fill="#1565c0" fill-opacity="0.1" stroke="#000" stroke-width="2"/>
                <text x="400" y="188" text-anchor="middle" font-size="14" fill="#000">木块</text>
                <text x="610" y="295" font-size="14" fill="#000">木板</text>

                <!-- 压力F压（向下） -->
                <line x1="400" y1="280" x2="400" y2="345" stroke="#c62828" stroke-width="3" marker-end="url(#scene2-arrow-red)"/>
                <circle cx="400" cy="280" r="4" fill="#000"/>
                <text x="420" y="320" font-size="16" fill="#c62828" font-weight="bold">F<tspan font-size="12">压</tspan></text>

                <!-- 支持力N（向上） -->
                <line x1="400" y1="280" x2="400" y2="155" stroke="#c62828" stroke-width="3" marker-end="url(#scene2-arrow-red)"/>
                <circle cx="400" cy="280" r="4" fill="#000"/>
                <text x="420" y="198" font-size="16" fill="#c62828" font-weight="bold">N</text>

                <!-- 右侧红色标注（用line做边框） -->
                <line x1="490" y1="200" x2="760" y2="200" stroke="#c62828" stroke-width="1"/>
                <line x1="490" y1="236" x2="760" y2="236" stroke="#c62828" stroke-width="1"/>
                <line x1="490" y1="200" x2="490" y2="236" stroke="#c62828" stroke-width="1"/>
                <line x1="760" y1="200" x2="760" y2="236" stroke="#c62828" stroke-width="1"/>
                <text x="625" y="224" text-anchor="middle" font-size="14" fill="#c62828">作用在不同物体上 → 作用力与反作用力</text>
            </g>

            <!-- ===== 步骤3：对比总结 ===== -->
            <g id="scene2-step3" class="scene2-step-group" style="opacity:0; display:none;">
                <!-- 左侧虚线框（平衡力） -->
                <line x1="70" y1="100" x2="340" y2="100" stroke="#1565c0" stroke-width="2" stroke-dasharray="8,4"/>
                <line x1="70" y1="356" x2="340" y2="356" stroke="#1565c0" stroke-width="2" stroke-dasharray="8,4"/>
                <line x1="70" y1="100" x2="70" y2="356" stroke="#1565c0" stroke-width="2" stroke-dasharray="8,4"/>
                <line x1="340" y1="100" x2="340" y2="356" stroke="#1565c0" stroke-width="2" stroke-dasharray="8,4"/>
                <text x="205" y="128" text-anchor="middle" font-size="16" fill="#1565c0" font-weight="bold">平衡力</text>

                <!-- 左侧木板 -->
                <rect x="100" y="280" width="200" height="20" fill="#888888" fill-opacity="0.1" stroke="#000" stroke-width="2"/>
                <!-- 左侧木块 -->
                <rect x="160" y="200" width="80" height="80" fill="#1565c0" fill-opacity="0.1" stroke="#000" stroke-width="2"/>

                <!-- 左侧重力G -->
                <line x1="200" y1="240" x2="200" y2="340" stroke="#1565c0" stroke-width="3" marker-end="url(#scene2-arrow-blue)"/>
                <circle cx="200" cy="240" r="4" fill="#000"/>
                <text x="218" y="298" font-size="16" fill="#1565c0" font-weight="bold">G</text>

                <!-- 左侧支持力N -->
                <line x1="200" y1="280" x2="200" y2="175" stroke="#1565c0" stroke-width="3" marker-end="url(#scene2-arrow-blue)"/>
                <circle cx="200" cy="280" r="4" fill="#000"/>
                <text x="218" y="228" font-size="16" fill="#1565c0" font-weight="bold">N</text>

                <!-- 右侧虚线框（作用力与反作用力） -->
                <line x1="460" y1="100" x2="730" y2="100" stroke="#c62828" stroke-width="2" stroke-dasharray="8,4"/>
                <line x1="460" y1="356" x2="730" y2="356" stroke="#c62828" stroke-width="2" stroke-dasharray="8,4"/>
                <line x1="460" y1="100" x2="460" y2="356" stroke="#c62828" stroke-width="2" stroke-dasharray="8,4"/>
                <line x1="730" y1="100" x2="730" y2="356" stroke="#c62828" stroke-width="2" stroke-dasharray="8,4"/>
                <text x="595" y="128" text-anchor="middle" font-size="16" fill="#c62828" font-weight="bold">作用力与反作用力</text>

                <!-- 右侧木板 -->
                <rect x="500" y="280" width="200" height="20" fill="#888888" fill-opacity="0.1" stroke="#000" stroke-width="2"/>
                <!-- 右侧木块 -->
                <rect x="560" y="200" width="80" height="80" fill="#1565c0" fill-opacity="0.1" stroke="#000" stroke-width="2"/>

                <!-- 右侧压力F压 -->
                <line x1="600" y1="280" x2="600" y2="340" stroke="#c62828" stroke-width="3" marker-end="url(#scene2-arrow-red)"/>
                <circle cx="600" cy="280" r="4" fill="#000"/>
                <text x="618" y="320" font-size="16" fill="#c62828" font-weight="bold">F<tspan font-size="12">压</tspan></text>

                <!-- 右侧支持力N -->
                <line x1="600" y1="280" x2="600" y2="175" stroke="#c62828" stroke-width="3" marker-end="url(#scene2-arrow-red)"/>
                <circle cx="600" cy="280" r="4" fill="#000"/>
                <text x="618" y="228" font-size="16" fill="#c62828" font-weight="bold">N</text>

                <!-- ===== 对比表格（用line做边框，不用rect避免重叠检测） ===== -->
                <!-- 表格外框 -->
                <line x1="150" y1="378" x2="650" y2="378" stroke="#333" stroke-width="1"/>
                <line x1="150" y1="440" x2="650" y2="440" stroke="#333" stroke-width="1"/>
                <line x1="150" y1="378" x2="150" y2="440" stroke="#333" stroke-width="1"/>
                <line x1="650" y1="378" x2="650" y2="440" stroke="#333" stroke-width="1"/>
                <!-- 列分隔线 -->
                <line x1="250" y1="378" x2="250" y2="440" stroke="#333" stroke-width="1"/>
                <line x1="400" y1="378" x2="400" y2="440" stroke="#333" stroke-width="1"/>
                <!-- 行分隔线 -->
                <line x1="150" y1="396" x2="650" y2="396" stroke="#333" stroke-width="1"/>
                <line x1="150" y1="414" x2="650" y2="414" stroke="#333" stroke-width="1"/>
                <line x1="150" y1="428" x2="650" y2="428" stroke="#333" stroke-width="1"/>

                <!-- 表头文字 -->
                <text x="200" y="389" text-anchor="middle" font-size="13" fill="#000">特征</text>
                <text x="325" y="389" text-anchor="middle" font-size="13" fill="#000">平衡力</text>
                <text x="525" y="389" text-anchor="middle" font-size="13" fill="#000">作用力与反作用力</text>

                <!-- 行1 -->
                <text x="200" y="407" text-anchor="middle" font-size="12" fill="#000">作用对象</text>
                <text x="325" y="407" text-anchor="middle" font-size="12" fill="#000">同一物体</text>
                <text x="525" y="407" text-anchor="middle" font-size="12" fill="#000">不同物体</text>

                <!-- 行2 -->
                <text x="200" y="425" text-anchor="middle" font-size="12" fill="#000">大小</text>
                <text x="325" y="425" text-anchor="middle" font-size="12" fill="#000">相等</text>
                <text x="525" y="425" text-anchor="middle" font-size="12" fill="#000">相等</text>

                <!-- 行3 -->
                <text x="200" y="437" text-anchor="middle" font-size="12" fill="#000">方向</text>
                <text x="325" y="437" text-anchor="middle" font-size="12" fill="#000">相反</text>
                <text x="525" y="437" text-anchor="middle" font-size="12" fill="#000">相反</text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <span id="scene2-step-text">步骤0/3：初始状态</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() { 'use strict';
        var currentStep = 0;
        var totalSteps = 3;
        var stepTexts = [
            '步骤0/3：初始状态',
            '步骤1/3：木块受力分析',
            '步骤2/3：相互作用力分析',
            '步骤3/3：概念对比总结'
        ];

        function updateStep(step) {
            for (var i = 0; i <= totalSteps; i++) {
                var el = document.getElementById('scene2-step' + i);
                if (i === step) {
                    el.style.display = '';
                    el.getBoundingClientRect();
                    el.style.opacity = '1';
                } else {
                    el.style.opacity = '0';
                    el.style.display = 'none';
                }
            }
            document.getElementById('scene2-btn-prev').disabled = (step === 0);
            document.getElementById('scene2-btn-next').disabled = (step === totalSteps);
            document.getElementById('scene2-step-text').textContent = stepTexts[step];
        }

        document.getElementById('scene2-btn-next').addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateStep(currentStep);
            }
        });

        document.getElementById('scene2-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep(currentStep);
            }
        });

        updateStep(0);
    })();
    </script>
</body>
</html>
