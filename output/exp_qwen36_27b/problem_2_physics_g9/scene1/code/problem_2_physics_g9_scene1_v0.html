<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小车下滑碰撞实验 - 能量转化演示</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; display: block; }
        #scene1-controls {
            position: absolute; bottom: 8px; left: 0; right: 0;
            display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10;
            height: 44px;
        }
        #scene1-controls button {
            padding: 6px 18px; font-size: 14px; cursor: pointer;
            border: 2px solid #1565c0; border-radius: 6px;
            background: #e3f2fd; color: #1565c0; font-weight: bold;
            transition: all 0.2s;
        }
        #scene1-controls button:hover:not(:disabled) { background: #1565c0; color: #fff; }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; border-color: #999; color: #999; background: #f5f5f5; }
        #scene1-step-desc {
            font-size: 14px; color: #333; font-weight: bold; min-width: 200px; text-align: center;
        }
        .energy-bar { transition: height 0.6s ease-in-out, y 0.6s ease-in-out; }
        .movable { transition: transform 0.6s ease-in-out; }
        .annotation { transition: opacity 0.4s ease-in-out; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <marker id="scene1-arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
                </marker>
                <marker id="scene1-arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#888888"/>
                </marker>
                <linearGradient id="scene1-collision-glow" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#c62828;stop-opacity:0"/>
                    <stop offset="50%" style="stop-color:#c62828;stop-opacity:0.3"/>
                    <stop offset="100%" style="stop-color:#c62828;stop-opacity:0"/>
                </linearGradient>
            </defs>

            <!-- ===== Energy Panel ===== -->
            <!-- Title above panel -->
            <text x="680" y="16" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">能量柱状图</text>
            <!-- Legend -->
            <rect x="595" y="24" width="12" height="12" fill="#1565c0" rx="2"/>
            <text x="612" y="35" font-size="11" fill="#333">PE</text>
            <rect x="645" y="24" width="12" height="12" fill="#c62828" rx="2"/>
            <text x="662" y="35" font-size="11" fill="#333">KE</text>
            <rect x="700" y="24" width="12" height="12" fill="#2e7d32" rx="2"/>
            <text x="717" y="35" font-size="11" fill="#333">总</text>
            <!-- Panel background (below legend, starts at y=42) -->
            <rect x="575" y="42" width="210" height="340" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>

            <!-- Energy baseline -->
            <line x1="590" y1="370" x2="770" y2="370" stroke="#999" stroke-width="1"/>

            <!-- Energy Bars - Cart Group -->
            <rect id="scene1-bar-pe-cart" class="energy-bar" x="600" y="70" width="16" height="300" fill="#1565c0" rx="2"/>
            <rect id="scene1-bar-ke-cart" class="energy-bar" x="622" y="370" width="16" height="0" fill="#c62828" rx="2"/>
            <rect id="scene1-bar-total-cart" class="energy-bar" x="644" y="70" width="16" height="300" fill="#2e7d32" rx="2"/>

            <!-- Energy Bars - Block Group -->
            <rect id="scene1-bar-pe-block" class="energy-bar" x="672" y="370" width="16" height="0" fill="#1565c0" rx="2"/>
            <rect id="scene1-bar-ke-block" class="energy-bar" x="694" y="370" width="16" height="0" fill="#c62828" rx="2"/>
            <rect id="scene1-bar-total-block" class="energy-bar" x="716" y="370" width="16" height="0" fill="#2e7d32" rx="2"/>

            <!-- Energy panel labels (below panel, y > 382) -->
            <text x="630" y="398" text-anchor="middle" font-size="12" fill="#333">小车</text>
            <text x="702" y="398" text-anchor="middle" font-size="12" fill="#333">木块</text>

            <!-- ===== Physics Scene ===== -->
            <!-- Ground reference line -->
            <line x1="60" y1="365" x2="560" y2="365" stroke="#666" stroke-width="1" stroke-dasharray="4,4"/>

            <!-- Ramp (斜面) -->
            <line x1="100" y1="360" x2="300" y2="160" stroke="#333" stroke-width="3"/>
            <line x1="100" y1="364" x2="300" y2="164" stroke="#333" stroke-width="1" opacity="0.3"/>

            <!-- Horizontal board (水平木板) -->
            <line x1="300" y1="360" x2="540" y2="360" stroke="#333" stroke-width="3"/>
            <line x1="300" y1="364" x2="540" y2="364" stroke="#333" stroke-width="1" opacity="0.3"/>

            <!-- Fixed labels for scene elements -->
            <!-- "斜面" placed well left of ramp line (x=100 is ramp start) -->
            <text id="scene1-label-ramp" x="65" y="260" font-size="14" fill="#333">斜面</text>
            <!-- "木板" placed well right of board end (x=540 is board end) -->
            <text id="scene1-label-board" x="555" y="348" font-size="14" fill="#333">木板</text>

            <!-- ===== Cart (小车) ===== -->
            <g id="scene1-cart" class="movable">
                <rect x="-20" y="-12" width="40" height="22" rx="3" fill="#1565c0" stroke="#000" stroke-width="1.5"/>
                <circle cx="-10" cy="12" r="5" fill="#333" stroke="#000" stroke-width="1"/>
                <circle cx="10" cy="12" r="5" fill="#333" stroke="#000" stroke-width="1"/>
            </g>
            <!-- Cart label - positioned well above cart body -->
            <text id="scene1-label-cart" x="240" y="155" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">小车</text>

            <!-- ===== Block (木块) ===== -->
            <g id="scene1-block" class="movable">
                <rect x="-20" y="-20" width="40" height="40" rx="2" fill="#2e7d32" stroke="#000" stroke-width="1.5"/>
            </g>
            <!-- Block label - positioned well above block body -->
            <text id="scene1-label-block" x="420" y="295" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">木块</text>

            <!-- ===== Velocity Arrow ===== -->
            <g id="scene1-velocity-arrow" class="annotation" opacity="0">
                <line id="scene1-vel-line" x1="0" y1="0" x2="60" y2="0" stroke="#c62828" stroke-width="2.5" marker-end="url(#scene1-arrow-red)"/>
                <text id="scene1-vel-label" x="30" y="-14" text-anchor="middle" font-size="11" fill="#c62828">v</text>
            </g>

            <!-- ===== Friction Arrow ===== -->
            <g id="scene1-friction-arrow" class="annotation" opacity="0">
                <line x1="0" y1="0" x2="-50" y2="0" stroke="#888888" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#scene1-arrow-gray)"/>
                <text x="-25" y="-16" text-anchor="middle" font-size="11" fill="#888888">f</text>
            </g>

            <!-- ===== Collision Highlight ===== -->
            <rect id="scene1-collision-highlight" class="annotation" opacity="0" x="350" y="310" width="80" height="60" fill="url(#scene1-collision-glow)" rx="4"/>

            <!-- ===== Annotations ===== -->
            <text id="scene1-annot-energy" class="annotation" opacity="0" x="175" y="245" font-size="13" fill="#c62828" font-weight="bold">重力势能→动能</text>
            <text id="scene1-annot-collision" class="annotation" opacity="0" x="390" y="240" font-size="13" fill="#c62828" font-weight="bold">动能传递</text>
            <text id="scene1-annot-friction" class="annotation" opacity="0" x="470" y="260" font-size="13" fill="#888888" font-weight="bold">摩擦力做功</text>
            <text id="scene1-annot-smooth" class="annotation" opacity="0" x="470" y="260" font-size="13" fill="#2e7d32" font-weight="bold">光滑→动能不变</text>
        </svg>

        <!-- Controls -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-desc">初始状态：小车静止于斜面顶端</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() { 'use strict';

        let currentStep = 0;
        const totalSteps = 4;

        const cart = document.getElementById('scene1-cart');
        const block = document.getElementById('scene1-block');
        const labelCart = document.getElementById('scene1-label-cart');
        const labelBlock = document.getElementById('scene1-label-block');
        const velArrow = document.getElementById('scene1-velocity-arrow');
        const velLine = document.getElementById('scene1-vel-line');
        const velLabel = document.getElementById('scene1-vel-label');
        const frictionArrow = document.getElementById('scene1-friction-arrow');
        const collisionHighlight = document.getElementById('scene1-collision-highlight');
        const annotEnergy = document.getElementById('scene1-annot-energy');
        const annotCollision = document.getElementById('scene1-annot-collision');
        const annotFriction = document.getElementById('scene1-annot-friction');
        const annotSmooth = document.getElementById('scene1-annot-smooth');
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepDesc = document.getElementById('scene1-step-desc');

        const barPECart = document.getElementById('scene1-bar-pe-cart');
        const barKECart = document.getElementById('scene1-bar-ke-cart');
        const barTotalCart = document.getElementById('scene1-bar-total-cart');
        const barPEBlock = document.getElementById('scene1-bar-pe-block');
        const barKEBlock = document.getElementById('scene1-bar-ke-block');
        const barTotalBlock = document.getElementById('scene1-bar-total-block');

        const descriptions = [
            '初始状态：小车静止于斜面顶端',
            '步骤1：小车下滑 — 重力势能转化为动能',
            '步骤2：碰撞瞬间 — 动能从小车传递给木块',
            '步骤3：粗糙木板 — 摩擦力做功，木块减速停止',
            '步骤4：光滑木板假设 — 无摩擦，木块动能保持不变'
        ];

        const energyData = [
            { cart: { pe: 300, ke: 0, total: 300 }, block: { pe: 0, ke: 0, total: 0 } },
            { cart: { pe: 0, ke: 300, total: 300 }, block: { pe: 0, ke: 0, total: 0 } },
            { cart: { pe: 0, ke: 150, total: 150 }, block: { pe: 0, ke: 150, total: 150 } },
            { cart: { pe: 0, ke: 150, total: 150 }, block: { pe: 0, ke: 0, total: 0 } },
            { cart: { pe: 0, ke: 150, total: 150 }, block: { pe: 0, ke: 150, total: 150 } }
        ];

        // Cart: {x, y, rot}, Block: {x, y}, CartLabel: {x, y}, BlockLabel: {x, y}
        const positions = [
            { cart: { x: 240, y: 205, rot: -45 }, block: { x: 420, y: 340 }, cartLabel: { x: 240, y: 155 }, blockLabel: { x: 420, y: 293 } },
            { cart: { x: 290, y: 340, rot: 0 }, block: { x: 420, y: 340 }, cartLabel: { x: 290, y: 300 }, blockLabel: { x: 420, y: 293 } },
            { cart: { x: 370, y: 340, rot: 0 }, block: { x: 420, y: 340 }, cartLabel: { x: 370, y: 300 }, blockLabel: { x: 420, y: 293 } },
            { cart: { x: 370, y: 340, rot: 0 }, block: { x: 500, y: 340 }, cartLabel: { x: 370, y: 300 }, blockLabel: { x: 500, y: 293 } },
            { cart: { x: 370, y: 340, rot: 0 }, block: { x: 520, y: 340 }, cartLabel: { x: 370, y: 300 }, blockLabel: { x: 520, y: 293 } }
        ];

        function showEl(el) { el.style.display = ''; el.style.opacity = '1'; }
        function hideEl(el) { el.style.display = 'none'; el.style.opacity = '0'; }

        function setBar(bar, value) {
            const baseY = 370;
            const h = Math.max(0, value);
            bar.setAttribute('height', h);
            bar.setAttribute('y', baseY - h);
        }

        function renderStep(step) {
            const pos = positions[step];
            const energy = energyData[step];

            cart.setAttribute('transform', `translate(${pos.cart.x}, ${pos.cart.y}) rotate(${pos.cart.rot})`);
            block.setAttribute('transform', `translate(${pos.block.x}, ${pos.block.y})`);

            labelCart.setAttribute('x', pos.cartLabel.x);
            labelCart.setAttribute('y', pos.cartLabel.y);
            labelBlock.setAttribute('x', pos.blockLabel.x);
            labelBlock.setAttribute('y', pos.blockLabel.y);

            setBar(barPECart, energy.cart.pe);
            setBar(barKECart, energy.cart.ke);
            setBar(barTotalCart, energy.cart.total);
            setBar(barPEBlock, energy.block.pe);
            setBar(barKEBlock, energy.block.ke);
            setBar(barTotalBlock, energy.block.total);

            hideEl(annotEnergy);
            hideEl(annotCollision);
            hideEl(annotFriction);
            hideEl(annotSmooth);
            hideEl(velArrow);
            hideEl(frictionArrow);
            hideEl(collisionHighlight);

            switch(step) {
                case 0:
                    break;
                case 1:
                    showEl(velArrow);
                    velLine.setAttribute('x1', pos.cart.x + 25);
                    velLine.setAttribute('y1', pos.cart.y - 5);
                    velLine.setAttribute('x2', pos.cart.x + 70);
                    velLine.setAttribute('y2', pos.cart.y - 5);
                    velLabel.setAttribute('x', pos.cart.x + 48);
                    velLabel.setAttribute('y', pos.cart.y - 18);
                    showEl(annotEnergy);
                    break;
                case 2:
                    showEl(collisionHighlight);
                    showEl(velArrow);
                    velLine.setAttribute('x1', pos.cart.x + 25);
                    velLine.setAttribute('y1', pos.cart.y - 5);
                    velLine.setAttribute('x2', pos.cart.x + 55);
                    velLine.setAttribute('y2', pos.cart.y - 5);
                    velLabel.setAttribute('x', pos.cart.x + 40);
                    velLabel.setAttribute('y', pos.cart.y - 18);
                    showEl(annotCollision);
                    break;
                case 3:
                    showEl(frictionArrow);
                    frictionArrow.setAttribute('transform', `translate(${pos.block.x + 22}, ${pos.block.y + 5})`);
                    showEl(annotFriction);
                    break;
                case 4:
                    showEl(velArrow);
                    velLine.setAttribute('x1', pos.block.x + 25);
                    velLine.setAttribute('y1', pos.block.y - 5);
                    velLine.setAttribute('x2', pos.block.x + 65);
                    velLine.setAttribute('y2', pos.block.y - 5);
                    velLabel.setAttribute('x', pos.block.x + 45);
                    velLabel.setAttribute('y', pos.block.y - 18);
                    showEl(annotSmooth);
                    break;
            }

            stepDesc.textContent = descriptions[step];
            btnPrev.disabled = (step === 0);
            btnNext.disabled = (step === totalSteps);
        }

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) { currentStep++; renderStep(currentStep); }
        });
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) { currentStep--; renderStep(currentStep); }
        });

        renderStep(0);

    })();
    </script>
</body>
</html>
