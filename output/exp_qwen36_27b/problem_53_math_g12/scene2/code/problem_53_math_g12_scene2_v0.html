<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四棱锥比例问题 - 场景2</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-svg { width: 800px; height: 500px; display: block; }
        #scene2-controls {
            position: absolute; bottom: 10px; left: 0; right: 0;
            display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10;
        }
        #scene2-controls button {
            width: 110px; height: 36px; font-size: 14px; cursor: pointer;
            border: 2px solid #333; border-radius: 6px; background: #f5f5f5; color: #333;
            transition: background 0.2s, border-color 0.2s;
        }
        #scene2-controls button:hover:not(:disabled) { background: #e0e0e0; border-color: #000; }
        #scene2-controls button:disabled { opacity: 0.4; cursor: default; }
        #scene2-step-indicator { font-size: 15px; color: #333; min-width: 80px; text-align: center; font-weight: bold; }
        .fade-element { opacity: 0; transition: opacity 0.4s ease; }
        .fade-element.visible { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <marker id="scene2-arrowhead-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                    <polygon points="0 0, 8 3, 0 6" fill="#e65100"/>
                </marker>
                <marker id="scene2-arrowhead-orange-rev" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
                    <polygon points="8 0, 0 3, 8 6" fill="#e65100"/>
                </marker>
            </defs>

            <!-- ===== 左侧 △ACD ===== -->
            <g id="scene2-tri-acd">
                <line x1="100" y1="350" x2="250" y2="350" stroke="#000000" stroke-width="2"/>
                <line x1="250" y1="350" x2="175" y2="180" stroke="#000000" stroke-width="2"/>
                <line x1="175" y1="180" x2="100" y2="350" stroke="#000000" stroke-width="2"/>
                <circle cx="100" cy="350" r="4" fill="#000000"/>
                <circle cx="250" cy="350" r="4" fill="#000000"/>
                <circle cx="175" cy="180" r="4" fill="#000000"/>
                <!-- 顶点标签：远离边线 -->
                <text x="78" y="378" font-size="16" fill="#000000" font-weight="bold">A</text>
                <text x="272" y="378" font-size="16" fill="#000000" font-weight="bold">C</text>
                <!-- D 标签放在三角形上方空白区，远离顶点 -->
                <text x="175" y="138" font-size="16" fill="#000000" font-weight="bold" text-anchor="middle">D</text>
                <text x="175" y="108" font-size="18" fill="#000000" font-weight="bold" text-anchor="middle">△ACD</text>
            </g>

            <!-- ===== 右侧 △PCD ===== -->
            <g id="scene2-tri-pcd">
                <line x1="550" y1="100" x2="450" y2="350" stroke="#000000" stroke-width="2"/>
                <line x1="450" y1="350" x2="525" y2="180" stroke="#000000" stroke-width="2"/>
                <line x1="525" y1="180" x2="550" y2="100" stroke="#000000" stroke-width="2"/>
                <circle cx="550" cy="100" r="4" fill="#000000"/>
                <circle cx="450" cy="350" r="4" fill="#000000"/>
                <circle cx="525" cy="180" r="4" fill="#000000"/>
                <text x="550" y="78" font-size="16" fill="#000000" font-weight="bold" text-anchor="middle">P</text>
                <text x="425" y="378" font-size="16" fill="#000000" font-weight="bold">C</text>
                <text x="525" y="138" font-size="16" fill="#000000" font-weight="bold" text-anchor="middle">D</text>
                <text x="487" y="48" font-size="18" fill="#000000" font-weight="bold" text-anchor="middle">△PCD</text>
            </g>

            <!-- ===== 点 M (在 AC 上) ===== -->
            <circle cx="220" cy="350" r="5" fill="#000000"/>
            <text x="220" y="322" font-size="14" fill="#000000" font-weight="bold" text-anchor="middle">M</text>

            <!-- ===== 点 N (在 PC 上) ===== -->
            <circle cx="470" cy="300" r="5" fill="#000000"/>
            <text x="432" y="282" font-size="14" fill="#000000" font-weight="bold">N</text>

            <!-- ===== 初始标签: CM:MA = 1:4 ===== -->
            <text id="scene2-label-cm-ma" x="175" y="400" font-size="14" fill="#000000" text-anchor="middle">CM:MA = 1:4</text>

            <!-- ===== 步骤1元素: 左侧推导 ===== -->
            <line id="scene2-line-me" class="fade-element" x1="220" y1="350" x2="235" y2="316" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6,4"/>
            <circle id="scene2-point-e-left" class="fade-element" cx="235" cy="316" r="5" fill="#2e7d32"/>
            <text id="scene2-label-e-left" class="fade-element" x="262" y="302" font-size="14" fill="#2e7d32" font-weight="bold">E</text>
            <line id="scene2-highlight-ce-left" class="fade-element" x1="250" y1="350" x2="235" y2="316" stroke="#e65100" stroke-width="3"/>
            <line id="scene2-highlight-ed-left" class="fade-element" x1="235" y1="316" x2="175" y2="180" stroke="#e65100" stroke-width="3"/>
            <!-- ME ∥ AD - 左侧外部 -->
            <text id="scene2-label-me-ad" class="fade-element" x="48" y="272" font-size="13" fill="#2e7d32" font-weight="bold">ME ∥ AD</text>
            <!-- CE:ED = 1:4 - 右侧外部 -->
            <text id="scene2-label-ce-ed-left" class="fade-element" x="292" y="338" font-size="13" fill="#e65100" font-weight="bold">CE:ED = 1:4</text>
            <!-- 推理标注 - 左侧外部上方，与ME∥AD保持间距 -->
            <text id="scene2-reason-left" class="fade-element" x="32" y="242" font-size="12" fill="#e65100">平行线分线段成比例</text>
            <!-- 箭头：从CM:MA指向CE:ED -->
            <path id="scene2-arrow-left" class="fade-element" d="M 175 392 L 175 382 L 282 342" stroke="#e65100" stroke-width="1.5" fill="none" marker-end="url(#scene2-arrowhead-orange)"/>

            <!-- ===== 步骤2元素: 右侧推导 ===== -->
            <line id="scene2-line-ne" class="fade-element" x1="470" y1="300" x2="465" y2="316" stroke="#2e7d32" stroke-width="2"/>
            <circle id="scene2-point-e-right" class="fade-element" cx="465" cy="316" r="5" fill="#2e7d32"/>
            <text id="scene2-label-e-right" class="fade-element" x="495" y="302" font-size="14" fill="#2e7d32" font-weight="bold">E</text>
            <line id="scene2-highlight-nc" class="fade-element" x1="450" y1="350" x2="470" y2="300" stroke="#c62828" stroke-width="3"/>
            <line id="scene2-highlight-np" class="fade-element" x1="470" y1="300" x2="550" y2="100" stroke="#c62828" stroke-width="3"/>
            <!-- NE ∥ PD - 右侧外部 -->
            <text id="scene2-label-ne-pd" class="fade-element" x="578" y="232" font-size="13" fill="#2e7d32" font-weight="bold">NE ∥ PD</text>
            <!-- NC:NP = CE:ED - 两三角形之间上方 -->
            <text id="scene2-label-nc-np" class="fade-element" x="362" y="252" font-size="13" fill="#c62828" font-weight="bold">NC:NP = CE:ED</text>
            <!-- 推理标注 - 右侧外部上方，与NE∥PD保持间距 -->
            <text id="scene2-reason-right" class="fade-element" x="562" y="202" font-size="12" fill="#e65100">平行线分线段成比例</text>
            <!-- 箭头 -->
            <path id="scene2-arrow-right" class="fade-element" d="M 385 375 L 410 375 L 410 272" stroke="#e65100" stroke-width="1.5" fill="none" marker-end="url(#scene2-arrowhead-orange)"/>

            <!-- ===== 步骤3元素: 结论 ===== -->
            <g id="scene2-bridge" class="fade-element">
                <line x1="290" y1="385" x2="410" y2="385" stroke="#e65100" stroke-width="2" marker-end="url(#scene2-arrowhead-orange)" marker-start="url(#scene2-arrowhead-orange-rev)"/>
                <text x="350" y="380" font-size="13" fill="#e65100" font-weight="bold" text-anchor="middle">公共比例桥梁</text>
            </g>
            <text id="scene2-conclusion" class="fade-element" x="400" y="420" font-size="20" fill="#c62828" font-weight="bold" text-anchor="middle">NC:NP = CE:ED = CM:MA = 1:4</text>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-prev-btn" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 0/3</span>
            <button id="scene2-next-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        var currentStep = 0;
        var totalSteps = 3;
        var prevBtn = document.getElementById("scene2-prev-btn");
        var nextBtn = document.getElementById("scene2-next-btn");
        var stepIndicator = document.getElementById("scene2-step-indicator");

        var stepElements = {
            1: [
                "scene2-line-me", "scene2-point-e-left", "scene2-label-e-left",
                "scene2-highlight-ce-left", "scene2-highlight-ed-left",
                "scene2-label-me-ad", "scene2-label-ce-ed-left",
                "scene2-reason-left", "scene2-arrow-left"
            ],
            2: [
                "scene2-line-ne", "scene2-point-e-right", "scene2-label-e-right",
                "scene2-highlight-nc", "scene2-highlight-np",
                "scene2-label-ne-pd", "scene2-label-nc-np",
                "scene2-reason-right", "scene2-arrow-right"
            ],
            3: ["scene2-bridge", "scene2-conclusion"]
        };

        function showElement(id) {
            var el = document.getElementById(id);
            if (el) { el.classList.add("visible"); el.style.display = ""; el.style.opacity = ""; }
        }
        function hideElement(id) {
            var el = document.getElementById(id);
            if (el) { el.classList.remove("visible"); }
        }

        function updateView() {
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === totalSteps);
            stepIndicator.textContent = "步骤 " + currentStep + "/" + totalSteps;
            for (var s = 1; s <= totalSteps; s++) {
                var ids = stepElements[s];
                if (s <= currentStep) {
                    for (var i = 0; i < ids.length; i++) showElement(ids[i]);
                } else {
                    for (var j = 0; j < ids.length; j++) hideElement(ids[j]);
                }
            }
        }

        prevBtn.addEventListener("click", function() { if (currentStep > 0) { currentStep--; updateView(); } });
        nextBtn.addEventListener("click", function() { if (currentStep < totalSteps) { currentStep++; updateView(); } });
        updateView();
    })();
    </script>
</body>
</html>
