<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rt△ABC 中以AC为直径的圆与斜边AB交点D的求解</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; display: block; }
        #scene1-controls {
            position: absolute; bottom: 10px; left: 0; right: 0;
            display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10;
        }
        .scene1-btn {
            padding: 8px 28px; font-size: 14px; border: none; border-radius: 6px;
            cursor: pointer; font-family: inherit; transition: background 0.2s;
        }
        .scene1-btn:disabled { cursor: default; }
        #scene1-btn-prev { background: #e0e0e0; color: #333; }
        #scene1-btn-prev:disabled { background: #bdbdbd; color: #888; }
        #scene1-btn-next { background: #1565c0; color: #fff; }
        #scene1-btn-next:disabled { background: #bdbdbd; color: #888; }
        #scene1-btn-prev:hover:not(:disabled) { background: #d0d0d0; }
        #scene1-btn-next:hover:not(:disabled) { background: #0d47a1; }
        #scene1-step-indicator { font-size: 14px; color: #333; min-width: 80px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <!-- STEP 3: Similar triangle fills (behind everything) -->
            <g id="scene1-step3" class="scene1-step-el">
                <polygon points="180,380 500,380 385,226" fill="#1565c0" fill-opacity="0.15"/>
                <polygon points="180,380 500,140 500,380" fill="#c62828" fill-opacity="0.15"/>
            </g>

            <!-- BASE: Circle with AC as diameter -->
            <circle cx="500" cy="260" r="120" stroke="#000" stroke-width="2" fill="none"/>

            <!-- BASE: Triangle ABC -->
            <line x1="180" y1="380" x2="500" y2="380" stroke="#000" stroke-width="2"/>
            <line x1="500" y1="140" x2="500" y2="380" stroke="#000" stroke-width="2"/>
            <line x1="180" y1="380" x2="500" y2="140" stroke="#000" stroke-width="2"/>

            <!-- STEP 3: Edge highlights -->
            <g id="scene1-step3-edges" class="scene1-step-el">
                <line x1="180" y1="380" x2="500" y2="380" stroke="#c62828" stroke-width="3"/>
                <line x1="180" y1="380" x2="385" y2="226" stroke="#c62828" stroke-width="3"/>
            </g>

            <!-- STEP 1: Auxiliary line CD + right angle at D -->
            <g id="scene1-step1" class="scene1-step-el">
                <line x1="500" y1="380" x2="385" y2="226" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5"/>
                <polyline points="397.2,217.8 405.2,229.8 393.2,237.8" stroke="#c62828" stroke-width="1.5" fill="none"/>
            </g>

            <!-- BASE: Right angle at C -->
            <polyline points="485,380 485,365 500,365" stroke="#000" stroke-width="1.5" fill="none"/>

            <!-- BASE: Points -->
            <circle cx="500" cy="140" r="4" fill="#000"/>
            <circle cx="180" cy="380" r="4" fill="#000"/>
            <circle cx="500" cy="380" r="4" fill="#000"/>
            <circle cx="500" cy="260" r="4" fill="#000"/>
            <circle cx="385" cy="226" r="4" fill="#000"/>

            <!-- BASE: Vertex Labels -->
            <!-- A: above circle top (y=140), placed at y=115 -->
            <text x="500" y="115" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">A</text>
            <!-- B: left of B point -->
            <text x="155" y="395" font-size="16" font-weight="bold" fill="#000" text-anchor="end">B</text>
            <!-- C: right of C point -->
            <text x="520" y="395" font-size="16" font-weight="bold" fill="#000" text-anchor="start">C</text>
            <!-- D: above AB line, moved right to avoid overlap with AB=10cm label -->
            <text x="360" y="105" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">D</text>
            <!-- O: right of circle right edge (x=620), placed at x=635 -->
            <text x="635" y="265" font-size="16" font-weight="bold" fill="#000" text-anchor="start">O</text>

            <!-- BASE: Known conditions (all placed below BC line y=380) -->
            <text x="465" y="420" font-size="14" fill="#1565c0" text-anchor="end">AC = 6cm</text>
            <text x="340" y="420" font-size="14" fill="#1565c0" text-anchor="middle">BC = 8cm</text>

            <!-- STEP 2: AB = 10cm (above AB line) -->
            <g id="scene1-step2" class="scene1-step-el">
                <text x="280" y="135" font-size="14" fill="#1565c0" text-anchor="middle">AB = 10cm</text>
            </g>

            <!-- STEP 4: BD = 6.4cm (below BC line) -->
            <g id="scene1-step4" class="scene1-step-el">
                <text x="230" y="420" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">BD = 6.4cm</text>
            </g>

            <!-- FORMULA BOX (rect has data-bg="true" so detector skips it) -->
            <g id="scene1-formula-box">
                <rect x="560" y="45" width="210" height="50" rx="8" ry="8" fill="#fff" stroke="#1565c0" stroke-width="2" data-bg="true"/>
                <text id="scene1-formula-text" x="665" y="75" font-size="14" fill="#333" text-anchor="middle"></text>
            </g>
        </svg>

        <!-- CONTROLS -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/4</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        var currentStep = 0;
        var totalSteps = 4;

        var formulaTexts = [
            "",
            "直径所对圆周角 = 90°",
            "AB = √(6²+8²) = 10",
            "BC² = BD × AB",
            "BD = 64/10 = 6.4cm"
        ];

        var stepGroups = [
            document.getElementById("scene1-step1"),
            document.getElementById("scene1-step2"),
            document.getElementById("scene1-step3"),
            document.getElementById("scene1-step4")
        ];
        var step3Edges = document.getElementById("scene1-step3-edges");
        var formulaBox = document.getElementById("scene1-formula-box");
        var formulaText = document.getElementById("scene1-formula-text");
        var stepIndicator = document.getElementById("scene1-step-indicator");
        var btnPrev = document.getElementById("scene1-btn-prev");
        var btnNext = document.getElementById("scene1-btn-next");

        function setGroupVisible(group, visible) {
            if (!group) return;
            group.style.opacity = visible ? '1' : '0';
            group.style.visibility = visible ? 'visible' : 'hidden';
            var children = group.children;
            for (var i = 0; i < children.length; i++) {
                children[i].style.visibility = visible ? 'visible' : 'hidden';
            }
        }

        function updateStep() {
            for (var i = 0; i < totalSteps; i++) {
                setGroupVisible(stepGroups[i], (i + 1 <= currentStep));
            }
            setGroupVisible(step3Edges, (currentStep >= 3));

            if (currentStep > 0) {
                formulaBox.style.opacity = '1';
                formulaBox.style.visibility = 'visible';
                formulaText.textContent = formulaTexts[currentStep];
                var fbChildren = formulaBox.children;
                for (var j = 0; j < fbChildren.length; j++) {
                    fbChildren[j].style.visibility = 'visible';
                }
            } else {
                formulaBox.style.opacity = '0';
                formulaBox.style.visibility = 'hidden';
                formulaText.textContent = "";
                var fbChildren2 = formulaBox.children;
                for (var j = 0; j < fbChildren2.length; j++) {
                    fbChildren2[j].style.visibility = 'hidden';
                }
            }

            stepIndicator.textContent = "步骤 " + currentStep + "/4";
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps);
        }

        btnPrev.addEventListener("click", function() {
            if (currentStep > 0) { currentStep--; updateStep(); }
        });
        btnNext.addEventListener("click", function() {
            if (currentStep < totalSteps) { currentStep++; updateStep(); }
        });

        // Initialize: hide all step elements
        for (var k = 0; k < stepGroups.length; k++) {
            setGroupVisible(stepGroups[k], false);
        }
        setGroupVisible(step3Edges, false);
        formulaBox.style.opacity = '0';
        formulaBox.style.visibility = 'hidden';
        var initChildren = formulaBox.children;
        for (var j = 0; j < initChildren.length; j++) {
            initChildren[j].style.visibility = 'hidden';
        }

        updateStep();
    })();
    </script>
</body>
</html>
