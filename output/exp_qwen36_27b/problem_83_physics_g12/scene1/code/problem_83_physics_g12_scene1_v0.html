<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>子弹射入滑块并压缩弹簧 - 物理过程演示</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "SimHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; display: block; }
        #scene1-controls {
            position: absolute; bottom: 10px; left: 0; right: 0;
            display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10;
        }
        #scene1-controls button {
            padding: 6px 18px; font-size: 14px; border: 2px solid #1565c0; border-radius: 6px;
            background: #ffffff; color: #1565c0; cursor: pointer; font-family: inherit;
            transition: all 0.2s;
        }
        #scene1-controls button:hover:not(:disabled) { background: #1565c0; color: #ffffff; }
        #scene1-controls button:disabled { border-color: #cccccc; color: #cccccc; cursor: default; }
        #scene1-indicators { display: flex; gap: 8px; align-items: center; }
        .indicator-dot {
            width: 12px; height: 12px; border-radius: 50%; background: #cccccc;
            transition: background 0.3s;
        }
        .indicator-dot.active { background: #1565c0; }
        @keyframes blockPulse {
            0%, 100% { stroke-width: 2; }
            50% { stroke-width: 4; }
        }
        .block-highlight { animation: blockPulse 0.6s ease-in-out 3; }
        .step-transition { transition: all 0.5s ease-in-out; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <g id="scene1-ground">
                <line x1="50" y1="380" x2="750" y2="380" stroke="#000000" stroke-width="2"/>
                <g stroke="#cccccc" stroke-width="1">
                    <line x1="50" y1="380" x2="50" y2="420"/>
                    <line x1="70" y1="380" x2="50" y2="402"/>
                    <line x1="90" y1="380" x2="50" y2="420"/>
                    <line x1="110" y1="380" x2="70" y2="420"/>
                    <line x1="130" y1="380" x2="90" y2="420"/>
                    <line x1="150" y1="380" x2="110" y2="420"/>
                    <line x1="170" y1="380" x2="130" y2="420"/>
                    <line x1="190" y1="380" x2="150" y2="420"/>
                    <line x1="210" y1="380" x2="170" y2="420"/>
                    <line x1="230" y1="380" x2="190" y2="420"/>
                    <line x1="250" y1="380" x2="210" y2="420"/>
                    <line x1="270" y1="380" x2="230" y2="420"/>
                    <line x1="290" y1="380" x2="250" y2="420"/>
                    <line x1="310" y1="380" x2="270" y2="420"/>
                    <line x1="330" y1="380" x2="290" y2="420"/>
                    <line x1="350" y1="380" x2="310" y2="420"/>
                    <line x1="370" y1="380" x2="330" y2="420"/>
                    <line x1="390" y1="380" x2="350" y2="420"/>
                    <line x1="410" y1="380" x2="370" y2="420"/>
                    <line x1="430" y1="380" x2="390" y2="420"/>
                    <line x1="450" y1="380" x2="410" y2="420"/>
                    <line x1="470" y1="380" x2="430" y2="420"/>
                    <line x1="490" y1="380" x2="450" y2="420"/>
                    <line x1="510" y1="380" x2="470" y2="420"/>
                    <line x1="530" y1="380" x2="490" y2="420"/>
                    <line x1="550" y1="380" x2="510" y2="420"/>
                    <line x1="570" y1="380" x2="530" y2="420"/>
                    <line x1="590" y1="380" x2="550" y2="420"/>
                    <line x1="610" y1="380" x2="570" y2="420"/>
                    <line x1="630" y1="380" x2="590" y2="420"/>
                    <line x1="650" y1="380" x2="610" y2="420"/>
                    <line x1="670" y1="380" x2="630" y2="420"/>
                    <line x1="690" y1="380" x2="650" y2="420"/>
                    <line x1="710" y1="380" x2="670" y2="420"/>
                    <line x1="730" y1="380" x2="690" y2="420"/>
                    <line x1="750" y1="380" x2="710" y2="420"/>
                    <line x1="750" y1="380" x2="750" y2="420"/>
                </g>
                <text id="scene1-mu-label" x="620" y="435" font-size="14" fill="#000000" text-anchor="middle">μ=0.2</text>
            </g>
            <g id="scene1-cart">
                <circle cx="180" cy="360" r="20" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <circle cx="180" cy="360" r="4" fill="#000000"/>
                <circle cx="460" cy="360" r="20" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <circle cx="460" cy="360" r="4" fill="#000000"/>
                <rect x="120" y="280" width="400" height="80" fill="#e3f2fd" fill-opacity="0.3" stroke="#000000" stroke-width="2" rx="2"/>
                <rect x="120" y="220" width="20" height="60" fill="#e3f2fd" fill-opacity="0.5" stroke="#000000" stroke-width="2" rx="1"/>
                <text id="scene1-m-label" x="85" y="265" font-size="16" fill="#000000" text-anchor="middle" font-weight="bold">M=2kg</text>
            </g>
            <path id="scene1-spring" fill="none" stroke="#555555" stroke-width="2"/>
            <g id="scene1-block" class="step-transition">
                <rect id="scene1-block-rect" x="480" y="240" width="80" height="40" fill="#fff3e0" fill-opacity="0.3" stroke="#000000" stroke-width="2" rx="2"/>
                <text id="scene1-m-block-label" x="520" y="228" font-size="16" fill="#000000" text-anchor="middle" font-weight="bold">m=1.8kg</text>
            </g>
            <g id="scene1-bullet" class="step-transition">
                <ellipse cx="665" cy="260" rx="15" ry="6" fill="#000000"/>
                <text id="scene1-m0-label" x="665" y="240" font-size="14" fill="#000000" text-anchor="middle">m₀=0.2kg</text>
            </g>
            <g id="scene1-v1" class="step-transition">
                <line x1="250" y1="200" x2="345" y2="200" stroke="#1565c0" stroke-width="2"/>
                <polygon points="345,194 355,200 345,206" fill="#1565c0"/>
                <text x="300" y="190" font-size="14" fill="#1565c0" text-anchor="middle" font-weight="bold">v₁=10m/s</text>
            </g>
            <g id="scene1-v0" class="step-transition">
                <line x1="650" y1="200" x2="555" y2="200" stroke="#c62828" stroke-width="2"/>
                <polygon points="555,194 545,200 555,206" fill="#c62828"/>
                <text x="600" y="190" font-size="14" fill="#c62828" text-anchor="middle" font-weight="bold">v₀=50m/s</text>
            </g>
            <g id="scene1-v2" class="step-transition" style="display:none; opacity:0;">
                <line x1="490" y1="200" x2="535" y2="200" stroke="#1565c0" stroke-width="2"/>
                <polygon points="535,194 545,200 535,206" fill="#1565c0"/>
                <text x="515" y="190" font-size="14" fill="#1565c0" text-anchor="middle" font-weight="bold">v₂=4m/s</text>
            </g>
            <g id="scene1-v3" class="step-transition" style="display:none; opacity:0;">
                <line x1="250" y1="200" x2="320" y2="200" stroke="#2e7d32" stroke-width="2"/>
                <polygon points="320,194 330,200 320,206" fill="#2e7d32"/>
                <text x="285" y="190" font-size="14" fill="#2e7d32" text-anchor="middle" font-weight="bold">v₃=7m/s</text>
            </g>
            <g id="scene1-d-label" class="step-transition" style="display:none; opacity:0;">
                <line x1="140" y1="368" x2="430" y2="368" stroke="#888888" stroke-width="1.5"/>
                <polygon points="140,364 134,368 140,372" fill="#888888"/>
                <polygon points="430,364 436,368 430,372" fill="#888888"/>
                <line x1="140" y1="363" x2="140" y2="373" stroke="#888888" stroke-width="1"/>
                <line x1="430" y1="363" x2="430" y2="373" stroke="#888888" stroke-width="1"/>
                <text x="285" y="378" font-size="13" fill="#888888" text-anchor="middle" font-weight="bold">d=0.50m</text>
            </g>
            <g id="scene1-friction" class="step-transition" style="display:none; opacity:0;">
                <line x1="500" y1="368" x2="460" y2="368" stroke="#888888" stroke-width="1.5" stroke-dasharray="4,3"/>
                <polygon points="460,364 452,368 460,372" fill="#888888"/>
                <text x="480" y="378" font-size="12" fill="#888888" text-anchor="middle">f</text>
            </g>
            <text id="scene1-title" x="400" y="48" font-size="18" fill="#000000" text-anchor="middle" font-weight="bold">初始状态</text>
            <text id="scene1-subtitle" x="400" y="82" font-size="13" fill="#555555" text-anchor="middle">系统以 v₁=10m/s 向右匀速运动</text>
        </svg>
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <div id="scene1-indicators">
                <div class="indicator-dot active" id="scene1-indicator-0"></div>
                <div class="indicator-dot" id="scene1-indicator-1"></div>
                <div class="indicator-dot" id="scene1-indicator-2"></div>
                <div class="indicator-dot" id="scene1-indicator-3"></div>
            </div>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() { 'use strict';
        function show(el) { el.style.display = ''; el.style.opacity = '1'; }
        function hide(el) { el.style.display = 'none'; el.style.opacity = '0'; }
        function generateSpringPath(x1, y1, x2, y2, coils) {
            var len = x2 - x1, amplitude = 8, segments = coils * 2, segLen = len / segments;
            var d = 'M ' + x1 + ' ' + y1;
            for (var i = 0; i < segments; i++) {
                var cx = x1 + (i + 0.5) * segLen;
                var cy = (i % 2 === 0) ? y1 - amplitude : y1 + amplitude;
                d += ' L ' + cx + ' ' + cy;
            }
            d += ' L ' + x2 + ' ' + y2;
            return d;
        }
        var currentStep = 0, totalSteps = 4;
        var stepData = [
            { title: '初始状态', subtitle: '系统以 v₁=10m/s 向右匀速运动', blockX: 480, springEndX: 480, springCoils: 17, showBullet: true, showV1: true, showV0: true, showV2: false, showV3: false, showDLabel: false, showFriction: false, blockHighlight: false },
            { title: '子弹射入瞬间', subtitle: '子弹射入滑块，共同速度 v₂=4m/s 向右', blockX: 480, springEndX: 480, springCoils: 17, showBullet: false, showV1: true, showV0: false, showV2: true, showV3: false, showDLabel: false, showFriction: false, blockHighlight: true },
            { title: '弹簧压缩过程', subtitle: '滑块速度小于小车，弹簧逐渐压缩', blockX: 460, springEndX: 460, springCoils: 15, showBullet: false, showV1: true, showV0: false, showV2: true, showV3: false, showDLabel: false, showFriction: true, blockHighlight: false },
            { title: '弹簧压缩到最短', subtitle: '弹簧锁定，压缩量 d=0.50m，共同速度 v₃=7m/s', blockX: 430, springEndX: 430, springCoils: 12, showBullet: false, showV1: false, showV0: false, showV2: false, showV3: true, showDLabel: true, showFriction: true, blockHighlight: false }
        ];
        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var titleEl = document.getElementById('scene1-title');
        var subtitleEl = document.getElementById('scene1-subtitle');
        var blockRect = document.getElementById('scene1-block-rect');
        var blockLabel = document.getElementById('scene1-m-block-label');
        var springPath = document.getElementById('scene1-spring');
        var bulletGroup = document.getElementById('scene1-bullet');
        var v1Group = document.getElementById('scene1-v1');
        var v0Group = document.getElementById('scene1-v0');
        var v2Group = document.getElementById('scene1-v2');
        var v3Group = document.getElementById('scene1-v3');
        var dLabelGroup = document.getElementById('scene1-d-label');
        var frictionGroup = document.getElementById('scene1-friction');
        var indicators = [];
        for (var i = 0; i < 4; i++) indicators.push(document.getElementById('scene1-indicator-' + i));
        function renderStep(step) {
            var data = stepData[step];
            titleEl.textContent = data.title;
            subtitleEl.textContent = data.subtitle;
            blockRect.setAttribute('x', data.blockX);
            blockLabel.setAttribute('x', data.blockX + 40);
            springPath.setAttribute('d', generateSpringPath(140, 255, data.springEndX, 255, data.springCoils));
            if (data.showBullet) show(bulletGroup); else hide(bulletGroup);
            if (data.showV1) show(v1Group); else hide(v1Group);
            if (data.showV0) show(v0Group); else hide(v0Group);
            if (data.showV2) show(v2Group); else hide(v2Group);
            if (data.showV3) show(v3Group); else hide(v3Group);
            if (data.showDLabel) show(dLabelGroup); else hide(dLabelGroup);
            if (data.showFriction) show(frictionGroup); else hide(frictionGroup);
            if (data.blockHighlight) blockRect.classList.add('block-highlight');
            else blockRect.classList.remove('block-highlight');
            for (var i = 0; i < 4; i++) {
                if (i === step) indicators[i].classList.add('active');
                else indicators[i].classList.remove('active');
            }
            btnPrev.disabled = (step === 0);
            btnNext.disabled = (step === totalSteps - 1);
        }
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) { currentStep++; renderStep(currentStep); }
        });
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) { currentStep--; renderStep(currentStep); }
        });
        renderStep(0);
    })();
    </script>
</body>
</html>
