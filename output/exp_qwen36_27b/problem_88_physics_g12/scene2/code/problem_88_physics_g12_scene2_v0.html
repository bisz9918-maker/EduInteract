<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>等效电路分析与能量守恒关系</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "SimHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene2-controls button { padding: 6px 18px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; color: #333; }
        #scene2-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene2-controls button:disabled { opacity: 0.4; cursor: default; }
        #scene2-step-indicator { font-size: 14px; color: #555; min-width: 80px; text-align: center; }
        .calc-line { font-size: 13px; fill: #000; }
        .calc-title { font-size: 14px; font-weight: bold; fill: #000; }
        .highlight-bg { fill: #c62828; opacity: 0.1; rx: 3; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Arrow marker for current direction -->
                <marker id="scene2-arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                    <path d="M0,0 L8,3 L0,6 Z" fill="#2e7d32"/>
                </marker>
                <marker id="scene2-arrow-green-rev" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
                    <path d="M8,0 L0,3 L8,6 Z" fill="#2e7d32"/>
                </marker>
            </defs>

            <!-- Step Title -->
            <text id="scene2-step-title" x="400" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">步骤1/4：等效电路模型</text>

            <!-- ===== Circuit Diagram Group ===== -->
            <g id="scene2-circuit-group">
                <!-- Top wire: (120,80) to (320,80) -->
                <line x1="120" y1="80" x2="320" y2="80" stroke="#000" stroke-width="2"/>
                <!-- Bottom wire: (120,240) to (320,240) -->
                <line x1="120" y1="240" x2="320" y2="240" stroke="#000" stroke-width="2"/>
                <!-- Left wire upper: (120,80) to (120,130) -->
                <line x1="120" y1="80" x2="120" y2="130" stroke="#000" stroke-width="2"/>
                <!-- Left wire lower: (120,190) to (120,240) -->
                <line x1="120" y1="190" x2="120" y2="240" stroke="#000" stroke-width="2"/>
                <!-- Right wire upper: (320,80) to (320,130) -->
                <line x1="320" y1="80" x2="320" y2="130" stroke="#000" stroke-width="2"/>
                <!-- Right wire lower: (320,190) to (320,240) -->
                <line x1="320" y1="190" x2="320" y2="240" stroke="#000" stroke-width="2"/>

                <!-- Battery symbol (left side, y:130-190) -->
                <g id="scene2-battery">
                    <!-- Long line (positive) -->
                    <line x1="108" y1="148" x2="132" y2="148" stroke="#c62828" stroke-width="2.5"/>
                    <!-- Short line (negative) -->
                    <line x1="113" y1="162" x2="127" y2="162" stroke="#c62828" stroke-width="2.5"/>
                    <!-- + and - signs -->
                    <text x="100" y="145" font-size="12" fill="#c62828" font-weight="bold">+</text>
                    <text x="100" y="168" font-size="12" fill="#c62828" font-weight="bold">−</text>
                </g>

                <!-- Internal resistor (left bottom) -->
                <g id="scene2-internal-resistor">
                    <rect x="100" y="200" width="40" height="20" fill="none" stroke="#c62828" stroke-width="2" rx="2"/>
                    <text x="120" y="232" text-anchor="middle" font-size="12" fill="#c62828">r<sub>内</sub>=R/3</text>
                </g>

                <!-- External resistor (right side) -->
                <g id="scene2-external-resistor">
                    <rect x="300" y="130" width="40" height="60" fill="none" stroke="#1565c0" stroke-width="2" rx="2"/>
                    <text x="355" y="165" text-anchor="start" font-size="14" fill="#1565c0" font-weight="bold">R</text>
                </g>

                <!-- Current direction arrows -->
                <g id="scene2-current-arrows">
                    <!-- Top arrow (left to right) -->
                    <line x1="180" y1="80" x2="250" y2="80" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene2-arrow-green)"/>
                    <!-- Right arrow (top to bottom) -->
                    <line x1="320" y1="100" x2="320" y2="120" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene2-arrow-green)"/>
                    <!-- Bottom arrow (right to left) -->
                    <line x1="280" y1="240" x2="210" y2="240" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene2-arrow-green-rev)"/>
                    <!-- Left arrow (bottom to top) -->
                    <line x1="120" y1="185" x2="120" y2="165" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene2-arrow-green-rev)"/>
                </g>

                <!-- Labels -->
                <text id="scene2-label-e" x="70" y="155" text-anchor="middle" font-size="13" fill="#c62828">E=BLv<sub>0</sub>cosθ</text>
                <text id="scene2-label-i" x="220" y="68" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="bold">I</text>
            </g>

            <!-- Highlight overlay for external resistor (step 1) -->
            <g id="scene2-highlight-r" style="display:none; opacity:0;">
                <rect x="295" y="125" width="50" height="70" class="highlight-bg" rx="4"/>
            </g>

            <!-- ===== Calculation Text Box ===== -->
            <g id="scene2-calc-box">
                <rect x="400" y="50" width="320" height="230" fill="#ffffff" stroke="#000" stroke-width="1" rx="4"/>
                <g id="scene2-calc-text">
                    <!-- Dynamic content will be set by JS -->
                </g>
            </g>

            <!-- ===== Energy Conservation Diagram (Step 3 only) ===== -->
            <g id="scene2-energy-group" style="display:none; opacity:0;">
                <!-- Connection lines -->
                <line x1="220" y1="350" x2="350" y2="330" stroke="#888888" stroke-width="1.5"/>
                <line x1="220" y1="350" x2="350" y2="400" stroke="#888888" stroke-width="1.5"/>

                <!-- Root node: W_F -->
                <g id="scene2-energy-wf">
                    <rect x="100" y="320" width="120" height="60" fill="rgba(21,101,192,0.1)" stroke="#1565c0" stroke-width="2" rx="4"/>
                    <text x="160" y="355" text-anchor="middle" font-size="15" fill="#1565c0" font-weight="bold">W<sub>F</sub></text>
                </g>

                <!-- Branch node: mgr -->
                <g id="scene2-energy-mgr">
                    <rect x="350" y="300" width="120" height="60" fill="rgba(21,101,192,0.1)" stroke="#1565c0" stroke-width="2" rx="4"/>
                    <text x="410" y="335" text-anchor="middle" font-size="15" fill="#1565c0" font-weight="bold">mgr</text>
                </g>

                <!-- Branch node: Q_总 -->
                <g id="scene2-energy-qtotal">
                    <rect x="350" y="380" width="120" height="60" fill="rgba(21,101,192,0.1)" stroke="#1565c0" stroke-width="2" rx="4"/>
                    <text x="410" y="415" text-anchor="middle" font-size="15" fill="#1565c0" font-weight="bold">Q<sub>总</sub></text>
                </g>

                <!-- = and + signs -->
                <text x="285" y="335" text-anchor="middle" font-size="16" fill="#888" font-weight="bold">=</text>
                <text x="285" y="405" text-anchor="middle" font-size="16" fill="#888" font-weight="bold">+</text>
            </g>

            <!-- Highlight for key results (dynamic) -->
            <g id="scene2-highlight-result" style="display:none; opacity:0;">
                <!-- Will be positioned by JS -->
            </g>
        </svg>

        <!-- Controls -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 1/4</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() { 'use strict';

        var currentStep = 0;
        var totalSteps = 4;

        // DOM references
        var stepTitle = document.getElementById('scene2-step-title');
        var btnPrev = document.getElementById('scene2-btn-prev');
        var btnNext = document.getElementById('scene2-btn-next');
        var stepIndicator = document.getElementById('scene2-step-indicator');
        var calcText = document.getElementById('scene2-calc-text');
        var circuitGroup = document.getElementById('scene2-circuit-group');
        var energyGroup = document.getElementById('scene2-energy-group');
        var highlightR = document.getElementById('scene2-highlight-r');
        var highlightResult = document.getElementById('scene2-highlight-result');

        // Step data
        var stepData = [
            {
                title: '步骤1/4：等效电路模型',
                calcLines: [
                    { text: '等效电路分析', cls: 'calc-title', y: 72 },
                    { text: '', y: 88 },
                    { text: '金属棒切割磁感线产生电动势：', cls: 'calc-line', y: 108 },
                    { text: 'E = BLv₀cosθ', cls: 'calc-line', y: 128 },
                    { text: '', y: 144 },
                    { text: '等效电路：', cls: 'calc-line', y: 164 },
                    { text: '• 电源：金属棒（电动势E，内阻R/3）', cls: 'calc-line', y: 184 },
                    { text: '• 外电路：电阻R', cls: 'calc-line', y: 204 },
                    { text: '• 回路总电阻：R + R/3 = 4R/3', cls: 'calc-line', y: 224 },
                    { text: '', y: 240 },
                    { text: '电流方向：顺时针（由右手定则）', cls: 'calc-line', y: 260 },
                ],
                circuitOpacity: 1,
                showEnergy: false,
                highlightR: false,
                highlightResult: null
            },
            {
                title: '步骤2/4：路端电压计算',
                calcLines: [
                    { text: '第(1)问：cd两端电压', cls: 'calc-title', y: 72 },
                    { text: '', y: 88 },
                    { text: '回路总电阻：', cls: 'calc-line', y: 108 },
                    { text: 'R_总 = R + R/3 = 4R/3', cls: 'calc-line', y: 128 },
                    { text: '', y: 144 },
                    { text: '回路电流：', cls: 'calc-line', y: 164 },
                    { text: 'I = E / R_总 = 3E/(4R)', cls: 'calc-line', y: 184 },
                    { text: '', y: 200 },
                    { text: '路端电压（cd两端）：', cls: 'calc-line', y: 220 },
                    { text: 'U_cd = I × R = 3E/4', cls: 'calc-line', y: 240 },
                    { text: 'U_cd = 3BLv₀/4', cls: 'calc-line', y: 260, highlight: true },
                ],
                circuitOpacity: 1,
                showEnergy: false,
                highlightR: true,
                highlightResult: { text: 'U_cd = 3BLv₀/4', y: 256 }
            },
            {
                title: '步骤3/4：焦耳热积分计算',
                calcLines: [
                    { text: '第(2)问：R上产生的热量', cls: 'calc-title', y: 72 },
                    { text: '', y: 88 },
                    { text: '瞬时电动势：E = BLv₀cosθ', cls: 'calc-line', y: 108 },
                    { text: '瞬时电流：I = 3BLv₀cosθ/(4R)', cls: 'calc-line', y: 128 },
                    { text: '', y: 144 },
                    { text: 'R上瞬时功率：', cls: 'calc-line', y: 164 },
                    { text: 'P_R = I²R = 9B²L²v₀²cos²θ/(16R)', cls: 'calc-line', y: 184 },
                    { text: '', y: 200 },
                    { text: '时间元：dt = r·dθ/v₀', cls: 'calc-line', y: 220 },
                    { text: 'Q_R = ∫₀^{π/2} P_R · dt', cls: 'calc-line', y: 240 },
                    { text: 'Q_R = 9πB²L²v₀r/(64R)', cls: 'calc-line', y: 260, highlight: true },
                ],
                circuitOpacity: 1,
                showEnergy: false,
                highlightR: true,
                highlightResult: { text: 'Q_R = 9πB²L²v₀r/(64R)', y: 256 }
            },
            {
                title: '步骤4/4：能量守恒与拉力做功',
                calcLines: [
                    { text: '第(3)问：拉力做的功', cls: 'calc-title', y: 72 },
                    { text: '', y: 88 },
                    { text: '能量守恒：', cls: 'calc-line', y: 108 },
                    { text: 'W_F = mgr + Q_总', cls: 'calc-line', y: 128 },
                    { text: '', y: 144 },
                    { text: '总焦耳热：', cls: 'calc-line', y: 164 },
                    { text: 'Q_总 = Q_R × (4R/3)/R = 4Q_R/3', cls: 'calc-line', y: 184 },
                    { text: 'Q_总 = 3πB²L²v₀r/(16R)', cls: 'calc-line', y: 204 },
                    { text: '', y: 220 },
                    { text: '拉力做功：', cls: 'calc-line', y: 240 },
                    { text: 'W_F = mgr + 3πB²L²v₀r/(16R)', cls: 'calc-line', y: 260, highlight: true },
                ],
                circuitOpacity: 0.6,
                showEnergy: true,
                highlightR: false,
                highlightResult: { text: 'W_F = mgr + 3πB²L²v₀r/(16R)', y: 256 }
            }
        ];

        function show(el) {
            el.style.display = '';
            el.style.opacity = '1';
        }

        function hide(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        function renderCalcLines(lines) {
            calcText.innerHTML = '';
            lines.forEach(function(line) {
                var t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                t.setAttribute('x', '415');
                t.setAttribute('y', line.y);
                t.setAttribute('text-anchor', 'start');
                if (line.cls === 'calc-title') {
                    t.setAttribute('font-size', '14');
                    t.setAttribute('font-weight', 'bold');
                } else {
                    t.setAttribute('font-size', '13');
                }
                t.setAttribute('fill', '#000');
                t.textContent = line.text;
                calcText.appendChild(t);
            });
        }

        function renderHighlightResult(hr) {
            highlightResult.innerHTML = '';
            if (!hr) {
                hide(highlightResult);
                return;
            }
            // Background rect
            var bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            bg.setAttribute('x', '410');
            bg.setAttribute('y', hr.y - 14);
            bg.setAttribute('width', 310);
            bg.setAttribute('height', 20);
            bg.setAttribute('fill', '#c62828');
            bg.setAttribute('opacity', '0.1');
            bg.setAttribute('rx', '3');
            highlightResult.appendChild(bg);

            // Text
            var t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            t.setAttribute('x', '415');
            t.setAttribute('y', hr.y);
            t.setAttribute('text-anchor', 'start');
            t.setAttribute('font-size', '13');
            t.setAttribute('font-weight', 'bold');
            t.setAttribute('fill', '#c62828');
            t.textContent = hr.text;
            highlightResult.appendChild(t);
            show(highlightResult);
        }

        function updateStep() {
            var data = stepData[currentStep];

            // Update title
            stepTitle.textContent = data.title;

            // Update step indicator
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;

            // Update buttons
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);

            // Update circuit opacity
            circuitGroup.style.opacity = data.circuitOpacity;

            // Update calculation text
            renderCalcLines(data.calcLines);

            // Highlight external resistor
            if (data.highlightR) {
                show(highlightR);
            } else {
                hide(highlightR);
            }

            // Energy conservation diagram
            if (data.showEnergy) {
                show(energyGroup);
            } else {
                hide(energyGroup);
            }

            // Highlight result
            renderHighlightResult(data.highlightResult);
        }

        function nextStep() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStep();
            }
        }

        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        }

        // Event listeners
        btnNext.addEventListener('click', nextStep);
        btnPrev.addEventListener('click', prevStep);

        // Initial render
        updateStep();

    })();
    </script>
</body>
</html>
