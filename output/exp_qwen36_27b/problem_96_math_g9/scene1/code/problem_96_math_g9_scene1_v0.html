<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>正方体展开图的面关系分析</title>
<style>
body{margin:0;padding:0;background:#fff;font-family:"Microsoft YaHei",sans-serif}
#scene1-container{position:relative;width:800px;height:500px;background:#fff;margin:0 auto;overflow:hidden}
#scene1-svg{width:800px;height:500px;display:block}
#scene1-controls{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:16px;z-index:10}
#scene1-controls button{padding:8px 24px;border:1px solid #999;border-radius:6px;background:#e0e0e0;color:#333;font-size:14px;cursor:pointer;transition:background .2s;font-family:inherit}
#scene1-controls button:hover:not(:disabled){background:#bdbdbd}
#scene1-controls button:disabled{opacity:.4;cursor:not-allowed}
.scene1-fade{transition:opacity .35s ease}
</style>
</head>
<body>
<div id="scene1-container">
<svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
<defs>
<pattern id="scene1-hatch" patternUnits="userSpaceOnUse" width="6" height="6">
<path d="M-1,7 L7,-1" stroke="#333" stroke-width="1"/>
</pattern>
</defs>
<g id="scene1-base-faces">
<rect x="285" y="200" width="70" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
<rect x="355" y="200" width="70" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
<rect x="425" y="200" width="70" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
<rect x="495" y="200" width="70" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
<rect x="425" y="130" width="70" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
<rect x="355" y="270" width="70" height="70" fill="#fff" stroke="#000" stroke-width="2"/>
</g>
<g id="scene1-patterns">
<polygon points="285,200 355,200 285,270" fill="url(#scene1-hatch)" opacity=".45"/>
<polygon points="495,200 565,200 565,270" fill="url(#scene1-hatch)" opacity=".45"/>
<circle cx="460" cy="165" r="22" fill="none" stroke="#000" stroke-width="2"/>
</g>
<g id="scene1-fold-lines" stroke="#aaa" stroke-width="1" stroke-dasharray="4,4">
<line x1="355" y1="200" x2="355" y2="270"/>
<line x1="425" y1="200" x2="425" y2="270"/>
<line x1="495" y1="200" x2="495" y2="270"/>
<line x1="425" y1="130" x2="495" y2="130"/>
<line x1="355" y1="270" x2="425" y2="270"/>
</g>
<g id="scene1-step1-labels" class="scene1-fade" style="opacity:0;display:none">
<text x="320" y="252" text-anchor="middle" font-size="14" fill="#000">面1</text>
<text x="390" y="238" text-anchor="middle" font-size="14" fill="#000">面2</text>
<text x="460" y="238" text-anchor="middle" font-size="14" fill="#000">面3</text>
<text x="530" y="252" text-anchor="middle" font-size="14" fill="#000">面4</text>
<text x="460" y="198" text-anchor="middle" font-size="13" fill="#000">圆圈面</text>
<text x="390" y="308" text-anchor="middle" font-size="14" fill="#000">底面</text>
</g>
<g id="scene1-step2-opposite" class="scene1-fade" style="opacity:0;display:none">
<rect x="283" y="198" width="74" height="74" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="6,4"/>
<rect x="423" y="198" width="74" height="74" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="6,4"/>
<rect x="353" y="198" width="74" height="74" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="6,4"/>
<rect x="493" y="198" width="74" height="74" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="6,4"/>
<rect x="423" y="128" width="74" height="74" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6,4"/>
<rect x="353" y="268" width="74" height="74" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6,4"/>
</g>
<g id="scene1-step3-adjacent" class="scene1-fade" style="opacity:0;display:none">
<rect x="281" y="196" width="78" height="78" fill="none" stroke="#1565c0" stroke-width="3"/>
<rect x="351" y="196" width="78" height="78" fill="none" stroke="#1565c0" stroke-width="3"/>
<rect x="421" y="196" width="78" height="78" fill="none" stroke="#1565c0" stroke-width="3"/>
<rect x="491" y="196" width="78" height="78" fill="none" stroke="#1565c0" stroke-width="3"/>
</g>
<g id="scene1-step4-conclusion" class="scene1-fade" style="opacity:0;display:none">
<rect x="421" y="196" width="78" height="78" fill="none" stroke="#2e7d32" stroke-width="3"/>
<rect x="491" y="196" width="78" height="78" fill="none" stroke="#2e7d32" stroke-width="3"/>
</g>
<text id="scene1-hint" x="400" y="380" text-anchor="middle" font-size="13" fill="#333" class="scene1-fade" style="opacity:0;display:none"></text>
</svg>
<div id="scene1-controls">
<button id="scene1-btn-prev" disabled>◀ 上一步</button>
<button id="scene1-btn-next">下一步 ▶</button>
</div>
</div>
<script>
(function(){
'use strict';
var cs=0,ms=4;
var hints=['','已标注各面编号，观察图案分布','相对面：面1\u2194面3，面2\u2194面4，圆圈面\u2194底面','圆圈面与面1、面2、面3、面4均相邻','面3与面4相邻，且都与圆圈面相邻 \u2192 折叠后位置关系确定'];
function showEl(e){e.style.display='';e.offsetHeight;e.style.opacity='1';}
function hideEl(e){e.style.opacity='0';setTimeout(function(){if(e.style.opacity==='0')e.style.display='none';},350);}
function update(){
var s1=document.getElementById('scene1-step1-labels');
var s2=document.getElementById('scene1-step2-opposite');
var s3=document.getElementById('scene1-step3-adjacent');
var s4=document.getElementById('scene1-step4-conclusion');
var h=document.getElementById('scene1-hint');
var bp=document.getElementById('scene1-btn-prev');
var bn=document.getElementById('scene1-btn-next');
if(cs>=1)showEl(s1);else hideEl(s1);
if(cs>=2)showEl(s2);else hideEl(s2);
if(cs>=3)showEl(s3);else hideEl(s3);
if(cs>=4)showEl(s4);else hideEl(s4);
if(cs>=1){showEl(h);h.textContent=hints[cs];}else{hideEl(h);}
bp.disabled=(cs===0);bn.disabled=(cs===ms);
}
document.getElementById('scene1-btn-next').addEventListener('click',function(){if(cs<ms){cs++;update();}});
document.getElementById('scene1-btn-prev').addEventListener('click',function(){if(cs>0){cs--;update();}});
update();
})();
</script>
</body>
</html>
