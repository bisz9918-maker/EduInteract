<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆内接等腰三角形与直径性质</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; display: block; }

        /* Step groups: hidden by default, shown via JS */
        .scene1-step-group { display: none; }

        /* Button styles */
        .scene1-btn { cursor: pointer; }
        .scene1-btn:hover .scene1-btn-rect { filter: brightness(0.92); }
        .scene1-btn-disabled { opacity: 0.4; cursor: default; pointer-events: none; }
        .scene1-btn-disabled:hover .scene1-btn-rect { filter: none; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">

            <!-- ===== 基础图形（步骤0始终显示） ===== -->

            <!-- 圆O -->
            <circle id="scene1-circle" cx="380" cy="200" r="150" stroke="#000000" stroke-width="1.5" fill="none"/>

            <!-- 圆心O -->
            <circle id="scene1-point-o" cx="380" cy="200" r="3" fill="#000000"/>
            <text id="scene1-label-o" x="365" y="188" font-size="14" fill="#000000">O</text>

            <!-- 点A -->
            <circle id="scene1-point-a" cx="250" cy="275" r="3" fill="#000000"/>
            <text id="scene1-label-a" x="226" y="280" font-size="14" fill="#000000">A</text>

            <!-- 点B -->
            <circle id="scene1-point-b" cx="380" cy="350" r="3" fill="#000000"/>
            <text id="scene1-label-b" x="380" y="378" font-size="14" fill="#000000" text-anchor="middle">B</text>

            <!-- 点C -->
            <circle id="scene1-point-c" cx="510" cy="275" r="3" fill="#000000"/>
            <text id="scene1-label-c" x="534" y="280" font-size="14" fill="#000000">C</text>

            <!-- 点D -->
            <circle id="scene1-point-d" cx="510" cy="125" r="3" fill="#000000"/>
            <text id="scene1-label-d" x="534" y="118" font-size="14" fill="#000000">D</text>

            <!-- 六条线段 -->
            <line id="scene1-line-ab" x1="250" y1="275" x2="380" y2="350" stroke="#000000" stroke-width="1.5"/>
            <line id="scene1-line-bc" x1="380" y1="350" x2="510" y2="275" stroke="#000000" stroke-width="1.5"/>
            <line id="scene1-line-ac" x1="250" y1="275" x2="510" y2="275" stroke="#000000" stroke-width="1.5"/>
            <line id="scene1-line-ad" x1="250" y1="275" x2="510" y2="125" stroke="#000000" stroke-width="1.5"/>
            <line id="scene1-line-bd" x1="380" y1="350" x2="510" y2="125" stroke="#000000" stroke-width="1.5"/>
            <line id="scene1-line-cd" x1="510" y1="275" x2="510" y2="125" stroke="#000000" stroke-width="1.5"/>

            <!-- ===== 步骤1：等长标记 + ∠ABC=120° + AD=6 ===== -->
            <g id="scene1-step1-group" class="scene1-step-group">
                <!-- AB等长标记（两条平行短线，垂直于AB） -->
                <line x1="313" y1="316" x2="317" y2="309" stroke="#000000" stroke-width="1.5"/>
                <line x1="318.2" y1="319" x2="322.2" y2="312" stroke="#000000" stroke-width="1.5"/>
                <!-- BC等长标记（两条平行短线，垂直于BC） -->
                <line x1="447" y1="316" x2="443" y2="309" stroke="#000000" stroke-width="1.5"/>
                <line x1="452.2" y1="313" x2="448.2" y2="306" stroke="#000000" stroke-width="1.5"/>
                <!-- ∠ABC圆弧标注 -->
                <path d="M 358.35,337.5 A 25,25 0 0,0 401.65,337.5" stroke="#1565c0" stroke-width="1.5" fill="none"/>
                <!-- 120°文本 -->
                <text x="380" y="322" font-size="14" fill="#1565c0" text-anchor="middle">120°</text>
                <!-- AD=6文本 -->
                <text x="395" y="215" font-size="14" fill="#1565c0">AD=6</text>
            </g>

            <!-- ===== 步骤2：∠BAC=30° + ∠BCA=30° ===== -->
            <g id="scene1-step2-group" class="scene1-step-group">
                <!-- ∠BAC圆弧标注 -->
                <path d="M 270,275 A 20,20 0 0,1 267.32,285" stroke="#2e7d32" stroke-width="1.5" fill="none"/>
                <text x="272" y="262" font-size="14" fill="#2e7d32">30°</text>
                <!-- ∠BCA圆弧标注 -->
                <path d="M 492.68,285 A 20,20 0 0,0 490,275" stroke="#2e7d32" stroke-width="1.5" fill="none"/>
                <text x="488" y="262" font-size="14" fill="#2e7d32" text-anchor="end">30°</text>
            </g>

            <!-- ===== 步骤3：∠ABD=90°直角符号 + BD加粗 ===== -->
            <g id="scene1-step3-group" class="scene1-step-group">
                <!-- BD加粗（红色2.5px） -->
                <line x1="380" y1="350" x2="510" y2="125" stroke="#c62828" stroke-width="2.5"/>
                <!-- 直角符号（小L形） -->
                <polyline points="367.01,342.5 374.51,329.51 387.5,337.01" stroke="#c62828" stroke-width="1.5" fill="none"/>
                <!-- 90°文本（移到更左上方，远离120°） -->
                <text x="325" y="290" font-size="14" fill="#c62828">90°</text>
            </g>

            <!-- ===== 步骤4：弧AB高亮 + ∠ADB=30° ===== -->
            <g id="scene1-step4-group" class="scene1-step-group">
                <!-- 弧AB绿色虚线高亮 -->
                <path d="M 250,275 A 150,150 0 0,1 380,350" stroke="#2e7d32" stroke-width="2" fill="none" stroke-dasharray="6,4"/>
                <!-- ∠ADB圆弧标注 -->
                <path d="M 492.68,135 A 20,20 0 0,1 500,142.32" stroke="#2e7d32" stroke-width="1.5" fill="none"/>
                <text x="488" y="142" font-size="14" fill="#2e7d32" text-anchor="end">30°</text>
            </g>

            <!-- ===== 步骤5：Rt△ABD高亮 + AB=3 ===== -->
            <g id="scene1-step5-group" class="scene1-step-group">
                <!-- △ABD红色半透明填充+边框 -->
                <polygon points="250,275 380,350 510,125" fill="rgba(198,40,40,0.1)" stroke="#c62828" stroke-width="2.5"/>
                <!-- AB=3文本 -->
                <text x="295" y="342" font-size="16" fill="#c62828" font-weight="bold">AB=3</text>
            </g>

            <!-- ===== 文字提示区 ===== -->
            <text id="scene1-hint-text" x="400" y="415" font-size="14" fill="#333333" text-anchor="middle">已知：△ABC内接于⊙O，AB=BC，∠ABC=120°，AD为直径，AD=6</text>

            <!-- ===== 导航按钮 ===== -->
            <!-- 上一步按钮 -->
            <g id="scene1-btn-prev" class="scene1-btn scene1-btn-disabled">
                <rect class="scene1-btn-rect" x="30" y="452" width="160" height="30" rx="5" ry="5" fill="#cccccc" stroke="#999999" stroke-width="1"/>
                <text x="110" y="471" font-size="14" fill="#666666" text-anchor="middle" pointer-events="none">◀ 上一步</text>
            </g>

            <!-- 步骤指示器 -->
            <text id="scene1-step-indicator" x="400" y="470" font-size="14" fill="#333333" text-anchor="middle">0/5</text>

            <!-- 下一步按钮 -->
            <g id="scene1-btn-next" class="scene1-btn">
                <rect class="scene1-btn-rect" x="610" y="452" width="160" height="30" rx="5" ry="5" fill="#1565c0" stroke="#0d47a1" stroke-width="1"/>
                <text x="690" y="471" font-size="14" fill="#ffffff" text-anchor="middle" pointer-events="none">下一步 ▶</text>
            </g>

        </svg>
    </div>

    <script>
    (function() {
        // ===== 布局坐标表（对照spec.json） =====
        // 圆中心O：(380,200)，半径r=150
        // 点A(250,275) 点B(380,350) 点C(510,275) 点D(510,125)
        // 标签：O(365,188) A(226,280) B(380,378) C(534,280) D(534,118)
        // 120°(380,322) AD=6(395,215) 30°(A)(272,262) 30°(C)(488,262)
        // 90°(325,290) 30°(D)(488,142) AB=3(295,342)

        var currentStep = 0;
        var totalSteps = 5;

        var hints = [
            "已知：△ABC内接于⊙O，AB=BC，∠ABC=120°，AD为直径，AD=6",
            "已知：AB=BC，∠ABC=120°，AD=6",
            "∵AB=BC，∴∠BAC=∠BCA=(180°-120°)/2=30°",
            "∵AD为直径，∴∠ABD=90°（直径所对圆周角为直角）",
            "∵∠ADB与∠ACB同对弧AB，∴∠ADB=∠ACB=30°",
            "在Rt△ABD中，∠ADB=30°，AD=6，∴AB=AD×sin30°=6×1/2=3"
        ];

        function renderStep(step) {
            // 更新文字提示
            document.getElementById('scene1-hint-text').textContent = hints[step];

            // 更新步骤指示器
            document.getElementById('scene1-step-indicator').textContent = step + '/5';

            // 控制各步骤组的显隐（使用 display: none/block）
            for (var i = 1; i <= totalSteps; i++) {
                var group = document.getElementById('scene1-step' + i + '-group');
                if (i <= step) {
                    group.style.display = 'block';
                } else {
                    group.style.display = 'none';
                }
            }

            // 更新按钮状态
            var prevBtn = document.getElementById('scene1-btn-prev');
            var nextBtn = document.getElementById('scene1-btn-next');

            if (step === 0) {
                prevBtn.classList.add('scene1-btn-disabled');
            } else {
                prevBtn.classList.remove('scene1-btn-disabled');
            }

            if (step === totalSteps) {
                nextBtn.classList.add('scene1-btn-disabled');
            } else {
                nextBtn.classList.remove('scene1-btn-disabled');
            }
        }

        // 上一步按钮事件
        document.getElementById('scene1-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
            }
        });

        // 下一步按钮事件
        document.getElementById('scene1-btn-next').addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                renderStep(currentStep);
            }
        });

        // 初始渲染（步骤0）
        renderStep(0);
    })();
    </script>
</body>
</html>
