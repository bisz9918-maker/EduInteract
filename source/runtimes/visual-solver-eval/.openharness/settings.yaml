default_agent: screenshot-capture

models:
  screenshot-capture:
    ref: platform/kimi-k26
    temperature: 0.1
    top_p: 0.7
  problem-alignment-eval:
    ref: platform/kimi-k26
    temperature: 0.1
    top_p: 0.7
  interactive-functionality-eval:
    ref: platform/kimi-k26
    temperature: 0.3
    top_p: 0.9
  visual-quality-eval:
    ref: platform/kimi-k26
    temperature: 0.1
    top_p: 0.7
  pedagogical-effectiveness-eval:
    ref: platform/kimi-k26
    temperature: 0.1
    top_p: 0.7
  logic-coherence-eval:
    ref: platform/kimi-k26
    temperature: 0.1
    top_p: 0.7

system_prompt:
  base:
    inline: |-
      你是一位教育图示评测专家，负责评估 HTML 教学图示的质量。
      你将读取 workspace 中的规格文件和已采集的截图，分析图示质量，并输出结构化评分报告。
      默认中文输出（数学公式和代码标识符除外）。
      不要询问额外信息，根据提供的文件直接进行评测。

  llm_optimized:
    providers:
      openai:
        inline: |-
          Evaluate HTML educational diagrams. Read spec files and captured screenshots, analyze results, write structured score report. Do not ask for clarification.
      openai-compatible:
        inline: |-
          Evaluate HTML educational diagrams. Read spec files and captured screenshots, analyze results, write structured score report. Do not ask for clarification.

  compose:
    order:
      - base
      - llm_optimized
      - agent
    include_environment: false
