<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教师备课助手</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>
<script>
window.MathJax = {
  tex: { inlineMath: [['$','$'],['\\(','\\)']], displayMath: [['$$','$$'],['\\[','\\]']] },
  startup: { typeset: false }
};
</script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: "PingFang SC","Microsoft YaHei",sans-serif; background:#f5f7fa; height:100vh; overflow:hidden; display:flex; flex-direction:column; }

/* 顶栏 */
.topbar { background:#1a237e; color:#fff; padding:10px 24px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.topbar h1 { font-size:18px; font-weight:600; }
.topbar .status { font-size:13px; opacity:.85; max-width:50%; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* 主体 */
.main { display:flex; flex:1; overflow:hidden; }

/* 左栏 */
.left { width:38%; min-width:320px; display:flex; flex-direction:column; border-right:1px solid #e0e0e0; background:#fff; position:relative; }

/* 题目区 */
.problem-section { padding:16px; flex-shrink:0; border-bottom:1px solid #eee; }
.problem-section label { font-size:13px; font-weight:600; color:#1a237e; margin-bottom:6px; display:block; }
.problem-rendered { background:#f9f9fb; border:1px solid #e0e0e0; border-radius:6px; padding:10px; margin-bottom:10px; min-height:40px; max-height:120px; overflow-y:auto; font-size:14px; line-height:1.6; display:none; }
.problem-rendered.has-content { display:block; }
textarea#problemInput { width:100%; height:80px; border:1px solid #d0d0d0; border-radius:6px; padding:8px 10px; font-size:14px; resize:vertical; font-family:inherit; }
textarea#problemInput:focus { outline:none; border-color:#1565c0; box-shadow:0 0 0 2px rgba(21,101,192,.15); }
.problem-actions { display:flex; gap:8px; margin-top:8px; }
.btn { padding:7px 16px; border:none; border-radius:6px; font-size:13px; cursor:pointer; display:inline-flex; align-items:center; gap:5px; transition:background .2s; }
.btn-primary { background:#1565c0; color:#fff; }
.btn-primary:hover { background:#1256a8; }
.btn-primary:disabled { background:#90a4ae; cursor:not-allowed; }
.btn-secondary { background:#e8eaf6; color:#1a237e; }
.btn-secondary:hover { background:#c5cae9; }
input#imageUpload { display:none; }

/* 解析区 */
.analysis-section { flex:1; overflow-y:auto; padding:16px; }
.analysis-section:empty::after { content:"解析内容将在生成完成后显示"; color:#aaa; font-size:13px; }
.analysis-block { margin-bottom:16px; }
.analysis-block h4 { font-size:13px; color:#1a237e; margin-bottom:6px; display:flex; align-items:center; gap:6px; }
.analysis-block .content { font-size:14px; line-height:1.8; color:#333; }
.analysis-block .content p { margin-bottom:8px; }
.tts-btn { background:none; border:none; cursor:pointer; font-size:16px; padding:2px; opacity:.6; transition:opacity .2s; }
.tts-btn:hover { opacity:1; }
.tts-btn.playing { opacity:1; color:#1565c0; }

/* 底部栏（头像 + 输入） */
.bottom-bar { flex-shrink:0; border-top:1px solid #eee; display:flex; align-items:center; padding:10px 16px; gap:10px; background:#fafafa; }
.avatar-btn { width:40px; height:40px; border-radius:50%; background:#1a237e; color:#fff; border:none; cursor:pointer; font-size:18px; flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:box-shadow .2s; }
.avatar-btn:hover { box-shadow:0 0 0 3px rgba(26,35,126,.25); }
.chat-input-wrap { flex:1; display:flex; gap:8px; align-items:center; }
.chat-input-wrap input { flex:1; border:1px solid #d0d0d0; border-radius:20px; padding:8px 14px; font-size:13px; font-family:inherit; }
.chat-input-wrap input:focus { outline:none; border-color:#1565c0; }
.mic-btn { width:36px; height:36px; border-radius:50%; background:#e8eaf6; border:none; cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; }
.mic-btn.recording { background:#ef5350; color:#fff; animation:pulse 1s infinite; }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
.send-btn { width:36px; height:36px; border-radius:50%; background:#1565c0; color:#fff; border:none; cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; }
.send-btn:hover { background:#1256a8; }

/* 右栏 */
.right { flex:1; display:flex; flex-direction:column; background:#f5f7fa; }
.scene-tabs { display:flex; gap:4px; padding:10px 16px 0; flex-shrink:0; flex-wrap:wrap; min-height:42px; align-items:center; }
.scene-tabs .tab { padding:6px 16px; border:1px solid #d0d0d0; border-bottom:none; border-radius:6px 6px 0 0; background:#fff; cursor:pointer; font-size:13px; color:#555; transition:all .15s; }
.scene-tabs .tab.active { background:#1565c0; color:#fff; border-color:#1565c0; }
.scene-tabs:empty::after { content:"生成图示后此处显示场景标签"; color:#aaa; font-size:13px; padding:6px; }
.scene-frame-wrap { flex:1; padding:0 16px 16px; }
.scene-frame-wrap iframe { width:100%; height:100%; border:1px solid #e0e0e0; border-radius:0 0 6px 6px; background:#fff; }
.placeholder { flex:1; display:flex; align-items:center; justify-content:center; color:#bbb; font-size:14px; }

/* 对话浮层 */
.chat-overlay { display:none; position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.3); z-index:100; }
.chat-overlay.open { display:flex; }
.chat-panel { background:#fff; width:100%; height:100%; display:flex; flex-direction:column; border-radius:0; }
.chat-header { padding:12px 16px; border-bottom:1px solid #eee; display:flex; align-items:center; justify-content:space-between; }
.chat-header h3 { font-size:15px; color:#1a237e; }
.chat-close { background:none; border:none; font-size:20px; cursor:pointer; color:#999; }
.chat-messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
.chat-bubble { max-width:85%; padding:10px 14px; border-radius:12px; font-size:13px; line-height:1.7; word-break:break-word; }
.chat-bubble.user { align-self:flex-end; background:#1565c0; color:#fff; border-bottom-right-radius:4px; }
.chat-bubble.assistant { align-self:flex-start; background:#f0f0f0; color:#333; border-bottom-left-radius:4px; }
.chat-bubble.assistant .content p { margin-bottom:6px; }
.chat-input-bar { padding:10px 16px; border-top:1px solid #eee; display:flex; gap:8px; align-items:center; }
.chat-input-bar input { flex:1; border:1px solid #d0d0d0; border-radius:20px; padding:8px 14px; font-size:13px; }
.chat-input-bar input:focus { outline:none; border-color:#1565c0; }
</style>
</head>
<body>

<!-- 顶栏 -->
<div class="topbar">
  <h1>教师备课助手</h1>
  <div class="status" id="globalStatus">就绪</div>
</div>

<!-- 主体 -->
<div class="main">
  <!-- 左栏 -->
  <div class="left">
    <!-- 题目区 -->
    <div class="problem-section">
      <label>题目输入</label>
      <div class="problem-rendered" id="problemRendered"></div>
      <textarea id="problemInput" placeholder="请输入题目文字，或粘贴/上传题目图片..."></textarea>
      <div class="problem-actions">
        <label class="btn btn-secondary" for="imageUpload">📷 上传图片</label>
        <input type="file" id="imageUpload" accept="image/*">
        <button class="btn btn-primary" id="generateBtn" onclick="startGenerate()">生成图示</button>
      </div>
    </div>

    <!-- 解析区 -->
    <div class="analysis-section" id="analysisSection"></div>

    <!-- 底部 -->
    <div class="bottom-bar">
      <button class="avatar-btn" onclick="toggleChat()" title="打开对话">🧑‍🏫</button>
      <div class="chat-input-wrap">
        <input type="text" id="quickChatInput" placeholder="输入问题..." onkeydown="if(event.key==='Enter')sendQuickChat()">
        <button class="mic-btn" id="micBtn" onmousedown="startRecord()" onmouseup="stopRecord()" ontouchstart="startRecord()" ontouchend="stopRecord()" title="按住说话">🎤</button>
        <button class="send-btn" onclick="sendQuickChat()" title="发送">➤</button>
      </div>
    </div>

    <!-- 对话浮层 -->
    <div class="chat-overlay" id="chatOverlay">
      <div class="chat-panel">
        <div class="chat-header">
          <h3>备课对话</h3>
          <button class="chat-close" onclick="toggleChat()">✕</button>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-bar">
          <input type="text" id="chatInput" placeholder="输入问题..." onkeydown="if(event.key==='Enter')sendChatMessage()">
          <button class="mic-btn" id="micBtn2" onmousedown="startRecord()" onmouseup="stopRecord()" ontouchstart="startRecord()" ontouchend="stopRecord()">🎤</button>
          <button class="send-btn" onclick="sendChatMessage()">➤</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 右栏 -->
  <div class="right">
    <div class="scene-tabs" id="sceneTabs"></div>
    <div class="scene-frame-wrap" id="sceneFrameWrap" style="display:none;">
      <iframe id="sceneFrame" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>
    <div class="placeholder" id="rightPlaceholder">请输入题目并点击"生成图示"</div>
  </div>
</div>

<script>
// ── 状态 ──────────────────────────────────────────────────────────────────────
let currentJobId = null;
let scenes = [];
let texts = [];
let activeScene = -1;
let chatHistory = [];
let mediaRecorder = null;
let audioChunks = [];
let currentAudio = null;

const $ = id => document.getElementById(id);

// ── 题目渲染 ──────────────────────────────────────────────────────────────────
$('problemInput').addEventListener('input', function() {
  renderProblem(this.value);
});

function renderProblem(text) {
  const el = $('problemRendered');
  if (!text.trim()) { el.classList.remove('has-content'); return; }
  el.classList.add('has-content');
  el.innerHTML = marked.parse(text);
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([el]);
}

// ── 图片上传 / 粘贴 → OCR ───────────────────────────────────────────────────
$('imageUpload').addEventListener('change', async function() {
  if (!this.files[0]) return;
  await ocrFile(this.files[0]);
  this.value = '';
});

// 全局粘贴：优先从 files 取图片，fallback 到 items
document.addEventListener('paste', async function(e) {
  const cd = e.clipboardData;
  if (!cd) return;

  // 方式1：clipboardData.files（Chrome / Edge 等）
  if (cd.files && cd.files.length) {
    for (const f of cd.files) {
      if (f.type.startsWith('image/')) {
        e.preventDefault();
        await ocrFile(f);
        return;
      }
    }
  }

  // 方式2：clipboardData.items（Firefox 等）
  if (cd.items) {
    for (const item of cd.items) {
      if (item.type.startsWith('image/')) {
        e.preventDefault();
        const file = item.getAsFile();
        if (file) await ocrFile(file);
        return;
      }
    }
  }
});

async function ocrFile(file) {
  setStatus('正在识别图片…');
  const b64 = await fileToBase64(file);
  try {
    const resp = await fetch('/api/ocr', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({image: b64})
    });
    const data = await resp.json();
    if (data.error) { setStatus('OCR 失败: ' + data.error); return; }
    $('problemInput').value = data.text;
    renderProblem(data.text);
    setStatus('识别完成');
  } catch(e) {
    setStatus('OCR 请求失败');
  }
}

function fileToBase64(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.readAsDataURL(file);
  });
}

// ── 生成图示 ──────────────────────────────────────────────────────────────────
async function startGenerate() {
  const desc = $('problemInput').value.trim();
  if (!desc) return;

  $('generateBtn').disabled = true;
  $('analysisSection').innerHTML = '';
  $('sceneTabs').innerHTML = '';
  $('sceneFrameWrap').style.display = 'none';
  $('rightPlaceholder').style.display = 'flex';
  $('rightPlaceholder').textContent = '正在生成中…';
  scenes = []; texts = []; activeScene = -1;
  setStatus('正在提交任务…');

  try {
    const resp = await fetch('/api/generate', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({description: desc})
    });
    const data = await resp.json();
    if (data.error) { setStatus('错误: ' + data.error); $('generateBtn').disabled = false; return; }
    currentJobId = data.job_id;
    listenSSE(data.job_id);
  } catch(e) {
    setStatus('请求失败'); $('generateBtn').disabled = false;
  }
}

function listenSSE(jobId) {
  const es = new EventSource('/api/stream/' + jobId);
  es.onmessage = function(e) {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }

    if (msg.type === 'progress') {
      setStatus(msg.message);
    } else if (msg.type === 'scene_ready') {
      addScene(msg.scene, msg.url);
    } else if (msg.type === 'done') {
      // 更新完整 scenes 和 texts
      if (msg.scenes && msg.scenes.length) {
        scenes = []; $('sceneTabs').innerHTML = '';
        msg.scenes.forEach((s, i) => addScene(i + 1, s.url));
      }
      if (msg.texts) {
        texts = msg.texts;
        renderAnalysis(texts);
      }
      setStatus('生成完成');
      $('generateBtn').disabled = false;
      es.close();
    } else if (msg.type === 'error') {
      setStatus('错误: ' + msg.message);
      $('generateBtn').disabled = false;
      es.close();
    }
  };
  es.onerror = function() {
    setStatus('连接中断');
    $('generateBtn').disabled = false;
    es.close();
  };
}

// ── Scene 标签 / iframe ───────────────────────────────────────────────────────
function addScene(num, url) {
  // 去重
  if (scenes.find(s => s.num === num)) return;
  scenes.push({num, url});
  scenes.sort((a, b) => a.num - b.num);

  // 重建标签
  $('sceneTabs').innerHTML = '';
  scenes.forEach(s => {
    const tab = document.createElement('div');
    tab.className = 'tab' + (s.num === activeScene ? ' active' : '');
    tab.textContent = 'Scene ' + s.num;
    tab.onclick = () => selectScene(s.num);
    $('sceneTabs').appendChild(tab);
  });

  // 如果是第一个 scene，自动选中
  if (activeScene < 0) selectScene(num);
}

function selectScene(num) {
  activeScene = num;
  const s = scenes.find(x => x.num === num);
  if (!s) return;

  // 更新标签样式
  Array.from($('sceneTabs').children).forEach(tab => {
    tab.classList.toggle('active', tab.textContent === 'Scene ' + num);
  });

  $('rightPlaceholder').style.display = 'none';
  $('sceneFrameWrap').style.display = 'flex';
  $('sceneFrameWrap').style.flex = '1';
  $('sceneFrame').src = s.url;
}

// ── 解析区 ────────────────────────────────────────────────────────────────────
function renderAnalysis(texts) {
  const container = $('analysisSection');
  container.innerHTML = '';
  texts.forEach((t, i) => {
    const block = document.createElement('div');
    block.className = 'analysis-block';
    block.innerHTML = `
      <h4>解析 ${i + 1} <button class="tts-btn" onclick="playTTS(${i})" title="朗读">🔊</button></h4>
      <div class="content">${marked.parse(t)}</div>
    `;
    container.appendChild(block);
  });
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([container]);
}

// ── TTS 朗读 ──────────────────────────────────────────────────────────────────
async function playTTS(index) {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  const text = texts[index];
  if (!text) return;

  // 标记按钮状态
  const btns = document.querySelectorAll('.tts-btn');
  btns.forEach(b => b.classList.remove('playing'));
  if (btns[index]) btns[index].classList.add('playing');

  try {
    const resp = await fetch('/api/tts', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({text})
    });
    if (!resp.ok) throw new Error('TTS 失败');
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    currentAudio = new Audio(url);
    currentAudio.onended = () => { if (btns[index]) btns[index].classList.remove('playing'); };
    currentAudio.play();
  } catch(e) {
    if (btns[index]) btns[index].classList.remove('playing');
  }
}

// ── 对话 ──────────────────────────────────────────────────────────────────────
function toggleChat() {
  $('chatOverlay').classList.toggle('open');
  if ($('chatOverlay').classList.contains('open')) $('chatInput').focus();
}

function sendQuickChat() {
  const input = $('quickChatInput');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  // 打开对话面板并发送
  if (!$('chatOverlay').classList.contains('open')) toggleChat();
  doChat(msg);
}

function sendChatMessage() {
  const input = $('chatInput');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  doChat(msg);
}

function doChat(message) {
  // 添加用户气泡
  appendBubble('user', message);
  chatHistory.push({role: 'user', content: message});

  // 创建 AI 气泡（流式填充）
  const bubble = appendBubble('assistant', '');
  const contentEl = bubble.querySelector('.content') || bubble;
  let fullText = '';

  fetch('/api/chat', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      description: $('problemInput').value,
      texts: texts,
      history: chatHistory.slice(0, -1), // 不含刚添加的 user
      message: message,
      current_scene: activeScene > 0 ? activeScene : 1
    })
  }).then(resp => {
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    function read() {
      reader.read().then(({done, value}) => {
        if (done) {
          chatHistory.push({role: 'assistant', content: fullText});
          // 自动朗读回复
          autoTTSReply(fullText);
          return;
        }
        buffer += decoder.decode(value, {stream: true});
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data:')) continue;
          const chunk = line.slice(5).trim();
          if (chunk === '[DONE]') continue;
          try {
            const j = JSON.parse(chunk);
            if (j.text) {
              fullText += j.text;
              contentEl.innerHTML = marked.parse(fullText);
              if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([contentEl]);
              scrollChat();
            }
          } catch {}
        }
        read();
      });
    }
    read();
  });
}

function appendBubble(role, text) {
  const container = $('chatMessages');
  const bubble = document.createElement('div');
  bubble.className = 'chat-bubble ' + role;
  if (role === 'assistant') {
    bubble.innerHTML = '<div class="content">' + (text ? marked.parse(text) : '') + '</div>';
  } else {
    bubble.textContent = text;
  }
  container.appendChild(bubble);
  scrollChat();
  return bubble;
}

function scrollChat() {
  const c = $('chatMessages');
  c.scrollTop = c.scrollHeight;
}

async function autoTTSReply(text) {
  try {
    const resp = await fetch('/api/tts', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({text})
    });
    if (!resp.ok) return;
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    new Audio(url).play();
  } catch {}
}

// ── 麦克风 ASR ────────────────────────────────────────────────────────────────
function startRecord() {
  audioChunks = [];
  navigator.mediaDevices.getUserMedia({audio: true}).then(stream => {
    mediaRecorder = new MediaRecorder(stream, {mimeType: 'audio/webm'});
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(audioChunks, {type: 'audio/webm'});
      document.querySelectorAll('.mic-btn').forEach(b => b.classList.remove('recording'));
      setStatus('正在识别语音…');
      try {
        const resp = await fetch('/api/asr', {
          method: 'POST',
          headers: {'Content-Type':'application/octet-stream'},
          body: blob
        });
        const data = await resp.json();
        if (data.text) {
          // 填入当前可见的输入框
          const target = $('chatOverlay').classList.contains('open') ? $('chatInput') : $('quickChatInput');
          target.value = data.text;
          target.focus();
          setStatus('识别完成');
        } else {
          setStatus('未识别到文字');
        }
      } catch {
        setStatus('ASR 请求失败');
      }
    };
    mediaRecorder.start();
    document.querySelectorAll('.mic-btn').forEach(b => b.classList.add('recording'));
  }).catch(() => setStatus('无法访问麦克风'));
}

function stopRecord() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
  }
}

// ── 工具函数 ──────────────────────────────────────────────────────────────────
function setStatus(msg) {
  $('globalStatus').textContent = msg;
}
</script>
</body>
</html>
