server:
  host: 127.0.0.1
  port: 8796

deployment:
  kind: oap
  runtime_mode: daemon
  display_name: OAP local daemon 10

storage:
  sqlite:
    project_db_location: shadow
    eviction:
      max_workspace_records: 1000
      max_open_handles: 500
      max_session_index_entries: 5000
      max_run_index_entries: 10000

sandbox:
  provider: embedded

paths:
  workspace_dir: ../oah_instance_10/workspaces
  runtime_state_dir: ../oah_instance_10/state
  runtime_dir: ../source/runtimes
  model_dir: ../source/models
  tool_dir: ../source/tools
  skill_dir: ../source/skills

workers:
  embedded:
    min_count: 1
    max_count: 2
    scale_interval_ms: 1000
    idle_ttl_ms: 30000
    scale_up_window: 1
    scale_down_window: 2
    cooldown_ms: 1000
    reserved_capacity_for_subagent: 1

llm:
  default_model: kimi-k26
